# Generated by `no-mistakes ci-workflow` from .no-mistakes.yaml - do not hand-edit;
# change commands.test / commands.lint there and regenerate.
# The generator's hardcoded actions/setup-go step is removed: this repo has no
# go.mod, so that step fails on a clean checkout. Node and python3 come
# preinstalled on ubuntu-latest; the commands install site deps themselves.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          cd site && npm ci && npm run check

      - name: Test
        run: |
          python3 scrape/validate.py && python3 site/scripts/test_data.py && cd site && npm ci && npm run check && npm run smoke
