    - {id: "1484516862879465614", author: Istrefi, era: post-1.18.1, agreement: single source, used_for: "post-1.18.1 end-of-line example: Heal R3 then Renew", cite: "[[d:priest#1484516862879465614]]"}
    - {id: "1484205771913826304", era: 1.18.1-announced-pre-release, agreement: consensus, used_for: "post-1.18.1 PoH 40 yd initial / 30 yd chain; increased-range talent optional", cite: "[[d:priest#1484205771913826304]]"}
