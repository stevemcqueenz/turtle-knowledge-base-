  valid_for_1181: true
  notes: "Rotation and stat priority hold. The 1.18.1 raid allocation is now the Discord-documented 14/37/0 (Spiritual Guidance cut to 1-2/5, points into Holy Reach + Reservoir of Light), not the pre-1.18.1 17/34/0 reconstruction. 1.18.1 removed Proclaim Champion (Ascendance capstone instead), added Book of Prayer, reworked Lightwell/Reservoir of Light/Prayer of Healing and raised Heal/Greater Heal/Flash Heal base values."
