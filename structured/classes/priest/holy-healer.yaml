  post_1181_mechanics:
  - Book of Prayer refunds 15/30% mana only when the previous heal was a DIFFERENT spell type (Heal vs Greater Heal), NOT
    a different rank of the same spell [[d:priest#1484561705487958016]].
  - Reservoir of Light 3/3 ~ 4000 healing per boss fight, better than 3% crit [[d:priest#1484570386963103745]].
  - 'Empowered Recovery: 1 point is enough (extra Renew tick); the 3% does not affect Renew itself [[d:priest#1484570397427892455]].'
  - Lightwell does NOT trigger from Prayer of Healing [[d:priest#1484247243883286711]].
  - 'Lightwell value contested: Snackz positive (great raid heal after bursts) vs tomscorer (10 charges / 5-min CD not worth
    3 points) [[d:priest#1484246385447403711]], [[d:priest#1484527718639861891]].'
  gear:
    pre_raid_substitutions: 'over the classic WoWhead priest-healing list: Cowl of Mivax, Robes of the Exalted, Boots of the
      Holy Mentor, Extremely Well Crafted Cuffs, Deepearth Signet, Consecrated Caduceus, Redemption staff [[d:priest#1388961040250703903]]'
    raid_bis: 3pc T2 (bracers/gloves/boots) + 4pc T3 (head/shoulders/chest/ring) + Grasp of the Old God + Empowered Leggings
      + Eye of the Dead/Rejuv/Breath + KT mace/Saph offhand/Raz wand; 'when you bring 10 healers just go 8T3 and spam flash'
      [[d:priest#1325212797596078254]], [[d:priest#1325215890974969968]]
    weapon: Staff of the Dreamer > Benediction / Rod of Resuscitation / AQ20 exalted (HolyScheiss) [[d:priest#1380839856040837210]]
    warning: Vanilla/classic pre-raid BiS lists are 'almost completely wrong for Turtle' (Turtle adds +hit to leveling gear,
      e.g. Robes of the Lich RFD +1% hit) [[d:priest#1324445705611378792]]; pre-raid farming is not worth over-investing because
      the server is fully progressed [[d:priest#1330954147075199027]], [[d:priest#1335954787279175690]]
    era: pre-1.18.1
    agreement: consensus
