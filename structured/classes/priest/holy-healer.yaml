stat_weights:
  priority: healing power (to ~1000) > spell crit > intellect > spirit > mp5 > stamina; cheap haste (food, juju) helps heals
    land; haste below the 1.5 s GCD is wasted
  healing_power: 1
  spell_crit: 2
  intellect: 3
  spirit: 4
  mp5: 5
  stamina: 6
  notes:
  - +30 Spirit food beats mp5 food (Spiritual Guidance + Meditation) [[d:priest#1486700633032626417]]
  - haste sources multiply; anything below 1.5 s GCD is wasted [[d:priest#1476373295271116850]], [[d:priest#1476377172339064873]]
  - ~1k healing power is enough for Flash/Renew/PoH play [[d:priest#1493919533281312859]]
  sources:
  - '[Langorn, 2025-09-19](https://forum.turtlecraft.gg/viewtopic.php?p=152325#p152325)'
  - '[[d:priest#1471624985767444500]]'
  era: post-1.18.1
  agreement: consensus
caps:
  spell_hit_pvp_pct: 3
  spell_hit_boss_pct: 16
  gcd_floor_s: 1.5
  note: no healing cap; PW:S = 942*(1+0.15 IPWS+0.2 FoW) + healing_power*0.35; Improved Renew/IPWS/FoW raise base values only
    [[d:priest#1427126126756630529]]
  coefficients: Renew 0.857 (1.12 with 5/5 Spiritual Healing), Heal 0.857, Greater Heal 1.0, Flash Heal 0.433, PoH 0.433,
    PW:S 0.35 [[d:priest#1465272044705939650]], [[d:priest#1476694995363823717]]
rotation_single:
- priority: 1
  action: 'Power Word: Shield'
  condition: target about to die and no time to cast; NOT on warrior/bear tanks except pre-pull or true emergency (~12 rage
    lost per 1k absorbed)
  source: '[[d:priest#1426238485303394435]]'
- priority: 2
  action: Flash Heal (rank 7)
  condition: tank taking heavy damage or anyone near 50% HP
  source: '[[d:priest#1493870884375629836]]'
- priority: 3
  action: Greater Heal (rank 1) precast
  condition: known big damage incoming (tank buster, enrage); with 8/8 T2 also for steady raid damage
  source: '[[d:priest#1492115676935229451]]'
- priority: 4
  action: Renew (max rank)
  condition: tank without Renew or <3 s left
  source: '[[d:priest#1492115676935229451]]'
- priority: 5
  action: Flash Heal (rank 1)
  condition: anyone missing a small amount of HP
  source: '[[d:priest#1493870884375629836]]'
- priority: 6
  action: Renew (rank 1)
  condition: weave between every other heal so the next cast is a different spell (Book of Prayer refund); on self if nobody
    needs it
  source: '[[d:priest#1492115676935229451]]'
- priority: 7
  action: cancel cast
  condition: precast heal on tank no longer needed at ~2/3 cast bar (preserve 5-second-rule regen)
  source: '[[d:priest#1490473551717728317]]'
- priority: 8
  action: stop casting
  condition: all targets at 80-90% HP (do not top to 100%)
  source: '[[d:priest#1428691896514908271]]'
assignment_priority:
  note: 'Discord''s assignment-based model: healing assignments beat raw HPS; ''the optimal way to heal is to get assignments
    in your guild'' [[d:priest#1428292872272089098]].'
  tank: keep Renew up; pre-heal with Greater Heal rank 1; Flash and max-rank Greater Heal as needed
  group: Renew on ticking fights; Shield to save/precast on casters for pushback; Greater Heal rank 1 to steady-heal; Flash
    if needed
  parse_max: snipe all heals with Flash Heal if your guild downs bosses before you run OOM
  sources:
  - '[[d:priest#1428292872272089098]]'
  era: 1.18.1-announced-pre-release
  agreement: consensus
rotation_aoe:
- targets_min: 3
  priority: 1
  action: Prayer of Healing rank 2 on a member of the damaged party (any party since 1.18.1)
  condition: 3+ in one party damaged
  source: '[[d:priest#1492115676935229451]], [[d:priest#1484217772614615302]]'
- targets_min: 3
  priority: 2
  action: Prayer of Healing rank 4 (Inner Focus if available)
  condition: party needs to be full fast
  source: '[[d:priest#1492115676935229451]]'
- targets_min: 3
  priority: 3
  action: Lightwell
  condition: repeated raid damage; place at cursor where raid stacks; 10 charges / 1 min; not triggered by PoH
  source: '[[d:priest#1464386661973622835]], [[d:priest#1464513512071233628]]'
- targets_min: 2
  priority: 4
  action: Renew each + Flash Heal the lower
  condition: 2 targets
aoe_threshold: 3
cooldowns:
- name: Ascendance
  use_when: 'just before boss enrage / burst window (30 s: -33% cost, +20% cast speed, +15% healing taken on targets); also
    to break CC'
  source: '[[d:priest#1492116211587088486]], [[d:priest#1464351944230436874]]'
- name: Inner Focus
  use_when: free max-rank Prayer of Healing or Greater Heal
- name: Lightwell
  use_when: before pull / burst phase (5 min); /cast Lightwell + CameraOrSelectOrMoveStart/Stop macro places it at cursor
  source: '[[d:priest#1487150323654197319]]'
- name: Fade
  use_when: on aggro; 1.18.1 -15% threat while active, threat returns
  source: '[[d:priest#1484604133200891944]]'
- name: Fear Ward
  use_when: tank before fear mechanics (baseline all races)
- name: Desperate Prayer
  use_when: Human/Dwarf self emergency (needs GCD, not while silenced)
  source: '[[d:priest#1425357263790407743]]'
- name: Avatar
  use_when: 'Dwarf: on tank for heavy physical/magic damage (5 min)'
resource_rules:
- Heal in bursts then stop casting to regen under the 5-second rule [[d:priest#1378653877729099889]]
- Precast big heals on the tank and cancel at ~2/3 if not needed [[d:priest#1490473551717728317]]
- Weave rank-1 Renew between heals for Book of Prayer refunds; do not warp play to chase them [[d:priest#1486824507040862208]]
- Major Mana Potion early in long fights; tea and Dark/Demonic Runes share a cooldown
- 'Downranking: mostly max ranks at endgame; if downranking, Heal R2+, Greater Heal R1+, Renew R3+ keep full scaling [[d:priest#1494888479052533902]]'
- 'Long Kara40 fights: swap in Pendant of Forgotten Names + Ring of Spiritual Fervor (+20% regen while casting) [[d:priest#1488477999262339093]]'
- Keep Fortitude, Divine Spirit, Shadow Protection up; avoid over-buffing melee/tanks near the 32 visible buff cap [[d:priest#1435581154953662527]]
consumables:
- Major Mana Potion (13444)
