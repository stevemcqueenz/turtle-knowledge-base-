        stat_notes: >
          Priority per Langorn (2025-09-19): Healing Power first ("every single spell scales on that"), then Spell Crit
          (150% heal crits, +25% target armor on a crit heal), then Intellect (mana pool + crit), then Spirit (healing
          power and mp5 via talents, mind the 5-second rule), then Mp5, with Stamina last. No numeric hit/haste cap
          applies to Holy healing; this is single-source (one guide, corroborated only by additive comments from
          Blubbsy/Haregijoe, not independent stat-priority confirmation).
