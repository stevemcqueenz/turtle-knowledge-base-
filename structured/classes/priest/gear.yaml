gaps:
  - "No source gives a complete slot-by-slot raid-tier (T1 through T3.5) BiS list for any Priest spec — only tier-set bonus text, a handful of isolated named items (Coronet/Shoulderpads/Pants of Faith for Shadow T3), and prose route advice. This is true across Holy, Discipline and Shadow."
  - "No PvP itemization list beyond two named weapons (Soulseeker, Time Frozen Bow) across both Discipline-pvp and Shadow-pvp; stamina-piece recommendations name only vague descriptions (\"ragnaros str cloak\", \"str tanking warrior ring from aq40\", \"naxx 24 stam ring\", \"nefarian tanking neck\"), not exact item names, so they could not be listed as structured items without inventing names."
  - "No leveling gear bracket exists for Holy (not a recommended leveling spec per the sources) or for level ranges 30-49/50-59 for any spec; only the level-5-29 wand progression (Lesser -> Greater Magic Wand) is concretely sourced."
  - "The shadow-ranged-dps.md claim that a 'Karazhan set' reduces Mind Blast cooldown (attributed only to \"Zitronenhaze\") could not be traced to a specific post ID in the extracted forum data, so it was omitted here rather than cited without a resolvable URL."
  - "Item IDs for many named items are not given in any source: Nightwind Leggings, Band of Servitude, Bloodvine set pieces, Soulseeker, Time Frozen Bow, the mooncloth fallback boots, Coronet/Shoulderpads/Pants of Faith. Marked item_id: null / source_type: unknown-in-sources above."
  - "Discipline T2.5 and Shadow T2.5/T3.5 raid sets have known set-bonus text (itemization changelog) but no per-piece item names anywhere in the sources."
  - "database.turtlecraft.gg item links quoted by players (mostly Langorn's guide) are player-reported, not staff-confirmed or cross-checked against a client DBC; treat item IDs and drop locations here as provisional pending local-server verification (see AGENTS.md §3-4)."
