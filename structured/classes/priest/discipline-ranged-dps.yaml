stat_weights:
  priority: "spell hit to 10% from gear (16% total with Piercing Light 6%) > spell power > crit > Int > Spirit/Mp5"
  spell_hit: "to 10% from gear (weight ~19 under cap per Tscosomaz); Discord confirms Piercing Light gives 6% [[d:priest#1302721522217254962]]"
  spell_power: 1
  holy_power: 1
  spell_crit: "2; Discord: crit is Searing Light *fuel* (more instant Smites), not throughput; Force of Will + Divinity = +10% crit"
  intellect: 3
  spirit: 4
  mp5: 4
  sources: ["[[d:priest#1302721522217254962]]", "[[d:priest#1300993541454954628]]"]
  era: pre-1.18.1
  agreement: consensus
caps:
  spell_hit_boss_pct: 16
  spell_hit_from_gear_pct: 10
  spell_hit_talent_pct: 6
  holy_resistance: "none on Turtle mobs (level-based Holy resist removed)"
rotation_single:
  - {priority: 1, action: "Smite (instant)", condition: "Searing Light proc active (3 s ICD); 60% cheaper in 1.18.1; macros cast instant Smite while Spell_Holy_SearingLightPriest is up", source: "[[d:priest#1332034430507815052]]", era: pre-1.18.1, agreement: consensus}
  - {priority: 2, action: "Holy Fire", condition: "off cooldown (keeps Purifying Flames +12% up); if Purifying Flames has <2 s left cast Holy Fire, else Smite", source: "[[d:priest#1332034430507815052]]", era: pre-1.18.1, agreement: consensus}
  - {priority: 3, action: "Simple form: 1 Holy Fire then 4 Smites", condition: "regardless of Searing Light procs; if the boss will die in the current cycle skip HF and finish Smite + Chastise", source: "[[d:priest#1431112150679818281]], [[d:priest#1430727888310898830]]", era: 1.18.1-announced-pre-release, agreement: consensus}
  - {priority: 4, action: "Shadow Word: Pain", condition: "missing and target lives > 18 s"}
  - {priority: 5, action: "Chastise (ally)", condition: "off cooldown (40 s): tank at pull, then Affliction lock / Arcane mage > 2H melee > DW melee; Discord guideline 'only above 80% HP' (hard rule: >50%), heal first if lower", source: "[[d:priest#1383364969432875028]]", era: pre-1.18.1, agreement: single source}
  - {priority: 6, action: "Smite (hard cast)", condition: "filler"}
  - {priority: 7, action: "Mind Blast", condition: "optional filler when mana is fine"}
  - {priority: 8, action: "Pain Spike", condition: "target dies within 5 s"}
  - {priority: 9, action: "Power Word: Shield (low rank, self)", condition: "Resurgent Shield talented and incoming damage will break it"}
  - {priority: 10, action: "Holy Fire rank 1 / downranked Smite", condition: "mana below ~30%"}
  - {priority: 11, action: "Searing Shot (Night Elf) / Sun's Embrace, Grace of the Sunwell (High Elf)", condition: "on cooldown"}
  - {priority: 12, action: "Wand", condition: "mana low, target nearly dead"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Holy Fire + SW:P on secondary targets, Smite skull", condition: "targets live > 10 s"}
  - {targets_min: 4, priority: 1, action: "Holy Nova spam (10 yd, self-centred)", condition: "tank has aggro (threat since 1.18.0), mana to spare"}
aoe_threshold: 4
cooldowns:
  - {name: Inner Focus, use_when: "free crit-boosted Holy Fire opener, or emergency heal"}
  - {name: Chastise, use_when: "every 40 s on an ally (haste 13/17/20% for 8-12 s)"}
  - {name: Enlighten, use_when: "before pull on self (+15%) or best caster (+10%); re-apply after death"}
  - {name: Fear Ward, use_when: "tank before fears"}
  - {name: Berserking / Sun's Embrace / Grace of the Sunwell, use_when: "on cooldown"}
resource_rules:
  - "Major Mana Potion + tea + runes from the first minute on long fights"
  - "Downrank Holy Fire (rank 1 ~80 mana, ~1:1 SP) and Smite when mana falls"
  - "Wand between casts to recover mana (Wand Specialization mana on hit)"
  - "1.18.1 T2.5 5-set: Chastise gives +40 SP and -15% Smite/Holy Fire mana for 12 s"
consumables:
  - Major Mana Potion
  - Nordanaar Herbal Tea / Tea with Sugar
  - Dark Rune / Demonic Rune
  - Brilliant Wizard Oil
  - Flask of Supreme Power
  - Greater Arcane Elixir
  - "Robe of Sacrifice / Darkmoon Card: Blue Dragon (mana items)"
  - "Discord raid SP stack: Greater Arcane Elixir, Elixir of Shadow Power, Dreamshard Elixir, Dreamtonic, Danonzo's Tel'Abim Delight, Spirit of Zanza, Blessed Sunfruit Juice, Medivh's Merlot Blue, Kreeg's Stout Beatdown [[d:priest#1404120758787117236]]"
  - "Nordanaar Herbal Tea is the best low-budget mana recharge; Nightfin Soup does not stack with Mageblood [[d:priest#1324382262342455417]], [[d:priest#1383050311110885406]]"
mistakes_to_avoid:
  - "Playing without 10% spell hit from gear"
  - "Letting Searing Light procs expire / clipping Holy Fire"
  - "Holy Nova on trash before the tank has aggro"
  - "Chastising an enemy in PvE (2 s disorient breaks on damage)"
  - "Forgetting to re-apply Enlighten"
  - "Trusting Improved PW:Shield / Force of Will tooltips (flat base only)"
  - "Expecting healing from Discipline tier sets: they are holy-damage only, no healing [[d:priest#1484579771336888330]], [[d:priest#1484565459503284335]]"
  - "Following pre-1.18.1 guide builds using Proclaim Champion / Champion's Grace (removed) [[d:priest#1464351944230436874]]"
leveling_by_bracket:
  - {bracket: "1-19", advice: "Buy the best wand (enchanting wands are OP); 2/2 Wand Specialization first; shield -> SW:P -> wand. Wanding beats casting before 40.", sources: ["[[d:priest#1300314106829602880]]", "[[d:priest#1296223142905118742]]", "[[d:priest#1296239261280112731]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "20-39", advice: "5/5 Spirit Tap then Holy tree to 5/5 Spiritual Guidance; spirit-stacking + Spirit Tap gives very high spell power for the level range. Fear Ward baseline at 20. Smite starts out-DPSing the wand around 30.", sources: ["[[d:priest#1332161439959613440]]", "[[d:priest#1331388964594126850]]", "[[d:priest#1296219501406453820]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "40-60", advice: "Shadowform comes online; respec Shadow at 42 (40 loses Wand Spec). HC smite works: Spirit Tap chain-pull, frontload 2-5 casts then wand/staff weave. Disc 'comes online' only at 60.", sources: ["[[d:priest#1331378617153753258]]", "[[d:priest#1331388964594126850]]", "[[d:priest#1332161439959613440]]"], era: pre-1.18.1, agreement: consensus}
