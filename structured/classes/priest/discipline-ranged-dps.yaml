play_loop:
  opener:
  - Inner Fire; Enlighten on self or one non-Smite DPS
  - Chastise tank on pull
  - Inner Focus -> Holy Fire -> Smite x4 -> Holy Fire
  single_target:
  - priority: 1
    action: Holy Fire
    condition: start of every cycle (refresh Purifying Flames); recast if it missed
    source: '[[d:priest#1431112150679818281]]'
  - priority: 2
    action: Smite x4
    condition: instant on Searing Light proc
  - priority: 3
    action: Smite (skip Holy Fire)
    condition: boss dies before cycle ends
  - priority: 4
    action: 'Shadow Word: Pain'
    condition: moving only
  - priority: 5
    action: Pain Spike
    condition: trash dies within ~2 s
    source: '[[d:priest#1504912888022831298]]'
  aoe:
    targets_min: 4
    loop:
    - priority: 1
      action: Holy Nova spam
      condition: tank aggro established
    - priority: 2
      action: alternate rank-1 Holy Nova and instant Smite
      condition: long packs / low mana
  cooldowns:
  - name: Chastise
    spell_id: 51478
    use_when: every 40 s on arcane mage / affliction warlock; never self in raid
  - name: Inner Focus
    spell_id: 14751
    use_when: Holy Fire opener
  - name: Enlighten
    spell_id: 51476
    use_when: 30 min buff; reapply after death
  - name: Fade
    use_when: near top of threat
  heal:
  - 'Emergency only: Power Word: Shield, Flash Heal; dedicated healing is Holy'
