stat_weights:
  priority: haste to 10% > spell hit to 16% > crit (after 10% haste) ~ holy spell power > intellect > mana
  haste: to 10% total (3% Mental Strength + 2% food + 5% gear, or 7% gear); little value beyond 10%
  spell_hit: to 16% (6% Piercing Light + 10% gear)
  spell_crit: ~12 spell power per 1% (dynamic); scales after the haste breakpoint
  spell_power: 1
  holy_power: 1
  intellect: 3
  spirit: 4
  mp5: 4
  sources:
  - '[[d:priest#1476777966410272788]]'
  - '[[d:priest#1481690213138038855]]'
  - '[[d:priest#1491436651363434676]]'
  - '[[d:priest#1474554280303132742]]'
  - '[[d:priest#1464653364577964032]]'
  era: post-1.18.1
  agreement: consensus
caps:
  spell_hit_boss_pct: 16
  spell_hit_from_gear_pct: 10
  spell_hit_talent_pct: 6
  haste_breakpoint_pct: 10
  haste_note: at 10% haste one Searing Light proc fits 4 Smites into the 10 s Purifying Flames window; talent/food haste does
    not show on the character sheet; high ping may need more [[d:priest#1481690213138038855]], [[d:priest#1476778037130301645]],
    [[d:priest#1470968763804287141]]
  holy_spells: 'binary: fully hit or fully miss [[d:priest#1447459514969227435]]'
rotation_single:
- priority: 0
  action: 'Pre-pull: Inner Fire; Enlighten on self (+15%) or one non-Smite DPS (+10%); Chastise the tank on pull'
  source: '[[d:priest#1490641318630658178]], [[d:priest#1486224198475976724]]'
- priority: 1
  action: 'Opener: Inner Focus -> Holy Fire -> 4x Smite -> Holy Fire'
  condition: boss pull
  source: '[[d:priest#1465500759394353345]]'
- priority: 2
  action: Holy Fire
  condition: start of each cycle (after 4 Smites) to refresh Purifying Flames; if it misses, recast it
  source: '[[d:priest#1431112150679818281]], [[d:priest#1490797658879557723]]'
- priority: 3
  action: Smite x4
  condition: cast instantly when Searing Light is up
  source: '[[d:priest#1431112150679818281]]'
- priority: 4
  action: Smite + Chastise instead of Holy Fire
  condition: boss dies before the next cycle completes
  source: '[[d:priest#1431112150679818281]]'
- priority: 5
  action: Chastise (friendly arcane mage / affliction warlock / top DPS)
  condition: off cooldown (40 s); costs one Smite; never on self in raid
  source: '[[d:priest#1465500759394353345]], [[d:priest#1490794714440536194]]'
- priority: 6
  action: 'Shadow Word: Pain'
  condition: only while moving (without T3.5 5-set)
  source: '[[d:priest#1465500759394353345]]'
- priority: 7
  action: 'T3.5 5-set cycle: 4x Smite -> Holy Fire -> 2x Smite -> Shadow Word: Pain (18.01 s)'
  condition: wearing T3.5 5-set (lets Burning Zeal tick out); if the set DoT is resisted recast SW:P + Holy Fire
  source: '[[d:priest#1484656770084241539]], [[d:priest#1485744052828901547]]'
- priority: 8
  action: 'T3 8-set opener: Chastise -> Holy Fire -> PW:S -> 2x Smite -> Holy Fire'
  condition: wearing full T3
  source: '[[d:priest#1504764793372803122]]'
- priority: 9
  action: Pain Spike
  condition: trash mob dies within ~2 s
  source: '[[d:priest#1504912888022831298]]'
- priority: 10
  action: Holy Fire rank 1 / downranked Smite
  condition: mana low
  source: '[Zvyrhol, 2026-04-10](https://forum.turtlecraft.gg/viewtopic.php?p=174655#p174655)'
rotation_aoe:
- targets_min: 1
  priority: 1
  action: single-target rotation
  condition: 1-3 targets
- targets_min: 4
  priority: 1
  action: Holy Nova spam
  condition: tank has aggro (threat since 1.18.0); DPS gain from ~3 targets, damage-efficient at 5+
  source: '[[d:priest#1424965252948299866]], [[d:priest#1463297546909909187]]'
- targets_min: 4
  priority: 2
  action: alternate rank-1 Holy Nova and instant Smite (Searing Light)
  condition: long packs or low mana
  source: '[[d:priest#1431189123129151621]], [[d:priest#1338540728665505892]]'
aoe_threshold: 4
cooldowns:
- name: Inner Focus
  use_when: free Holy Fire opener (3 min)
- name: Chastise
  use_when: tank on pull, then top DPS every 40 s
  source: '[[d:priest#1490792756803797113]]'
- name: Enlighten
  use_when: '30 min buff: self or one non-Smite DPS; re-apply after death'
- name: Fear Ward
  use_when: tank before fears
- name: Berserking / Grace of the Sunwell / Sun's Embrace
  use_when: racial, on cooldown
- name: Fade
  use_when: threat near tank (delays, does not prevent, a pull)
  source: '[[d:priest#1484604133200891944]]'
resource_rules:
- Major Mana Potion + tea on cooldown; with fast kills you do not run out [Zvyrhol, 2026-04-10](https://forum.turtlecraft.gg/viewtopic.php?p=174655#p174655)
- Holy Fire rank 1 (~80 mana, scales well) when low
- 'Threat is the chronic issue: take the Silent Resolve variant for progression [[d:priest#1497082351803437148]], [[d:priest#1484603417325211890]]'
- 'T2.5 5-set: Chastise gives +40 SP and -15% Smite/Holy Fire mana for 12 s'
consumables:
- Flask of Supreme Power
- Greater Arcane Elixir
- Dreamshard Elixir
- Dreamtonic
- Brilliant / Blessed Wizard Oil
- Danonzo's Tel'Abim Delight
- Mageblood
- Spirit of Zanza
- 2% haste food (part of the 10% haste recipe) [[d:priest#1464653364577964032]]
- Major Mana Potion
- Nordanaar Herbal Tea / Tea with Sugar
- Dark Rune / Demonic Rune
- SP stack source [[d:priest#1404120758787117236]]
mistakes_to_avoid:
- Playing below 10% haste and relying on double Searing Light procs [[d:priest#1481690213138038855]]
- Casting Holy Fire before the 4-Smite cycle ends (wastes Purifying Flames) [[d:priest#1490796993784709222]]
- Chastising yourself in raids (GCD loss) [[d:priest#1465500759394353345]]
- SW:P while standing still (without T3.5) [[d:priest#1465500759394353345]]
- Taking the shield talents without the T3 6-set [[d:priest#1494640175521730744]]
- Holy Nova before the tank has aggro
- Expecting healing from Discipline tier sets (holy damage only) [[d:priest#1484564440207855657]]
- Following pre-1.18.1 builds using Proclaim Champion (removed) [[d:priest#1464351944230436874]]
leveling_by_bracket:
- bracket: 1-19
  advice: Buy the best wand (enchanting wands are OP); 2/2 Wand Specialization first; shield -> SW:P -> wand. Wanding beats
    casting before 40.
  sources:
  - '[[d:priest#1300314106829602880]]'
  - '[[d:priest#1296223142905118742]]'
  - '[[d:priest#1296239261280112731]]'
  era: pre-1.18.1
  agreement: consensus
- bracket: 20-39
  advice: 5/5 Spirit Tap then Holy tree to 5/5 Spiritual Guidance; spirit-stacking + Spirit Tap gives very high spell power
    for the level range. Fear Ward baseline at 20. Smite starts out-DPSing the wand around 30.
  sources:
  - '[[d:priest#1332161439959613440]]'
  - '[[d:priest#1331388964594126850]]'
  - '[[d:priest#1296219501406453820]]'
  era: pre-1.18.1
  agreement: consensus
- bracket: 40-60
  advice: 'Shadowform comes online; respec Shadow at 42 (40 loses Wand Spec). HC smite works: Spirit Tap chain-pull, frontload
    2-5 casts then wand/staff weave. Disc ''comes online'' only at 60.'
  sources:
  - '[[d:priest#1331378617153753258]]'
  - '[[d:priest#1331388964594126850]]'
  - '[[d:priest#1332161439959613440]]'
  era: pre-1.18.1
  agreement: consensus
stat_priority:
- spell-hit
- spell-power
- spell-crit
- intellect
- spirit
- mp5
stat_priority_note: 'Hit first: the spec needs 10% from items on top of Piercing Light''s 6% to reach the 16% boss figure,
  and hit is weighted far above crit while under the cap. Then spell power (general or Holy), then crit, which fuels Searing
  Light. Intellect and Spirit/mp5 come last but cannot be zero — stacking pure spell power at the cost of all regeneration
  causes mana problems on long fights. Crit versus spell power is contested after the Searing Light internal cooldown. Spirit
  and mp5 are a tie: no cited post ranks them against each other, so their order in the array above carries no ranking. Grouping
  them is this repository''s reading of the sources listed above.'
