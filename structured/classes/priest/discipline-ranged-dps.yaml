stat_weights:
  spell_hit: "to 10% from gear (weight ~19 under cap per Tscosomaz)"
  spell_power: 1
  holy_power: 1
  spell_crit: 2
  intellect: 3
  spirit: 4
  mp5: 4
stat_priority: [spell-hit-to-10-percent-from-gear, spell-power, spell-crit, intellect, spirit/mp5]
stat_priority_note: "Hit first: the spec needs 10% from items on top of Piercing Light's 6% to reach the 16% boss figure, and hit is weighted far above crit while under the cap. Then spell power (general or Holy), then crit, which fuels Searing Light. Intellect and Spirit/mp5 come last but cannot be zero — stacking pure spell power at the cost of all regeneration causes mana problems on long fights. Crit versus spell power is contested after the Searing Light internal cooldown."
caps:
  spell_hit_boss_pct: 16
  spell_hit_from_gear_pct: 10
  spell_hit_talent_pct: 6
  holy_resistance: "none on Turtle mobs (level-based Holy resist removed)"
rotation_single:
  - {priority: 1, action: "Smite (instant)", condition: "Searing Light proc active (3 s ICD); 60% cheaper in 1.18.1"}
  - {priority: 2, action: "Holy Fire", condition: "off cooldown (keeps Purifying Flames +12% up)"}
  - {priority: 3, action: "Shadow Word: Pain", condition: "missing and target lives > 18 s"}
  - {priority: 4, action: "Chastise (ally)", condition: "off cooldown (40 s): tank at pull, then best DPS; ally above 50% HP"}
  - {priority: 5, action: "Smite (hard cast)", condition: "filler"}
  - {priority: 6, action: "Mind Blast", condition: "optional filler when mana is fine"}
  - {priority: 7, action: "Pain Spike", condition: "target dies within 5 s"}
  - {priority: 8, action: "Power Word: Shield (low rank, self)", condition: "Resurgent Shield talented and incoming damage will break it"}
  - {priority: 9, action: "Holy Fire rank 1 / downranked Smite", condition: "mana below ~30%"}
  - {priority: 10, action: "Searing Shot (Night Elf) / Sun's Embrace, Grace of the Sunwell (High Elf)", condition: "on cooldown"}
  - {priority: 11, action: "Wand", condition: "mana low, target nearly dead"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Holy Fire + SW:P on secondary targets, Smite skull", condition: "targets live > 10 s"}
  - {targets_min: 4, priority: 1, action: "Holy Nova spam (10 yd, self-centred)", condition: "tank has aggro (threat since 1.18.0), mana to spare"}
aoe_threshold: 4
cooldowns:
  - {name: Inner Focus, use_when: "free crit-boosted Holy Fire opener, or emergency heal"}
  - {name: Chastise, use_when: "every 40 s on an ally (haste 13/17/20% for 8-12 s)"}
  - {name: Enlighten, use_when: "before pull on self (+15%) or best caster (+10%); re-apply after death"}
  - {name: Fear Ward, use_when: "tank before fears"}
  - {name: Berserking / Sun's Embrace / Grace of the Sunwell, use_when: "on cooldown"}
resource_rules:
  - "Major Mana Potion + tea + runes from the first minute on long fights"
  - "Downrank Holy Fire (rank 1 ~80 mana, ~1:1 SP) and Smite when mana falls"
  - "Wand between casts to recover mana (Wand Specialization mana on hit)"
  - "1.18.1 T2.5 5-set: Chastise gives +40 SP and -15% Smite/Holy Fire mana for 12 s"
consumables:
  - Major Mana Potion
  - Nordanaar Herbal Tea / Tea with Sugar
  - Dark Rune / Demonic Rune
  - Brilliant Wizard Oil
  - Flask of Supreme Power
  - Greater Arcane Elixir
  - "Robe of Sacrifice / Darkmoon Card: Blue Dragon (mana items)"
mistakes_to_avoid:
  - "Playing without 10% spell hit from gear"
  - "Letting Searing Light procs expire / clipping Holy Fire"
  - "Holy Nova on trash before the tank has aggro"
  - "Chastising an enemy in PvE (2 s disorient breaks on damage)"
  - "Forgetting to re-apply Enlighten"
  - "Trusting Improved PW:Shield / Force of Will tooltips (flat base only)"
