stat_weights:
  stamina: 1
  spell_power: 2
  spell_hit: "3% (some say 4%)"
  spell_penetration: "vs resist stackers only"
  intellect: 4
caps:
  spell_hit_vs_players_pct: 3
  spell_penetration: "1 pen = 1 resistance"
rotation_single:
  - {priority: 1, action: "Power Word: Shield (self)", condition: "no Weakened Soul"}
  - {priority: 2, action: "Vampiric Embrace", condition: "before engaging (instant since 1.18.0)"}
  - {priority: 3, action: "Shadow Word: Pain", condition: "not on target (rank 1 as dispel bait)"}
  - {priority: 4, action: "Mind Blast", condition: "off cooldown (Inner Focus for free crit)"}
  - {priority: 5, action: "Mind Flay", condition: "target within 20-24 yd and no freedom effect"}
  - {priority: 6, action: "Pain Spike", condition: "target low enough to die (30 s CD)"}
  - {priority: 7, action: "Silence", condition: "enemy healer/caster casting"}
  - {priority: 8, action: "Psychic Scream", condition: "melee on you and target not fear-warded/WotF-ready"}
  - {priority: 9, action: "Shadowguard / Hex of Weakness (Troll), Starshards (Night Elf), Devouring Plague (Undead)", condition: "racial availability"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Shadow Word: Pain on all", condition: "always"}
  - {targets_min: 2, priority: 2, action: "Psychic Scream", condition: "2+ melee in range"}
  - {targets_min: 2, priority: 3, action: "Holy Nova rank 1 spam", condition: "stealthers suspected and Holy Nova talented"}
aoe_threshold: 2
cooldowns:
  - {name: Psychic Scream, use_when: "escape / casting window; assume trinket, WotF, Fear Ward"}
  - {name: Silence, use_when: "interrupt heals"}
  - {name: Inner Focus, use_when: "free Mind Blast or Devouring Plague"}
  - {name: Fade, use_when: "1.18.1: shorter CD with Improved Fade; no PvP effect described"}
  - {name: Desperate Prayer / Stoneform / Shadowmeld / WotF / Berserking, use_when: "racial: heal, cleanse poison-bleed-disease, deny openers or drink, break fear, burst"}
resource_rules:
  - "Drink whenever out of combat; Nordanaar Herbal Tea in combat"
  - "Suiciding to respawn with full mana is used but rebuffing costs 40-50% mana"
  - "Rank-1 SW:P / Hex as cheap dispel bait"
consumables:
  - Nordanaar Herbal Tea (61675)
  - Major Mana Potion
  - Greater Shadow Protection / Free Action-type PvP consumables (not detailed in sources)
mistakes_to_avoid:
  - "Opening with Mind Flay at max range"
  - "Fearing into Fear Ward / WotF / trinket"
  - "Pain Spike early (heals back)"
  - "Tier sets over stamina pieces"
  - "Never dispelling or shielding teammates"
