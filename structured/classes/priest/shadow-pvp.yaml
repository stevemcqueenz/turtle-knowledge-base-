  condition: group fights
  source: '[[d:priest#1485287934339977258]]'
- targets_min: 2
  priority: 2
  action: Psychic Scream
  condition: 2+ melee on you
- targets_min: 2
  priority: 3
  action: Dispel Magic enemy buffs
  condition: free GCD
aoe_threshold: 2
cooldowns:
- name: Psychic Scream
  use_when: escape / casting window; assume trinket, WotF, Fear Ward
- name: Silence
  use_when: interrupt heals
- name: Inner Focus
  use_when: free Mind Blast or Devouring Plague
- name: Fade
  use_when: '1.18.1: shorter CD with Improved Fade; no PvP effect described'
- name: Desperate Prayer / Stoneform / Shadowmeld / WotF / Berserking
  use_when: 'racial: heal, cleanse poison-bleed-disease, deny openers or drink, break fear, burst'
resource_rules:
- Drink whenever out of combat; Nordanaar Herbal Tea in combat
- Suiciding to respawn with full mana is used but rebuffing costs 40-50% mana
- Rank-1 SW:P / Hex as cheap dispel bait
consumables:
- Nordanaar Herbal Tea (61675)
- Major Mana Potion
- Greater Shadow Protection / Free Action-type PvP consumables (not detailed in sources)
mistakes_to_avoid:
- Opening with Mind Flay at max range
- Fearing into Fear Ward / WotF / trinket
- Pain Spike early (heals back)
- Tier sets over stamina pieces
- Never dispelling or shielding teammates
- 'Expecting post-CC2 Shadow PvP to be a survivability spec: CC2 made it a ''bad glass cannon'' (Blackout 3 -> 2 s, VE cast,
  Shadowform shield scare) [[d:priest#1296267877036589056]], [[d:priest#1296272979868647525]]'
- Expecting Light of An'she in Shadowform (it is a Holy spell) [[d:priest#1484898033597546539]]
- Mind Blast crits on warriors [[d:priest#1485369919938887893]]
- Ignoring Shadow Reflector on rogues (hard counter) [[d:priest#1485553306876252212]]
play_loop:
  guide_section: guide/classes/priest/pvp.md#how-to-play
  opener:
  - 'Power Word: Shield (self) -> Vampiric Embrace -> Shadow Word: Pain'
  single_target:
  - priority: 1
    action: Mind Blast
    condition: skip on warriors unless it kills
  - priority: 2
    action: Mind Flay (20 yd)
  - priority: 3
    action: Pain Spike
    condition: finisher
  - priority: 4
    action: Psychic Scream
    condition: melee reaches you
  - priority: 5
    action: Silence
    condition: aggressive caster
  aoe:
    targets_min: 2
    loop:
    - priority: 1
      action: 'Shadow Word: Pain on each target (hard to dispel with Shadow Weaving)'
  cooldowns:
  - name: Psychic Scream
    spell_id: 10890
    use_when: melee in range
  - name: Silence
    spell_id: 15487
    use_when: enemy caster casting
  heal:
  - VE sustain; drop form for emergency Flash Heal
  control:
  - Psychic Scream (spell 10890, cd 30 s) when melee reaches you; expect trinket/WotF/Fear Ward
  - Silence (spell 15487, cd 45 s, 20 yd) on casters
  - 'vs Fury warrior: Fear first to bait Berserker Rage, then Net'
  defensive:
  - 'Power Word: Shield on self before engaging'
  - stay at range with VE sustain; stick to your group
  - drop form for an emergency Flash Heal
  target_priority:
  - healers and squishy casters first
  - Mana Burn (3 s cast) only on mana-hungry healers (resto shaman), never paladins
  - 'keep Shadow Word: Pain on the enemy flag carrier'
  reset:
  - 'out of combat: drink to full, re-buff Inner Fire / Fortitude / shield (vanilla baseline)'
  - 'while waiting vs rogues: spam rank-1 Holy Nova to avoid being opened on'
  vs_class:
    warrior: shield; no Mind Blast crits (rage); Fear after Berserker Rage is used, then Net
    rogue: Fear and DoT to stop re-stealth; save trinket for the stun chain; worst matchup
    mage: consumables vs Polymorph; Silence
    warlock: kill or line-of-sight the pet
    hunter: kill or line-of-sight the pet
    druid: outlast with VE; watch cat burst
    paladin: burst before the bubble; Dispel Magic Blessing of Freedom
    shaman: expect Purge on shield/Fortitude and a trinket on Fear
    priest: dispel and Silence war
  sources:
  - '[[d:priest#1485255007283581048]]'
  - '[[d:priest#1485369919938887893]]'
  - '[[d:priest#1386358252157140992]]'
