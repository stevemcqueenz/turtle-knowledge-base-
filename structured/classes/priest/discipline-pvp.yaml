rotation_single:
  - {priority: 1, action: "Smite (instant)", condition: "Searing Light proc up"}
  - {priority: 2, action: "Chastise (enemy)", condition: "opener from range; do NOT follow with Holy Fire (DoT breaks the 2 s disorient)"}
  - {priority: 3, action: "Holy Fire", condition: "off cooldown and target not disoriented"}
  - {priority: 4, action: "Smite (hard cast)", condition: "filler; bait interrupts"}
  - {priority: 5, action: "Starshards (Night Elf)", condition: "target LoS-hugging; interrupt on CD"}
  - {priority: 6, action: "Searing Shot (Night Elf)", condition: "on cooldown, no GCD, sitting targets auto-crit"}
  - {priority: 7, action: "Shadow Word: Pain / Mind Blast", condition: "pressure; MB on cooldown"}
  - {priority: 8, action: "Pain Spike", condition: "finisher"}
  - {priority: 9, action: "Power Word: Shield (self)", condition: "no Weakened Soul"}
  - {priority: 10, action: "Psychic Scream", condition: "melee on you"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Chastise on a sapped/blinded ally", condition: "ally CC'd and above 50% HP"}
  - {targets_min: 2, priority: 2, action: "Holy Nova rank 1", condition: "stealth suspected / moving"}
  - {targets_min: 2, priority: 3, action: "Dispel Magic on enemy buffs (seals, blessings, mage/druid buffs)", condition: "free GCD"}
aoe_threshold: 2
cooldowns:
  - {name: Chastise, use_when: "40 s: CC opener or ally sap/blind break or ally haste"}
  - {name: Inner Focus, use_when: "free crit Holy Fire or Greater Heal; High Elf racial costs"}
  - {name: Fear Ward, use_when: "self/ally before fear classes"}
  - {name: Desperate Prayer / Avatar / Shadowmeld / Grace of the Sunwell, use_when: "racial"}
  - {name: Enlighten, use_when: "self before combat"}
resource_rules:
  - "Tea and drinking out of combat; Searing Light -60% Smite mana (1.18.1)"
  - "Mental Agility; Sun's Embrace (High Elf) when low"
  - "Mana Burn only with Improved Mana Burn (Shadow row 4)"
consumables:
  - Nordanaar Herbal Tea (61675)
  - Major Mana Potion
mistakes_to_avoid:
  - "Chastise then Holy Fire (DoT breaks the disorient)"
  - "Hard-casting into kickers instead of baiting"
  - "Damage tier sets instead of stamina"
  - "Forgetting ally-Chastise on Sap/Blind"
  - "Relying on Feedback for Blackout"
  - "Expecting Devouring Plague to stick vs paladins/priests"
