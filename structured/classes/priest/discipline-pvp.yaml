    5 points further for hybrids. PvP Dampening per spec introduced (values unknown). Healer variant is weakly sourced. Discord
    adds: the strongest BG priest is a healer dipping Shadow for Silence + Inner Focus; Tauren is the post-1.18.1 PvP healer
    race.'
