stat_weights:
  stamina: 1
  intellect: 2
  spirit: 3
  spell_power: 2
  spell_hit: 3% vs level-60 players (4% contested)
  healing_power: drives PW:S size
  sources:
  - '[[d:priest#1472313528693035219]]'
  - '[[d:priest#1400568275561087046]]'
  - '[[d:priest#1493738200147955824]]'
  era: post-1.18.1
  agreement: consensus
caps:
  spell_hit_vs_players_pct: 3
  chastise_range_yd: 25
  instant_smite_icd_s: 1.5
rotation_single:
- priority: 0
  action: 'Pre-fight: Inner Fire, Enlighten, PW:S self'
- priority: 1
  action: 'Opener: self-Chastise -> Inner Fire -> Holy Fire (crit fishing) -> Smite spam'
  source: '[[d:priest#1428000781478395964]]'
- priority: 2
  action: Smite (instant)
  condition: Searing Light proc up; weave another spell between instants (1.5 s ICD)
  source: '[[d:priest#1452013492961021983]]'
- priority: 3
  action: Chastise (enemy) then Smite, not Holy Fire
  condition: using Chastise as CC (Holy Fire DoT breaks disorient)
  source: '[Kobiq, 2024-12-04](https://forum.turtlecraft.gg/viewtopic.php?p=111295#p111295)'
- priority: 4
  action: Psychic Scream / Chastise
  condition: mage channels Arcane Missiles or warlock casts Dark Harvest; melee on you
  source: '[[d:priest#1462905759712018432]]'
- priority: 5
  action: Holy Nova spam + fish instant Smites
  condition: melee on you, shield up
  source: '[[d:priest#1462905759712018432]]'
- priority: 6
  action: Mind Blast
  condition: not vs warriors unless it kills (crits give rage)
  source: '[[d:priest#1485369919938887893]]'
- priority: 7
  action: Pain Spike
  condition: finisher
- priority: 8
  action: 'Power Word: Shield (self)'
  condition: no Weakened Soul
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Chastise a sapped/blinded ally
  condition: ally CC'd
  source: '[Isvya, 2024-10-19](https://forum.turtlecraft.gg/viewtopic.php?p=103744#p103744)'
- targets_min: 2
  priority: 2
  action: Holy Nova rank 1
  condition: stealth suspected / moving
  source: '[Itsbacon, 2025-08-08](https://forum.turtlecraft.gg/viewtopic.php?p=143823#p143823)'
- targets_min: 2
  priority: 3
  action: 'Dispel Magic (defensive on allies: sheep, fear, DoTs, HoJ; offensive on enemy buffs)'
  condition: free GCD
  source: '[[d:pvp-general#1073761850845573140]]'
aoe_threshold: 2
cooldowns:
- name: Chastise
  use_when: '40 s: CC opener or ally sap/blind break or ally haste'
- name: Inner Focus
  use_when: free crit Holy Fire or Greater Heal; High Elf racial costs
- name: Fear Ward
  use_when: self/ally before fear classes
- name: Desperate Prayer / Avatar / Shadowmeld / Grace of the Sunwell
  use_when: racial
- name: Enlighten
  use_when: self before combat
resource_rules:
- Tea and drinking out of combat; Searing Light -60% Smite mana (1.18.1)
- Mental Agility; Sun's Embrace (High Elf) when low
- Mana Burn only with Improved Mana Burn (Shadow row 4; the row-4 move breaks some PvP builds) [[d:priest#1484428895246745670]]
- Mana Burn vs resto shamans/healers, not paladins [[d:priest#1465782188216942645]]
consumables:
- Nordanaar Herbal Tea (61675)
- Major Mana Potion
mistakes_to_avoid:
- Chastise then Holy Fire (DoT breaks the disorient)
- Hard-casting into kickers instead of baiting
- Damage tier sets instead of stamina
- Forgetting ally-Chastise on Sap/Blind
- Relying on Feedback for Blackout
- Expecting Devouring Plague to stick vs paladins/priests
- Expecting Light of An'she in Shadowform (Holy spell) [[d:priest#1484898033597546539]]
- Using Psychic Scream on mind-controlled targets without knowing the bug (bug 8053) [[d:priest#1291325933202047037]]
- Solo-queueing as Holy [[d:priest#1487505164675059807]]
- Mind Blast crits on warriors [[d:priest#1485369919938887893]]
- Wasting fear into the PvP trinket (removes all effects) [[d:priest#1440676406890594434]]
stat_priority:
- stamina
- spell-power
- spell-crit
- spell-hit
stat_priority_note: 'Stamina first for survivability, then spell power (damage and healing rather than Holy-only), crit for
  Searing Light procs, and 3% hit versus level-60 players. Spell penetration only against opponents who stack resistance.
  Power Word: Shield scales with healing power, not spell power, per post-1.18.1 player testing — a single source, but it
  is the one thing that would change this order.'
