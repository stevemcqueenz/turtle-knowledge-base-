stat_weights:
  spell_hit: "to cap (6% from gear; 5% with a druid in raid)"
  spell_power: 1
  shadow_power: 1
  mp5: 2
  intellect: 3
  spell_crit: 4
  spirit: 5
  priority: "spell power >> crit >>> haste/cast speed (useless); spell hit to 16% vs bosses = 6% from gear with Shadow Focus 10%"
  notes:
    - "Mind Flay cannot crit and ignores haste; only Mind Blast (and Pain Spike) crit, ~15% of DPS."
    - "crit is worth ~3 spell power without the T3 6-set Mind Flay proc."
    - "The T3 6-set Mind Flay bonus-proc CAN crit and is logged as Mind Flay crits (why players think Flay crits)."
    - "At hit cap a level-63 target still has ~6.7% level-based shadow resist on top of the 1% miss."
