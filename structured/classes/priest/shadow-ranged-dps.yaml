mistakes_to_avoid:
- Keeping VE up all the time (threat, 90%+ overheal) [[d:priest#1491659277474074716]], [[d:priest#1459716663501914345]]
- Buying haste or chasing crit over spell power [[d:priest#1450143690969317406]]
- Stopping Mind Flay by moving instead of clipping [[d:priest#1494662933056327902]]
- Dotting mobs that die before 3 ticks [[d:priest#1489637342825152522]]
- Standing beyond 20 yd (Mind Flay range)
- Wearing the T3.5 5-set on Anomalus/Rupturan/Chess (disease-immune) [[d:priest#1438552505175773284]]
- Mind Blast on pull with a fresh tank (threat)
- Casting VE through the Nefarian priest class call
stat_priority:
- spell-hit
- spell-power
- mp5
- intellect
- spell-crit
- spirit
stat_priority_note: Consensus is "You just get 5% hit, stack spell power and more or less ignore everything else" [Caracole
  p=113536]. The cap is 16% total versus level-63 bosses, of which Shadow Focus gives 10%, so 6% from gear (5% if any druid
  is in the raid). The tail order is Jcarrill0's list. Crit is deliberately low — Mind Blast is the only crittable ability
  and it has a cooldown — which is why players objected to the 1.18.1 Shadow T2.5 set being built around crit.
