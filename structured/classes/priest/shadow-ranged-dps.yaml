stat_weights:
  spell_hit: "to cap (6% from gear; 5% with a druid in raid)"
  spell_power: 1
  shadow_power: 1
  mp5: 2
  intellect: 3
  spell_crit: 4
  spirit: 5
caps:
  spell_hit_boss_pct: 16
  spell_hit_from_gear_pct: 6
  spell_hit_talent_pct: 10
  max_hit_chance_pct: 99
rotation_single:
  - {priority: 1, action: "Shadow Word: Pain", condition: "not on target or < 3 s remaining"}
  - {priority: 2, action: "Vampiric Embrace", condition: "missing and target expected to live > 15 s (bosses); never on Nefarian"}
  - {priority: 3, action: "Mind Blast", condition: "off cooldown AND threat below tank (hold ~10 s after pull)"}
  - {priority: 4, action: "Mind Flay", condition: "filler; within 20-24 yd; channel to completion"}
  - {priority: 5, action: "Pain Spike", condition: "target will die within 5 s (30 s CD)"}
  - {priority: 6, action: "Devouring Plague (Undead)", condition: "once per boss if mana allows"}
  - {priority: 7, action: "Shadow Word: Pain + Mind Flay only", condition: "mana low: skip Mind Blast"}
  - {priority: 8, action: "melee swing between Mind Flays", condition: "optional; in melee range and safe (~3% DPS)"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Shadow Word: Pain on each target (tab)", condition: "targets live > 12 s; mana ok"}
  - {targets_min: 2, priority: 2, action: "Mind Flay / Mind Blast on kill target", condition: "always"}
  - {targets_min: 4, priority: 1, action: "single-target the skull; Power Word: Shield casters", condition: "no Holy Nova talented"}
  - {targets_min: 4, priority: 2, action: "Holy Nova (self-damage in Shadowform)", condition: "only if 10 Holy points spent and mana to spare"}
aoe_threshold: 3
cooldowns:
  - {name: Vampiric Embrace, use_when: "every boss opener; not on Nefarian; not on short trash"}
  - {name: Inner Focus, use_when: "free Mind Blast on cooldown, or emergency heal out of form"}
  - {name: Fade, use_when: "threat meter near tank (-15% total threat + Improved Fade retention in 1.18.1)"}
  - {name: "Power Word: Shield (self)", use_when: "before AoE/pushback phases (castable in Shadowform)"}
  - {name: Pain Spike, use_when: "execute / killing-blow fishing for Spirit Tap"}
  - {name: Berserking (Troll), use_when: "burst windows"}
resource_rules:
  - "Demonic Rune at ~1500 mana below max, Major Mana Potion at ~2500 below max, then on cooldown"
  - "Nordanaar Herbal Tea on cooldown (shares CD with runes)"
  - "Improved Shadowform (60): -15% shadow mana, 15% regen while casting; mana stops being an issue around 350-400 shadow power"
  - "If OOM: Mind Flay only to keep Shadow Weaving up"
  - "Drink between pulls in dungeons; in raids rely on consumables"
consumables:
  - Major Mana Potion
  - Demonic Rune / Dark Rune
  - Nordanaar Herbal Tea (61675)
  - Brilliant Wizard Oil
  - Elixir of Shadow Power (1 h since 1.18.0)
  - Greater Arcane Elixir
  - Mageblood Elixir
  - Nightfin Soup / Sagefish Delight
  - Elixir of Greater Intellect
  - Flask of Supreme Power (biggest DPS gain)
  - Greater Fire / Arcane Protection Potion (Ragnaros / Shazzrah)
mistakes_to_avoid:
  - "Mind Blast on pull or with fresh tank (170% threat multiplier + VE heal threat)"
  - "Vampiric Embrace on Nefarian or on short-lived trash"
  - "Standing at 30+ yd (Mind Flay 20-24 yd)"
  - "Clipping Mind Flay to Mind Blast without Improved Mind Blast"
  - "Skipping hit gear or chasing tier set bonuses (T2 bonuses useless)"
  - "Using Shadow Mend instead of leaving form to heal (pre-1.18.0 advice)"
  - "Forgetting Holy Nova damages you in Shadowform"
