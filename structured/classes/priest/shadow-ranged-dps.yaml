stat_weights:
  priority: spell hit to 16% > shadow/general spell power >> crit (~3-4 SP per 1% via Spirit Tap on Mind Blast crits) > spirit
    (~4 spirit = 1 SP) >>> haste (zero)
  spell_hit: to 16% (10% Shadow Focus 5/5 + 6% gear; at 3/5 Shadow Focus 10% from gear; druid Emerald Blessing +1%)
  spell_power: 1
  shadow_power: 1
  spell_crit: 3-4 SP per 1% (post-1.18.1)
  spirit: ~0.25 SP per point via Spiritual Guidance
  intellect: 3
  mp5: 2
  haste: 0
  spell_penetration: 'only vs high shadow resist: Mephistroth ~200 base (125 after CoS, need ~75 from gear), Kel''Thuzad ~100;
    Mind Flay ticks are binary'
  sources:
  - '[[d:priest#1489093951494426686]]'
  - '[[d:priest#1493685228911333427]]'
  - '[[d:priest#1440808869797560330]]'
  - '[[d:priest#1450143690969317406]]'
  - '[[d:priest#1436138912954454148]]'
  - '[[d:priest#1436260006545719376]]'
  era: post-1.18.1
  agreement: consensus
caps:
  spell_hit_boss_pct: 16
  spell_hit_from_gear_pct: 6
  spell_hit_talent_pct: 10
  max_hit_chance_pct: 99
  mind_flay_range: 20 yd base (Shadow Reach adds range; only Heigan needs it)
  haste: no effect on any Shadow spell
  mind_blast_cd_note: 4/5 Improved Mind Blast = 6 s CD = 2 Mind Flays [[d:priest#1435036085083181076]]
  binary_hit_formula: HitChance = (96 + SpellHit) * (1 - (Resist - Pen) * 0.15/60) [[d:priest#1487710174436134943]]
rotation_single:
- priority: 0
  action: 'Pre-pull: Shadowform, Inner Fire, PW:S if pushback expected'
- priority: 1
  action: 'Opener: Shadow Word: Pain -> Mind Blast -> Mind Flay x2 (VE first only if mana/healing needed)'
  source: '[[d:priest#1430465373366648873]], [[d:priest#1471593092183232739]]'
- priority: 2
  action: 'Shadow Word: Pain'
  condition: missing and target lives >= 3 ticks (~9 s); never clip early
  source: '[[d:priest#1489637342825152522]], [[d:priest#1468633694993649820]]'
- priority: 3
  action: Mind Blast
  condition: off cooldown and threat allows (3.5k crit + VE ~7200 threat)
  source: '[[d:priest#1459705039181320296]]'
- priority: 4
  action: Mind Flay (2 per Mind Blast cooldown)
  condition: filler; clip manually right after the last wanted tick; never stop it by moving
  source: '[[d:priest#1451277154942718034]], [[d:priest#1494374717791010836]], [[d:priest#1494662933056327902]]'
- priority: 5
  action: Vampiric Embrace
  condition: only when group needs mana or healing; never while Fade active; rarely during trinkets
  source: '[[d:priest#1491659277474074716]]'
- priority: 6
  action: 'Fade then Shadow Word: Pain refresh'
  condition: wearing T3.5 3-set (+15% shadow dmg 10 s) with Improved Fade; best with snapshot trinket (Eye of Dormant Corruption)
  source: '[[d:priest#1444088076384338121]], [[d:priest#1441870850482503710]]'
- priority: 7
  action: Pain Spike
  condition: finisher / filler better than nothing (bosses reduce the heal-back)
  source: '[[d:priest#1474782366689136730]]'
- priority: 8
  action: Devouring Plague (Undead)
  condition: mana to spare; slightly weaker than SW:P
  source: '[[d:priest#1490748665776832815]]'
- priority: 9
  action: 'Mana: tea + Major Mana Potion on cooldown, VE when mana needed'
  condition: mana dropping
  source: '[[d:priest#1504891047463882844]], [[d:priest#1488267578773209241]]'
shadow_weaving:
  note: Post-1.18.1 stacks live on the priest and apply to every target hit; 5/5 applies ~6 debuffs at once on a long fight,
    and stacks carry between targets (they fall off between open-world packs). Duration 9 s vs 15 s was reported as unresolved.
  sources:
  - '[[d:priest#1485255007283581048]]'
  - '[[d:priest#1484726495568986112]]'
  era: post-1.18.1
  agreement: consensus on mechanics; duration contested
rotation_aoe:
- targets_min: 2
  priority: 1
  action: single-target the kill target; SW:P extra mobs only if they live >= 3 ticks
  condition: 2-4 targets
  source: '[[d:priest#1489637342825152522]], [[d:priest#1472913815174647820]]'
- targets_min: 5
  priority: 1
  action: Holy Nova spam (Holy school; crit/mp5 Nova set; OOM after ~9-10 casts)
  condition: 5+ mobs, tank has aggro
