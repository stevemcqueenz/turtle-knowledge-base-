  spell_hit_talent_pct: 10
  max_hit_chance_pct: 99
  mind_flay_range: "20 yd base, 24 with 2/2 Shadow Reach (post-1.18.1)"
  haste: "no effect on Mind Flay"
  level_based_shadow_resist_pct: 6.7
rotation_single:
  - {priority: 1, action: "Opener: Shadowform + Inner Fire + PW:S -> Vampiric Embrace -> Shadow Word: Pain -> Mind Blast -> Mind Flays", condition: "boss opener; open with SW:P + VE to give the tank room", source: "[[d:priest#1430465373366648873]]", era: 1.18.1-announced-pre-release, agreement: consensus}
  - {priority: 2, action: "Shadow Word: Pain", condition: "not on target or < 3 s remaining"}
  - {priority: 3, action: "Vampiric Embrace", condition: "missing and target expected to live > 15 s (bosses); never on Nefarian"}
  - {priority: 4, action: "Mind Blast", condition: "off cooldown AND threat below tank (hold ~10 s after pull); filler cadence is 1 Mind Blast : 2 Mind Flays (6 s MB CD = 4 GCDs = 2 Flays)", source: "[[d:priest#1427180667724103781]], [[d:priest#1427288804783554610]]", era: 1.18.1-announced-pre-release, agreement: consensus}
  - {priority: 5, action: "Mind Flay", condition: "filler; within 20-24 yd; channel to completion; clip at the 2-second mark when an SW:P refresh is due", source: "[[d:priest#1362782979625193572]]", era: pre-1.18.1, agreement: consensus}
  - {priority: 6, action: "Pain Spike", condition: "target will die within 5 s (30 s CD)"}
  - {priority: 7, action: "Devouring Plague (Undead)", condition: "once per boss if mana allows"}
  - {priority: 8, action: "Shadow Word: Pain + Mind Flay only", condition: "mana low: skip Mind Blast"}
  - {priority: 9, action: "melee swing between Mind Flays", condition: "optional; in melee range and safe (~3% DPS)"}
shadow_weaving:
  note: "Post-1.18.1 stacks live on the priest and apply to every target hit; 5/5 applies ~6 debuffs at once on a long fight, and stacks carry between targets (they fall off between open-world packs). Duration 9 s vs 15 s was reported as unresolved."
  sources: ["[[d:priest#1485255007283581048]]", "[[d:priest#1484726495568986112]]"]
  era: post-1.18.1
  agreement: consensus on mechanics; duration contested
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Shadow Word: Pain on each target (tab)", condition: "targets live > 12 s; mana ok"}
  - {targets_min: 2, priority: 2, action: "Mind Flay / Mind Blast on kill target", condition: "always"}
  - {targets_min: 4, priority: 1, action: "single-target the skull; Power Word: Shield casters", condition: "no Holy Nova talented"}
  - {targets_min: 4, priority: 2, action: "Holy Nova (self-damage in Shadowform)", condition: "only if 10 Holy points spent and mana to spare"}
aoe_threshold: 3
gear:
  items:
    - "6-set T3 is the core; weapons Soulseeker or End of Dreams/Midnight Haze + AV/Saph offhand; wand Doomfinger."
    - "Rough BiS list: T3 head/chest/bracers/gloves/legs/boots, Choker of the Emerald Lord, Rime Covered Mantle, Cloak of the Devoured, Eyestalk Waist Cord, Band of the Inevitable, Ring of the Fallen God, Restrained Essence of Sapphiron, Phylactery/Tear, Soulseeker, Doomfinger."
    - "T3.5 shadow pieces carry shadow power, not general SP, on most slots; T3.5 3-set re-applies SW:P."
    - "1.18.1 T3.5 hit concern: enough hit required for SW:P or a resist ruins the rotation."
  sources: ["[[d:priest#1330315247281508432]]", "[[d:priest#1378060113117712454]]", "[[d:priest#1484592947763744908]]"]
  era: mixed
  agreement: consensus
boss_notes:
  - {boss: Loatheb, note: "Shadow priests are strong; raid shadow damage shines.", sources: ["[[d:priest#1296461377011191870]]"], era: pre-1.18.1, agreement: consensus}
  - {boss: Patchwerk, note: "Geared Shadow priest reported 851 DPS.", sources: ["[[d:priest#1301815728730804254]]"], era: pre-1.18.1, agreement: single source}
  - {boss: "Loatheb / Sapphiron / Anomalus (Kara40)", note: "Fights where shadow damage type shines.", sources: ["[[d:priest#1302190464266534942]]"], era: pre-1.18.1, agreement: single source}
  - {boss: "Nefarian / Kel'Thuzad (adds)", note: "Spirit Tap is valuable on add fights; VE on Nefarian can kill the group during the priest class call.", sources: ["[[d:priest#1290678653562126479]]"], era: pre-1.18.1, agreement: consensus}
  - {boss: Viscidus, note: "Good shadow damage-type fight.", sources: ["[[d:priest#1302260101272436899]]"], era: pre-1.18.1, agreement: consensus}
  - {boss: FourHorsemen, note: "Shadow priests are expected to off-heal.", sources: ["[[d:priest#1382588545641746482]]"], era: pre-1.18.1, agreement: single source}
  - {boss: "Zeliek / Heigan / Kel'Thuzad", note: "Mind Flay 20-24 yd range forces Shadow off max range.", sources: ["[[d:priest#1398261511931302059]]"], era: pre-1.18.1, agreement: single source}
threat_notes:
  items:
    - "A 3.5k Mind Blast crit is ~7699 threat after Salvation [[d:priest#1381443790979469312]]."
    - "Run a threat meter; delay Mind Blast on pull; take Silent Resolve / Shadow Affinity and Improved Fade."
  sources: ["[[d:priest#1381443790979469312]]"]
  era: pre-1.18.1
  agreement: consensus
cooldowns:
  - {name: Vampiric Embrace, use_when: "every boss opener; not on Nefarian; not on short trash"}
  - {name: Inner Focus, use_when: "free Mind Blast on cooldown, or emergency heal out of form"}
  - {name: Fade, use_when: "threat meter near tank (-15% total threat + Improved Fade retention in 1.18.1); post-1.18.1 2/2 Improved Fade lets you Fade before every SW:P", source: "[[d:priest#1465020522923294730]]", era: 1.18.1-announced-pre-release, agreement: single source}
  - {name: "Power Word: Shield (self)", use_when: "before AoE/pushback phases (castable in Shadowform)"}
  - {name: Pain Spike, use_when: "execute / killing-blow fishing for Spirit Tap (now also procs on Mind Blast crits)", source: "[[d:priest#1484646351974174741]]", era: post-1.18.1, agreement: consensus}
  - {name: Berserking (Troll), use_when: "burst windows"}
resource_rules:
  - "Demonic Rune at ~1500 mana below max, Major Mana Potion at ~2500 below max, then on cooldown"
  - "Nordanaar Herbal Tea on cooldown (shares CD with runes)"
  - "Improved Shadowform (60): -15% shadow mana, 15% regen while casting; mana stops being an issue around 350-400 shadow power"
  - "If OOM: Mind Flay only to keep Shadow Weaving up"
  - "Drink between pulls in dungeons; in raids rely on consumables"
consumables:
  - Major Mana Potion
  - Demonic Rune / Dark Rune
  - Nordanaar Herbal Tea (61675)
  - Brilliant Wizard Oil
  - Elixir of Shadow Power (1 h since 1.18.0)
  - Greater Arcane Elixir
  - Mageblood Elixir
  - Nightfin Soup / Sagefish Delight
  - Elixir of Greater Intellect
  - Flask of Supreme Power (biggest DPS gain)
  - Greater Fire / Arcane Protection Potion (Ragnaros / Shazzrah)
mistakes_to_avoid:
  - "Mind Blast on pull or with fresh tank (170% threat multiplier + VE heal threat)"
  - "Vampiric Embrace on Nefarian or on short-lived trash"
  - "Standing at 30+ yd (Mind Flay 20-24 yd)"
  - "Clipping Mind Flay to Mind Blast without Improved Mind Blast; clip at the 2-second mark instead"
  - "Skipping hit gear or chasing tier set bonuses (T2 bonuses useless)"
  - "Stacking crit/haste on Shadow: Mind Flay cannot crit and ignores haste; crit ~3 SP without T3 6-set"
  - "Using Shadow Mend instead of leaving form to heal (pre-1.18.0 advice)"
  - "Forgetting Holy Nova damages you in Shadowform"
