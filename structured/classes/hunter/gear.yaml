    stat_notes: 'Agility is the dominant stat pre-raid: Nurincarinun''s math (icyveins-style AP-equivalents: 1 agi=3ap, 1 crit=1 hit=32ap raidbuffed) finds 23-agility enchants beat a 3% haste enchant set at this gear level; the crossover point where haste wins is far above pre-raid gear (~1834 AP-equivalent worth of fixed stats). Hit is a secondary target the sources never quantify precisely for pre-raid (''whatever gets you to hit cap'' — no numeric pre-raid hit target given).'
