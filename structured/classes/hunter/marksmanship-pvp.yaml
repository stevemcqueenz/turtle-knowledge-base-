    source: '[[d:hunter#1171102722871799931]], [[d:pvp-general#1120255181372796948]]'
    era: pre-1.18.1
    agreement: single source
    note: '''In battle grounds I would go 0/31/20. for dueling 0/24/27 or 0/21/30. The only thing non-negotiable is having
      scatter shot.'' The forum KB only discussed 0/21/30 and 30/21/0; a #pvp-general plan also runs 0/31/20 or 5/31/15.'
  - name: Post-1.18.1 BM PvP sketch (no link posted)
    source: '[[d:hunter#1485052986911883385]]'
    era: post-1.18.1
    agreement: single source
    note: '''MM down to scatter, then BM down to 2 points in spirit bond (and intimidation) has to be the move right? 2 stuns,
      20% stun chance from conc too, bestial wrath, just missing frenzy and kill command?'' - asked, no posted link. BM PvP
      pet must have a sprint/dash [single source, [[d:hunter#1492651231305273414]]].'
  corrections:
  - claim: '30/21/0 timeline: already the recommended shape before Nov 2024 (''the best pvp spec is going to be some kind
      of scatter shot / intimidation build'' [2022, [[d:hunter#979448951113670756]]]); many hunters moved to 0/21/30 after
      the 2024-09-04 shared-DR fix; post-1.18.1 it is explicitly a fallback, not the recommendation [consensus, [[d:hunter#1280900374596812912]],
      [[d:hunter#1484432155768524800]]].'
    era: mixed
    agreement: consensus
  - claim: PvP dampening applies to all PvP including duels [single source, [[d:hunter#1485349738449469510]]]; post-1.18.1
      pets reportedly receive no dampened damage, which is the reason deep BM works [single source, [[d:hunter#1490803074963476650]]];
      a later undated 'stealth dampening change' was felt by MM [single source, [[d:hunter#1487217168977498152]]]. No staff
      confirmation.
