patch_validity:
  written_for: 0/21/30 MM/Survival (obsolete after CC2, 2024-11-01), 30/21/0 BM/MM hybrid (the recommended PvP build Nov 2024
    - Mar 2026), deep BM (post-1.18.1), and the newly-decoded post-1.18.1 MM and Survival PvP builds
  valid_for_1181: true
  notes: '1.18.1 (2026-03-20) returned Bestial Wrath and reworked Kill Command to require a hunter crit; the 30/21/0 hybrid
    loses the Kill Command capstone under the new tree and is now a fallback. Pets do not take PvP dampening post-1.18.1 (player
    reports, not a staff patch note), making deep BM the emerging PvP recommendation, contested by ''if u dont have the BW
    CD you are a bit of a deadweight''. Discord decoded two post-1.18.1 PvP build links the forum KB lacked: Survival 8/5/38
    and Marksmanship 0/35/16.'
