    era: 1.18.1-announced-pre-release
    agreement: single source
  pets:
  - claim: Attack speed matters in PvP for spell pushback vs casters ('faster pet attack speed is fucking amazing... it causes
      spell pushback'); ZG bats and Broken Tooth at 1.0 speed were BiS for that [consensus, [[d:hunter#949500178526777406]],
      [[d:hunter#979087162496647189]]].
    era: pre-1.18.1
    agreement: consensus
  - claim: 'Post-1.18.1 BM PvP pet is the wind serpent, but only with a sprint: ''I dont think id use any pet for bm pvp that
      didnt have sprint'' [single source, [[d:hunter#1492651231305273414]]]; the spider is the most annoying PvP pet [single
      source, [[d:hunter#1491084492012654592]]].'
    era: post-1.18.1
    agreement: single source
  - claim: For Survival PvP the spider is 'a must' for the web/root; scorpid + raptor are also solid depending on target immunities
      (nature vs bleed) [consensus, [[d:hunter#1454765734562496595]], [[d:hunter#1487807112577941564]]].
    era: mixed
    agreement: consensus
  bg_role:
  - claim: 'The hunter''s BG value is defensive/utility, not frontline: traps (with Shadowmeld for Alliance) hold positions
      while warlocks do the offensive FC work [single source, [[d:pvp-general#1427354322395463682]]].'
    era: 1.18.1-announced-pre-release
    agreement: single source
  - claim: Entrapment locks down chokepoints ('amazing for pvp, AV especially'); concrete BG play is pet on aggro + explosive
      trap + Flare, Eagle Eye other bases, call rotations, don't try to solo nodes [consensus, [[d:hunter#1489619404449779883]],
      [[d:hunter#1491490030517092362]]].
    era: post-1.18.1
    agreement: consensus
  - claim: Night Elf/Shadowmeld stealth + pet prowl ambush on cappers; for AV the recommendation was MM/BM with an owl or
      stealthed cat [single source, [[d:hunter#1166672654351212566]], [[d:hunter#1043898429346168832]]].
