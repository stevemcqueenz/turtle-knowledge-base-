  valid_for_1181: unknown
  notes: "1.18.1 (2026-03-20) returned Bestial Wrath and reworked Kill Command to require a hunter crit; the 30/21/0 hybrid loses the Kill Command capstone under the new tree. Pets do not take PvP dampening post-1.18.1 (player reports, not a staff patch note), making deep BM the emerging PvP recommendation, but this is contested ('PvP is also not about waiting for your BM pet to kill stuff' - Insanefool) and no talent link exists for the post-1.18.1 PvP build."
