stat_weights:
  stamina: matters more than in PvE; post-1.18.1 Survival PvP itemises stamina + resilience (not agility) - 'stam + resilience
    is the way to go for BM hunter' - while noting the pet gains no resilience [single source, [[d:hunter#1492801526450884838]]]
  hit: ranged hit cap is 8.0% at 300 weapon skill on Turtle (forum KB's 9% corrected); +3 weapon skill is ~0.6% hit and +5
    is the useful threshold [single source, [[d:hunter#1491594913136115732]]]
  weapon_skill: 'refines the forum KB''s ''has no impact for pvp'': weapon skill is partly hit (+3 ~= 0.6%, cap 8.0%); these
    are compatible only if ''no glancing/parry effect'' is the intended meaning [single source, [[d:hunter#1491594913136115732]]]'
  resilience: resilience + stamina is the post-1.18.1 BM/SV PvP itemisation; the pet gains nothing from it [single source,
    [[d:hunter#1492801526450884838]]]
  armor_penetration: none available - plate/leather-druid targets are 'nearly hopeless'
  note_1181: 'Guide: 8% ranged hit, then agility/crit for burst; BM wants stamina + resilience because the pet gets no resilience
    [[d:hunter#1492801526450884838]]'
caps:
  ranged_hit: 8.0% at 300 weapon skill (corrected from the forum KB's 9%) [single source, [[d:hunter#1491594913136115732]]]
rotation_single:
- priority: 1
  action: Aimed Shot then Arcane Shot (Enchanted Ammunition) from max range
  condition: opener/burst; 2000+ vs armor [[d:hunter#1485349629468999740]]
- priority: 2
  action: Scatter Shot -> step back -> Freezing Trap (6 s after Scatter, shared DR) or Frost Trap + Entrapment
  condition: melee closing [[d:hunter#1470137121443549435]]
- priority: 3
  action: Concussive Shot kite, Steady/Arcane between autos; Arcane while moving
  condition: target at range
- priority: 4
  action: Wing Clip in melee (3 s cd), Deterrence/Feign Death as last resort
  condition: target in dead zone [[d:hunter#1483806089668460695]]
- priority: 5
  action: Multi-Shot as opener/finisher
  condition: low-HP target [[d:hunter#1492280220827385956]]
rotation_aoe: []
aoe_threshold: 0
cooldowns:
- name: Feign Death
  use_when: every 30 s; pet on follow+passive first or you stay in combat. Not required for trinket swaps [single source,
    [[d:hunter#1488026421480914985]]]
- name: Rapid Fire
  use_when: only when the target is stationary/CC'd; stacks with Troll Berserking
- name: Scatter Shot
  use_when: opener or to walk a target into a pre-placed trap; shares DR with Freezing Trap since 2024-09-04
- name: Bestial Wrath / Kill Command
  use_when: hold for the pet's CC-break, not for damage, unless a kill window is open (deep BM/post-1.18.1). Killing the pet
    ends Bestial Wrath; BW cooldown dependence is the deep-BM counter-argument [contested, [[d:hunter#1494186537129218099]]]
- name: PvP trinket
  use_when: the ~2025-04 change made the trinket remove all CC on a 3-min CD, including Freezing Trap - the single biggest
    hunter PvP nerf of the era [consensus, [[d:pvp-general#1370452815889174538]], [[d:pvp-general#1370726144814616629]], [[d:hunter#1476452767802593330]]]
- name: Entrapment (Frost Trap)
  use_when: root can proc on any tick but once per trap [[d:hunter#1486483467830300702]]
resource_rules:
- Hunters oom faster than casters ('40-50% less mana')
- Feign Death + Aspect of the Viper between fights post-1.18.1; drink after Feign Death
- Do not spam Viper Sting on a single dispelling target
consumables:
- 'Engineering is the concrete PvP kit: Iron Grenade as a universal CC, thorium grenade to break melee range, sapper charges
  for AoE; ''Engineer is a must for any serious PvP'' [consensus, [[d:hunter#1359785441813069986]], [[d:hunter#1011330049057767544]],
  [[d:hunter#1362480243134304408]], [[d:hunter#1045527107918372884]]]'
- PvP trinket + Limited Invulnerability Potion + Feign Death to reset; Free Action Potion vs rogue/warrior openers; flasks
  are rare in PvP [single source, [[d:hunter#1491813464706912308]], [[d:hunter#1301973930600435826]]]
- 'Post-1.18.1 PvP reward sets: Partisan is T2-equivalent, the third tier is T3/T3.5-equivalent, the T2 PvP set is ''garbage''
  vs T1, WSG-exalted bracers beat T1 for BM; full PvP T3 is ~6.5 months of honour cap [consensus, [[d:hunter#1487247287905288242]],
  [[d:hunter#1490738219749474304]], [[d:hunter#1487484988633907260]]]'
mistakes_to_avoid:
- Scatter Shot into a trap without pre-placing it (half duration since the DR fix)
- Feigning with the pet still attacking (stays in combat) or Aimed Shot on a moving target
- Burning Bestial Wrath/Kill Command for damage instead of holding it as the pet's CC-break
- Standing in the 8-yd dead zone; swapping to Aspect of the Wolf just to hit a mob twice
- Night Elf/Shadowmeld ambush builds - 'Turtle gimped that'
- Trueshot Aura or cat pets in PvP
- Relying on BM when the enemy can CC your pet and Bestial Wrath is down [[d:hunter#1494186537129218099]]
matchups:
- opponent: warrior
  hunter_view: Favourable with cooldowns (Wing Clip -> Scatter -> Freezing Trap -> Aimed); Deterrence + Monkey gives ~90%
    avoidance then the hunter is a free kill for ~5 min; FAP or a trap trinket flips it.
  sources:
  - '[[d:hunter#1484432155768524800]]'
  - '[[d:pvp-general#1430283039140741252]]'
  agreement: consensus
  era: mixed
- opponent: rogue
  hunter_view: Worst melee matchup; Flare is the only reliable opener-beater; a rogue trinkets the trap, pops Evasion+Sprint
    and closes; post-1.18.1 the 0/35/16 MM build (Imp Concussive + Entrapment + Imp Wing Clip + Survivalist) is the answer
    and FAP is the counter.
  sources:
  - '[[d:hunter#1470093864181432481]]'
  - '[[d:hunter#1326222040298160231]]'
  agreement: consensus
  era: mixed
- opponent: mage
  hunter_view: 'Historic hunter win line: pre-place Freezing Trap to deny the deadzone, unload at range, scatter for space,
    FD/Scatter to deny Polymorph; post-1.18.1 MM burst is ''a lot of burst in PvP''.'
  sources:
  - '[[d:hunter#1091322585456852992]]'
  - '[[d:hunter#1466515448756699301]]'
  agreement: consensus
  era: mixed
- opponent: warlock
  hunter_view: 'Losing matchup for most; DoTs ignore kiting and Soul Link tanks the damage. Counterplay: Scatter/FD/Intimidation
    to break the Drain, Frost Reflector, wind-serpent pressure, save the trinket for Seduce/Fear.'
  sources:
  - '[[d:hunter#1458532977729339402]]'
  - '[[d:hunter#1300134126527058014]]'
  agreement: consensus
  era: mixed
- opponent: priest
  hunter_view: Shadow priest is 'nearly impossible' for many (DoTs + PW:Shield + fear); a burst build can delete them before
    fear lands or a melee SV/BM pressure build beats under-geared priests.
  sources:
  - '[[d:hunter#1458532977729339402]]'
  - '[[d:hunter#1113375997530734623]]'
  agreement: contested
  era: mixed
- opponent: paladin
  hunter_view: 'The ''how do I kill it'' matchup: Freedom negates the kite, bubble eats burst, plate blunts ranged, instant
    Viper dispel. Full duel plan exists (stamina, deep-MM, don''t Scatter into trap, Cheetah-kite, Deterrence during bubble);
    post-2025 buffed hybrids made it worse and Survival is the anti-paladin answer.'
  sources:
  - '[[d:pvp-general#1120255181372796948]]'
  - '[[d:pvp-general#1370735231186899026]]'
  - '[[d:hunter#1373425084433432749]]'
  agreement: contested
  era: pre-1.18.1
- opponent: shaman
  hunter_view: 'Contested: early ''shaman is real kiteable'' vs later enhancement too tanky (Frost Shock + Earthbind drags
    the hunter into the deadzone, ''if windfury procs you die'') and elemental a burst race needing nature resist.'
  sources:
  - '[[d:hunter#1425284868094562335]]'
  - '[[d:hunter#1458532977729339402]]'
  agreement: contested
  era: 1.18.1-announced-pre-release
- opponent: druid
  hunter_view: 'Form-dependent and mostly unfavourable: bear ''unkillable and unslowable'', boomkin out-ranges, cat most manageable
    but bleeds + run speed hurt; the WSG job is stopping the druid flag carrier; post-1.18.1 the BM pet is the liability.'
  sources:
  - '[[d:hunter#1368546452514672731]]'
  - '[[d:hunter#1302063672138403880]]'
  agreement: consensus
  era: pre-1.18.1
- opponent: hunter_mirror
  hunter_view: The one matchup the low-geared 2025 poster felt confident in; whoever controls the deadzone and lands Scatter/Entrapment
    first wins, and a fast-attack pet keeps pushback on the other hunter.
  sources:
  - '[[d:hunter#1425287154505875497]]'
  - '[[d:hunter#949500178526777406]]'
  agreement: single source
  era: mixed
