    agreement: contested
  - claim: 'Post-1.18.1 the class is noticeably better: ''MM hunter has good burst in pvp now'' and ''mm and bm hunters are
      good in pvp now'' [consensus, [[d:hunter#1485350312440107078]], [[d:hunter#1489572362868359298]]]; but ''if u dont have
      the BW CD you are a bit of a deadweight as soon as there is a mage/druid smart enough to cc ur pet'' [single source,
