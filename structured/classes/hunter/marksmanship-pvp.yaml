  - claim: 'Racial advice: keeps Gnome best Alliance but adds a competing camp (''meld is bis for pvp'', nelf for AB defence
      [ [[d:hunter#1166672654351212566]], [[d:hunter#1090547916235604079]] ]) and a strong Tauren camp (''warstomp is best
      hunter racial, being able to stun someone in your deadzone/melee range, and then cheetah away'' [ [[d:hunter#1453792390098714936]]
      ]); undead is for fear/Seduce vs locks [single source, [[d:hunter#1456421765013049395]]].'
    era: mixed
    agreement: contested
  - claim: 'Pet training-point priority for PvP: BiS DPS skill > needed resist > rank 8/9 Greater Stamina > leftovers into
