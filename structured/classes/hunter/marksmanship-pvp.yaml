caps: {}
rotation_single:
  - {priority: 1, action: "Opener: Hunter's Mark, pet attack, Concussive Shot, rank-1 Viper Sting on healers/dispellers to bait mana, then Auto Shot + Multi-Shot + Steady/Arcane while standing still briefly between kites", condition: "range control"}
  - {priority: 2, action: "Scatter Shot -> Feign Death (pet on follow/passive first) -> Freezing Trap -> walk to range -> Viper/Aimed", condition: "melee closes the gap; place the trap first when possible since the DR fix halved post-Scatter trap duration"}
  - {priority: 3, action: "Wing Clip, Raptor Strike + Mongoose Bite, Intimidation (pet stun), Deterrence", condition: "melee range without cooldowns"}
  - {priority: 4, action: "Frost Trap kiting after Feign Death", condition: "sustained kite"}
  - {priority: 5, action: "Pet on target, Bestial Wrath when the pet is CC'd or for a kill window, Kill Command after every crit, Steady/Arcane from range", condition: "deep BM post-1.18.1"}
rotation_aoe: []
aoe_threshold: 0
cooldowns:
  - {name: "Feign Death", use_when: "every 30 s; pet on follow+passive first or you stay in combat"}
  - {name: "Rapid Fire", use_when: "only when the target is stationary/CC'd; stacks with Troll Berserking"}
  - {name: "Scatter Shot", use_when: "opener or to walk a target into a pre-placed trap; shares DR with Freezing Trap since 2024-09-04"}
  - {name: "Bestial Wrath / Kill Command", use_when: "hold for the pet's CC-break, not for damage, unless a kill window is open (deep BM/post-1.18.1)"}
resource_rules:
  - "Hunters oom faster than casters ('40-50% less mana')"
  - "Feign Death + Aspect of the Viper between fights post-1.18.1; drink after Feign Death"
  - "Do not spam Viper Sting on a single dispelling target"
consumables: []
mistakes_to_avoid:
  - "Scatter Shot into a trap without pre-placing it (half duration since the DR fix)"
  - "Feigning with the pet still attacking (stays in combat) or Aimed Shot on a moving target"
  - "Burning Bestial Wrath/Kill Command for damage instead of holding it as the pet's CC-break"
  - "Standing in the 8-yd dead zone; swapping to Aspect of the Wolf just to hit a mob twice"
  - "Night Elf/Shadowmeld ambush builds - 'Turtle gimped that'"
  - "Trueshot Aura or cat pets in PvP"
