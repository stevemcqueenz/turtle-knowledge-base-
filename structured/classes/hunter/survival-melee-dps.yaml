    dw_weapons: slow weapon in the main hand, weapon-skill weapon in the off hand [single source, [[d:hunter#1487660367856537711]]].
    hit: 1.18.1 gave dual-wield melee +3% hit via Surefooted [consensus, [[d:hunter#1485682104217112606]]]; dual-wield white
      autos miss ~20%+, yellow specials use the normal cap [single source, [[d:hunter#1485760027976400966]]].
    server_dependence: '''2H king on fully progressed, DW tops Ambershire'' [contested/server-dependent, [[d:hunter#1486498375489556661]]].'
  pets:
  - claim: For Survival, keep the pet alive as a threat sponge/extra DPS; the pet cannot hold aggro for you [forum KB, corroborated
      Discord, [[d:hunter#1484476051936510073]]].
    era: post-1.18.1
    agreement: consensus
  - claim: Alone Against the World was measured as a net ~10.4% loss where the pet + procs contribute ~15.4%; take it only
      on pet-hostile bosses [single source, [[d:hunter#1484443857402724372]]].
    era: post-1.18.1
    agreement: single source
  encounters:
  - zone: Kara40
    advice: No humanoids/beasts/giants/dragonkin, so Improved Slaying is worthless there; pet uptime is the challenge.
    sources:
    - '[[d:hunter#1486333622796550184]]'
    - '[[d:hunter#1485915598004158527]]'
    era: post-1.18.1
    agreement: consensus
  - zone: Molten Core
    advice: Wolves can be brought for the party buff because MC mobs are bleed-immune.
    sources:
    - '[[d:hunter#1490428315524272329]]'
    era: post-1.18.1
    agreement: single source
  mistakes_to_avoid:
  - Leveling as Survival before 40 - 'for leveling not until 40 or so when you can get lightning reflexes & untamed trapper'
    [Sisco, [[d:hunter#1417950297417978098]]].
  - Ignoring the DW/2H server and encounter split when itemising.
  sources:
  - '[[d:hunter#1412681801339764817]] - Dresche pinned Hunter FAQ (1.18.1)'
  - '[[d:hunter#1490682120815775965]] - Vellasta TWoW Hunter Simulator'
  - '[[d:hunter#1488624322686746945]] - MetaHunt 1.18.1 tooling'
