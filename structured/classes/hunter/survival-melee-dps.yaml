stat_priority:
- agility
- attack-power
- hit
- strength
stat_priority_note: Agility first because Lightning Reflexes converts 100% of agility into melee attack power on top of the
  baseline; melee AP also scales the fire traps through Untamed Trapper. Hit matters but the exact 2H and dual-wield melee
  caps on Turtle are not stated by any Turtle source (the tree gives Surefooted 3%, +3% more for dual wield since 1.18.1).
