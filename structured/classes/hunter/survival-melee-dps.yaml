agreement: contested
patch_validity:
  written_for: "CC2 melee rebuild (2024-11-01) through the CC3 kit (2025-08-15, Lacerate added, Rapid Strikes removed, Vicious Strikes damage nerf); 1.18.1 (2026-03-20) touched it lightly"
  valid_for_1181: unknown
  notes: "1.18.1 added Alone Against the World (+3/6% damage with no pet), Surefooted dual-wield hit, and restored Vicious Strikes' Raptor/Mongoose damage bonus (revision 2026-03-19) plus a small Lacerate buff (+5% AP, +15% from the side). No player re-posted a talent build or DPS numbers after 2026-03-20; the CC3 build is assumed to still stand with those buffs applied, allocation unknown."
