stat_weights:
  agility: "top priority - Lightning Reflexes converts 100% of agility to melee AP on top of the 1 AP/agi baseline"
  melee_attack_power: "scales fire traps via Untamed Trapper: Explosive Trap ~1516 damage per target over 6 s for a Naxx-geared hunter [Juzam]; Immolation Trap '300+ fire' per tick deep SV"
  hit: "melee hit cap matters; tree gives Surefooted 3% (+3% dual-wield since 1.18.1) [consensus (matches staff), [[d:hunter#1485682104217112606]]]. The exact 2H/DW melee hit caps on Turtle are not stated by a Turtle source; dual-wielding melee autos miss much more (~20%+) while yellow specials use the normal cap [single source, [[d:hunter#1485760027976400966]]]"
  crit: "Savage Strikes 6% + Killer Instinct crit damage; Lacerate requires a prior crit to be usable"
  weapon: "2H preferred pre-CC3 ('by far the better choice'); after CC3, Mongoose Bite hits with both weapons and dual-wield is 'almost on par with a 2H-er'. Post-1.18.1 Discord sharpens it: DW parses slightly higher single-target (double stats + Swift Aspects procs), 2H better multi-target (weapon-damage ceiling for Carve), pick by what you own; server-dependent [single source, [[d:hunter#1493259706570117261]], [[d:hunter#1486498375489556661]]]. For DW, slow main hand + weapon-skill off hand [single source, [[d:hunter#1487660367856537711]]]"
  spell_power: "niche - helps Stinging Nettle-applied stings/chili only, not traps"
caps:
  melee_hit: "2H/DW melee hit caps not published for Turtle; Surefooted 3% (+3% DW, 1.18.1); dual-wield white autos miss ~20%+, yellow specials use the normal cap [single source, [[d:hunter#1485760027976400966]]]"
rotation_single:
  - {priority: 1, action: "Aspect of the Wolf (rank 7), pet on target first; Serpent Sting applied for free by Mongoose Bite via Stinging Nettle Lacing", condition: "pre-pull; Hunter's Mark does not help melee (ranged-AP only)"}
  - {priority: 2, action: "Immolation Trap under the target (in-combat via Untamed Trapper), refresh on expiry", condition: "skip entirely on fire-immune bosses"}
  - {priority: 3, action: "Raptor Strike on cooldown", condition: "queues on the next swing"}
  - {priority: 4, action: "Mongoose Bite on cooldown", condition: "refreshes the Stinging Nettle sting"}
  - {priority: 5, action: "Lacerate whenever usable", condition: "after a crit, 10 s cd; from the side of the boss where possible (+15% post-1.18.1); skip when mana < 30%"}
  - {priority: 6, action: "Wing Clip between strikes", condition: "only for a proc trigger (Windfury/HoJ/Dragonbreath Chili) and when mana allows"}
  - {priority: 7, action: "Rapid Fire on cooldown", condition: "melee haste since CC3"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Carve on cooldown (10 s, 5 targets, 10-yd cone) plus Explosive Trap; Immolation on the main target", condition: "2-3 targets"}
  - {targets_min: 4, priority: 1, action: "Explosive Trap first (stings everything hit), Carve on cooldown, refresh Explosive on expiry", condition: "4+ targets; fall back to Carve + Multi-Shot on fire-resistant/immune trash"}
aoe_threshold: 4
cooldowns:
  - {name: Deterrence, use_when: "+25% dodge/parry for 10 s; use when threat is pulled or a big hit is coming"}
  - {name: "Feign Death", use_when: "every 30 s if the tank is weak; Improved Feign Death 2/2"}
  - {name: "in-combat Freezing/Frost Trap", use_when: "an add needs CC or you need to kite - unique to Survival via Untamed Trapper"}
resource_rules:
  - "Mana is the limiting resource: Resourcefulness 5/5, Untamed Trapper -20% (staff), T3 8-set, mana potions/tea"
  - "Aspect of the Viper (56+, 1.18.1) out of combat only, never mid-rotation (Wolf is needed for melee AP)"
  - "Mend Pet is pointless mid-fight; let the pet be a threat sponge (Screecher) or extra DPS (wolf/raptor)"
consumables:
  - "Best available 2H weapon; The Eye of Nerub (Naxx) is BiS melee for Survival"
  - "Melee-only items open up: Hand of Justice, Wrath of Cenarius, Chronobreaker"
  - "+8 agility head/legs enchant (not the ZG MM enchant); 2H +25 agility; melee oils/enchants proc off Wing Clip"
  - "Melee-consumable checklist: mongoose, Ground Scorpok Assay, Elixir of Giants, firewater/juju, Sour Mountain Berry, elemental sharpening stone, Str+Agi scrolls [single source, [[d:hunter#1463846948200124426]]]"
  - "T3.5 Ravenstalker 5-set 'made for Melee hunter in mind' (+5% Quick Shots haste, -1 s Carve/Multi-Shot cd)"
mistakes_to_avoid:
  - "Trapping fire-immune bosses / wasting mana on traps in MC and BWL"
  - "Ripping threat by standing in front instead of behind; expecting the pet to hold aggro"
  - "Leveling as Survival before 40 and complaining - the spec is weak before Untamed Trapper"
  - "Skipping Untamed Trapper or Lightning Reflexes"
  - "Rolling need on every melee weapon and leather piece"
  - "Going OOM by spamming Lacerate/traps on trash that dies in seconds; not drinking between packs"
  - "Trying to Tranquilizing Shot from melee and losing the enrage window"
