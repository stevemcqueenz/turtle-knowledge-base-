patch_validity:
  written_for: CC2 melee rebuild (2024-11-01) through the CC3 kit (2025-08-15, Lacerate added, Rapid Strikes removed, Vicious
    Strikes damage nerf); 1.18.1 (2026-03-20) touched it lightly
  valid_for_1181: true
  notes: '1.18.1 added Alone Against the World (+3/6% damage with no pet), Surefooted dual-wield hit, and restored Vicious
    Strikes'' Raptor/Mongoose damage bonus (revision 2026-03-19) plus a small Lacerate buff (+5% AP, +15% from the side).
    Discord decoded the recurring PvE Survival allocation (16/0/35) and filled the previously-null spell_ids, and sharpened
    2H-vs-DW post-1.18.1: DW parses slightly higher single-target, 2H better multi-target, pick by what you own; server-dependent
    (''2H king on fully progressed, DW tops Ambershire'').'
