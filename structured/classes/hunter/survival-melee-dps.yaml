stat_weights:
  agility: 'top: x2.2 melee AP with Lightning Reflexes, ~2.6+ eAP [[d:hunter#1473305949220634645]], [[d:hunter#1485975870316216472]]'
  hit: 8% soft cap (2H and specials); DW players run ~11-13% (dual-wield talents give 6%) [[d:hunter#1486732672683347988]],
    [[d:hunter#1494465610652975275]]
  weapon_skill: 'to 315 (DW: ~40% of damage is white) [[d:hunter#1487845942529888279]]'
  crit: below MM value (traps/Lacerate DoT/Serpent Sting cannot crit); prefer crit over haste from T3 [[d:hunter#1428685173079277679]],
    [[d:hunter#1483034612103118999]]
  haste: 20-40 eAP before the Strike Together nerf, less since [[d:hunter#1488442215729594449]], [[d:hunter#1494831344424063198]]
  spell_power: only the Serpent Sting component; not worth it [[d:hunter#1486579356875886692]]
  priority: agility > crit > haste > hit (8% 2H / ~13% DW) [[d:hunter#1475246044374896640]]
caps:
  melee_hit: 8% soft cap; DW white-hit hard cap 28% [[d:hunter#1486732672683347988]], [[d:hunter#1489021201153134692]]
  weapon_skill: 315 [[d:hunter#1485763124253425858]]
rotation_single:
- priority: 1
  action: Raptor Strike
  condition: off cooldown (contested order with Mongoose Bite) [[d:hunter#1485147064102031453]], [[d:hunter#1488178738528124948]]
- priority: 2
  action: Immolation Trap
  condition: target not fire-immune and not about to die [[d:hunter#1451997607705444677]]
- priority: 3
  action: Mongoose Bite
  condition: off cooldown
- priority: 4
  action: Lacerate
  condition: off cooldown; from the side (+15%)
- priority: 5
  action: Carve
  condition: off cooldown [[d:hunter#1448546351657914440]]
- priority: 6
  action: Wing Clip
  condition: only if nothing else is ready or about to be ready [[d:hunter#1488178991918485585]]
rotation_aoe:
- targets_min: 2
  priority: 1
  action: add Explosive Trap to the single-target macro
  condition: 2 targets [[d:hunter#1448541614208192602]]
- targets_min: 3
  priority: 1
  action: Explosive Trap > Carve > Raptor Strike > Mongoose Bite > Lacerate > Wing Clip
  condition: 3+ targets; skip traps on fire-immune or nearly dead packs [[d:hunter#1485147064102031453]]
aoe_threshold: 3
cooldowns:
- name: Rapid Fire / on-use trinkets / Blood Fury
  use_when: on pull; Blood Fury does not stack with Molten Emberstone [[d:hunter#1456621926540644466]]
- name: Deterrence
  use_when: emergency; ~90% avoidance with Improved Aspect of the Monkey [[d:hunter#1408483316390428682]]
- name: Feign Death
  use_when: threat drop; resist chance grows with proximity; cannot fail out of line of sight [[d:hunter#1494689825419165921]],
    [[d:hunter#1445841760583680000]]
resource_rules:
- 'Mana hungry: T2.5 3-piece or T3 6/8 give mana back on trap/Serpent Sting hits [[d:hunter#1472876279106637835]]'
- Viper for trash/farming only [[d:hunter#1464367550312874156]]
- Melee threat threshold 110% vs 130% ranged; no threat talent [[d:hunter#1318265159327682571]]
consumables:
- 'Naxx kit: Consecrated Sharpening Stone, Danonzo''s Tel''Abim Surprise, Elixir of the Mongoose, Flask of the Titans, Juju
  Might, Potion of Quickness, Spirit of Zanza, Ground Scorpok Assay [[d:hunter#1476059796166676633]]'
- 'Also: Elixir of the Giants, Firewater, Sour Mountain Berry, Agi/Str scrolls, Demonic Runes [[d:hunter#1463846948200124426]]'
- Greater Firepower does not buff fire traps; no SP consumables for traps [[d:hunter#1486571963035025510]], [[d:hunter#1486579356875886692]]
- 'Enchants: +25 Agi 2H (beats Crusader), +15 Agi each DW weapon; never the ZG ranged-AP head/leg enchant [[d:hunter#1485975870316216472]],
  [[d:hunter#1441326520831316051]]'
mistakes_to_avoid:
- Fire traps on fire-immune bosses or nearly dead packs [[d:hunter#1451997607705444677]]
- Wing Clip while anything else is ready [[d:hunter#1488178991918485585]]
- Spell power / Greater Firepower for traps [[d:hunter#1486571963035025510]]
- ZG Falcon's Call head/leg enchant (ranged AP only) [[d:hunter#1441326520831316051]]
- Stopping short of 315 weapon skill with DW [[d:hunter#1487845942529888279]]
- Leveling melee Survival before 40 [[d:hunter#1489567654791483513]]
