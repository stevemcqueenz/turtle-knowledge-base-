  leveling_order:
    - {level: "10–14", tree: "Beast Mastery", talent: "Endurance Training 5", note: "contested: several posters take Swift Aspects first, or split between the two"}
    - {level: "15–17", tree: "Beast Mastery", talent: "Thick Hide 3"}
    - {level: "18–19", tree: "Beast Mastery", talent: "Improved Revive Pet 2"}
    - {level: "20", tree: "Beast Mastery", talent: "Bestial Swiftness 1", note: "removed in CC3 — take Pathfinding 2 or Coordinated Assault 1 instead"}
    - {level: "21–25", tree: "Beast Mastery", talent: "Unleashed Fury 5"}
    - {level: "26–30", tree: "Beast Mastery", talent: "Ferocity 5", note: "take 1/2 Improved Mend Pet as soon as it is available"}
    - {level: "31", tree: "Beast Mastery", talent: "Intimidation 1", note: "pseudo-taunt; hands a second mob to the pet"}
    - {level: "32–33", tree: "Beast Mastery", talent: "Bestial Precision 2"}
    - {level: "34", tree: "Beast Mastery", talent: "Bestial Discipline 1", note: "one point can move to Improved Mend Pet"}
    - {level: "35–39", tree: "Beast Mastery", talent: "Frenzy 5", note: "2–4 points is enough with a fast pet"}
    - {level: "40", tree: "Beast Mastery", talent: "Bestial Wrath 1", note: "removed in CC3, back in 1.18.1 at row 5"}
    - {level: "41–45", tree: Marksmanship, talent: "Efficiency 5", note: "Steakhouse skips it for leveling — \"Just drink more\""}
    - {level: "46–50", tree: Marksmanship, talent: "Lethal Shots 5"}
    - {level: "51", tree: Marksmanship, talent: "Steady Shot", note: "baseline at 20 since 1.18.1, so this point is free after that patch"}
    - {level: "52–56", tree: "Beast Mastery", talent: "Swift Aspects 5", note: "or earlier, per Ataika"}
    - {level: "57–58", tree: "Beast Mastery", talent: "Spirit Bond 2"}
    - {level: "59–60", tree: "Beast Mastery", talent: "Improved Mend Pet 2"}
  leveling_order_source: "The CC2-tree order in synthesis/classes/hunter/leveling.md (most detailed BM source); talent names and rows changed at CC3 and 1.18.1 where the notes say so."
stat_weights:
  ranged_attack_power: "top priority - feeds the pet through Spirit Bond; item RAP-for-crit trades 'improve the hunter's personal DPS but do almost nothing for the pet' [Skurridizo]"
  hit: "same cap as MM (see marksmanship-ranged-dps.yaml)"
  crit: "matters post-1.18.1 because Kill Command requires a hunter crit"
  haste: "same as MM"
  pet_damage_items: "T0.5 Beastmaster's set + AQ20 Hunter's set + Breastplate of Beast Mastery + Ferra's Collar totalled '13% damage, 4% additional crit and 50 attack power' for the pet per Arcanex Ota, but 'an item giving +9 agility is already better than that pet-damage bonus' once past BWL per Skurridizo"
stat_priority: [hit-to-cap, ranged-attack-power, crit, haste]
stat_priority_note: "Same ranged stats as Marksmanship, but ranged attack power ranks above crit because RAP is what feeds the pet through Spirit Bond: Naxx/Kara40 items that trade AP for crit 'improve the hunter's personal DPS but do almost nothing for the pet' [Skurridizo p=170469]. Post-1.18.1 hunter crit still matters because Kill Command needs a hunter crit. Pet-damage set bonuses lose to +9 agility past BWL."
caps: {}
rotation_single:
  - {priority: 1, action: "Pet attack, Hunter's Mark, Bestial Wrath at the pull and on cooldown", condition: "1.18.1 kit; 18 s enrage, no GCD, 1.5 min cd"}
  - {priority: 2, action: "Kill Command whenever usable", condition: "1.18.1 kit; after any hunter crit, 8 s cd, no GCD, 45 yd, needs line of sight to the pet"}
  - {priority: 3, action: "Steady Shot after each Auto Shot, never clipping the auto", condition: "crit-fishes for Kill Command and procs Coordinated Assault"}
  - {priority: 4, action: "Arcane Shot on cooldown", condition: "mana available; scales with weapon damage post-1.18.1 and also procs Coordinated Assault"}
  - {priority: 5, action: "Multi-Shot on cooldown", condition: "always fits it in"}
  - {priority: 6, action: "Serpent Sting", condition: "drop it first when mana is short - 'costs almost as much as 2 Steady Shots'"}
  - {priority: 7, action: "Aspect of the Viper", condition: "mana < ~20% on a long fight and no burst planned; swap back to Hawk before damage windows"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Multi-Shot on cooldown; keep the single-target loop otherwise", condition: "2-3 targets"}
  - {targets_min: 4, priority: 1, action: "Volley (talented, 3 s cast post-1.18.1) if available; otherwise stay single-target", condition: "no benchmarked post-1.18.1 AoE data exists"}
aoe_threshold: 4
cooldowns:
  - {name: "Bestial Wrath", use_when: "on pull and on cooldown (1.18.1); offensive and defensive - pet cannot be stopped short of being killed; save for CC-breaks in PvP"}
  - {name: "Kill Command", use_when: "every time it is usable post-crit (1.18.1); pre-1.18.1 CC3 version doubled as the 12-s pet CC-break, removed in 1.18.1"}
  - {name: "Intimidation", use_when: "pet stun/threat spike; make the pet re-take a mob in dungeons"}
  - {name: "Baited Shot", use_when: "CC3/1.18.0 kit only - obsolete after 2026-03-20; fire the instant it is up after Kill Command, do not Arcane Shot while waiting (shared cooldown, could block the proc)"}
resource_rules:
  - "Kill Command costs 5% base mana, Bestial Wrath 12%; the CC3-kit rotation was mana-hungry ('burns through mana much faster')"
  - "Tallstrider aura, Blessing of Wisdom, mana potions/tea; Aspect of the Viper post-1.18.1 between pulls"
  - "Improved Revive Pet lets you res mid-combat with a low-cost shot if far away, or via Scare Beast/Freeze Trap"
consumables:
  - "As Marksmanship, plus Juju Might/Juju Power and Scrolls for the pet"
  - "T2 5-piece pet bonus needs no line of sight to the pet; T3 4-set +50 AP to hunter and pet (1.18.1, single source)"
  - "Orc Command (+5% pet damage) is the PvE racial pick for BM, contested by 'most likely a skill issue' when compared to top Undead parses"
mistakes_to_avoid:
  - "Letting the pet die (Shadowflame, cleaves) and losing Happiness - a bigger DPS loss for BM than other specs"
  - "Not using the capstone: sitting on Baited Shot (CC3) or Kill Command/Bestial Wrath (1.18.1) instead of pressing them"
  - "Putting Claw on a scorpid/wind serpent and focus-starving Scorpid Poison/Lightning Breath"
  - "Using the wrong pet for the boss - scorpid on poison-immune Kara40 bosses"
  - "Ripping threat with Kill Command + scorpid poison on a weak tank without Blessing of Salvation on the pet"
  - "Spending points in 5/5 Frenzy or Improved Eyes of the Beast instead of damage/hit talents"
  - "Running Serpent Sting on every pull as BM (mana)"
