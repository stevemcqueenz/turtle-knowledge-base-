    - {tree: "Beast Mastery", talent: "Scent of Blood", rank: 3, spell_id: null}
    - {tree: "Beast Mastery", talent: "Bestial Wrath", rank: 1, spell_id: null}
    - {tree: "Beast Mastery", talent: Frenzy, rank: "2-3", spell_id: null}
