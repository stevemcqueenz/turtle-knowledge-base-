  - claim: Kill Command (1.18.1) is off the GCD and stays usable ~4 s into its 8 s cooldown, so a hunter crit roughly every
      4 s keeps it near 100% uptime; measured 99.93% uptime at 33% crit [single source (player-tested), [[d:hunter#1490812124006711457]],
      [[d:hunter#1490826259817562155]]].
    era: post-1.18.1
    agreement: single source
  - claim: 'Same-gear dummy dps: BM 700 vs MM 750 at 33% crit; in Naxx a raptor BM was rank 1 over MM rank 2 on boss fights
      with the pet ~50% of total damage and Kill Command crits of 7,153 [single raid sample, [[d:hunter#1490826259817562155]],
      [[d:hunter#1486419920332787763]]].'
    era: post-1.18.1
    agreement: single source
  stat_weights:
    hit: 8% at 300 weapon skill (forum KB's 9% superseded) [consensus, [[d:hunter#1298063246254932059]]]
    agility: 1 agi = 3 eAP; 53 agi = 1% crit [consensus, [[d:hunter#1488075516060766330]], [[d:hunter#1488074387918688336]]]
    crit: 1% crit = 50+ eAP post-1.18.1 (up from 30 eAP pre-patch), because of MM's new crit scaling [single source, [[d:hunter#1486693663084904448]]]
    haste: 1% haste = 12-14 eAP (MM) / 20-40 (SV); explicitly unverifiable private-sheet weights [contested, [[d:hunter#1488442215729594449]]]
  caps:
    ranged_hit: 8% at 300 weapon skill; 1% hit per 5 weapon skill up to 315 [consensus, [[d:hunter#1298063246254932059]],
      [[d:hunter#1485763124253425858]]]
    weapon_skill: 315 is the cap of the linear bonus; historically buggy above it (316 gave bonus crit, 317/318 nothing) [single
      source, [[d:hunter#1486496701177921701]]]
  pets:
  - claim: 'Pet contribution post-1.18.1: ~50% of BM total damage in Naxx; ~8-10% for MM/SV, under 6% on several Naxx bosses
      [single-raid samples, [[d:hunter#1486419920332787763]], [[d:hunter#1488167502499418182]], [[d:hunter#1486310800736911400]]].'
    era: post-1.18.1
    agreement: single source
  - claim: 'BM pet choice is fight-length dependent: MC scorpid for long fights with an Eyes-of-the-Beast snapshot (4 stacks,
      pop Bestial Wrath/AP trinkets, 5th stack via Eyes of the Beast); ZG snake for short fights/Kill Command; ZG raptor as
      the all-rounder that works in Naxx. Cat fell behind (no damaging special). Wolf is bad for BM (0% damage scaling). Contested
      by family multiplier: Kill Command is multiplied by the family modifier (raptor 1.1 -> 802 vs scorpion 0.94 -> 685 on
      dummy), Coordinated Assault is not [single source, [[d:hunter#1485789832759349258]]].'
    sources:
    - '[[d:hunter#1490837960583549270]]'
    - '[[d:hunter#1490794224499822733]]'
    - '[[d:hunter#1486454996177260656]]'
    - '[[d:hunter#1439002895591805049]]'
