stat_weights:
  ranged_attack_power: 'top: Spirit Bond converts RAP to pet AP/SP; RAP gear beats crit gear for BM [[d:hunter#1488690457738219531]]'
  hit: 8% ranged [[d:hunter#1489060054354366524]]
  agility: ~3.1 AP per agi [[d:hunter#1494819577165516931]]
  crit: enough to keep Kill Command available (a crit with <=4 s KC cooldown left makes it castable) [[d:hunter#1490812124006711457]];
    KC uses pet crit; pet crit capped ~20% [[d:hunter#1491956069902192641]]
  spell_power: none from own gear for the pet; only via Spirit Bond [[d:hunter#1491781102560350259]]
caps:
  ranged_hit: 8% (7% with +5 skill) [[d:hunter#1489060054354366524]]
  pet_crit: ~20% cap via Spirit Bond [[d:hunter#1491956069902192641]]
rotation_single:
- priority: 1
  action: Kill Command
  condition: usable AND pet in melee range of the target AND Steady Shot not casting (no GCD; castable up to 4 s into its
    cooldown window) [[d:hunter#1490812124006711457]], [[d:hunter#1492650379727605830]], [[d:hunter#1484783149413171350]]
- priority: 2
  action: Bestial Wrath
  condition: off cooldown, with trinkets/Rapid Fire
- priority: 3
  action: Steady Shot
  condition: after each Auto Shot without clipping
- priority: 4
  action: Arcane Shot
  condition: after Steady when it fits (single target) [[d:hunter#1493031293343236346]]
- priority: 5
  action: never Aimed Shot or Serpent Sting
  condition: BM [[d:hunter#1488783178050306048]], [[d:hunter#1490968215290118215]]
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Multi-Shot instead of Arcane Shot in the loop
  condition: 2+ targets [[d:hunter#1493031293343236346]]
- targets_min: 3
  priority: 1
  action: Volley opener; Gorilla Thunderstomp pet for packs
  condition: packs [[d:hunter#1491457222100652166]]
aoe_threshold: 2
cooldowns:
- name: Bestial Wrath
  use_when: on cooldown (18 s enrage, 1.5 min) with trinkets
- name: Kill Command
  use_when: whenever usable; macro into every shot ("/cast Kill Command /cast Arcane Shot /cast Steady Shot") [[d:hunter#1493050238653435955]]
- name: Devilsaur Tooth
  use_when: pre-pull, then again after the first pet crit (guarantees a pet crit incl. Kill Command) [[d:hunter#1492033139961368637]]
- name: Molten Emberstone
  use_when: on pull; save Blood Fury (no stack) [[d:hunter#1461363355867676672]]
resource_rules:
- Kill Command 5% base mana, Bestial Wrath 12% ([Jamey (staff), 2026-01-23](https://forum.turtlecraft.gg/viewtopic.php?p=166071#p166071))
- Viper out of long pulls; Brilliant Mana Oil on stat sticks
consumables:
- 'Self: the MM raid kit (see marksmanship-ranged-dps.yaml)'
- 'Pet: Juju Power, Juju Might, Scroll of Strength, Scroll of Agility; drives 7-9k Kill Command crits [[d:hunter#1491073655382212830]],
  [[d:hunter#1490806608312406098]]'
- 'Pet resistances by tier: BWL fire+shadow, AQ nature, Naxx frost+shadow [[d:hunter#1485902382322683904]]'
mistakes_to_avoid:
- Taking Aimed Shot, Mortal Shots or Serpent Sting as BM [[d:hunter#1488783178050306048]], [[d:hunter#1486441588845707435]]
- Casting Kill Command with the pet out of melee range (wastes the cooldown, bug 20736) [[d:hunter#1484783149413171350]]
- Claw on autocast next to a real special [[d:hunter#1489371621343887422]]
- Letting the pet stand in cleaves/breaths; not training resistances [[d:hunter#1485902382322683904]]
- Stacking crit over RAP [[d:hunter#1488690457738219531]]
- Dismissing the pet (halves happiness) instead of leaving it on Stay [[d:hunter#1491067114516381706]]
leveling_by_bracket:
  note: 'Discord-sourced from the archived #hunter channel; see synthesis/classes/hunter/leveling.md for the full route.'
  brackets:
  - bracket: 1-10
    advice: Do the level-10 taming chain; boar is the safe early pet (Charge snap-threat, wide diet); vendor ammo is 200/stack
      and the ammo pouch costs a bag slot.
    sources:
    - '[[d:hunter#1484584442461818981]]'
    - '[[d:hunter#1414390378085224508]]'
    - '[[d:hunter#1422543678517411881]]'
    era: mixed
    agreement: consensus
  - bracket: 10-19
    advice: BM rows 1-2; keep Growl/Bite/Claw current; a Screech bird (owl/bat/carrion) is the strongest AoE-threat leveling
      pet.
    sources:
    - '[[d:hunter#1485409849180426321]]'
    - '[[d:hunter#1415476596680425494]]'
    - '[[d:hunter#1484751722546204763]]'
    era: mixed
    agreement: consensus
  - bracket: 20-29
    advice: BM defensives then Unleashed Fury/Ferocity/Intimidation; 'BM feels weak' at 21 is common but the pet carries;
      Salt Flats Vulture owl (~32) gives early Screech rank 2.
    sources:
    - '[[d:hunter#1484310735457747206]]'
    - '[[d:hunter#1415478653193818132]]'
    era: mixed
    agreement: consensus
  - bracket: 30-39
    advice: Continue BM; Hinterlands Eagle (35-40) knows Screech rank 3 innately despite rank 3 needing 48; unique Hinterlands
      owls give max Screech from ~42.
    sources:
    - '[[d:hunter#1428475590486524116]]'
    - '[[d:hunter#1415479627337568298]]'
    era: mixed
    agreement: single source
  - bracket: 40-49
    advice: 'Level 40 is the melee-SV breakpoint: Untamed Trapper + Lightning Reflexes; common plan is level BM to 40 then
      respec SV and accept tanking; pet aggro starts ripping in the low 40s. ''from 39 to 40, right away when I got untamed
      trapper, my levelling speed became ridiculously faster'' [Sofie].'
    sources:
    - '[[d:hunter#1417950297417978098]]'
    - '[[d:hunter#1455791834709098547]]'
    - '[[d:hunter#1416403076352442469]]'
    - '[[d:hunter#1417540728942366750]]'
    era: mixed
    agreement: consensus
  - bracket: 50-60
    advice: Finish the chosen tree; solo DME lashers from ~54. No distinct post-1.18.1 50-60 report exists.
    sources:
    - '[[d:hunter#1383780310201794651]]'
    era: pre-1.18.1
    agreement: single source
  - bracket: leveling_general
    advice: BM is the consensus leveling spec across all three kit eras; Survival is weak until 40; post-1.18.1 baseline Steady
      Shot at 20 makes MM leveling viable; 'for levelling just stack agility' [Ash].
    sources:
    - '[[d:hunter#1484312036170010798]]'
    - '[[d:hunter#1484311755512610846]]'
    - '[[d:hunter#1415655104622624879]]'
    era: mixed
    agreement: consensus
  - bracket: hardcore
    advice: Boar (tanky, eats anything, Charge snap-threat) or a Screech bird for AoE threat; BM defensives first.
    sources:
    - '[[d:hunter#1484749621845561464]]'
    - '[[d:hunter#1484689711233765478]]'
    era: post-1.18.1
    agreement: consensus
