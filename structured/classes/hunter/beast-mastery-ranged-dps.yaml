patch_validity:
  written_for: "three kits: CC2 (Nov 2024 - Aug 2025), CC3/1.18.0 (Aug 2025 - Mar 2026), 1.18.1 (from 2026-03-20)"
  valid_for_1181: unknown
  notes: "1.18.1 removed Baited Shot and Kill Command's CC3 form, returned Bestial Wrath, added Scent of Blood and reworked Kill Command into a crit-gated capstone (revised 2026-03-19 to 80% pet AP). The Discord work decoded the channel's post-1.18.1 BM raid build (34/17/0, consensus x3) and filled the previously-null talent spell_ids; no turtlogs parse for a full tier exists, so the rotation below stays derived (staff tooltips + player fragments) even though the allocation is now sourced."
