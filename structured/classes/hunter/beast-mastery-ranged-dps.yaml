  rotation_single:
  - claim: No authoritative full BM priority list exists in the channel; the recurring question went unanswered and several
      posters said BM is 'no rotation / macro it' [consensus (gap), [[d:hunter#1486410405952880663]], [[d:hunter#1489057031435587764]]].
