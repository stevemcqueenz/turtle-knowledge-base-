agreement: contested
patch_validity:
  written_for: "three kits: CC2 (Nov 2024 - Aug 2025), CC3/1.18.0 (Aug 2025 - Mar 2026), 1.18.1 (from 2026-03-20)"
  valid_for_1181: unknown
  notes: "1.18.1 removed Baited Shot and Kill Command's CC3 form, returned Bestial Wrath, added Scent of Blood and reworked Kill Command into a crit-gated capstone (revised 2026-03-19 to 80% pet AP). No post-1.18.1 raid DPS log exists in the sources; the post-1.18.1 rotation and talent build below are staff-derived plus early player fragments, not a validated guide."
talents:
  build_name: "1.18.1 bot default (derived from staff tooltips and player fragments; NOT a sourced 51-point list) — deep BM with MM filler"
  build_link: "CC2 endgame link (SvenS2): https://talents.turtlecraft.gg/hunter?points=FQAYBoAoQCQQAAAoCoQBAoACAAAAAAAAAAAAAAAAAAA%3D ; CC3 links (opaque, not decodable from text): https://talents.turtlecraft.gg/hunter?points=FAAaRoQoBBQQB-AoEoABAg- (Illyria), https://talents.turtlecraft.gg/hunter?points=FQAYBoQoBCQQB-AoCoQBAo- (SvenS2)"
  points:
    - {tree: "Beast Mastery", talent: "Endurance Training / Swift Aspects", rank: "1-5", spell_id: null}
    - {tree: "Beast Mastery", talent: "Thick Hide", rank: 3, spell_id: null}
    - {tree: "Beast Mastery", talent: "Improved Revive Pet / Improved Mend Pet", rank: "1-2", spell_id: null}
    - {tree: "Beast Mastery", talent: "Coordinated Assault", rank: 1, spell_id: null}
    - {tree: "Beast Mastery", talent: "Unleashed Fury", rank: 5, spell_id: null}
    - {tree: "Beast Mastery", talent: "Pathfinding", rank: 2, spell_id: null}
    - {tree: "Beast Mastery", talent: "Ferocity", rank: 5, spell_id: null}
    - {tree: "Beast Mastery", talent: "Bestial Discipline", rank: 2, spell_id: null}
