stat_weights:
  ranged_attack_power: "top priority - feeds the pet through Spirit Bond; item RAP-for-crit trades 'improve the hunter's personal DPS but do almost nothing for the pet' [Skurridizo]. Post-1.18.1 Discord: pets do not scale with hunter crit, so BM only needs enough crit to keep Kill Command on cooldown, then stacks RAP [consensus, [[d:hunter#1488161325879267450]]]"
  hit: "8% at 300 weapon skill (corrected below; the forum KB's 9% is vanilla-baseline math) [consensus, [[d:hunter#1298063246254932059]], [[d:hunter#1485763124253425858]]]"
  crit: "enough to keep Kill Command usable (it needs a hunter crit); pets do not inherit crit [consensus, [[d:hunter#1488161325879267450]], [[d:hunter#1486502917342232787]]]"
  haste: "same as MM"
  pet_damage_items: "T0.5 Beastmaster's set + AQ20 Hunter's set + Breastplate of Beast Mastery + Ferra's Collar totalled '13% damage, 4% additional crit and 50 attack power' for the pet per Arcanex Ota, but 'an item giving +9 agility is already better than that pet-damage bonus' once past BWL per Skurridizo"
caps:
  ranged_hit: "8% at 300 ranged weapon skill (not 9%): level-63 hit suppression was removed with the CC2 weapon-skill change [consensus, [[d:hunter#1298063246254932059]]]; weapon skill is linearized at 1% hit per 5 points up to 315 (305 -> 7%, 310 -> 6%, 315 -> 5%) [consensus, [[d:hunter#1485763124253425858]], [[d:hunter#1463846948200124426]]]; +3 racial skill is only 0.6% hit, +5 is the useful threshold [single source x2, [[d:hunter#1491594913136115732]]]"
rotation_single:
  - {priority: 1, action: "Pet attack, Hunter's Mark, Bestial Wrath at the pull and on cooldown", condition: "1.18.1 kit; 18 s enrage, no GCD, 1.5 min cd"}
  - {priority: 2, action: "Kill Command whenever usable", condition: "1.18.1 kit; after any hunter crit, 8 s cd, no GCD, 45 yd, needs line of sight to the pet; off the GCD and lingers ~4 s into its 8 s cd, so a crit every ~4 s keeps it near 100% uptime [single source, [[d:hunter#1490812124006711457]]]; it cannot be cast mid-Steady-cast [single source, [[d:hunter#1493025359409582222]]]"}
  - {priority: 3, action: "Steady Shot after each Auto Shot, never clipping the auto", condition: "crit-fishes for Kill Command and procs Coordinated Assault"}
  - {priority: 4, action: "Arcane Shot on cooldown", condition: "mana available; scales with weapon damage post-1.18.1 and also procs Coordinated Assault"}
  - {priority: 5, action: "Multi-Shot on cooldown", condition: "always fits it in"}
  - {priority: 6, action: "Serpent Sting", condition: "drop it first when mana is short - 'costs almost as much as 2 Steady Shots'"}
  - {priority: 7, action: "Aspect of the Viper", condition: "mana < ~20% on a long fight and no burst planned; swap back to Hawk before damage windows; out-of-combat tool only in raids - 'Aspect of the Viper loses to much dmg imo' [Valkory, [[d:hunter#1485684679708246016]]]"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Multi-Shot on cooldown; keep the single-target loop otherwise", condition: "2-3 targets"}
  - {targets_min: 4, priority: 1, action: "Volley (talented, 3 s cast post-1.18.1, -2 s with Barrage) if available; otherwise stay single-target", condition: "no benchmarked post-1.18.1 AoE data exists"}
aoe_threshold: 4
cooldowns:
  - {name: "Bestial Wrath", use_when: "on pull and on cooldown (1.18.1); offensive and defensive - pet cannot be stopped short of being killed; save for CC-breaks in PvP; effectively always active when used on cooldown [single source, [[d:hunter#1489010656664617093]]]"}
  - {name: "Kill Command", use_when: "every time it is usable post-crit (1.18.1); pre-1.18.1 CC3 version doubled as the 12-s pet CC-break, removed in 1.18.1"}
  - {name: "Intimidation", use_when: "pet stun/threat spike; make the pet re-take a mob in dungeons"}
  - {name: "Baited Shot", use_when: "CC3/1.18.0 kit only - obsolete after 2026-03-20; fire the instant it is up after Kill Command, do not Arcane Shot while waiting (shared cooldown, could block the proc)"}
resource_rules:
  - "Kill Command costs 5% base mana, Bestial Wrath 12%; the CC3-kit rotation was mana-hungry ('burns through mana much faster')"
  - "Tallstrider aura, Blessing of Wisdom, mana potions/tea; Aspect of the Viper post-1.18.1 between pulls"
  - "Improved Revive Pet lets you res mid-combat with a low-cost shot if far away, or via Scare Beast/Freeze Trap"
consumables:
  - "As Marksmanship, plus Juju Might/Juju Power, Scroll of Strength/Agility and a food/agility scroll for the pet"
  - "Pet consumables stack and are what push BM Kill Command crits to 7-9k [consensus, [[d:hunter#1491073655382212830]], [[d:hunter#1490806608312406098]]]"
  - "T2 5-piece pet bonus needs no line of sight to the pet; T3 4-set +50 AP to hunter and pet (1.18.1, single source); T3.5 5-set competes with the T3 4-set [single source, [[d:hunter#1485684117256405168]]]"
  - "Orc Command (+5% pet damage) is the PvE racial pick for BM, contested by 'most likely a skill issue' when compared to top Undead parses"
mistakes_to_avoid:
  - "Letting the pet die (Shadowflame, cleaves) and losing Happiness - a bigger DPS loss for BM than other specs"
  - "Not using the capstone: sitting on Baited Shot (CC3) or Kill Command/Bestial Wrath (1.18.1) instead of pressing them"
  - "Under-buffing the pet as BM - pet scrolls/jujus drive 7-9k Kill Commands [single source, [[d:hunter#1490807845078434054]]]"
  - "Putting Claw on a scorpid/wind serpent and focus-starving Scorpid Poison/Lightning Breath"
  - "Using the wrong pet for the boss - scorpid on poison-immune Kara40 bosses"
  - "Ripping threat with Kill Command + scorpid poison on a weak tank without Blessing of Salvation on the pet"
  - "Spending points in 5/5 Frenzy or Improved Eyes of the Beast instead of damage/hit talents"
  - "Running Serpent Sting on every pull as BM (mana)"
leveling_by_bracket:
  note: "Discord-sourced from the archived #hunter channel; see synthesis/classes/hunter/leveling.md for the full route."
  brackets:
    - {bracket: "1-10", advice: "Do the level-10 taming chain; boar is the safe early pet (Charge snap-threat, wide diet); vendor ammo is 200/stack and the ammo pouch costs a bag slot.", sources: ["[[d:hunter#1484584442461818981]]", "[[d:hunter#1414390378085224508]]", "[[d:hunter#1422543678517411881]]"], era: mixed, agreement: consensus}
    - {bracket: "10-19", advice: "BM rows 1-2; keep Growl/Bite/Claw current; a Screech bird (owl/bat/carrion) is the strongest AoE-threat leveling pet.", sources: ["[[d:hunter#1485409849180426321]]", "[[d:hunter#1415476596680425494]]", "[[d:hunter#1484751722546204763]]"], era: mixed, agreement: consensus}
    - {bracket: "20-29", advice: "BM defensives then Unleashed Fury/Ferocity/Intimidation; 'BM feels weak' at 21 is common but the pet carries; Salt Flats Vulture owl (~32) gives early Screech rank 2.", sources: ["[[d:hunter#1484310735457747206]]", "[[d:hunter#1415478653193818132]]"], era: mixed, agreement: consensus}
    - {bracket: "30-39", advice: "Continue BM; Hinterlands Eagle (35-40) knows Screech rank 3 innately despite rank 3 needing 48; unique Hinterlands owls give max Screech from ~42.", sources: ["[[d:hunter#1428475590486524116]]", "[[d:hunter#1415479627337568298]]"], era: mixed, agreement: single source}
    - {bracket: "40-49", advice: "Level 40 is the melee-SV breakpoint: Untamed Trapper + Lightning Reflexes; common plan is level BM to 40 then respec SV and accept tanking; pet aggro starts ripping in the low 40s. 'from 39 to 40, right away when I got untamed trapper, my levelling speed became ridiculously faster' [Sofie].", sources: ["[[d:hunter#1417950297417978098]]", "[[d:hunter#1455791834709098547]]", "[[d:hunter#1416403076352442469]]", "[[d:hunter#1417540728942366750]]"], era: mixed, agreement: consensus}
    - {bracket: "50-60", advice: "Finish the chosen tree; solo DME lashers from ~54. No distinct post-1.18.1 50-60 report exists.", sources: ["[[d:hunter#1383780310201794651]]"], era: pre-1.18.1, agreement: single source}
    - {bracket: leveling_general, advice: "BM is the consensus leveling spec across all three kit eras; Survival is weak until 40; post-1.18.1 baseline Steady Shot at 20 makes MM leveling viable; 'for levelling just stack agility' [Ash].", sources: ["[[d:hunter#1484312036170010798]]", "[[d:hunter#1484311755512610846]]", "[[d:hunter#1415655104622624879]]"], era: mixed, agreement: consensus}
    - {bracket: hardcore, advice: "Boar (tanky, eats anything, Charge snap-threat) or a Screech bird for AoE threat; BM defensives first.", sources: ["[[d:hunter#1484749621845561464]]", "[[d:hunter#1484689711233765478]]"], era: post-1.18.1, agreement: consensus}
