stat_priority:
- hit
- agility
- ranged-attack-power
- crit
- haste
stat_priority_note: 'The same ranged stats as Marksmanship, but in a different order: this array ranks agility and ranged
  attack power above crit and puts haste last, where the Marksmanship array has haste second and agility last. The BM guide
  summarises the Marksmanship order as hit to cap, then agility, attack power, crit and haste — that summary is this repository''s
  own prose, not a forum source — while the Marksmanship guide''s own bulleted order ranks haste second and agility last.
  The two arrays therefore differ on haste, agility and attack power, and each follows its own guide''s sourced bullets. Ranged
  attack power ranks above crit because RAP is what feeds the pet through Spirit Bond: Naxx/Kara40 items that trade AP for
  crit ''improve the hunter''s personal DPS but do almost nothing for the pet'' [Skurridizo p=170469]. Post-1.18.1 hunter
  crit still matters because Kill Command needs a hunter crit. Pet-damage set bonuses lose to +9 agility past BWL. Agility
  and ranged attack power are a tie: no cited post ranks them against each other, so their order in the array above carries
  no ranking. Grouping them is this repository''s reading of the sources listed above.'
