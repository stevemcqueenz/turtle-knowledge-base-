  for Lock and Load.
guide: guide/classes/hunter/marksmanship.md
stat_priority:
- hit
- haste
- crit
- ranged-attack-power
- agility
stat_priority_note: 'Order as the playbook''s sourced bullets run: hit to the cap your weapon skill implies (9% at 300 skill,
  6% at 305 with racial +5 bows/guns), then haste — the Turtle-specific stat, ~0.9% damage per 1% with no diminishing returns
  — then crit, then attack power and agility. Armor penetration (''generally weak'') and spell power (dead weight for MM)
  are explicitly not stats to gear for. Whether AP enchants or haste win is contested and gear-dependent. Attack power and
  agility are a tie: no cited post ranks them against each other, so their order in the array above carries no ranking. Grouping
  them is this repository''s reading of the sources listed above.'
