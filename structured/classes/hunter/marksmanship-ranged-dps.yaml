agreement: contested
patch_validity:
  written_for: "CC2/CC3 talent tree (Nov 2024 - Mar 2026), Steady Shot as a talent"
  valid_for_1181: false
  notes: "1.18.1 (live 2026-03-20) made Steady Shot and Trueshot Aura baseline, added Aimed Shot as the MM keystone, Experimental Ammunition and Lock and Load, and rebalanced Arcane Shot/Volley/Serpent Sting mana. Staff: 'Ranged variant of Hunter has fallen behind other damage dealers ... in raw DPS and in terms of gameplay' [Jamey, 2026-01-23]. No player posted a validated post-1.18.1 PvE build or DPS numbers before the 2026-05-15 shutdown; the post-1.18.1 rotation below is staff-tooltip-derived plus player fragments only."
talents:
  build_name: "Pre-1.18.1 deep MM raid build (union of named picks, no single full 51-point post exists)"
  build_link: "https://talents.turtlecraft.gg/hunter?points=FQAYBoAoQCQQAAAoCoQBAoACAAAAAAAAAAAAAAAAAAA%3D (SvenS2's endgame link, opaque)"
