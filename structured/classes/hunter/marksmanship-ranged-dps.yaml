stat_weights:
  hit: ranged hit to 8% (7% with +5 ranged weapon skill); 9% without skill vs 8%+305 skill; do not overcap [[d:hunter#1489060054354366524]],
    [[d:hunter#1486358400244777121]], [[d:hunter#1478175832966041633]]
  agility: 1 agi ~3.1 AP; 52-53 agi = 1% crit [[d:hunter#1494819577165516931]], [[d:hunter#1491741421059833897]]
  crit: ~50 eAP per 1% since 1.18.1 (Lock and Load); no cap [[d:hunter#1486705272167858227]], [[d:hunter#1485067966650519572]]
  ranged_attack_power: 1.0 (baseline)
  haste: 'contested: weak/clip-prone for MM (does not shorten the GCD) [[d:hunter#1491111488214007951]], [[d:hunter#1490408532057526615]]
    vs ~1% dps per 10% [[d:hunter#1490408079089471508]]; sim weight 15.88'
  spell_power: ~0.43; full SP consumes only +1-2% (Arcane Shot ~9% of boss damage) [[d:hunter#1490854183237324840]], [[d:hunter#1491912659304583369]]
  armor_penetration: ~0.6 [[d:hunter#1494829518886801519]]
  sim_weights_naxx: Agi 3.35, Crit 47.88, Haste 15.88, RAP 1.00, ranged weapon DPS 13.59, SP 0.43, ArP 0.59, Hit 0 once capped
    (Sofie, Vellasta sim) [[d:hunter#1494829518886801519]]
caps:
  ranged_hit: 8% (7% with +5 skill; each 5 skill = 1%); +3 racial = 0.6% [[d:hunter#1489060054354366524]], [[d:hunter#1485763124253425858]],
    [[d:hunter#1491594913136115732]]
  weapon_speed: ~3.3 ranged weapon speed is optimal for weaving Arcane without clipping [[d:hunter#1492170200219652260]]
rotation_single:
- priority: 1
  action: Keep Auto Shot running; never start a cast in the last 0.5 s before an auto
  condition: always [[d:hunter#1471459155179995167]]
- priority: 2
  action: Aimed Shot
  condition: Lock and Load buff up (10 s, -1 s cast)
- priority: 3
  action: Aimed Shot
  condition: off cooldown
- priority: 4
  action: Arcane Shot
  condition: Enchanted (Arcane) Ammunition up AND the Aimed Shot has already landed (cast after the next Steady) [[d:hunter#1484610058904928467]],
    [[d:hunter#1485089214046539917]]
- priority: 5
  action: Steady Shot
  condition: after each Auto Shot, if it will not clip
- priority: 6
  action: Arcane Shot
  condition: after Steady if it fits without clipping, or while moving (crit roll for Lock and Load) [[d:hunter#1488527231008641095]]
- priority: 7
  action: Serpent Sting
  condition: only if the raid wants the Nature Ammunition -240 armor debuff [[d:hunter#1488876111252160624]]
- priority: 8
  action: skip Multi-Shot
  condition: 'single target: cannot proc Lock and Load; Fire ammo explosion bugged ~50 dmg [[d:hunter#1486698734736642089]],
    [[d:hunter#1484664003497300118]]'
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Multi-Shot when it fits; spend Fire Ammunition on it
  condition: 2+ targets [[d:hunter#1494752221303279848]]
- targets_min: 3
  priority: 1
  action: Volley opener (1 s cast with Barrage 3/3), Multi-Shot, then Lock and Load Aimed Shot down a line of mobs
  condition: packs; pierce line is ~1 px wide [[d:hunter#1484723679286923335]], [[d:hunter#1484829044494172222]]
aoe_threshold: 3
cooldowns:
- name: Rapid Fire
  use_when: on pull / with Bloodlust; also -40% Aimed/Steady cast; shares category with Juju Flurry [[d:hunter#1489692709550817407]],
    [[d:hunter#1489794704836137140]]
- name: On-use trinkets
  use_when: Badge of the Swarmguard + Jom Gabbar opener, then swap to Heart of Hakkar + Slayer's Crest [[d:hunter#1482615147359895697]]
- name: Feign Death
  use_when: threat drop (MM rips threat without cooldowns); Improved Feign Death mandatory [[d:hunter#1486215019384541225]],
    [[d:hunter#1484218976014831677]]
- name: Aspect of the Viper
  use_when: Hawk until low mana, then Viper to the end of the fight; Viper ticks generate threat [[d:hunter#1478128745838674021]],
    [[d:hunter#1491714117369724928]]
- name: ZG Renataki trinket
  use_when: trash; resets Volley [[d:hunter#1484688430268022955]]
resource_rules:
- Mana is tight until 6-piece T3; Flask of Wisdom until then [[d:hunter#1485585355523624971]]
- Double Brilliant Mana Oil + Mageblood + Blessing of Wisdom lets you skip Viper [[d:hunter#1494657155985444864]]
- Unbuffed dummy OOM in ~1 min post-patch [[d:hunter#1484987246099566732]]
consumables:
- 'Base: Spirit of Zanza, Elixir of the Mongoose, Ground Scorpok Assay, Juju Might, Danonzo''s Tel''Abim Surprise or Squid
  Eel Skewer, Consecrated Sharpening Stone vs undead [[d:hunter#1486496184280420533]]'
- 'Min-max: Flask of Supreme Power, Mageblood, Greater Arcane Elixir, Elixir of Greater Arcane/Nature Power, Dreamshard Elixir,
  Dreamtonic, Brilliant Wizard Oil; pet: Juju Power/Might, Agility scroll [[d:hunter#1486496184280420533]]'
- Firewater is melee AP only; Juju Power does not stack with Elixir of the Giants; scrolls do not stack with elixirs [[d:hunter#1494293768617332827]],
  [[d:hunter#1486561195228926154]], [[d:hunter#1471637818047729799]]
- 'Ammo: Doomshot BiS; enchanter +3 dps per stack [[d:hunter#1484724163993145427]], [[d:hunter#1485358374832046221]]'
- 'Ranged enchant: Facetted Crystal Scope (+2% crit) [[d:hunter#1485556365173850123]]'
mistakes_to_avoid:
- Chasing every Experimental Ammunition proc (measured DPS loss) [[d:hunter#1485384949455392868]]
- Casting Arcane Shot while the Aimed Shot is still in flight (loses the ammo buff) [[d:hunter#1485024955962753145]]
- Multi-Shot on one target [[d:hunter#1486698734736642089]]
- Stacking haste / overcapping hit [[d:hunter#1490408532057526615]], [[d:hunter#1478175832966041633]]
- Clipping Auto Shot
- Playing MM fresh at 60 with low crit (Lock and Load rarely procs) [[d:hunter#1485396418599587942]]
- Trusting BetterCharacterStats right after a patch [[d:hunter#1485077323584765992]]
