      with Auto always in between [single source (guide writer, patch day), [[d:hunter#1484616991951032550]]].'
    era: post-1.18.1
    agreement: single source
  - claim: 'Most-cited practical weave: begin casting Steady the instant Auto is loosed; while Steady casts, spam Arcane so
      it fires immediately after Steady; repeat. Drop Arcane if conserving mana [consensus, [[d:hunter#1489708299913003218]],
      [[d:hunter#1489709233007235133]], [[d:hunter#1486314699443277854]]].'
    era: post-1.18.1
    agreement: consensus
