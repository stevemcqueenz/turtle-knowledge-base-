stat_weights:
  hit: "9% to cap at 300 weapon skill; ~6% at 305 (racial +5 bow/gun skill); ~5% at 315 (Trueaim Gauntlets + Sash of the Grand Hunt); a BiS-list author treats 7% as the practical minimum on current itemization; '1% hit is always a (slightly more than) 1% damage increase until you reach hit cap' [Juzam]; do not over-cap once T3 + Naxx hit gear is worn"
  haste: "Turtle-specific stat: '1% haste is around 0.9% damage increase on bosses (single target) and 0.85% overall', no diminishing returns; becomes as good as crit in full Naxx gear [Juzam]; Rapid Fire cuts Steady from 1.5s to 1.1s; 1.18.1 also cuts Aimed Shot cast by 40% under Rapid Fire (staff)"
  crit: "~0.9% damage per 1% for a raid-buffed Naxx hunter, slight diminishing returns; 53 agi = 1% crit, 1 agi = 2 RAP"
  attack_power_agility: "measure per-item via unequip-and-read-DPS method; ~34 AP per 1% DPS at 340 base DPS per one measurement [Juzam]; spreadsheet weights: 1 agi = 3 AP-eq, 1% crit = 30 AP-eq [ajax_808]"
  armor_penetration: "weak / largely ignored"
  spell_power: "irrelevant for MM pre-1.18.1 (raising SP loses RAP); T2.5 spell power dead weight"
  intellect_spirit_mp5: "matters on long fights but MM rarely goes OOM with Efficiency talented; post-1.18.1 Aspect of the Viper replaces drinking between pulls"
caps:
  melee_range_hit: "9% at 300 weapon skill (vanilla-baseline math; Turtle's exact linearized weapon-skill table is not published by staff)"
rotation_single:
  - {priority: 1, action: "Opener: pet attack (explicit key), Hunter's Mark, Aimed Shot only if the tank already has threat", condition: "pre-1.18.1 kit; post-1.18.1 Aimed Shot becomes a repeatable cooldown, not an opener-only cast"}
  - {priority: 2, action: "Serpent Sting once", condition: "fight >= 30 s and mana allows; skip on trash and low mana"}
  - {priority: 3, action: "Multi-Shot on cooldown (10 s), placed right after a Steady Shot so it does not delay the next Auto Shot", condition: "pre-1.18.1"}
  - {priority: 4, action: "Steady Shot immediately after every Auto Shot", condition: "never delay the auto; with 3.2 speed and both haste buffs there is only ~29 ms of slack"}
  - {priority: 5, action: "Arcane Shot", condition: "pre-1.18.1: only while moving or as filler with spare mana; post-1.18.1: on cooldown when mana >= 40%, now scales with weapon damage and is usable while moving"}
  - {priority: 6, action: "Do not re-cast Aimed Shot mid-fight", condition: "pre-1.18.1 kit only"}
  - {priority: 7, action: "Aimed Shot on cooldown (2 s cast, 20 s cd with Swiftshot 3/3; 1 s with Lock and Load)", condition: "post-1.18.1 kit; cast right after an auto like Steady"}
  - {priority: 8, action: "Lock and Load proc: cast Aimed immediately", condition: "post-1.18.1 kit; reset from a Steady/Aimed/Arcane crit"}
  - {priority: 9, action: "Spend the Experimental Ammunition buff before it cycles (1 min): Arcane -> Arcane Shot; Nature -> Serpent Sting; Fire -> Multi-Shot on 2+ targets", condition: "post-1.18.1 kit; staff describes the order as cycling Fire->Arcane->Nature, some players perceived it as random"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Multi-Shot on cooldown, keep the single-target loop otherwise; spread Serpent Sting only with plentiful mana", condition: "2-3 targets"}
  - {targets_min: 4, priority: 1, action: "pre-1.18.1: skip Volley except vs large trash packs ('less than 8 targets it's actually a loss of dps' on the old channeled version); post-1.18.1: Volley (3 s cast, -2 s with Barrage) plus Fire-ammunition Multi-Shot, unbenchmarked", condition: "4+ targets"}
aoe_threshold: 4
cooldowns:
  - {name: "Rapid Fire", use_when: "start of every boss and on cooldown for fights > 15 s; speeds Steady Shot casts and post-1.18.1 Aimed Shot by 40%; do not waste it while moving"}
  - {name: "Aspect of the Viper", use_when: "post-1.18.1 only, mana < 20% with no burst planned or out of combat; swap back to Hawk before pulling (swaps cost mana and a GCD)"}
  - {name: "Feign Death", use_when: "threat drop every 30 s; pet on follow/passive first"}
resource_rules:
  - "Five-second rule: bundle spells into bursts, then coast on Auto Shot to regen"
  - "Raid regen from Blessing of Wisdom, mana totem, mana potions/tea, mana oil"
  - "Drink out of combat below ~40% mana; hunters run '40-50% less mana' than casters"
consumables:
  - "Mana flask, Lesser Mana Oil x2, Mongoose, Mageblood, Grilled Squid, Ranged Bananafood, Major Mana Potion, Demonic Rune, Juju Might/Power for the pet, plus defensive consumables (raid list, Likaleo 2024-03-28)"
  - "Elixir of Demonslaying, sharpening stones and the engineering chicken do NOT affect ranged damage"
  - "Doomshot/Miniature Cannonballs best ammo, then AV quartermaster, then engineer Thorium; carry both arrow and bullet stacks"
  - "Slowest ranged weapon available for the Steady/Multi weave (>= 3.2 speed); shoulder enchant Sapphiron AP/crit or 2% haste"
mistakes_to_avoid:
  - "Clipping Auto Shot with Steady Shot"
  - "Casting Aimed Shot mid-fight pre-1.18.1, or standing still through an Aimed cast while a boss cleaves"
  - "Wasting mana on Serpent Sting/Arcane Shot on trash that dies in 3 seconds"
  - "Combined pet-attack + auto-shot macros in dungeons (pet body-pulls)"
  - "Forgetting the pet is out during pulls, or letting it die in cleaves/Shadowflame instead of using Take Position"
  - "Running out of ammo, or carrying only one ammo type"
  - "Needing on melee weapons/leather"
  - "Feigning with the pet still attacking (keeps you in combat)"
  - "Not feeding the pet before bosses; sitting in Aspect of the Viper during a burst window"
  - "Swapping aspects fluidly - each swap costs mana and halts regen for 5 s"
