stat_weights:
  hit: "8% to cap at 300 ranged weapon skill (CORRECTED from the forum KB's 9%): level-63 hit suppression was removed with the CC2 weapon-skill change [consensus, [[d:hunter#1298063246254932059]]]. Weapon skill is linearized at 1% hit (and 10% glance damage) per 5 points up to 315: 305 -> 7%, 310 -> 6%, 315 -> 5% [consensus, [[d:hunter#1485763124253425858]], [[d:hunter#1463846948200124426]]]. +3 racial skill is only 0.6% hit and effectively worthless; +5 is the useful threshold [single source x2, [[d:hunter#1491594913136115732]]]. '1% hit is always a (slightly more than) 1% damage increase until you reach hit cap' [Juzam]; do not over-cap once T3 + Naxx hit gear is worn"
  haste: "Turtle-specific stat: '1% haste is around 0.9% damage increase on bosses (single target) and 0.85% overall', no diminishing returns; becomes as good as crit in full Naxx gear [Juzam]. Post-1.18.1 the channel's (unverified) weight is 1% haste = 12-14 eAP for MM [contested, [[d:hunter#1488442215729594449]]]; haste's net value is unresolved because it does not affect the GCD and increases clipping [contested, [[d:hunter#1491111488214007951]]]"
  crit: "~0.9% damage per 1% for a raid-buffed Naxx hunter, slight diminishing returns; 53 agi = 1% crit, 1 agi = 2 RAP [Juzam]. Post-1.18.1 crit rose to 'like 50 or 60' eAP because of MM's new crit scaling [single source, [[d:hunter#1486693663084904448]]] - the pre-1.18.1 '1% crit = 30 AP-eq' [ajax_808] is SUPERSEDED for 1.18.1"
  attack_power_agility: "measure per-item via unequip-and-read-DPS method; ~34 AP per 1% DPS at 340 base DPS per one measurement [Juzam]. Post-1.18.1 channel weights: 1 agi = 3 eAP, 1 AP = 1 eAP, 100 ArP = 60 eAP if armor remains [contested (author flags unverifiable), [[d:hunter#1488075516060766330]], [[d:hunter#1488073642024763503]]]"
  armor_penetration: "weak / largely ignored"
  spell_power: "nearly worthless post-1.18.1: full SP consumes (~300 SP) translate to only ~1-2% dps [single source, [[d:hunter#1490854183237324840]]]"
  intellect_spirit_mp5: "matters on long fights but MM rarely goes OOM with Efficiency talented; post-1.18.1 Aspect of the Viper replaces drinking between pulls"
caps:
  melee_range_hit: "8% at 300 ranged weapon skill (CORRECTED: the forum KB's 9% is vanilla-baseline math; Turtle removed level-63 hit suppression with the CC2 weapon-skill change) [consensus, [[d:hunter#1298063246254932059]]]; 305 -> 7%, 310 -> 6%, 315 -> 5% [consensus, [[d:hunter#1485763124253425858]]]"
  weapon_skill_note: "above 315 has historically been buggy (316 gave bonus crit, 317/318 did nothing) [single source, [[d:hunter#1486496701177921701]]]"
rotation_single:
  - {priority: 1, action: "Keep Auto Shot running and never clip it", condition: "all kits; post-1.18.1 the Auto -> Aimed -> Ammunition-filler -> Steady loop is the FAQ baseline"}
  - {priority: 2, action: "Aimed Shot on cooldown (2 s cast, 20 s cd with Swiftshot 3/3; 1 s with Lock and Load)", condition: "post-1.18.1; cast right after an auto like Steady; Rapid Fire cuts its cast 40%. Measured casts: 0.81 s (RF+Imp Aspects+LnL), 1.22 s (Imp Aspects+LnL), 1.94 s (Imp Aspects alone), 2.15 s (no proc), 2.5 s unhasted [single source, [[d:hunter#1489733155719217306]]]"}
  - {priority: 3, action: "Lock and Load proc: cast Aimed immediately", condition: "post-1.18.1; reset from a Steady/Aimed/Arcane crit; the proc is 100% on crit and a 'proc did not reset Aimed CD' bug was reported day one [single source, [[d:hunter#1484523895498215485]], [[d:hunter#1484641146033668208]]]; its line cleave is a strict line (1 yd behind the primary misses) [single source, [[d:hunter#1484829044494172222]]]"}
  - {priority: 4, action: "Arcane Shot on cooldown while mana allows; spam it during the Steady cast so it fires immediately after", condition: "post-1.18.1: it is the Lock-and-Load/Experimental-Ammunition trigger, hits hard, and is usable while moving [consensus, [[d:hunter#1489708299913003218]], [[d:hunter#1484284557074235463]]]; drop it when conserving mana"}
  - {priority: 5, action: "Spend the Experimental Ammunition buff before it cycles (1 min): Fire -> Multi-Shot on 2+; Arcane -> Arcane Shot; Nature -> Serpent Sting", condition: "post-1.18.1 staff tooltip cycles Fire->Arcane->Nature; some players perceived it as random [contested, [[d:hunter#1484528608927027270]], [[d:hunter#1484580912355348591]]]. The ammunition mini-game is widely treated as skippable - forcing all three hurt several players' dps [consensus, [[d:hunter#1485091452701900902]], [[d:hunter#1486285247866998784]]]; the Fire Multi-Shot component is 'a flat 50 dmg every time' [single source, [[d:hunter#1484664003497300118]]]"}
  - {priority: 6, action: "Multi-Shot on cooldown when it fits between autos", condition: "pre-1.18.1 consensus; Multi vs Arcane for single target is contested [contested, [[d:hunter#1485387517455896597]], [[d:hunter#1486261383761891398]]]"}
  - {priority: 7, action: "Steady Shot as the filler after every auto", condition: "never delay the auto; 'only shoot Steady when there's nothing else to do' [consensus, [[d:hunter#1486255776367382598]]]"}
  - {priority: 8, action: "Serpent Sting only for the Nature-ammunition -240 armor raid debuff (and on long fights)", condition: "post-1.18.1 the guide author calls it a personal dps loss and a mana drain [single source (guide writer), [[d:hunter#1485384949455392868]]]; the pre-1.18.1 'long-fight DoT' use is superseded"}
  - {priority: 9, action: "Do not re-cast Aimed Shot mid-fight (pre-1.18.1 kit); one-button macro casts Steady unless Lock and Load is up, then Aimed", condition: "post-1.18.1 [consensus, [[d:hunter#1485087170451603508]], [[d:hunter#1488624322686746945]]]"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Multi-Shot on cooldown, keep the single-target loop otherwise; leading with Aimed so its line cleave hits multiple targets can beat Multi-Shot with correct positioning", condition: "2-3 targets; post-1.18.1"}
  - {targets_min: 4, priority: 1, action: "Volley (3 s cast, -2 s with Barrage) on cooldown plus Fire-ammunition Multi-Shot; the ZG Renataki trinket resets its cooldown", condition: "post-1.18.1; pre-1.18.1 'less than 8 targets it's actually a loss of dps' [Juzam]; no benchmarked post-1.18.1 crossover exists"}
aoe_threshold: 4
cooldowns:
  - {name: "Rapid Fire", use_when: "start of every boss and on cooldown for fights > 15 s; cuts Aimed/Steady cast by 40% (1.18.1); do not waste it while moving"}
  - {name: "Aspect of the Viper", use_when: "post-1.18.1 only, mana < 20% with no burst planned or out of combat; swap back to Hawk before pulling (swaps cost mana and a GCD)"}
  - {name: "Feign Death", use_when: "threat drop every 30 s; pet on follow/passive first. The new 1.18.1 burst rips threat without cooldowns, so FD is spent on threat instead of trinket swaps [single source, [[d:hunter#1486314061606944911]]]"}
  - {name: "ZG (Renataki) trinket", use_when: "standard trash/AoE trinket; resets Volley/Multi cooldowns [consensus, [[d:hunter#1485135076483272704]]]"}
resource_rules:
  - "Five-second rule: bundle spells into bursts, then coast on Auto Shot to regen"
  - "Raid regen from Blessing of Wisdom, mana totem, mana potions/tea, mana oil; Mageblood/Shadow Oil are called insufficient in Naxx [single source, [[d:hunter#1485684679708246016]]]"
  - "Mana is the post-1.18.1 constraint; one MM never goes OOM in raid, another OOMs in ~40 s on an unbuffed dummy [contested, [[d:hunter#1485957589316669572]], [[d:hunter#1485958275458400326]]]"
consumables:
  - "Mana flask, Lesser Mana Oil x2, Mongoose, Mageblood, Grilled Squid, Ranged Bananafood, Major Mana Potion, Demonic Rune, Juju Might/Power for the pet, plus defensive consumables (raid list, Likaleo 2024-03-28)"
  - "Post-1.18.1 raid list: Spirit of Zanza, Elixir of the Mongoose, Ground Scorpok Assay, Juju Might, Danonzo's Tel'abim Surprise or Squid Eel Skewer, Consecrated Sharpening Stone (undead); min-max adds Flask of Supreme Power, Mageblood, Greater Arcane Elixir, Dreamshard Elixir, Juju Power (pet), Brilliant Wizard Oil, Dreamtonic, Agility Scroll (pet) [single source x2, [[d:hunter#1486496184280420533]], [[d:hunter#1486562197428764716]]]"
  - "Ammo overhaul: any ammo stack can be enchanted +3 dps (1 Large Brilliant Shard + 5 Arcane Dust per 200), so Thorium = 20.5 dps, Doomshot = 23 dps; new Bright Wood / Shade Wood / Smooth Ironfeather / Starfeather arrows and Enchanted Thorium Shells; a 19-damage blue arrow recipe drops from the DM West hunter boss [consensus, [[d:hunter#1485358374832046221]], [[d:hunter#1485738412853170369]], [[d:hunter#1486414327211884574]]]"
  - "Facetted Crystal Scope (+2% ranged crit, Draenei rep) is the BiS scope; initially bugged/not displayed but a 1000-shot test confirmed it works [consensus, [[d:hunter#1485281837176586401]], [[d:hunter#1486672868036317204]]]"
  - "BM/MM melee stat sticks: Kingsfall + Scythe of the Unseen Path even in full Kara40 BiS (60 Agi with two +15 Agi enchants, +2% crit, ~120 AP) [single source, [[d:hunter#1489311954748178682]]]; T3 4/8 with a pet, 6/8 without [single source, [[d:hunter#1485684117256405168]]]"
  - "Slowest practical ranged weapon for the weave is now '2.6 speed or slower' post-1.18.1 (Aimed/Arcane fill the gaps) [consensus, [[d:hunter#1489320174745288867]]], superseding the old >= 3.2 rule"
mistakes_to_avoid:
  - "Clipping Auto Shot with Steady Shot (the dominant MM failure; some accept a controlled 0.25 s clip for a 3k Aimed [consensus, [[d:hunter#1485676134380343307]], [[d:hunter#1488579158274740244]]])"
  - "Casting Aimed Shot mid-fight pre-1.18.1, or standing still through an Aimed cast while a boss cleaves"
  - "Chasing Experimental Ammunition procs at the cost of positioning and smooth damage [consensus, [[d:hunter#1485091452701900902]], [[d:hunter#1486285247866998784]]]"
  - "Over-stacking haste and clipping more [contested/unresolved, [[d:hunter#1491111488214007951]]]"
  - "Running under the ranged hit cap (8%), or using Tranquilizing Shot uncapped - an uncapped tranq on the BWL dogs can wipe the raid [single source, [[d:hunter#1491414293143621824]]]"
  - "Casting Serpent Sting for personal damage as MM (dps/mana loss) [single source (guide writer), [[d:hunter#1485384949455392868]]]"
  - "Wasting mana on Serpent Sting/Arcane Shot on trash that dies in 3 seconds"
  - "Combined pet-attack + auto-shot macros in dungeons (pet body-pulls)"
  - "Forgetting the pet is out during pulls, or letting it die in cleaves/Shadowflame instead of using Take Position"
  - "Running out of ammo, or carrying only one ammo type"
  - "Feigning with the pet still attacking (keeps you in combat)"
  - "Not feeding the pet before bosses; sitting in Aspect of the Viper during a burst window"
