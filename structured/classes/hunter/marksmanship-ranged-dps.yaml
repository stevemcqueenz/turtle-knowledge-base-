      when there's nothing else to do' [consensus, [[d:hunter#1486255776367382598]], [[d:hunter#1485478994525818951]]].
    era: post-1.18.1
    agreement: consensus
  - claim: Post-1.18.1 MM is widely called overloaded and clip-prone; several players preferred the pre-patch feel [consensus
      among MM players, [[d:hunter#1485676134380343307]], [[d:hunter#1486486042822574122]]].
    era: post-1.18.1
    agreement: consensus
  - claim: 'Dresche''s post-Kara40 verdict: MM boss fights great / trash fights awful; ''just prioritize steady, aimed, multi''
      and the ammunition mini-game was a dps loss [single source (guide writer), [[d:hunter#1485384949455392868]]].'
    era: post-1.18.1
    agreement: single source
  - claim: Measured personal dps rose 'at least 15%' on a bad-rotation MC run, expecting 20-25% with practice [single source,
      [[d:hunter#1484606051881062511]]].
    era: post-1.18.1
    agreement: single source
  - claim: On BWL MM out-dpsed a Survival hunter on every single-target boss but lost overall trash [single source, [[d:hunter#1484692203434414130]]].
    era: post-1.18.1
    agreement: single source
