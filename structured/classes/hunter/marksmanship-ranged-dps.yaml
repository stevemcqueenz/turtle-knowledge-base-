patch_validity:
  written_for: "CC2/CC3 talent tree (Nov 2024 - Mar 2026), Steady Shot as a talent"
  valid_for_1181: true
  notes: "1.18.1 (live 2026-03-20) made Steady Shot and Trueshot Aura baseline, added Aimed Shot as the MM keystone, Experimental Ammunition and Lock and Load, and rebalanced Arcane Shot/Volley/Serpent Sting mana. Staff: 'Ranged variant of Hunter has fallen behind other damage dealers ... in raw DPS and in terms of gameplay' [Jamey, 2026-01-23]. The Discord extraction decoded the channel's post-1.18.1 MM build (5/39/7, consensus x3) and captured the working release-day loop; the allocation is now sourced but the priority remains player-fragment-derived. The forum KB's 9%-at-300-skill hit cap is corrected to 8% (see caps)."
