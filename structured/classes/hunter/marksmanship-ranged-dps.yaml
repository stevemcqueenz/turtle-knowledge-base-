  mistakes_to_avoid:
  - Clipping Auto Shot with the new MM weave.
  - Chasing Experimental Ammunition procs at the cost of positioning.
  - Over-stacking haste on MM and clipping more.
  - Running under the 8% ranged hit cap (and using Tranq Shot uncapped).
  - Casting Serpent Sting for personal damage as MM.
