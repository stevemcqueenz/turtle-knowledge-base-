  - "Enchant lists exist only for Holy and Protection (from a single 2022 guide by Unchallenged, last edited 2024-12-04); no enchant list exists for Retribution beyond the fragment already in retribution-melee-dps.md, and the AP-vs-SP enchant choice per slot is explicitly unresolved there."
