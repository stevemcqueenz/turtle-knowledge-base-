about: >
  Gear recommendations for Paladin (Holy healer, Protection tank, Retribution melee DPS)
  by spec/role and level bracket, with where-to-obtain, built from the Paladin forum
  (f41), General-forum BiS threads, the existing class playbooks' "Gear, enchants and
  consumables" sections, and the Itemization forum's relic list and 1.18.1 changelog.
  Every "is there a Turtle BiS list" thread in the Paladin forum gets the same answer:
  no current one exists. The one detailed pre-raid list found (t393, Protection tank)
  is a 2019 repost of a generic vanilla guide, explicitly declared outdated by a player
  in 2025 — kept here only because it is the single most complete named-item list found
  for any Paladin spec, with that caveat attached to every item in it.
