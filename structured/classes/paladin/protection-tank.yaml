agreement: consensus
patch_validity:
  written_for: "1.17.2 / 1.18.0 (Class Changes 2 talent trees)"
  valid_for_1181: partial
  notes: "1.18.1 changed Righteous Strikes (Zeal block chance -> Zealous Defence), Holy Strike (weapon damage component, 71% SP, ~60% of the opener), Holy Shield threat 30% -> 50%, Consecration front-loaded, Prot T2.5/T3.5 set bonuses. Post-1.18.1 Discord re-evaluation supersedes the forum's 'scaled poorly / threat bottom tier' framing and the 440-defense crit-immunity number; see discord block and rotation/stat/cap fields."
discord:
  channel: paladin
  scope: "post-1.18.1 Protection re-evaluation, live server 2026-03-20 onward"
  sources:
    - {id: "1485399760964817139", era: post-1.18.1, agreement: consensus, claim: "Patchwerk patch-day TPS breakdown, total ~2085 TPS (HS 599, Auto 212, SoR 367, JoR 354, Cons 194, Holy Shield 200, Exo 32, HoW 40, BoSanc 22)"}
    - {id: "1492549184010715346", era: post-1.18.1, agreement: consensus, claim: "'Threat is already not a problem for prot paladins'"}
    - {id: "1485368911712092332", era: post-1.18.1, agreement: consensus, claim: "AoE opener first Consecration tick ~600 threat, ~475 on the second"}
    - {id: "1485297028337766544", era: post-1.18.1, agreement: consensus, claim: "'this patch is amazing for prot ... overall prot eating good this patch'"}
    - {id: "1485398358750134283", era: post-1.18.1, agreement: consensus, claim: "'Ppal threat really got a big boost this patch'"}
    - {id: "1485348234275852388", era: post-1.18.1, agreement: single source, claim: "'with this patch u have to use more SP'"}
    - {id: "1487042295747575898", era: post-1.18.1, agreement: single source, claim: "The remaining complaint is the mitigation/threat trade-off: 'Average prot paladin sacrificing 150 stam and 20% avoidance to do 1% more threat and then getting oneshot by a crush'"}
    - {id: "1484833025177944206", era: post-1.18.1, agreement: consensus, claim: "Crusader Strike grants Zealous Defence; tankswap pattern pre Holy Shield, taunt, crusader, bulwark"}
    - {id: "1484776924046692372", era: post-1.18.1, agreement: consensus, claim: "Consecration front-loading starts when the mob ENTERS, not when cast"}
    - {id: "1490380415968608357", era: post-1.18.1, agreement: consensus, claim: "Avoidance cap 102.4% with Holy Shield up; take residual defense only"}
    - {id: "1491228491344121866", era: post-1.18.1, agreement: consensus, claim: "'440 Def is just ridiculous to go for on Prot Paladin'"}
    - {id: "1491339233506492496", era: post-1.18.1, agreement: single source, claim: "Crush cap reached via tier set + Holy Shield; no separate block chase"}
    - {id: "1487950600573554739", era: post-1.18.1, agreement: consensus, claim: "'str/AP is still not a good stat for prot paladin'"}
    - {id: "1493091174553096313", era: post-1.18.1, agreement: consensus, claim: "Righteous Fury is a holy-only threat multiplier (~2x / +105%); nothing else scales with it"}
    - {id: "1484744707971092660", era: post-1.18.1, agreement: consensus, claim: "Patch-week Improved Righteous Fury bug: RF snapshots the talent state on application; fixed"}
    - {id: "1488852869212798987", era: post-1.18.1, agreement: staff, claim: "NEXT-PATCH ANNOUNCEMENT (2026-04-01, Lhian): Holy Strike becomes a next-attack ability, CS loses its cooldown and becomes a holy-damage debuff stacker, spellstrikes stop proccing. Announced, NOT shipped"}
