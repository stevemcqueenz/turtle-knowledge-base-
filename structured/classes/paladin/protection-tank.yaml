stat_priority_note: 'Everran (p=143606) gives two separate orders, not one list. The array above is his survival order, the
  one a tank gears by, in the sequence he enumerates it: stamina first ("Stam until you can survive the tier you are in"),
  then defense ("Defense is nice but not mendatory" [sic]), then agility ("18 agi is about 1% dodge and 1% crit in raid scenario"),
  then block chance until the crush cap with Holy Shield. Agility versus defense is a per-point trade rather than a ranking,
  and he states his own preference the other way: "so i usualy go 15 agi>5def but i pref the def over lower amount of agi
  (personnal pref)" [sic]. His THREAT order is a separate ranking from the same post, given there as a list: spell power,
  then agility because of crit, then strength. Spell power is the threat stat — all of a paladin tank''s aggro is holy damage.
  Block on gear plus Holy Shield is the staff-intended route to crush immunity. Defense is wanted but the 440 (420 with Anticipation)
  crit cap is "often not worth reaching when you consider what you have to sacrifice". Strength is CONTESTED: called irrelevant
  to threat by Kerenis (p=153860) and defended by others. "Adds X damage to melee attacks" items are valued separately because
  they trigger Judgement of Wisdom an extra time per swing.'
