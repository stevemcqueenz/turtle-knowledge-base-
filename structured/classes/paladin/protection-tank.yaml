leveling_by_bracket:
  - {bracket: "1-10", advice: "Train everything; Seal of Righteousness + Judgement; Blessing of Might/Wisdom. Consecration is baseline at 20, Seal of Wisdom at 18, Righteous Fury at 16 (no tanking before that).", sources: ["[[d:paladin#1324719350799798292]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "10-19", advice: "Ret talents for questing or start Prot; avoid Seal of the Crusader; buy a 2H every 5-10 levels.", sources: ["[[d:paladin#1328039243838394449]]"], era: pre-1.18.1, agreement: single source}
  - {bracket: "20-29", advice: "AoE leveling starts at 20: Blessing of Sanctuary + max-rank Consecration + Retribution Aura; fast weapon + Seal/Judgement of Wisdom removes mana downtime. Farm spots: Defias miners (Deadmines), Stonesplinter trolls (Loch Modan), Mosshide gnolls (Wetlands).", sources: ["[[d:paladin#1336241598014554163]]", "[[d:paladin#1335002252141658155]]", "[[d:paladin#1324160117914206248]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "30-39", advice: "Respec Prot at 30 for Holy Shield; the full AoE kit is online by ~23 (Consecration + BoS + 3/3 Shield Spec); Prot holds 2-4 mobs from ~30-42.", sources: ["[[d:paladin#1325654388961706014]]", "[[d:paladin#1380545044695617638]]", "[[d:paladin#1324476017108058144]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "40-60", advice: "Finish Prot or Ret; no distinct post-CC2 40s/50s advice in-channel. Leveling stat order (post-1.18.1): stam, spellpower, int, str, agi.", sources: ["[[d:paladin#1486596157973991424]]", "[[d:paladin#1324476017108058144]]"], era: mixed, agreement: single source}
  - {bracket: "general", advice: "Post-1.18.1 Ret leveling: go Ret only until 5/5 Vengeance, Sanctity Aura is not worth it while leveling, Repentance optional; Holy is a dungeon-heal spec, not a questing spec.", sources: ["[[d:paladin#1456918732579279054]]", "[[d:paladin#1456920898652078316]]", "[[d:paladin#1456972397163843678]]"], era: 1.18.1-announced-pre-release, agreement: consensus}
stat_weights:
  stamina: "1 (survival; 'Stam + Vampirism works great') [[d:paladin#1494348050561503232]]"
  spell_power: "1 (the threat stat: Consecration, Holy Shield, Holy Strike, Seal/Judgement of Righteousness; 'prot pally = sp maxxing') [[d:paladin#1488771634704679073]] [[d:paladin#1491449302688596008]]"
  intellect: "good - max mana is effectively mp5 via Shield Specialization (a ~6000-mana pool makes r3 Holy Shield a slight drain, r1 a slight gain) [[d:paladin#1484482699644108901]]"
  agility: "fine (crit/dodge/armor); 6 agi ~ 12 armor / 0.3% crit / 0.3% dodge [[d:paladin#1492667984320270528]]"
  defense: "not chased - avoidance cap is the goal; take residual defense only [[d:paladin#1484478164632862802]]"
  block_chance: "comes mainly from Holy Shield + tier; not chased [[d:paladin#1491449302688596008]]"
  strength: "low/contested (block value -> Holy Shield damage; '12 str gives less than one shield block value of extra HS damage') [[d:paladin#1487950600573554739]] [[d:paladin#1492667984320270528]]. The class designer personally leans higher ([[d:paladin#1457068627374116896]]), but post-1.18.1 player consensus is low."
  weapon_speed: "fast one-hander still preferred (Seal of Wisdom mana); Holy Strike now benefits slightly from weapon damage [[d:paladin#1487948771747823678]] [[d:paladin#1494348050561503232]]"
caps:
  avoidance_cap: "102.4% combined dodge+parry+block+miss WITH Holy Shield up (90% combined is 'basically the same') [[d:paladin#1490380415968608357]] [[d:paladin#1491228429847363704]] [[d:paladin#1488125629583851582]]"
  crit_immunity_defense: "440 defense is 'ridiculous' for prot - use the avoidance cap instead; take residual defense only [[d:paladin#1491228491344121866]] [[d:paladin#1484478164632862802]]. Supersedes the forum's hedged 440/420 source."
  crush_cap: "reached from the tier set + Holy Shield; no separate block chase [[d:paladin#1491339233506492496]]. Supersedes the forum's 'exact post-1.18.1 number unknown'."
  spell_hit: "no spell hit needed for ordinary tanking [[d:paladin#1488770847803052143]]; Precision + C'Thun ring + ES choker ~5% is enough for taunt with Improved Hand of Reckoning [[d:paladin#1488518962462326855]]"
  taunt: "Improved Hand of Reckoning 2/2 makes taunts reliable [[d:paladin#1488517935323676784]]"
  weapon_skill: "5 weapon skill = 1% hit, linear per point [[d:paladin#1488982232482840768]]"
rotation_single:
  - {priority: 1, action: "Righteous Fury + aura + blessings (Sanctuary/Kings self) + Seal of Wisdom", condition: "before pull; reapply Righteous Fury first after any death [[d:paladin#1487898897144877108]]"}
  - {priority: 2, action: "Pre-cast Holy Shield while running in, then Judgement of Wisdom and Holy Strike as soon as in range", condition: "opener; HS is ~60% of the prot opener [[d:paladin#1485400460897685634]]"}
  - {priority: 3, action: "Holy Strike", condition: "on cooldown [[d:paladin#1485641256586444910]] [[d:paladin#1485412710307856414]]"}
  - {priority: 4, action: "Judgement of Righteousness (re-seal after); judge Wisdom instead when the group needs mana", condition: "on cooldown [[d:paladin#1485641256586444910]]"}
  - {priority: 5, action: "Consecration", condition: "only with more than 2 mobs; single target is a mana sink [[d:paladin#1485641256586444910]] [[d:paladin#1485412343621091541]]"}
  - {priority: 6, action: "Holy Shield", condition: "when mana permits (r3 slight drain / r1 slight gain at ~6000 mana) [[d:paladin#1484482699644108901]]"}
  - {priority: 7, action: "Crusader Strike for Zealous Defence (and +25% HS snap threat)", condition: "before a big incoming hit / tankswap, NOT as a threat button [[d:paladin#1484833025177944206]]"}
  - {priority: 8, action: "Seals: Seal of Righteousness single target, Seal of Wisdom on trash packs", condition: "mana/threat trade-off; single source and the reverse of the forum default [[d:paladin#1485412710307856414]]"}
  - {priority: 9, action: "Aura: Sanctity Aura if available, else Retribution Aura for threat", condition: "always [[d:paladin#1485412710307856414]] [[d:paladin#1485640207486419077]]"}
  - {priority: 10, action: "Weapon: fast 1H still favoured for Seal of Wisdom procs", condition: "gear; HS now cares a little about weapon damage [[d:paladin#1487948771747823678]]"}
  - {priority: 11, action: "Exorcism", condition: "Undead/Demon target; damage only (-70% threat)"}
  - {priority: 12, action: "Hand of Reckoning (or Hand of Protection on the DPS)", condition: "target leaves you"}
  - {priority: 13, action: "downrank Holy Strike/Consecration", condition: "mana low"}
rotation_single_forum_baseline: "The pre-1.18.1 forum rotation (Holy Shield on CD, HS/CS Zeal juggling, Consecrate 3+) is consistent in shape, but has no CS-as-Zealous-Defence step and framed CS as a Zeal maintainer - superseded by [[d:paladin#1484833025177944206]]."
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Holy Strike skull, Judgement/Seal on the second, tab between them", condition: "no Consecration needed [[d:paladin#1485412343621091541]]"}
  - {targets_min: 3, priority: 1, action: "Consecration (max rank; pre-place it so the mob eats the 156% first tick) - the front-load triggers on mob ENTRY, not on cast", condition: "3+ mobs [[d:paladin#1484776924046692372]] [[d:paladin#1485368911712092332]]"}
  - {targets_min: 3, priority: 2, action: "Holy Shield on cooldown", condition: "always"}
  - {targets_min: 3, priority: 3, action: "Holy Strike skull, tab Judgements; Consecration alone will not hold geared single-target DPS without tab-targeting", condition: "shared strike cooldown [[d:paladin#1485368911712092332]] [[d:paladin#1489946008426250290]]"}
  - {targets_min: 3, priority: 4, action: "Libram of the Hallowed Ground on trash; Libram of the Eternal Tower single-target", condition: "hallowed ground scales 4% SP per tick [[d:paladin#1488793803056746558]] [[d:paladin#1489569357725044837]]"}
  - {targets_min: 3, priority: 5, action: "Seal of Wisdom / Judgement of Wisdom on the longest-lived mob", condition: "mana"}
aoe_threshold: 3
cooldowns:
  - {name: Bulwark of the Righteous, use_when: "snap threat at boss pull OR defensive for the dangerous phase (5-min CD); CS before it stacks Zealous Defence [[d:paladin#1484833025177944206]]"}
  - {name: Holy Shield, use_when: "on cooldown, always"}
  - {name: Hand of Reckoning, use_when: "mob leaves you (10-s CD)"}
  - {name: Hand of Protection, use_when: "DPS pulled aggro and taunt is down"}
  - {name: Divine Shield, use_when: "emergency/threat drop; -60% damage dealt so threat suffers"}
  - {name: Flask of Petrified Gold, use_when: "floated as the new BIS threat-tank flask with TF + Wrath of Cenarius (single source) [[d:paladin#1486100086944698492]]"}
  - {name: Nordanaar Herbal Tea, use_when: "~600 HP / 1100 mana, 2-min CD, separate from potions (Hyjal) [[d:paladin#1485441517744029717]]"}
resource_rules:
  - "Seal of Wisdom + Judgement of Wisdom on the main target; re-judge when it dies"
  - "Blocks return 2% mana (Shield Specialization, 5-s ICD): eagle (Sta/Int) gear increases the return"
  - "Do not Consecrate single targets"
  - "Auto-attack the last mob of a pack to refill before the next pull"
  - "Wear one or more 'adds X damage to melee attacks' items for extra Judgement of Wisdom procs"
  - "Drink only when the healer drinks; never pull with the healer low"
  - "Righteous Fury is a holy-only ~2x/+105% threat multiplier; nothing else scales with it [[d:paladin#1493091174553096313]]"
consumables:
  - "Brilliant Mana Oil / Lesser Mana Oil"
  - "mana potions/teas for mana-punishing raid bosses; Nordanaar Herbal Tea (~600 HP/1100 mana, 2-min CD) [[d:paladin#1485441517744029717]]"
  - "Flask of Petrified Gold floated as threat-tank BIS (single source) [[d:paladin#1486100086944698492]]"
  - "Ez-Thro Dynamite / Explosive Rockets / Magic Candle for ranged pulls"
  - "Thorium Shield Spike"
  - "enchants (guide): Constitution/Protection arcanum, Zandalar Signet of Mojo, Superior Defense or Dodge cloak, Major Health chest, Superior Stamina bracer, Threat/Greater Strength gloves, Greater Stamina boots, Spell Power/Crusader weapon"
mistakes_to_avoid:
  - "Spamming Consecration on single targets and going OOM"
  - "Tanking without Righteous Fury, without a seal, or with Holy Shield off cooldown; not reapplying RF after a death [[d:paladin#1487898897144877108]]"
  - "Using Crusader Strike as a threat button instead of a Zealous Defence/pre-hit button [[d:paladin#1484833025177944206]]"
  - "Letting Zeal fall off in long fights"
  - "Pulling while the healer drinks or is out of range"
  - "Not marking a skull target for DPS"
  - "Stacking Strength plate instead of Stamina/spell power [[d:paladin#1487950600573554739]]"
  - "Chasing 440 defense instead of the 102.4% avoidance cap [[d:paladin#1491228491344121866]]"
  - "Pumping threat into mobs that die before DPS can pull [[d:paladin#1485368911712092332]]"
supersedes:
  - {claim: "Prot scaled poorly / threat bottom-tier in high-end raids (pre-1.18.1 forum)", verdict: "post-1.18.1 Prot threat comfortable (~2085 TPS Patchwerk; 'threat is already not a problem')", sources: ["[[d:paladin#1485399760964817139]]", "[[d:paladin#1492549184010715346]]"]}
  - {claim: "Crit-immunity = 440 defense (forum, hedged)", verdict: "avoidance cap 102.4% with Holy Shield; 440 def 'ridiculous'", sources: ["[[d:paladin#1491228491344121866]]", "[[d:paladin#1490380415968608357]]"]}
  - {claim: "post-1.18.1 crush-cap number unknown (forum gap)", verdict: "'crush capped anyway in your tier set + holy shield'", sources: ["[[d:paladin#1491339233506492496]]"]}
  - {claim: "Prot fast-weapon / Holy Strike nearly weapon-agnostic", verdict: "HS now has a weapon-damage component; fast still fine, weapon ranking Desecration >= TF > Lokamir/Wraith Blade", sources: ["[[d:paladin#1487948771747823678]]", "[[d:paladin#1485350319859826718]]"]}
  - {claim: "CS is a Zeal maintainer (forum)", verdict: "1.18.1: CS grants Zealous Defence (next blocked hit -6..30%) and is a defensive/pre-hit button", sources: ["[[d:paladin#1484833025177944206]]"]}
next_patch_announced:
  announced: "2026-04-01"
  status: "announced, NOT shipped (no live-server evidence in the archive)"
  author: "Lhian (developer/staff)"
  sources: ["[[d:paladin#1488852869212798987]]"]
  items:
    - "Holy Strike becomes a next-attack ability like Heroic Strike (whole hit + extra damage as holy)"
