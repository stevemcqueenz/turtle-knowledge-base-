stat_weights:
  stamina: "1 (survival set: until you survive the tier)"
  spell_power: "1 (threat set: Consecration, Holy Shield, Holy Strike, Seal/Judgement of Righteousness)"
  agility: "high (18 agi ~ 1% dodge + 1% crit with Kings)"
  defense: "medium (5 def ~ 1% mitigation)"
  block_chance: "medium until crush cap with Holy Shield"
  strength: "low / contested (block value -> Holy Shield damage; no other threat scaling)"
  weapon_speed: "fast one-hander preferred (Seal of Wisdom mana)"
caps:
  crit_immunity_defense: "440 (420 with Anticipation 3/3) - single hedged source, vanilla baseline"
  crush_cap: "Holy Shield 45% block + gear block; exact post-1.18.1 number unknown"
  hit: "Precision 3/3 (+3% melee and spell hit) recommended; no numeric hit cap for tanking given"
rotation_single:
  - {priority: 1, action: "Righteous Fury + aura + blessings (Sanctuary/Kings self) + Seal of Wisdom", condition: "before pull; reapply Righteous Fury after death"}
  - {priority: 2, action: "Holy Shield", condition: "while running in and whenever off cooldown"}
  - {priority: 3, action: "Judgement (Wisdom on bosses; Righteousness for threat when mana is fine)", condition: "on cooldown; re-seal after"}
  - {priority: 4, action: "Bulwark of the Righteous", condition: "boss pull when DPS open early, otherwise hold as -30% damage cooldown"}
  - {priority: 5, action: "Crusader Strike", condition: "Zeal < 3 stacks, or Zeal has < 6 s left (1.18.1: also for Zealous Defence before a big hit)"}
  - {priority: 6, action: "Holy Strike", condition: "shared strike cooldown ready and Zeal at 3 stacks with > 6 s left"}
  - {priority: 7, action: "Consecration", condition: "single target only if mana comfortable (Judgement of Wisdom + +dmg items); otherwise skip"}
  - {priority: 8, action: "Exorcism", condition: "Undead/Demon target; damage only (-70% threat)"}
  - {priority: 9, action: "Hand of Reckoning (or Hand of Protection on the DPS)", condition: "target leaves you"}
  - {priority: 10, action: "downrank Holy Strike/Consecration", condition: "mana low"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Holy Strike skull, Judgement + Seal auto-attack on the second, tab between them", condition: "no Consecration needed"}
  - {targets_min: 3, priority: 1, action: "Consecration (max rank, then rank 1 if mana-rich)", condition: "3+ mobs or something pulled unexpectedly"}
  - {targets_min: 3, priority: 2, action: "Holy Shield on cooldown", condition: "always"}
  - {targets_min: 3, priority: 3, action: "Holy Strike skull, tab Judgements", condition: "shared strike cooldown"}
  - {targets_min: 3, priority: 4, action: "Seal of Wisdom / Judgement of Wisdom on the longest-lived mob", condition: "mana"}
aoe_threshold: 3
cooldowns:
  - {name: Bulwark of the Righteous, use_when: "snap threat at boss pull OR defensive for the dangerous phase (5-min CD)"}
  - {name: Holy Shield, use_when: "on cooldown, always"}
  - {name: Hand of Reckoning, use_when: "mob leaves you (10-s CD)"}
  - {name: Hand of Protection, use_when: "DPS pulled aggro and taunt is down"}
  - {name: Divine Shield, use_when: "emergency; -60% damage dealt so threat suffers"}
resource_rules:
  - "Seal of Wisdom + Judgement of Wisdom on the main target; re-judge when it dies"
  - "Blocks return 2% mana (Shield Specialization, 5-s ICD): eagle (Sta/Int) gear increases the return"
  - "Do not Consecrate single targets"
  - "Auto-attack the last mob of a pack to refill before the next pull"
  - "Wear one or more 'adds X damage to melee attacks' items for extra Judgement of Wisdom procs"
  - "Drink only when the healer drinks; never pull with the healer low"
consumables:
  - "Brilliant Mana Oil / Lesser Mana Oil"
  - "mana potions/teas for mana-punishing raid bosses"
  - "Ez-Thro Dynamite / Explosive Rockets / Magic Candle for ranged pulls"
  - "Thorium Shield Spike"
  - "enchants (guide): Constitution/Protection arcanum, Zandalar Signet of Mojo, Superior Defense or Dodge cloak, Major Health chest, Superior Stamina bracer, Threat/Greater Strength gloves, Greater Stamina boots, Spell Power/Crusader weapon"
mistakes_to_avoid:
  - "Spamming Consecration on single targets and going OOM"
  - "Tanking without Righteous Fury, without a seal, or with Holy Shield off cooldown"
  - "Using Crusader Strike as a threat button instead of a Zeal maintainer"
  - "Letting Zeal fall off in long fights"
  - "Pulling while the healer drinks or is out of range"
  - "Not marking a skull target for DPS"
  - "Stacking Strength plate instead of Stamina/spell power"
