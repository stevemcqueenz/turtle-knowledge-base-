stat_weights:
  spell_power: 1 (the threat stat); 1 SP ~ 1-1.2 TPS [[d:paladin#1490114115052769341]]; still dominant after the HS weapon
    change [[d:paladin#1485887132974190693]]
  stamina: ~1 up to the 7,500-8,000 HP boss floor [[d:paladin#1479149805857931274]] [[d:paladin#1486300603683700891]]
  hit: to 7-8% melee (see caps) [[d:paladin#1482717762697564242]]
  crit: 1% ~ 8 SP at ~1000 SP [[d:paladin#1480245364299927552]]
  intellect: good - max mana is mp5 via Shield Specialization [[d:paladin#1484482699644108901]]
  agility: 'cheap filler: 6 agi = 12 armor, 0.3% crit, 0.3% dodge [[d:paladin#1492667984320270528]]'
  strength: weak (no longer zero via Holy Strike weapon damage) [[d:paladin#1492667984320270528]] [[d:paladin#1487951069383495861]]
  defense: only as part of total avoidance (0.04% each per point) [[d:paladin#1460803234695479420]]; never chase 440 [[d:paladin#1491228491344121866]]
caps:
  hit_melee: 8% at 300 weapon skill, 7% at 305/308; 3% Precision + 4% gear [[d:paladin#1471632460998770943]]; MT must be capped,
    OT/dungeon 1-2% under ok [[d:paladin#1450132467347623956]] [[d:paladin#1450132383419338932]]
  spell_hit: not geared for [[d:paladin#1488770847803052143]]
  taunt: 3/3 Precision + 2/2 Improved Hand of Reckoning -> 5% miss; never guaranteed vs raid bosses [[d:paladin#1448985792675315752]]
    [[d:paladin#1463559685050335424]]
  avoidance_cap: 102.4% combined dodge+parry+block+miss with Holy Shield up vs level 63 [[d:paladin#1491228429847363704]];
    ~90% 'basically the same' [[d:paladin#1488125629583851582]]; only from AQ40 [[d:paladin#1477378940875047116]]
  twins_melee: 118.4% under Unbalancing Strike [[d:paladin#1465416367967572164]]
  kara40: Knight and Rupturan require crush immunity [[d:paladin#1465172802326761748]]
  hp_floor: 7,500 BWL minimum, 8,000 preferred [[d:paladin#1455534204690366578]]
rotation_single:
- priority: 1
  action: Righteous Fury (re-apply after death; toggle after respec), Sanctity Aura (Retribution Aura if someone else has
    Sanctity), blessing, Seal of Righteousness
  condition: pre-pull [[d:paladin#1487898897144877108]] [[d:paladin#1469723489400262698]]
- priority: 2
  action: Pre-cast Holy Shield, run in, active SP trinket, Judgement of Righteousness, Holy Strike, reseal SoR
  condition: opener [[d:paladin#1479624488675971323]] [[d:paladin#1474054737547497583]]
- priority: 3
  action: Holy Strike
  condition: the moment it is off cooldown; never delay [[d:paladin#1479624488675971323]]
- priority: 4
  action: Judgement (of Righteousness)
  condition: on cooldown, ~2 s after Holy Strike, woven into another GCD (off-GCD) [[d:paladin#1479624488675971323]] [[d:paladin#1463240147930841219]]
- priority: 5
  action: Seal of Righteousness
  condition: next GCD after judging; never another seal on a boss [[d:paladin#1475773657925161033]]
- priority: 6
  action: Holy Shield (rank 1 on long fights)
  condition: when mana permits [[d:paladin#1485641256586444910]] [[d:paladin#1450898726074847345]]
- priority: 7
  action: Consecration rank 5, then rank 1 once threat is established or mana < 30%
  condition: remaining GCDs [[d:paladin#1479624488675971323]] [[d:paladin#1470119581581312222]]
- priority: 8
  action: Exorcism
  condition: Undead/Demon, nothing else ready; Consecration first if both ready [[d:paladin#1462761249325711431]]
- priority: 9
  action: Hand of Reckoning
  condition: mob not targeting you
- priority: 10
  action: Crusader Strike (Zealous Defence)
  condition: ONLY before a planned big hit / tank swap (Patchwerk, Twins, Knight); never for threat [[d:paladin#1484833025177944206]]
    [[d:paladin#1487459563707044021]]
rotation_aoe:
- targets_min: 2
  priority: 1
  action: No Consecration; Holy Strike skull, Judgement the second, tab
  condition: 2 mobs [[d:paladin#1485641256586444910]]
- targets_min: 3
  priority: 1
  action: Pre-cast Consecration where mobs meet you (front-load triggers on mob entry)
  condition: 3+ mobs [[d:paladin#1484776924046692372]] [[d:paladin#1461408170533589197]]
- targets_min: 3
  priority: 2
  action: Single-target priority on skull; tab Judgement/Holy Strike/taunt onto others; lock mobs one by one
  condition: Consecration is only 30-40% of AoE threat [[d:paladin#1469946685776990285]] [[d:paladin#1457081838437929141]]
- targets_min: 3
  priority: 3
  action: Rank-5 Consecration at most 1-2 casts per pack
  condition: mana [[d:paladin#1469947262431133819]]
- targets_min: 3
  priority: 4
  action: Goblin Sapper Charge on the pull
  condition: raids; doubles opening AoE threat [[d:paladin#1489946008426250290]]
- targets_min: 3
  priority: 5
  action: Greater Blessing spam (not Wisdom)
  condition: adds that must look at you instantly (Incantagos pull, Faerlina trash, Noth adds) [[d:paladin#1449767594717610005]]
    [[d:paladin#1464060242735399034]]
- targets_min: 3
  priority: 6
  action: Seal of Wisdom + Consecration
  condition: mana-heavy multi-target trash [[d:paladin#1467497544488718404]]
aoe_threshold: 3
cooldowns:
- name: Bulwark of the Righteous
  use_when: Maexxna, Gothik; Anomalus at 30+ stacks with a GAPP [[d:paladin#1462761249325711431]] [[d:paladin#1446932033933934622]]
- name: Holy Shield
  use_when: pre-cast before every pull; needed for the avoidance cap
