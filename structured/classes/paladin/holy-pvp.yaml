caps: {}
rotation_single:
  - {priority: 1, action: "stay in melee with Seal of Wisdom; Holy Shock the ally in need", condition: "always"}
  - {priority: 2, action: "Crusader Strike", condition: "Holy Shock on cooldown (Blessed Strikes reset) - keeps heals instant and on the move [[d:paladin#1484823910041260132]]"}
  - {priority: 3, action: "Hammer of Justice", condition: "enemy healer/DPS in range"}
  - {priority: 4, action: "Hand of Freedom / Hand of Protection / Cleanse", condition: "flag carrier slowed; physical focus; debuffs"}
  - {priority: 5, action: "Divine Shield and keep healing", condition: "focused; avoid casting into an interrupt with bubble down; disabled in rated arena [[d:paladin#1489382932161495110]]"}
rotation_aoe: []
aoe_threshold: 0
cooldowns:
  - {name: Divine Shield, use_when: "focused; heals unaffected; disabled in rated arena; -60% damage dealt (post-patch reported as -70% or -50% healing, contested)"}
  - {name: Hand of Freedom, use_when: "flag carrier / kited ally (24-s CD); countered by running/dispel; FAP can substitute"}
  - {name: Hammer of Justice, use_when: "peel / setup kill; Imp HoJ + old PvP set drops it to ~30 s"}
  - {name: Lay on Hands, use_when: "emergency; DISABLED in arena"}
resource_rules:
  - "Seal of Wisdom melee for mana"
consumables:
  - "Tea with Sugar / Herbal Tea (no potion CD), Major Mana Potion, Frost Oil, sappers/thorium grenades (stun), Free Action Potion, Living Action Potion, low-rank scrolls [[d:paladin#1431563512550785124]] [[d:paladin#1455759403100803173]] [[d:paladin#1434479918317703300]]"
  - "Engineering is the PvP profession [[d:paladin#1491337490085445834]]"
mistakes_to_avoid:
  - "Trying to out-range casters instead of the Crusader Strike -> Holy Shock loop"
  - "Casting with bubble on cooldown into a kick"
  - "Chasing kiters"
  - "Using 2h instead of 1h + shield as a support healer [[d:paladin#1493010360322621630]]"
