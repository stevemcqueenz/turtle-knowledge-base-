stat_weights:
  stamina: high; 6k+ HP [[d:paladin#1481664712130166965]]
  healing_power: high
  intellect: medium
  spell_crit: medium (Holy Shock crits)
  pushback: Spiritual Focus + Concentration Aura = 105% [[d:pvp-general#1430590994587586620]]
caps: {}
rotation_single:
- priority: 1
  action: Holy Shock the ally about to die
  condition: always first
- priority: 2
  action: Judgement -> 1.5 s Holy Light (Holy Judgement)
  condition: bigger heal needed; bait a Shock/interrupt first [[d:pvp-general#1427671149428342906]]
- priority: 3
  action: Crusader Strike
  condition: in melee, Holy Shock on cooldown (reset) [[d:paladin#1484823910041260132]]
- priority: 4
  action: Flash of Light
  condition: at range / kiting
- priority: 5
  action: Cleanse / Hand of Freedom / BoP
  condition: as needed
- priority: 6
  action: Hammer of Justice
  condition: peel or stop an enemy healer
rotation_aoe: []
aoe_threshold: 0
cooldowns:
- name: Divine Shield
  use_when: disengage or eat a Kidney Shot to save the trinket; 12 s; halves healing done/taken (50-60% contested); off in
    rated arena [[d:paladin#1429823453028155465]] [[d:paladin#1467173434726547698]] [[d:paladin#1489382932161495110]]
- name: Blessing of Protection
  use_when: physical burst, Blind (not a poison on Turtle) [[d:paladin#1424408436044595280]]
- name: Hammer of Justice
  use_when: kill window or healer peel; 30 s with Improved HoJ [[d:paladin#1484653064366325761]]
- name: Repentance
  use_when: breaks on damage; into HoJ [[d:paladin#1426800158305419428]] [[d:pvp-general#1429284370241552527]]
- name: Hand of Freedom
  use_when: slows/roots on you or the flag carrier; purgeable; longer CD since the nerf [[d:paladin#1441760867635953716]]
    [[d:paladin#1487223373317542039]]
- name: Lay on Hands
  use_when: emergency; disabled in arena [[d:paladin#1441426127284473877]]
resource_rules:
- Seal/Judgement of Wisdom in melee for mana
- 'Prioritise targets: you cannot heal through all the burst [[d:paladin#1481664792728174644]]'
consumables:
- Frost Oil ("they cost nothing") and Icy Chill on the weapon [[d:paladin#1483206998899163288]] [[d:pvp-general#1430556900088610846]]
- Engineering grenades and sappers; Free Action Potion; teas and mana potions
- Stronghold Gauntlets vs disarms [[d:pvp-general#1430582780810494034]]
mistakes_to_avoid:
- Trying to out-heal everything instead of prioritising [[d:paladin#1481664792728174644]]
- 2H instead of 1H + shield [[d:paladin#1493010360322621630]]
- Casting into an interrupt with bubble on cooldown
matchups:
  warrior: favourable; 2H warrior out-damages 2H ret; vs DW Bloodrinker use 1H+shield, JoL, SoR; Berserker Rage breaks Repentance;
    disarm-immune gloves [[d:paladin#1467839220105347072]] [[d:paladin#1439841216589070369]] [[d:pvp-general#1433888687392817154]]
  rogue: hard since Dissolvent; ~50% base dodge; BoP for Blind; Lost wolves vs stealth; Sanctuary [[d:paladin#1423730871537504488]]
    [[d:paladin#1424397329435328674]] [[d:paladin#1424408436044595280]] [[d:paladin#1440228045406605444]]
  mage: 'contested: good if you reach melee unnoticed; kited otherwise; "sheep and ignore" [[d:paladin#1441764012780945488]]
    [[d:paladin#1441764762571640945]] [[d:pvp-general#1423692207071952996]]'
  warlock: kill the pet; cannot fear demons; repented Voidwalker can still be sacrificed [[d:paladin#1484645314639171688]]
    [[d:pvp-general#1430550221477122200]]
  shaman: unfavourable; Purge strips seals and Freedom [[d:pvp-general#1424861028696723568]] [[d:paladin#1319672073685172315]]
    [[d:paladin#1472659024351592731]]
  hunter: manageable; shield + LoS, Swiftness Potion, Frost Oil; Holy Shield no longer blocks ranged [[d:paladin#1477997240814534807]]
    [[d:paladin#1478005878736294043]] [[d:paladin#1478007043435663440]] [[d:paladin#1428745621673738280]]
  priest: no current data (gap)
  druid: no current data (gap)
  paladin: no current data (gap)
