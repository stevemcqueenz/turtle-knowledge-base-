patch_validity:
  written_for: 1.18.1 (live 2026-03-20), post-release state through 2026-04-21
  valid_for_1181: true
  notes: '1.18.1: Seal of Command 7 -> 9 PPM, Crusader Strike rank 5 100% WD, Holy Strike 40% WD + Holy with 71% SP, Repentance
    8% AP tick, Consecration front-loaded, T2.5 3pc +15% JoR/JoC, Ret T3.5 5pc 4% non-stacking haste, libram swaps cost a
    GCD, new Libram of Ardour (+1 SoC PPM), Fortune stat. The 2026-04-01 developer "next patch" post (spellstrikes stop proccing,
    Holy Strike next-swing, CS no cooldown) was an APRIL FOOLS joke, not a patch.'
discord:
  channel: paladin
  scope: 'post-1.18.1 Retribution PvE: SoR spellret vs SoC vs Necrodin, rotation, stats, gear, librams'
  sources:
  - id: '1491936698689388746'
    era: post-1.18.1
    agreement: consensus
    claim: 'Mithreon: SoR ret FAAoBA-FAY-AoTAFKYAFAFABA and SoC ret FoAABA-FAY-AoTAFJYAFIFABA (both 11/8/32)'
  - id: '1458178443630874675'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: 11/8/32 is the standard on MC/BWL gear regardless of seal
  - id: '1486727985540104303'
    era: post-1.18.1
    agreement: consensus
    claim: Judge SotC only for the ~130 SP bonus; SP gear -> SoR, Strength gear -> SoC
  - id: '1486723603952046090'
    era: post-1.18.1
    agreement: single source
    claim: 'Dummy test, same pre-K40 spell-ret gear: SoC + Libram of Ardour ~30 DPS ahead of SoR + Eternal Tower (self-buffed)'
  - id: '1493184429906989217'
    era: post-1.18.1
    agreement: consensus
    claim: Top 4/5 in K40 are SoR, 3rd is SoC since the patch
  - id: '1492067525352099920'
    era: post-1.18.1
    agreement: consensus
    claim: SoC is better than last patch but still beaten by SoR
  - id: '1488506685990506506'
    era: post-1.18.1
    agreement: consensus
    claim: Both largely viable; difference ~100 DPS
  - id: '1487136530983293162'
    era: post-1.18.1
    agreement: consensus
    claim: Ret paladins do about 1.8k DPS; best Patchwerk log 2.3k (1487136588252184679)
  - id: '1489508110749139024'
    era: post-1.18.1
    agreement: consensus
    claim: 'K40: ~1k overall boss DPS is good; ramp-up gap from pull is the main weakness'
  - id: '1426854001051435189'
    era: 1.18.1-announced-pre-release
    agreement: single source
    claim: SoR <-> Windfury Totem proc loop raises effective WFT chance from ~25% to 40%+
  - id: '1464116936093859983'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: On Tel'Abim (no WF) spellret wins; SoC suffers without Windfury
  - id: '1490218179593764997'
    era: post-1.18.1
    agreement: consensus
    claim: Both T2 3pc + SoR = 4 spellstrike rolls per swing (Necrodin engine)
  - id: '1486109344486653954'
    era: post-1.18.1
    agreement: staff
    claim: 'Lhian on the T2 3pc: "i really dont want to [change it], it enables so much stuff"'
  - id: '1488578018640134224'
    era: post-1.18.1
    agreement: single source
    claim: Necrodin is the weakest ret build and needs to charge up; SoC is strong from the first second
  - id: '1489221331936612474'
    era: post-1.18.1
    agreement: consensus
    claim: Fortune does not raise set-bonus trigger rates (T1 8pc, T2 3pc) but raises item procs they trigger
  - id: '1488852869212798987'
    era: post-1.18.1
    agreement: staff
    claim: 'APRIL FOOLS: the 2026-04-01 "next patch" post was a joke (1488856415010291794), not a real change'
