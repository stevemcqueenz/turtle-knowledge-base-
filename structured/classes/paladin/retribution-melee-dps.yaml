stat_weights:
  hit: 8% melee hit first (1H and 2H) [[d:paladin#1436561953936904222]] [[d:paladin#1487251547690631323]]
  spell_power: 'SoR: top stat after hit; SP enchants beat 1% haste (except with Nightfall) [[d:paladin#1492380383113777264]]
    [[d:paladin#1459081396164235478]]'
  strength_attack_power: 'SoC: Strength scales linearly; 300 Str ~ 1200 AP [[d:paladin#1489018254000132147]] [[d:paladin#1493595800100671668]];
    for SoR Str is worth < 1/5 of SP [[d:paladin#1471986527763697664]]'
  crit: 'SoC: crit to ~33% unbuffed (or ~51% with rogue + feral buffs) [[d:paladin#1463424900730720481]] [[d:paladin#1491996354736685057]];
    SoR: 20-30% buffed is enough [[d:paladin#1430031868757147749]]'
  haste: good for both; multiplicative; ~1:1 damage for SoC; only counts in whole extra swings [[d:paladin#1469423761663987895]]
    [[d:paladin#1459215039964778649]] [[d:paladin#1482266634373824594]]
  agility: 'SoC: agility enchants until the crit target, then Strength [[d:paladin#1490760393474179112]]'
  weapon_skill: 310 plenty (SoR), 315 good (SoC), >315 wasted [[d:paladin#1488219693293633586]]
  spell_hit_spell_crit: 'near zero: only Exorcism/Holy Wrath/Consecration use spell hit; spell crit only Ashbringer proc/Exorcism/Holy
    Wrath [[d:paladin#1469407077146300591]] [[d:paladin#1482263530567635096]]'
  fortune: weak; take only on otherwise-good items [[d:paladin#1483896373240926438]] [[d:paladin#1483896631094022194]]
  spirit: '0'
caps:
  melee_hit: 8% vs raid bosses [[d:paladin#1436561953936904222]]
  weapon_skill: 0.2% hit per point above 300 up to 315; 5 skill = 1% hit [[d:paladin#1455656068913958912]] [[d:paladin#1488982232482840768]]
  glancing: ~40% glance chance fixed; 95% damage at 315 [[d:paladin#1468298257485529184]]
  soc_crit_breakpoints: 33% / 42% / 52% (contested) [[d:paladin#1468068189547139164]] vs [[d:paladin#1468074643964432495]]
rotation_single:
- priority: 1
  action: 'Seal of Righteousness (SoC build: Seal of Command)'
  condition: seal missing and an auto will land within the GCD; never auto-attack without a seal [[d:paladin#1485694401534496800]]
- priority: 2
  action: Holy Strike
  condition: Zeal 3 stacks and Holy Might <= 6 s or missing; also the opener (no Sunders yet) [[d:paladin#1483566674870534344]]
    [[d:paladin#1483567863577968650]]
- priority: 3
  action: Crusader Strike
  condition: Zeal < 3 stacks or expiring within 4 s [[d:paladin#1483566674870534344]]
- priority: 4
  action: Judgement (Righteousness/Command, or assigned Crusader/Wisdom) then re-seal
  condition: right after an auto lands and no strike is about to come off cooldown [[d:paladin#1485694441124659462]] [[d:paladin#1471558463229526216]]
- priority: 5
  action: Exorcism
  condition: target is Undead or Demon
- priority: 6
  action: Hammer of Wrath
  condition: target < 20% and no strike delayed; optional (low value) [[d:paladin#1441422778774454365]]
- priority: 7
  action: Crusader Strike or Holy Strike (whichever hits harder)
  condition: keep both Zeal and Holy Might up; CS usually wins vs sundered bosses, HS on unsundered trash; SoC prioritises
    Holy Might, SoR prioritises Zeal [[d:paladin#1494198526383751270]] [[d:paladin#1482302289338433606]]
- priority: 8
  action: Repentance
  condition: on cooldown on stun-immune bosses (free damage) [[d:paladin#1438268353134465074]]
- priority: 9
  action: Consecration
  condition: 2+ targets or spare mana; single target only in high-tier gear [[d:paladin#1492066318159970314]]
- priority: 10
  action: Wait ~2 s after a Windfury proc before the next strike/Judgement
  condition: Windfury Totem present [[d:paladin#1483022433265913865]]
opener:
- 'Pre-pull: Blessings, Sanctity Aura (Ret Aura until you have it), seal, /startattack [[d:paladin#1485640207486419077]]'
- Exorcism at 30 yd (Undead/Demon), Repentance at 20 yd, Judgement at 10 yd [[d:paladin#1431384317849894992]]
- Judge Seal of the Crusader if you are the Crusader judge (bosses only), re-seal [[d:paladin#1484613629444624405]]
- Holy Strike first, then Crusader Strike for Zeal; trinkets/Juju/haste potion a few GCDs in [[d:paladin#1455493072661250152]]
rotation_aoe:
- targets_min: 2
  priority: 1
  action: single-target loop on the Judgement of Wisdom target; Consecration if mana allows
  condition: 2-3 targets [[d:paladin#1462893175369764917]]
- targets_min: 4
  priority: 1
  action: Consecration on cooldown (rank 1 when mana is short)
  condition: 4+ targets; SoR scales it with spell power [[d:paladin#1428535994558185594]] [[d:paladin#1489847158504165416]]
- targets_min: 4
  priority: 2
  action: Goblin Sapper Charge
  condition: non-immune packs [[d:paladin#1428687306520395776]]
- targets_min: 2
  priority: 3
  action: Holy Wrath
  condition: Undead packs only [[d:paladin#1483203053690814634]]
aoe_threshold: 4
cooldowns:
- name: Trinkets / Juju Flurry / Potion of Quickness
  use_when: 2-3 GCDs into the fight with Zeal and Vengeance up [[d:paladin#1455493072661250152]] [[d:paladin#1484608557075660910]]
- name: Perception (Human)
  use_when: with the other cooldowns
- name: Repentance
  use_when: 60 s cooldown; free damage on immune bosses, CC on others
- name: Divine Shield
  use_when: survival or threat drop only; halves healing done and taken [[d:paladin#1467173434726547698]]
- name: Zeal / Holy Might upkeep
  use_when: always; Zeal is 3 x 5% haste stacks for 30 s, Holy Might +20% Strength [[d:paladin#1436340559315734589]] [[d:paladin#1436321352041627648]]
resource_rules:
- Judgement of Wisdom is the mana engine; SoR needs 1-2 spellstrike items with a 1H, 2-3 with a 2H when no WF/FTT [[d:paladin#1489845996233031700]]
- 'Out of mana, in order: more teas/mana pots -> Consecration rank 1 -> Holy Strike as filler -> stop JoR -> stop Consecration
  [[d:paladin#1489847158504165416]]'
- 'Last 1-2 mobs of a pack: Seal of Wisdom for 1-2 swings [[d:paladin#1485702321647124602]]'
- If another paladin keeps JoW up, judge Crusader/Righteousness instead [[d:paladin#1485694548406440087]]
- 'Buff cap: cancel low-value buffs (Blessing of Light/Sanctuary, Thorns, Healing Way, Inspiration); buffs past the cap still
  work but break buff-checking macros [[d:paladin#1469539640288608298]] [[d:paladin#1469534733242339359]]'
- 'One libram per fight: every in-combat swap costs a GCD (1.18.1)'
librams:
- name: Libram of Ardour
  effect: +1 Seal of Command PPM
  use: SoC default, also short fights [[d:paladin#1488558737147957258]] [[d:paladin#1493046992148893806]]
- name: Libram of the Eternal Tower
  effect: shorter strike cooldown (~1 extra strike/min)
  use: fights > ~60 s; SoR bosses [[d:paladin#1488594571410804847]] [[d:paladin#1485886655469457459]]
- name: Libram of Fervor
  effect: improves Judgement of the Crusader
  use: best pre-raid DPS libram [[d:paladin#1470305106711805994]]
- name: Libram of Final Judgement
  effect: bonus below 35% HP; 8% SP since 1.18.1
  use: execute
consumables:
- Flask of Supreme Power; Concoction of the Emerald Mongoose, Arcane Giant, Dreamwater; R.O.I.D.S. or Scorpok; 20 Str/haste/SP
  food or Dragonbreath Chili; Elemental Sharpening Stone (SoC) or Wizard Oil (SoR); Consecrated stone/oil vs Undead [[d:paladin#1494325796440113223]]
  [[d:paladin#1483869100772950066]]
- Juju Flurry, Potion of Quickness (haste = more SoR hits) [[d:paladin#1484608557075660910]]
- Goblin Sapper Charges on AoE [[d:paladin#1428687306520395776]]; mana potions and teas
- 'Enchants: weapon Crusader [[d:paladin#1444192866480951437]] (+30 SP only on low-proc fast weapons [[d:paladin#1446469126242566216]]);
  head/legs +12 SP (SoR) or Agility/Strength (SoC); gloves +9 SP; rings +3 stats or +5 SP [[d:paladin#1460637356473454633]];
  Naxx shoulder enchant [[d:paladin#1490760393474179112]]'
- 'Windfury Totem is an aura: an oil or stone goes on top [[d:paladin#1466355155216633919]]'
gear:
