stat_weights:
  hit: "cap first (8-9% for 2H; weapon skill 315 for glancing)"
  strength_attack_power: "1 (AP build)"
  crit: "high (AP build)"
  haste: "medium (AP build, spreadsheet claim)"
  spell_power: "1 (spell/hybrid build with Seal of Righteousness, Consecration, Exorcism)"
  intellect: "medium (spell build: spell crit, mana)"
  spirit: "0"
caps:
  melee_hit: "8% (2H, per Bigsmerf) - 9% per Snadileoboy"
  weapon_skill: "315 recommended"
rotation_single:
  - {priority: 1, action: "Blessings, Sanctity (spell) or Retribution Aura, Seal up, /startattack", condition: "pre-pull"}
  - {priority: 2, action: "Judgement (Wisdom for sustain; Command/Righteousness when mana is full)", condition: "on arrival, then on cooldown; re-seal immediately, timed so the seal is up before the next white swing"}
  - {priority: 3, action: "Crusader Strike", condition: "Zeal < 3 stacks, or Holy Might has > 6 s left"}
  - {priority: 4, action: "Holy Strike", condition: "Zeal at 3 and Holy Might missing or < 6 s left (AP build); spell Ret in K40 largely skips it"}
  - {priority: 5, action: "Exorcism", condition: "Undead/Demon target, on cooldown"}
  - {priority: 6, action: "Hammer of Wrath", condition: "target < 20% health"}
  - {priority: 7, action: "Repentance", condition: "boss (immune) target for the repent tick, on cooldown"}
  - {priority: 8, action: "Consecration (max rank)", condition: "spell build only, mana sustained by Wisdom and +dmg items"}
  - {priority: 9, action: "Cleanse / Hand of Freedom / Hand of Protection", condition: "free GCD and a raid member needs it"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "stay on the Wisdom-judged target; Judgement of Righteousness/Command on the secondary if it will live", condition: "mana"}
  - {targets_min: 2, priority: 2, action: "Holy Strike for party health/mana", condition: "trash dies before Zeal ramps"}
  - {targets_min: 4, priority: 1, action: "Consecration (max rank; lower rank when mana is short)", condition: "4+ targets; spell build on cooldown, AP build only with spare mana"}
aoe_threshold: 4
cooldowns:
  - {name: Divine Shield, use_when: "threat drop or survival; keep attacking at -60% damage"}
  - {name: Zeal (Crusader Strike x3), use_when: "maintain; ~18 s to build, 30 s duration"}
  - {name: Holy Might (Holy Strike), use_when: "maintain, 20 s duration, refresh under 6 s"}
  - {name: Repentance, use_when: "on cooldown on bosses; CC on players/mobs in PvP/dungeons"}
resource_rules:
  - "Seal/Judgement of Wisdom is the mana engine; avoid target swapping away from the judged mob"
  - "Seal of Command rank 1 on trash / low mana (ranks only change the judgement)"
  - "Fiery Plate Gauntlets or other +dmg items on mana-heavy fights for extra Wisdom procs"
  - "Mana elixirs + Brilliant Mana Oil; Tel'Abim (no Windfury/mana totems) is mana-starved"
  - "Buff-cap: track Zeal/Holy Might by timers, not buff icons, in raids"
consumables:
  - "Flask of Supreme Power + spell power elixirs (spell build)"
  - "Dragonbreath Chili"
  - "Elemental Sharpening Stone (AP) or Shadow Oil (SP) when no Windfury totem"
  - "enchants (guide): Voracity arcanum, Zandalar Signet of Might, Subtlety cloak, Greater Stats chest, Superior Strength bracer, Greater Strength/Superior Agility/Minor Haste gloves, Greater Agility or Minor Speed boots, 2H Agility/Strength/Crusader"
mistakes_to_avoid:
  - "Mixing AP gear with an SP weapon or vice versa"
  - "Raiding under hit cap / with low weapon skill"
  - "Target swapping off the Wisdom target and running out of mana"
  - "Spamming Consecration as AP Ret"
  - "Letting Holy Might / Zeal expire; buff-icon macros at the raid buff cap"
  - "Judging right before a white swing so the seal is down for the hit"
  - "Expecting Fiery Weapon or +dmg items to proc Seal of Command"
