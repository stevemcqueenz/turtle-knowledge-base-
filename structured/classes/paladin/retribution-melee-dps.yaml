  key_items: Wrath of Cenarius, Sigil of Ancient Accord (T2 3pc only), Ring of Burning Talons, Kiss of the Spider [[d:paladin#1450304223454691438]]
    [[d:paladin#1475109939650363394]] [[d:paladin#1492194694179066080]] [[d:paladin#1430248290200457346]]
mistakes_to_avoid:
- Auto-attacking without a seal (judging right before a swing) [[d:paladin#1431381602033733664]]
- Clipping strike cooldowns by over-prioritising Judgement/reseal [[d:paladin#1485691856963506186]]
- 'Mixing gear types: Strength gear with SoR or SP weapon with SoC [[d:paladin#1445836991899111456]]'
- Letting Zeal/Holy Might drop at pull or between packs [[d:paladin#1481935203877388298]]
- Binding several seals + Judgement into one macro (>20% downtime) [[d:paladin#1431384577359745167]]
- Raiding under 8% hit or above 315 weapon skill [[d:paladin#1488219693293633586]]
- Improved Blessings on SoR; Vindication in PvE [[d:paladin#1458179706682736732]] [[d:paladin#1431510211994058812]]
- Libram swapping mid-fight (costs a GCD since 1.18.1)
- Necrodin with only one T2 3pc, or on trash [[d:paladin#1470319054094073979]] [[d:paladin#1472800680434598134]]
- Treating the 2026-04-01 "next patch" post as real (April Fools) [[d:paladin#1488852869212798987]]
