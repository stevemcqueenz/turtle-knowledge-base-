patch_validity:
  written_for: "1.17.2 / 1.18.0 talent trees; gearing thread from 2026-03 (pre-release)"
  valid_for_1181: partial
  notes: "1.18.1 buffed the AP build (Seal of Command 7 -> 9 PPM, Crusader Strike rank 5 90% -> 100% WD, Repentance tick +8% AP, Ret T3.5 Crusade 4%/20 s non-stacking) and front-loaded Consecration; T2.5 3-set became +15% JoR/JoC. Post-release Discord adds the missing SoC-vs-SoR numbers and stat/cap re-evaluation."
discord:
  channel: paladin
  scope: "post-1.18.1 Retribution PvE re-evaluation"
  sources:
    - {id: "1486723603952046090", era: post-1.18.1, agreement: single source, claim: "Dummy test: SoC + Libram of Ardour beats SoR + Libram of the Eternal Tower by ~30-40 DPS in full spell-ret gear (self-buffed, JoW + Imp JotC). Closes the forum's unanswered 'So how does the SoC work out?'"}
    - {id: "1485468559441137884", era: post-1.18.1, agreement: single source, claim: "'SoC/AP Ret is so back boys'"}
    - {id: "1486237473179697205", era: post-1.18.1, agreement: single source, claim: "'Spellret definitely is still very good, but there's a variety of specs that look playable now'"}
    - {id: "1488506685990506506", era: post-1.18.1, agreement: consensus, claim: "Both AP and spell builds 'largely viable in raid ... difference ... like 100 dps more or less'"}
    - {id: "1487604808247545886", era: post-1.18.1, agreement: single source, claim: "Top spell-ret still edges top AP-ret"}
    - {id: "1486002061677039879", era: post-1.18.1, agreement: contested, claim: "'HS out-damages CS on bosses' for spell ret vs the forum's 'spell ret in K40 wouldn't touch HS'"}
    - {id: "1487136588252184679", era: post-1.18.1, agreement: single source, claim: "Patchwerk/Naxx ret: ~1.8k typical, best log ~2.3k DPS"}
    - {id: "1487251547690631323", era: post-1.18.1, agreement: consensus, claim: "AP/SoC stat order: 8% hit > crit = AP > haste"}
    - {id: "1488219693293633586", era: post-1.18.1, agreement: consensus, claim: "Weapon skill: 310 plenty for SoR/hybrid, 315 good for SoC but not needed, >315 wasted"}
    - {id: "1484756149596061707", era: post-1.18.1, agreement: consensus, claim: "Physical/on-hit procs and spellstrikes do not proc Seal of Command"}
    - {id: "1485049652511244298", era: post-1.18.1, agreement: single source, claim: "T2 3-set doubled spellstrike counts as a separate spell instance and gives SoR 4 attempts per auto"}
    - {id: "1488852869212798987", era: post-1.18.1, agreement: staff, claim: "NEXT-PATCH ANNOUNCEMENT (2026-04-01, Lhian): spellstrikes stop proccing, Holy Strike next-attack rework, CS loses cooldown. Announced, NOT shipped"}
