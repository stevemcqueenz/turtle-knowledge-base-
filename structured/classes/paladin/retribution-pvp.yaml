stat_weights:
  stamina: "high - the PvP stat; spell-ret is criticised for having none [[d:paladin#1485052206989185095]]"
  attack_power_strength: "high for AP/SoC (the default PvP seal)"
  spell_power: "viable alternative (spell/SoR tree); contested"
  crit: "high (burst windows)"
  resilience: "does not reduce druid melee crit (specific to the druid matchup)"
caps: {}
rotation_single:
  - {priority: 1, action: "Seal of Command up; Judgement of Command for burst", condition: "always; SoC is the PvP seal, SoR points are wasted [[d:paladin#1380445706090844222]]"}
  - {priority: 2, action: "Repentance + Hammer of Justice chain CC", condition: "setup a kill; Repentance is now 'excellent' vs immune targets [[d:paladin#1324918396680273981]] [[d:paladin#1485101394544427152]]"}
  - {priority: 3, action: "Crusader Strike / Holy Strike", condition: "Zeal/Holy Might maintenance and burst"}
  - {priority: 4, action: "Judgement of Justice", condition: "ranged-stun tech: the seal can proc on the judgement hit; re-seal afterwards [[d:paladin#1491170906700251276]]"}
  - {priority: 5, action: "Cleanse / Hand of Freedom / BoP / Blessing of Sacrifice", condition: "support the team - the real value of a Ret in PvP [[d:paladin#1483197309121462443]]"}
  - {priority: 6, action: "Divine Shield", condition: "burst window; disabled in rated arena; -60% damage dealt (penalty contested)"}
rotation_aoe: []
aoe_threshold: 0
cooldowns:
  - {name: Divine Shield, use_when: "survive burst; disabled in rated arena"}
  - {name: Hammer of Justice, use_when: "kill-securing stun; ~30 s with Imp HoJ 3/3 + old PvP set"}
  - {name: Repentance, use_when: "CC / scaling tick on immune targets"}
  - {name: Hand of Protection, use_when: "anti-physical save; breaks Blind"}
resource_rules:
  - "Judgement of Wisdom melee for mana; keep the team cleansed and blessed"
consumables:
  - "Sappers, thorium grenades (stun), teas, pots, Frost Oils, Free Action Potion, Living Action Potion [[d:paladin#1483206266699386882]]"
  - "Run-speed boots; stamina enchants; engineering for grenades [[d:paladin#1491337490085445834]]"
mistakes_to_avoid:
  - "Using Seal of Righteousness in PvP (SoC is the PvP seal) [[d:paladin#1380445706090844222]]"
  - "Ignoring the support kit (Cleanse/BoP/Sacrifice/Freedom) [[d:pvp-general#1109073351412027432]]"
  - "Chasing kiters instead of bursting inside a HoJ/Repentance window"
  - "Mixing AP gear with an SP weapon or vice versa"
matchups:
  warrior: "win - Freedom + pillar-kite, then HoJ burst; prot/reckoning eats warriors"
  rogue: "win - survive the opener and connect once; BoP/bubble off Blind"
  shaman: "hard loss - Purge strips seal/Vengeance/blessings/Hands; no slow or charge"
  mage: "loss - nova/CS -> Poly, dispel Freedom, kite; lose the mana war"
  warlock: "loss - fear + Curse of Tongues; Soul Link 'mugs' paladins"
  priest: "loss (shadow) - dispel shield/fear, fear-resist gear; healer-priest is softer"
  druid: "hardest - kite/reset and out-sustain; resilience does not reduce druid melee crit"
  hunter: "contested - cannot be kited by the hunter but cannot catch one; Viper mana tax"
  paladin: "spec-dependent - prot beats ret 1v1; hpal out-sustains"
