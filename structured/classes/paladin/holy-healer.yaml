stat_weights:
  healing_power: "1"
  item_armor_plate: "high (Ironclad 2% of item armor as healing)"
  spell_crit: "medium (Daybreak, Illumination, Mending Light, Holy Shock)"
  intellect: "medium"
  mp5_spirit: "low"
  haste: "very low (Flash of Light on the GCD)"
  hit: "0 (heals land on miss)"
stat_priority: [healing-power, item-armor-on-plate, spell-crit, mp5/spirit]
stat_priority_note: "Healing power first (\"a great stat for everyone\"; Holy Strike scales with it too), then flat item armor on plate because Ironclad converts it, then spell crit (it applies Daybreak, procs Illumination and drives Mending Light, but overhealing limits its value), then mp5 and Spirit, which are low. Haste is nearly useless because Flash of Light sits on the global cooldown, and hit is not needed for heals."
caps: {}
rotation_single:
  - {priority: 1, action: "Seal of Wisdom, Blessing of Light on tanks, Concentration Aura when meleeing", condition: "setup"}
  - {priority: 2, action: "Judgement (Wisdom/Light) on the boss", condition: "on cooldown; makes next Holy Light 1 s faster; re-seal"}
  - {priority: 3, action: "Holy Light", condition: "big tank damage, right after a judgement (1.5-s cast)"}
  - {priority: 4, action: "Holy Shock", condition: "instant heal needed and available"}
  - {priority: 5, action: "Crusader Strike", condition: "in melee and Holy Shock on cooldown (Blessed Strikes reset)"}
  - {priority: 6, action: "Holy Strike", condition: "on cooldown when 2+ allies within 10 yd are wounded, or for mana"}
  - {priority: 7, action: "Flash of Light", condition: "filler for moderate damage"}
  - {priority: 8, action: "Lay on Hands / Hand of Sacrifice / Hand of Protection / Divine Shield", condition: "emergencies (no thresholds in sources)"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Holy Strike on cooldown", condition: "raid AoE damage and you are in the melee clump (see allowed/forbidden boss lists)"}
  - {targets_min: 2, priority: 2, action: "Crusader Strike -> Holy Shock reset on the lowest ally", condition: "between Holy Strikes"}
  - {targets_min: 2, priority: 3, action: "Flash of Light fill", condition: "always"}
aoe_threshold: 2
cooldowns:
  - {name: Lay on Hands, use_when: "tank about to die / self at 0 mana"}
  - {name: Hand of Sacrifice, use_when: "tank spike (no longer breaks CC)"}
  - {name: Divine Shield, use_when: "focused; heals continue"}
  - {name: Hand of Freedom, use_when: "ally slowed (24-s CD)"}
resource_rules:
  - "Seal of Wisdom melee and Holy Strike keep mana full; Illumination refunds on crits"
  - "Drink only with the group; Human/T2.5 regen-while-casting is a bonus, not required"
  - "Blessing of Light on tanks also buffs Holy Shock"
consumables:
  - "Brilliant Mana Oil"
  - "enchants (guide): Rumination arcanum, Zandalar Signet of Serenity, Subtlety cloak, Major Mana chest, Healing Power bracer/gloves, Healing Power weapon"
mistakes_to_avoid:
  - "Standing at range spamming Flash of Light in AoE fights"
  - "Meleeing on bosses with knockback/AoE stun/silence/fear (Atreidon list)"
  - "Forgetting to judge before Holy Light; letting Seal of Wisdom lapse"
  - "Counting Devotion Aura or enchant armor toward Ironclad"
  - "Stacking haste or mp5"
  - "Trying to heal/buff warlock demons"
