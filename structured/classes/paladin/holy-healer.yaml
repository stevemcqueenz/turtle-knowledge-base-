stat_weights:
  healing_power: 1 until ~1000; primary [[d:paladin#1461533285275668622]]
  spell_crit: 1% ~ 30-40 healing power at ~1200 +heal [[d:paladin#1429167222923984966]] [[d:paladin#1457971407039234274]];
    somewhat lower after the Daybreak nerf [[d:paladin#1486635309947949197]]
  intellect: high (core stat with crit and healing power) [[d:paladin#1487359832318148680]]
  item_armor_plate: 'Ironclad: 2% of item armor (only items) = healing power; ~50 armor = 1 HP; ~110-180 total [[d:paladin#1471286458932527104]]
    [[d:paladin#1440985549208031232]]'
  haste: only to ~3-4%; beyond that wasted on FoL [[d:paladin#1493729928125087845]]
  mp5_spirit: low [[d:paladin#1454169086941728808]] [[d:paladin#1461069979565686815]]
  hit: 0 (heals land on miss) [[d:paladin#1439760087060316180]]
caps:
  spell_hit_for_heals: none; Mending Light and the Holy Shock reset fire on a miss
  haste_soft_cap: ~3-4% [[d:paladin#1493729928125087845]]
  illumination_sufficiency: 3/5 Illumination + 30% crit -> never below 30% mana outside Kara40 [[d:paladin#1451675254115274915]]
  holy_strike_range: ~7.6 yd real (tooltip 10 yd) [[d:paladin#1478361089740902608]]
rotation_single:
- priority: 1
  action: 'Setup: Seal of Wisdom on self, Judgement of Wisdom on the boss/pack, Concentration Aura when meleeing'
  condition: pre-pull [[d:paladin#1492813841057448060]]
- priority: 2
  action: Holy Shock
  condition: target about to die and cannot wait for a Flash of Light [[d:paladin#1489753379583557704]]
- priority: 3
  action: Holy Light (1.5 s with the Holy Judgement buff)
  condition: tank just took a big hit (1.5-2k) or haste window; buff up [[d:paladin#1446996276322369546]] [[d:paladin#1425074584926949426]]
- priority: 4
  action: Holy Strike on a melee target
  condition: in melee, off cooldown, 3+ injured allies within ~7 yd, none about to die [[d:paladin#1399695295524110427]]
- priority: 5
  action: Flash of Light (max rank) on the tank/lowest
  condition: default filler - most of your casts [[d:paladin#1489753323253923850]]
- priority: 6
  action: Judgement + re-seal Wisdom
  condition: after using the 1.5 s Holy Light or when the judgement is about to drop [[d:paladin#1446997676200820840]]
- priority: 7
  action: Crusader Strike -> Holy Shock
  condition: only while moving and a single-target burst is needed; never during raid AoE [[d:paladin#1488534279020482730]]
- priority: 8
  action: Rank-1 Flash of Light on the tank
  condition: trash downtime, to leave Daybreak via crits [[d:paladin#1425107644166701136]]
- priority: 9
  action: Cleanse
  condition: magic/poison/disease on an ally; pre-cast before Naxx spider-wing poison [[d:paladin#1461076668021211320]]
rotation_aoe:
- targets_min: 3
  priority: 1
  action: Holy Strike on cooldown in melee range (heals you + 4 wounded allies, semi-smart)
  condition: 3+ injured within ~7 yd [[d:paladin#1399695295524110427]] [[d:paladin#1478361089740902608]]
- targets_min: 3
  priority: 2
  action: Flash of Light between Holy Strikes, max 3 per Holy Strike
  condition: always [[d:paladin#1399695295524110427]]
- targets_min: 3
  priority: 3
  action: 3 FoL + 1 Holy Strike loop
  condition: heavy constant raid damage (Vaelastrasz) [[d:paladin#1489558047897686076]]
- targets_min: 3
  priority: 4
  action: Rank-1 Consecration (Kara10 libram) + keep a Judgement up
  condition: easy raids, known fight [[d:paladin#1489557484732682260]]
aoe_threshold: 3
cooldowns:
- name: Lay on Hands
  use_when: tank emergency; with Improved LoH on Maexxna just before Web Wrap for +30% armor through Web/Enrage [[d:paladin#1466097719415410709]]
- name: Divine Intervention
  use_when: 'Maexxna: pre-DI a healer for each Web Wrap [[d:paladin#1466097683629342991]]'
- name: Divine Shield
  use_when: Nefarian fear, Razorgore stun; heals continue; does NOT stop Vael Adrenaline [[d:paladin#1465429349154160784]]
- name: Blessing of Protection
  use_when: DPS pulled aggro; bubble casters during AoE [[d:paladin#1484938782292840551]]
- name: Divine Favor
  use_when: passive (+10..50% Holy Shock crit), not a button
resource_rules:
- Seal of Wisdom -> Judgement of Wisdom -> Seal of Wisdom; Holy Strike refunds its own mana [[d:paladin#1487359832318148680]]
- 'Few long-lived targets (MC): keep JoW on one target; many short trash (Kara10): just keep SoW up [[d:paladin#1452727170827943976]]'
- Nordanaar Herbal Tea (~600 HP / 1100 mana, 2-min CD) separate from Major Mana Potion [[d:paladin#1485441517744029717]]
- Never spam max-rank Holy Light (~20 casts to OOM in BiS) [[d:paladin#1430556664322588823]]
- Set spell ranks manually in healing addons after the patch [[d:paladin#1485237459456622644]]
consumables:
- Wizard Oil (raises healing power; Dream Tonic does not) [[d:paladin#1449816904784150528]]
- Major Mana Potion + Nordanaar Herbal Tea [[d:paladin#1432035429934436393]]
- Dreamshard Elixir, Mageblood Potion, Cerebral Cortex Compound, Elixir of Fortitude [[d:paladin#1470529934270136330]]
- Flask of Distilled Wisdom, or Flask of the Titans in Kara40 (mana is not the bottleneck) [[d:paladin#1432435765123616890]]
- 'enchants (forum guide): Rumination/Focus arcanum or ZG Syncretist''s Sigil, Zandalar Signet of Serenity, Subtlety cloak,
  Major Mana chest, Healing Power bracer/gloves/weapon, Greater Stamina boots'
mistakes_to_avoid:
- Spamming max-rank Holy Light [[d:paladin#1436013333919830126]]
- Using Crusader Strike for Holy Shock resets during raid damage [[d:paladin#1488530603669454990]]
- Holy Striking from more than ~7 yd away [[d:paladin#1478361089740902608]]
- Meleeing fights with melee stuns/silences/knockbacks (Rupturan, Kruul, Atreidon's list)
- Haste above 3-4%; stacking mp5/Spirit over Int and crit
- Counting Devotion Aura/Toughness/enchants toward Ironclad (items only) [[d:paladin#1459771471294627891]]
- Trusting outdated BetterCharacterStats or launch-bug-week logs [[d:paladin#1485591086952091690]]
- Blessing of Light with only 1-2 Holy paladins [[d:paladin#1490560751939620984]]
- Believing the 2026-04-01 April Fools 'melee holy removed' post [[d:paladin#1488856415010291794]]
