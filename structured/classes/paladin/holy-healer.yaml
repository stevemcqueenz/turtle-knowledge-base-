patch_validity:
  written_for: 1.18.1 (live 2026-03-20), post-release state through 2026-04-21
  valid_for_1181: true
  notes: 'Talent tree layout unchanged by 1.18.1. 1.18.1 nerfed Daybreak (base 289 -> 248; ~16% base / ~26% scaling) and removed
    the Holy T3.5 5-set extra Holy Strike targets/+40% -> about -10% healing in Kara40 [[d:paladin#1486468604290535595]].
    Launch bugs: Mending Light missing its 5% base scaling and not healing on miss (fixed ~2026-03-23/24); ~3 h with no Holy
    Strike target cap; Holy Strike healing full-HP players (fixed by ~2026-04-09/12, now a semi-smart heal: wounded, not most-wounded);
    Holy Shock ~20% lower since the 2026-04-07 reset (unfixed as of 2026-04-19). The 2026-04-01 ''melee holy removed'' developer
    post was an APRIL FOOLS joke, not a patch.'
