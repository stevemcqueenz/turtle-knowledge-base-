boss_notes:
- boss: BWL (all)
  note: Razorgore stun in melee (FAP/bubble); Vael 3 FoL + 1 HS, hide behind the left column on Adrenaline (bubble does not
    help); suppression room mana gauntlet; Firemaw Holy Shock the tank on breath; Chromaggus dispel all, ~3 Hourglass Sand,
    bubble a bronze debuff to save one; Nefarian bubble the fear [[d:paladin#1465429349154160784]] [[d:paladin#1465430385386193027]]
  era: 1.18.1-announced-pre-release
- boss: Loatheb (Naxx)
  note: Holy Strike still heals through the lockout; Daybreak does not fire while silenced [[d:paladin#1462816619020554404]]
  era: 1.18.1-announced-pre-release
- boss: Maexxna (Naxx)
  note: DI strat + Improved Lay on Hands on the tank before Web Wrap [[d:paladin#1466097683629342991]] [[d:paladin#1466097719415410709]]
  era: 1.18.1-announced-pre-release
- boss: Heigan / Patchwerk (Naxx)
  note: melee-heal ('100% do it on heigan') [[d:paladin#1482319532700991570]]
  era: 1.18.1-announced-pre-release
- boss: Kara40 - Mephistroth
  note: safe for full melee healing [[d:paladin#1373985305526538301]]
  era: pre-1.18.1
- boss: Kara40 - Anomalus
  note: raid stacks; arcane-resist mail pieces keep healing power [[d:paladin#1393979859998343178]]
  era: pre-1.18.1
- boss: Kara40 - Kruul / Rupturan
  note: heal from range [[d:paladin#1422311244660080702]] [[d:paladin#1382265813800714351]]
  era: pre-1.18.1
stat_priority:
- healing-power
- armor
- spell-crit
- mp5
- spirit
stat_priority_note: 'Healing power first ("a great stat for everyone"; Holy Strike scales with it too), then flat item armor
  on plate because Ironclad converts it, then spell crit (it applies Daybreak, procs Illumination and drives Mending Light,
  but overhealing limits its value), then mp5 and Spirit, which are low. Haste is nearly useless because Flash of Light sits
  on the global cooldown, and hit is not needed for heals. mp5 and Spirit are a tie: no cited post ranks them against each
  other, so their order in the array above carries no ranking. Grouping them is this repository''s reading of the sources
  listed above.'
