agreement: contested
patch_validity:
  written_for: "1.18.0 (Daybreak rework, Holy Shock damage restored) with 1.18.1 announced"
  valid_for_1181: partial
  notes: "1.18.1 nerfed Daybreak (289 -> 248 base, 43% -> 32% scaling) and removed the Holy T3.5 5-set extra Holy Strike targets -> 10-25% effective-healing nerf. Mending Light shipped bugged (missing 5% base scaling, no target cap, no heal on miss/parry/dodge; hotfixed 2026-03-24). Post-release crit value dropped (~30%). The melee-heal identity is removed in the next patch (announced 2026-04-01, not shipped)."
discord:
  channel: paladin
  scope: "post-1.18.1 Holy healer state, coefficients, downranking, and the announced next-patch rework"
  sources:
    - {id: "1390647300568911932", era: 1.18.1-announced-pre-release, agreement: "single source (pinned sheet, staff-acknowledged)", claim: "Spell coefficients: Holy Light 0.71 SP, Flash of Light 0.43 SP, Holy Shock 0.43 SP, Daybreak 0.32 SP, Mending Light 0.05 SP"}
    - {id: "1304067941611999282", era: pre-1.18.1, agreement: consensus, claim: "Illumination post-CC2 ranks are 12/24/36/48/60% (5 ranks); the proposed 3-rank version never shipped"}
    - {id: "1429167222923984966", era: 1.18.1-announced-pre-release, agreement: single source, claim: "1% crit ~ 40 healing power, 1% haste ~ 20 healing power after 1200 +heal"}
    - {id: "1288672302166315113", era: pre-1.18.1, agreement: consensus, claim: "54 Int = 1% spell crit at 60 (client formula 53.77)"}
    - {id: "1426451644501065738", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Downranking: same +heal coefficient on all ranks except Holy Light 1-3; rank-1 FoL ~630 heal / 945 crit at 1200 +heal; Holy Light downranks to ~r6"}
    - {id: "1187065631812628552", era: pre-1.18.1, agreement: consensus, claim: "Tea with Sugar / Herbal Tea does not share the potion cooldown (uses the healthstone/rune CD)"}
    - {id: "1039609588305117214", era: pre-1.18.1, agreement: consensus, claim: "Paladin heals generate 25% of the heal as threat (other healers 50%); Lay on Hands 95%"}
    - {id: "1440253873276194857", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Melee loop: Judgement makes the next Holy Light 1.0 s faster; CS resets Holy Shock; ~3 FoL per Holy Strike"}
    - {id: "1463650043637530787", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Holy Strike healing triggers Daybreak on all targets"}
    - {id: "1484940046892007474", era: post-1.18.1, agreement: consensus, claim: "Mending Light shipped missing its 5% base scaling ('the base 5% ... is missing')"}
    - {id: "1484619599319142623", era: post-1.18.1, agreement: consensus, claim: "Mending Light had no target cap post-patch (healed every Kara40 group member)"}
    - {id: "1485376665772228618", era: post-1.18.1, agreement: consensus, claim: "Mending Light failed to heal on miss/parry/dodge"}
    - {id: "1484924634599264276", era: post-1.18.1, agreement: consensus, claim: "Combined Daybreak + T3.5 + Holy Strike healing hit is a 10-25% effective-healing nerf; crit value dropped ~30%"}
    - {id: "1485251611784773732", era: post-1.18.1, agreement: single source, claim: "Ironclad reported losing ~100 bonus healing post-1.18.1"}
    - {id: "1488852869212798987", era: post-1.18.1, agreement: staff, claim: "NEXT-PATCH ANNOUNCEMENT (2026-04-01, Lhian): 'melee holy paladin didn't work out - healing component on holy strike will be removed'. Announced, NOT shipped"}
