patch_validity:
  written_for: 1.17.2 / 1.18.0 (Class Changes 2 talent trees, bleed build introduced Oct 2024, became meta ~April-June 2025)
  valid_for_1181: true
  notes: '1.18.1 shipped no direct Feral DPS talent/ability changes; only a tank-threat nerf (irrelevant to DPS), two item
    hotfixes (Yoxtez +224 FAP, Fang of Alichos usable in forms) and a Kara40 armor-ignore trinket nerf that hurt cat itemization.
    Post-1.18.1 community view (consensus): Claw still beats Shred on every non-bleed-immune boss; cat is ''no longer the
    worst DPS spec - moonkin is'' [[d:druid#1492276296808661174]] [[d:druid#1486095894875996311]]. The forum KB''s ''builds
    cannot be decoded from text'' gap is now CLOSED by staging/talents: the dominant build is a decoded 11/35/5 [[d:druid#1413144334336790652]].'
discord:
  channel: druid
  scope: feral cat rotation/stat/gear detail, mostly 1.18.0-1.18.1 era; forum baseline retained
  sources:
  - id: '1413144334336790652'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: Pinned feral leveling/endgame build decodes to Balance 11 / Feral 35 / Restoration 5 (dominant cat build 2022-2026);
      'go Feral Swiftness first, at 30 respec into Omen, then continue down feral'
  - id: '1492276296808661174'
    era: post-1.18.1
    agreement: consensus
    claim: '''if the boss is not bleed immune Claw will always out dps Shred if played well... all top [1.18.1] parses are
      using claw''; Idol of Ferocity remains BIS, the bleed-duration idol only for bleed immunes'
  - id: '1379110362720505948'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: '''bleeds are there to empower your claw, not to deal damage'' - Claw is the damage, bleeds are energy/Opening-Wounds
      setup'
  - id: '1379245993777828001'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: '''get bleeds asap including 1 combo point rip'' - a 1-CP Rip is correct for Ancient Brutality ticks'
  - id: '1465494310060425328'
    era: 1.18.1-announced-pre-release
    agreement: single source
    claim: Bleeds+Shred with the Gnarlmoon idol vs pure Claw with Idol of Ferocity are close, Claw usually ahead; 'they both
      shit on simply shred, no bleed, powershift'
  - id: '1474083543985684691'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: Hit is the best stat until 5% gear + 3% Natural Weapons = 8%, then exactly zero value ('every point of hit has
      the same value till 5%')
  - id: '1379019592516636734'
    era: 1.18.1-announced-pre-release
    agreement: single source
    claim: 1% melee crit is worth ~31 attack power for cat
  - id: '1356892169587392522'
    era: 1.18.1-announced-pre-release
    agreement: single source
    claim: 'After the Ancient Brutality rework Int/Mana is dead weight for feral: ''126 Int worth of stats is basically lost''
      on T3.5'
  - id: '1473623513289199667'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: 'Cat scaling is one-dimensional: hitting crit cap, very low hit cap, no weapon skill, low haste value, AP the only
      scaling; Fortune cannot be used'
  - id: '1474308606412329023'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: 'Fortune / chance-on-hit is dead for feral: ''10% proc chance on 0% proc chance remains 0''; chance-on-equip still
      works [[d:druid#1474308602901692426]]'
  - id: '1378786659751034930'
    era: 1.18.1-announced-pre-release
    agreement: single source
    claim: 'Energy-tick powershift rule: ''dot -> claw/shred/fb. Ps when energy<20 or 15, no energy-tick check. Ps for claw
      when 35<energy<40 with energy tick at the 1.7s mark, otherwise cast rake'''
  - id: '1379632585579302923'
    era: 1.18.1-announced-pre-release
    agreement: single source
    claim: 'Bleed-immunity map: Baron Geddon can be Raked but not Ripped'
  - id: '1357078255156596956'
    era: pre-1.18.1
    agreement: single source
    claim: 'Kara40: >50% of mobs immune to bleeds; worgen adds immune [[d:druid#1357383852103831572]]; Anomalus immune [[d:druid#1360632960835125368]]'
  - id: '1357888923397001407'
    era: 1.18.1-announced-pre-release
    agreement: single source
    claim: 'Naxx: every boss bleedable except KT and Saph; ''AQ40 gets to a point where it''s so fast you better not bleed'''
  - id: '1379915071475548191'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: Wolfshead Helm effect moved to a repeatable helm enchant (Wolfsheart, 20 energy) - a helm is no longer required
  - id: '1412860092692299806'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: 'Pinned FAQ: MCP works no more (30-min CD, not in form); weapon is a stat stick; chance-on-hit does not work in
      form; melee hit cap 8%'
  - id: '1401730050738487519'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: 'Post-1.18 tree is point-starved: with Furor+Omen locked in and Open Wounds at 3 points, cats are one point short
      of a full DPS build'
  - id: '1484464772115206204'
    era: post-1.18.1
    agreement: single source
    claim: 'Leveling weapon stat-stick progression: Smite''s Mighty Hammer 18 -> Manual Crowd Pummeler 28 -> Thornroot Maul
      32 -> Grimlock''s Charge 42 -> Ice Barbed Spear 51 -> gear sheet'
  - id: '1475223670724231231'
    era: 1.18.1-announced-pre-release
    agreement: consensus
    claim: Cat has no real AoE and does not need one; raid value is Innervate/CR, Faerie Fire and crit aura
