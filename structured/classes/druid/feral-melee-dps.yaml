  action: Hurricane from caster form
  condition: only with a spell-power set or Atiesh [[d:druid#1470733797904617472]]
aoe_threshold: 3
cooldowns:
- name: Tiger's Fury
  use_when: keep 100% uptime; off GCD; 18 s, +attack speed, 10 energy/3 s [[d:druid#1468957031791591573]]
- name: Berserk
  use_when: 6-minute cooldown; long bleedable bosses [[d:druid#1465511791173042258]]
- name: Reshift
  use_when: 'level-60 spell: re-enter Cat Form for up to 60 energy with Furor + Wolfshead enchant; only when TF is about to
    expire [[d:druid#1459798058324725914]]'
- name: On-use trinkets (ZHC, ToEP, KotS)
  use_when: pull and last 20% of the fight [[d:druid#1426991920953036942]]
resource_rules:
- Energy comes from Ancient Brutality bleed ticks and Tiger's Fury; powershift only when TF is about to expire, since Reshift
  drops TF [[d:druid#1431630116252942337]]
- Reshift at 28+ energy only if a tick would waste; 28 = 1 tick from Shred [[d:druid#1482840263985725440]]
- Wolfshead head enchant needed for bleed-immune powershifting [[d:druid#1434217422692421763]]
- Idol swaps cost a GCD since 1.18.1; macro swaps have a ~30 s ICD [[d:druid#1488420223047696424]]
- Track bleeds with Cursive (handles Carnage refresh) [[d:druid#1440573427277631562]]
consumables:
- Juju Power > Elixir of Giants; Elixir of the Mongoose; Juju Might > Winterfall Firewater; Ground Scorpok Assay > R.O.I.D.S.;
  Power Mushroom = Smoked Desert Dumplings; Consecrated (Undead) > Elemental Sharpening Stone; Mighty Rage Potion > Quickness
  Potion; Juju Flurry; Elixir of Demonslaying; Swiftness of Zanza [[d:druid#1461753276017152021]]
- One item per bucket (Juju Might/Firewater; Juju Power/Giants); scrolls do not stack with elixirs [[d:druid#1475814371534835852]]
  [[d:druid#1433887910083428544]]
- +damage sharpening stones do nothing in form; crit stones work [[d:druid#1464013524178309190]]
- Idol of Ferocity BiS; Idol of Laceration for bleed-immune [[d:druid#1492276296808661174]] [[d:druid#1453678172548759619]]
- Weapon enchant +25 Agility [[d:druid#1469280847407349878]]; head Wolfshead (Moonglade repeatable quest) [[d:druid#1493535288524275722]]
mistakes_to_avoid:
- Bleed rotation on a bleed-immune boss [[d:druid#1476991316775931974]]
- Ferocious Bite below 5 CP on bosses (loses the Carnage refresh) [[d:druid#1450153022339547290]]
- Reshifting every time energy is low (drops Tiger's Fury) [[d:druid#1431630116252942337]]
- Spending Clearcasting on Claw instead of Shred [[d:druid#1427967004635037858]]
- Hit above 8% [[d:druid#1474083543985684691]]
- Farming the Manual Crowd Pummeler for its effect [[d:druid#1462512365827260602]]
- Gearing by weapon DPS or chance-on-hit procs [[d:druid#1444040448451678338]]
- Taking DFT/Accuria from rogues or warriors when hit-capped [[d:druid#1444178527732891678]]
