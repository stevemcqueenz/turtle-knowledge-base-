leveling_by_bracket:
  - {bracket: "1-10", advice: "Caster/melee only - no Bear Form until 10. '1-10 wrath spam'.", sources: ["[[d:druid#1359148907841458309]]", "[[d:druid#1304615970706558986]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "10-19", advice: "'10-22 bear' - Bear Form + Swipe cleave is the fast early pattern; pull 2-3 with Moonfire/Insect Swarm then Bear-Swipe.", sources: ["[[d:druid#1359148907841458309]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "20-29", advice: "Cat Form at 20 makes Feral dominant ('23+ cat'); single-target Cat is faster than Bear AoE once geared.", sources: ["[[d:druid#1359148907841458309]]", "[[d:druid#1294200479781355572]]", "[[d:druid#1294200215435219027]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "30-39", advice: "Respec into Omen of Clarity at 30 when Travel Form arrives; Swift Travel Form is a baseline questline from Loganaar, Moonglade.", sources: ["[[d:druid#1413144334336790652]]", "[[d:druid#1325097793362071574]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "40-49", advice: "Fill Feral (Predatory Strikes, Blood Frenzy, Improved Shred, Heart of the Wild); Feral Barkskin ranks at 44/52/60.", sources: ["[[d:druid#1304615970706558986]]"], era: pre-1.18.1, agreement: single source}
  - {bracket: "50-60", advice: "Berserk, Heart of the Wild 5, Leader of the Pack, Carnage.", sources: ["[[d:druid#1304615970706558986]]"], era: pre-1.18.1, agreement: single source}
  - {bracket: "weapons", advice: "Stat-stick weapon progression (Micro Jackson): Smite's Mighty Hammer 18, Manual Crowd Pummeler 28, Thornroot Maul 32, Grimlock's Charge 42, Ice Barbed Spear 51, then the gear sheet at 60.", sources: ["[[d:druid#1484464772115206204]]"], era: post-1.18.1, agreement: single source}
stat_weights:
  strength_agility: "primary - forms convert weapon-slot items into flat Feral Attack Power/weapon damage ('stat-stick' scaling)"
  hit: "BEST stat until the effective cap, then ZERO - 5% from gear + 3% from Natural Weapons = 8%; 'you lose all your energy regardless of whether you hit or not... by far the best stat till you get 5% from it + 3% from talents. And then it has 0 value' [[d:druid#1474083543985684691]]"
  crit: "medium-high - 1% crit ~= 31 AP (single source) [[d:druid#1379019592516636734]]; cat reaches crit cap near T3.5"
  haste: "contested/low - community argues item design overrates it; cat gets only ~20-30% of damage from autoattacks vs ~50% for other melee (single source, unconfirmed)"
  intellect: "dead - after the Ancient Brutality rework energy no longer depends on mana on T3.5: '126 Int worth of stats is basically lost' [[d:druid#1356892169587392522]]"
  fortune: "unusable - the new 1.18.1 Fortune stat cannot scale feral, because chance-on-hit does not proc in form [[d:druid#1474308606412329023]]"
  scaling_note: "Cat scaling is one-dimensional: crit cap, very low hit cap, no weapon skill, low haste value, AP-only - linear vs other classes' 3+ stats [[d:druid#1473623513289199667]]"
caps:
  hit_cap_melee: "8% (5% effective with Natural Weapons 3/3, +3% hit); above cap hit is worthless [[d:druid#1474083543985684691]]"
  weapon_skill_in_form: "fixed at 300 regardless of gear - permanent glancing-blow tax, no known fix"
  crit_cap: "reachable near T3.5 ('39.5 crit ... crit capped' is a Balance profile; cat likewise hits crit cap per [[d:druid#1473623513289199667]])"
rotation_single:
  - {priority: 1, action: "Rake", condition: "bleed/claw build opener, non-bleed-immune target; bleeds exist to 'empower your claw' and feed Ancient Brutality [[d:druid#1379110362720505948]]"}
  - {priority: 2, action: "Rip", condition: "apply ASAP, even at 1 combo point - do not wait for 5 CP [[d:druid#1379245993777828001]]"}
  - {priority: 3, action: "Claw", condition: "the damage filler; Claw every GCD while bleeds tick - 'if the boss is not bleed immune Claw will always out dps Shred if played well' [[d:druid#1492276296808661174]]"}
  - {priority: 4, action: "Ferocious Bite", condition: "5 CP finisher only if it will not clip a bleed refresh; powershift after Bite to refill [[d:druid#1401035199936200805]]"}
  - {priority: 5, action: "Powershift (Reshift)", condition: "energy management: 'ps when energy<20 or 15, no energy-tick check; ps for claw when 35<energy<40 with energy tick at the 1.7s mark, otherwise cast rake' [[d:druid#1378786659751034930]]"}
  - {priority: 6, action: "Shred", condition: "use on bleed-immune targets or when the bleed/Claw setup cannot stick; 'if things are bleeding, revert to the powershifting rotation' [[d:druid#1461678497025228802]]"}
  - {priority: 7, action: "switch to powershift/Shred rotation", condition: "target is bleed-immune (large DPS loss to stay in bleed mode)"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "shift to Bear Form and Swipe", condition: "2-3 add packs - cat has no dedicated AoE tool and does not need one [[d:druid#1475223670724231231]]"}
aoe_threshold: 2
cooldowns:
  - {name: "Tiger's Fury", use_when: "on cooldown; with 1.18.0 it returns baseline energy. Post-reshift top Patchwerk logs stopped reshifting entirely and floated 1300-1400 dps [[d:druid#1414582129525915749]]"}
  - {name: "Berserk", use_when: "6-minute cooldown, criticized as too long for reliable raid DPS windows (+100% energy regen in Cat)"}
  - {name: "Reshift (Turtle custom)", use_when: "one-button drop+re-enter of the current form; the modern powershift button [[d:druid#1459798383756840972]]"}
resource_rules:
  - "Bleed build: sustain energy via Ancient Brutality bleed-tick return and Idol of Laceration / Idol of Ferocity procs; a 1-CP Rip is worth it just for the ticks"
  - "Powershift build: sustain energy via Furor + the Wolfsheart helm enchant (Wolfshead's effect, now a repeatable enchant) [[d:druid#1379915071475548191]]"
  - "Watch the 1.7 s server energy tick before reshifting to avoid wasting a tick [[d:druid#1378786659751034930]]"
  - "Track bleed durations with an addon (Cursive, DoTimer, or SuperWoW-based tracker) - native UI cannot reliably show more than 32 buffs/16 debuffs"
consumables:
  - "Idol of Ferocity - BIS for most cat slots; the bleed-duration (Black Morass/Gnarlmoon) idol only for bleed-immune bosses [[d:druid#1492276296808661174]]"
  - "Idol of Laceration - core bleed-build finisher refund; T2.5 3-piece + Idol of Ferocity is strong [[d:druid#1387698224281817241]]"
  - "Feral Attack Power (FAP) items prioritized regardless of nominal weapon slot; Yoxtez (+224 FAP, 1.18.1 hotfix), Fang of Alichos (usable in forms, 1.18.1 hotfix)"
  - "Melee consume list shared with bear: Juju Power, Elixir of the Mongoose, R.O.I.D.S., Elixir of Firewater, Elixir of Superior Defense, Str/haste food, crystal ward; STR buffs do not stack with STR and AP with AP, R.O.I.D.S. stacks with Elixir of Giants [[d:druid#1475757404493713469]]"
  - "A Kara40 armor-ignoring trinket (Shieldrender's Talisman) was nerfed in 1.18.1 and is a big DPS loss at the top end [[d:druid#1474303149903970336]]"
  - "No pre-raid BiS list found in sources (gap) - channel defers to external gear sheets [[d:druid#1412860092692299806]]"
mistakes_to_avoid:
  - "Playing the bleed rotation on a bleed-immune target instead of switching to powershift/Shred [[d:druid#1461678497025228802]]"
  - "Assuming Fortune / chance-on-hit items work in feral forms - they do not [[d:druid#1474308606412329023]]"
  - "Itemizing Int on T3.5 cat after the Ancient Brutality rework [[d:druid#1356892169587392522]]"
  - "Letting Tiger's Fury drop mid-fight by shifting carelessly"
  - "Waiting for 5 combo points before the first Rip - a 1-CP Rip is correct [[d:druid#1379245993777828001]]"
  - "Powershifting without watching the 1.7 s energy tick [[d:druid#1378786659751034930]]"
  - "Expecting cat to carry AoE pulls instead of switching to Bear/Swipe"
  - "Chasing MCP - it no longer works in form [[d:druid#1412860092692299806]]"
supersedes:
  - {claim: "The forum README's 'every druid build link cannot be decoded from text'", verdict: "FALSE - the links decode; the consensus cat tree is a decoded 11/35/5", sources: ["[[d:druid#1413144334336790652]]"]}
  - {claim: "MCP is a feral requirement (pre-CC2 forums)", verdict: "MCP is dead: 'it does not work in form and has a 30 minute cd'", sources: ["[[d:druid#1412860092692299806]]"]}
  - {claim: "Powershifting is the main energy engine (pre-1.18.0)", verdict: "1.18.0 added baseline Tiger's Fury energy return + Reshift; top Patchwerk logs stopped reshifting", sources: ["[[d:druid#1414582129525915749]]"]}
  - {claim: "Bleed/Claw is a leveling alternative only (early 2025)", verdict: "By mid-2025 and in 1.18.1 Claw/bleed is the single-target meta on non-immune bosses", sources: ["[[d:druid#1492276296808661174]]"]}
gaps:
  - "No pre-raid BiS list (channel defers to external Google Sheets) [[d:druid#1412860092692299806]]"
  - "No named post-1.18.1 cat armor-ignoring trinket replacement beyond 'Shieldrender's Talisman was nerfed'"
  - "No single resolved cat tree after the Open Wounds move (the 11/35/5 variants differ only in bleed-vs-bear points)"
