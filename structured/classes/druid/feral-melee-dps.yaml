agreement: contested
agreement_notes: >-
  Consensus since spring 2025 that the bleed/claw build out-damages powershifting on
  bleedable targets and that powershift Shred is mandatory on bleed-immune targets;
  contested whether powershifting inside the bleed build is a gain (Mundane) or a loss
  (Noephix); contested overall standing (strong at AQ40 gear, weak in Kara40 post-1.18.1).
patch_validity:
  written_for: "1.18.0 kit (2025-07-25 / 2025-08-14 revision); standing updated with post-1.18.1 posts"
  valid_for_1181: true
  notes: >-
    1.18.1 changed no cat talent or ability (Jamey p166071 lists only Maul/Savage Bite
    threat for bear). Item changes: idol swap GCD, Herald of Woe 224 FAP, Yoxtez +224 FAP,
    Shieldrender rework (player-reported nerf). Advice mentioning MCP is obsolete since
    2024-10-12 (no longer works in forms).
