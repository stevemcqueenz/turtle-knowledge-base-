stat_weights:
  priority: hit to 8% (5% gear) > Strength ~= Agility > Attack Power > crit (to soft cap 53.5%) > haste (contested) ; Int,
    weapon skill, weapon DPS, Fortune, armor pen ~0
  hit: every point equal to 5% from gear (+3% Natural Weapons = 8%), then zero [[d:druid#1474083543985684691]] [[d:druid#1491668912226435324]]
  strength: 1 Str = 2.4 feral AP with Heart of the Wild [[d:druid#1491356797762797638]]
  agility: 1 Agi = 1 AP + 0.05% crit (20 Agi = 1% crit) [[d:druid#1463132050713477163]]; Str vs Agi contested, very close
    [[d:druid#1474744918055587900]]
  attack_power: 1
  crit: ~31 AP per 1% (single source) [[d:druid#1379019592516636734]]; soft cap 53.5% when hit-capped [[d:druid#1472205479097794595]]
  haste: 'contested: vanilla sims call it worst; Turtle players value 1% ~26 AP due to permanent Tiger''s Fury and Omen procs
    [[d:druid#1443944690142412931]]; good with T3.5 set'
  intellect: 0
  fortune: 0
  weapon_skill: 0
  weapon_dps: 0
  note: No Turtle-correct stat weights exist; use Krokat feral-sim [[d:druid#1443940954225770580]] [[d:druid#1461294464055115799]]
caps:
  hit_cap_melee: 8% vs level-63 (5% from gear with Natural Weapons 3/3); ~5% vs level 61-62 trash [[d:druid#1447726944626938069]]
  crit_soft_cap: 53.5% white-hit (hit capped); hard cap 93.5% [[d:druid#1472205479097794595]]
  weapon_skill_in_form: fixed, no benefit from weapon skill; more glancing blows than other melee [[d:druid#1470810086275420367]]
rotation_single:
- priority: 0
  action: 'Opener: Prowl -> Tiger''s Fury (before an energy tick) -> Pounce -> Rake -> Rip -> Claw to 5 -> Ferocious Bite;
    no stealth: Faerie Fire (Feral)'
  source: '[[d:druid#1426703699757105283]] [[d:druid#1381546501913972766]]'
- priority: 1
  action: Tiger's Fury
  condition: buff (Blood Frenzy/TF) missing; off GCD
  source: '[[d:druid#1463118416008183876]]'
- priority: 2
  action: Rip
  condition: 'target bleedable AND Rip missing AND combo_points==5 (fight <30s: Rip at 1-3 CP)'
  source: '[[d:druid#1437413011580256336]] [[d:druid#1482762940250718291]]'
- priority: 3
  action: Ferocious Bite
  condition: combo_points==5 AND Rip up (Carnage refreshes Rip+Rake); on fast trash 4 CP ok; never <5 on bosses
  source: '[[d:druid#1450153022339547290]] [[d:druid#1450167466859958433]]'
- priority: 4
  action: Rake
  condition: target bleedable AND Rake missing
  source: '[[d:druid#1462552241461268501]]'
- priority: 5
  action: Shred
  condition: Clearcasting AND behind target
  source: '[[d:druid#1427967004635037858]]'
- priority: 6
  action: Claw
  condition: filler on bleedable targets
  source: '[[d:druid#1492276296808661174]]'
- priority: 7
  action: Reshift
  condition: energy < 28-32 AND Tiger's Fury < 3 s left AND no energy tick imminent; recast TF after (Reshift drops TF)
  source: '[[d:druid#1480881704733511861]] [[d:druid#1482843960857722960]]'
- priority: 8
  action: 'Bleed-immune target: Tiger''s Fury; Ferocious Bite at 5 CP; Shred from behind; Reshift below 28 energy'
  condition: target bleed-immune (Kara40 Anomalus/Medivh/Chess/Rupturan, Kruul P2, some MC bosses)
  source: '[[d:druid#1469613082983530559]] [[d:druid#1476991316775931974]]'
rotation_aoe:
- targets_min: 3
  priority: 1
  action: keep single-target rotation on kill target
  condition: cat has no AoE by design [[d:druid#1472862240754372713]]
- targets_min: 3
  priority: 2
  action: shift to Bear and Swipe (3-target cap)
  condition: only if the tank needs help [[d:druid#1460831352915103879]]
- targets_min: 5
