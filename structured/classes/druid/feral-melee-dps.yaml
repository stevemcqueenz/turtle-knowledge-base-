rotation_single:
  - {priority: 0, action: "Choose rotation", condition: "Target not bleed-immune -> bleed/claw (no shifting). Bleed-immune -> powershift Shred. Naxx: almost nothing immune; Kara40: immune from Anomalus to chess and trash until portal orb, plus Rupturan; MC: many immune."}
  - {priority: 1, action: "Tiger's Fury", condition: "Before pull and whenever Blood Frenzy (20% AS, 18s) / +10 energy per 3s buff is down; never shift while it is up"}
  - {priority: 2, action: "Rake", condition: "Not on target (bleed for Open Wounds +Claw dmg, Ancient Brutality energy)"}
  - {priority: 3, action: "Rip", condition: "5 combo points and Rip not on target (10-18s by CP); Idol of Laceration refund chance"}
  - {priority: 4, action: "Shred", condition: "Omen of Clarity proc, or Idol of Laceration refund active, and behind target"}
  - {priority: 5, action: "Claw", condition: "Builder when both bleeds are up (contested with Shred as default builder)"}
  - {priority: 6, action: "Ferocious Bite", condition: "5 CP, both bleeds have >= their own refresh window left, spare energy (FB +0.5% per extra energy, +3/4/5% per bleed)"}
  - {priority: 7, action: "Powershift (fallback rotation)", condition: "Bleed-immune target only: Shred at >=60 energy, shift when energy too low (macro <=30) and no tick imminent, FB at 5 CP; Wolfsheart helm enchant + Furor required"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Stay single-target in cat", condition: "No cat cleave exists; sources call cat AoE weak"}
  - {targets_min: 4, priority: 1, action: "Bear Swipe", condition: "Only if rage available (usually not as non-tank); AQ20 3-set adds 1 target"}
  - {targets_min: 4, priority: 2, action: "Hurricane (caster form)", condition: "Not competitive without spell power"}
aoe_threshold: 4
cooldowns:
  - {name: Berserk, use_when: "6-min CD; on boss pull or burst phase; do not shift out of cat while active"}
  - {name: "Tiger's Fury", use_when: "Maintain Blood Frenzy and energy regen; lost on shapeshift"}
  - {name: "Omen of Clarity", use_when: "Cast the 30-min buff; spend procs on Shred, never Ferocious Bite"}
  - {name: "Trinkets (Earthstrike, Slayer's Crest / Blackhand's Breadth, KT trinket)", use_when: "ES + Slayer's on long fights, ES + BhB short fights, ES + Kel'Thuzad trinket in Naxx (Inovatu 2024)"}
  - {name: Tranquility, use_when: "On raid-lead call; raid-wide, 30-min CD"}
  - {name: Innervate, use_when: "Healer, unless powershifting mana is needed"}
resource_rules:
  - "Energy: Ancient Brutality 3/5 per bleed tick; Tiger's Fury +10 per 3s; Idol of Laceration 20%/CP chance to refund 15 energy on next Shred; AQ20 3-set 8%/CP chance to restore 35 energy"
  - "Powershift gives 40 (Furor) + 20 (Wolfsheart) = 60 energy but loses autos, Tiger's Fury and a GCD (Noephix); worth it only on bleed-immune targets"
  - "Mana only matters for powershifting; Reshift (lvl 60) costs 35% base mana; Idol of the Wildshifter -75 mana per shift"
  - "Combo points persist through shapeshifting (staff 2024-10-12)"
consumables:
  - "Mighty Rage Potion (usable in form since 2024-10-21)"
  - "Jujus, Gift of Arthas, Lucidity, bandages usable in forms (1.18.0)"
  - "Elemental Sharpening Stone (crit works on paws; weightstones do not) - medium confidence"
  - "Dragonbreath Chili, Battle Chicken, Tel'Abim haste food, Elixir of the Mongoose (vanilla baseline melee consumes)"
mistakes_to_avoid:
  - "Running only one spec; bleed cats fall off a cliff on bleed-immune bosses"
  - "Powershifting inside the bleed build (or refusing to powershift on immunes)"
  - "Shifting with Berserk active"
  - "Ferocious Bite on a Clearcasting proc"
  - "Hit above cap; intellect/spirit tier stats; weapon-skill or Windfury/chance-on-hit items (do not work in forms)"
  - "Following MCP-era advice after 2024-10-12"
