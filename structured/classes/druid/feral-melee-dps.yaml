stat_priority:
- hit
- strength
- agility
- crit
- haste
stat_priority_note: 'Melee hit cap is 8%, or 5% with Natural Weapons 3/3; hit above the cap does nothing and cannot reduce
  dodge or parry, which key off weapon skill. Cat form is permanently stuck at 300 weapon skill, so a feral cannot buy down
  glancing blows the way other melee can. Strength and Agility are the scaling stats because forms convert weapon-slot items
  into flat Feral Attack Power. Crit is valued but no source gives it a weight. Haste is CONTESTED and the community considers
  it overvalued by item designers, since only about 20–30% of feral damage comes from auto-attacks. Intellect on the T2.5/T3.5
  sets is contested — useful for PvP shifting, considered wasted stat points in PvE. Strength and Agility are a tie: no cited
  post ranks them against each other, so their order in the array above carries no ranking. Grouping them is this repository''s
  reading of the sources listed above.'
