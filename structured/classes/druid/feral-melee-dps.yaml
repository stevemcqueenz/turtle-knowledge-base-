play_loop:
  opener:
  - Prowl
  - Tiger's Fury (just before an energy tick)
  - Pounce
  - Rake
  - Rip
  - Claw to 5 combo points
  - Ferocious Bite
  - 'no stealth: Faerie Fire (Feral) first'
  single_target:
  - priority: 1
    action: Tiger's Fury
    condition: buff missing; off GCD
  - priority: 2
    action: Rip
    condition: bleedable, Rip missing, 5 CP (1-3 CP if fight < ~30 s)
  - priority: 3
    action: Ferocious Bite
    condition: 5 CP and Rip up (Carnage refreshes bleeds)
  - priority: 4
    action: Rake
    condition: bleedable, Rake missing
  - priority: 5
    action: Shred
    condition: Clearcasting and behind
  - priority: 6
    action: Claw
    condition: filler
  - priority: 7
    action: Reshift then Tiger's Fury
    condition: energy < 28-30, no tick due, TF < 3 s left
  - priority: 8
    action: 'bleed-immune: Tiger''s Fury > Ferocious Bite at 5 CP > Shred > Reshift below 28 energy'
    condition: target bleed-immune
  aoe:
    targets_min: 3
    loop:
    - keep single-target rotation on the kill target (no cat AoE)
    - shift to Bear and Swipe only if the tank needs help
    - Hurricane from caster form only with a spell-power set or Atiesh
  cooldowns:
  - 'Tiger''s Fury: 100% uptime, off GCD'
  - 'Berserk: 6-minute cooldown, long bleedable bosses'
  - 'on-use trinkets: pull and last 20%'
  guide_section: guide/classes/druid/feral-cat.md#how-to-play
