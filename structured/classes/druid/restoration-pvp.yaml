agreement: consensus
patch_validity:
  written_for: "1.17.2 / 1.18.0 (thread runs Oct 2025 through the 1.18.1-announced-pre-release era)"
  valid_for_1181: unknown
  notes: "No dedicated post-1.18.1 re-test thread found beyond a single one-line post-patch complaint (Wosator, 2026-03-23) agreeing the spec is still weak. The Blind-becomes-a-physical-debuff PvP-system change referenced in-thread is a general PvP change, not confirmed Druid-specific or dated to 1.18.1 in the master changelog."
talents:
  build_name: "General Restoration healer build, PvP-adjusted (no dedicated PvP point list found)"
  build_link: null
  points: []
  leveling_order: []
stat_weights:
  stamina: "prioritized over Resilience per one detailed report ('Focus on stamina gear over anything else'); Resilience alone reported insufficient against Envenom-spec Rogues even fully stacked"
stat_priority: [stamina]
stat_priority_note: "\"Focus on stamina gear over anything else\" [Frantsel p=156428]. Whether Resilience is worth anything is CONTESTED and unresolved: a fully Kara-geared, all-stamina-enchanted, titan-flasked druid still died to an Envenom rogue's opener, and the report concludes \"resilience won't save you btw\" — but the burst in question (Dissolvent Poison) was separately flagged as likely to be hotfixed. Stealth-detection items are tracked separately in the playbook; they are gear, not a combat stat."
caps: {}
rotation_single:
  - {priority: 1, action: "Lesser/Greater Arcane Protection Potion + Fire/Frost/Arcane/Shadow (LAP/FAP-type) potions", condition: "pre-engagement if possible"}
  - {priority: 2, action: "Rejuvenation, Barkskin, Faerie Fire, Nature's Grasp", condition: "opening defensive sequence against an incoming Rogue"}
  - {priority: 3, action: "save PvP trinket for Kidney Shot, not the opening stun", condition: "post-1.18.1 caveat: trinketing may let the Rogue Blind-and-reset instead, since Blind is reportedly now a physical debuff"}
  - {priority: 4, action: "shift to Bear Form", condition: "near-mandatory once an engagement starts or is expected; survive-then-disengage, not a win condition"}
  - {priority: 5, action: "Feral Charge or Nature's Grasp/roots", condition: "create separation once stabilized"}
rotation_aoe: []
aoe_threshold: null
cooldowns:
  - {name: "PvP trinket", use_when: "Kidney Shot, not the opening Cheap Shot/Ambush"}
  - {name: "Bear Form", use_when: "expected or in-progress Rogue engagement"}
resource_rules: []
consumables:
  - "Crunchy bread (Blind removal)"
  - "Catseye Goggles, Catseye Elixir, Druid PvP-rank gloves, 'Dyad of Twitching Elf Ears' — stack for ~+58 stealth detection to spot Rogues before their opener"
mistakes_to_avoid:
  - "Fighting in caster form against a Rogue instead of shifting to Bear at the first sign of engagement"
  - "Trinketing the opening stun instead of saving it for Kidney Shot"
  - "Assuming Resilience alone solves Rogue burst"
  - "Queuing solo into arena as Restoration without a coordinated peeling partner"
  - "Skipping the 3-4 piece PvP set bonus in favor of higher-item-level PvE pieces"
