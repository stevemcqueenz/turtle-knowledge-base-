stat_priority_note: Crit is rated far above haste — "1% crit equal to around 4-5% Haste. It might even be worse" — because
  crit triple-dips (damage per cast, the Nature's Grace haste proc, and the Eclipse multiplier) while haste only really helps
  Starfire. Hit is hard to cap from set gear alone (the nine-piece T3 set carries only 4% spell hit), and several top players
  deliberately trade a few percent of hit for crit. Spell power is the baseline scaling stat with no numeric weight given.
  Item design loads Balance gear with haste, which the source calls a mismatch.
