agreement: contested
patch_validity:
  written_for: "1.17.2 / 1.18.0 Eclipse rework (Wrath 30%/Starfire 50% proc chance, bonus = 10% + 60% of spell crit)"
  valid_for_1181: true
  notes: "1.18.1 changed Eclipse proc chances to Wrath 40%/Starfire 60% (2026-03-19 revision) and raised Moonfury to 4/8/12% (2026-01-26). Balance of All Things was reduced 5 -> 3 points and reworked TWICE: the 2026-01-26 revision gave Starfire -0.2/0.4/0.6 s cast time vs Moonfire'd targets [[d:druid#1465349903348924598]]; the 2026-03-19 revision REPLACED that with +3/6/9% crit, which players read as a net nerf. Any pre-release note quoting the cast-time version is stale. Post-1.18.1: community calls Balance the worst 'proper' DPS spec, sims show 1.18 peak 1549.2 vs 1.18.1 1454.0 DPS [[d:druid#1464380870935969944]]; the numeric magnitude is still not log-verified."
discord:
  channel: druid
  scope: "Balance stat weights, exact Eclipse rotation, T3/T3.5 gear calls, consumables, post-1.18.1 reaction"
  sources:
    - {id: "1465349903348924598", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "2026-01-26 revised BoAT note: 5->3 points, Wrath on Insect-Swarm'd target refunds 10/20/30% mana, Starfire has 0.2/0.4/0.6 s reduced cast time vs Moonfire'd targets"}
    - {id: "1484368183593799711", era: post-1.18.1, agreement: consensus, claim: "1.18.1 Eclipse: Wrath 40% / Starfire 60% chance to proc their beneficial effects (was 30%/50%)"}
    - {id: "1386036047225290873", era: pre-1.18.1, agreement: consensus, claim: "Numeric Balance stat weights: hit worth ~40 spell power, crit ~20, haste ~16; 'get 12-15 spell hit, stack as much spell crit as you can. Hit>crit>sp' [[d:druid#1380884597826392074]] [[d:druid#1387146935336697998]]"}
    - {id: "1380629211223691294", era: pre-1.18.1, agreement: consensus, claim: "Crit-cap pressure near T3.5: '39.5 crit is what bis will look like with scythe, while also being crit capped'"}
    - {id: "1382205752961269830", era: pre-1.18.1, agreement: consensus, claim: "Exact rotation: Moonfire+Insect Swarm -> Wrath until Arcane Eclipse -> Starfire the whole window -> refresh Moonfire then Insect Swarm in the last second of Arcane Eclipse -> Starfire until Nature Eclipse -> Wrath the window, refreshing only in its last second; do not re-DoT mid-window"}
    - {id: "1382166180663529532", era: pre-1.18.1, agreement: single source, claim: "Solstice only blocks re-entering the SAME Eclipse, so after Arcane ends keep casting Starfire to fish Nature"}
    - {id: "1381396350142251149", era: pre-1.18.1, agreement: consensus, claim: "T3.5 3-set summons a second Hurricane cloud at exactly 50% of your ticks that keeps going after channelling and is affected by Eclipse/Enlighten - 'very very strong' for trash"}
    - {id: "1388439061844328528", era: pre-1.18.1, agreement: consensus, claim: "T3.5 5-set bonus is widely called bad ('5t3.5 set bonus sucks af'); 3-set is the chase"}
    - {id: "1380178763412799568", era: pre-1.18.1, agreement: consensus, claim: "Ebb and Flow idol (Starfire cast time) called 'like a 60 dps increase'; 8/8 T3 + Starfire boon + Ebb and Flow + Bloodlust gives 1.35 s Starfires [[d:druid#1380642728140079134]]"}
    - {id: "1380178703555887235", era: pre-1.18.1, agreement: single source, claim: "Snapshot the crit idol before swapping to Ebb and Flow"}
    - {id: "1382526320789033011", era: pre-1.18.1, agreement: single source, claim: "8/8 T3 grants 10% haste on entering Eclipse; Improved Wrath lowers the Wrath GCD to 1.0 s [[d:druid#1383503369485815959]]"}
    - {id: "1379631498847715390", era: pre-1.18.1, agreement: single source, claim: "Balance consumable list: Flask of Supreme Power / Chromatic Flask, Brilliant Wizard Oil, Nightfin Soup, Mageblood Potion, Major Mana Potion, Nordanaar Herbal Tea, Limited Invulnerability Potion, Zanza, Greater Arcane Elixir, Elixir of Greater Nature Power, Dreamshard Elixir, Cerebral Cortex Compound, Juicy Stripped Melon, Medivh's Merlot Blue, Bright Dream Shards"}
    - {id: "1381556479252762735", era: pre-1.18.1, agreement: single source, claim: "Chromatic Flask is the best early-Kara40 flask; Wisdom flask only worth it on Chess [[d:druid#1383027715111653388]]"}
    - {id: "1464377731033862308", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Krokat's 1.18 vs 1.18.1 Balance sims: 1549.2 -> 1454.0 peak DPS [[d:druid#1464380870935969944]]; 1.18.1 Ebb and Flow 1225.8 vs Moon 1199.5 [[d:druid#1464386394410713444]]"}
    - {id: "1484680824552161360", era: post-1.18.1, agreement: contested, claim: "Post-patch: Starfire damage 'horribly low'; pure Wrath spam reportedly out-damages Starfire inside Arcane Eclipse [[d:druid#1484694699364319326]]"}
    - {id: "1484945523889803354", era: post-1.18.1, agreement: single source, claim: "The 'Starfire crit is broken' theory was later retracted: 'crit seems fine... the starfire dmg is way too low' [[d:druid#1489726742280011827]]"}
    - {id: "1486095894875996311", era: post-1.18.1, agreement: contested, claim: "Balance called the worst 'proper' DPS spec by late March/April 2026 [[d:druid#1487183732384469062]]"}
    - {id: "1464541190186602538", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Designer rationale: the rework streamlines BoAT/Owlkin Frenzy/Eclipse randomness to reduce the spec's RNG dependence"}
    - {id: "1471143844178301001", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Moonfury buffed to 4/8/12% (+2% damage, +3% Starfire crit in the revised notes) [[d:druid#1473167948553388125]]"}
    - {id: "1484464772115206204", era: post-1.18.1, agreement: single source, claim: "Leveling weapon progression is melee-oriented; Balance levelers keep any int/spirit gear"}
    - {id: "1412860092692299806", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Moonkin raid value is not only damage: Moonkin Aura (crit), decurse, Innervate and battle rez"}
    - {id: "1356852934725472369", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Pinned 1.18.0 Balance raid build decodes to Balance 35 / Restoration 13 + 3 flex (Guidance of the Dream or Reflection); the 1.18.0 BoAT 5/5 clips to 3/3 in 1.18.1"}
    - {id: "1485212531613241375", era: post-1.18.1, agreement: single source, claim: "Post-1.18.1 Balance build decodes to 37/0/14 with BoAT 3/3 and Owlkin Frenzy 1/3 [[d:druid#1489737410362343484]]"}
    - {id: "1473297976796381358", era: post-1.18.1, agreement: single source, claim: "Post-1.18.1 leveling pick order: Imp Wrath -> Sylvan Blessing -> Natural Weapons -> Imp Moonfire -> Omen -> Moonfury -> Moonglow -> 1/5 Vengeance -> Moonkin Form -> Imp Starfire -> Nature's Grace -> BoAT -> Eclipse"}
