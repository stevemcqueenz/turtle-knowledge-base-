agreement: contested
patch_validity:
  written_for: "1.17.2 / 1.18.0 Eclipse rework (Wrath 30%/Starfire 50% proc chance, bonus = 10% + 60% of spell crit)"
  valid_for_1181: true
  notes: "1.18.1 changed Eclipse proc chances to Wrath 40%/Starfire 60% (revision dated 2026-03-19), reworked Balance of All Things to 3 points (Wrath mana refund 10/20/30% vs Insect-Swarm'd target, Starfire crit +3/6/9% vs Moonfire'd target, revised from +2/4/6% on 2026-01-26), and raised Moonfury to 4/8/12% (2026-01-26). Post-1.18.1 reaction: reworked Starfire cast-time component criticized as a net nerf ('lost 20% spell haste... for 9% crit that doesn't scale eclipse'); Noephix estimates ~15% DPS nerf overall (single source, uncorroborated by logs)."
talents:
  build_name: "Core Balance rotation build (~35-38 points Balance + ~13 Restoration for Genesis; no decoded full 60-point list found)"
  build_link: null
  points:
    - {tree: Balance, talent: Moonfury, rank: 3, spell_id: null}
    - {tree: Balance, talent: "Balance of All Things", rank: 3, spell_id: null}
    - {tree: Balance, talent: Eclipse, rank: 1, spell_id: null}
    - {tree: Balance, talent: "Moonkin Form (incl. Improved)", rank: 2, spell_id: null}
    - {tree: Balance, talent: "Gale Winds or Guidance of the Dream", rank: "2-3 (flex, contested choice)", spell_id: null}
    - {tree: Restoration, talent: Genesis, rank: 3, spell_id: null}
    - {tree: unspecified, talent: "remainder (core damage/hit/crit/range/cast-time talents, not individually named in sources)", rank: null, spell_id: null}
  leveling_order: []
stat_weights:
  crit: "high — 1% crit roughly equal to 4-5% haste (single detailed source); triple-dips via cast damage, Nature's Grace haste proc, and Eclipse damage multiplier"
  haste: "low relative to crit — only benefits Starfire among the four rotation spells (partially benefits Wrath via the 1.0s/0.5s GCD floor per a thread correction)"
  hit: "important and hard to reach from tier gear alone; full T3 set provides only ~4% spell hit"
  spell_power: "baseline scaling stat, no numeric weight given (gap)"
caps:
  spell_hit_from_t3: "~4% (full 9-piece T3 set) — cap requires specific non-set items (e.g. Loatheb's/Regalia staff)"
  spell_penetration: "not found in sources (gap)"
rotation_single:
  - {priority: 1, action: Moonfire, condition: "apply/maintain, 18s duration"}
  - {priority: 2, action: "Insect Swarm", condition: "apply/maintain, 18s duration"}
  - {priority: 3, action: Wrath, condition: "chain-cast while fishing for Lunar Eclipse proc (40% chance per 1.18.1) or spending an active Lunar Eclipse buff"}
  - {priority: 4, action: Starfire, condition: "chain-cast while fishing for Nature Eclipse proc (60% chance per 1.18.1) or spending an active Nature Eclipse buff"}
  - {priority: 5, action: "cancel current cast and switch spell", condition: "an Eclipse proc lands mid-cast on the wrong spell (stopcasting is a real DPS gain despite feeling bad)"}
rotation_aoe:
  - {targets_min: 3, priority: 1, action: Hurricane, condition: "channeled AoE; weak vs fast-dying trash since setup often doesn't pay off before mobs die"}
aoe_threshold: 3
cooldowns:
  - {name: "none (structural gap)", use_when: "Balance has no on-demand burst cooldown, repeatedly cited as the spec's biggest structural weakness vs other casters"}
resource_rules:
  - "Sylvan Blessing (100% mana regen while casting for 15s after a kill) helps while leveling/questing"
  - "Innervate generally given to a healer rather than self-used in raids, per general Druid community convention (not independently sourced for Balance specifically)"
consumables:
  - "Major Mana Potion"
  - "Nordanaar Herbal Tea"
  - "Dark Rune"
  - "Innervate"
  - "Nightfin Soup"
  - "Mageblood Potion"
mistakes_to_avoid:
  - "Standing still to hard-cast Starfire in PvP instead of dot-kiting"
  - "Letting a cast finish after an Eclipse proc lands mid-cast instead of cancelling and switching"
  - "Gearing pure spell-power/haste while ignoring the crit-over-haste relationship and thin hit budget"
  - "Treating trash-pack Moonfire/Hurricane as free AoE"
  - "Assuming DoT ticks or Hurricane proc on-hit trinkets (Scythe, Clackora, Sigil, Fortune-stat items) — they don't"
