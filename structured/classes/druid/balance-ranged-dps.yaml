leveling_by_bracket:
- bracket: 1-10
  advice: '''1-10 wrath spam''; no Bear Form until 10. Balance opens Sylvan Blessing 2/2 then Improved Wrath.'
  sources:
  - '[[d:druid#1359148907841458309]]'
  - '[[d:druid#1473297976796381358]]'
  era: mixed
  agreement: consensus
- bracket: 10-29
  advice: 'Balance can hot-self and root-kite: Hibernate vs Beasts instead of roots, DoT the adds, Turtle''s pushback avoidance
    lets you cast Wrath while hit.'
  sources:
  - '[[d:druid#1473297976796381358]]'
  - '[[d:druid#1304615970706558986]]'
  era: mixed
  agreement: single source
- bracket: 30-39
  advice: Moonkin Form at 30 (20% mana cost reduction); respec at 60 is expected, so do not chase endgame talents early.
  sources:
  - '[[d:druid#1302038881763594301]]'
  - '[[d:druid#1379911302243418293]]'
  era: pre-1.18.1
  agreement: consensus
- bracket: 40-60
  advice: Eclipse -> Improved Starfire -> Guidance -> Vengeance; post-1.18.1 order is Imp Wrath -> Sylvan Blessing -> Natural
    Weapons -> Imp Moonfire -> Omen -> Moonfury -> Moonglow -> 1/5 Vengeance -> Moonkin Form -> Imp Starfire -> Nature's Grace
    -> BoAT -> Eclipse.
  sources:
  - '[[d:druid#1304615970706558986]]'
  - '[[d:druid#1473297976796381358]]'
  era: mixed
  agreement: single source
stat_weights:
  priority: spell hit to 16% (12-14% realistic pre-K40) > spell power (Arcane > Nature) > crit > haste (breakpoints only)
    > Int/MP5
  spell_power: 1
  arcane_power: 0.53
  nature_power: 0.47
