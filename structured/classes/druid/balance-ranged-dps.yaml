leveling_by_bracket:
  - {bracket: "1-10", advice: "'1-10 wrath spam'; no Bear Form until 10. Balance opens Sylvan Blessing 2/2 then Improved Wrath.", sources: ["[[d:druid#1359148907841458309]]", "[[d:druid#1473297976796381358]]"], era: mixed, agreement: consensus}
  - {bracket: "10-29", advice: "Balance can hot-self and root-kite: Hibernate vs Beasts instead of roots, DoT the adds, Turtle's pushback avoidance lets you cast Wrath while hit.", sources: ["[[d:druid#1473297976796381358]]", "[[d:druid#1304615970706558986]]"], era: mixed, agreement: single source}
  - {bracket: "30-39", advice: "Moonkin Form at 30 (20% mana cost reduction); respec at 60 is expected, so do not chase endgame talents early.", sources: ["[[d:druid#1302038881763594301]]", "[[d:druid#1379911302243418293]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "40-60", advice: "Eclipse -> Improved Starfire -> Guidance -> Vengeance; post-1.18.1 order is Imp Wrath -> Sylvan Blessing -> Natural Weapons -> Imp Moonfire -> Omen -> Moonfury -> Moonglow -> 1/5 Vengeance -> Moonkin Form -> Imp Starfire -> Nature's Grace -> BoAT -> Eclipse.", sources: ["[[d:druid#1304615970706558986]]", "[[d:druid#1473297976796381358]]"], era: mixed, agreement: single source}
stat_weights:
  hit: "worth ~40 spell power; 'get 12-15 spell hit... Hit>crit>sp' [[d:druid#1386036047225290873]]; full 9-piece T3 gives only ~4% spell hit, so the cap needs specific non-set items"
  crit: "worth ~20 - roughly two-and-a-half times less than hit but the Eclipse/Nature's Grace multiplier stat; crit-cap pressure near T3.5 ('39.5 crit... crit capped') [[d:druid#1380629211223691294]]"
  haste: "worth ~16; only benefits Starfire among the main rotation spells (partially Wrath via the GCD floor)"
  spell_power: "baseline scaling stat; Discord gives no independent numeric weight, only the relative hit/crit/haste order (balance of the forum gap stands)"
  cast_time_stack: "Starfire cast time is reduced by the Ebb and Flow idol (-0.2 s), crit (-0.5 s), BoAT and T3 haste; 8/8 T3 grants 10% haste on entering Eclipse [[d:druid#1383503369485815959]] [[d:druid#1382526320789033011]]"
caps:
  spell_hit_from_t3: "~4% (full 9-piece T3 set) - cap requires specific non-set items (e.g. Loatheb's/Regalia staff)"
  practical_spell_hit: "12-15 spell hit rating, then stack crit [[d:druid#1386036047225290873]]"
  crit_cap: "reachable around T3.5 BiS ('39.5 crit ... crit capped') [[d:druid#1380629211223691294]]"
  spell_penetration: "not found in sources (gap)"
rotation_single:
  - {priority: 1, action: "Moonfire + Insect Swarm", condition: "apply/maintain, 18s durations; Faerie Fire only if you are the only druid [[d:druid#1382205752961269830]]"}
  - {priority: 2, action: Wrath, condition: "chain-cast while fishing for Arcane (Lunar) Eclipse or spending an active one"}
  - {priority: 3, action: Starfire, condition: "for the WHOLE Arcane Eclipse window"}
  - {priority: 4, action: "refresh Moonfire then Insect Swarm", condition: "ONLY in the last second of Arcane Eclipse (when another Starfire won't fit), then Starfire to fish Nature Eclipse [[d:druid#1382205752961269830]]"}
  - {priority: 5, action: Wrath, condition: "for the Nature Eclipse window, refreshing DoTs only in its last second; do not re-DoT mid-window"}
  - {priority: 6, action: "cancel current cast and switch spell", condition: "an Eclipse proc lands mid-cast on the wrong spell (stopcasting is a real DPS gain despite feeling bad) [[d:druid#1380601792047616102]]"}
  - {priority: 7, action: "Eclipse monitor + Cursive (DoT tracker) addons", condition: "strongly recommended - Solstice only blocks re-entering the SAME Eclipse, so keep fishing the other [[d:druid#1382166180663529532]]"}
rotation_aoe:
  - {targets_min: 3, priority: 1, action: Hurricane, condition: "channeled AoE; the T3.5 3-set adds a second cloud at 50% of your ticks that continues after channelling and is buffed by Eclipse/Enlighten [[d:druid#1381396350142251149]]"}
  - {targets_min: 3, priority: 2, action: "Moonfire/Insect Swarm the main adds", condition: "Hurricane alone is weak vs fast-dying trash"}
aoe_threshold: 3
cooldowns:
  - {name: "none (structural gap)", use_when: "Balance has no on-demand burst cooldown, repeatedly cited as the spec's biggest structural weakness vs other casters; damage is gated entirely by Eclipse windows"}
resource_rules:
  - "Sylvan Blessing (100% mana regen while casting for 15s after a kill) helps while leveling/questing"
  - "BoAT is passive, not chased: it is meant to be used while executing Eclipses [[d:druid#1437486682231279679]]"
  - "Innervate generally given to a healer rather than self-used in raids, per general Druid community convention (not independently sourced for Balance specifically)"
consumables:
  - "Flask: Chromatic Flask best early Kara40, then Flask of Supreme Power; Wisdom flask only on Chess (long fight) [[d:druid#1381556479252762735]]"
  - "Brilliant Wizard Oil, Nightfin Soup, Mageblood Potion, Major Mana Potion, Nordanaar Herbal Tea, Limited Invulnerability Potion, Spirit of Zanza / Swiftness Zanza, Greater Arcane Elixir, Elixir of Greater Nature Power, Dreamshard Elixir, Cerebral Cortex Compound, Juicy Stripped Melon, Medivh's Merlot Blue, Bright Dream Shards [[d:druid#1379631498847715390]]"
  - "Ebb and Flow idol for Starfire cast time (~60 dps); snapshot the crit idol before swapping to it [[d:druid#1380178763412799568]] [[d:druid#1380178703555887235]]"
mistakes_to_avoid:
  - "Re-DoTing during an Eclipse window instead of only in its last second [[d:druid#1382205752961269830]]"
  - "Standing still to hard-cast Starfire in PvP instead of dot-kiting"
  - "Letting a cast finish after an Eclipse proc lands mid-cast instead of cancelling and switching"
  - "Gearing pure spell-power/haste while ignoring the hit>crit>sp order and thin hit budget"
  - "Chasing the T3.5 5-set bonus; the 3-set is the one worth having [[d:druid#1388439061844328528]]"
  - "Assuming DoT ticks or Hurricane proc on-hit trinkets (Scythe, Clackora, Sigil, Fortune-stat items) - they don't [[d:druid#1474308602901692426]]"
  - "Expecting Starfire to carry damage post-1.18.1 - multiple players report Wrath-spam doing more [[d:druid#1484680824552161360]]"
supersedes:
  - {claim: "Balance of All Things gives Starfire -0.2/0.4/0.6 s cast time (2026-01-26 revision)", verdict: "SUPERSEDED 2026-03-19 by +3/6/9% crit vs Moonfire'd targets; the cast-time version is stale", sources: ["[[d:druid#1465349903348924598]]"]}
  - {claim: "1.18.0 Eclipse proc chances 30%/50%", verdict: "1.18.1: Wrath 40% / Starfire 60%", sources: ["[[d:druid#1484368183593799711]]"]}
  - {claim: "Balance ~15% DPS nerf (forum single source, uncorroborated)", verdict: "Sims support a real loss (1549 -> 1454 peak) and 'worst proper DPS spec' sentiment, but the numeric magnitude is still not log-verified and stays contested", sources: ["[[d:druid#1464380870935969944]]", "[[d:druid#1486095894875996311]]"]}
gaps:
  - "No numeric Balance spell-power stat weight (only the hit/crit/haste ordering)"
  - "No pre-raid BiS text list (external sheets only)"
  - "Exact post-1.18.1 Eclipse damage-bonus formula not restated"
