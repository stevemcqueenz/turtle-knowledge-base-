rotation_single:
  - {priority: 1, action: "Pre-pull: Moonkin Form, Omen of Clarity, Faerie Fire", condition: "Always"}
  - {priority: 2, action: "Insect Swarm + Moonfire", condition: "Apply both DoTs (18s); keep both up; refresh inside the matching Eclipse when possible"}
  - {priority: 3, action: "Stop-cast and switch spell", condition: "Eclipse procs mid-cast: cancel and chain the buffed spell (Starfire in Lunar, Wrath in Solar); track with MPOWA"}
  - {priority: 4, action: "Starfire spam", condition: "Lunar Eclipse active; Moonfire on target for +9% crit (1.18.1 BoAT); Idol of Ebb and Flow"}
  - {priority: 5, action: "Wrath spam", condition: "Solar Eclipse active; Insect Swarm on target for 30% mana return (1.18.1 BoAT)"}
  - {priority: 6, action: "Fish with Wrath", condition: "No Eclipse up and Curse of Shadows present (Lunar is stronger); Wrath proc is on hit (travel time)"}
  - {priority: 7, action: "Fish with Starfire", condition: "No Eclipse up and Lunar on cooldown / no CoS"}
  - {priority: 8, action: "Re-DoT in last seconds of Eclipse", condition: "Not enough time left for a buffed nuke to land (Jizzus)"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Multi-DoT Moonfire (and Insect Swarm)", condition: "Keep MF on as many targets as possible without clipping, Wrath in remaining GCDs (Kangaraxxus, pre-CC2)"}
  - {targets_min: 4, priority: 1, action: "Hurricane", condition: "10s CD; ticks do not proc item effects; not competitive with mage/paladin AoE"}
  - {targets_min: 2, priority: 2, action: "Faerie Fire on trash", condition: "Raid utility"}
aoe_threshold: 4
cooldowns:
  - {name: Innervate, use_when: "Self if no one else needs it; healers otherwise"}
  - {name: "Owlkin Frenzy", use_when: "Passive pushback resistance; 1 point"}
  - {name: "Nature's Grace", use_when: "Passive on crit: -0.5s cast and GCD (Turtle custom)"}
  - {name: "Trinkets / Scythe of Elune", use_when: "Lunar Eclipse windows; DoT ticks and Hurricane do not proc them"}
  - {name: Tranquility, use_when: "Raid-lead call; expensive"}
  - {name: Rebirth, use_when: "As needed; expensive"}
resource_rules:
  - "Omen of Clarity ~10% proc ~ 10% mana cost reduction; must be cast (30 min)"
  - "1.18.1 BoAT: Wrath on Insect Swarm target returns 10/20/30% mana"
  - "Consumables: Major Mana Potion, Nordanaar Herbal Tea, Dark/Demonic Rune, Nightfin Soup, Mageblood; boomkins use several times more teas/pots than other casters (Avereth)"
  - "Use nampower.dll for 1.0s Wrath GCD latency"
consumables:
  - "Flask of Supreme Power 150, Greater Arcane Elixir 35, Brilliant Wizard Oil 35, food 22, Dreamshard Elixir 15, Dream Tonic 35 = +292 SP (Kangaraxxus 2023)"
  - "Major Mana Potion, Nordanaar Herbal Tea, Dark Rune / Demonic Rune, Nightfin Soup, Mageblood Potion"
mistakes_to_avoid:
  - "Not hit-capped (13% gear)"
  - "Finishing a cast after an Eclipse proc"
  - "Fishing for Solar when Curse of Shadows favors Lunar"
  - "Dropping DoTs or refreshing both outside Eclipse"
  - "Arcane-only spell power; no spell penetration for Ouro/KT"
  - "3/3 Improved Moonkin Form or 2/2 Gale Winds in a raid DPS build"
