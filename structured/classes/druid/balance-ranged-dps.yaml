agreement: contested
agreement_notes: >-
  Consensus on spell-hit cap first and crit > haste; contested on absolute standing
  (Noobikscube 'as much damage as any caster' vs Scattyau/Jizzus/Noephix 'worst proper dps
  spec' after 1.18.1); pre-CC2 Wrath-vs-Starfire dispute (Kangaraxxus vs Bayanni) unresolved.
patch_validity:
  written_for: "1.18.0 Eclipse kit with 1.18.1 changes applied (BoAT 3 pts, Moonfury 4/8/12, Eclipse 40/60%)"
  valid_for_1181: true
  notes: >-
    1.18.1 removed BoAT Starfire cast-time charges (now +3/6/9% Starfire crit vs Moonfire
    target, 10/20/30% Wrath mana return vs Insect Swarm target) and raised Eclipse proc
    chances on 2026-03-19. Post-1.18.1 players report ~15% DPS loss and a clunkier
    rotation; no post-1.18.1 build link exists. Kangaraxxus calculator numbers are
    pre-Eclipse (2023-2024).
