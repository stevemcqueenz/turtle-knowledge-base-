stat_weights:
  spirit: "STRONG - 1 Spirit gives ~0.2 healing to EVERY party member (party-wide effect), so 'every point of spirit is 1sp' for raid healing; Spirit->MP5 = Spirit * 0.20 * 0.15 (Reflection) [[d:druid#1407633163961892914]]"
  healing_power: "no numeric weight given (gap)"
  intellect: "no numeric weight given (gap); the 8 Healing Power belt buckle is preferred over 10 Int [[d:druid#1475237840618258546]]"
  preservation_vs_reflection: "3/3 Preservation > 3/3 Reflection because +20% HoT beats -4% mana [[d:druid#1405962260626804849]]"
  tranquil_spirit: "does NOT help Rejuvenation - only Healing Touch; a point-donor if you are not HT-healing [[d:druid#1409495826107203728]]"
caps: {}
rotation_single:
  - {priority: 1, action: "Regrowth (rank 5)", condition: "sustained tank heal, Tree build - rank chosen so mana lasts 45s-75s spamming with no external help [[d:druid#1315692080185610392]]"}
  - {priority: 1, action: "Healing Touch (rank 3 + Aessina's Bloom)", condition: "HT build: ~2000 heal at 1.5s for almost no mana; higher ranks' 3s cast is not viable [[d:druid#1380510114372649045]]"}
  - {priority: 2, action: "Healing Touch (max rank) or Regrowth (max rank)", condition: "emergency top-up"}
  - {priority: 3, action: Swiftmend, condition: "instant-cast emergency heal at the END of a Regrowth/Rejuv for best HPM ('4.5k crits'); consumes an existing HoT [[d:druid#1380837659353546782]]"}
  - {priority: 4, action: "Nature's Swiftness + Healing Touch", condition: "instant oh-shit button (9k crit reported) [[d:druid#1380836896724488214]]"}
rotation_aoe:
  - {targets_min: 5, priority: 1, action: Tranquility, condition: "raid-wide (post-CC2 rework), 30-minute cooldown, the spec's unique niche; best on sustained-damage fights (Anomalus, Kruul P2) but interruptible on Sapphiron [[d:druid#1396785171436408915]] [[d:druid#1302718473369030768]]"}
  - {targets_min: 5, priority: 2, action: "Rejuvenation blanket", condition: "HoT the raid; Efflorescence snap-heals replaced HoTs in Tree Form [[d:druid#1296230109518237756]]"}
aoe_threshold: 5
cooldowns:
  - {name: Tranquility, use_when: "raid emergency only - 30-minute cooldown, doubled mana cost, no baseline threat"}
  - {name: Swiftmend, use_when: "instant emergency heal, requires an existing HoT on the target; strongest at the tail of a Regrowth/Rejuv"}
  - {name: "Nature's Swiftness", use_when: "instant max-rank Healing Touch for a 9k-ish crit save"}
resource_rules:
  - "Downrank Regrowth to rank 5 (or Healing Touch to rank 3 with Aessina's Bloom) to sustain 45s-75s of spam with no external mana help; reserve max-rank casts for emergencies [[d:druid#1315692080185610392]]"
  - "Reminder: Efflorescence requires Tree of Life Form and is a level-60 passive [[d:druid#1296230109518237756]]"
  - "Spirit is a party-wide healing stat via spirit aura; do not evaluate it by personal-log impact alone [[d:druid#1407633163961892914]]"
consumables:
  - "Teas, Nightfin Soup, spirit food (does NOT stack with Nightfin), Mageblood Potion, Brilliant Mana/Wizard Oil, Flask of Distilled Wisdom for mana [[d:druid#1383743120902066301]]"
  - "Dire Maul alcohol gives +25 spirit / -5 int and stacks with Medivh's Merlot Blue [[d:druid#1430121439448531025]]"
  - "Idol of Rejuvenation (+50 healing, ~+60 in tree) or Idol of Blooming (cast HT r4 and lower in Tree) as the practical picks [[d:druid#1421550248354123787]] [[d:druid#1385179156051918880]]"
  - "No pre-raid BiS list in-channel; Bapi's pinned guide (rentry.co/vw8h8rbc) has the pre-raid/BiS sheets [[d:druid#1475224646591971493]]"
mistakes_to_avoid:
  - "Bringing more than one or two Restoration druids to a 40-man raid without HoT-assignment coordination ('2 resto druids is 1.5 resto druids') [[d:druid#1380503533228658708]]"
  - "Spamming max-rank heals instead of downranking to the mana-sustainable rank [[d:druid#1315692080185610392]]"
  - "Running the Healing Touch build in current raids - 3s cast, no secondary effect [[d:druid#1380604807810646098]]"
  - "Forgetting Efflorescence requires Tree of Life Form to function [[d:druid#1296230109518237756]]"
  - "Assuming a second/third druid's weaker HoT will stack instead of overwrite [[d:druid#1380503533228658708]]"
  - "Twisting Tranquil Spirit onto a Rejuvenation-focused build - it does nothing for Rejuv [[d:druid#1409495826107203728]]"
supersedes:
  - {claim: "Efflorescence requires training from a class trainer only (forum hedge)", verdict: "Also requires Tree of Life Form; it is a level-60 passive that snap-heals replaced HoTs", sources: ["[[d:druid#1296230109518237756]]"]}
  - {claim: "Both Restoration builds are actively played (forum)", verdict: "The Tree build is the post-1.18 consensus; the Healing Touch build is called not viable in current raids", sources: ["[[d:druid#1430728686411448410]]", "[[d:druid#1380604807810646098]]"]}
  - {claim: "Resto low-gear spirit stacking advice (pre-1.18)", verdict: "Era-specific: 1.18 made the +10% healing talent scale with healing power and fixed the Tree flat-HP bug - end-game buffed, low-gear nerfed", sources: ["[[d:druid#1407247748352442461]]"]}
gaps:
  - "No numeric Healing Power / Intellect stat weight"
  - "No Restoration-specific consumable list beyond the shared caster list"
  - "No pre-raid BiS text list (external sheets only)"
