agreement: contested
patch_validity:
  written_for: "1.17.2 / 1.18.0 (Class Changes 2 Restoration rework: Efflorescence, Genesis, Aessina's Bloom, Tranquility rework)"
  valid_for_1181: unknown
  notes: "No Restoration ability/talent change shipped in 1.18.1; 1.18.1 nerfed/reshuffled the T3.5 5/6-set bonus for top-end Kara40 raiders. Discord resolves the forum's 'both builds actively played' framing: the channel's Tree build is the post-1.18 consensus (decoded 18/0/33, 4+ independent confirmations) and the Healing Touch build is called not viable in current raids [[d:druid#1380604807810646098]]. Bapi's pinned post-1.18.1 guide decodes to 12/0/39 with Nature's Focus 5/5 and Tranquil Spirit 5/5 [[d:druid#1484966802101502214]]."
discord:
  channel: druid
  scope: "Restoration builds, spirit->MP5 math, downranking, idols, consumables, encounter calls"
  sources:
    - {id: "1430728686411448410", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Tree of Life build decodes to Balance 18 / Restoration 33 (full tree through Tree of Life Form); 4+ independent confirmations 2025-10 -> 2026-01 [[d:druid#1433167379973541919]]"}
    - {id: "1484966802101502214", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Bapi's pinned post-1.18.1 Restoration build decodes to Balance 12 / Restoration 39, full tree incl. Nature's Focus 5/5 and Tranquil Spirit 5/5 [[d:druid#1475224646591971493]]"}
    - {id: "1421530945730646168", era: pre-1.18.1, agreement: consensus, claim: "Moonglow/Healing Touch build decodes to Balance 21 / Restoration 30 (Nature's Grace + Improved Healing Touch; cannot take Tree Form) [[d:druid#1315990548586168331]]"}
    - {id: "1296230109518237756", era: pre-1.18.1, agreement: consensus, claim: "Designer confirms Efflorescence is a level-60 passive that only triggers in Tree of Life Form and snap-heals the remaining HoT duration when a Rejuv/Regrowth is replaced [[d:druid#1296391502087589999]]"}
    - {id: "1296399632099704863", era: pre-1.18.1, agreement: single source, claim: "Regrowth R9 in Tree + Tranquil Spirit costs around 400 mana"}
    - {id: "1315692080185610392", era: pre-1.18.1, agreement: consensus, claim: "Downranking: Regrowth rank 5 for sustained tank healing, max rank only for emergencies [[d:druid#1315691191819571210]]"}
    - {id: "1407633163961892914", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Spirit->MP5 from in-client code: 'Spirit * 0.20 * 0.15 for MP2' (Reflection); 450 spirit ~= 15.75 MP2 / 39.375 MP5 - why 3/3 Preservation beats 3/3 Reflection"}
    - {id: "1405962260626804849", era: 1.18.1-announced-pre-release, agreement: single source, claim: "'+20% HOT is way more than -4% mana, you can just cast a rank 8 and heal more than a rank 9 with -4% mana' - Preservation beats mana-cost reduction"}
    - {id: "1409495826107203728", era: pre-1.18.1, agreement: single source, claim: "Tranquil Spirit does nothing for Rejuvenation; Micro Jackson prefers Moonglow + 3/3 Preservation over Tranquil Spirit [[d:druid#1416048492580704368]]"}
    - {id: "1407247748352442461", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Hidden 1.18 change: the +10% healing talent now scales with healing power and the Tree flat-HP bug is fixed - end-game resto buffed, low-gear resto nerfed"}
    - {id: "1402603506656874578", era: pre-1.18.1, agreement: single source, claim: "Spirit-aura bug reports: the initial ~110 spirit gave too much, each point beyond gave ~5% of what it should [[d:druid#1403315055973634068]]"}
    - {id: "1380503533228658708", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Only 1 (maybe 2 coordinated) resto druids fit a 40-man raid because HoTs overwrite; '2 resto druids is 1.5 resto druids'"}
    - {id: "1380604807810646098", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "'Healing touch druid is just a worse priest or pally with a damn long cast time' - the HT build is not viable in current raids"}
    - {id: "1396785171436408915", era: pre-1.18.1, agreement: consensus, claim: "Tranquility is the resto druid's unique niche and the main reason to bring one, especially Anomalus and Kruul P2 [[d:druid#1405512865674166342]]"}
    - {id: "1413159028833390593", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Tree build is Regrowth-focused; Micro Jackson heals '60-70% Regrowth instead of 90%' in raids"}
    - {id: "1380510114372649045", era: 1.18.1-announced-pre-release, agreement: single source, claim: "HT build: rank 3 Healing Touch with Aessina's Bloom can heal ~2000 for almost no mana at 1.5s; higher ranks' 3s cast is not viable"}
    - {id: "1380837659353546782", era: pre-1.18.1, agreement: single source, claim: "Swiftmend at the end of a Regrowth/Rejuvenation for best HPM; '4.5k crits of Swiftmend' and a 9k crit instant NS-Healing-Touch oh-shit button [[d:druid#1380836896724488214]]"}
    - {id: "1421550248354123787", era: pre-1.18.1, agreement: single source, claim: "All resto idols are mediocre/bad: Idol of Health (HT -0.15s), Idol of Longevity (25 mana per HT), Idol of the Forgotten Wilds (Regrowth 10% plant heal), Idol of Rejuvenation (+50 healing, ~+60 in tree) [[d:druid#1384122313192243272]]"}
    - {id: "1385179156051918880", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Idol of Blooming lets you cast Healing Touch rank 4 and lower in Tree form"}
    - {id: "1475237840618258546", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Micro Jackson corrections to Bapi: 8 Healing Power belt buckle over 10 Int; best spirit cloak/wrists/belt are green level-55+ 'of Spirit' pieces; 'Of the Lost' trinket is BIS spirit at 2200g [[d:druid#1430121439448531025]]"}
    - {id: "1383743120902066301", era: pre-1.18.1, agreement: consensus, claim: "Resto consumables: teas, Nightfin Soup, spirit food (does NOT stack with Nightfin), Mageblood + Oil + Nightfin + Blessing for MP5; Flask of Distilled Wisdom for mana [[d:druid#1383746068830748722]] [[d:druid#1386731522635075656]]"}
    - {id: "1427389460844380331", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Tier value: only 2/8 T3 and 5/5 T3.5 are worth a lot; T2 8/8 costs ~230 healing power; T3 6/8 is strong"}
    - {id: "1381722834925129920", era: 1.18.1-announced-pre-release, agreement: single source, claim: "T3.5 combination theory: '3/5 T3.5 and 5/8 T2 to get the Regrowth bonus + 2/9 T3 heal' for Moonglow+Tree"}
    - {id: "1302718473369030768", era: pre-1.18.1, agreement: single source, claim: "Sapphiron: Tranquility can be interrupted by the aura ticks"}
    - {id: "1475543475733663815", era: pre-1.18.1, agreement: single source, claim: "Kara40: Tranquility is 'super nice', but mana is a real issue on sub-1-hour clears [[d:druid#1405945984965677257]]"}
