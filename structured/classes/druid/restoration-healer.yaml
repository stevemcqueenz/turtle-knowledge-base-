  - {priority: 3, action: Swiftmend, condition: "instant-cast emergency heal, consumes an existing HoT"}
rotation_aoe:
  - {targets_min: 5, priority: 1, action: Tranquility, condition: "raid-wide (post-CC2 rework), 30-minute cooldown, ranks last only 4/6/8/10s, use sparingly"}
aoe_threshold: 5
cooldowns:
  - {name: Tranquility, use_when: "raid emergency only — 30-minute cooldown, doubled mana cost, no baseline threat"}
  - {name: Swiftmend, use_when: "instant emergency heal, requires an existing HoT on the target"}
resource_rules:
  - "Downrank Regrowth/Healing Touch to the rank that sustains 45s-75s of spam with no external mana help; use higher ranks only for longer fights"
  - "Reserve max-rank casts for emergency top-ups"
consumables:
  - "No Restoration-specific consumable list found; assume the general caster list (Major Mana Potion, Nordanaar Herbal Tea, Dark Rune, Nightfin Soup, Mageblood Potion) applies but this is inferred, not directly sourced for Restoration"
  - "No pre-raid BiS list found in sources (gap)"
mistakes_to_avoid:
  - "Bringing more than one or two Restoration druids to a 40-man raid without HoT-assignment coordination"
  - "Spamming max-rank heals instead of downranking to the mana-sustainable rank"
  - "Trying to tank-heal a dungeon in full Tree Form without a strong repeatable direct-heal backup"
  - "Forgetting Efflorescence requires training from a class trainer and Tree of Life Form to function"
  - "Assuming a second/third druid's weaker HoT will stack instead of overwrite"
