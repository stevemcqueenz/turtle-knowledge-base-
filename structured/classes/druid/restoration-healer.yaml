rotation_single:
  - {priority: 1, action: "Regrowth (downranked)", condition: "sustained tank heal, Tree build — rank chosen so mana lasts 45s-75s spamming with no external help"}
  - {priority: 1, action: "Healing Touch (downranked)", condition: "sustained tank heal, HT build — same 45s-75s downranking rule"}
