agreement: contested
agreement_notes: >-
  Consensus: one resto druid per raid is valuable, two grief each other's HoTs.
  Contested: Tree/Rejuv-spam vs Healing Touch caster vs Regrowth/Nature's Grace;
  Improved Tranquility worth 2 points (Bayanni yes, Templar85 no); Tranquility 'OP'.
