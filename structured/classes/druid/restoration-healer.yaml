stat_weights:
  healing_power: 1
  spirit: "1 for Tree (0.2 healing per point to every party member via aura ~ 'every point of spirit is 1sp'); lower for HT build"
  mp5_regen: "2 (balance with healing power so mana lasts the fight)"
  intellect: "2 (HT/Regrowth builds; 'itemizing just like a paladin')"
  spell_crit: "3 (Regrowth/Nature's Grace build only)"
  stamina: "PvP only"
  numeric_weights_source: "none on forum (Mondegreen's TWoW resto sheet unpublished)"
caps:
  regrowth_downrank_rule: "Pick the highest Regrowth rank whose full-mana spam lasts 45s-1:15 with no consumables/innervate (Reploidrocsa)"
rotation_single:
  - {priority: 1, action: "Rejuvenation max rank on tank", condition: "Always up (Swiftmend target)"}
  - {priority: 2, action: "Healing Touch (downranked; caster form)", condition: "Tank/direct healing; HT build; Aessina's Bloom refunds"}
  - {priority: 3, action: "Swiftmend", condition: "Emergency; snipes the max-rank Rejuv"}
  - {priority: 4, action: "Nature's Swiftness + max Healing Touch (caster) / + Regrowth (tree)", condition: "Emergency"}
  - {priority: 5, action: "Regrowth (tree, downranked)", condition: "Tree direct heal; max rank only to top someone fast"}
  - {priority: 6, action: "Shift out of Tree", condition: "Tank-only fights (Twins, Patchwerk) to precast Healing Touch; keep Rejuv on tanks"}
rotation_aoe:
  - {targets_min: 3, priority: 1, action: "Rejuvenation every GCD (Tree)", condition: "Max rank on melee/tanks, rank 4 on others; never overwrite a stronger HoT (nobuff macro)"}
  - {targets_min: 3, priority: 2, action: "Swiftmend", condition: "When needed"}
  - {targets_min: 3, priority: 3, action: "Pre-HoT before predictable AoE", condition: "Frost tombs KT, Sapphiron, Thaddius, Vael, Magmadar"}
  - {targets_min: 10, priority: 1, action: "Tranquility", condition: "Raid-lead call; 30-min CD; generates threat; keep prio targets topped first"}
aoe_threshold: 3
cooldowns:
  - {name: Swiftmend, use_when: "Emergency on a Rejuv/Regrowth target"}
  - {name: "Nature's Swiftness", use_when: "Emergency instant HT (caster) or Regrowth (tree)"}
  - {name: Innervate, use_when: "Self in tree/Regrowth play; otherwise another healer"}
  - {name: Tranquility, use_when: "Raid-wide damage on call; ~2-3 per raid per druid"}
  - {name: Rebirth, use_when: "Battle res; no out-of-combat res (smelling salts/jumper cables)"}
resource_rules:
  - "Tree of Life mana reduction benefits Rejuvenation only; Regrowth spam drains"
  - "Balance healing power vs regen gear so mana lasts the whole fight (Reploidrocsa)"
  - "Resto T3 2-set restores raid rage/energy/mana per Rejuv cast"
  - "Aessina's Bloom (1.18.0): next HT -0.15/0.3s and 5/10% mana refund"
consumables:
  - "Major Mana Potion, Nordanaar Herbal Tea, runes (from balance threads)"
  - "Healing flasks/food: vanilla baseline, not from turtlecraft.gg"
mistakes_to_avoid:
  - "Two uncoordinated trees overwriting HoTs"
  - "Max-rank Rejuv blanket on everyone (OOM)"
  - "Full-rank Regrowth spam in tree"
  - "Staying in tree on tank-only fights"
  - "Tranquility as meter padding; ignoring its threat"
  - "Taking Subtlety; Improved Tranquility as a filler (contested)"
