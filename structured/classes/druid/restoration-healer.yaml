stat_weights:
  priority: healing power > Spirit (0.2 self / ~1 with 5 healers in group) > MP5 (NG builds) > Intellect (~0.5 HP)
  healing_power: 1
  spirit: 0.2-1.0 [[d:druid#1480623914840359156]]
  intellect: 0.5
  mp5: NG builds [[d:druid#1437429730700820692]]
  crit: 0 for Rejuv spam [[d:druid#1471588934378066002]]
  haste: 0 for HoTs [[d:druid#1442857322341863544]]
  coefficients: Regrowth ~20% direct + ~112% HoT; Rejuv ~101%; HT ~110% [[d:druid#1469614655952388199]]
caps:
