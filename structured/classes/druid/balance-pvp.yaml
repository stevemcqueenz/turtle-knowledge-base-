agreement: contested
patch_validity:
  written_for: "1.17.2 / 1.18.0 talent tree (structurally unchanged by 1.18.1)"
  valid_for_1181: unknown
  notes: "1.18.1 reworked Eclipse/BoAT (see balance-ranged-dps.yaml); its PvP impact is not separately confirmed. Post-1.18.1 Starfire PvP value is CONTESTED: one player says the patch made it 'WAY more worth it in pvp', another calls the ~3.0s base cast (worse under Barkskin) unusable [[d:druid#1484972121343004833]] [[d:druid#1493695899954839552]] [[d:druid#1485036908596957374]]. Dispel protection remains the spec's defining PvP weakness."
discord:
  channel: druid
  scope: "Balance PvP build direction, dispel weakness, stamina itemisation, 1.18.1 Starfire fight"
  sources:
    - {id: "974507902301773824", era: pre-1.18.1, agreement: consensus, claim: "The classic 30/0/21 dot-kite build remains the Balance PvP reference from 2022 to 2025"}
    - {id: "1425436220485533788", era: 1.18.1-announced-pre-release, agreement: single source, claim: "PvP prefers Nature's Swiftness over BoAT/Eclipse because there is rarely time to hardcast; concrete build link talents.turtle-wow.org/druid?points=BgCaYKFYAL--AoFABbADAI (Mikodo, 2025-10-08) [[d:druid#1433561904009183338]]"}
    - {id: "1390604344830853162", era: pre-1.18.1, agreement: single source, claim: "A 33/0/18 deep-Balance PvE spec is rejected for PvP: the points skip exactly the range/Nature's Grasp/knockback/Owlkin Frenzy tools PvP needs; 'PVP loves spikey damage not DOT damage' [[d:druid#1390616149762379827]]"}
    - {id: "1307688609767227474", era: pre-1.18.1, agreement: single source, claim: "Moonkin PvP itemisation is Stamina-first with leather armor where possible ('avoid cloth'); mp5/mana regen is wasted in short bursty fights; glass-cannon spellpower is rejected"}
    - {id: "1492151406159859824", era: mixed, agreement: consensus, claim: "No dispel protection: a Priest removes all Balance DoTs in one GCD (a Paladin takes longer), deleting the crit pressure; community repeatedly asked for 15-20% dispel protection [[d:druid#1487866288763179088]] [[d:druid#1296951349094780983]]"}
    - {id: "1427685365220769933", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Moonkin form can be Sapped (not an animal form), so a Rogue can open on a Moonkin; player asks if intended, no staff answer in-channel"}
    - {id: "1356583755254468678", era: pre-1.18.1, agreement: contested, claim: "Whether a committed stand-and-cast Moonkin works is contested: 'turret' view vs 'full Balance PvP should not work against any good player' [[d:druid#1356585041253367928]]"}
    - {id: "1489734670512951386", era: post-1.18.1, agreement: single source, claim: "Barkskin's increased cast time is a named boomkin PvP grievance ('god that is awful') [[d:druid#1487866288763179088]]"}
    - {id: "1482116247696183336", era: post-1.18.1, agreement: consensus, claim: "Tauren is the PvP-minmax race (War Stomp + stamina); War Stomp into Entangling Roots is the named play"}
