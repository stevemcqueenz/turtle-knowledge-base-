stat_weights:
  stamina: "prioritized over raw spell power for attrition survivability (forum single source), corroborated by Discord: Stamina-first with leather armor where possible, avoid cloth [[d:druid#1307688609767227474]]"
  spell_power: "not the priority; mp5/mana regen is explicitly wasted in short PvP fights [[d:druid#1307688609767227474]]"
  pvp_hit: "contested - melee 5%, spell 3%, or 'Natural Weapons covers it' (all three positions exist; see restoration-pvp.yaml for the full contested list)"
caps:
  spell_hit_pvp: "3% for the PvP spell cap (excess above cap is wasted) [[d:druid#1482736105634791637]]; with Natural Weapons, base 4% resist / 1% unremovable means effectively no gear spell hit needed [[d:druid#1283031488895647767]]"
rotation_single:
  - {priority: 1, action: "Moonfire + Insect Swarm", condition: "opener at range; but expect a Priest to strip them in one GCD for lack of dispel protection [[d:druid#1492151406159859824]]"}
  - {priority: 2, action: "Entangling Roots", condition: "root and kite; reapply as it breaks"}
  - {priority: 3, action: Wrath, condition: "opportunistic cast when safe, not a committed stand-and-cast pattern"}
  - {priority: 4, action: "Rejuvenation/Regrowth", condition: "off-heal between DoT applications"}
  - {priority: 5, action: "Starfire", condition: "post-1.18.1 CONTESTED - worthwhile on a Moonfire'd target if you have a safe window vs unusable ~3.0s base cast (worse under Barkskin) [[d:druid#1484972121343004833]] [[d:druid#1493695899954839552]]"}
rotation_aoe: []
aoe_threshold: null
cooldowns:
  - {name: "Nature's Swiftness", use_when: "instant Healing Touch/Regrowth emergency; also the reason PvP takes 21 Restoration points [[d:druid#1425436220485533788]]"}
  - {name: "Barkskin", use_when: "defensive, but the cast-time penalty is a named grievance - use it for mitigation, not while trying to cast [[d:druid#1489734670512951386]]"}
resource_rules:
  - "Never stand and hardcast in the open: 'I tried to play as a caster mage and deep balance... I was targeted and depopped' [[d:druid#1433561904009183338]]"
consumables: []
mistakes_to_avoid:
  - "Standing and hard-casting like a Mage/Warlock instead of dot-kiting"
  - "Itemizing for maximum spell power instead of Stamina/attrition survival [[d:druid#1307688609767227474]]"
  - "Committing to the 30-0-21 build's PvE-flavored capstones as if reliable in open-field PvP"
  - "Bringing a DoT build into a Priest/Paladin without accounting for dispels [[d:druid#1492151406159859824]]"
  - "Forgetting Moonkin Form is itself Sapple - a Rogue opener is not preventable [[d:druid#1427685365220769933]]"
supersedes:
  - {claim: "BoAT/Eclipse is the default Balance capstone (PvE)", verdict: "For PvP the channel prefers Nature's Swiftness and skips BoAT/Eclipse; PvP wants spike damage over DoT ramp [[d:druid#1425436220485533788]]"}
gaps:
  - "No post-1.18.1 PvP-specific re-test of the Eclipse/BoAT rework"
  - "No agreed Balance PvP gear set beyond 'Stamina + armor, avoid cloth'"
