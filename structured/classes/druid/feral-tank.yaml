  variants:
    - "Bear buys Brutal Impact 2 for longer Bash stuns and Feral Adrenaline only if the raid demands it (community verdict on Feral Adrenaline: near-useless 30s ICD)"
    - "PvP-oriented offshoot: skip some Feral Aggression for Thick Hide / Feral Instinct / Feral Charge / Savage Fury (Savage Fury removed in 1.18.1)"
  leveling_order:
    - {level: 20, tree: Feral, talent: "Feral Swiftness (cat movement speed)"}
    - {level: 20, tree: Balance, talent: "Omen of Clarity", note: "respec at 30"}
    - {level: 25, tree: Restoration, talent: Furor}
    - {level: 30, tree: Feral, talent: "Swift Travel Form (baseline questline, not a talent)"}
stat_weights:
  armor: "high until ~11-12k, then deprioritize (cap easy to reach)"
  stamina: "high, always good"
  hit: "high until cap (8%, or 5% with Natural Weapons 3/3); above cap worthless [[d:druid#1474083543985684691]]"
  haste_attack_speed: "BEST threat stat - Maul rides the slow 2.5s auto-attack timer: 'more maul = more threat' [[d:druid#1292121947412627498]]"
  crit: "medium-high - threat abilities are damage multipliers, so crit doubles threat"
  agility: "bait for threat: 'Agi is bait. like triple the threat gains from 3 Haste over 25 Agi' [[d:druid#1473795292779516119]]; wanted only for Ancient Brutality dodge synergy"
  defense: "contested/low - 40% less effective (no parry/block); situational raise for hard-hitting/low-healing fights"
  strength: "low priority relative to armor/stam/hit per sources read"
caps:
  hit_cap_melee: "8% (5% effective with Natural Weapons 3/3, +3% hit); every point of hit equal until 5% gear, then zero [[d:druid#1474083543985684691]]"
  armor_soft_target: "~11-12k armor before diminishing priority (single source)"
  crit_immunity_defense: "not found in Druid sources (gap)"
rotation_single:
  - {priority: 1, action: "Tiger's Fury (from Cat) before the pull", condition: "~20% haste + 18s Enrage for 18s of extra haste [[d:druid#1474473590043836720]]"}
  - {priority: 2, action: "Faerie Fire (Feral) rank 1", condition: "pull, to apply the armor debuff/threat cheaply; also a spare-GCD filler [[d:druid#1474473590043836720]]"}
  - {priority: 3, action: Maul, condition: "ALWAYS queue Maul on every auto-attack - primary rage dump and threat [[d:druid#1474473590043836720]]"}
  - {priority: 4, action: "Savage Bite", condition: ">35 rage or Clearcasting; every cooldown with the T3 8-piece to keep the damage-reduction buff up [[d:druid#1412021581693059226]]"}
  - {priority: 5, action: "Demoralizing Roar", condition: "physical-heavy pull, or to pull a stealthed rogue out of stealth"}
  - {priority: 6, action: "Swipe", condition: "extra rage dump on single target (poor threat) and the main AoE tool"}
  - {priority: 7, action: "Enrage / rage potion", condition: "snap threat on pull - rage potion is the best opener [[d:druid#1474500952965906515]]"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Swipe + Faerie Fire (Feral) each new add", condition: "core AoE threat package [[d:druid#1479712614409048095]]"}
  - {targets_min: 2, priority: 2, action: "Tab-Maul and Oil of Immolation / Dragonbreath Chili", condition: "extra AoE threat on pull"}
  - {targets_min: 2, priority: 3, action: "Demoralizing Roar", condition: "group the mobs; not sustained threat [[d:druid#1479712614409048095]]"}
aoe_threshold: 2
cooldowns:
  - {name: "Frenzied Regeneration", use_when: "self-heal, 6-minute cooldown pre-1.18.1 (reduced from 3-minute original CC2 value, then only trimmed to 5 min in Dec-2024, criticized as insufficient)"}
  - {name: "Barkskin (Feral)", use_when: "emergency mitigation, 10-minute cooldown, niche panic button not part of normal rotation"}
  - {name: "Ancient Brutality", use_when: "passive rage generator on dodge, sustained not on-demand"}
  - {name: "Berserk", use_when: "burst rage/threat window; Cat-form cooldown shared in the hybrid build"}
resource_rules:
  - "Always keep Maul queued; it is the threat engine and rides the swing timer [[d:druid#1474473590043836720]]"
  - "Savaged/dodged/parried Savage Bite has no fallback - keep a second threat generator queued [[d:druid#1484741482169499689]]"
  - "Omen of Clarity + Furor + Blood Frenzy talented reduces rage-starvation concerns per community consensus"
consumables:
  - "Idol of the Ironfur (+8-10% Dire Bear armor), Idol of Crushing Maul (+20-30% Maul threat), Idol of Ursoc's Resolve (Frenzied Regen +10% dodge 10s), Idol of the Unyielding Bear (-2% damage taken), Idol of the Savage Counter (next Maul free after dodge), Idol of the Protector (LOTP effect) [[d:druid#1479530552850907227]]"
  - "Idol of Brutality (-30% Maul / -20% Swipe cost) as the cheaper alternative [[d:druid#1386988179898499093]]"
  - "Consumables: Juju Power, Elixir of the Mongoose, R.O.I.D.S., Elixir of Firewater, Elixir of Superior Defense, 2% haste or +20 Str food, crystal ward [[d:druid#1475757404493713469]]"
  - "Enchants: counterweight on weapon, haste on shoulder, threat on gloves [[d:druid#1474483802976948254]]"
  - "Hateforge trinket (+120 armor, 12 stam, 1% attack speed) - early tank trinket"
  - "No pre-raid BiS list found in sources (gap)"
mistakes_to_avoid:
  - "Itemizing hard for raw Defense rating instead of Hit/Haste/Armor/Stamina"
  - "Chasing raw Dodge%/Agility instead of Haste/Hit/Stamina for threat [[d:druid#1473795292779516119]]"
  - "Taking Feral Adrenaline (30s ICD makes it near-useless per near-unanimous community verdict)"
  - "Treating Savage Bite as spammable post-1.18.1 (9s cooldown, reduced threat modifier) [[d:druid#1470128951165718528]]"
  - "Opening with Maul on a threat-sensitive pull instead of Taunt-first"
  - "Competing with the other tank for threat instead of only staying above healers/DPS"
  - "Assuming bear can tank every fight equally (Twin Emperors caster emperor, fear-heavy/stance-dance fights are worse for bears) [[d:druid#1301990218085306369]]"
boss_notes:
  - {boss: "Patchwerk (Naxx)", note: "threat-sensitive tank-and-spank; watch the meter, do not Maul 100% of the time; some bears cut stamina consumes on Patchwerk", era: pre-1.18.1}
  - {boss: "Twin Emperors (AQ40)", note: "bear cannot tank the caster emperor - historically bear's weakest fight [[d:druid#1301990218085306369]]", era: pre-1.18.1}
  - {boss: "Vael (BWL)", note: "bear is strong because of the fight timer; rage potion + Bite/Maul opener [[d:druid#1296452879154020443]]", era: pre-1.18.1}
  - {boss: "Chromaggus (BWL)", note: "Savage Bite every 6s matters vs a 10s swing timer [[d:druid#1321165760151949322]]", era: pre-1.18.1}
  - {boss: "Sapphiron (Naxx)", note: "killed with 0 frost resist in full AQ40 gear [[d:druid#1293715946489516052]]", era: pre-1.18.1}
supersedes:
  - {claim: "Bear has no threat problem (pre-1.18.1 forum framing)", verdict: "1.18.1 cut Maul threat -15% and Savage Bite -12%; community math ~7-9% total; post-release standing contested", sources: ["[[d:druid#1470128951165718528]]", "[[d:druid#1482094399813849241]]", "[[d:druid#1484733781331021875]]"]}
  - {claim: "Agility is a bear threat stat", verdict: "Haste >> Agility for threat; 'Agi is bait'", sources: ["[[d:druid#1473795292779516119]]"]}
  - {claim: "Swipe is a single-target threat tool", verdict: "'Swipe is just for excess rage dump on single target and do shit threat'", sources: ["[[d:druid#1484741482169499689]]"]}
gaps:
  - "No conclusive post-1.18.1 bear-vs-warrior threat answer (contested)"
  - "No bear crit-immunity/crush-cap Defense value for Turtle"
  - "No pre-raid BiS list"
