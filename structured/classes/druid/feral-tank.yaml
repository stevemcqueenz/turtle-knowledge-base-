  valid_for_1181: true
  notes: "Talent tree structurally unchanged by 1.18.1. 1.18.1 reduced Maul threat modifier by 15% and Savage Bite threat modifier by 12% (official). Post-1.18.1 forum reaction (single detailed author, several short agreeing replies) argues bear tanking lost its main advantage; not independently log-verified."
