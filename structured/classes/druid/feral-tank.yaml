stat_weights:
  armor: "high until ~11-12k, then deprioritize (cap easy to reach)"
  stamina: "high, always good"
  hit: "high until cap (8%, or 5% with Natural Weapons 3/3)"
  haste_attack_speed: "high — undervalued by new players; Maul rides the slow 2.5s auto-attack timer"
  crit: "medium-high — threat abilities are damage multipliers, so crit doubles threat"
  agility: "medium — wanted for Ancient Brutality dodge synergy, not worth raw itemization"
  defense: "contested/low — 40% less effective (no parry/block); situational raise for hard-hitting/low-healing fights"
  strength: "low priority relative to armor/stam/hit per sources read"
caps:
  hit_cap_melee: "8% (5% effective with Natural Weapons 3/3, +3% hit)"
  armor_soft_target: "~11-12k armor before diminishing priority (single source)"
  crit_immunity_defense: "not found in Druid sources (gap)"
rotation_single:
  - {priority: 1, action: "Faerie Fire (Feral) rank 1", condition: "pull, to apply armor debuff cheaply"}
  - {priority: 2, action: Maul, condition: "on auto-attack timer, primary rage dump/threat"}
  - {priority: 3, action: "Savage Bite", condition: "on cooldown (9s pre-1.18.1 baseline); snap-threat/rage dump, now lower threat modifier post-1.18.1"}
  - {priority: 4, action: "Demoralizing Roar", condition: "physical-heavy pull, or to pull a stealthed rogue out of stealth"}
  - {priority: 5, action: Enrage, condition: "threat secure, extra rage needed"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Faerie Fire (Feral) each new add", condition: "keep armor debuff/threat on adds"}
  - {targets_min: 2, priority: 2, action: Swipe, condition: "core AoE threat tool, scales with 4% AP (post-Nov-2024 rework)"}
  - {targets_min: 2, priority: 3, action: "Demoralizing Roar", condition: "on pull"}
aoe_threshold: 2
cooldowns:
  - {name: "Frenzied Regeneration", use_when: "self-heal, 6-minute cooldown pre-1.18.1 (reduced from 3-minute original CC2 value, then only trimmed to 5 min in Dec-2024, criticized as insufficient)"}
  - {name: "Barkskin (Feral)", use_when: "emergency mitigation, 10-minute cooldown, niche panic button not part of normal rotation"}
  - {name: "Ancient Brutality", use_when: "passive rage generator on dodge, sustained not on-demand"}
resource_rules:
  - "No numeric rage-pool target given by sources; keep Swipe/Maul/Savage Bite flowing"
  - "Omen of Clarity + Furor + Blood Frenzy talented reduces rage-starvation concerns per community consensus"
consumables:
  - "Hateforge trinket (+120 armor, 12 stam, 1% attack speed) — early tank trinket"
  - "No pre-raid BiS list found in sources (gap)"
mistakes_to_avoid:
  - "Itemizing hard for raw Defense rating instead of Hit/Armor/Stamina"
  - "Chasing raw Dodge% instead of letting Agility be a side effect"
  - "Taking Feral Adrenaline (30s ICD makes it near-useless per near-unanimous community verdict)"
  - "Treating Savage Bite as spammable post-1.18.1 (9s cooldown, reduced threat modifier)"
  - "Pulling without Faerie Fire armor debuff or Demoralizing Roar vs physical packs"
  - "Assuming bear can tank every fight equally (Nefarian's druid-specific call, fear-heavy/stance-dance fights are worse for bears)"
