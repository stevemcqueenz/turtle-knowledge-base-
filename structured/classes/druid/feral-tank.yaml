agreement: contested
agreement_notes: >-
  Consensus that bear is viable for all content with support and best at multi-target/immunity
  fights; contested stat ordering (armor-first vs stamina-first vs hit/agi cat-set) and
  post-1.18.1 standing (Noephix 'no reason to bring a bear' vs Velanyr '8 of 10 fastest
  Kara guilds use a bear MT').
patch_validity:
  written_for: "1.18.0 kit; 1.18.1 threat nerf applied"
  valid_for_1181: true
  notes: >-
    1.18.1: Maul threat -15%, Savage Bite threat -12% (Jamey p166071). No talent changes.
    Rotation unchanged; expect lower threat margin. MCP advice obsolete since 2024-10-12.
    Frenzied Regeneration numbers are the batch-2 nerfed values (5-min CD).
