  armor: no hard cap; linear to ~16.6-17.3k, worth it to ~22-23k [[d:druid#1470162624392986675]] [[d:druid#1438986407376060446]]
  white_crit_cap: ~52.5% at 8% hit [[d:druid#1474765599858229310]]
  crit_immunity_defense: not reachable in practice (no parry/block) [[d:druid#1454812937444393186]]
