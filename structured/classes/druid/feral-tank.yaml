resource_rules:
- Keep Maul queued every swing [[d:druid#1474473590043836720]]
- Tiger's Fury Blood Frenzy persists through the Cat->Bear shift [[d:druid#1444967001121357986]]
- 'Do not let healers shield you: it removes rage from damage taken [[d:druid#1491140379490390106]]'
- Maul/Swipe/Savage Bite do not share a GCD [[d:druid#1436445990809899018]]
- Sappers/dynamite cancel Bear Form [[d:druid#1473126693303615643]]
consumables:
- Mighty Rage Potion (~132 AP 20 s) or Quickness Potion (~133 AP 30 s) [[d:druid#1482102898094768321]]
- Juju Power, Elixir of the Mongoose, R.O.I.D.S., Juju Might/Firewater, Elixir of Superior Defense [[d:druid#1475819828953743372]]
- Danonzo's 2% haste food > Power Mushroom for threat [[d:druid#1475836397528289542]]; Hardened Mushroom + Gurubashi Gumbo
  stack [[d:druid#1467924402665558118]]
- Greater Stoneshield Potion, LIP, Free Action [[d:druid#1441393322869395496]]
- Idol of Brutality BiS (Stratholme UD) [[d:druid#1386988179898499093]]; Iron Counterweight weapon (now on staves) [[d:druid#1484615359334973663]];
  +10 Str buckle [[d:druid#1443537453796561096]]
mistakes_to_avoid:
- Opening with Growl or Feral Charge [[d:druid#1432722952813543505]] [[d:druid#1433148306586075292]]
- Demoralizing Roar with a warrior in group [[d:druid#1415743918603243622]]
- Dodge/defense enchants or armor kits [[d:druid#1415743918603243622]]
- Throwing sappers in Bear Form [[d:druid#1473126693303615643]]
- Enraging while healers struggle [[d:druid#1477368423267696690]]
- Dropping below hit cap [[d:druid#1491029884397424720]]
