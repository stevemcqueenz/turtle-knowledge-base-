stat_weights:
  stamina: 1
  armor: "1-2 (to ~11-12k armor per Inovatu; 'cap' easy in pre-raid gear per Elesion)"
  hit: "1-2 (to cap)"
  haste: "2 (best threat stat per Elesion/Inovatu; 2% haste ~ 1% crit budget)"
  crit: 2
  agility: 3
  strength: 3
  dodge: "3 (valued for Ancient Brutality rage per Drubarrymooer; 'Dont go for Dodge' per Inovatu)"
  defense: "4 (low value: no block/parry; matters only in Naxx / hard hitters)"
  vampirism: "never prioritize (Atreidon)"
caps:
  melee_hit_pct_from_gear: "5-6 with Natural Weapons"
  armor_target: "11000-12000 (Inovatu)"
  defense_cap: "not stated by any druid source"
  dodge_reference: "~25% run, 32% raid-buffed possible (Drubarrymooer 2023)"
rotation_single:
  - {priority: 1, action: "Barkskin (Feral) / pre-pull Barkskin", condition: "Before charge on hard hitters; 15 melee hits -50% for 12s (10-min CD)"}
  - {priority: 2, action: "Feral Charge / Feral Faerie Fire R1 pull", condition: "Open; FF rank 1 suffices for pulling"}
  - {priority: 3, action: "Maul queued every swing", condition: "Always; best threat per rage (2.5x Savage Bite per Kokumuo)"}
  - {priority: 4, action: "Savage Bite", condition: "Omen of Clarity proc (press Escape to clear Maul queue first) or rage >= ~35 surplus; best per GCD; 'second taunt' after Growl"}
  - {priority: 5, action: "Faerie Fire (Feral)", condition: "On cooldown / when debuff missing"}
  - {priority: 6, action: "Demoralizing Roar", condition: "Once per pull (Idol of the Apex Predator -2 rage)"}
  - {priority: 7, action: "Swipe", condition: "Spare rage even single-target for Primal Fury procs"}
  - {priority: 8, action: "Enrage", condition: "Rage-starved and not taking heavy damage"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Swipe", condition: "On cooldown; hits 3 (+1 with AQ20 3-set); Maul queued on kill target"}
  - {targets_min: 2, priority: 2, action: "Feral Charge", condition: "Caster in the pack"}
  - {targets_min: 4, priority: 1, action: "Swipe every GCD + Demoralizing Roar + tab Maul", condition: "Improved Thorns adds reflect threat if taken"}
aoe_threshold: 2
cooldowns:
  - {name: "Barkskin (Feral)", use_when: "Hard-hitting phases; physical only; 10-min CD"}
  - {name: "Frenzied Regeneration", use_when: "Emergency HP; ~25% HP at full rage after batch-2 nerf; 5-min CD; empties rage"}
  - {name: "Berserk (bear)", use_when: "20% HP for 20s, 6-min CD"}
  - {name: "Enrage", use_when: "Rage on pull; armor penalty"}
  - {name: "Feral Charge", use_when: "Gap close / interrupt casters"}
  - {name: "Tranquility", use_when: "On raid-lead call even with 0 healing power"}
resource_rules:
  - "Rage from damage taken; Furor 10 on shift; Primal Fury on crit; Ancient Brutality 2/4 rage per second after a dodge (9s ICD)"
  - "Leaving bear form drops all rage (Turboman)"
  - "Queued Maul consumes Omen procs; clear with Escape to use Savage Bite free"
consumables:
  - "Mighty Rage Potion in form (since 2024-10-21)"
  - "Jujus, Gift of Arthas, bandages in form (1.18.0)"
  - "Enchants: haste head/legs/shoulders, stamina or stats rings/neck (Bullsonparade20); +9 stam bracers / +70 armor cloak / LW armor kits while leveling"
  - "Standard vanilla tank consumes (vanilla baseline, not from turtlecraft.gg)"
mistakes_to_avoid:
  - "Stacking Defense (no block/parry; expensive dodge)"
  - "Icy Veins order Armor>Stam>Def>Agi>Hit without hit cap"
  - "Letting queued Maul eat Omen procs"
  - "Shifting out mid-fight (rage loss, no armor)"
  - "Prioritizing vampirism"
  - "Using MCP-era threat advice"
