agreement: contested
patch_validity:
  written_for: "1.17.2 / 1.18.0 (Class Changes 2 talent trees)"
  valid_for_1181: true
  notes: "Talent tree structurally unchanged by 1.18.1. 1.18.1 reduced Maul threat modifier by 15% and Savage Bite threat modifier by 12% (official, eff. 2026-03-20). Discord's community math converts that to ~9% Maul, ~5.6% Savage Bite, ~7-8% total bear threat. Post-1.18.1 standing is contested: the pre-release view was 'bear is the best tank in raids, a little overturned', the post-release view is that bears lose their main advantage [[d:druid#1483016079209926688]] [[d:druid#1484733781331021875]]. Bear threat has no log-verified post-nerf number (gap)."
discord:
  channel: druid
  scope: "bear threat/rotation/gear math and the 1.18.1 threat nerf"
  sources:
    - {id: "1470128951165718528", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Official 1.18.1 note: Maul threat modifier -15%, Savage Bite threat modifier -12%; developer comment 'Feral Bears have been overly prominent in their threat output, leaving little room for other tanks to shine'"}
    - {id: "1464351740957823007", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Community math: Maul 175% - 15% ~= 9% threat reduction"}
    - {id: "1481530798686470226", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Savage Bite 225% - 12% ~= 5.6% nerf; Maul 'around 9%'. Not total threat (haste/staff enchant also matter)"}
    - {id: "1482094347028664371", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Tephus: '~8% threat nerf' for Maul"}
    - {id: "1482094399813849241", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Tephus: 'between it and bite, bear is looking at like a total 7% threat nerf'"}
    - {id: "1482095800686346431", era: 1.18.1-announced-pre-release, agreement: single source, claim: "'prot does really bad threat right now, bear is literally 1.5-2x the threat that prot does (assuming naxx/kara gear)'"}
    - {id: "1483016079209926688", era: 1.18.1-announced-pre-release, agreement: contested, claim: "Pre-release consensus was 'bear is best tank in raids, a little overturned' for threat"}
    - {id: "1484733781331021875", era: post-1.18.1, agreement: contested, claim: "Post-release: 'Savage Bite dodge/Parry is very noticeable in early threat gain' - a dodged/parried Savage Bite leaves bear with no fallback threat button [[d:druid#1484741482169499689]]"}
    - {id: "1464736055151562924", era: 1.18.1-announced-pre-release, agreement: contested, claim: "Players report losing threat to warriors with Salvation; 'no reason to bring a bear over warrior/paladin' is contested, not settled"}
    - {id: "1474473590043836720", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Bear rotation: Tiger's Fury from Cat before the pull (~20% haste, 18s), always queue Maul, Savage Bite at >35 rage or Clearcasting, FF on a spare GCD, Swipe as rage dump"}
    - {id: "1480481555263787149", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Rage-threshold macro: 0<Rage<100 Maul; 20<Rage<100 Maul+Swipe; 50<Rage<100 Maul+Savage Bite+Swipe"}
    - {id: "1412021581693059226", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "With T3 8-piece, use Savage Bite every cooldown to refresh the damage-reduction buff"}
    - {id: "1474500952965906515", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Rage potion on pull is the best snap-threat opener"}
    - {id: "1292121947412627498", era: pre-1.18.1, agreement: consensus, claim: "'haste is by far the best stat for bear in term of threat generation' - Maul rides the swing timer, 'like heroic strike for fury prot but even more powerful'"}
    - {id: "1473795292779516119", era: 1.18.1-announced-pre-release, agreement: single source, claim: "'Agi is bait. like triple the threat gains from 3 Haste over 25 Agi'"}
    - {id: "1482102222077825224", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Rage-pot opener ~132 AP equivalent vs 5% haste ~133 AP equivalent for a 20s window; haste scales better with gear"}
    - {id: "1479530552850907227", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Bear idol list 2026-03-06: Idol of the Ironfur, Idol of Crushing Maul, Idol of Ursoc's Resolve, Idol of the Unyielding Bear, Idol of the Savage Counter, Idol of the Protector"}
    - {id: "1386988179898499093", era: 1.18.1-announced-pre-release, agreement: single source, claim: "'The best idol is Idol of Brutality... It reduces your 2 main spells by 30% and 20% cost, Maul and Swipe'"}
    - {id: "1474483802976948254", era: 1.18.1-announced-pre-release, agreement: single source, claim: "Enchants for bear: counterweight on weapon, haste on shoulder, threat on gloves are 'really strong'"}
    - {id: "1475757404493713469", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Bear consumables: Juju Power, Elixir of the Mongoose, R.O.I.D.S., Elixir of Firewater, Elixir of Superior Defense, 2% haste or +20 Str food, crystal ward; STR/AP buffs do not stack"}
    - {id: "1479712614409048095", era: 1.18.1-announced-pre-release, agreement: consensus, claim: "Bear AoE = Swipe + FF per add; Demoralizing Roar groups mobs but is not sustained threat"}
    - {id: "1301990218085306369", era: pre-1.18.1, agreement: consensus, claim: "Twin Emperors: bear cannot tank the caster emperor - historically bear's weakest fight"}
    - {id: "1296452879154020443", era: pre-1.18.1, agreement: single source, claim: "Vael: bear is strong (fight timer); rage potion + Bite/Maul opener"}
    - {id: "1321165760151949322", era: pre-1.18.1, agreement: single source, claim: "Chromaggus: Savage Bite every 6s matters 'after patch' vs a 10s swing timer"}
    - {id: "1293715946489516052", era: pre-1.18.1, agreement: single source, claim: "Bear killed Sapphiron with 0 frost resist in full AQ40 gear"}
    - {id: "1325964834889793596", era: pre-1.18.1, agreement: consensus, claim: "Pure bear differs from pure cat by taking threat/armor/stealth (Feral Instinct, Thick Hide, Brutal Impact, Feral Charge, Savage Fury) instead of Feral Aggression"}
    - {id: "1330854853135827025", era: pre-1.18.1, agreement: consensus, claim: "'As Feral Bear tank there are not that many talents to spend on except balance (Omen of Clarity) + feral tree' - no dedicated optimal bear tree was ever settled"}
talents:
  build_name: "Bear-hybrid cat spine, 11/35/5 (decoded). No dedicated optimal bear tree is settled in-channel."
  build_link: "https://talents.turtlecraft.gg/druid?points=BSAaAI-FAYYRaDQQIFQB-Ao"
  build_link_note: "Decodes to the dominant Balance 11 / Feral 35 / Restoration 5 allocation (the same spine cat players use, buying Feral Instinct 3, Thick Hide 3, Feral Swiftness 2, Feral Charge 1). The channel repeatedly asks for a dedicated bear tree and none is agreed: 11/33/5 to 11/37/3 hybrids are the range [[d:druid#1330854853135827025]]."
  points:
    - {tree: Balance, talent: "Nature's Grasp", rank: 1, spell_id: 16689}
    - {tree: Balance, talent: "Improved Nature's Grasp", rank: 4, spell_id: 17249}
    - {tree: Balance, talent: "Natural Weapons", rank: 3, spell_id: 45717}
    - {tree: Balance, talent: "Natural Shapeshifter", rank: 2, spell_id: 16834}
    - {tree: Balance, talent: "Omen of Clarity", rank: 1, spell_id: 16864}
    - {tree: Feral Combat, talent: Ferocity, rank: 5, spell_id: 16938}
    - {tree: Feral Combat, talent: "Feral Instinct", rank: 3, spell_id: 16949}
    - {tree: Feral Combat, talent: "Thick Hide", rank: 3, spell_id: 16931}
    - {tree: Feral Combat, talent: "Feral Swiftness", rank: 2, spell_id: 24866}
    - {tree: Feral Combat, talent: "Feral Charge", rank: 1, spell_id: 16979}
    - {tree: Feral Combat, talent: "Sharpened Claws", rank: 3, spell_id: 16944}
    - {tree: Feral Combat, talent: "Primal Fury", rank: 2, spell_id: 45720}
    - {tree: Feral Combat, talent: "Predatory Strikes", rank: 3, spell_id: 16975}
    - {tree: Feral Combat, talent: "Blood Frenzy", rank: 2, spell_id: 45722}
