about: >
  Gear recommendations for Druid (Balance ranged DPS, Feral melee DPS, Feral tank,
  Restoration healer) by spec/role and level bracket, with where-to-obtain, built from
  the Druid forum (f42), the Itemization forum's relic list and 1.18.1 changelog, and
  the existing class playbooks' "Gear, enchants and consumables" sections. Like every
  other class read for this series, no maintained Turtle-specific pre-raid or raid BiS
  list exists for any Druid spec/role; the strongest source found is a single level-49
  "twink" gear list for Balance (leveling-30-49), which is unusually complete.
class: druid
generated_from:
  - https://forum.turtlecraft.gg/viewtopic.php?t=16360
  - https://forum.turtlecraft.gg/viewtopic.php?t=5704
  - https://forum.turtlecraft.gg/viewtopic.php?t=9080
