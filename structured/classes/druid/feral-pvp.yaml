stat_weights:
  heart_of_the_wild: treated as essential for PvP HP/mana pool (single source); present in both 2025 Discord links
  feral_swiftness: treated as essential for PvP cat-form mobility (single source)
  agility: valued partly for dodge on top of damage/crit (vs Strength's raw damage); heavy-Agility builds still report sitting
    in Bear ~90% of fights in the burst meta [[d:druid#1397239446323073077]]
  pvp_hit: contested - melee 5%, spell 3%, or Natural Weapons covers it (list all three) [[d:druid#1350792370085564456]] [[d:druid#1482736105634791637]]
    [[d:druid#1283031488895647767]]
caps:
  pvp_hit_melee: 5% is the safer melee number; the PvE-to-8% change only removed boss hit suppression [[d:druid#1350792370085564456]]
  pvp_spell_hit: 3% PvP spell cap [[d:druid#1482736105634791637]]; with Natural Weapons, effectively 0 needed [[d:druid#1283031488895647767]]
  speed_breakpoint: 3/4-piece PvP set bonus lifts Travel Form ~30% -> ~55-60%; treated as mandatory for flag carrying [[d:druid#1348208499779178497]]
rotation_single:
- priority: 0
  action: 'Opener: Prowl -> Pounce -> Rake -> Rip (bleeds ignore armor); never Pounce a mage'
  source: '[[d:druid#1428755592671137895]] [[d:pvp-general#1380875640907235431]]'
- priority: 1
  action: get target past 50% before stun ends, then Bear to finish, or Bash and return to Cat to Shred
  condition: stun window
  source: '[[d:druid#1473021901327827187]]'
- priority: 2
  action: Bear Form
  condition: stunned/focused by melee; vs rogue opener
  source: '[[d:druid#1428742043164872824]]'
- priority: 3
  action: Bash -> Omen Regrowth + Rejuvenation
  condition: need heals
  source: '[[d:druid#1248739088060907644]]'
- priority: 4
  action: Reshift / shift
  condition: rooted or snared
  source: '[[d:druid#1459797275575587023]]'
- priority: 5
  action: PvP trinket
  condition: Kidney Shot, not the opener
  source: '[[d:druid#1402317105650733229]]'
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Bear Form Swipe
  condition: add packs; cat has no AoE
aoe_threshold: 2
cooldowns:
- name: Feral Charge
  use_when: interrupt/gap-close against casters, ~15s cooldown pre-CC2
- name: Bash
  use_when: stun to set up burst or interrupt; Brutal Impact 2 extends it
- name: Frenzied Regeneration
  use_when: when focused; ~25% health with full rage post-CC2 (heavily reduced from the old deep-feral survival tool) [[d:druid#1337148085423444059]]
- name: Berserk
  use_when: burst window after the Bear stun is trinketed; returns to Cat
- name: PvP trinket (Insignia)
  use_when: universal all-CC break on a 3-min CD; must be used in form (post-2025 bugfix) [[d:druid#1248739088060907644]]
resource_rules:
- Shift form to clear poisons/curses/magic debuffs (form-shift dispel)
- Shift in and out of forms specifically to shake movement-impairing snares while flag-carrying
- Use the same 'Reshift' button as PvE for snare-breaks and powershifting [[d:druid#1412742288324563064]]
consumables:
- 'Engineering: grenades/Sapper require shifting out (or opening caster); reflectors, nets, Insignia work in form [[d:druid#1388277425971921008]]'
- 'Defensive list: Greater <element> Protection Potions, Free Action Potion, Limited Invulnerability Potion, Magic Resistance
  Potion, Elixir of Fortitude, Juju Chill/Ember, Spirit of Zanza; bears add Greater Stoneshield, Elixir of Superior Defense,
  Hardened Mushroom'
- 'Stealth detection to spot Rogues: Catseye Ultra Goggles +18, Catseye Elixir +10, PvP gloves +10, plus a friendly Warlock''s
  Paranoia +30 [[d:druid#1082697299085512795]]'
mistakes_to_avoid:
- Pouncing a mage [[d:pvp-general#1380875640907235431]]
- Staying in Cat vs melee [[d:druid#1428742043164872824]]
- Expecting burst; druids win by attrition [[d:druid#1491929130952954148]]
- Carrying the WSG flag in Swift Travel Form (not allowed) [[d:druid#1328807349040975996]]
- Dropping the 4-piece PvP set speed bonus [[d:druid#1477449069327810591]]
supersedes:
- claim: Zahnfee's 'unkillable' 2024 build is usable (forum)
  verdict: Pre-CC2 and superseded; use the 2025 Zotnar/Moreg links instead (still no post-1.18.1 endorsed build)
  sources:
  - '[[d:druid#1397940565500231690]]'
- claim: Nature's Grasp works in Bear Form
  verdict: Removed (players contest, staff defend for 'parity of forms'); must shift out to root
  sources:
  - '[[d:druid#1406166500393484289]]'
- claim: Druid PvP trinket leaves you in form
  verdict: Post-CC2 it shifted you out (bug), reported fixed 2025-03-19
  sources:
  - '[[d:druid#1304850966314618922]]'
gaps:
- No endorsed post-1.18.1 feral PvP point list
- 'No Hunter matchup tactic found (gap in both #druid and #pvp-general)'
- No working feral counterplay vs Shaman/Paladin
play_loop:
  guide_section: guide/classes/druid/pvp.md#how-to-play
  opener:
  - Prowl
  - Pounce
  - Rake
  - Rip (bleeds ignore armor)
  - 'vs mage: do not open with Pounce'
  single_target:
  - priority: 1
    action: Rake + Rip
    condition: during the Pounce stun; get target past 50% before it ends
  - priority: 2
    action: Bear Form to finish, or Bash then back to Cat and Shred 5 s
    condition: stun ended
  - priority: 3
    action: stay in Bear
    condition: target trinketed the stun
  - priority: 4
    action: Cat Form + Berserk
    condition: target did not trinket (single source)
  - priority: 5
    action: Ferocious Bite
    condition: 5 combo points, target low (vanilla baseline)
  - priority: 6
    action: Bash -> Omen Regrowth -> Rejuvenation
    condition: need sustain
  control:
  - Bash is the only post-opener stun (60 s cd); Bash from Cat costs 2 GCDs
  - Feral Charge = gap-closer/interrupt (8-25 yd)
  - no interrupt in Cat Form
  - do not break your own bleeds with Roots/Hibernate (vanilla baseline)
  cooldowns:
  - name: Bash
    spell_id: 8983
    use_when: stun chain / interrupt; 60 s cd
  - name: Feral Charge
    spell_id: 16979
    use_when: close gap or interrupt a cast; 15 s cd
  - name: Berserk
    spell_id: 45708
    use_when: kill window after the stun if target did not trinket; 360 s cd
  - name: Frenzied Regeneration
    spell_id: 22896
    use_when: Bear Form emergency; 300 s cd
  - name: Barkskin (Feral)
    spell_id: 51452
    use_when: defensive; not castable while stunned; 600 s cd
  - name: Dash
    spell_id: 9821
    use_when: chase or escape in Cat; 300 s cd
  defensive:
  - fight any melee in Bear Form
  - shift / Reshift to break roots and slows
  - save PvP trinket for Kidney Shot
  - Nature's Grasp not castable in Bear
  - heal only in lulls or when shifting out anyway (e.g. Frost Nova)
  target_priority:
  - 'BG: peel for / heal flag carriers, defend nodes (guide Battleground role)'
  - no druid-specific kill order sourced; kill a healer you can lock out, else the lowest-armor dps (vanilla baseline)
  reset:
  - Travel Form out to reset ("going cheetah and running away") [[d:druid#1427344507007012975]]
  - drink out of combat; re-Prowl before re-engaging (vanilla baseline)
  vs_class:
    warrior: root, kite, shift out of Hamstring, Travel Form to reset
    rogue: be in Bear when the opener lands; trinket Kidney Shot, not the first stun
    shaman: 'hardest matchup: Purge strips HoTs, Enhancement burst kills Cat'
    paladin: 'losing for Feral: HoJ/Repentance lock you out of heals'
    mage: no Pounce opener (Blink + trinket saved for Bash); Balance out-ranges Arcane
    warlock: kill the pet, avoid Death Coil -> fear -> silence; Feral nearly always lands the opener
    priest: dispels all DoTs/HoTs in one GCD
    hunter: full ranged pressure even with the pet slept/rooted
  sources:
  - '[[d:druid#1428755592671137895]]'
  - '[[d:druid#1473021901327827187]]'
  - '[[d:druid#1413608701654339707]]'
