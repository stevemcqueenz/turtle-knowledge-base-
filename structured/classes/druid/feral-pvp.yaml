patch_validity:
  written_for: 2024-01 talent build (pre-Class-Changes-2, superseded); tactical toolkit description assumed durable through
    1.18.1
  valid_for_1181: unknown
  notes: 'The forum''s one full build link uses the pre-CC2 URL format and is superseded; Discord supplies two 2025-era feral
    PvP links (Zotnar 11/33/5, Moreg 15/13/23) but NO endorsed post-1.18.1 point list. Bear-form offense is reported gutted
    by cumulative Savage Bite/Frenzied Regeneration nerfs; the new 1.18.1 PvP set became PvE threat BiS, which is contested.
    Feral power level is contested: pre-CC2 strong/outlast, 2025-2026 complaints dominate, one post-1.18.1 voice still calls
    it ''strong if played right'' [[d:druid#1473021122361692334]].'
discord:
  channel: druid
  scope: feral PvP builds, whole-kit loop, shapeshift/consumable rules, flag carrying, matchups, 1.18.1 PvP gear
  sources:
  - id: '1336006691992371221'
    era: pre-1.18.1
    agreement: consensus
    claim: 'Feral PvP is not a pure-cat spec: use the whole toolkit (cat opener, Bear under burst, caster heals); ''pure cat
      gets obliterated, next to worthless'' [[d:druid#1357153915191296031]] [[d:druid#1349843423158341736]] [[d:druid#1402312193797652563]]'
  - id: '1397940565500231690'
    era: pre-1.18.1
    agreement: single source
    claim: Zotnar's open-world/BG build decodes to Balance 11 / Feral 33 / Restoration 5 (Brutal Impact 2, Feral Instinct
      3, Feral Charge 1)
  - id: '1406003536923332760'
    era: pre-1.18.1
    agreement: single source
    claim: Moreg's 1.18.0 '14/14/23 equivalent' PvP build decodes to Balance 15 / Feral 13 / Restoration 23 (Furor 5, Improved
      Healing Touch 5, Gift of Nature 5, Swiftmend/NS) [[d:druid#1406004729624006797]]
  - id: '1406166500393484289'
    era: pre-1.18.1
    agreement: contested
    claim: 'Nature''s Grasp removed from Bear Form: players call it a gutting (''I have to shift out of bear and let the warrior
      smack me to root him''); staff (Jamey) defends it for ''parity of forms'' and calls it ''incredibly potent in PvP''
      [[d:druid#1408273595691565117]] [[d:druid#1380593130079781028]] [[d:druid#1380595895686529095]]'
  - id: '1388277425971921008'
    era: pre-1.18.1
    agreement: consensus
    claim: Grenades/Sappers cannot be used in Cat/Bear even after 1.17.2 enabled consumables in forms; reflectors/nets/Insignia
      trinkets DO work in form, so shift out (or open caster) to bomb [[d:druid#1388298378588324012]] [[d:druid#1399852314168393790]]
  - id: '1304850966314618922'
    era: pre-1.18.1
    agreement: consensus
    claim: Druid PvP trinket forced the druid out of form post-CC2 (reported fixed 2025-03-19) [[d:druid#1351679886565183528]]
  - id: '1402317105650733229'
    era: 1.18.1-announced-pre-release
    agreement: single source
    claim: Flash Bomb (10s fear, 1min CD, does not break on damage) is a feral-specific hard counter when the trinket is down;
      'bear is a punching bag that does no damage'
  - id: '1328807349040975996'
    era: pre-1.18.1
    agreement: consensus
    claim: Swift Travel Form cannot carry the WSG flag and takes no PvP-set/mount-speed bonus; carriers must use normal Travel
      Form [[d:druid#1313448266460954686]]
  - id: '1199447134626394173'
    era: mixed
    agreement: consensus
    claim: Druid is 'by far the best WSG flag carrier'; flag-shifting clears roots/slows and keeps the carrier moving [[d:druid#1099079358058078319]]
      [[d:druid#1473021122361692334]]
  - id: '1345072608282017823'
    era: pre-1.18.1
    agreement: contested
    claim: 'Speed stacking contested: ''form speed not stacks with anything except the pvp speed bonus'' vs the PvP set bonus
      stacking with everything; practical consensus is 3/4-piece PvP set + minor boot speed [[d:druid#1316795367366590474]]
      [[d:druid#1344247088527052820]]'
  - id: '1391083161106120946'
    era: pre-1.18.1
    agreement: consensus
    claim: Engineering is 'bis for pvp' / 'the meta for pvp'; War Stomp into grenade while creating distance; First Aid for
      oom moments [[d:druid#1416799210728067268]]
  - id: '1487165021715697816'
    era: pre-1.18.1
    agreement: contested
    claim: 'Feral is weakest vs plate/healer hybrids and burst casters: Paladins and Shamans ''near impossible to kill'' /
      ''eat druids for breakfast'' [[d:druid#1402317105650733229]]; Cat is strong vs light-armor casters if it stays on them'
  - id: '1487935338197291078'
    era: post-1.18.1
    agreement: contested
    claim: The new 1.18.1 feral PvP set became PvE threat BiS ('only costs 85k honor and 3.5k conquest'); called 'unhealthy
      to have pve bis come from pvp' [[d:druid#1487969266769727612]]
  - id: '1482116247696183336'
    era: post-1.18.1
    agreement: consensus
    claim: Tauren is the PvP-minmax race (War Stomp + stamina); War Stomp -> Entangling Roots -> Travel Form is the named
      play
  - id: '1491538510492995816'
    era: post-1.18.1
    agreement: consensus
    claim: PvP Dampening became class/spec-dependent in 1.18.1 (staff confirm); exact druid values unpublished [[d:druid#1487907149618348213]]
  - id: '1482736105634791637'
    era: pre-1.18.1
    agreement: contested
    claim: 'PvP hit caps stated inconsistently: melee 5% [[d:druid#1350792370085564456]] vs spell 3% vs ''Natural Weapons
      covers it'' [[d:druid#1283031488895647767]]; keep all three labelled'
