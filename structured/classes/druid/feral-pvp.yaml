stat_weights:
  heart_of_the_wild: "treated as essential for PvP HP/mana pool (single source); present in both 2025 Discord links"
  feral_swiftness: "treated as essential for PvP cat-form mobility (single source)"
  agility: "valued partly for dodge on top of damage/crit (vs Strength's raw damage); heavy-Agility builds still report sitting in Bear ~90% of fights in the burst meta [[d:druid#1397239446323073077]]"
  pvp_hit: "contested - melee 5%, spell 3%, or Natural Weapons covers it (list all three) [[d:druid#1350792370085564456]] [[d:druid#1482736105634791637]] [[d:druid#1283031488895647767]]"
caps:
  pvp_hit_melee: "5% is the safer melee number; the PvE-to-8% change only removed boss hit suppression [[d:druid#1350792370085564456]]"
  pvp_spell_hit: "3% PvP spell cap [[d:druid#1482736105634791637]]; with Natural Weapons, effectively 0 needed [[d:druid#1283031488895647767]]"
  speed_breakpoint: "3/4-piece PvP set bonus lifts Travel Form ~30% -> ~55-60%; treated as mandatory for flag carrying [[d:druid#1348208499779178497]]"
rotation_single:
  - {priority: 1, action: "Pounce or Ravage from stealth", condition: "opener; do NOT Pounce a Mage - they Blink it and hold the trinket for Bash"}
  - {priority: 2, action: "stealth -> Pounce -> Rake -> Rip -> Bear Form -> Bash", condition: "1.18-era proposed opener; stay Bear if the stun is trinketed, otherwise back to Cat and burst with Berserk using the energy-tick tempo [[d:druid#1413608701654339707]]"}
  - {priority: 3, action: "HoTs (Rejuvenation/Regrowth) + Innervate", condition: "sustain loop against non-burst opponents"}
  - {priority: 4, action: "Feral Charge", condition: "interrupt a casting opponent, proactively not just defensively"}
  - {priority: 5, action: "shift to Bear Form", condition: "surviving burst; 6k+ HP, armor, Bash/Feral Charge interrupt, Frenzied Regen under focus; survival/hold only, NOT a kill condition post-1.18.1 [[d:druid#1402317105650733229]]"}
  - {priority: 6, action: "disengage with Travel Form and heal", condition: "reset the fight; shift out of roots/slows"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Bear Form Swipe", condition: "add packs; cat has no AoE"}
aoe_threshold: 2
cooldowns:
  - {name: "Feral Charge", use_when: "interrupt/gap-close against casters, ~15s cooldown pre-CC2"}
  - {name: "Bash", use_when: "stun to set up burst or interrupt; Brutal Impact 2 extends it"}
  - {name: "Frenzied Regeneration", use_when: "when focused; ~25% health with full rage post-CC2 (heavily reduced from the old deep-feral survival tool) [[d:druid#1337148085423444059]]"}
  - {name: "Berserk", use_when: "burst window after the Bear stun is trinketed; returns to Cat"}
  - {name: "PvP trinket (Insignia)", use_when: "universal all-CC break on a 3-min CD; must be used in form (post-2025 bugfix) [[d:druid#1248739088060907644]]"}
resource_rules:
  - "Shift form to clear poisons/curses/magic debuffs (form-shift dispel)"
  - "Shift in and out of forms specifically to shake movement-impairing snares while flag-carrying"
  - "Use the same 'Reshift' button as PvE for snare-breaks and powershifting [[d:druid#1412742288324563064]]"
consumables:
  - "Engineering: grenades/Sapper require shifting out (or opening caster); reflectors, nets, Insignia work in form [[d:druid#1388277425971921008]]"
  - "Defensive list: Greater <element> Protection Potions, Free Action Potion, Limited Invulnerability Potion, Magic Resistance Potion, Elixir of Fortitude, Juju Chill/Ember, Spirit of Zanza; bears add Greater Stoneshield, Elixir of Superior Defense, Hardened Mushroom"
  - "Stealth detection to spot Rogues: Catseye Ultra Goggles +18, Catseye Elixir +10, PvP gloves +10, plus a friendly Warlock's Paranoia +30 [[d:druid#1082697299085512795]]"
mistakes_to_avoid:
  - "Relying on the pre-CC2 build/power-level expectations"
  - "Trying to out-damage burst classes instead of using the CC-break/heal/disengage loop"
  - "Neglecting Heart of the Wild and Feral Swiftness in a PvP build"
  - "Expecting Bear Form to carry offense post-1.18.1 - it is survival/objective-holding only [[d:druid#1402317105650733229]]"
  - "Sitting in Bear Form expecting to kill an opponent rather than survive/hold an objective"
  - "Dumping all rage into Frenzied Regeneration when Maul/Bash still need it"
  - "Pouncing a Mage (Blink) or brawling a Paladin/Shaman - the two named losing matchups [[d:druid#1487165021715697816]]"
  - "Carrying the WSG flag in Swift Travel Form - it cannot pick up the flag [[d:druid#1328807349040975996]]"
supersedes:
  - {claim: "Zahnfee's 'unkillable' 2024 build is usable (forum)", verdict: "Pre-CC2 and superseded; use the 2025 Zotnar/Moreg links instead (still no post-1.18.1 endorsed build)", sources: ["[[d:druid#1397940565500231690]]"]}
  - {claim: "Nature's Grasp works in Bear Form", verdict: "Removed (players contest, staff defend for 'parity of forms'); must shift out to root", sources: ["[[d:druid#1406166500393484289]]"]}
  - {claim: "Druid PvP trinket leaves you in form", verdict: "Post-CC2 it shifted you out (bug), reported fixed 2025-03-19", sources: ["[[d:druid#1304850966314618922]]"]}
gaps:
  - "No endorsed post-1.18.1 feral PvP point list"
  - "No Hunter matchup tactic found (gap in both #druid and #pvp-general)"
  - "No working feral counterplay vs Shaman/Paladin"
