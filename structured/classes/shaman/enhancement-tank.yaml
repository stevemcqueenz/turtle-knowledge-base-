patch_validity:
  written_for: 1.17.2 / 1.18.0 (Class Changes 2 tank talents)
  valid_for_1181: true
  notes: '1.18.1 replaced Elemental Weapons'' Rockbiter passive -10% damage taken with Earthen Bulwark (an absorb shield);
    the Enh T2.5 5-set was reworked to boost it; both are reported bugged/not stacking from special attacks through 2026-04-07.
    No post-1.18.1 guide update was posted (Mimiwarmini''s promised explanation never came). Talent point allocations and
    the threat rotation are unaffected. Discord adds the post-1.18.1 AoE-threat priority and the Chromaggus/Nefarian/drakonid
    notes in `discord:` below. Guide rewrite (guide/classes/shaman/tank.md): talents/rotation/stats refreshed to the post-1.18.1
    15/36/0 standard; Earthen Bulwark still reported building only from auto-attacks through 2026-04-14 [[d:shaman#1493387191328571602]].'
