stat_weights:
  priority: Armor = Stamina > Agility; Defense a bonus, never a focus [[d:shaman#1474649022043263029]]; shield armor is the
    single most important stat [[d:shaman#1486559128083103835]]
  threat: Strength > spell power > Agility [[d:shaman#1486559128083103835]]; weapon skill to 315
  defense: only worth it if it reaches 440; otherwise armor/health [[d:shaman#1466115983541538979]]
  block: useless below the avoidance needed to push crushes off [[d:shaman#1485012544820089056]]
  weapon_speed: slow one-hander (Stormstrike/Lightning Strike not normalized) [[d:shaman#1486361985439498340]]; while Bulwark
    builds only from autos some tanks prefer faster weapons [[d:shaman#1493257991397572819]]
caps:
  physical_hit: 8% (4% from gear with weapon-skill book) [[d:shaman#1487191048840020049]]
  weapon_skill: 315 (MC gloves + Orc racial + book) [[d:shaman#1486861889248952521]]
  defense: 440 crit immunity unreachable in practice [[d:shaman#1490407432403419336]]
  crush: 15% regardless of Defense [[d:shaman#1478722202269384705]]
  earthen_bulwark: 20% of physical damage (x3 with shield) -> absorbs 5/10/15% for 8 s, capped at 20% max HP; builds only
    from autos at release (bug) [[d:shaman#1480077263381860416]] [[d:shaman#1493309560428171430]]
rotation_single:
- priority: 1
  action: Rockbiter on a slow one-hander + shield; Lightning Shield for the pull
  condition: before pull
- priority: 2
  action: Pull with Chain Lightning (or Molten Blast -> Chain Lightning)
  condition: pull [[d:shaman#1486563067511963648]] [[d:shaman#1438950665572450448]]
- priority: 3
  action: Earth Shock
  condition: on cooldown (~40% of threat) [[d:shaman#1453500008375521330]]
- priority: 4
  action: Stormstrike
  condition: on cooldown
- priority: 5
  action: Lightning Strike (Rank 3)
  condition: on cooldown [[d:shaman#1489000281315475559]]
- priority: 6
  action: Auto-attack
  condition: always (builds Earthen Bulwark)
- priority: 7
  action: Swap to Water Shield
  condition: mana below ~66% [[d:shaman#1457483435806294106]]
- priority: 8
  action: Earthshaker Slam (taunt)
  condition: target not on you; call out resists [[d:shaman#1481752700486942720]]
- priority: 9
  action: Never hard-cast while being hit
  condition: always [[d:shaman#1445658999881207950]]
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Chain Lightning pull + Stoneclaw Totem + Totem of the Tides (Water Shield up); tab Earth Shock and strikes
  condition: normal pack [[d:shaman#1492243908304830534]]
- targets_min: 3
  priority: 2
  action: Fire Nova Totem
  condition: party AoEs hard [[d:shaman#1486561660150747156]]
- targets_min: 3
  priority: 3
  action: Magma Totem after Nova
  condition: last resort, mobs live long [[d:shaman#1492243972607705210]]
- targets_min: 4
  priority: 4
  action: Fire Nova + Goblin Sapper Charge + Stoneclaw
  condition: emergency snap threat [[d:shaman#1438960736440156210]]
aoe_threshold: 2
cooldowns:
- name: Earthshaker Slam
  use_when: taunt; can be resisted with no backup
- name: Bloodlust
  use_when: pull, with haste potion / Kiss / Juju for a threat lead [[d:shaman#1453829313412468816]]
- name: Stoneshield Potion / healthstone / tea
  use_when: no defensive cooldown exists [[d:shaman#1480080749754450022]]
- name: Zandalari Hero Badge
  use_when: longest-lasting defensive trinket [[d:shaman#1465051820907958425]]
resource_rules:
- Tea + mana potion on cooldown [[d:shaman#1471201338535711015]]
- Water Shield most of the fight; Lightning Shield at pull
- Stoneclaw + Totem of the Tides is the cheap default; Magma destroys mana [[d:shaman#1492243972607705210]]
- Rank 1 Earth Shock only for interrupts when oom [[d:shaman#1424427249884463326]]
consumables:
- Flask of the Titans + Stoneshield Potion [[d:shaman#1465328508577251380]]
- Flask of Supreme Power once uncrittable/uncrushable [[d:shaman#1467978670797754630]]
- Stoneskin Potion on hard hitters after 1.18.1 [[d:shaman#1488991783861092482]]
- Fire resistance gear/potions for Ragnaros (~250 FR) [[d:shaman#1480121471106945105]]
mistakes_to_avoid:
- Shield Specialization [[d:shaman#1487222143841337405]]
- Chasing Defense/block over Stamina/Armor [[d:shaman#1474649022043263029]]
- Fast daggers [[d:shaman#1467598647158902935]]
- Two-hand tanking hard bosses [[d:shaman#1487039557395546222]]
- Stoneclaw without Totemic Alignment [[d:shaman#1455604717332992041]]
- Stoneskin Totem on bosses [[d:shaman#1458137175219769549]]
- Hard-casting under melee [[d:shaman#1445658999881207950]]
- Magma every pull
discord:
  channel: shaman
  scope: 'Enhancement-tank additions from the archived #shaman Discord (2021-02-15 -> 2026-05). Every claim carries a [[d:shaman#<id>]]
    citation, an era (pre-1.18.1 | 1.18.1-announced-pre-release | post-1.18.1) and agreement (consensus | single source |
    contested).'
  rotation_single:
  - action: Rockbiter + shield; Lightning/Water Shield; pull with Lightning Bolt or Chain Lightning; then Stormstrike -> Earth
      Shock (consume the buff) -> Lightning Strike -> Earth Shock -> refresh shield.
    condition: post-1.18.1
    sources:
    - '[[d:shaman#1488136124617724004]]'
    era: post-1.18.1
    agreement: consensus
  rotation_aoe:
  - action: 'Max-threat AoE order: Chain Lightning > Stoneclaw Totem > Fire Nova > Magma. Totem of the Tides often lets you
      skip Magma.'
    targets_min: 4
    sources:
    - '[[d:shaman#1492243384734060714]]'
    - '[[d:shaman#1491520161885192413]]'
    era: post-1.18.1
    agreement: consensus
  totems:
  - Totem of the Tides (Stormwrought Keep) is the key early AoE/threat relic (Water Shield procs); Totemic Alignment plus
    Nova/Magma gives strong AoE threat [[d:shaman#1492243384734060714]].
  stat_weights:
    agility_vs_strength: contested as in the forum KB; the channel adds that the Earthen Bulwark build wants melee crit/stats
      [[d:shaman#1485708569264521287]].
  boss_notes:
  - boss: Chromaggus
    note: the bronze affliction runs to the end of the Bulwark buff; the tank cannot sustain Bulwark under the bug (~420 physical
      DPS needed); without the defense cap it is a rough fight
    sources:
    - '[[d:shaman#1485788704407683103]]'
    - '[[d:shaman#1493253058350547106]]'
    - '[[d:shaman#1493314575897071878]]'
    era: post-1.18.1
    agreement: consensus
  - boss: Nefarian
    note: tankable in T1-grade gear once Bulwark is fixed; the Bulwark bug currently blocks it
    sources:
    - '[[d:shaman#1488914722706161714]]'
    - '[[d:shaman#1493253058350547106]]'
    era: post-1.18.1
    agreement: single source
  - boss: big drakonids (BWL)
    note: attack-speed slows make the Bulwark build ineffective; no absorb during stun/whirlwind
    sources:
    - '[[d:shaman#1486538158861713468]]'
    era: post-1.18.1
    agreement: single source
  gear:
  - Ancient Jade Leggings for weapon skill / hybrid [[d:shaman#1491836338562007223]].
  - Totem of the Tides is mandatory early [[d:shaman#1492243384734060714]].
  bugs:
  - id: BUG-BULWARK
    entity:
    - Earthen Bulwark
    - Rockbiter Weapon
    - Stormstrike
    - Lightning Strike
    summary: Earthen Bulwark builds only from white auto attacks, not Stormstrike/Lightning Strike, through the 2026-03-25
      hotfix and still reported on 2026-04-07; caps at 20% of maximum health with a 100-stack durability debuff, and was not
      in the patch notes.
    impact: Tank shamans call themselves 'crippled ... the least sturdiest tank of all in the current meta'; the old Rockbiter
      -10% damage-taken assumption is gone.
    sources:
    - '[[d:shaman#1484954736342995116]]'
    - '[[d:shaman#1485640385857454291]]'
    - '[[d:shaman#1486164601929338900]]'
    - '[[d:shaman#1488669160585166949]]'
    - '[[d:shaman#1487726640682369034]]'
    era: post-1.18.1
    agreement: consensus
  mistakes_to_avoid:
  - Relying on Earthen Bulwark from strikes (bugged) [[d:shaman#1484954736342995116]]
  - Swapping to Frost Shock as the main DPS shock without rethinking Stormstrike charge consumption -- a design pitfall no
    channel source recommends [[d:shaman#1486410446872383558]]
  sources:
  - id: '[[d:shaman#1488136124617724004]]'
    era: post-1.18.1
    agreement: consensus
    used_for: tank rotation
  - id: '[[d:shaman#1492243384734060714]]'
    era: post-1.18.1
