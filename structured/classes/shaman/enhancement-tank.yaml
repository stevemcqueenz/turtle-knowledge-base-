stat_weights:
  tankiness: "Stamina > Agility > Dodge > Defense"
  threat: "Hit > Agility > Spell Power > Critical > Strength"
  spell_power: "not negligible; close to AP's gain and useful with Lightning Shield rotation"
  intellect: "important early for mana control, falls behind agi/str once ranks/downranking are learned"
caps:
  physical_hit: "8%"
  spell_hit: "17% (boss level 63)"
  weapon_skill: "5 skill = 1% hit"
  defense: "140 above base (level 63); 1 defense = 0.04% miss/dodge/parry/block and -0.04% crit chance"
  crush_immunity: "guide's 440 defense target is effectively unreachable (~425 in BiS per Dezhan); crush = 150% damage, 102.4% avoidance needed to push it off"
  stat_conversions: "1 Str = 2 AP, 20 Str = 1 block value; 20 Agi = 1% crit = 1% dodge, 1 Agi = 2 armor; 1 Sta = 10 HP (10.5 Tauren)"
rotation_single:
  - {priority: 1, action: "Pre-pull: Rockbiter on a slow one-hander + shield, Lightning Shield (or Water Shield if mana-constrained), Mana Spring/Healing Stream, Grace of Air/Windfury, Stoneskin/Strength of Earth", condition: "before pull"}
  - {priority: 2, action: "Pull with Lightning Bolt R1, or max-rank Lightning Bolt x2 / Chain Lightning", condition: "need maximum initial threat"}
  - {priority: 3, action: "Stormstrike", condition: "first melee action after the pull"}
  - {priority: 4, action: "Earth Shock (max rank)", condition: "under the Stormstrike buff; use Frost Shock instead if target resists Nature"}
  - {priority: 5, action: "Lightning Strike", condition: "on cooldown; pick the shield that fits the moment (Lightning Shield = threat, Water Shield = mana, Earth Shield = survival)"}
  - {priority: 6, action: "Loop Stormstrike -> Earth Shock -> Lightning Strike -> Earth Shock -> refresh shield", condition: "steady state; with Reverberation 3/3 fit a second Earth Shock every other Stormstrike cycle"}
  - {priority: 7, action: "Downrank shocks or just auto-attack + taunt", condition: "threat is already comfortably ahead of the group"}
  - {priority: 8, action: "Earthshaker Slam then Earth Shock", condition: "a mob is attacking someone else (taunt); has no effect if the mob is already attacking you"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Stormstrike target 1, tab Earth Shock target 2, Lightning Strike target 3, tab-swap giving each an Earth Shock + auto attack", condition: "2-3 targets, no threat totems needed"}
  - {targets_min: 4, priority: 1, action: "Stoneclaw Totem", condition: "on pull or when in doubt; best AoE threat, 30-s CD"}
  - {targets_min: 4, priority: 2, action: "Fire Nova Totem timed to explode as the pack arrives", condition: "not fire-resistant packs"}
  - {targets_min: 4, priority: 3, action: "Magma Totem", condition: "sustained AoE threat; downrank when threat is safe (biggest mana burner)"}
  - {targets_min: 4, priority: 4, action: "Drop Earthbind after Stoneclaw expires", condition: "if needed to control the pack"}
aoe_threshold: 4
cooldowns:
  - {name: "Earthshaker Slam", use_when: "5-yd shield taunt, 10-s CD, 3% base mana; only when a mob is not already attacking you"}
  - {name: "Totemic Recall", use_when: "after a pull, refunds 25% of every totem's mana (+15% with Totemic Mastery)"}
  - {name: "Ankh", use_when: "emergency self-resurrect; nearest thing to a defensive CD besides the Hakkar trinket swap"}
resource_rules:
  - "Never generate more threat than needed to maintain aggro; skip the rotation and just auto-attack + taunt, or downrank shocks, once ahead"
  - "Swap Lightning Shield to Water Shield when mana is the constraint; Water Shield generates net mana above 936 AP with Lightning Strike (18:1 ratio in 1.18.1)"
  - "Rush toward silence-heavy mobs with Lightning Shield already up so silence does not waste mana"
consumables:
  - "armor kits, fortitude/armor potions and health potions before Black Morass"
  - "Crusader enchant and hit/threat gear per Mimiwarmini's pre-raid list"
mistakes_to_avoid:
  - "Expecting a defensive cooldown to exist (there is none beyond the Hakkar trinket swap)"
  - "Shield Specialization before level 33 respec into Ancestral Knowledge without the stamina trinkets first (Akos1896: mitigation is too weak early)"
  - "Tanking a fast weapon (Rockbiter no longer gives flat per-hit threat; a slow weapon gives more TPS)"
  - "Using Rockbiter's old -10% damage-taken assumption post-1.18.1 (it is now Earthen Bulwark, which was reported not stacking from special attacks as of 2026-04-07)"
  - "Pulling without checking whether the mob resists Nature (use Frost Shock/Molten Blast instead)"

discord:
  channel: shaman
  scope: "Enhancement-tank additions from the archived #shaman Discord (2021-02-15 -> 2026-05). Every claim carries a [[d:shaman#<id>]] citation, an era (pre-1.18.1 | 1.18.1-announced-pre-release | post-1.18.1) and agreement (consensus | single source | contested)."
  rotation_single:
    - action: "Rockbiter + shield; Lightning/Water Shield; pull with Lightning Bolt or Chain Lightning; then Stormstrike -> Earth Shock (consume the buff) -> Lightning Strike -> Earth Shock -> refresh shield."
      condition: "post-1.18.1"
      sources: ["[[d:shaman#1488136124617724004]]"]
      era: post-1.18.1
      agreement: consensus
  rotation_aoe:
    - action: "Max-threat AoE order: Chain Lightning > Stoneclaw Totem > Fire Nova > Magma. Totem of the Tides often lets you skip Magma."
      targets_min: 4
      sources: ["[[d:shaman#1492243384734060714]]", "[[d:shaman#1491520161885192413]]"]
      era: post-1.18.1
      agreement: consensus
  totems:
    - "Totem of the Tides (Stormwrought Keep) is the key early AoE/threat relic (Water Shield procs); Totemic Alignment plus Nova/Magma gives strong AoE threat [[d:shaman#1492243384734060714]]."
  stat_weights:
    agility_vs_strength: "contested as in the forum KB; the channel adds that the Earthen Bulwark build wants melee crit/stats [[d:shaman#1485708569264521287]]."
  boss_notes:
    - {boss: Chromaggus, note: "the bronze affliction runs to the end of the Bulwark buff; the tank cannot sustain Bulwark under the bug (~420 physical DPS needed); without the defense cap it is a rough fight", sources: ["[[d:shaman#1485788704407683103]]", "[[d:shaman#1493253058350547106]]", "[[d:shaman#1493314575897071878]]"], era: post-1.18.1, agreement: consensus}
    - {boss: Nefarian, note: "tankable in T1-grade gear once Bulwark is fixed; the Bulwark bug currently blocks it", sources: ["[[d:shaman#1488914722706161714]]", "[[d:shaman#1493253058350547106]]"], era: post-1.18.1, agreement: single source}
    - {boss: "big drakonids (BWL)", note: "attack-speed slows make the Bulwark build ineffective; no absorb during stun/whirlwind", sources: ["[[d:shaman#1486538158861713468]]"], era: post-1.18.1, agreement: single source}
  gear:
    - "Ancient Jade Leggings for weapon skill / hybrid [[d:shaman#1491836338562007223]]."
    - "Totem of the Tides is mandatory early [[d:shaman#1492243384734060714]]."
  bugs:
    - id: BUG-BULWARK
      entity: [Earthen Bulwark, Rockbiter Weapon, Stormstrike, Lightning Strike]
      summary: "Earthen Bulwark builds only from white auto attacks, not Stormstrike/Lightning Strike, through the 2026-03-25 hotfix and still reported on 2026-04-07; caps at 20% of maximum health with a 100-stack durability debuff, and was not in the patch notes."
      impact: "Tank shamans call themselves 'crippled ... the least sturdiest tank of all in the current meta'; the old Rockbiter -10% damage-taken assumption is gone."
      sources: ["[[d:shaman#1484954736342995116]]", "[[d:shaman#1485640385857454291]]", "[[d:shaman#1486164601929338900]]", "[[d:shaman#1488669160585166949]]", "[[d:shaman#1487726640682369034]]"]
      era: post-1.18.1
      agreement: consensus
  mistakes_to_avoid:
    - "Relying on Earthen Bulwark from strikes (bugged) [[d:shaman#1484954736342995116]]"
    - "Swapping to Frost Shock as the main DPS shock without rethinking Stormstrike charge consumption -- a design pitfall no channel source recommends [[d:shaman#1486410446872383558]]"
  sources:
    - {id: "[[d:shaman#1488136124617724004]]", era: post-1.18.1, agreement: consensus, used_for: "tank rotation"}
    - {id: "[[d:shaman#1492243384734060714]]", era: post-1.18.1, agreement: consensus, used_for: "AoE threat order / Totem of the Tides"}
    - {id: "[[d:shaman#1485788704407683103]]", era: post-1.18.1, agreement: consensus, used_for: "Chromaggus"}
    - {id: "[[d:shaman#1486538158861713468]]", era: post-1.18.1, agreement: single source, used_for: "drakonid attack-speed slow"}
    - {id: "[[d:shaman#1487726640682369034]]", era: post-1.18.1, agreement: consensus, used_for: "Bulwark cripples tanks"}
