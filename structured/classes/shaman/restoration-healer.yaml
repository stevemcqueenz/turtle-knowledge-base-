      allocation:
        - {tree: Enhancement, talent: Ancestral Knowledge, rank: 5, spell_id: 17489}
        - {tree: Enhancement, talent: Stable Shields, rank: 3, spell_id: 16291}
        - {tree: Restoration, talent: Improved Healing Wave, rank: 5, spell_id: 16229}
