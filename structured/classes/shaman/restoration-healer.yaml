patch_validity:
  written_for: "1.17.2 (Class Changes 2) and 1.18.0 (Chain Heal coefficient/Spirit Link/Totemic Mastery rework)"
  valid_for_1181: true
  notes: "'No changes for resto shamans in 1.18.1' beyond the Resto T1 8-set rework (spread-heal proc replaced by a 25% chance for a 250-damage absorb on Healing Wave/Lesser Healing Wave); talents, coefficients and the healing priority are unaffected. Discord confirms '1.18.1 changes nothing else for Resto' and adds the post-1.18.1 rank/rotation detail and the 'dead bonus' verdict on the replacement in `discord:` below."
