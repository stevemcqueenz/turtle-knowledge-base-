    - name: "Chain-Heal-free Healing-Wave build 0/22/29 (pre-1.18.1 only)"
      split: {Enhancement: 22, Restoration: 29}
      sources: ["[[d:shaman#1445177080668229713]]", "[[d:shaman#1465798907492827137]]"]
      era: 1.18.1-announced-pre-release
      agreement: single source
      note: "Healing Wave r3 (most mana-efficient) / r4 (near-max scaling) spam with 7-13 haste and no shield; mana effectively infinite via Healing Way + Tidal Surge + the old T1 8-set bounces. Dead once the T1 8-set changed."
  rotation_single:
    - action: "Chain Heal rank 1 spam is the default raid heal (max rank when heavy raidwide damage lands); Healing Wave rank 4/5 for isolated single-target damage (r3 most mana-efficient, r4 near-max scaling); Lesser Healing Wave only for emergencies (giga mana inefficient, never a routine raid heal); rank-1 Healing Wave pre-pull to set Healing Way and fish the Ancestral Fortitude proc."
      condition: "post-1.18.1 raid consensus"
      sources: ["[[d:shaman#1380694277461512214]]", "[[d:shaman#1489450604236509245]]", "[[d:shaman#1489450669936218213]]", "[[d:shaman#1490120632711516312]]", "[[d:shaman#1487131827796836525]]", "[[d:shaman#1489450784704823316]]", "[[d:shaman#1410288522526457928]]"]
      era: mixed
      agreement: consensus
    - action: "R1 -> R2 Chain Heal base-heal gap ~92.5, i.e. ~149 +healing; LHW is never downranked (HW r3 already casts 1.7 s)."
      condition: "rank selection"
      sources: ["[[d:shaman#1425200401577152583]]", "[[d:shaman#1487131827796836525]]", "[[d:shaman#1464784154250969201]]"]
      era: mixed
      agreement: "consensus (rank guide) / single source (numbers)"
  rotation_aoe:
    - action: "Chain Heal is the only AoE heal; Healing Stream Totem is the supplementary AoE heal. No numeric target threshold exists in the channel."
      targets_min: 3
      sources: ["[[d:shaman#1470854987251847449]]", "[[d:shaman#1429871523447050396]]"]
      era: 1.18.1-announced-pre-release
      agreement: consensus
  totems:
    - "Totems are off-GCD auras, four droppable at once, stack with oils/poisons; totem twisting is dead post-CC2 [[d:shaman#1361235720567525467]], [[d:shaman#1482118867835687032]]."
    - "Cleansing totems are the best water totems: instant/off-GCD, cover the whole party instead of Decursive, and do not trigger the Loatheb debuff [[d:shaman#1377134664648757300]], [[d:shaman#1380690300531380234]], [[d:shaman#1376906060614467704]]."
    - "Mana Spring is weaker than Blessing of Wisdom and is not buffed by Resto talents; it is used to refill between pulls [[d:shaman#1374677881292197938]]."
    - "Healing Stream is the useful dungeon/raidwide-damage option; contested as 'still bad' [[d:shaman#1374680418707574838]], [[d:shaman#1429871523447050396]], [[d:shaman#1410229297482043403]]."
    - "Totem of Calming River is the Resto BiS totem until Naxx (+8 mp5 while Water Shield active, +10 mana per pop, amplified by Improved Water Shield) [[d:shaman#1440622702930169946]], [[d:shaman#1416210028657901588]]; Totem of Flowing Water grants party effects on water totems [[d:shaman#1424838222546210907]]."
  earth_shield:
    cast_target: "self only -- players asked twice for a talent to cast it on allies and it was never added [[d:shaman#1296809224386379880]], [[d:shaman#1474496084549177599]]"
    healer_use: "30% pushback reduction stacking with Healing Focus 70% to 100% [[d:shaman#1416160312729796809]]"
    scaling: "scales with healing power; can crit and proc Ancestral Healing [[d:shaman#1435024400545091725]], [[d:shaman#1406331865610190978]]"
    era: "mixed"
    agreement: consensus
  cooldowns:
    - name: Spirit Link
      use: "30% of damage split among three linked allies, 20 s, 10-min CD (1.18.0). Loatheb (usable during the silence, rotate between Resto shamans); Maexxna (before web wrap); enrage/tank-burst phases. Some raiders call it near-useless in Naxx/K40 -- contested."
      sources: ["[[d:shaman#1303893673603502080]]", "[[d:shaman#1374680596713832480]]", "[[d:shaman#1379431123049779222]]", "[[d:shaman#1365147055802290199]]"]
      era: "pre-1.18.1"
      agreement: contested
    - name: Ancestral Swiftness
      use: "instant-cast emergency heal; instant rank-5 HW as the single-target 'fuck-up button'; mandatory for raiding/dungeons alongside Healing Focus [[d:shaman#1464784154250969201]], [[d:shaman#1358871932073672886]], [[d:shaman#1438519559446466580]]."
      era: "mixed"
      agreement: consensus
  stat_weights:
    order_a: "Healing power > crit > haste > int > stam > mp5 > agi > str > spirit [[d:shaman#1446485791671980104]]"
    order_b: "Healing power -> enough stamina -> enough mana -> crit and haste [[d:shaman#1428075745908883639]]"
    critique: "crit 'does literally nothing useful for resto' -- 50% bonus, converts to overheal [[d:shaman#1457838505907454105]]"
    mp5: "avoid mp5, stack haste; Water Shield + Blessing of Wisdom + 20-s teas cover sustain [[d:shaman#1404579043088793791]]"
    spirit: "weak on Resto, no in-combat regen [[d:shaman#1424163612141948928]]"
    hit: "no hit rating needed for healing [[d:shaman#1377193056213794837]]"
    haste_cap: "soft cap = the 1.5 s GCD for Chain Heal [[d:shaman#1477569610671853578]]"
    era: "mixed"
    agreement: contested
  set_bonuses:
    t1_8set_pre: "HW/LHW bounces to two nearby allies, and the bounces act as full Healing-Wave events: Undertow can proc multiple times per cast and Healing Way applies at 100%, yielding ~36% mana returned per cast; ~126-154 total healing power on the set, yet BiS through Naxx for many [[d:shaman#1305074980530290710]], [[d:shaman#1311208584058503218]], [[d:shaman#1429875953844355234]], [[d:shaman#1429862467693056151]]"
    t1_8set_post: "HW/LHW 25% chance to absorb 250 damage for 6 s (1.18.1); players universally call it a dead bonus and a nerf [[d:shaman#1465314216352288791]], [[d:shaman#1464641964132663409]], [[d:shaman#1474959812721643632]]"
    t3: "6/6 gives 6% resilience + 35 stamina; bonuses called mediocre, high stats [[d:shaman#1487677651031294022]], [[d:shaman#1467837081526075574]]"
    t35: "5-set crit scales with Healing Way stacks; strong when T1 shamans spread stacks, now mostly single-target [[d:shaman#1464912167441793168]], [[d:shaman#1432497254203396197]]"
