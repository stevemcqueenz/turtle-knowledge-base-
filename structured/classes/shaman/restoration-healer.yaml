  variant_healing_wave:
    build_name: "Chain-Heal-free Healing-Wave build 0/22/29 (pre-1.18.1 only)"
    note: "r3/r6-10 Healing Wave spam, 7-13 haste, no shield; mana effectively infinite via Healing Way / Tidal Surge / T1 8-set bounces. Only worked with the old T1 8-set. [[d:shaman#1445177080668229713]], [[d:shaman#1465798907492827137]]"
  leveling_order:
    - {level: 51, tree: Restoration, talent: "respec: Improved Water Shield with Stable Shields first"}
    - {level: 60, tree: Restoration, talent: "finish every Restoration talent except Improved Reincarnation, Healing Focus and Spirit Link (Skegg's dungeon-farming path only; raiders take Spirit Link)"}
stat_weights:
  contested: true
  camp_a: "Ignore mp5/spirit/%mana-regen gear; stack Intellect and +healing; farm tea and gold for Major Mana Potions; downranking solves mana issues (Grubi450)"
  camp_b: "Have at least +10% mana-regen-while-casting gear until T2/T2.5; keep a Spirit of Zanza on cooldown (Akos1896, partly superseded by the 2024-12-20 Water Shield regen talents)"
  int: "as much as possible; ~4k mana pool recommended on a badly geared Resto shaman"
  haste: "the old T1 8-set needed a full haste stack to work; with the set gone (1.18.1) no haste target exists in the forum KB -- Discord fills it: 1% haste ~= 15 +healing (Not Normal) or ~20 +healing at 1200 healing (peter_hammer), soft cap = the 1.5 s GCD"
  discord_numbers:
    haste: "1% haste ~= 15 +healing [[d:shaman#1454137300031246456]]; ~20 +healing at 1200 healing / 20% crit [[d:shaman#1425115694739095632]]; soft cap = the 1.5 s GCD for Chain Heal [[d:shaman#1477569610671853578]]"
    crit: "1% crit ~= 12 +healing but only 5-8 +healing on HW/CH ranks [[d:shaman#1454137300031246456]], [[d:shaman#1457846645872918700]]; called near-useless for Resto (50% bonus converts to overheal) [[d:shaman#1457838505907454105]], [[d:shaman#1455717313545502720]]"
    mp5: "largely dead post-1.18.0; cross-faction access to Blessing of Wisdom and Shaman Mana Spring devalues mp5, and 'all mp5 is now mp2' [[d:shaman#1404579043088793791]], [[d:shaman#1378303011834691645]], [[d:shaman#1424163612141948928]]"
    camp_b_superseded: "camp_b is superseded by the post-1.18.0 Discord consensus: haste is the throughput stat, mp5 is de-prioritised [[d:shaman#1404579043088793791]]"
    water_shield: "9 orbs with Stable Shields; Improved Water Shield = 3% regen/orb + 6% -> ~33% meditation equivalent [[d:shaman#1296623038556541039]], [[d:shaman#1402621429559853098]]"
    era: mixed
    agreement: "mixed (consensus mp5 dead; single source equivalences)"
caps: {}
rotation_single:
  - {priority: 1, action: "Totems before pull: Windfury/Strength of Earth/Flametongue/Mana Spring in a melee group (Grace of Air for hunters/druids, Tranquil Air for casters); Water Shield on", condition: "pre-pull"}
  - {priority: 2, action: "Spirit Link on the tank at pull or before a known burst window", condition: "instant, 35 yd, 20-s duration, 10-min CD since 1.18.0"}
  - {priority: 3, action: "Chain Heal as the default raid heal (max rank when the raid is low, R1/R2 for mana saving once geared)", condition: "target has allies nearby for the bounce"}
  - {priority: 4, action: "Lesser Healing Wave for quick patch-ups (downranked for mana efficiency)", condition: "life totals moving too fast for Healing Wave"}
  - {priority: 5, action: "Healing Wave for tank healing / steady single-target damage (R1 pre-pull to trigger Healing Way and fish for the Ancestral Fortitude proc)", condition: "tank sustain"}
  - {priority: 6, action: "Ancestral Swiftness into max-rank Healing Wave (someone about to die) or max-rank Chain Heal (big AoE damage just landed)", condition: "3-min CD emergency"}
  - {priority: 7, action: "Berserking (Troll) on cooldown when heavy healing is expected", condition: "racial"}
  - {priority: 8, action: "Sit back for mana regen when there is nothing to heal; interrupt your own cast if someone else's heal already landed", condition: "downtime discipline"}
  - {priority: 9, action: "Filler damage (Flame Shock/Searing Totem) or Earth Shock R1 interrupt only if mana allows and no CC is nearby", condition: "spare GCDs"}
rotation_aoe:
  - {targets_min: 3, priority: 1, action: "Chain Heal is the multi-target tool", condition: "no Resto set in the sources adds bounce targets"}
  - {targets_min: 3, priority: 2, action: "Healing Stream Totem", condition: "contested: 'most mana-efficient heal by a massive margin' per one source, 'still bad' per another"}
  - {targets_min: 3, priority: 3, action: "Poison/Disease Cleansing Totems for the party instead of manual dispels", condition: "always in Scarlet Monastery-style poison/disease content"}
aoe_threshold: 3
cooldowns:
  - {name: "Spirit Link", use_when: "10-min CD; 20 s, splits 30% of damage among 3 linked allies; use on the tank at pull or before a scripted burst"}
  - {name: "Ancestral Swiftness", use_when: "3-min CD; instant emergency heal, on cooldown in raids unless a hard phase is imminent"}
  - {name: Ankh, use_when: "wipe protection; do not use instantly, coordinate with the raid leader"}
resource_rules:
  - "Water Shield always; Mana Spring while the party drinks and stays in place"
  - "Nordanaar tea, Major Mana Potion, Spirit of Zanza, Dark/Demonic Runes (share CD with tea)"
  - "Biggest challenge is healing just enough while downranking as much as possible"
  - "If another shaman in the party runs Enhancement, let them totem Windfury/Strength while you run Mana Spring (yours is better)"
consumables:
  - "Dreamshard Elixir, Mageblood, Spirit of Zanza, Brilliant Mana/Wizard Oil, Major Mana Potion, Nordanaar Herbal Tea, Greater Fire Protection, Flask of Distilled Wisdom, Elixir of the Sage"
  - "Serious consumable use expected from BWL and mandatory from AQ40"
mistakes_to_avoid:
  - "Overhealing / not downranking"
  - "Chain Heal on an isolated target with no allies nearby to bounce to"
  - "Skipping Spirit Link or Improved Chain Heal"
  - "Totem twisting in raids, or re-dropping totems every pull now that range is 30 yd"
  - "Using Ankh immediately on a boss wipe instead of coordinating with the raid leader"
  - "Healing Wave spam expecting the old T1 8-set spread proc (removed 2026-03-20)"
  - "Chasing mana-regen gear over +healing once past T2/T2.5 gear (contested for fresh 60s)"
  - "Casting Earth Shield in Ghost Wolf form (not possible since 2024-11-20)"
  - "Assuming Earth Shield can be cast on the tank -- it is self-cast only (players asked twice for an ally version; never added) [[d:shaman#1296809224386379880]], [[d:shaman#1474496084549177599]]"
  - "Using max-rank Earth Shock to interrupt as a healer (pulls the mob onto you)"
  - "Dropping Searing Totem near CC'd mobs"

