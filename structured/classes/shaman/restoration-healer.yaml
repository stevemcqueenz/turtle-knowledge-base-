        - {tree: Restoration, talent: Ancestral Healing, rank: 3, spell_id: 16240}
        - {tree: Restoration, talent: Tidal Mastery, rank: 5, spell_id: 16221}
        - {tree: Restoration, talent: Healing Way, rank: 3, spell_id: 29202}
        - {tree: Restoration, talent: Healing Focus, rank: 2, spell_id: 16230}
        - {tree: Restoration, talent: Totemic Mastery, rank: 1, spell_id: 16189}
        - {tree: Restoration, talent: Restorative Totems, rank: 5, spell_id: 16208}
        - {tree: Restoration, talent: Improved Water Shield, rank: 3, spell_id: 51371}
