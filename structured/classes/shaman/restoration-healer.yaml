stat_weights:
  priority: healing power = haste > Int > mp5 > crit; Spirit does nothing [[d:shaman#1457836516368978143]]
  haste: 12-20 healing power per 1% [[d:shaman#1491510178921582713]]
  crit: weak, adds overheal [[d:shaman#1457838505907454105]]
  mp5: tie-breaker only [[d:shaman#1486787799154688234]]
caps:
  chain_heal_haste: ~25% haste hits the GCD floor; ~33% after multiplicative stacking is the soft cap [[d:shaman#1464922728115998815]]
    [[d:shaman#1457847126821175551]]
  healing_wave_haste: ~34% for rank 4+ [[d:shaman#1464922728115998815]]
rotation_single:
- priority: 1
  action: Totems for the group, Water Shield, mana oil
  condition: before pull
- priority: 2
  action: Chain Heal rank 1
  condition: 3+ injured in a clump; the workhorse [[d:shaman#1487131843328213013]]
- priority: 3
  action: Chain Heal rank 3
  condition: heavy raid damage [[d:shaman#1472590831775912169]]
- priority: 4
  action: Healing Wave rank 3-4 (rank 6+ with good healing power)
  condition: single-target top-up [[d:shaman#1487131827796836525]] [[d:shaman#1464792806097682655]]
- priority: 5
  action: Lesser Healing Wave (max rank)
  condition: emergency; never downrank [[d:shaman#1458535191810408539]]
- priority: 6
  action: Ancestral Swiftness + max-rank Healing Wave
  condition: instant emergency heal [[d:shaman#1490128865564037250]]
- priority: 7
  action: Spirit Link
  condition: tank near death in a burst phase
rotation_aoe:
- targets_min: 3
  priority: 1
  action: Drop totem, Chain Heal until the pack dies, recall totems, move
  condition: raid trash [[d:shaman#1446474284166811672]]
- targets_min: 3
  priority: 2
  action: Healing Wave over Chain Heal unless the group is stacked
  condition: 5-man [[d:shaman#1470095666398363749]]
aoe_threshold: 3
cooldowns:
- name: Spirit Link
  use_when: raid-wide, 30 yd; burn/enrage phases; weak where the raid avoids the tank (Twins) [[d:shaman#1443112634785337405]]
    [[d:shaman#1443116541779378226]]
- name: Ancestral Swiftness
  use_when: instant max-rank Healing Wave
resource_rules:
- Rank 1 Chain Heal as default [[d:shaman#1487131843328213013]]
- Tea and potions on cooldown; Fruitcakes in downtime [[d:shaman#1424166931971309638]]
- 'Water Shield: Undertow Healing Wave restores a charge below 3, else gives mana [[d:shaman#1481145443302772757]]'
consumables:
- Nordanaar/Hyjal tea, mana potions, Fruitcakes [[d:shaman#1424166931971309638]]
- Mana oil, Mageblood, Dream elixir [[d:shaman#1432782838381547590]]
mistakes_to_avoid:
- Expecting Chain Heal to pick the lowest-health target [[d:shaman#1485252771279143012]]
- Crit or Spirit stacking [[d:shaman#1457836516368978143]]
- +healing to buff low ranks [[d:shaman#1456182403130327071]]
- A weapon imbue instead of mana oil [[d:shaman#1472590831775912169]]
- The old T1 8-piece Healing Wave build (reworked in 1.18.1) [[d:shaman#1464377036415172758]]
