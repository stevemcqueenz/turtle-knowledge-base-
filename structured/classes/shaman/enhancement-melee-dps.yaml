  spellhance_variant:
    definition: "Flametongue imbue, 22/29/0 Elemental Fury split, hybrid spellpower gear and a fire-totem emphasis (Fire Nova/Searing weave single-target)."
    power_delta: "pre-1.18.1 10-15% behind physhance single-target (but better AoE); post-1.18.1 after the fixes ~5-8% behind."
