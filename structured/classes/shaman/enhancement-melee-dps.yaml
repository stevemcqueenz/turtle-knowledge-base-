    sources: ["[[d:shaman#1423506245045850194]]", "[[d:shaman#1424157142599991517]]", "[[d:shaman#1422913275967967286]]", "[[d:shaman#1484621315741712596]]", "[[d:shaman#1484823161403867196]]"]
