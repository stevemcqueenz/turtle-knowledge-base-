stat_weights:
  priority: melee hit to 8% > weapon skill to 315 > Strength > crit (~30% unbuffed is enough for Flurry) > haste > AP; spell
    hit, armor pen, Int, Spirit low [[d:shaman#1453511632058712145]]
  crit: 1% ~ 20-25 AP [[d:shaman#1453511632058712145]]
  hit: 1% ~ 35-45 AP until capped [[d:shaman#1453511632058712145]]
  haste: 1% ~ 17-18 AP pre-Naxx, more with Kiss of the Spider / T3.5 [[d:shaman#1488973642187411602]]
  strength: 1 Str ~ 2.3 AP ~ 2 Agi [[d:shaman#1461356189739778211]] [[d:shaman#1487779517429710899]]
  agility: crit only (no AP for shamans), ~1.3 AP [[d:shaman#1453511632058712145]]
  weapon_skill: ~14-15 AP per point below 315 [[d:shaman#1491837172561739907]]
  spell_hit: ~6-8 AP [[d:shaman#1450934429567549531]]
  armor_penetration: 1 Str ~ 5 ArP [[d:shaman#1494082990370721939]]
  weapon_speed: slowest weapon always better at similar quality (Stormstrike/Lightning Strike not normalized) [[d:shaman#1469420065966264392]]
caps:
  physical_hit: 8% = 3% talents + 1% (5 weapon skill book) + 4% gear [[d:shaman#1482104891295141980]]
  weapon_skill: 315 (glancing cap); 5 skill = 1% hit [[d:shaman#1428121232133591171]]
  crit_cap: ~54-55% for a hit-capped 2H, irrelevant in practice [[d:shaman#1461360955022901321]]
  spell_hit: 'not a target (spellhance: <=3% from gear) [[d:shaman#1445940501084901427]]'
rotation_single:
- priority: 1
  action: 'Pre-pull: Windfury Weapon, Lightning Shield, totems Strength of Earth / Windfury / Flametongue / Mana Spring'
  condition: before pull
- priority: 2
  action: Let the first white swing land before the first Stormstrike
  condition: opener [[d:shaman#1434594354118524958]]
- priority: 3
  action: Stormstrike
  condition: on cooldown [[d:shaman#1450924897978023976]]
- priority: 4
  action: Lightning Strike (Rank 3)
  condition: on cooldown with Lightning Shield up; macros must call Rank 3 [[d:shaman#1484940392347734207]]
- priority: 5
  action: 'Shock loop: Flame Shock -> Earth Shock -> Earth Shock'
  condition: shock off cooldown; Stormstrike before Earth Shock; skip Flame Shock on fire-immune or short-lived targets [[d:shaman#1489381819735605390]]
- priority: 6
  action: Auto-attack (/startattack)
  condition: always
- priority: 7
  action: Lightning Shield; Water Shield when mana is short
  condition: charges 0 or mana low [[d:shaman#1457507332471783485]]
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Single-target rotation on the kill target
  condition: 2 targets
- targets_min: 3
  priority: 1
  action: Fire Nova Totem (Flametongue raises fire totem damage 30%)
  condition: 3+ grouped targets [[d:shaman#1375916876336599050]]
- targets_min: 3
  priority: 2
  action: Chain Lightning
  condition: Clearcasting up
- targets_min: 5
  priority: 1
  action: Fire Nova again when Chain Lightning is on cooldown; Magma only if mana allows
  condition: large trash packs [[d:shaman#1444776794799734784]]
aoe_threshold: 3
cooldowns:
- name: Bloodlust
  use_when: 5-min CD; at fight start once Stormstrike and a shock are rolling, stacked with Juju Flurry / Potion of Quickness
    / Kiss of the Spider
- name: Blood Fury (Orc)
  use_when: with Bloodlust; 120 AP + 60 SP, lowers healing received [[d:shaman#1439185343772360704]]
- name: Limited Invulnerability Potion
  use_when: emergency threat escape [[d:shaman#1489323335161614478]]
resource_rules:
- Judgement of Wisdom from a paladin is the main mana plan; cut AoE totem use when mana is short [[d:shaman#1445241671645397115]]
- Water Shield returns mana only when it procs (hit or Lightning Strike), 2-s ICD [[d:shaman#1492179516481601537]]
- Tea and mana potion on cooldown on long fights
consumables:
- 'Starter: Elixir of the Mongoose, R.O.I.D.S., Juju Power, Dreamshard Elixir, Elixir of Greater Nature Power, Nordanaar Herbal
  Tea [[d:shaman#1416975393554174043]]'
- 'Full: Concoctions (Emerald Mongoose, Arcane Giant, Dreamwater), Greater Nature Power, Greater Firepower, R.O.I.D.S., Flask
  of the Titans/Supreme Power, Zanza, Mageblood, Superior Defense, Power Mushroom, Rumsey Rum/Medivh''s Merlot, Juju Flurry,
  tea, Major Mana Potion, Sapper, Quickness [[d:shaman#1416980701667922021]]'
- Juju Power over Elixir of the Giants / Arcane Giant (no stack) [[d:shaman#1447632275750781099]]
mistakes_to_avoid:
- Rockbiter as a DPS imbue (blocks Windfury, adds threat) [[d:shaman#1493233571391864983]]
- Fast weapons; slower is always better [[d:shaman#1469420065966264392]]
- Agility over Strength [[d:shaman#1461356189739778211]]
- Building around the T2 5-piece (eats Stormstrike charges) [[d:shaman#1482368324456284210]]
- Old Lightning Strike macros casting rank 1 after 1.18.1 [[d:shaman#1484940392347734207]]
- Expecting own Windfury Totem to buff you with an imbue on [[d:shaman#1476947395794436319]]
- Frostbrand on bosses [[d:shaman#1481227004442443927]]
- Spellhance in MC/BWL [[d:shaman#1482286791753994342]]
