play_loop:
  opener:
  - Windfury Weapon, Lightning Shield, totems Strength of Earth / Windfury / Flametongue / Mana Spring
  - Wait for tank lead
  - First white swing lands, then Stormstrike
  - Flame Shock if target lives > 9 s and not fire-immune
  single_target:
  - Stormstrike if ready
  - Lightning Strike (Rank 3) if ready
  - 'Shock if ready: Flame Shock -> Earth Shock -> Earth Shock, Stormstrike before Earth Shock'
  - Auto-attack
  - Lightning Shield (Water Shield when mana short or on trash)
  aoe:
    targets_min: 3
    loop:
    - Fire Nova Totem
    - Chain Lightning on Clearcasting
    - Fire Nova again while Chain Lightning is on cooldown
    - Magma Totem only if mana allows
    - Single-target loop on the kill target in between
  cooldowns:
  - Bloodlust once your AP procs are up, with Blood Fury / Berserking, haste potions, on-use
    trinkets
  threat:
  - Calming Winds 3/3
  - Salvation + Tranquil Air Totem
  - 'Near threat ceiling: Frost Shock or Flame Shock instead of Earth Shock'
