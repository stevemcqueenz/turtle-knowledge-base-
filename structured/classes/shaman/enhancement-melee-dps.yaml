stat_priority:
- weapon-skill
- hit
- crit
- strength
- agility
- haste
- stamina
stat_priority_note: Consensus order. Weapon skill has a hard cap of 315 on Turtle (raised from 308) and the racial bonus is
  +3, not +5. The melee hit cap is 8%, not 9% — the hidden 1% from vanilla was removed — of which talents give 3% and the
  weapon-skill book 1%. Crit to about 30–35% keeps Flurry and Clearcasting up; past that Strength (2.3 AP per point, and it
  scales with talents and buffs) beats Agility (~1.13 AP, plus 1% crit and 1% dodge per 20). Stamina outranks Intellect, Spirit
  and mp5 — "Pretend mp5 doesnt exist" [Atreidon p=147011] — except for levelers, where Lightning Strike's mana cost still
  bites.

