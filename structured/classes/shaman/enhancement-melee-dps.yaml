agreement: contested
patch_validity:
  written_for: "1.17.2 (Class Changes 2) and 1.18.0 (live 2025-08-15)"
  valid_for_1181: unknown
  notes: "1.18.1 changed Windfury Weapon (25% per hit), Flurry (any crit, 3 swings, reworked trigger), Elemental Weapons' Windfury/Flametongue effects, and the Lightning Strike Water Shield ratio to 18:1; no talent points moved. No source posts an updated build or rotation after 2026-03-20, and post-release bug reports (Flurry not triggering correctly, overwritten by Elemental Weapons' haste) were still open on 2026-04-07."
