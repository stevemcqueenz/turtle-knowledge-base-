  leveling_order_source: "Skegg's leveling guide (p=149715), consensus with Akos1896. The guide spends points in brackets, so each level cell is the bracket the guide gives, not a per-talent level."
stat_weights:
  note: "No source gives an explicit DPS stat-weight list; see enhancement-tank.yaml's Turtle mechanics table for the underlying formulas (Rockbiter/Windfury/Lightning Strike scale with AP; Flametongue/fire totems scale with SP)."
  hit: "consensus priority stat toward the physical/spell hit caps (values not stated for pure DPS; tank guide gives 8% physical / 17% spell at 63)"
  agility: "crit and armor; feeds Elemental Focus proc rate"
  attack_power: "primary threat/damage stat via Rockbiter/Windfury/Lightning Strike"
stat_priority: [weapon-skill-to-315, hit-to-8-percent, crit-to-30-35-percent, strength, haste, stamina]
stat_priority_note: "Consensus order. Weapon skill has a hard cap of 315 on Turtle (raised from 308) and the racial bonus is +3, not +5. The melee hit cap is 8%, not 9% — the hidden 1% from vanilla was removed — of which talents give 3% and the weapon-skill book 1%. Crit to about 30–35% keeps Flurry and Clearcasting up; past that Strength (2.3 AP per point, and it scales with talents and buffs) beats Agility (~1.13 AP, plus 1% crit and 1% dodge per 20). Stamina outranks Intellect, Spirit and mp5 — \"pretend mp5 doesnt exist\" — except for levelers, where Lightning Strike's mana cost still bites."
caps:
  physical_hit: "8% (vanilla-baseline figure reused from the tank guide, not DPS-specific)"
  spell_hit: "17% (boss level 63)"
rotation_single:
  - {priority: 1, action: "Pre-pull: Windfury Weapon on the 2H, Lightning Shield (9 charges with Stable Shields), totems down (Strength of Earth, Windfury, Flametongue, Mana Spring)", condition: "before pull; do not pre-Bloodlust (30-s self buff)"}
  - {priority: 2, action: "Flame Shock", condition: "running in, if the target will live > 9-15 s (always at least 3 ticks at max level); otherwise Earth Shock if target is Nature-immune"}
  - {priority: 3, action: "Stormstrike", condition: "on cooldown (8 s); grants a 2-charge +25% Nature buff consumed by Earth Shock and Lightning Shield charges"}
  - {priority: 4, action: "Lightning Strike", condition: "on cooldown (9 s) with Lightning Shield up"}
  - {priority: 5, action: "Earth Shock", condition: "shock on cooldown (6 s, 5 s with Reverberation 3/3) while the Stormstrike buff is up; re-apply Flame Shock instead when it has < 3 s left or has dropped"}
  - {priority: 6, action: "Never hold Stormstrike/Lightning Strike waiting for a Windfury window", condition: "always -- delaying costs ~0.2 auto-attacks worth of damage per Atreidon's math"}
  - {priority: 7, action: "Re-cast Lightning Shield when charges run out; swap to Water Shield when mana is the constraint for the rest of the fight", condition: "resource management"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Keep the single-target loop on the kill target; no spread rotation given for DPS", condition: "2-3 targets"}
  - {targets_min: 2, priority: 2, action: "Chain Lightning", condition: "worth considering even as melee, but costs a 2.5-s cast and 490 mana"}
  - {targets_min: 4, priority: 1, action: "Run in, drop Fire Nova Totem (413-459 base, +30% Fire with Elemental Weapons Flametongue after a melee hit)", condition: "on pack arrival"}
  - {targets_min: 4, priority: 2, action: "Follow with Magma Totem (650 mana) and Chain Lightning", condition: "sustained AoE"}
  - {targets_min: 4, priority: 3, action: "Totemic Recall after the pack", condition: "25% refund per totem, +15% with Totemic Mastery"}
aoe_threshold: 4
cooldowns:
  - {name: Bloodlust, use_when: "300-s CD; use at the start of a boss fight once Flame Shock/Stormstrike are up, and again on cooldown; +20% self haste 30 s, melee crits give party +8% for 6 s"}
  - {name: "Feral Spirit (Orc racial)", use_when: "5-min CD; wolves scale with the shaman's damage, no longer with AP since CC2"}
  - {name: "Blood Fury (Orc racial)", use_when: "AP/SP cooldown, -25% healing taken 25 s"}
resource_rules:
  - "Chug mana pots/tea on cooldown to sustain Lightning Shield longer; swap to Water Shield when low on mana"
  - "Mana consumption drops in raids, especially with ferals around, Blessing of Kings, Mark of the Wild"
  - "Water Shield + Lightning Strike is net mana-positive above 936 AP (18:1 ratio, written for tanks but applies to DPS with Water Shield)"
  - "Drink between pulls in dungeons when below the mana for one full pack; in raids use Nordanaar Herbal Tea and Major Mana Potions on cooldown"
consumables:
  - "Elixir of the Mongoose, R.O.I.D.S., Juju Power, Dreamshard Elixir, Greater Arcane Elixir, Nordanaar Herbal Tea (starter)"
  - "Concoction of the Emerald Mongoose, Concoction of the Arcane Giant, Concoction of the Dreamwater, Elixir of Greater Nature Power, Elixir of Greater Firepower, Flask of the Titans/Supreme Power, Spirit/Swiftness of Zanza, Mageblood, Elixir of Superior Defense, Danonzo's Tel'Abim Medley, Rumsey Rum Black Label / Medivh's Merlot, Juju Flurry, Major Mana Potion, Goblin Sapper Charge, Potion of Quickness (full raid list)"
  - "Elixir of Brute Force, Power Mushroom, Juju Ember (Enhancement-specific additions)"
mistakes_to_avoid:
  - "Using Rockbiter or Earth Shock spam as DPS without Blessing of Salvation (threat)"
  - "Holding Stormstrike/Lightning Strike for a Windfury window"
  - "Flame Shock on targets that die in under 9 seconds"
  - "Wearing 8/8 T3 for set bonuses while overcapping hit"
  - "Expecting Windfury Totem to buff yourself while an imbue is active (it does not); dropping it for the party anyway"
  - "Frostbrand on bosses (immune to Frost Shock's slow, so no guaranteed crits)"
  - "Popping Bloodlust before Flame Shock/Stormstrike are set up or before you have crit to feed its party effect"
  - "Chasing mp5/Int/Spirit gear instead of AP/hit/crit"
  - "Dropping every totem every pull while soloing"
  - "Assuming Flurry works from white-hit crits post-1.18.1, or that it is not overwritten by Elemental Weapons' Windfury haste (both reported bugged as of 2026-04-07)"
