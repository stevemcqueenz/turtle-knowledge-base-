      sources: ["[[d:shaman#1486024479951032474]]", "[[d:shaman#1486721868789584004]]", "[[d:shaman#1457756350342758472]]", "[[d:shaman#1485707818081194104]]", "[[d:shaman#1486136709375725759]]"]
