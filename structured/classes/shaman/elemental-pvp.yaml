stat_weights:
  priority: Stamina, then Agility+Strength+Stamina over crit/AP; mail + shield vs physical; defense/dodge irrelevant [[d:shaman#1466120093347086544]]
  crit: for Windfury builds, enough that 2 melee hits crit per window [[d:shaman#1492241005557317773]]
caps:
  physical_hit: 5% vs level 60 [[d:shaman#1448038818618937436]]
  spell_hit: 3% [[d:shaman#1448038818618937436]]
rotation_single:
- priority: 1
  action: Shock -> 2 totems -> auto -> strike burst
  condition: Enhancement opener [[d:pvp-general#1425207495894499328]]
- priority: 2
  action: Earth Shock (interrupt) -> Hex -> Earth Shock
  condition: Troll, lock out a healer [[d:shaman#1418338864245903492]]
- priority: 3
  action: Frost Shock + Earthbind, Fire Nova + Searing, Stormstrike-buffed Earth Shock
  condition: kite melee as caster [[d:shaman#1449322892763598910]]
- priority: 4
  action: Flame Shock on rogues/cats
  condition: prevent re-stealth [[d:shaman#1425663325747806269]]
- priority: 5
  action: Grounding Totem
  condition: vs casters (not rogue abilities) [[d:shaman#1425240856520294421]]
rotation_aoe:
- targets_min: 3
  priority: 1
  action: Chain Heal a stacked team from a safe spot
  condition: large BG fights as healer [[d:shaman#1470854282017505365]]
aoe_threshold: 3
cooldowns:
- name: Grounding Totem
  use_when: 20-s CD; breaks on the first CC it eats since 1.18.0 -- use strategically, do not waste it
- name: Ancestral Swiftness (Ele/Resto)
  use_when: instant max-rank heal, or a -25% instant Chain Lightning
- name: Ghost Wolf
  use_when: disengage/kite when melee is unwinnable
resource_rules:
- Free-action / invulnerability potions are near-mandatory [[d:shaman#1445315487784243322]]
- Open in Ghost Wolf vs rogues [[d:shaman#1470853297660366872]]
consumables:
- Free Action Potion, Limited Invulnerability Potion [[d:shaman#1445315487784243322]]
mistakes_to_avoid:
- Playing PvE-style 2H Windfury Enhancement [[d:shaman#1492232263952236777]]
- Crusader instead of Weapon Chain vs warriors [[d:pvp-general#1432642117917736961]]
- Relying on Poison Cleansing Totem vs Blind [[d:shaman#1440024319504683029]]
