  written_for: pre-1.18.0 Electrify era (2024-10 .. 2025-08) and the 1.18.0 Elemental Mastery/Ancestral Swiftness rework
  valid_for_1181: false
  notes: 'No source describes Elemental PvP after 2026-03-20: 1.18.1 added per-class-spec PvP dampening (Shaman values not
    published), buffed Earthquake +15%/18-s CD, and turned Elemental Weapons'' Rockbiter into Earthen Bulwark specifically
    to stop non-Enhancement specs using it as a passive PvP defensive layer. Aluevera''s 31/17/0 build point count still roughly
    fits (Elemental Fury 2 pts replaced Electrify 1 pt; Reverberation 3 pts not 5), but the Electrify-specific steps in the
    rotation are obsolete since 2025-08-15. Discord adds the late-2025 meta builds (tanky shocker 22/29/0 or 23/28/0; the
    Resto PvP 13/17/21 spec) and the per-matchup totem map in `discord:` below; still no post-2026-03-20 re-tested build.'
