  matchup_totems:
    era: pre-1.18.1
    agreement: single source (map) / consensus (rule)
    items:
    - key: warlock_priest
      value: Grounding + Tremor [[d:shaman#1135388704274403358]]
    - key: mage
      value: Grounding + Frost Resistance [[d:shaman#1135388704274403358]]
    - key: rogue
      value: Magma/Searing + Poison Cleansing [[d:shaman#1135388704274403358]]
    - key: reactive_rule
      value: Only Grounding/Tremor/Poison Cleansing are reactive in PvP; Earthbind is the main offensive snare; the rest are
        situational [[d:shaman#1135425193754513459]]
  matchups:
    era: pre-1.18.1
    agreement: contested
    items:
    - vs: warrior
      claim: Shaman favoured; Frost Shock + Earthbind + Earth Shock every 5-6 s; Prot warrior is the one spec claimed to counter
        shaman
      agreement: consensus
      sources:
      - '[[d:pvp-general#1067844135320559616]]'
      - '[[d:pvp-general#1348015572792901652]]'
      - '[[d:pvp-general#1418626701457625119]]'
    - vs: rogue
      claim: 'Contested: shaman tools (Poison Cleansing, Frost Shock, shield/armour) bully rogues, but an equally geared rogue
        bursts a 6k-armour/4k-HP shaman in a cheap shot + kidney if the trinket is down'
      agreement: contested
      sources:
      - '[[d:shaman#1401123087209992254]]'
      - '[[d:pvp-general#1419603728960458762]]'
    - vs: mage
      claim: 'Losing/hard: Counterspell locks the shaman out of damage and healing (all Nature); Grounding absorbs one interrupt,
        no answer to Counterspell then Polymorph then nuke'
      agreement: consensus
      sources:
      - '[[d:pvp-general#1081905593008259082]]'
      - '[[d:pvp-general#1380182527783862413]]'
      - '[[d:shaman#1403451583622021192]]'
    - vs: warlock
      claim: 'Losing: Curse of Tongues hard-counters the kit; warlock + rogue are the two most cited shaman counters'
      agreement: consensus
      sources:
      - '[[d:pvp-general#1292034196495138889]]'
      - '[[d:pvp-general#1138134954014933022]]'
    - vs: hunter
      claim: 'Contested: shaman says ranged hunter is its biggest weakness (kites forever); hunter says the shaman tanks the
        damage and Frost Shocks/Earthbinds into the deadzone'
      agreement: contested
      sources:
      - '[[d:pvp-general#1082820346035576913]]'
      - '[[d:pvp-general#1283223619547172884]]'
    - vs: priest
      claim: 'Shaman favoured: Purge strips Fortitude and PW:Shield, then burst; Shadow priest Silence is the ele counter'
      agreement: consensus
      sources:
      - '[[d:pvp-general#1366083256025485352]]'
      - '[[d:pvp-general#1420489854319464478]]'
    - vs: druid
      claim: Ele rated strong vs druids (druids carry Mark of the Wild nature res unless purged, so spell pen matters)
      agreement: single source
      sources:
      - '[[d:shaman#1341319733600976896]]'
    - vs: paladin
      claim: Shaman hard-counters paladin by design (spam Purge, kite, NS burst) at consensus; contested at the top end ('paladin
        is the strongest 1v1 class')
      agreement: contested
      sources:
      - '[[d:pvp-general#1112115354303475752]]'
      - '[[d:pvp-general#1371851334738907257]]'
      - '[[d:pvp-general#1340006892612616274]]'
  racials:
    era: pre-1.18.1
    agreement: contested
    items:
    - Tauren War Stomp is the best PvP utility and combos with an Iron Grenade for a 4-s stun; +5% HP and extra melee range
      [[d:shaman#1188211554357887036]].
    - Orc Hardiness is the anti-paladin/anti-engineering pick (paladin-heavy server); Blood Fury is a burst CD [[d:shaman#1246590462454796299]].
    - Troll Berserking + Hex (castable moving and while Nature-locked) is called 'best Shaman racial for PvP' by some [[d:shaman#1404506212363665439]];
      race ranking is contested.
  engineering_consumables:
    era: pre-1.18.1
    agreement: consensus
    items:
    - Engineering is the only profession giving player power; grenades fix the no-hard-CC problem (Gnomish net / HFQ net),
      plus Insignia, Rocket Helm, Magic Dust, Shard of Nightmare, Hyjal Pipe, Tidal Charm, Nifty Stopwatch; FAPs/LIPs are
      decisive [[d:shaman#1277660705008386109]], [[d:shaman#1280180094823825481]], [[d:shaman#1406779021345423465]].
  gear_stats:
    era: mixed
    agreement: consensus; resilience reaction initial
    items:
    - High-armour shield + T2.5/T3 is the core; never PvP with a staff. Stack stamina and wear mail (5-5.2k HP, ~60% armour
      reported on PvP kits) [[d:shaman#1277548797144334359]], [[d:shaman#1319237466409926738]].
    - Spell penetration is high value vs nature-resist gear (~20 resistance -> +5.2% damage, ~75 SP equivalent); Don Rodrigo's
      Band named [[d:shaman#1282723201184432140]].
    - 8/8 T3 shock buff (20% shock damage) is what makes ele infamous in PvP pre-1.18.1 [[d:shaman#1359859058848432269]].
    - Post-1.18.1 PvP gear adds resilience (crit-damage reduction ~-3%/piece) and players say it 'solves' the burst problem
      in full PvP gear -- 'in full PvP gear you basically just take normal hits' and NS 75% x dampening 0.8 = 60% [[d:shaman#1491924441113038908]],
      [[d:shaman#1491921578483646464]], [[d:shaman#1467127442731958463]].
    - 'Resto PvP gear gap: ranking mail is ''either physical or spell dmg, not a healing variant'' and there is little mail
      healing gear [[d:shaman#1420649996801544302]], [[d:shaman#1423644142906507320]].'
  standing:
    era: mixed
    agreement: contested
    items:
    - 'Ele PvP is contested in the extreme: ''top 2 pvp spec'' [[d:shaman#1373661275296632934]] vs ''losing ~80% of 1v1s''
      [[d:shaman#1054026335502221322]] and ''really meh ... no spell pushback resistance'' [[d:shaman#1454796130146586747]].'
    - Resto PvP is mostly negative ('Full resto is even the worst healer' [[d:shaman#920766236185493524]], 'Why PVP as resto?'
      [[d:shaman#1405903764476657758]]) with one positive 2023 support claim [[d:shaman#1155156739201699981]] and the 13/17/21
      post-1.18.1 spec; net contested.
    - 'Enh minority defence: a defensive attrition enh with Grounding/Purge/6-s Earth Shock, 5% hit cap and a shield is rated
      well [[d:shaman#1204951203620986921]]; pvp-general''s mtnd puts ''Autist Sham enhanc'' / ''Sham Hybrid'' at S for pug
      PvP [[d:pvp-general#1353324094954934314]].'
    - Post-1.18.1 shaman is reported weaker than vanilla in PvP (nerfed NS, EM gone, purge/grounding CDs) while shield/healer
      builds are called overtuned [[d:shaman#1485287084997607424]], [[d:shaman#1494663845619437609]], [[d:shaman#1494616234996531281]].
  patch_1181:
