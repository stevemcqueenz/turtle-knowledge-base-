  scope: "Shaman PvP additions from the archived #shaman Discord and cross-reads of #pvp-general (2021-02-15 -> 2026-05). Every claim carries a [[d:shaman#<id>]] or [[d:pvp-general#<id>]] citation, an era (pre-1.18.1 | 1.18.1-announced-pre-release | post-1.18.1) and agreement (consensus | single source | contested)."
  builds:
