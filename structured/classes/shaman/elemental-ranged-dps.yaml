  rotation_single:
  - action: Flame Shock on the boss, then Molten Blast to renew it before it expires, Lightning Bolt filler with Chain Lightning
      on cooldown (or on Clearcasting at low gear).
    condition: post-1.18.1 consensus
    sources:
    - '[[d:shaman#1485686024334999692]]'
    - '[[d:shaman#1485686440070479892]]'
    era: post-1.18.1
