    era: post-1.18.1
    agreement: consensus
  - action: Run in, drop Fire Nova Totem then Magma Totem; Earthquake only for hard or unreachable packs (and only once the
      two-hit bug is fixed). Fire Nova is preferred over Magma for up-front damage.
    targets_min: 4
    sources:
    - '[[d:shaman#1486561660150747156]]'
    - '[[d:shaman#1485321778967613593]]'
    - '[[d:shaman#1484634982600409128]]'
    era: post-1.18.1
    agreement: consensus
  - action: Fire totems and Molten Blast become comfortable from BWL onward, once fire-immune raid mobs are gone.
    targets_min: 1
    sources:
    - '[[d:shaman#1484650140437450814]]'
    era: post-1.18.1
    agreement: single source
  stat_weights:
    spell_hit: best per point until capped; the sheet soft cap is ~12-13% because Elemental Devastation's 3% is hidden, '~7%
      with buffs' per the channel; overcapping is not mandatory (take the better-stat piece).
    spell_crit: 1 spell crit ~= 9-12 spellpower; 1% spell hit ~= 1.5% spell crit.
    haste: roughly equal to spell crit until the ~17% single-target softcap.
    turning_point: after ~12-13% hit and ~500 spellpower, crit turns up in value.
    budget: pre-raid budget line '1 spell hit / 1 spell crit / 9 sp'.
    sources:
    - '[[d:shaman#1458549208826122527]]'
    - '[[d:shaman#1458549320616902818]]'
