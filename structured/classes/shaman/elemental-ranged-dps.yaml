agreement: contested
patch_validity:
  written_for: "1.18.0 rework (Electrify -> Elemental Fury, Earthquake, Molten Blast; live 2025-08-15)"
  valid_for_1181: false
  notes: "1.18.1 added Call of Earth, buffed Earthquake base damage +15% and CD to 18 s, made Elemental Weapons' Flametongue conditional on a melee hit (deliberately weakening the Fire-Elemental playstyle), and added a relic-swap GCD. Players report Earthquake broken/underperforming (only 2 hits, no Elemental Fury bonus on the second) through 2026-04-07 with no staff confirmation of a nerf beyond 'fixed multiple issues'. No post-1.18.1 build or rotation update exists; treat rotation/stat priority as pre-1.18.1 with the flagged deltas applied."
talents:
  build_name: "Named core Elemental build (consensus; no full point-by-point 60 build posted in text)"
  build_link: null
  points:
    - {tree: Elemental, talent: Convection, rank: 5, spell_id: null}
    - {tree: Elemental, talent: Concussion, rank: 5, spell_id: null}
    - {tree: Elemental, talent: "Elemental Devastation", rank: 3, spell_id: null}
    - {tree: Elemental, talent: "Elemental Focus", rank: 1, spell_id: null}
    - {tree: Elemental, talent: "Call of Thunder", rank: 5, spell_id: null}
    - {tree: Elemental, talent: Reverberation, rank: 3, spell_id: null}
    - {tree: Elemental, talent: "Call of Flame", rank: 3, spell_id: null}
    - {tree: Elemental, talent: "Improved Fire Totems", rank: 2, spell_id: null}
    - {tree: Elemental, talent: "Improved Molten Blast", rank: 2, spell_id: null}
    - {tree: Elemental, talent: "Elemental Fury", rank: 2, spell_id: null}
    - {tree: Elemental, talent: "Elemental Mastery", rank: 1, spell_id: null}
    - {tree: Elemental, talent: "Lightning Mastery", rank: 5, spell_id: null}
    - {tree: Elemental, talent: Earthquake, rank: 1, spell_id: null}
    - {tree: Enhancement, talent: "Ancestral Knowledge", rank: 5, spell_id: null}
    - {tree: Enhancement, talent: "Thundering Strikes / Stable Shields", rank: 0, spell_id: null, note: "filler points, as reachable"}
  leveling_order: []
stat_weights:
  spell_hit: "15-17% (Skegg: hit > crit > spd > int); Elemental Devastation gives 3%, T3 4-set +3% overcaps: full T3 6% + 3% set bonus + Elemental Devastation = 12% without jewelry (Atreidon)"
  crit: "mana engine via Elemental Focus/Clearcasting; prioritized over haste at low crit"
  haste: "capped near 17% for single target (Lightning Mastery interaction); more haste only pushes Lightning Bolt faster than the GCD (Atreidon)"
  spell_power_intellect: "as much as possible after hit; ~4k mana pool recommended fresh 60"
  attack_power: "small but real for the Flame Shock DoT tick (~0.012 dps per AP, 0.02 if snapshotted)"
  spell_penetration: "matters against Nature-resistant bosses until Lower Karazhan enchants or a Thunderfury tank are available (single source)"
caps:
  spell_hit: "15-17% (boss level 63)"
  haste_softcap: "~17% for single target (Atreidon)"
rotation_single:
  - {priority: 1, action: "Pre-pull: Strength of Earth/Windfury/Flametongue for the melee group, Mana Spring, Searing Totem on the boss, Water Shield (mana) or Earth Shield (pushback, boosted by Call of Earth in 1.18.1), Brilliant Wizard Oil", condition: "before pull"}
  - {priority: 2, action: "Flame Shock, snapshotted with trinkets/Elemental Mastery/procs", condition: "opener; lasts 15 s (+6 s with T2 3-set); reapplying early loses the snapshot"}
  - {priority: 3, action: "Lightning Bolt filler, Chain Lightning on cooldown when mana allows (3-4 LB per CL depending on haste)", condition: "single-target filler; CL is marginal single-target without the T2.5 5-set"}
  - {priority: 4, action: "Molten Blast when Flame Shock has <= 3 s left", condition: "refresh the DoT just before it expires; refreshing early is a DPS loss; skip entirely with 5/5 T3.5 (it does not refresh the set bonus)"}
  - {priority: 5, action: "Earthquake on cooldown", condition: "only if it will not delay the T3.5 haste buff and the target will live > 4 s; post-1.18.1 sources call it worse than a Lightning Bolt"}
  - {priority: 6, action: "Elemental Mastery on cooldown (3-min CD, 10-s +15% dmg / -20% mana)", condition: "align with the Flame Shock snapshot and the T3.5 haste proc"}
  - {priority: 7, action: "Earth Shock (20 yd) or Flame Shock (30 yd with Call of Flame) while moving", condition: "movement-heavy fights"}
  - {priority: 8, action: "Molten Blast spam + Flame Shock + Searing/Magma", condition: "Nature-immune targets (Dragons of Nightmare, Chromaggus/Incantagos)"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Chain Lightning on cooldown (3 targets, -30% per bounce, +1 target with T2.5 5-set)", condition: "2-3 targets"}
  - {targets_min: 2, priority: 2, action: "Flame Shock on the longest-lived target, Lightning Bolt filler", condition: "2-3 targets"}
  - {targets_min: 4, priority: 1, action: "Run in and drop Fire Nova Totem, then Magma Totem", condition: "4+ targets, melee range reachable"}
  - {targets_min: 4, priority: 2, action: "Earthquake for hard packs or unreachable packs", condition: "primary target must not die early, leave the pack, or resist (0 damage on resist)"}
aoe_threshold: 4
cooldowns:
  - {name: "Elemental Mastery", use_when: "3-min CD, on cooldown, aligned with Flame Shock snapshot / T3.5 haste window"}
  - {name: "Ancestral Swiftness (if Resto points taken)", use_when: "emergency instant heal, or an instant Chain Lightning at -25% damage (mostly PvP)"}
resource_rules:
  - "Water Shield by default; Mana Spring, potions and tea sustain even long fights without Water Shield once geared"
  - "Being oom after a fight is not an issue; being oom in a fight is (Atreidon)"
  - "In low gear, use a lot of potions and tea; expect to drink heavily while leveling"
  - "Drink after every pack in dungeons"
consumables:
  - "Major Healing Potion / Potion of Quickness, Flask of Supreme Power, Elixir of Greater Nature Power, Greater Firepower, Greater Arcane Elixir, Dreamshard Elixir, Dreamtonic, Elixir of the Sage, Danonzo's Tel'Abim Delight, Spirit of Zanza, Cerebral Cortex Compound, Juju Ember, Juju Flurry, Rumsey Rum/Medivh's Merlot Blue, Whipper Root Tuber, Brilliant Wizard Oil"
  - "Nordanaar Herbal Tea + Major Mana Potion on cooldown"
mistakes_to_avoid:
  - "Letting Flame Shock drop and reapplying an unsnapshotted DoT, or refreshing it early with Molten Blast"
  - "Casting Earthquake on a target that will die or move, or at all in most 1.18.1 AoE situations"
  - "Spamming Chain Lightning in bad gear and going oom mid-fight"
  - "Overcapping hit (8/8 T3 + Elemental Devastation) or overcapping haste past ~17% with T3.5"
  - "Using Searing Totem near CC or patrols"
  - "Relying on the old Eye of the Storm instead of Earth Shield / Call of Earth on pushback-heavy fights"
  - "Playing Fire Elemental into MC/Onyxia/BWL fire-immune or fire-resistant bosses"
  - "Casting Molten Blast while wearing 5/5 T3.5 (it does not refresh the set bonus)"
  - "Casting from outside 20 yd on movement fights so no shock is available"
  - "Expecting Windfury/Flametongue totems to buff yourself -- they buff the party only"
