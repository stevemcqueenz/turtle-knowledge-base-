      by the channel's Elemental reference.
    condition: Nature Elemental
    sources:
    - '[[d:shaman#1484651546926121022]]'
    - '[[d:shaman#1484602583149580349]]'
    era: post-1.18.1
    agreement: consensus
  - action: 'Do NOT cast Earthquake single-target post-1.18.1: it hits only twice, its AoE portion crits at 1.5x (ignoring
      Elemental Fury) and it is less DPS than a Lightning Bolt. The 1.18.0 ''EQ on cooldown even single-target'' advice is
      superseded.'
    condition: post-1.18.1
