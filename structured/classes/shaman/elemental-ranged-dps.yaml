stat_priority:
- spell-hit
- spell-crit
- haste
- spell-power
- intellect
stat_priority_note: 'Consensus order (Skegg''s "hit > crit > spd > int", with haste placed by Atreidon): spell hit to 15–17%
  against a level-63 boss — Elemental Devastation gives 3% and the T3 four-set another 3%, which can overcap — then crit,
  which is the mana engine, then haste up to a hard 17% (past that Lightning Bolt is faster than the global cooldown and the
  extra haste does nothing), then spell power and Intellect.'
