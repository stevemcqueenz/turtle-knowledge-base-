patch_validity:
  written_for: 1.18.0 rework (Electrify -> Elemental Fury, Earthquake, Molten Blast; live 2025-08-15)
  valid_for_1181: false
  notes: '1.18.1 added Call of Earth, buffed Earthquake base damage +15% and CD to 18 s, made Elemental Weapons'' Flametongue
    conditional on a melee hit (deliberately weakening the Fire-Elemental playstyle), and added a relic-swap GCD. Players
    report Earthquake broken/underperforming (only 2 hits, no Elemental Fury bonus on the second) through 2026-04-07 with
    no staff confirmation of a nerf beyond ''fixed multiple issues''. The forum file''s ''no post-1.18.1 build or rotation
    update'' is closed by Discord: the post-1.18.1 34/3/14 build and the cleaned rotation are in `discord:` below ([[d:shaman#1488646101081788556]],
    [[d:shaman#1485686440070479892]]). Earthquake is removed from the single-target rotation post-1.18.1.'
