stat_weights:
  priority: spell hit to 16% total (12% gear) > crit (mana via Clearcasting) > spell power > haste; spell pen to 15 without
    Thunderfury
  relative: hit ~15 SP, crit ~10 SP, haste ~8 SP [[d:shaman#1481698281204482068]]
  crit_vs_hit: past ~12-13% hit and ~500 SP crit becomes more valuable [[d:shaman#1480349166218510400]]
  spell_penetration: 15 = biggest stat gain, nothing after 15 [[d:shaman#1452198375448645742]]
  spirit: dead [[d:shaman#1434512577865715814]]
caps:
  spell_hit: '16% total vs level 63: 3% talent + 1% Emerald Blessing + 12% gear [[d:shaman#1486439926412087380]]; 11-14% fine
    in MC/BWL gear [[d:shaman#1452197667781345322]]'
  spell_penetration: 15 (boss Nature resistance) [[d:shaman#1452198375448645742]]
rotation_single:
- priority: 1
  action: Searing Totem (Flametongue Totem in a melee group); other totems
  condition: before pull
- priority: 2
  action: Elemental Mastery / trinkets, then Flame Shock
  condition: target not fire-immune; Flame Shock snapshots [[d:shaman#1420830381762154628]]
- priority: 3
  action: Molten Blast
  condition: Flame Shock about to expire (~every 10-12 s); refreshes to full [[d:shaman#1482850420484210790]] [[d:shaman#1492517323838460035]]
- priority: 4
  action: Chain Lightning
  condition: Clearcasting up, or on cooldown when mana allows [[d:shaman#1484941909620428922]]
- priority: 5
  action: Lightning Bolt
  condition: filler [[d:shaman#1485686440070479892]]
- priority: 6
  action: Earthquake
  condition: only with 2+ targets while bugged (DPS-neutral single target) [[d:shaman#1490703968576471180]]
- priority: 7
  action: Earth Shock
  condition: moving, interrupt, or target about to die; never as filler [[d:shaman#1459503774186999850]]
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Earthquake and Chain Lightning on cooldown, Lightning Bolt filler
  condition: 2+ targets
- targets_min: 2
  priority: 2
  action: Flame Shock several targets and refresh with Molten Blast
  condition: cleave [[d:shaman#1438195226631082028]]
- targets_min: 4
  priority: 3
  action: Fire Nova Totem when Earthquake and Chain Lightning are on cooldown
  condition: big packs [[d:shaman#1444776794799734784]]
- targets_min: 4
  priority: 4
  action: Oil of Immolation
  condition: double pulls [[d:shaman#1489306615118172341]]
aoe_threshold: 2
cooldowns:
- name: Elemental Mastery
  use_when: right before a fresh Flame Shock (snapshot); weak otherwise [[d:shaman#1485731517710860439]]
- name: Blood Fury (Orc)
  use_when: with Elemental Mastery; beats Berserking [[d:shaman#1471895235184295960]]
resource_rules:
- Tea or mana potion every boss pull while gearing [[d:shaman#1469228322410991740]]
- Avoid downranking; gear for Clearcasting [[d:shaman#1485333169057042605]]; downrank if mana % < boss HP % [[d:shaman#1471574271343067246]]
- No Chain Lightning without Clearcasting when mana is tight [[d:shaman#1484941909620428922]]
consumables:
- Mana potions, Nordanaar/Hyjal tea, Dreamshard Elixir, crit oils, Dark/Demonic Rune [[d:shaman#1484941909620428922]]
- Concoctions + Greater Firepower + Greater Nature Power + Flask of Supreme Power all stack [[d:shaman#1456029276452421683]]
- Weapon oil instead of Flametongue [[d:shaman#1470506986113077521]]
mistakes_to_avoid:
- Old Molten Blast spam spec [[d:shaman#1485240088047652894]]
- Flametongue Weapon as a caster [[d:shaman#1470506986113077521]]
- Chasing 16% hit in MC/BWL gear [[d:shaman#1452149363148062811]]
- Shock filler [[d:shaman#1459503774186999850]]
- Earthquake single target while bugged [[d:shaman#1485686440070479892]]
- Elemental Mastery after Flame Shock [[d:shaman#1420830381762154628]]
