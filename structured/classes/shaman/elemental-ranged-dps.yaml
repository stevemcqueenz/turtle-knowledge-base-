    - "Improved Stoneskin can beat Elemental Weapons on big AoE pulls [[d:shaman#1484956039773294762]]."
    - "Elemental BiS relic note: a blue BoE is still the pick post-1.18.1; Totem of the Storm or Totem of Rage over Eruption/Crackling Thunder [[d:shaman#1484917277215293541]], [[d:shaman#1490691308283494580]], [[d:shaman#1488268003257749585]]."
