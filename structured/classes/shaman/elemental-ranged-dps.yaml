    - '[[d:shaman#1473908078352138292]]'
    era: mixed
    agreement: consensus (equivalences single source)
  caps:
    spell_hit_hard: 16-17% (boss level 63)
    spell_hit_soft: ~12-13% sheet / ~7% with Elemental Devastation buffs; the opener does not benefit from the buff.
    sources:
    - '[[d:shaman#1487834054907920385]]'
    - '[[d:shaman#1486434725848416427]]'
    - '[[d:shaman#1487877670871236749]]'
  cooldowns:
  - name: Elemental Mastery
    use: 10 s +15% damage / -20% mana, 3-min CD; the community calls it weak (part of the Elemental standing complaints).
    sources:
    - '[[d:shaman#1491951590968525032]]'
    - '[[d:shaman#1485239761512697936]]'
    era: post-1.18.1
    agreement: consensus
  totems:
  - Fire totems inherit the shaman's spell hit/crit and scale with spell power; Searing Totem requires standing within ~30
    yd of the boss (also needed for Flame Shock), and Molten Blast re-targets it [[d:shaman#1485260337539317860]], [[d:shaman#1437407581181186079]].
  - Windfury / Flametongue Totems buff the party only, never the shaman [[d:shaman#1494624498870386748]].
