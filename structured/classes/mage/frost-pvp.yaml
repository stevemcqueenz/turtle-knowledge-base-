  - '[[d:mage#1446911998725193920]]'
caps:
  spell_hit_vs_players: ~3% [[d:mage#1446911998725193920]]
rotation_single:
- priority: 1
  action: Polymorph -> Frost Nova -> max-range Frostbolt
  condition: opener; Polymorph heals to full
  sources:
  - '[[d:mage#1444727256906731660]]'
  - '[[d:mage#1444727016837615803]]'
- priority: 2
  action: Rank-1 Frostbolt to slow and open distance
  condition: target closing
  sources:
  - '[[d:mage#1444727606204305489]]'
- priority: 3
  action: Cone of Cold / Sheep / Counterspell, then Arcane Missiles
  condition: control rotation, not Frostbolt turret
  sources:
  - '[[d:mage#1491494895574323224]]'
  - '[[d:mage#1446908256739131462]]'
- priority: 4
  action: Blink, Ice Block, Cold Snap
  condition: reset
  sources:
  - '[[d:mage#1491494895574323224]]'
rotation_aoe:
- targets_min: 3
  priority: 1
  action: Frost Nova -> Cone of Cold -> Arcane Explosion
  condition: melee group on you
aoe_threshold: 3
cooldowns:
- name: Improved Counterspell
  use_when: shaman/priest/paladin heal or key cast; win condition vs shaman
  sources:
