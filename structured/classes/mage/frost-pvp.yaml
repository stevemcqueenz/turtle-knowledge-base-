agreement: contested
patch_validity:
  written_for: "mixed 2023-2026 opinion threads; Shatter 35% since 1.17.2; Flash Freeze not from temporary immunities since 2025-04-01"
  valid_for_1181: unknown
  notes: "1.18.1 makes PvP dampening class/spec-dependent with unpublished numbers; Ice Barrier grants +10% Frost on cast. Pre-1.17.2 statements assume Shatter 50% and a 65% Blizzard slow. No talent allocation exists in any source."
talents:
  build_name: "none — gap (only opaque talents.turtlecraft.gg exports: Xudo p103310 'Blast Wave PvP', Forumdweller p131096 Arcane/Frost)"
  points: []
  leveling_order: []
stat_weights:
  priority: "not documented for PvP (Perkamov's question unanswered); spell penetration 'useful for PvP' (Mackylol); mages sit at ~3k HP in PvP gear"
caps:
  blink_cooldown_s: "15 (10-12 with PvP set per Springboards)"
  improved_counterspell_silence_s: 4
  greater_fire_protection_potion_absorb: 2600
rotation_single:
  - {priority: 1, action: "Freeze (Frost Nova / Frostbite) -> max-rank Frostbolt shatter crit", condition: "target frozen; Shatter +35%; rank-switch macro casts rank 10 on a frozen target, rank 1 otherwise"}
  - {priority: 2, action: "Rank-1 Frostbolt", condition: "cheap slow spam / peeling ('most op part about frost')"}
  - {priority: 3, action: "Cone of Cold", condition: "melee in range, Nova on cooldown"}
  - {priority: 4, action: "Polymorph / Counterspell (Improved: 4 s silence)", condition: "control; Counterspell macro skips Ice Block targets"}
  - {priority: 5, action: "Blink -> Ice Block -> Cold Snap -> Ice Block", condition: "escape chain; Blink only from low height"}
  - {priority: 6, action: "Mana Shield", condition: "absorb while mana is spare; do not drain to zero"}
rotation_aoe:
  - {targets_min: 3, priority: 1, action: "Blink in -> Frost Nova -> Cone of Cold -> Arcane Explosion spam", condition: "clumped low-HP enemies ('kamikaze' pattern described by Manletow)"}
aoe_threshold: 3
cooldowns:
  - {name: Ice Block, use_when: "burst incoming; 'every mage is 2-block' with Cold Snap"}
  - {name: Cold Snap, use_when: "second Ice Block / Frost Nova / Ice Barrier"}
  - {name: Presence of Mind, use_when: "instant Frostbolt/Polymorph; 'can substitute ice block' (Forumdweller)"}
  - {name: Blink, use_when: "break stuns/roots, gap; not through doors (2025-12-24)"}
  - {name: Greater Fire Protection Potion, use_when: "vs Fire/PoM-Pyro mages; drinkable up to 1 h early, 2 min CD"}
resource_rules:
  - "Mana Shield is the second health bar; Improved Mana Shield 13/25% less mana per damage."
  - "Icicles is not a PvP tool: roots you, no slow, 30% base HP shatter."
consumables:
  - "Greater Fire Protection Potion (2600 absorb)"
  - "Zanza potion (~3g)"
  - "Dismount / anti-polymorph consumables exist (Sharmaine)"
mistakes_to_avoid:
  - "Casting Icicles in PvP"
  - "Standing at mid range vs shamans/melee (Earth Shock range)"
  - "Blinking while high in the air (blinks in place)"
  - "Counterspelling a target in Ice Block"
  - "Draining Mana Shield to zero mana"

discord:
  channel: mage
  scope: "Frost PvP additions from the archived #mage Discord (post-1.18.1 sections). Every claim carries a [[d:mage#<id>]] citation, an era and agreement."
  patch_validity_extra: "Post-1.18.1 deep Frost is widely reported weak after the dampening changes and the Icicles nerf; mages still play Frost for control in team fights [[d:mage#1446952036661723289]], [[d:mage#1491498337088573571]], [[d:mage#1491543407754219811]] (post-1.18.1, consensus)."
  rotation_single:
    - action: "Frost is played for control, not turreting: use Cone of Cold, Polymorph, Counterspell, trinkets, Ice Block + Blink."
      sources: ["[[d:mage#1491494895574323224]]"]
      era: post-1.18.1
      agreement: single source
    - action: "PoM + Ice Block ('PomBlock') remains the recommended annoying-BG build."
      sources: ["[[d:mage#1491779826992939130]]"]
      era: post-1.18.1
      agreement: single source
  stat_weights:
    priority: "crit > spell power > haste, plus solid stamina; at low levels stamina beats raw frost damage [[d:mage#1446156953347686441]], [[d:mage#1443285596842758205]] (post-1.18.1, single source)"
  caps:
    deep_frost_verdict: "no point playing deep Frost post-nerf; better to play deep Arcane with Ice Block [[d:mage#1446952036661723289]], [[d:mage#1491498337088573571]]"
    dampening_reports: "CoC 71 at 700 SP; 13-15 Frostbolts to kill a geared melee [[d:mage#1485311972139335833]], [[d:mage#1491110087388037304]]"
  consumables:
    - "Free Action Potion is the standard melee counter to mage [[d:mage#1446915765461581934]] (post-1.18.1, single source)."
  race_choice:
    - "Gnome Escape Artist [[d:mage#1043563538557448302]]; Undead Will of the Forsaken for fear fights [[d:mage#1493740921232031906]]; Orc/Troll for PvE damage [[d:mage#1447253910875017238]] (post-1.18.1, single source each)."
  matchups:
    - "Paladins shrug off CC and dominate team fights [[d:mage#1491110398357798913]]; rogues/shamans top the meta [[d:mage#1430916238699397321]]; warlocks can one-shot [[d:mage#1485360017107451977]] (post-1.18.1, single source/consensus)."
  sources:
    - {id: "[[d:mage#1446952036661723289]]", era: 1.18.1-announced-pre-release, agreement: consensus, used_for: "deep frost weak"}
    - {id: "[[d:mage#1491494895574323224]]", era: post-1.18.1, agreement: single source, used_for: "control playstyle"}
    - {id: "[[d:mage#1491543407754219811]]", era: post-1.18.1, agreement: single source, used_for: "frost strong in team fights"}
    - {id: "[[d:mage#1443285596842758205]]", era: 1.18.1-announced-pre-release, agreement: single source, used_for: "PvP stamina"}
    - {id: "[[d:mage#1491779826992939130]]", era: post-1.18.1, agreement: single source, used_for: "PomBlock"}
