        stat_notes: >
          "Your BIS item list, at least where we are at South Seas phase, it's about the same as Classic, besides the
          neck/waist" — Keds, 2025-09-11 (playbook-cited, exact post ID not preserved in the citing document; tests
          found full T1 with Improved Mind Blast 0/5 ≈ full T2 with Improved Mind Blast 4/5). Ignore set bonuses;
          prioritize spell power and hit. Hit to 16% (10% talent + 6% gear) is first priority; then haste ≈ spell
          power (roughly 17-20 SP per 1% haste) per player formula "20SP = 14 DPS, 1 Haste = 9.1 DPS, 1 Crit = 9.1 DPS
          ... I never go over 16% hit total" — [Ashafares (player), 2025-12-09](https://forum.turtlecraft.gg/viewtopic.php?p=162161#p162161);
          then crit. Spell penetration: "you can pretty much ignore magic penetration, useful for PvP but I can't
          think of any PvE fight where it would be worth gearing towards" — [Mackylol (player), 2024-02-21](https://forum.turtlecraft.gg/viewtopic.php?p=88341#p88341).
