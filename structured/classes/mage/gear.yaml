          "BWL's BiS is a combination of 5-Set and whatever else you can find" —
          [Eluaria (player), 2026-04-12](https://forum.turtlecraft.gg/viewtopic.php?p=174946#p174946), replying to a
          post noting there is "nothing like an Icyveins for TW" for mage BiS lists —
          [Andrewd93 (player), 2026-03-30](https://forum.turtlecraft.gg/viewtopic.php?p=173144#p173144). No T3.5 armor
          pieces are named. Arcane has its own T1/T2/T3 alternate versions (Arcanist/Netherwind/Frostfire, with Arcane
          spell power and haste after a 2025-01-28 retune, e.g. Frostfire Vestments 41 Arcane SP + 2% haste;
          Netherwind Epaulets 1% haste) — [Torta (staff), 2025-01-28](https://forum.turtlecraft.gg/viewtopic.php?p=118168#p118168).
          T3 pieces come from Archmage Angela Dosantos at Light's Hope (choose regular or Arcane version); T1/T2 from
          an NPC on the chains in Blackrock Mountain; existing pieces convert at Feid Rota in Ratchet — "SWAPPING WILL
          REMOVE ANY ENCHANTS YOU HAD" — [Mage General FAQ (wiki)](https://turtle-wow.fandom.com/wiki/Mage_General_FAQ).
          T3.5 "of the Guardian" 3-set Mirror Magic was fixed in 1.18.1 (+10% Arcane on rewind, per the wiki); no
          per-piece armor stats given. Gap: full T1-T3.5 armor slot list.
