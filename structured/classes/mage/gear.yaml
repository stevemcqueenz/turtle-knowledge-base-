gaps:
  - "No source gives a complete slot-by-slot raid-tier (T1 through T3.5) BiS list for any Mage spec — only tier-set bonus text and, for Arcane post-1.18.1, a single post naming two trinkets and one weapon for BWL."
  - "Arcane PvP has zero gear/stat sources — the playbook explicitly notes \"no rotation guide or stat list exists\"; only a passing unattributed remark that the alternate tier sets \"scale with haste\" exists."
  - "Frost PvP has no named armor pieces at all — only two consumables and general stamina/spell-penetration stat advice."
  - "No leveling gear list exists for Mage in any bracket — `leveling.md` states this as an explicit gap; only Int > Stam stat priority and two unnamed early items (Amber Rings, a battlemage staff) are given, neither concrete enough to list as structured items."
  - "Almost every pre-raid item above has item_id: null — the forum/wiki sources give item names and (usually) a drop location, but not a database ID, except for the Kara10 items (61251-61450 range) that one 2023 forum post links directly."
  - "Sorcerer's Regalia (T0.5) individual piece names are not given anywhere; referenced only as a set."
