  build_name: "none — gap (opaque exports: Redmagejoe p103299, Xudo p103310, Forumdweller p131096). Talents named as PvP core: Presence of Mind, Arcane Rupture, Resonance Cascade, Arcane Instability, Arcane Potency, Improved Arcane Missiles, Improved Counterspell"
  points: []
  leveling_order: []
stat_weights:
  priority: "not documented"
caps:
  arcane_range_yd: 30
  pom_cooldown_min: 3
  double_duplicate_crit_chance: "~1-2% per PoM window on a 650-700 SP / 30% crit mage (Kibuum, Bahamutxd)"
rotation_single:
  - {priority: 1, action: "Polymorph or open from range", condition: "target not on you"}
  - {priority: 2, action: "Presence of Mind -> Arcane Rupture (instant) -> Arcane Missiles", condition: "PoM available (3 min); reported 3-4k typical, 5-7k with Resonance Cascade/Instability/Potency alignment"}
  - {priority: 3, action: "Arcane Missiles", condition: "channel keeps hitting after the target breaks line of sight (players report 'around corners'); 0% pushback with Improved Arcane Missiles"}
  - {priority: 4, action: "Blink forward then channel", condition: "target beyond 30 yd"}
  - {priority: 5, action: "Arcane Surge", condition: "after any resist (enemy resistances feed it)"}
  - {priority: 6, action: "Mana Shield / Blink / Ice Block if reached", condition: "defensive; PoM can stand in for Ice Block"}
rotation_aoe:
  - {targets_min: 3, priority: 1, action: "Arcane Explosion spam", condition: "clumped enemies"}
aoe_threshold: 3
cooldowns:
  - {name: Presence of Mind, use_when: "instant Arcane Rupture opener"}
  - {name: Arcane Power + Mind Quickening Gem, use_when: "burst; AP cannot be cancelled and kills at 10% mana — not with Mana Shield draining"}
  - {name: Improved Counterspell, use_when: "4 s silence on casters"}
resource_rules:
  - "Mana Shield and Arcane Power share the mana pool; AP death at 10%."
  - "Being silenced on Arcane removes Polymorph, Mana Shield, Blink and the damage (cross-forum player remark)."
consumables:
  - "none documented for Arcane PvP"
mistakes_to_avoid:
  - "Arcane Power while Mana Shield drains you"
  - "Freecasting into an un-CC'd melee; channelling into a Felhunter/Intensity warlock"
  - "Mid range vs shamans"
