patch_validity:
  written_for: "1.17.2 Arcane rework (2024-11) through 1.18.0; Rupture nerfed 2024-12-20 and 2025-03-30"
  valid_for_1181: unknown
  notes: "The PoM -> Rupture -> Missiles opener is described identically by attackers and victims (consensus that it exists). 1.18.1 PvP dampening per class is unpublished. No build or stat source."
