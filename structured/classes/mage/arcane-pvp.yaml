stat_weights:
  priority: stamina first, then crit > spell power > haste; spirit useless; ~3% hit vs level-60 players
  sources:
  - '[[d:mage#1446156953347686441]]'
  - '[[d:pvp-general#1423705880704319609]]'
  - '[[d:mage#1446911998725193920]]'
caps:
  spell_hit_vs_players: ~3% [[d:mage#1446911998725193920]]
  resilience: reduces spell crit damage; since 2025-12 it reduces the whole crit (the old crit-portion-only bug #17804 is fixed) [[d:mage#1491486174777184346]], [[d:paladin#1484443837576249404]]
  dampening: class/spec-dependent in 1.18.1, numbers unpublished
rotation_single:
- priority: 1
  action: Presence of Mind + trinket (ZHC/ToEP) -> hard-cast Arcane Rupture
  condition: target in range, PoM ready
  sources:
  - '[[d:mage#1491794197773156493]]'
  - '[[d:mage#1491794733486571620]]'
- priority: 2
  action: Arcane Missiles spam
  condition: after Rupture; channel continues through LoS once started
  sources:
  - '[[d:mage#1491794484428537888]]'
  - '[[d:pvp-general#1423403435470098504]]'
- priority: 3
  action: Amplify Magic on enemy -> rank-1 Frostbolt -> Arcane Rupture -> Arcane Missiles
  condition: opener without PoM; Amplify blocks a warrior Charge
  sources:
  - '[[d:mage#1446916002456797397]]'
  - '[[d:mage#1446915962497531912]]'
- priority: 4
  action: Polymorph / Frost Nova / Counterspell / Cone of Cold, Blink + Ice Block to reset
  condition: between burst windows
  sources:
  - '[[d:mage#1491494895574323224]]'
rotation_aoe:
- targets_min: 3
  priority: 1
  action: Frost Nova -> Cone of Cold -> Arcane Explosion
  condition: group of melee on you
aoe_threshold: 3
cooldowns:
- name: Presence of Mind
  use_when: instant Rupture burst; cast standalone
  sources:
  - '[[d:mage#1479120357645619211]]'
- name: Ice Block / Cold Snap
  use_when: stun chains, Spell Lock windows; Ice Block/Cold Snap toggle macro
  sources:
  - '[[d:mage#1384150519450304604]]'
  - '[[d:pvp-general#1430030401585287208]]'
- name: Blink
  use_when: break stuns/roots; save vs druid Bash
  sources:
  - '[[d:pvp-general#1380875640907235431]]'
resource_rules:
- 'Arcane Power in PvP: the 10% mana death rule still applies; Mana Shield drains the same pool.'
consumables:
- Free Action Potion is the enemy melee counter to mage [[d:mage#1435053691676790784]]
- Greater Fire/Frost Protection Potions against casters
mistakes_to_avoid:
- Frostbolt-turret play into dampening [[d:mage#1491494895574323224]]
- Bursting into your own Polymorph (heals to full) [[d:mage#1444727256906731660]]
- Trading ranged damage with hunters [[d:pvp-general#1120391121005195286]]
- Letting a warrior Charge (Counterspell/Amplify first) [[d:mage#1446915962497531912]]
discord:
  channel: mage
  scope: 'Arcane PvP additions from the archived #mage Discord (post-1.18.1 sections). Every claim carries a [[d:mage#<id>]]
    citation, an era and agreement.'
  patch_validity_extra: Post-1.18.1 PvP damage is heavily dampened class/spec-wide; players report needing 13-15 Frostbolts
    to kill a geared melee and a Cone of Cold hitting for 71 at 700 SP [[d:mage#1485311972139335833]], [[d:mage#1491110087388037304]]
    (post-1.18.1, consensus on the reports; the dampening numbers were never published).
  rotation_single:
  - action: 'Kill pattern: Presence of Mind -> Arcane Rupture (instant) -> Arcane Missiles; PoM+trinket Rupture one-shots
      when it crits, and double-duplicate + Instability keep it going.'
    condition: PoM off cooldown
    sources:
    - '[[d:mage#1491794197773156493]]'
    - '[[d:mage#1485360017107451977]]'
    - '[[d:mage#1491794484428537888]]'
    era: post-1.18.1
    agreement: consensus
  - action: Do not turret Frostbolt / freecast into an un-CC'd melee; use Polymorph, Cone of Cold, Counterspell, trinkets,
      Ice Block + Blink for control.
    sources:
    - '[[d:mage#1491494895574323224]]'
    era: post-1.18.1
    agreement: single source
  stat_weights:
    priority: crit > spell power > haste, plus solid stamina [[d:mage#1446156953347686441]] (post-1.18.1, single source)
  caps:
    double_duplicate_crit_chance: ~1-2% per PoM window on a 650-700 SP / 30% crit mage (Kibuum, Bahamutxd) — unchanged by
      Discord
    dampening_reports: CoC 71 at 700 SP; 13-15 Frostbolts to kill a geared melee [[d:mage#1485311972139335833]], [[d:mage#1491110087388037304]]
  consumables:
  - Free Action Potion is the standard melee counter to mage ('tryhards in pvp use them') [[d:mage#1446915765461581934]] (post-1.18.1,
    single source).
  race_choice:
  - Gnome Escape Artist (rogue/warrior snares) [[d:mage#1043563538557448302]]; Undead Will of the Forsaken for forced-fear
    fights [[d:mage#1493740921232031906]]; Orc/Troll are the PvE damage races (Troll Berserking macroed with trinkets for
    burst) [[d:mage#1447253910875017238]]; High Elf for speedrun mana [[d:mage#1494293691227963503]] (post-1.18.1, single
    source each).
  matchups:
  - Paladins shrug off CC and dominate team fights; rogues/shamans top the meta [[d:mage#1491110398357798913]], [[d:mage#1430916238699397321]]
    (post-1.18.1, consensus).
  - 'Vs warriors: Dampen Magic + deadzone their Intercept [[d:mage#1491500856984600709]] (post-1.18.1, single source).'
  - Warlocks can one-shot and are the worst 1v1; answer with nova, blink, disengage [[d:mage#1485360017107451977]] (post-1.18.1,
    single source).
  mistakes_to_avoid:
  - '''PomBlock'' (PoM + Ice Block) remains the recommended annoying-BG build even after the damage nerfs [[d:mage#1491779826992939130]]'
