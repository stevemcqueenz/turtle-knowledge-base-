    - {level: 26, tree: Arcane, talent: "Arcane Subtlety 1-2 (26-27)"}
    - {level: 28, tree: Arcane, talent: "Magic Absorption 1-3 (28-30)"}
    - {level: 31, tree: Arcane, talent: "Arcane Concentration 1-5 (31-35)"}
    - {level: 36, tree: Fire, talent: "Incinerate 2, Master of Elements 3, Fire Vulnerability 3, Blast Wave 1, Critical Mass 3, Hot Streak 2, Fire Power 5, Combustion 1 (36-55; exact per-level order not given)"}
    - {level: 56, tree: "free", talent: "5 free points (56-60)"}
stat_weights:
  spell_crit_1pct_in_sp: {endgame: 25, fresh60: 17, source: "wiki Fire FAQ sim (1000 SP/40 crit/15 hit/5 haste; 300/18/13/3)"}
  spell_hit_1pct_in_sp: {endgame: 23, fresh60: 15}
  spell_haste_1pct_in_sp: {endgame: 15, fresh60: 11}
  priority: "hit to 16% > crit > spell power > haste (2-4% haste minimum recommended by wiki for double Fireball in the Ignite window, computed for the old 6 s window)"
caps:
  spell_hit: "16% (6% from Elemental Precision + Improved Fire Blast path) [[d:mage#1485659693857902663]] (1.18.1-announced-pre-release, consensus)"
  hot_streak_stacks: 5
  fire_vulnerability_stacks: 5
  ignite_duration_s: 4
rotation_single:
  - {priority: 0, action: "Opener: Fire Blast -> Scorch x3 -> Fireball -> Fire Blast", condition: "pull; builds 5 Fire Vulnerability stacks (Fire Blast also applies them since 1.18.0)"}
  - {priority: 1, action: "Pyroblast", condition: "Hot Streak at 5 stacks (1 s cast, 1 s GCD); cast it before another Fireball to avoid wasting crits (flight-time overlap)"}
  - {priority: 2, action: "Fire Blast", condition: "off cooldown (post-1.18.1 GCD -1.0 s with 3/3 Improved Fire Blast); also while moving"}
  - {priority: 3, action: "Fireball", condition: "default filler (rank 12 book, 295 mana)"}
  - {priority: 4, action: "Scorch", condition: "to extend Ignite / refresh Fire Vulnerability when a Fireball will not land in time; low-HP finisher; while moving"}
  - {priority: 5, action: "Frostbolt rank 1 / stop casting", condition: "about to pull threat from Ignite ticks as the sole Fire mage (pre-1.17.2 advice; threat is now split among Fire mages)"}
rotation_aoe:
  - {targets_min: 3, priority: 1, action: "Arcane Explosion spam", condition: "player consensus that AE is the best AoE regardless of spec; no Fire-specific raid AoE priority exists"}
  - {targets_min: 3, priority: 2, action: "Flamestrike (2.5 s) + Blast Wave (30 s) + Flame Throwing radius", condition: "when mobs are stacked and the tank is not moving them; rotate Flamestrike ranks for overlapping ground DoTs (different ranks stack)"}
  - {targets_min: 3, priority: 3, action: "Wear 3-piece Frost/Fire T3.5 (+20% Fire on rewind) + 3-piece Arcane", condition: "post-1.18.1"}
  - {targets_min: 2, priority: 9, action: "no source states 2-3 target handling", condition: "gap"}
aoe_threshold: 3
cooldowns:
  - {name: Combustion, use_when: "with crit-heavy burst on bosses (no timing source)"}
  - {name: Blast Wave, use_when: "AoE, 30 s cooldown (1.18.0)"}
  - {name: Evocation / mana gem / tea, use_when: "Fire is mana-hungry: 'Fire Mages quite struggle with mana even with Master of Elements' (staff); tea alone insufficient (Forbearance)"}
  - {name: Trinkets, use_when: "sim: Scythe (Kara10) > Tear > Mark of the Champion > Eye of Diminution > MQG > REoS"}
resource_rules:
  - "Master of Elements refunds 15/30/45% base mana on crits (one refund per multi-target cast)."
  - "Fireball/Flamestrike mana costs were reduced 2025-04-01 (Fireball R11 275, R12 295; Flamestrike R6 680)."
  - "Arcane Concentration 5/5 in the wiki path for Clearcasting."
  - "Ignite lasts 4 s (1.18.0); the sole Fire mage must keep it rolling with Fireball/Fire Blast/Scorch; Ignite no longer procs from grenades."
consumables:
  - "Mana tea / mana potions / mana gem"
  - "Brilliant Wizard Oil"
  - "Goblin Sapper Charge (engineering)"
  - "BigWigs (pepopo978 fork) Scorch/Ignite monitor; Flamestriker addon for rank rotation"
mistakes_to_avoid:
  - "Playing Fire against fire-immune Molten Core / Blackwing Lair bosses"
  - "Casting another Fireball at 5 Hot Streak stacks instead of Pyroblast"
  - "Letting Fire Vulnerability drop below 5 stacks or Ignite fall off as the only Fire mage"
  - "Flamestrike where the tank is moving the pack or in dungeons where it pulls aggro"
  - "Skipping Fire Blast (pre-1.18.1 habit) — after 1.18.1 it is on-cooldown filler"
  - "Relying on tea without Arcane Concentration / Master of Elements"

