stat_weights:
  priority: 'spell hit to 16% (6% Elemental Precision + 2% ZG enchants + 1% Emerald Blessing -> ~7% gear) > crit (~25 SP per
    1%, aim ~40%) > spell power > haste (contested: small haste breaks the 2-Fireball weave)'
  crit_1pct_in_sp:
    kara40_bis: ~25+
    sources:
    - '[[d:mage#1493652965158944868]]'
    - '[[d:mage#1479598294987440392]]'
  haste: small amounts sim 0.5-1% lower (weave desync); ~47-50% total haste gives clean 3-Fireball weaves [[d:mage#1489266514749034536]],
    [[d:mage#1489285264332296362]]
  solo_ignite_crit: ~50% Fireball crit keeps Ignite rolling solo [[d:mage#1487094005933019226]]
caps:
  spell_hit: 16% vs bosses; Fire gets 6% from talents [[d:mage#1484935527709806603]]
  ignite: 4 s window, stores 40% of first 5 crits, any crit refreshes; Fireball->Fire Blast needs ~50% crit, Scorch->Scorch->Fire
    Blast ~33% [[d:mage#1478705573376819295]], [[d:mage#1478707474113757357]]
  fire_mages_per_raid: 2 is the sweet spot, 3 can work post-fix [[d:mage#1465737132768231517]], [[d:mage#1468713916501852311]]
  ignite_visible_stack_cap: 48 (display only) [[d:mage#1484285532308771007]]
rotation_single:
- priority: 0
  action: 'Opener: Fire Blast -> Scorch x3 -> Fireball -> Fire Blast (Fire Blast while a Fireball is in flight banks a Fire
    Vulnerability stack)'
  condition: pull
  sources:
  - '[[d:mage#1478881200079769690]]'
  - '[[d:mage#1466186378617290815]]'
- priority: 1
  action: Pyroblast
  condition: 5 Hot Streak stacks (4 only if the boss is about to die)
  sources:
  - '[[d:mage#1479141574372757517]]'
- priority: 2
  action: Fire Blast
  condition: 'off cooldown: after 2 Fireballs with no haste, after a 3rd Fireball with small haste'
  sources:
  - '[[d:mage#1487204103632191600]]'
  - '[[d:mage#1487203302314606722]]'
- priority: 3
  action: Scorch
  condition: Fire Vulnerability below 5 stacks AND target lives > ~1 min; never extra Scorches to "extend" Ignite
  sources:
  - '[[d:mage#1485659693857902663]]'
  - '[[d:mage#1478881200079769690]]'
- priority: 4
  action: Fireball
  condition: default
- priority: 5
  action: Let a weak (partially resisted) Ignite drop and rebuild; signal other Fire mages via /bw extra magetools ignitedroptrigger
  condition: weak Ignite rolling
  sources:
  - '[[d:mage#1487206596852449382]]'
  - '[[d:mage#1478706351755759742]]'
rotation_aoe:
- targets_min: 3
  priority: 1
  action: Rank-1 Arcane Explosion (pre-proc trinkets, low threat)
  condition: pack pulled
  sources:
  - '[[d:mage#1479603921264836630]]'
- targets_min: 3
  priority: 2
  action: Flamestrike rank 6 -> Flamestrike rank 5 (two DoTs tick)
  condition: mobs stay grouped and alive for a while; skip if the raid melts trash
  sources:
  - '[[d:mage#1479770070598291608]]'
  - '[[d:mage#1468725989961109605]]'
- targets_min: 3
  priority: 3
  action: Blast Wave
  condition: off cooldown
  sources:
  - '[[d:mage#1479603921264836630]]'
- targets_min: 3
  priority: 4
  action: Arcane Explosion (max rank) spam
  condition: default AoE
  sources:
  - '[[d:mage#1479603921264836630]]'
- targets_min: 10
  priority: 5
  action: Flarecore 6-piece Flamestrike play
  condition: 10+ mobs only (quadratic scaling, ~50% of damage at 40-60 mobs)
  sources:
  - '[[d:mage#1468412814086508635]]'
aoe_threshold: 3
cooldowns:
- name: Combustion
  use_when: after Fire Vulnerability is stacked, into Fireball/Pyroblast
  sources:
  - '[[d:mage#1478734312135331881]]'
- name: Mind Quickening Gem
  use_when: save for chosen fights (Medivh, Faerlina, Heigan) or pre-proc windows (hard-mode KT)
  sources:
  - '[[d:mage#1470890829055787194]]'
  - '[[d:mage#1472414395211583659]]'
- name: Blast Wave
  use_when: AoE, 30 s cooldown
resource_rules:
- Arcane Concentration + Master of Elements are Fire's in-fight mana [[d:mage#1321259296654098523]].
- Ignite damage and threat are split among the Fire mages who crit into it; you must have a Hot Streak or Combustion buff
  to qualify [[d:mage#1486342319245496382]].
consumables:
- Flask of Supreme Power, Elixir of Greater Fire Power, Greater Arcane Elixir, Dreamshard Elixir, Dreamtonic, Mageblood, Medivh's
  Merlot Blue, Spirit of Zanza, Tel'Abim food, Potion of Quickness, Cerebral Cortex Compound [[d:mage#1354993754649399397]]
- Brilliant Wizard Oil; Oil of Immolation does not scale with SP [[d:mage#1494373493976993853]]
- 'Enchants: Presence of Sight head/legs, Power of the Scourge shoulders, +20 SP gloves, Enchanted Armor Kit, +30 SP weapon;
  belt Fire Power/Fire Damage (contested)'
mistakes_to_avoid:
- Bringing Fire to MC/BWL (fire-immune bosses) [[d:mage#1493927839274373200]]
- Holding Fire Blast after 1.18.1 [[d:mage#1487204103632191600]]
- Fireball at 5 Hot Streak stacks instead of Pyroblast [[d:mage#1479141574372757517]]
- Building Ignite before Fire Vulnerability [[d:mage#1466212364125999157]]
- Nursing a weak Ignite / extra Scorches to extend Ignite [[d:mage#1487206596852449382]], [[d:mage#1478881200079769690]]
- Stacking small haste that breaks the weave (contested) [[d:mage#1489266514749034536]]
