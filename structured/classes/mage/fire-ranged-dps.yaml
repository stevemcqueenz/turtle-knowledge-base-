stat_priority:
- spell-hit
- spell-crit
- spell-power
- haste
stat_priority_note: 'From the wiki Fire sim: hit to the 16% cap, then crit (crit is the top weight once hit is capped: ~25
  SP per 1% at endgame versus ~23 for hit), then spell power, then haste — but keep 2–4% haste so two Fireballs fit inside
  the Ignite window. That haste figure was written for the 6 s Ignite; 1.18.0 restored the 4 s Ignite and no source recomputed
  it.'
