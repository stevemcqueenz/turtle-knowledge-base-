  ignite_mechanics:
  - Ignite stores 40% of the first five crits; the tick does not grow afterwards [[d:mage#1235700216292835441]], [[d:mage#1487205700340941033]]
    (pre-1.18.1/post-1.18.1, consensus).
  - Ignite is 4 s since 1.18.0; the wiki Fire FAQ still computes a 6 s window — superseded [[d:mage#1433239410652086395]],
    [[d:mage#1488094426352980008]] (post-1.18.1, consensus).
  - 'Loatheb: 100% crit from spores makes one giant ignite; a good ignite ~250k with 5 mages, tracked past the 48-debuff visual
    cap with the BigWigs ''MageTools V2'' plugin [[d:mage#900490010200002620]], [[d:mage#1229314969414402108]], [[d:mage#1484297069148770464]]
    (pre-1.18.1, consensus).'
