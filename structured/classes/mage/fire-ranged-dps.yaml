patch_validity:
  written_for: "1.18.0 Fire retune (2025-08-15) plus 1.18.1 Improved Fire Blast change; wiki rotation revised 2026-03-04"
  valid_for_1181: true
  notes: "1.18.1 raised Improved Fire Blast's GCD reduction to 0.3/0.6/1.0 s, which per Eluaria fixes Fire Blast dropping Ignite; the wiki rotation already uses Fire Blast on cooldown. Superseded: 1.17.2-era Ignite 6 s / Hot Streak 3-rank advice; wiki haste note written for a 6 s Ignite window (now 4 s). Unknown: Fire T3.5 5-set bug (bug report 18568) status."
