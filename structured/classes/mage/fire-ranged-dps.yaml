  gear:
    - "Fire wants crit over haste and Curse of Elements; needs 2-3 fire mages to keep Ignite [[d:mage#1487193676726669554]], [[d:mage#1486774121537994903]] (post-1.18.1, consensus)"
    - "Ring of Burning Talons (Onyxia) is intended for Fire AoE but is more useful on Arcane [[d:mage#1488775375545700484]] (post-1.18.1, single source)"
    - "Fire is AQ40+; MC/BWL/Onyxia bosses are fire-immune [[d:mage#1484554859473670175]], [[d:mage#1279087141598662687]] (post-1.18.1/pre-1.18.1, consensus)"
  consumables:
    - "Full endgame consume list and stacking rules: Flask of Supreme Power + Elixir of Greater Arcane Power + Dreamshard Elixir + Dreamtonic + oil + Tel'Abim food; Mageblood, Spirit of Zanza; Juju Flurry + Potion of Quickness + Berserking + Elune's Courage stack; Nordanaar Tea from Hyjal; engineering is the only profession that adds raid damage (Sapper) [[d:mage#1438508962843463692]], [[d:mage#1427637200375382099]], [[d:mage#1438550709686501427]], [[d:mage#1488098864048115845]] (1.18.1-announced-pre-release/post-1.18.1, consensus)"
  mistakes_to_avoid:
    - "Skipping Fire Blast after 1.18.1, or adding small haste without shifting to 3 Fireballs per Fire Blast [[d:mage#1487204103632191600]], [[d:mage#1489266514749034536]]"
    - "Casting another Fireball at 5 Hot Streak stacks; letting a weak Ignite ride [[d:mage#1487206596852449382]]"
  boss_notes:
