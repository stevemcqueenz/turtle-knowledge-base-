      agreement: contested
  ignite_mechanics:
    - "Ignite stores 40% of the first five crits; the tick does not grow afterwards [[d:mage#1235700216292835441]], [[d:mage#1487205700340941033]] (pre-1.18.1/post-1.18.1, consensus)."
    - "Ignite is 4 s since 1.18.0; the wiki Fire FAQ still computes a 6 s window — superseded [[d:mage#1433239410652086395]], [[d:mage#1488094426352980008]] (post-1.18.1, consensus)."
    - "Loatheb: 100% crit from spores makes one giant ignite; a good ignite ~250k with 5 mages, tracked past the 48-debuff visual cap with the BigWigs 'MageTools V2' plugin [[d:mage#900490010200002620]], [[d:mage#1229314969414402108]], [[d:mage#1484297069148770464]] (pre-1.18.1, consensus)."
  stat_weights:
    priority: "hit to 16% > crit > spell power > haste (crit > 20-25 SP at Kara BiS)"
    spell_crit_1pct_in_sp: {endgame: ">25", fresh60: 17, sources: ["[[d:mage#1493652965158944868]]", "[[d:mage#1493648203491442718]]"], era: post-1.18.1, agreement: consensus}
    spell_hit_1pct_in_sp: {endgame: 23, fresh60: 15}
    spell_haste_1pct_in_sp: {endgame: 15, fresh60: 11}
    note: "The wiki sim values (crit 25/hit 23/haste 15 at 1000 SP) are corroborated by Discord field numbers: crit is 'well over 20 SP' and >25 SP at Kara BiS."
  caps:
