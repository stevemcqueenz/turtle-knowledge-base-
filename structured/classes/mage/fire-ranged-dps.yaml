    - {tree: "free", talent: "5 points unassigned by the source (Improved Fire Blast 3 is the obvious 1.18.1 candidate — inference, not sourced)", rank: 5, spell_id: null}
  leveling_order:
    - {level: 10, tree: Fire, talent: "Improved Fireball 1-5 (10-14)"}
    - {level: 15, tree: Fire, talent: "Ignite 1-5 (15-19)"}
    - {level: 20, tree: Fire, talent: Pyroblast}
