cooldowns:
- name: Arcane Power
  use_when: at full mana only; +30% cast speed, drains 1% max mana/s, dies below 10% mana, 20 s, uncancellable; weak gear
    dies to it, +1 s Missiles belts help
  sources:
  - '[[d:mage#1439011377133129900]]'
  - '[[d:mage#1424365348836212796]]'
- name: Mind Quickening Gem
  use_when: 'first; Arcane Power near the end of MQG (snapshots haste, shortens AP cooldown); low gear haste (~7%): both together
    is fine; stack everything only on <30 s fights'
  sources:
  - '[[d:mage#1484204264791216199]]'
  - '[[d:mage#1484233383541477518]]'
  - '[[d:mage#1457546495405326430]]'
- name: Juju Flurry / Potion of Quickness
  use_when: during Arcane Power unless at a hard cap; Juju up to ~12% gear haste, Quickness ~10%, both ~7%
  sources:
  - '[[d:mage#1472006152014270646]]'
  - '[[d:mage#1457504190761930835]]'
- name: Presence of Mind
  use_when: instant Arcane Rupture; cast standalone (macro bug); not in AP
  sources:
  - '[[d:mage#1460643726241042527]]'
  - '[[d:mage#1479120357645619211]]'
- name: Evocation
  use_when: start just before a server mana tick, cancel after the 4th tick
  sources:
  - '[[d:mage#1452736983209083033]]'
- name: Berserking (Troll)
  use_when: haste cooldown, same spread/stack rules
  sources:
  - '[[d:mage#1436113705480884345]]'
resource_rules:
- 'Arcane Power kills you below 10% mana: only pop at full mana; stop Mana Shield.'
- 'Mana regen while casting: 14% base, 30% with Mage Armor, 37-38% with T2 3pc; server cap 100% [[d:mage#1438912530411163748]],
  [[d:mage#1438238977558577287]].'
- Unbuffed mana pool of 4500-5000 makes Arcane Power safe [[d:mage#1491890195384242276]].
- +1 s Missiles belts and T3 6-piece improve mana economy and allow two Arcane Powers on some fights [[d:mage#1475835751114739865]],
  [[d:mage#1457729590523985951]].
- Threat reductions multiply (40% talent x 25% Salvation x 3% cloak ~= 57%) [[d:mage#1427356537147363509]]; Ice Block does
  not drop threat [[d:mage#1475235315546591466]].
- Night Dragon's Breath shares a cooldown with mana gems and runes [[d:mage#1470460393116799188]].
consumables:
- Flask of Supreme Power, Elixir of Greater Arcane Power, Greater Arcane Elixir, Dreamshard Elixir (all elixirs stack), Dreamtonic,
  Cerebral Cortex Compound, Medivh's Merlot Blue, Brilliant Wizard Oil [[d:mage#1481694558218616953]], [[d:mage#1452290109851570352]]
- 'Food: Tel''Abim Delight (SP) on trash, Medley (2% haste) on bosses above ~300-500 buffed SP (contested) [[d:mage#1438496524815568987]],
  [[d:mage#1464385661678391366]]'
- Juju Flurry, Potion of Quickness (5%), Spirit of Zanza, Mageblood Potion, Nordanaar Tea [[d:mage#1450233916266119258]],
  [[d:mage#1457731688846331925]]
- Goblin Sapper Charge (engineering) for trash [[d:mage#1438550709686501427]]
- 'Enchants: head/legs Presence of Sight, shoulders Sigil of Quickness (ST) or SP (AoE), gloves +20 Arcane Power, chest/boots
  Enchanted Armor Kit, weapon +30 SP, ring/neck +6 Arcane SP (JC)'
mistakes_to_avoid:
- Arcane Power below full mana (death at 10%) [[d:mage#1439011377133129900]]
- Surge/PoM during Arcane Power/MQG or above the haste cutoff [[d:mage#1432389709166018630]]
- Re-pressing Missiles mid-channel or cancelling mid-tick [[d:mage#1486010713355849778]]
- Recasting Rupture while its debuff is still up [[d:mage#1448429040108044340]]
- Wasting haste consumables past the 0.475 s / 58.3% caps [[d:mage#1435069155135983779]]
- Gearing hit for trash [[d:mage#1426251077547855962]]
- Staying Arcane for Anomalus (arcane-immune) [[d:mage#1484538774741586031]]
- Buying the "decreases casting speed" trinket or Dreamthread as pre-raid BiS [[d:mage#1437718071656714391]], [[d:mage#1433108399591002163]]
