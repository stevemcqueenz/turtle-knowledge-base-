  rotation_single:
  - action: 'In Arcane Power: cast Arcane Rupture whenever the Rupture debuff is down, otherwise channel Arcane Missiles.'
    condition: Arcane Power active
    sources:
    - '[[d:mage#1486058965300412416]]'
    - '[[d:mage#1486059691699343402]]'
    era: post-1.18.1
    agreement: single source
  - action: 'Outside Arcane Power: Missiles while Clearcasting -> Rupture when its debuff is down -> Surge at the last second
      of the Rupture debuff (or outside it) -> Missiles.'
    condition: no Arcane Power / MQG
    sources:
    - '[[d:mage#1486058965300412416]]'
    - '[[d:mage#1486059691699343402]]'
    - '[[d:mage#1486332027736297683]]'
    era: post-1.18.1
    agreement: consensus
  - action: Keep the Rupture debuff up; wait for it to fall before re-casting Rupture and cancel the Missiles channel right
      after a tick without clipping a missile.
    condition: Rupture off cooldown
    sources:
    - '[[d:mage#1448429040108044340]]'
    - '[[d:mage#1450105782422212681]]'
    - '[[d:mage#1486010713355849778]]'
    era: mixed
    agreement: consensus
  - action: Do not press Arcane Surge during Arcane Power/MQG/other big haste; above ~25-30% effective haste drop Surge from
      the rotation entirely (Surge's wait does not scale with haste).
    condition: effective haste > ~25-30%, or a haste cooldown is up
    sources:
    - '[[d:mage#1448429040108044340]]'
    - '[[d:mage#1432389709166018630]]'
    - '[[d:mage#1486021322340565163]]'
    - '[[d:mage#1486024900563959981]]'
    era: mixed
    agreement: consensus
  - action: Never re-press Arcane Missiles mid-channel without a channel-check (clips the last missile); use /script ChannelStopCastingNextTick()
      or the nampower double-tap interrupt to cancel cleanly.
    condition: channel in progress
    sources:
    - '[[d:mage#1486008770353037312]]'
    - '[[d:mage#1486008678262771782]]'
    - '[[d:mage#1485666719111446620]]'
    era: post-1.18.1
    agreement: consensus
  - action: When ooming, finish the Missiles channel and then Rupture/Surge for better mana efficiency (lower DPS).
    condition: low mana / dungeon pacing
    sources:
    - '[[d:mage#1486015533433225266]]'
    era: post-1.18.1
    agreement: single source
  - action: 8-piece T3 'direct damaging Arcane spells' benefits only Surge and Rupture, not Missiles.
