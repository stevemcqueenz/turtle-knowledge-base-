stat_priority:
- spell-hit
- haste
- spell-power
- spell-crit
stat_priority_note: 'Consensus of the wiki sim and player weights: hit to 16% first and never over it, then haste and spell
  power which trade almost evenly (~17–20 SP per 1% haste), then crit. Haste has breakpoints where an extra missile lands
  inside the Arcane Rupture window, and gear haste stacks multiplicatively. Spell penetration is a PvP stat only.'
