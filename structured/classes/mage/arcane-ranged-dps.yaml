  aoe_trash: {spell_crit_1pct_in_sp: 20, spell_hit_1pct_in_sp: 0, spell_haste_1pct_in_sp: 0}
  player_formula_Ashafares: {sp_20: "14 DPS", haste_1: "9.1 DPS", crit_1: "9.1 DPS", hit_1: "9.1 DPS (until 16%)"}
  priority: "hit to 16% > haste ~= spell power (1% haste ~= 17-20 SP) > crit > intellect; spirit/stamina low; spell penetration ignored in PvE"
  leveling_priority: "Intellect > Stamina > Spirit (Bigsmerf) — contested: Schoop123 found Spirit main stat under Arcane Power drain"
stat_priority: [hit-to-16-percent, haste, spell-power, crit]
stat_priority_note: "Consensus of the wiki sim and player weights: hit to 16% first and never over it, then haste and spell power which trade almost evenly (~17–20 SP per 1% haste), then crit. Haste has breakpoints where an extra missile lands inside the Arcane Rupture window, and gear haste stacks multiplicatively. Spell penetration is a PvP stat only."
caps:
  spell_hit: "16% (talent 10% + 6% gear per Ashafares; wiki sims use 15-16)"
  arcane_range_yd: 30
  arcane_missiles_haste_cap: "exists when stacking haste effects (wiki), value not given"
  arcane_surge_haste_threshold: "~30% haste: drop Surge from the rotation (Guldred, wiki)"
rotation_single:
  - {priority: 0, action: "Opener with cooldowns (<17% haste): Arcane Rupture -> Mind Quickening Gem -> Arcane Power -> Arcane Missiles -> Arcane Rupture if buff about to fall off -> Arcane Missiles", condition: "fight start, all cooldowns available; with >17% haste use MQG and Arcane Power separately, AP right before MQG ends"}
  - {priority: 1, action: "Arcane Surge", condition: "available (a spell of yours was partially/fully resisted within ~4 s) AND not under Arcane Power/MQG (>=~30% haste) AND you are not clipping a Missiles cast AND mana is spare; cancel Missiles for it only under those conditions; if Rupture buff is active delay as long as possible"}
  - {priority: 2, action: "Arcane Rupture", condition: "off cooldown AND Rupture buff (8 s) not active; cancel Missiles for it only if buff not active; use Presence of Mind on it"}
  - {priority: 3, action: "Arcane Missiles", condition: "default; do not re-press during the channel (clips); do not start a channel that will end after the Rupture buff expires if you cannot fit it (+20% mana, no +20% damage)"}
  - {priority: 4, action: "Fire Blast", condition: "moving; fishes for a resist to enable Arcane Surge"}
  - {priority: 5, action: "Arcane Missiles rank 1", condition: "low mana, to fish Clearcasting (Arcane Concentration, 8 s ICD) — leveling/emergency only"}
rotation_aoe:
  - {targets_min: 3, priority: 1, action: "Arcane Explosion spam (max rank)", condition: "3+ mobs per the wiki sim; Resonance Cascade rolls once per Explosion; watch threat"}
  - {targets_min: 3, priority: 2, action: "Wear 3-piece Frost/Fire T3.5 + 3-piece Arcane T3.5 on trash", condition: "post-1.18.1 Mirror Magic fix; otherwise 5-piece T3.5"}
  - {targets_min: 2, priority: 9, action: "no source states 2-target handling", condition: "gap"}
aoe_threshold: 3
cooldowns:
  - {name: Arcane Power, use_when: "on pull with MQG if <17% haste else staggered; never below ~30% mana (dies at 10%, cannot be cancelled); +30% cast speed, drains 1% max mana/s, -50% mana gain, 20 s, 3 min"}
  - {name: Presence of Mind, use_when: "instant Arcane Rupture; sped up by haste via Accelerated Arcana"}
  - {name: Mind Quickening Gem, use_when: "with Arcane Power at low haste; best trinket for 1-2 min fights per sim"}
  - {name: Evocation, use_when: "when mana low and safe to channel; cooldown shortened by haste (Accelerated Arcana)"}
  - {name: Mana gem / mana tea / mana potion, use_when: "tea does not share the potion cooldown; use freely (Gantulga)"}
  - {name: Counterspell, use_when: "interrupt casters; macro skips targets in Ice Block"}
resource_rules:
  - "Arcane Power kills you below 10% max mana and cannot be cancelled: only activate above ~30% mana and stop Mana Shield use during it."
  - "Arcane Instability burns 2% base mana per proc; Arcane Rupture buff raises Missiles cost by 20% for 8 s."
  - "Temporal Convergence: 5/10/15% per Missiles cast to reset Rupture and refund its base mana on the next cast (12 s buff, 15 s ICD); one Rupture consumes both Convergence and Clearcasting."
  - "Arcane Surge consumes a Clearcasting charge; choose Surge vs Missiles for the free cast deliberately."
  - "Arcane Meditation regen is tripled below 35% mana; Wand Specialization returns mana (150% of level) on wand hits; Magic Absorption returns 1-3% total mana on your resisted spells (2 s ICD)."
  - "In raids a Retribution Paladin's mana-on-spell-hit debuff refills the bar (Eluaria); while leveling mana drops fast — fish Clearcasting with rank-1 Missiles/Arcane Explosion."
  - "Blizzard ticks do not proc Clearcasting; each Missiles wave can (subject to the 8 s ICD)."
consumables:
  - "Mana tea (Hyjal, small dream shards; no shared cooldown with potions)"
  - "Greater/Major Mana Potion (Alchemist's Stone +33% if using Greater)"
  - "Conjured Mana Oranges (AQ20 quest chain; Refreshment Table)"
  - "Brilliant Wizard Oil (wiki macro)"
  - "Goblin Sapper Charge (engineering; 'only engineering really matters for raids')"
  - "Trinkets by fight length (sim): MQG (1-2 min), Mark of the Champion / Sphere of Endless Gulch (3-4 min), REoS, Sigil of Ancient Accord; Hazza'rah's Charm of Magic for AoE trash"
  - "Shoulder enchant: 2 haste (single target) or 'Saph' enchant (AoE versatility)"
mistakes_to_avoid:
  - "Starting max-rank Missiles on a mob about to die (wasted mana)"
  - "Using Arcane Power under ~30% mana (instant death at 10%)"
  - "Casting Missiles into the last second of the Rupture buff (pay +20% mana, get no bonus)"
  - "Using Arcane Surge during Arcane Power/MQG (1.5 s GCD does not scale with haste)"
  - "Letting the ~4 s Arcane Surge window lapse when cancelling Missiles would not clip"
  - "Re-pressing Missiles during a channel without a channel-check macro/nampower (clips the last missile)"
  - "Standing beyond 30 yd"
  - "Ignoring AoE threat on trash (Arcane Subtlety helps)"
  - "Wearing 5-piece T3.5 on trash after 1.18.1 when 3/3 is better"
  - "Converting tier pieces at Feid Rota while enchanted (enchants are lost)"
