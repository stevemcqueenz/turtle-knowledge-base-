patch_validity:
  written_for: 1.17.2 rework (2024-11-01) as retuned in 1.18.0 (2025-08-15); wiki rotation revised 2026-03-24
  valid_for_1181: true
  notes: '1.18.1 fixed the T3.5 Mirror Magic 3-set (+10% Arcane on rewind) and wand school modifiers. The earlier flat statement
    that 1.18.1 ''changed nothing in the Arcane tree'' is softened: a patch-day raider reported Resonance Cascade hitting
    25% where they remembered 20% [[d:mage#1484585695422058496]] (post-1.18.1, single source, unconfirmed) and Arcane Rupture/Surge
    damage-drop reports appeared on patch day [[d:mage#1484629998882128057]], [[d:mage#1486855899971719238]] (post-1.18.1,
    contested/unconfirmed). Pre-2025-04-01 advice about the T3 6-set removing the Arcane Power regen penalty is superseded
    (bonus removed). Pre-1.17.2 ''Brilliance Aura / mana battery'' advice is superseded (aura removed).'
