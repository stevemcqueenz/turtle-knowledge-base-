  rules:
  - Recast conjures each time you train a new rank
  - Eat and drink together after the fight; early on after every 1-2 mobs
  - Use a mana gem in long fights instead of drinking afterwards
  - Evocation (from 20) replaces one drink; cast just before a server tick
