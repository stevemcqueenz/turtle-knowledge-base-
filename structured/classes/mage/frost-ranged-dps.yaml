play_loop:
  opener:
  - Ice Barrier (pre-pull)
  - Frostbolt
  - Icicles (only if Flash Freeze)
  - Frost Nova (if in melee range)
  - Icicles
  single_target:
  - priority: 1
    action: Icicles
    condition: Flash Freeze active only
  - priority: 2
    action: Ice Barrier
    condition: off cooldown
  - priority: 3
    action: Frost Nova
    condition: off cooldown and in melee range of a freeze-immune boss
  - priority: 4
    action: Cone of Cold
    condition: in range
  - priority: 5
    action: Cold Snap
    condition: reset Nova for another Nova -> Icicles pair
  - priority: 6
    action: Frostbolt
  aoe:
    targets_min: 2
    loop:
    - '<=5 freeze-immune mobs: Cone of Cold -> Icicles -> Frost Nova -> Icicles -> Arcane Explosion'
    - '>5 mobs: Cone of Cold -> Arcane Explosion spam'
    - 'freezable mobs (dungeons/open world): leveling AoE loop'
    - never Blizzard for damage
  cooldowns:
  - Ice Barrier on cooldown
  - Cold Snap for a second Nova/Barrier/Ice Block
  - Evocation, mana gems, tea when low
  notes:
  - 'Freezable mobs: use the leveling loop, not this one'
  - Icicles roots for its whole channel; never start it in raid AoE
leveling_aoe_farming:
  loop:
  - Gather the pack
  - Frost Nova Rank 1
  - Flamestrike (timed to land just before Nova breaks)
  - Cone of Cold as they break free
  - Circle-kite, Arcane Explosion when they catch up; Cone of Cold on cooldown
  - Repeat when Nova is back
  rules:
  - Frost Nova always rank 1
  - Arcane Explosion max rank unless mana-short or a weak tank
  - 'Flamestrike: highest rank that leaves mana for the rest of the cycle'
  - Check mana covers one full cycle before pulling
  - 'Low mana mid-pull: stop nuking, kite in chill slows until Nova is back'
  by_level:
  - levels: 14-25
    targets: 1-3
    ranks:
      Frost Nova: 1
      Arcane Explosion: 1-2
    cycle_mana: 300-400
  - levels: 26-33
    ranks:
      Frost Nova: 1
      Flamestrike: 2
      Cone of Cold: 1
      Arcane Explosion: 2-3
    cycle_mana: ~1000
  - levels: 34-41
    ranks:
      Frost Nova: 1
      Flamestrike: 3
      Cone of Cold: 2
      Arcane Explosion: 3-4
    cycle_mana: 1450-1700
  - levels: 42-49
    ranks:
      Frost Nova: 1
      Flamestrike: 4
      Cone of Cold: 3
      Arcane Explosion: 4-5
    cycle_mana: 1900-2150
  - levels: 50-60
    ranks:
      Frost Nova: 1
      Flamestrike: 5-6
      Cone of Cold: 4-5
      Arcane Explosion: 5-6
    cycle_mana: 2350-2850
    variant: Cone of Cold -> Arcane Explosion x5-6 -> Cone of Cold, Nova for emergencies
