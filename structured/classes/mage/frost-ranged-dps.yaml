patch_validity:
  written_for: "1.17.2 Frost rework with hotfixes through 2025-10-22; wiki rotation revised 2025-10-28"
  valid_for_1181: true
  notes: "1.18.1: Ice Barrier +5% Frost while active (was 15%) and +10% Frost for 1 min on cast — recast on cooldown for the cast bonus. Flash Freeze no longer procs from Free Action Potion/Blessing of Freedom (2025-04-01). Ragnaros freeze-immune (2025-04-30). Wiki 'mana issues as of April 7th 2025' unexplained. Raid-standing claims (weakest spec) are player opinion; staff never commented after 2024-12."
