stat_weights:
  priority: spell hit to 16% (6% Elemental Precision; ~7% from gear with ZG enchants + Emerald Blessing) > spell power > haste
    ~= crit
  wiki_sim_endgame:
    hit_1pct_in_sp: 18-19
    haste_1pct_in_sp: 12-13
    crit_1pct_in_sp: 11-12
    source: https://turtle-wow.fandom.com/wiki/Mage_Frost_FAQ
  haste_food: not recommended for Frost [[d:mage#1464383668574224529]]
caps:
  spell_hit: 16% vs bosses [[d:mage#1484935527709806603]]
  winters_chill: 2-3 points (wiki sim 80-90% uptime)
  kel_thuzad_frost_resist: 200; everything else needs no penetration with Curse of Shadows/Elements [[d:mage#1450392648216088629]],
    [[d:mage#1450392717476630539]]
  sapphiron: frost-immune [[d:mage#1494089881943543971]]
rotation_single:
- priority: 0
  action: Pre-pull Ice Barrier; opener Frostbolt -> Icicles -> Frost Nova -> Icicles (or Frostbolt -> Cone of Cold -> Icicles
    -> Frost Nova -> Icicles)
  condition: freeze-immune boss
  sources:
  - '[[d:mage#1466891208532955228]]'
  - '[[d:mage#1448401911437988012]]'
- priority: 1
  action: Icicles
  condition: Flash Freeze active ONLY (never raw)
  sources:
  - '[[d:mage#1491959578827559113]]'
  - '[[d:mage#1430291530333028524]]'
- priority: 2
  action: Ice Barrier
  condition: off cooldown (+10% Frost damage for 60 s on cast)
  sources:
  - '[[d:mage#1466881324055920836]]'
- priority: 3
  action: Frost Nova
  condition: off cooldown AND in melee range of a freeze-immune boss
  sources:
  - '[[d:mage#1430637056815796386]]'
- priority: 4
  action: Cone of Cold
  condition: in range (Frostbite can proc Flash Freeze)
  sources:
  - '[[d:mage#1430637056815796386]]'
- priority: 5
  action: Cold Snap
  condition: Nova on cooldown and a burst window is wanted
  sources:
  - '[[d:mage#1466899456141299763]]'
- priority: 6
  action: Frostbolt
  condition: default; macro /cast [mybuff:Flash_Freeze] Icicles; Frostbolt
  sources:
  - '[[d:mage#1454246436718776330]]'
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Cone of Cold -> Icicles (if proc) -> Frost Nova -> Icicles -> Arcane Explosion
  condition: up to 5 freeze-immune mobs (wiki)
- targets_min: 6
  priority: 1
  action: Cone of Cold -> Arcane Explosion spam -> Icicles on a survivor
  condition: more than 5 freeze-immune mobs (wiki)
- targets_min: 3
  priority: 2
  action: Alternate rank-1 Blizzard (fish Flash Freeze) with Icicles on skull
  condition: medium packs of freeze-immune mobs (e.g. Garr adds)
  sources:
  - '[[d:mage#1443219267058139311]]'
  - '[[d:mage#1467928499997245481]]'
- targets_min: 2
  priority: 9
  action: Never Nova/CoC freezable raid mobs (roots them off the tank)
  condition: freezable pack
aoe_threshold: 2
cooldowns:
- name: Ice Barrier
  use_when: on cooldown for the on-cast damage buff
- name: Ice Block / Cold Snap
  use_when: survival; Cold Snap also resets Nova for another Icicles pair; Ice Block keeps threat
  sources:
  - '[[d:mage#1475235315546591466]]'
resource_rules:
- Frost mana is weak on fast fights (under ~1:20) [[d:mage#1429249488408805417]]; 1.18.1 did not fix it [[d:mage#1464428023045427210]].
- Icicles roots you for the full channel even if cancelled; only Blink frees you [[d:mage#1430673305886658611]].
consumables:
- Flask of Supreme Power, Elixir of Greater Frost Power, Greater Arcane Elixir, Dreamshard Elixir, Dreamtonic, Mageblood,
  Spirit of Zanza, SP food, Brilliant Wizard Oil [[d:mage#1354993754649399397]]
- Frost wand for Viscidus [[d:mage#1483584847107588217]]
mistakes_to_avoid:
- Icicles without Flash Freeze [[d:mage#1491959578827559113]]
- Nova/CoC on freezable raid mobs
- Icicling in AoE / cancelling without Blink [[d:mage#1430673305886658611]]
- Raid build without Frostbite [[d:mage#1430637056815796386]]
- Leaving Ice Barrier on cooldown [[d:mage#1466881324055920836]]
- '"buff" instead of "mybuff" in the Icicles macro [[d:mage#1454246436718776330]]'
- Expecting Flash Freeze from FAP/Freedom targets [[d:mage#1486095084108779655]]
discord:
  channel: mage
  scope: 'Frost additions from the archived #mage Discord. Every claim carries a [[d:mage#<id>]] citation, an era (pre-1.18.1
    | 1.18.1-announced-pre-release | post-1.18.1) and agreement (consensus | single source | contested).'
  rotation_single:
  - action: 'Ice Barrier on cooldown: 1.18.1 moved the bonus to the cast (+10% Frost for 1 min on cast, +5% while active).
      A pfUI display bug made players think the buff vanished when the shield broke; it does not.'
    condition: off cooldown
    sources:
    - '[[d:mage#1484361204200902697]]'
    - '[[d:mage#1484696403149193316]]'
    - '[[d:mage#1484866761202602075]]'
    era: post-1.18.1
    agreement: consensus
  - action: Use Frost Nova on freeze-immune bosses to force a Flash Freeze proc; cast Icicles immediately during the proc.
      Never cast Icicles raw (self-root, 30% base-HP shatter).
    condition: Flash Freeze proc active
    sources:
    - '[[d:mage#1491935288551932055]]'
    - '[[d:mage#1491959578827559113]]'
    era: post-1.18.1
    agreement: consensus
  - action: Flash Freeze no longer procs from Free Action Potion / Blessing of Freedom (removed 2025-04-01).
    sources:
    - '[[d:mage#1486095084108779655]]'
    era: post-1.18.1
    agreement: single source
  - action: Frostbolt is the filler; keep Winter's Chill up (2-3 points for ~80-90% uptime solo).
    sources:
    - '[[d:mage#1486342319245496382]]'
    era: post-1.18.1
    agreement: consensus
  rotation_aoe:
  - action: Cone of Cold -> Frost Nova -> Flamestrike -> Arcane Explosion; Blizzard is only a cheap Flash-Freeze fisher (40%
      slow / 1.5 s; 'we don't use Blizzard at all anymore').
    targets_min: 2
    sources:
    - '[[d:mage#1489762019908260061]]'
    - '[[d:mage#1486165941325660180]]'
    - '[[d:mage#1431797472346247359]]'
    era: mixed
    agreement: consensus
  caps:
    spell_hit: 16% (Frost gets 6% from Elemental Precision)
    icicles_self_damage: 30% base health if the root is shattered by damage taken
    improved_blizzard_slow: '40% and 1.5 s duration (the slow also lost duration: 2.0 s -> 1.5 s) [[d:mage#1430717972997214329]]
      (1.18.1-announced-pre-release, single source)'
  stat_weights:
    priority: hit to 16% > spell power > haste >= crit
    spell_hit_1pct_in_sp:
      endgame: 18-19
      fresh60: 11-12
    spell_haste_1pct_in_sp:
      endgame: 12-13
      fresh60: 6
    spell_crit_1pct_in_sp:
      endgame: 11-12
      fresh60: 7
    sources:
    - '[[d:mage#1487588079907770580]]'
    era: post-1.18.1
    agreement: single source
  gear:
  - Frost has no mana-return talent in-tree (only low-tier Arcane); reports it needs pushback protection at Icicles range
    [[d:mage#1484630072374726736]] (post-1.18.1, single source).
  - Frost PvP gear should prioritise stamina over raw frost damage at low levels [[d:mage#1443285596842758205]] (post-1.18.1,
    single source).
  leveling:
  - Frost remains the default leveling spec because of control and elite-quest soloing; use Flamestrike/CoC/Nova AoE, not
    Blizzard [[d:mage#1484551865285869688]], [[d:mage#1486136677134106724]], [[d:mage#1489762019908260061]] (post-1.18.1,
    consensus).
  mistakes_to_avoid:
  - Casting Icicles without a Flash Freeze proc or while standing in AoE [[d:mage#1491959578827559113]]
  - Casting Blizzard for AoE farming (40% slow, worst endgame AoE) [[d:mage#1431797472346247359]]
  - Expecting Flash Freeze from Free Action Potion / Blessing of Freedom [[d:mage#1486095084108779655]]
  boss_notes:
  - boss: Sapphiron / Kel'Thuzad
    note: Sapphiron frost-immune, KT highly frost-resistant.
    sources:
    - '[[d:mage#1281848179108876331]]'
    - '[[d:mage#1493951049113800975]]'
  - boss: Anomalus
    note: Kara40 Anomalus is arcane-immune; arcane gear is pure arcane damage.
    sources:
    - '[[d:mage#1493996129291997244]]'
    - '[[d:mage#1493928300589092874]]'
