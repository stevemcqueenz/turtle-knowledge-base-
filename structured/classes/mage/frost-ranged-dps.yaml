stat_priority:
- spell-hit
- spell-power
- haste
- spell-crit
stat_priority_note: 'From the wiki Frost sim: hit to the cap (16% is the generic caster figure players quote), then spell
  power, then haste and crit — haste is rated at or slightly above crit at endgame (~12–13 SP per 1% haste versus ~11–12 per
  1% crit). Damage split in that sim: Frostbolt ~57%, Icicles ~43%.'
