stat_weights:
  spell_hit_1pct_in_sp: {endgame: "18-19", fresh60: "11-12", source: "wiki Frost FAQ sim (1000 SP/40 crit/15 hit/0 haste; 300/18/13/0)"}
  spell_haste_1pct_in_sp: {endgame: "12-13", fresh60: 6}
  spell_crit_1pct_in_sp: {endgame: "11-12", fresh60: 7}
  priority: "hit to 16% > spell power > haste >= crit"
stat_priority: [hit-to-cap, spell-power, haste, crit]
stat_priority_note: "From the wiki Frost sim: hit to the cap (16% is the generic caster figure players quote), then spell power, then haste and crit — haste is rated at or slightly above crit at endgame (~12–13 SP per 1% haste versus ~11–12 per 1% crit). Damage split in that sim: Frostbolt ~57%, Icicles ~43%."
caps:
  spell_hit: "16% (generic)"
  icicles_self_damage: "30% base health if the root is shattered by damage taken"
  icicles_range_yd: 30
rotation_single:
  - {priority: 0, action: "Ice Barrier", condition: "before the pull, then on cooldown (1.18.1: +10% Frost for 60 s on cast); Crake: recast when <=10 s remain or if down"}
  - {priority: 1, action: "Frost Nova on the boss", condition: "boss is freeze-immune (most raid bosses; Ragnaros since 2025-04-30) and you can stand in melee range; on cooldown; do NOT press it with a Frostbolt in flight (use Fire Blast first or wait) or the Frostbite proc wastes the Nova proc"}
  - {priority: 2, action: "Icicles", condition: "Flash Freeze proc active (400% faster channel, ~1 s) — cast immediately; never while standing in AoE (30% base HP shatter); contested: Crake casts it whenever available, wiki/raider only with a proc"}
  - {priority: 3, action: "Arcane Surge", condition: "available (Crake priority); its 1.5 s GCD ignores haste"}
  - {priority: 4, action: "Frostbolt", condition: "default; Frostbite procs on immune targets trigger Flash Freeze"}
  - {priority: 5, action: "Winter's Chill upkeep", condition: "2-3 points give 80-90% 5-stack uptime solo; with 2 Frost mages 2 points each"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Cone of Cold -> Icicles if proc -> Frost Nova -> Icicles -> Arcane Explosion", condition: "up to 5 freeze-immune mobs (wiki)"}
  - {targets_min: 6, priority: 1, action: "Cone of Cold -> Arcane Explosion spam -> Icicles on a survivor near the end", condition: "more than 5 mobs (wiki)"}
  - {targets_min: 2, priority: 2, action: "never Frost Nova / Cone of Cold on freezable raid mobs", condition: "they root away from the tank (wiki spreadsheet of freezable raid mobs)"}
  - {targets_min: 2, priority: 3, action: "Wear 3 Frost/Fire T3.5 + 3 Arcane T3.5", condition: "post-1.18.1 trash"}
aoe_threshold: 2
cooldowns:
  - {name: Ice Barrier, use_when: "on cooldown (damage bonus on cast in 1.18.1)"}
  - {name: Frost Nova, use_when: "on cooldown vs freeze-immune bosses for a Flash Freeze proc"}
  - {name: Icicles, use_when: "with Flash Freeze proc; 30 s cooldown reset by the proc"}
  - {name: Ice Block / Cold Snap, use_when: "survival; Cold Snap for a second Block/Nova/Barrier"}
  - {name: Blink, use_when: "breaks the Icicles self-root; not from >20 m height"}
  - {name: Trinkets, use_when: "sim: Tear > Mark of the Champion > MQG > REoS > Shard of the Nightmare > Gulch"}
resource_rules:
  - "Frost Channeling -15% Frost mana / -30% threat; Arcane Concentration Clearcasting; Icicles refunds via Master of Elements only if talented."
  - "Wiki reports Frost mana issues since 2025-04-07 (cause unknown, not addressed in 1.18.1)."
  - "Improved Blizzard chill (40%) and Cone of Cold (60%) do not coexist; the stronger overwrites (vanilla behaviour); Blizzard ticks do not proc Clearcasting."
consumables:
  - "Mana tea / mana potions / mana gem"
  - "Greater Fire Protection Potion (PvP vs Fire mages)"
  - "MageHud addon to track Ice Barrier absorb"
mistakes_to_avoid:
  - "Frost Nova / Cone of Cold on raid mobs that are not freeze-immune"
  - "Icicles without a Flash Freeze proc (5 s self-root for little damage)"
  - "Icicling while standing in AoE (30% base HP self-damage)"
  - "Ignoring Flash Freeze procs"
  - "Pressing Frost Nova with a Frostbolt in flight (wastes a proc)"
  - "Kiting packs with Blizzard as in Classic (slow is 40% now) — use Cone of Cold / Frost Nova / Flamestrike / Arcane Explosion"
  - "Taking 5/5 Winter's Chill"
  - "Expecting Flash Freeze from Free Action Potion / Blessing of Freedom"
  - "Letting Ice Barrier lapse"
