rotation_single:
- priority: 0
  action: Charge -> Sunder Armor -> Bloodrage (Enrage)
  condition: opener
  sources:
  - '[[d:warrior#1487841821928198335]]'
- priority: 1
  action: Execute
  condition: 'target <= 20%; bank rage first; Precision Cut adds 25/50/75% per extra rage; Deathcute: Death Wish + Bloodrage
    then spam Execute'
  sources:
  - '[[d:warrior#1494705955731013692]]'
  - '[[d:warrior#1485948147040649348]]'
- priority: 2
  action: Mortal Strike
  condition: off cooldown (MS build)
- priority: 3
  action: Slam
  condition: right after each auto lands; 3.6-3.8 speed weapon
  sources:
  - '[[d:warrior#1485948346420953218]]'
  - '[[d:warrior#1454938660276408574]]'
- priority: 4
  action: Whirlwind
  condition: off cooldown
  sources:
  - '[[d:warrior#1477507600320041145]]'
- priority: 5
  action: Overpower
  condition: on proc; avoid stance swaps that waste 50+ rage
  sources:
  - '[[d:warrior#1493216441845940356]]'
  - '[[d:warrior#1486211683738456225]]'
- priority: 6
  action: Hamstring
  condition: cheap filler GCD (no cooldown)
  sources:
  - '[[d:warrior#1485948346420953218]]'
- priority: 7
  action: Heroic Strike
  condition: only when rage would cap
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Sweeping Strikes
  condition: first on any 2+ target pull; not on Hamstring/Pummel
  sources:
  - '[[d:warrior#1486384393625927822]]'
  - '[[d:warrior#1358900982875947129]]'
- targets_min: 2
  priority: 2
  action: Mortal Strike / Whirlwind
  condition: while SS charges remain
- targets_min: 2
  priority: 3
  action: Cleave
  condition: rage dump instead of Heroic Strike
aoe_threshold:
  value: 2
  note: Sweeping Strikes from 2 targets; Lawnmower (fury.md) beats Arms on pure trash
cooldowns:
- name: Death Wish
  use_when: 'Deathcute only: Execute phase'
  sources:
  - '[[d:warrior#1482492282388091114]]'
- name: Recklessness
  use_when: Execute phase; shared 30-min CD with Shield Wall/Retaliation
  sources:
  - '[[d:warrior#1462506610068029502]]'
- name: Bloodrage
  use_when: pull, and into Execute on fights >= 1:15
  sources:
  - '[[d:warrior#1433266387962560572]]'
- name: Kiss of the Spider
  use_when: when the Execute phase matters most
  sources:
  - '[[d:warrior#1468275155242586275]]'
resource_rules:
- Bank rage before 20% so Execute takes the target from 20% to 0 [[d:warrior#1494705955731013692]]
- Heroic Strike swings generate no rage [[d:warrior#1473745241159762074]]
- 'Deathcute: expect 0-rage dead time between Executes [[d:warrior#1486834452662456451]]'
consumables:
- Same kit as Fury (see fury-melee-dps.yaml / guide/classes/warrior/fury.md#consumables-and-buffs)
- 'Gloves: +9 Strength common, Agility stays good above 34% crit [[d:warrior#1467622383731867730]]'
mistakes_to_avoid:
- Master of Arms over Enrage in a Precision Cut build [[d:warrior#1484972916595757106]]
- Stance-swapping for Overpower with lots of rage [[d:warrior#1486211683738456225]]
- Deathcute in raids that kill too fast for Execute to matter [[d:warrior#1486834175318425761]]
- Pre-1.18 guides assuming an Execute cooldown [[d:warrior#1398137181406498906]]
