stat_priority_note: 'Weapon top-end damage is not a character stat and so is not in the list, but it ranks just below hit
  for this spec: the slowest, highest top-end two-hander is the pick because Whirlwind, Sweeping Strikes and Cleave each use
  one auto-attack''s worth of damage per target [Atreidon p=101831] and Mortal Strike "will be bigger with slow weapon than
  with fast weapon" [Czasku p=101834]. Slam is normalized since Dec 2024, so slow weapons lost ~18% Slam damage. Strength
  and attack power are a tie: no cited post ranks them against each other, so their order in the array above carries no ranking.
  Grouping them is this repository''s reading of the sources listed above.'
