play_loop:
  guide_section: guide/classes/warrior/arms.md#how-to-play
  opener:
  - Charge
  - Sunder Armor (first GCD)
  - Bloodrage (Enrage)
  single_target:
  - Mortal Strike on cooldown
  - Slam right after each auto (slow 2H)
  - Whirlwind on cooldown
  - Overpower on proc if the stance swap will not waste rage
  - Hamstring filler
  - Heroic Strike only at rage cap
  - 'Deathcute: Slam filler until 20%'
  execute:
  - bank rage before 20%, Execute 20% -> 0
  - 'Precision Cut: extra rage = extra damage'
  - 'Deathcute: Death Wish + Bloodrage, spam Execute'
  aoe:
    targets_min: 2
    loop:
    - Sweeping Strikes (Battle Stance) first
    - Mortal Strike
    - Whirlwind
    - Cleave
    - never spend Sweeping Strikes on low-damage buttons
  cooldowns:
  - Recklessness in Execute phase (30 min cd shared with Shield Wall/Retaliation)
  - Bloodrage on pull and into Execute on fights >= 1:15
  - Death Wish (Deathcute) for Execute phase
  resource_rules:
  - a swap to Overpower costs 50+ rage ~80-90% of the time; only swap with little banked rage
  - Heroic Strike swing generates no rage
