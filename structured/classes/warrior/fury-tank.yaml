stat_weights:
- stat: hit
  verdict: fury-prot 'basically just want 1h hit cap'; never miss the opener
  sources:
  - '[[d:warrior#1441252441004703905]]'
  - '[[d:warrior#1484717088315670750]]'
  agreement: consensus
  era: mixed
- stat: crit/agility
  verdict: threat stat; agi also gives armor/dodge
  sources:
  - '[[d:warrior#1428801642077229220]]'
  - '[[d:warrior#1433037675350200380]]'
  agreement: consensus
  era: 1.18.1-announced-pre-release
- stat: strength/attack-power
  verdict: second; more valuable with existing crit
  sources:
  - '[[d:warrior#1428796660321882112]]'
  agreement: consensus
  era: 1.18.1-announced-pre-release
- stat: stamina
  verdict: the survival stat for a shieldless build
  sources:
  - '[[d:warrior#1440378255743123558]]'
  agreement: consensus
  era: 1.18.1-announced-pre-release
- stat: defense
  verdict: avoided on threat gear; Shield Block imitates the crit cap
  sources:
  - '[[d:warrior#1492251922600558612]]'
  agreement: consensus
  era: post-1.18.1
