agreement: 'consensus that it was the pre-CC2 raid-tank meta and was nerfed at CC2 (2024-11-01); contested whether it is still
  worth playing (Arkaris/Cheruscan yes-ish vs Xudo/Atreidon/Ellifta no). Post-1.18.1: best off-tank; MT only for extra ~150
  TPS, DefTac better in 99.9% of cases [[d:warrior#1485222628016001024]], [[d:warrior#1485222514119671829]]'
