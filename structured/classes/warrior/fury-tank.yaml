resource_rules:
- Rage generation higher than deep prot (pre-CC2 claims)
- Save rage between pulls
- Stance for post-CC2 fury-prot not settled in sources
consumables:
- Mighty Rage Potion on the pull inside Bloodrage + Berserker Rage [[d:warrior#1425928245374877760]]
- Stoneshield Potion — repeatedly named as the reason fury-prot (no shield) survives [[d:warrior#1445929336514412584]], [[d:warrior#1463182833848684554]]
- Diamond Flask on-use; swap to HoJ/Blackhand's Breadth while the buff/CD runs [[d:warrior#1427402284995706991]], [[d:warrior#1440805963803132015]]
- Limited Invulnerability Potion macro'd into Challenging Shout [[d:warrior#1437846916946857995]]
- Flask of Titans + stamina enchant as the offset when mixing DPS pieces into a tank set [[d:warrior#1446701925838885036]]
mistakes_to_avoid:
- Copying a vanilla furyprot build (Improved Shield Block, sit-proc Enrage)
- Main-tanking 40-man raids in a Bloodthirst build after CC2
- Death Wish without telling healers
- Expecting Shield Slam and Shield Block charges to stack
- 'Whiffing the opener: missing the first Shield Slam(s) means ''your threat doesn''t exist'' [[d:warrior#1488266577995370547]],
  [[d:warrior#1485223080249917522]]'
- Gearing full mitigation; 'if it's not crit/hit then it's useless for tanks' [[d:warrior#1437139082185539894]], [[d:warrior#1492112928109891644]]
- Relying on Thunder Clap for AoE (4-target cap, no crit, often resisted) [[d:warrior#1476086839499558922]]
- FuryProt with a shield or before healers/gear can carry it [[d:warrior#1478473227272454178]], [[d:warrior#1463067390098018540]]
- Thunder Clap/Demo Shout early in the opener [[d:warrior#1475256639379734619]]
