  - {priority: 5, action: Pummel, condition: "enemy casting (Battle Stance since CC2)"}
  - {priority: 6, action: Disarm, condition: "vs melee; keep 20 rage"}
  - {priority: 7, action: Intimidating Shout, condition: "peel/escape; unreliable vs WotF/tremor"}
  - {priority: 8, action: Hamstring, condition: "keep snare up; no cooldown since 1.18.1"}
