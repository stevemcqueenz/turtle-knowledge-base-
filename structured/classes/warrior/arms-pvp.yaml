stat_weights:
  # PvP has no numeric weights; Discord agrees stamina-first and adds the post-1.18.1 set economy.
  - {stat: stamina, verdict: "first; glass-cannon (~4k HP) is the classic mistake", sources: ["[[d:warrior#1452728250563297290]]"], agreement: consensus, era: 1.18.1-announced-pre-release}
  - {stat: armor, verdict: "the real gate post-1.18.1: 'warrior can pvp when people got 0 armor'; proposed fixes are an armor cap at 5k, remove crit/DoT reduction, real dampening", sources: ["[[d:warrior#1488851645558292670]]", "[[d:warrior#1488858716970160149]]", "[[d:warrior#1486057650713002115]]"], agreement: single source each, era: post-1.18.1}
  - {stat: weapon-top-end-damage, verdict: "slow/high top-end 2H; post-1.18.1 Elementium Axe is the named PvP weapon, BRE the PvE one", sources: ["[[d:warrior#1485934279493156884]]", "[[d:warrior#1491753844777160745]]"], agreement: single source, era: post-1.18.1}
  - {stat: hit, verdict: "same cap logic as PvE; no PvP-specific number in sources"}
  - {stat: crit/attack-power, verdict: "after stamina/armor; set bonuses now carry huge str/crit/hit/stam/armor and reduce DoT/crit damage taken", sources: ["[[d:warrior#1492257144588865787]]"], agreement: consensus, era: post-1.18.1}
stat_priority: [stamina, weapon-top-end-damage, hit, crit, attack-power]
caps:
  hp_unbuffed_target: "5.5k-7k (Springboards; player advice, not a cap)"
  hit: null
  pvp_dampening: "announced class/spec-specific for 1.18.1, but a player reports it was not added at launch — contested; numbers absent from both corpora [[d:warrior#1485326960132493414]]"
rotation_single:
  - {priority: 0, action: "Charge (out of combat) or Intercept (Berserker Stance) -> Hamstring", condition: "opener; Bloodrage + Demoralizing Shout vs stealthed rogue"}
  - {priority: 1, action: Mortal Strike, condition: "off cooldown"}
  - {priority: 2, action: Overpower, condition: "target dodged (Battle Stance)"}
  - {priority: 3, action: Execute, condition: "target <= 20%"}
  - {priority: 4, action: Master Strike, condition: "situational CC by main-hand type: dagger silence / axe root / sword disarm / mace disorient"}
  - {priority: 5, action: Pummel, condition: "enemy casting (Battle Stance since CC2)"}
  - {priority: 6, action: Disarm, condition: "vs melee; keep 20 rage"}
  - {priority: 7, action: Intimidating Shout, condition: "peel/escape; unreliable vs WotF/tremor"}
  - {priority: 8, action: Hamstring, condition: "keep snare up; no cooldown since 1.18.1"}
  - {priority: 9, action: "Post-CC3 Fury PvP priority: Bloodthirst/Blood Drinker attrition + Improved Berserker Rage root break; 'warrior can't burst, so it settles for blood drinker attrition'", condition: "Fury PvP (the post-CC3 default)", sources: ["[[d:warrior#1484523736714707054]]", "[[d:warrior#1485893615937916949]]"], agreement: consensus, era: post-1.18.1}
  - {priority: 10, action: "2H Fury takes Booming Voice over Unbridled Wrath (Booming Voice is a PvP talent, Unbridled Wrath is PvE)", condition: "2H Fury PvP", sources: ["[[d:warrior#1492881562516324425]]", "[[d:warrior#1492881927785680998]]"], agreement: single source, era: post-1.18.1}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: Sweeping Strikes, condition: "then Whirlwind/Cleave"}
  - {targets_min: 2, priority: 2, action: Piercing Howl, condition: "AoE snare, no cooldown"}
  - {targets_min: 2, priority: 3, action: Intimidating Shout, condition: "AoE fear"}
  - {targets_min: 4, priority: 1, action: "do not Whirlwind into the group", condition: "Manletow p=108331; use War Stomp if Tauren"}
aoe_threshold: null
cooldowns:
  - {name: Free Action Potion, use_when: "on cooldown in serious fights (consensus)"}
  - {name: Recklessness / Retaliation / Shield Wall, use_when: "shared 30-min CD; once per BG or two"}
  - {name: Berserker Rage, use_when: "fear immunity; with Improved Berserker Rage a root/snare break every 30 s"}
  - {name: "Improved Berserker Rage", use_when: "the decisive post-CC3 PvP talent (root break every 30 s) — 'just too good especially vs mages'; makes Fury the default PvP spec", sources: ["[[d:warrior#1485893615937916949]]"], agreement: consensus, era: post-1.18.1}
  - {name: "PvP trinket (Insignia)", use_when: "mandatory; breaks stuns/roots/slows, 5-min CD; cannot break sheep/trap/seduce (pre-2025 grievance)", sources: ["[[d:warrior#925100035509735495]]", "[[d:pvp-general#1216689050057048134]]"], agreement: consensus, era: pre-1.18.1}
  - {name: Shield Wall, use_when: "post-1.18.1 called 'useless in pvp' by one source; community asks for 5-min base CDs", sources: ["[[d:warrior#1488679442699129005]]"], agreement: single source, era: post-1.18.1}
  - {name: Engineering gadgets, use_when: "as available"}
resource_rules:
  - "Every fight starts at 0 rage; Charge gives 9"
  - "Absorb shields give no rage (player complaint)"
  - "Tactical Mastery to keep Disarm rage across stances"
consumables: [Free Action Potion, Living Action Potion, tea/sugar, Frost Reflector, Sheen of Zanza, Greater Holy Protection Potion, Crystal of Zin-Malor, Lifegiving Gem (trinket), engineering gadgets]
mistakes_to_avoid:
  - "Solo queue / seeking 1v1s"
  - "Glass-cannon gearing with ~4k HP"
  - "Whirlwind-into-the-zerg opener"
  - "No FAP/consumables"
  - "Melee-ing enhancement shamans"
  - "Using 2024-11..2026-03 Hamstring-cooldown advice as current"
  - "Treating Arms as the default PvP spec post-CC3 without checking: 'Arms is also the worse choice outside of 3v3 arena or hard premate' [[d:warrior#1488506997602127883]]"
  - "No FAP/engineering: 'there is skill expression in pvp with warrior but it's usually smart usage of combat potions or engineering items/trinkets' [[d:warrior#1409975234857275402]]"
  - "Expecting the PvP trinket to break sheep/trap/seduce (it cannot) [[d:pvp-general#1216689050057048134]]"

