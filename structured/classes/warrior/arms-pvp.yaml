stat_weights:
- stat: stamina
  verdict: first; glass-cannon (~4k HP) is the classic mistake
  sources:
  - '[[d:warrior#1452728250563297290]]'
  agreement: consensus
  era: 1.18.1-announced-pre-release
- stat: armor
  verdict: 'the real gate post-1.18.1: ''warrior can pvp when people got 0 armor''; proposed fixes are an armor cap at 5k,
    remove crit/DoT reduction, real dampening'
  sources:
  - '[[d:warrior#1488851645558292670]]'
  - '[[d:warrior#1488858716970160149]]'
  - '[[d:warrior#1486057650713002115]]'
  agreement: single source each
  era: post-1.18.1
- stat: weapon-top-end-damage
  verdict: slow/high top-end 2H; post-1.18.1 Elementium Axe is the named PvP weapon, BRE the PvE one
  sources:
  - '[[d:warrior#1485934279493156884]]'
  - '[[d:warrior#1491753844777160745]]'
  agreement: single source
  era: post-1.18.1
- stat: hit
  verdict: same cap logic as PvE; no PvP-specific number in sources
- stat: crit/attack-power
  verdict: after stamina/armor; set bonuses now carry huge str/crit/hit/stam/armor and reduce DoT/crit damage taken
  sources:
  - '[[d:warrior#1492257144588865787]]'
  agreement: consensus
  era: post-1.18.1
