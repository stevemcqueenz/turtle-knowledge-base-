agreement: 'contested overall (F-tier vs strongest-with-support); consensus on: stamina gearing, play with healers/dispellers,
  FAP and consumables, avoid 1v1 and enhancement shamans. Post-CC3 the spec default flipped to Fury — ''2h fury is the best
  2h pvp spec'' — so ''Arms is the PvP spec (Mortal Strike)'' is now contested [[d:warrior#1486355885612863549]], [[d:warrior#1488507175885082747]].
  Post-1.18.1: warrior widely rated the weakest PvP class [[d:warrior#1488839076193894411]]; Arms only for organized teams
  needing Mortal Strike [[d:warrior#1492893464516362280]]'
patch_validity:
  written_for: CC3 / 1.18.0 kit; Hamstring-cooldown-era posts flagged
  valid_for_1181: true
  notes: '1.18.1 removed the Hamstring cooldown (added at CC2) and made PvP dampening class-specific (numbers not in repo).
    Master Strike (CC3) replaced Counterattack (CC2). Decisive Strike builds (pre-Dec-2024) obsolete. Discord post-CC3/1.18.1:
    the default PvP spec flipped from Arms to Fury (Improved Berserker Rage root break); at live launch a player reports class-specific
    dampening was NOT added [[d:warrior#1485326960132493414]] (contested).'
