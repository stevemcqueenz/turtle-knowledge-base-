pvp_gear:
  sets_post_1181: "new PvP sets carry huge str/crit/hit/stam/armor and reduce DoT/crit damage taken; T3 PvP 'outstams k40 bis by 80~ stamina and has way better threat' [[d:warrior#1492257144588865787]], [[d:warrior#1488606329005146245]]"
  costs: "20k honor/week cap; T1 24,000; T2 144,000 + T1; T3 520,000 + T2 and 21,000 Conquest -> ~33 weeks / 8+ months [[d:warrior#1487427534772764682]], [[d:warrior#1492266218629890271]]; T1 is fresh-60-viable [[d:warrior#1491052658637934704]]"
  enchants: "Helm +7 Def/+10 Stam, Neck +6 Stam, Cape +3 Agi, Chest +100 hp or +4 all stats, Wrist +9 Stam, Legs +7 Def/+10 Stam, Feet Minor Speed, rings +Stam, weapon Crusader / Weapon Chain [[d:warrior#1384786996848754728]]; Weapon Chain mandatory vs disarm spam [[d:pvp-general#1290571835859275818]]"
  weapons: "Elementium Axe is the named post-1.18.1 PvP weapon, BRE stays the PvE weapon [[d:warrior#1485934279493156884]]"

pvp_race: "Gnome / Escape Artist is the consensus warrior PvP race [[d:warrior#995410602115735654]], [[d:warrior#1494450420385320961]]; Human Perception a minority pick [[d:warrior#995409805797752903]]"

pvp_matchups:
  summary: "warrior is the consensus group-PvP DPS but a weak solo duelist; kiting + CC is the whole counter [[d:pvp-general#1310884374819901450]], [[d:pvp-general#1387001790829957131]]"
  lines:
    - {vs: mage, advice: "hard counter unless FAP; post-CC3 Improved Berserker Rage root break is the advertised answer", sources: ["[[d:pvp-general#1387001790829957131]]", "[[d:warrior#1485893615937916949]]"], agreement: consensus}
    - {vs: paladin, advice: "losing; MS is 'pointless damage-wise vs a heal paladin' (-80% dmg)", sources: ["[[d:pvp-general#1198322883143938078]]", "[[d:warrior#1474054341106073610]]"], agreement: consensus}
    - {vs: hunter, advice: "slight hunter favour; entrap/concussive beats improved Hamstring; deep prot claimed counter", sources: ["[[d:pvp-general#1126849924491919420]]", "[[d:warrior#1302028129719816287]]"], agreement: contested}
    - {vs: rogue, advice: "the one matchup warrior is not disadvantaged in; sit Defensive Stance, Blood Craze, 2h for Overpower", sources: ["[[d:warrior#1146692339931291679]]", "[[d:warrior#1176592574924988547]]"], agreement: consensus}
    - {vs: warlock, advice: "succubus Seduce -> burst is the loss; deny the pet", sources: ["[[d:pvp-general#1216944373036613633]]", "[[d:pvp-general#1351160314342936608]]"], agreement: consensus}
    - {vs: druid, advice: "stop hitting into Frenzied Regen", sources: ["[[d:warrior#1138784880495427596]]"], agreement: consensus}
    - {vs: shaman, advice: "losing; '-80% dmg vs shamans or heal paladins'; prot+stun is the single-source counter", sources: ["[[d:warrior#1474054341106073610]]", "[[d:pvp-general#1418626701457625119]]"], agreement: consensus}

