rotation_single:
- priority: 0
  action: Charge -> auto -> Slam + Mortal Strike
  condition: opener
  sources:
  - '[[d:warrior#1496077451577528390]]'
- priority: 1
  action: Hamstring
  condition: keep up (no cooldown)
- priority: 2
  action: Mortal Strike
  condition: on cooldown, especially on healed targets
- priority: 3
  action: Bloodrage + Death Wish -> Execute
  condition: target under 20%
  sources:
  - '[[d:warrior#1490662215882375268]]'
- priority: 4
  action: Overpower
  condition: on dodge (strong vs rogues)
  sources:
  - '[[d:warrior#1435065004071194836]]'
- priority: 5
  action: Rend
  condition: on plate/tanks; bleeds ignore armor
  sources:
  - '[[d:warrior#1461331450237423836]]'
- priority: 6
  action: Piercing Howl
  condition: multiple kiting targets (Booming Voice range)
  sources:
  - '[[d:warrior#1457022734948241438]]'
- priority: 7
  action: Disarm
  condition: melee with weapon (not fists / Weapon Chain)
  sources:
  - '[[d:warrior#1446923546918916287]]'
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Sweeping Strikes
  condition: then Whirlwind/Cleave
- targets_min: 2
  priority: 2
  action: Piercing Howl
  condition: AoE snare, no cooldown
- targets_min: 2
  priority: 3
  action: Intimidating Shout
  condition: AoE fear
- targets_min: 4
  priority: 1
  action: do not Whirlwind into the group
  condition: Manletow p=108331; use War Stomp if Tauren
aoe_threshold: null
cooldowns:
- name: Intercept
  use_when: not within 5 s of Charge (shared stun DR); shares CD with Intervene
  sources:
  - '[[d:warrior#1465395209444524246]]'
  - '[[d:warrior#1465395113869049946]]'
- name: Berserker Rage
  use_when: break Fear / Repentance; baited by Fear -> Net
  sources:
  - '[[d:pvp-general#1433888687392817154]]'
  - '[[d:pvp-general#1432168724714229770]]'
- name: Shield Wall
  use_when: needs shield; unequipping loses buff; shares CD with Recklessness
  sources:
  - '[[d:warrior#1460673521142333613]]'
  - '[[d:warrior#1462506610068029502]]'
- name: Pummel / Shield Bash
  use_when: shared cooldown; one interrupt
  sources:
  - '[[d:warrior#1454776559570518109]]'
resource_rules:
- Every fight starts at 0 rage; Charge gives 9
- Absorb shields give no rage (player complaint)
- Tactical Mastery to keep Disarm rage across stances
consumables:
- Free Action Potion
- Living Action Potion
- tea/sugar
- Frost Reflector
- Sheen of Zanza
- Greater Holy Protection Potion
- Crystal of Zin-Malor
- Lifegiving Gem (trinket)
- engineering gadgets
mistakes_to_avoid:
- Solo queue / seeking 1v1s
- Glass-cannon gearing with ~4k HP
- Whirlwind-into-the-zerg opener
- No FAP/consumables
- Melee-ing enhancement shamans
- Using 2024-11..2026-03 Hamstring-cooldown advice as current
- 'Treating Arms as the default PvP spec post-CC3 without checking: ''Arms is also the worse choice outside of 3v3 arena or
  hard premate'' [[d:warrior#1488506997602127883]]'
- 'No FAP/engineering: ''there is skill expression in pvp with warrior but it''s usually smart usage of combat potions or
  engineering items/trinkets'' [[d:warrior#1409975234857275402]]'
- Expecting the PvP trinket to break sheep/trap/seduce (it cannot) [[d:pvp-general#1216689050057048134]]
- Charge then Intercept within 5 s (target immune) [[d:warrior#1465395209444524246]]
- Stacking weapon skill for PvP [[d:warrior#1474129063000936571]]
- Trying to stack Sunder in PvP [[d:warrior#1489647195371077812]]
