about: >
  Gear recommendations for Warrior (Arms, Fury, Fury-Protection hybrid, Protection) by
  spec/role and level bracket, with where-to-obtain, built from the Warrior forum (f40),
  General forum BiS-request threads, the existing class playbooks' "Gear, enchants and
  consumables" sections, and the 1.18.1 itemization changelog. The forum's own repeated
  finding is that **no maintained Turtle-specific pre-raid or raid BiS list exists** for
  any Warrior spec; every slot table below is built from named-item fragments scattered
  across many threads, not from a single curated list. Treat ranks as directional, not a
  simmed BiS order.
class: warrior
