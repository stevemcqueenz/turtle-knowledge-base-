resource_rules:
- Avoidance and PW:Shield cost rage (rage from being hit) [[d:warrior#1463291642588041217]]
- 'Pre-pull rage: ZG trinket pop-and-swap, Dig Rats [[d:warrior#1447702089789870202]]'
- On-use items share a 30 s cooldown [[d:warrior#1492231959814865087]]
consumables:
- Mighty Rage Potion on pull [[d:warrior#1475256676981542923]]
- Power Mushroom (threat) or Hardened Mushroom + Gurubashi Gumbo (mitigation) [[d:warrior#1463293431962140714]]
- 'Naxx: Shadow prot (4HM, Loatheb), Frost prot (Sapph, KT) [[d:warrior#1459717421219975312]]'
- 'Kara40: Magic Resistance Potion on Anomalus; Frost/Arcane Reflector before Incantagos [[d:warrior#1458982047979671613]],
  [[d:warrior#1465828169826439208]]'
mistakes_to_avoid:
- Revenge talents in DefTac or DefTac in Revenge build [[d:warrior#1484903007748362241]]
- DefTac in Defensive Stance all fight [[d:warrior#1484538309416845352]]
- Slow weapon on a tank [[d:warrior#1465472984121868298]]
- Over-stacking defense/avoidance [[d:warrior#1476092913783017605]]
- Thunder Clap/Demo Shout in single-target opener [[d:warrior#1475256639379734619]]
- Taunting a CC'd target [[d:warrior#1430903627610062879]]
leveling:
  spec_consensus: Prot is a viable dungeon-leveling tank from 30 (Shield Slam) but slower solo (contested) [[d:warrior#1429822325510897794]],
    [[d:warrior#1450677084732129410]]; no shield/spec is needed to tank leveling dungeons — swap to shield+1H when damage
    spikes (consensus) [[d:warrior#1457458781205168320]], [[d:warrior#1455910106918158506]]
  brackets: see leveling_by_bracket in arms-melee-dps.yaml
discord:
  channels:
  - warrior
  agreement: mixed — Discord corroborates the forum KB (1.18.1 prot changes were buffs, not a nerf) and adds the threat maths;
    contested on the Defiance constant and the Shield Slam threat model
  eras:
  - pre-1.18.1
  - 1.18.1-announced-pre-release
  - post-1.18.1
  sources:
  - cite: '[[d:warrior#1481378107037323354]]'
    era: 1.18.1-announced-pre-release
