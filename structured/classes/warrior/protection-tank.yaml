play_loop:
  guide_section: guide/classes/warrior/protection.md#how-to-play
  opener:
  - 'pre-pull: Battle Shout + Bloodrage ~1 min before, Mighty Rage Potion on pull'
  - ask DPS to hold 2-3 GCDs
  - 'DefTac: Battle Stance, shield + fast 1H'
  - Shield Slam (or Concussion Blow) first
  - no Thunder Clap / Demoralizing Shout in a single-target opener
  tank:
  - priority: 1
    action: Shield Slam
    condition: on cooldown (DefTac / Revenge prot)
  - priority: 2
    action: Overpower
    condition: DefTac in Battle Stance, after a dodge
  - priority: 3
    action: Revenge
    condition: Revenge deep prot in Defensive Stance, when lit
  - priority: 4
    action: Concussion Blow
    condition: on cooldown; generates rage
  - priority: 5
    action: Heroic Strike
    condition: queued on every swing you can afford (main threat with Shield Slam)
  - priority: 6
    action: Sunder Armor
    condition: filler
  - priority: 7
    action: Shield Block
    condition: after a hit consumed the Shield Slam block buff (they overwrite)
  - priority: 8
    action: Defensive Stance block-dance
    condition: threat lead safe on a dangerous boss
  aoe:
    targets_min: 2
    loop:
    - mark skull > cross > square
    - Demoralizing Shout spam
    - tab-Cleave
    - Thunder Clap (max 4 targets)
    - 'short Berserker swap: Thunder Clap, Whirlwind, Thunder Clap'
    - Sappers / Thunderfury / dynamite for hard pulls
    - Challenging Shout emergency
  taunt:
  - 'Taunt: Defensive Stance, 5 yd, 10 s cd, resistible; not on crowd-controlled mobs'
  - 'Mocking Blow: Battle Stance, 120 s cd, backup'
  - 'Challenging Shout: 10 min cd, AoE'
  - 'Four Horsemen-style swaps: Taunt only'
  cooldowns:
  - Last Stand / healthstone / tea when low
  - 'Shield Wall: shield equipped; 30 min cd shared with Recklessness/Retaliation'
  - 'Improved Berserker Rage: roots'
  avoid:
  - Revenge talents with DefTac
  - DefTac in Defensive Stance all fight
  - slow weapon
  - taunting crowd-controlled mobs
  sources:
