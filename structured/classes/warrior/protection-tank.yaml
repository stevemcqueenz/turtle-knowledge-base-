stat_weights:
- stat: agility/crit
  verdict: 'top threat stat for DefTac: Agi/crit >> Str/AP > SBV'
  sources:
  - '[[d:warrior#1440130599955468308]]'
  - '[[d:warrior#1433037675350200380]]'
  agreement: consensus
  era: post-1.18.1
- stat: stamina/armor
  verdict: the mitigation stats when survival matters
  sources:
  - '[[d:warrior#1440130599955468308]]'
  agreement: consensus
  era: post-1.18.1
- stat: hit
  verdict: to yellow cap for Shield Slam; nothing above
  sources:
  - '[[d:warrior#1483151759164833832]]'
  agreement: consensus
  era: post-1.18.1
- stat: weapon-skill
  verdict: 'barely matters: Heroic Strike cannot glance'
  sources:
  - '[[d:warrior#1485315738053902458]]'
  agreement: single source
  era: post-1.18.1
- stat: block-value
  verdict: weak; Glyph of Deflection the exception
  sources:
  - '[[d:warrior#1482190391049719959]]'
  agreement: single source
  era: post-1.18.1
stat_weights_equivalence: '1% crit = ~18.8 str = ~5.2 shield block value of Shield-Slam threat at 1k AP (0 AP: ~12 str / ~3.7
  BV); overall 1% crit ~= 17.3 BV [[d:warrior#1428796660321882112]], [[d:warrior#1428800565785395230]] (single source, pre-1.18.1)'
