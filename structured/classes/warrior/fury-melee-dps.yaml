  contested whether 2H Fury (Slam) is a real spec
patch_validity:
  written_for: CC3 / 1.18.0 kit (2025-08-15); rotation thread written for the Dec-2024 kit
  valid_for_1181: true
  notes: '1.18.1 changes touching this file: Hamstring cooldown removed (filler is spammable again); Improved Whirlwind renamed
    Ravager (+Cleave cost -1/2/3); Flurry/Slam interaction corrected to 1.92 s (2H Fury nerf); T1 3-set rage proc; T3 4-set
    +4% crit damage. Hotfix 2026-03-21: Flurry properly consumed. No post-1.18.1 parse reports. Guide refresh (2026-09): builds
    and rotations updated to the post-2026-03-20 state from #warrior.'
