rotation_single:
  - {priority: 0, action: "Charge -> Bloodrage -> Sunder Armor once -> Berserker Stance", condition: "opener; Bloodrage activates Enrage since 2024-11-01"}
  - {priority: 1, action: Execute, condition: "target HP <= 20% and rage available; no cooldown since CC3; swing first then Execute"}
  - {priority: 2, action: Bloodthirst, condition: "off cooldown"}
  - {priority: 3, action: Whirlwind, condition: "off cooldown"}
  - {priority: 4, action: Sunder Armor, condition: "boss has < 5 stacks or tank is not a warrior; also proc-fishing filler"}
  - {priority: 5, action: Hamstring, condition: "instant filler for weapon procs; had 6 s CD 2024-11-01..2026-03-19, none after 1.18.1"}
  - {priority: 6, action: Heroic Strike, condition: "rage >= 70 and nothing else available (queued swing gives no rage; off-hand not guaranteed)"}
  - {priority: 7, action: Battle Shout, condition: "buff missing"}
