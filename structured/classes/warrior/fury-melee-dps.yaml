stat_weights:
- stat: hit
  verdict: cap yellow hit first (8% at 300 skill -> 5% at 315); do not trade crit for hit once capped
  sources:
  - '[[d:warrior#1457402842074714285]]'
  - '[[d:warrior#1466151329427886171]]'
  agreement: consensus
  era: post-1.18.1
- stat: weapon-skill
  verdict: 310-315; each point +0.2% hit, +2% glancing damage, +0.1% crit; never 316+
  sources:
  - '[[d:warrior#1468345044703645923]]'
  - '[[d:warrior#1479840926296838307]]'
  agreement: consensus
  era: post-1.18.1
- stat: crit_vs_ap
  verdict: 1% crit ~ 30-40 AP; ~92 AP + 2 crit beats 33 AP + 3.7 crit most of the time
  sources:
  - '[[d:warrior#1467046048987090944]]'
  - '[[d:warrior#1467046773691383980]]'
  agreement: single source
  era: post-1.18.1
- stat: strength
  verdict: 1 Str = 2 AP (2.2 with Kings); 20 Agi = 1% crit
  sources:
  - '[[d:warrior#1492015033591402516]]'
  agreement: consensus
  era: post-1.18.1
- stat: haste
  verdict: multiplicative, better the more AP/crit you have; Str vs haste for 2H contested
  sources:
  - '[[d:warrior#1447411553728200797]]'
  - '[[d:warrior#1482884212791971952]]'
  - '[[d:warrior#1483102293048955073]]'
  agreement: contested
  era: post-1.18.1
- stat: armor-penetration
  verdict: weak on debuffed bosses (near 0 armor); ok on trash
  sources:
  - '[[d:warrior#1488197833382170635]]'
  agreement: consensus
  era: post-1.18.1
