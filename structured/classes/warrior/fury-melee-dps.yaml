stat_weights:
  # No published numeric weights (the channel defers to WarriorSim); post-1.18.1 order + mechanics only.
  - {stat: hit, verdict: "cap first; 9% bosses yellow at 300 skill, less with weapon skill", sources: ["[[d:warrior#1485499853537804388]]"], agreement: consensus, era: post-1.18.1}
  - {stat: weapon-skill, verdict: "caps ~315; only 5% yellow hit needed at 315; more hit still helps DW whites but is less valuable past the cap", sources: ["[[d:warrior#1485500872829177918]]"], agreement: single source, era: post-1.18.1}
  - {stat: crit, verdict: "needed for Flurry uptime (~30-33% target) and Enrage/Impale; DW crit-cap example ~41% buffed", sources: ["[[d:warrior#1491395973660807168]]", "[[d:warrior#1493655987071094914]]"], agreement: single source each, era: post-1.18.1}
  - {stat: strength/attack-power, verdict: "primary after hit/crit; 'dps want STR once past the flurry uptime crit target'", sources: ["[[d:warrior#1491395973660807168]]"], agreement: single source, era: post-1.18.1}
  - {stat: haste, verdict: "good for DW; scales exponentially and can get out of hand on high-tier gear", sources: ["[[d:warrior#1488516184025600031]]"], agreement: single source, era: post-1.18.1}
  - {stat: agility, verdict: "crit/dodge; stack heavily while leveling", sources: ["[[d:warrior#1487172105962524866]]"], agreement: single source, era: post-1.18.1}
  - {stat: rage_2h_vs_dw, verdict: "DW is a steady rage stream; 2H is spiky (a big crit ~70 rage, one dodge/glance hurts)", sources: ["[[d:warrior#1492029740448743524]]"], agreement: single source, era: post-1.18.1}
  - {stat: rage_formula, verdict: "post-1.18.1: hit = (dmg*7.5/230.6)/1.075 + base_swing*3.5/2.25; crit uses 7.5 for the swing term (guide writer 30/Khoni)", sources: ["[[d:warrior#1494491071366037607]]"], agreement: single source, era: post-1.18.1}
stat_priority: [hit-to-cap, weapon-skill, crit, strength/attack-power, agility, stamina]
