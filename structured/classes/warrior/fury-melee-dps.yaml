play_loop:
  guide_section: guide/classes/warrior/fury.md#how-to-play
  opener:
  - Charge
  - Sunder Armor (first GCD)
  - 'Bloodrage (Enrage); DW: right before Bloodthirst'
  single_target:
    2h:
    - Bloodthirst on cooldown
    - Whirlwind on cooldown
    - Slam if Flurry up and cast lands before next auto
    - Heroic Strike queued at rage >= ~70
    dw:
    - Execute if target < 20%
    - Bloodthirst on cooldown
    - Whirlwind on cooldown
    - Heroic Strike only when capping
    - 'Filler: Master Strike > Pummel > Hamstring > Sunder Armor'
    lawnmower:
    - Whirlwind
    - Slam
    - Heroic Strike / Cleave dump
  aoe:
    targets_min: 2
    loop:
    - 'Lawnmower: Sweeping Strikes + Whirlwind first GCD'
    - Whirlwind > Cleave > Bloodthirst/Slam (2H)
    - 'DW: Bloodthirst/Whirlwind on cooldown, Cleave instead of Heroic Strike'
  cooldowns:
  - 'Death Wish: last ~30 s or Execute phase'
  - 'Recklessness: pull in DPS races (30 min cd shared with Shield Wall/Retaliation)'
  - 'Bloodrage: pull, and into Execute on fights >= 1:15'
  - Mighty Rage Potion / Juju Flurry / Bloodrage are off the GCD
  resource_rules:
  - bank rage before 20% for Execute
  - Heroic Strike is a dump, never instead of a skill; skip during DW Execute
  - queued Heroic Strike unqueues below its cost
  - stance swap keeps max 25 rage
  situational:
  - Slam castable while moving
  - Whirlwind instead of Slam if next auto < ~1 s
  - Improved Berserker Rage breaks roots (not in Sanv Tas'dal add phase)
  - 'DW: no stance-dance for Overpower'
