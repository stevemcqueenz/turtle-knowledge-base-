rotation_single:
- priority: 0
  action: Charge -> Sunder Armor -> Bloodrage (Enrage)
  condition: 'opener; DW: Bloodrage just before Bloodthirst so two BTs fit in Enrage'
  sources:
  - '[[d:warrior#1459198336731975701]]'
  - '[[d:warrior#1430101399722659933]]'
- priority: 1
  action: Execute
  condition: target <= 20%; bank rage before 20%; costs 10 rage
  sources:
  - '[[d:warrior#1494705955731013692]]'
  - '[[d:warrior#1467491606910472306]]'
- priority: 2
  action: Bloodthirst
  condition: off cooldown; never delay it for Slam
  sources:
  - '[[d:warrior#1485723095900618782]]'
- priority: 3
  action: Whirlwind
  condition: off cooldown, also on single target; press instead of Slam if next auto < ~1 s
  sources:
  - '[[d:warrior#1478767553613529244]]'
  - '[[d:warrior#1491955711876399265]]'
- priority: 4
  action: Slam
  condition: '2H only: Flurry up and the cast lands before the next auto (5/5 Flurry: 1.92 s cast)'
  sources:
  - '[[d:warrior#1485723095900618782]]'
  - '[[d:warrior#1485731806379639005]]'
- priority: 5
  action: Heroic Strike (queue)
  condition: rage >= ~70; queued swing generates no rage; skip during Execute phase
  sources:
  - '[[d:warrior#1489434203748696215]]'
  - '[[d:warrior#1431724717789679626]]'
- priority: 6
  action: 'Filler: Master Strike > Pummel > Hamstring > Sunder Armor'
  condition: DW, when BT and WW are on cooldown (fish Windfury/Crusader)
  sources:
  - '[[d:warrior#1429836696479989844]]'
- priority: 7
  action: 'Lawnmower: Whirlwind > Slam, HS/Cleave dump'
  condition: Lawnmower build (no Bloodthirst)
  sources:
  - '[[d:warrior#1472301913780257053]]'
- priority: 8
  action: Battle Shout
  condition: buff missing
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Sweeping Strikes
  condition: Lawnmower; with Whirlwind on first GCD
  sources:
  - '[[d:warrior#1490378739639517226]]'
- targets_min: 2
  priority: 2
  action: Whirlwind
  condition: off cooldown
  sources:
  - '[[d:warrior#1426297528571265036]]'
- targets_min: 2
  priority: 3
  action: Cleave
  condition: replaces Heroic Strike as the rage dump (Ravager reduces cost)
  sources:
  - '[[d:warrior#1484033434824216647]]'
- targets_min: 2
  priority: 4
  action: Bloodthirst / Slam
  condition: between Whirlwinds
- targets_min: 2
  priority: 5
  action: Execute low mobs
  condition: only on slow pulls where rage would decay anyway
  sources:
  - '[[d:warrior#1441906156040622121]]'
aoe_threshold:
  value: 2
  note: Whirlwind/Cleave from 2 targets (Whirlwind hits up to 4); no measured crossover number exists
cooldowns:
- name: Death Wish
  use_when: last ~30 s of fight or Execute phase; twice on long fights
  sources:
  - '[[d:warrior#1482492282388091114]]'
  - '[[d:warrior#1431726255010480278]]'
- name: Recklessness
  use_when: almost any time; on pull in DPS races; shares 30-min CD with Shield Wall/Retaliation
  sources:
  - '[[d:warrior#1431726048051069100]]'
  - '[[d:warrior#1462506610068029502]]'
- name: Bloodrage
  use_when: pull, again into Execute on fights >= 1:15 (procs Enrage)
  sources:
  - '[[d:warrior#1433266387962560572]]'
- name: Juju Flurry + Mighty Rage Potion + Bloodrage
  use_when: one off-GCD macro in Execute phase
  sources:
  - '[[d:warrior#1494010684982296686]]'
- name: Berserker Rage (Improved)
  use_when: break roots/slows (Kara40 curses, Noth, Gothik); NEVER in Sanv Tas'dal add phase
  sources:
  - '[[d:warrior#1421142174874996736]]'
  - '[[d:warrior#1468022689401929761]]'
- name: Perception (Human)
  use_when: pre-pull, not Execute phase
  sources:
  - '[[d:warrior#1493965706062987575]]'
resource_rules:
- Rage per hit = (dmg*7.5/230.6)/1.075 + base_swing*3.5/2.25 (7.5 on crit) [[d:warrior#1494491071366037607]]
- Heroic Strike swings generate no rage; Slam does not replace the auto [[d:warrior#1474975775479562512]]
- 'A queued HS unqueues when rage drops below its cost: bind to mouse wheel [[d:warrior#1443033417167016138]]'
- Stance swaps keep at most 25 rage with Tactical Mastery [[d:warrior#1472637583208222984]]
- Stay in Berserker Stance; DW never stance-dances for Overpower [[d:warrior#1470401675914117132]]
consumables:
- 'Core: Juju Power, Juju Flurry, Elixir of the Mongoose, R.O.I.D.S./Scorpok, Mighty Rage Potion, Spirit of Zanza, Goblin
  Sapper Charge (Engineering) [[d:warrior#1450216814180307005]]'
- Flask mandatory in Naxx [[d:warrior#1466476942969540660]]; no world buffs on Turtle raids [[d:warrior#1419751583184457878]]
- Juju Power does not stack with Elixir of the Giants [[d:warrior#1433923153813573694]]; Mongoose does not stack with Emerald
  Mongoose [[d:warrior#1486113106873679943]]
- Diamond Flask = 75 Strength, second Death Wish [[d:warrior#1485804733242544260]]
- 'Kara40: Elixir of Demonslaying, resistance potions, Restorative Potion (Echo), LIPs for Kruul [[d:warrior#1465807734892138659]]'
mistakes_to_avoid:
- 2H Fury in fresh-60 gear below ~23% unbuffed crit [[d:warrior#1469009070210941099]]
- Delaying Bloodthirst/Whirlwind to fit Slam [[d:warrior#1485723095900618782]]
- Fast main hand as DPS [[d:warrior#1494053824065704156]]
- Weapon skill 316+ [[d:warrior#1479840926296838307]]
- Heroic Strike at low rage or during Execute phase [[d:warrior#1431724717789679626]]
- Stance-dancing for Overpower as DW [[d:warrior#1470401675914117132]]
- Treating the 2026-01-15 "Bard spec" developer statement as real [[d:warrior#1461118596322431241]]
leveling:
  spec_consensus: Fury is the best solo leveling spec post-1.18.1; Arms if you have a healer [[d:warrior#1484971008153747569]]
    (consensus); no-respec route Fury (Cruelty) to ~30 then Arms with a 2H, DW when Blood Drinker is reachable [[d:warrior#1486645720646942790]]
    (single source)
  hc_fury_build:
    code: FQLAIYD-FoAAJYAoZBVAB-
    points_source: '[[d:warrior#1469876907020652688]]'
    era: 1.18.1-announced-pre-release
  early_60: Level Fury first (Cruelty is the one must-have), use a 2-hander the whole time, go DW once Blood Drinker is reachable;
    stack agility until rage-capped while spamming HS, then fish with Hamstring
  early_60_sources:
  - '[[d:warrior#1486645720646942790]]'
  - '[[d:warrior#1487172105962524866]]'
  - '[[d:warrior#1491097877127106590]]'
  brackets: see leveling_by_bracket in arms-melee-dps.yaml (same channel findings)
