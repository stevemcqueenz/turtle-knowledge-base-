patch_validity:
  written_for: "1.18.0 (live 2025-08-15), 1.18.1-lowered Opportunity"
  valid_for_1181: true
  notes: "1.18.1 only reduced Opportunity (4/8/12/16/20% -> 3/6/9/12/15%) and cut Blade Flurry's energy penalty (30% -> 20%, a buff). No source posts a full build after 2026-01-23; the 2025-09-29 'Bayanni' link predates the announcement. Rotation and gearing logic are otherwise unchanged."
