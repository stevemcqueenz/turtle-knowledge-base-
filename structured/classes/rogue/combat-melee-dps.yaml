stat_weights:
  hit: "top priority to the 9% special-attack cap (vanilla baseline convention used by posters, not a staff number)"
  weapon_skill: "305-315; pushes misses/glancing blows off the hit table"
  agility: "high; also reduces time between energy ticks via Blade Rush (measured ~100 agi = 0.1s reduction, single measurement)"
  crit: "high once hit-capped; watch the crit cap (~28% unbuffed reported at level 57 in dungeon gear, single player figure)"
  haste: "low; 'equal crit outperforms equal haste' per one poster since haste only affects auto-hits and neither energy regen nor special-attack damage is haste-scaled pre-Blade-Rush"
  armor_penetration: "very low; \"ARP is a wild card stat that doesn't even do anything in many cases\""
  weapon_speed: "~1.3-speed daggers wanted for poison-proc volume; a ~1.8-speed weapon is only the niche spellstrike exception [[d:rogue#1446546660032385118]] (post-1.18.1 consensus)"
  attack_power: "agility is the Combat stat (crit + dodge + AP + Blade Rush energy); stacking pure AP instead is a post-1.18.1 mistake because Blade Rush devalued AP gear [[d:rogue#1407887326088003625]], [[d:rogue#1410185117019672626]]"
  discord_note: "Discord numbers: Blade Rush reduces the energy-tick interval by 0.0012 s per Agility at 2/2 (0.0006 at 1/2), so 600 agi = 20 energy per 1.28 s [[d:rogue#1409388958319644767]], [[d:rogue#1415843605075066951]]; cheat-sheet 15 agi = 1 haste, 1 haste = 1 crit = 1 hit = 25 AP [[d:rogue#1449907721582280765]] (single source)."
caps:
  hit_special_attacks: "9% (vanilla baseline, not a Turtle-confirmed number)"
  weapon_skill_optimum: "308 (one player's claim, unverified) or 315 (Shananagans' claim, unverified); Discord: ~305-315 for Combat, +5 from gear if possible, contested [[d:rogue#1408321275277086793]]"
  hit_special_attacks_discord: "8% quoted post-1.18 (contested against the 9% vanilla figure) [[d:rogue#1407624625059270699]], [[d:rogue#1449692457603436554]]; 5 weapon skill = 1% hit [[d:rogue#1407635403632279602]]"
  crit_cap_white_discord: "white crit cap rises with hit to ~55% at ~24-25% hit; a Naxx-BiS rogue measured a 50.5% effective boss crit cap [[d:rogue#1407624625059270699]], [[d:rogue#1411032364095639644]]"
  energy_income_discord: "sim energy income per spec: Combat 4.71/s, Assassination 3.96/s, Subtlety 3.33/s cap [[d:rogue#1405878977414959154]] (single source)"
rotation_single:
  - {priority: 1, action: "Garrote or Ambush/Cheap Shot opener from stealth", condition: "if the pull allows stealth; raids usually do not"}
  - {priority: 2, action: Backstab, condition: "the only filler for the dagger build; stay behind the target"}
  - {priority: 3, action: "Slice and Dice", condition: "keep up at all times, 2-5 combo points"}
  - {priority: 4, action: "Improved Expose Armor", condition: "only if no warrior is maintaining Sunder Armor"}
  - {priority: 5, action: Rupture, condition: "5 combo points, long fights"}
  - {priority: 6, action: Eviscerate, condition: "5 combo points, target will die before Rupture pays off or target is bleed-immune"}
  - {priority: 7, action: "Surprise Attack", condition: "whenever available (after a dodge); macro it ahead of the builder"}
  - {priority: 8, action: "Sinister Strike (Swords/Axes/Maces variant)", condition: "replaces Backstab 1:1 for the non-dagger build"}
  - {priority: 9, action: "Backstab for combo points, 1-CP Envenom upkeep, 5-CP Eviscerate", condition: "post-1.18.1 Combat-envenom (24/27/0); Envenom is a maintenance buff that holds the Deadly stack, not a damage finisher", sources: ["[[d:rogue#1488169766530318456]]", "[[d:rogue#1485641027560673372]]"], agreement: consensus, era: post-1.18.1}
  - {priority: 10, action: "Sinister Strike + 1-CP Envenom/SnD, then 1-CP Eviscerate", condition: "the SS 'evis-spam' form of the same 24/27/0 hybrid (sims best, called the most braindead spec; contested)", sources: ["[[d:rogue#1486038172336001174]]", "[[d:rogue#1485960977337024592]]"], agreement: contested, era: post-1.18.1}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "toggle Blade Flurry on", condition: "2+ targets; it is the class's only cleave"}
  - {targets_min: 2, priority: 2, action: "toggle Blade Flurry off", condition: "as soon as only one target remains (-20% damage, -20% energy regen while active)"}
  - {targets_min: 4, priority: 1, action: "same as 2-3 targets; no additional tools", condition: "rogue has no true AoE; accept low parses"}
aoe_threshold: 2
cooldowns:
  - {name: "Adrenaline Rush", use_when: "on pull once Slice and Dice/Expose Armor are up, and on every cleave pack with Blade Flurry (3-min cooldown)"}
  - {name: "Blade Flurry", use_when: "a toggle, not a cooldown; on for 2+ targets, off for single target"}
  - {name: Vanish, use_when: "second trinket-proc window in raids, or aggro reset"}
  - {name: "Evasion / Sprint", use_when: "4-min baseline cooldown each since Class Changes 2; defensive/repositioning"}
  - {name: "Vanish", use_when: "threat reset and a second trinket-proc window (trinket-swap on Vanish); Cold Blood is dropped by some post-1.18.1 Assassination raiders", sources: ["[[d:rogue#1407474034349969448]]", "[[d:rogue#1415937515172528249]]"], agreement: consensus, era: pre-1.18.1}
resource_rules:
  - "Baseline energy: 20 per 2 seconds"
  - "Relentless Strikes returns 20 energy on 5-point finishers"
  - "Blade Rush (Combat row 6) reduces time between energy ticks by an amount tied to Agility (unverified formula, ~100 agi = 0.1s per one measurement)"
  - "Darkmantle 4-piece set bonus procs bonus energy on melee hits"
  - "Do not apply a combo-point builder to an add; it wipes the boss's combo points (combo points persist per target since CC2, but only within a single target's pool)"
consumables:
  - "Instant Poison x2 (or weapon stones for Naxx undead content -- unresolved, see gaps)"
  - "Thistle Tea"
  - "Mongoose / jujus / food buffs"
  - "Oil of Immolation or Dragonbreath Chili for pack padding"
  - "Free Action Potion / Restorative Potion for mechanics"
  - "Concoction of the Emerald Mongoose instead of Elixir of Mongoose: 2% spell crit (poisons) + 2% physical crit in one consume [[d:rogue#1410790635442671830]]"
  - "Thistle Tea optimally at exactly 0 energy with a free GCD [[d:rogue#1342009613259903067]]"
  - "Cooldown sharing: Potion of Quickness shares a CD with protection potions; Thistle Tea shares with Health Stones [[d:rogue#1421159028498759741]]"
mistakes_to_avoid:
  - "Using Sinister Strike or Ghostly Strike with daggers instead of Backstab"
  - "Forgetting to keep Slice and Dice up"
  - "Leaving Blade Flurry on during single target, or toggling it with a single spam macro instead of separate on/off macros"
  - "Applying a combo-point builder to an add, wiping the boss's combo points"
  - "Stacking crit before reaching the hit cap"
  - "Using Blade Flurry while leveling/under-geared (energy starvation until roughly 800 agility)"
  - "Expecting to out-parse well-played Warriors pre-1.18.0 (an ~18% gap was reported in March 2025) or bragging about parses that exclude Warriors"
  - "Using Sinister Strike with daggers; macro a sword/mace/fist weapon swap instead [[d:rogue#1424148190663278846]]"
  - "Taking Murder as a beginner: most raid bosses are not the covered creature types [[d:rogue#1411665605706252380]]"
  - "Blindly stacking Agility on sword Combat — energy overcaps with Adrenaline Rush; the mix is gear-dependent [[d:rogue#1426272445949546630]]"
  - "Treating pre-1.18.0 BiS AP gear as current: the 1.18.0 agi/Blade-Rush rework retroactively devalued it [[d:rogue#1410185117019672626]]"
  - "Skipping the per-pack poison swap post-1.18.1: Dissolvent/Corrosive do nothing on the wrong creature type [[d:rogue#1484754354433953915]]"

leveling_by_bracket:
  source_note: "Discord #rogue; citations resolve in structured/discord/evidence-rogue.jsonl"
  brackets:
    - {bracket: "1-10", advice: "Quest on Sinister Strike/Eviscerate or Backstab/Ambush; dual wield unlocks at 10; start lockpicking/poison skill", sources: ["[[d:rogue#1355443254015033394]]", "[[d:rogue#1355443795524587603]]"], era: pre-1.18.1, agreement: single source}
    - {bracket: "10-19", advice: "Combat swords (smoothest) or Ambush/Backstab daggers (Remorseless -> Imp Backstab -> Imp Ambush); Imp Gouge is a lifesaver; Deadmines/SFK daggers", sources: ["[[d:rogue#1310955868933586985]]", "[[d:rogue#1312496085784072232]]", "[[d:rogue#1286056902975029313]]"], era: pre-1.18.1, agreement: consensus}
    - {bracket: "20-29", advice: "Poison class quest at 20 (dangerous); learn frontstab; pickpocket lockboxes 20-30 are level-1 boxes", sources: ["[[d:rogue#1003729345174569090]]", "[[d:rogue#1131138509588140062]]"], era: pre-1.18.1, agreement: consensus}
    - {bracket: "30-39", advice: "Vanquisher's Sword + Sword of Omen/Serenity at ~40; Gut Ripper ~40; frontstab costs more damage taken", sources: ["[[d:rogue#1165510276062384150]]", "[[d:rogue#1136264023206268989]]"], era: pre-1.18.1, agreement: consensus}
    - {bracket: "40-49", advice: "Respec Assassination for Noxious Assault; Envenom single-target; double Instant Poison; Coldrage/Ghaz'rilla daggers; 1.30 daggers wanted", sources: ["[[d:rogue#1425614628385325138]]", "[[d:rogue#1455712360433189117]]", "[[d:rogue#1324107314747408587]]"], era: mixed, agreement: consensus}
    - {bracket: "50-60", advice: "Finish Assassination or frontstab line; respec to endgame at 58-60; Barman Shanker/Gut Ripper carry to 60", sources: ["[[d:rogue#1458113459639156888]]", "[[d:rogue#1431531176333541396]]"], era: 1.18.1-announced-pre-release, agreement: consensus}
    - {bracket: general, advice: "Rested XP via survival tents at Crossroads lets you skip bad quests; stealth detection worsens with level; hardcore: Precision + Remorseless near-mandatory, Riposte/Imp Sprint for survival", sources: ["[[d:rogue#1047182469792800849]]", "[[d:rogue#1012791496841383997]]", "[[d:rogue#1360325720752001295]]"], era: pre-1.18.1, agreement: consensus}
  route: "Combat/dagger to 40 -> respec Assassination (Noxious Assault) at 40 -> respec to the raid spec at 58-60"
  route_sources: ["[[d:rogue#1425614628385325138]]", "[[d:rogue#1455712360433189117]]", "[[d:rogue#1458113459639156888]]"]

