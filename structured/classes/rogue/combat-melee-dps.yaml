    target; 25% caps dual-wield autos [[d:rogue#1461126609196023922]], [[d:rogue#1462102234874511605]], [[d:rogue#1467164411058983042]]
  weapon_skill: 310 minimum, 313 good, 315 optimal; glancing reduction stops at 315, hit from skill keeps counting [[d:rogue#1484908242193875065]],
    [[d:rogue#1470964213743620261]]
  agility: 'top secondary: AP + crit (1% per ~29) + Blade Rush energy (-0.0012 s tick per point); ~1.7 AP baseline, ~2 AP
    for Combat [[d:rogue#1445046771288899736]], [[d:rogue#1474384784255094998]], [[d:rogue#1492522664852586516]]'
  crit: ~25 AP per 1% until the ~55% crit cap; worth more for Combat than Assassination [[d:rogue#1492516625650417695]], [[d:rogue#1465627335121309697]]
  haste: multiplicative with Slice and Dice [[d:rogue#1387271666970787983]]
  armor_penetration: very low; "ARP is a wild card stat that doesn't even do anything in many cases"
  weapon_speed: 'Combat Envenom: main-hand speed barely matters in single target (slow MH helps Blade Flurry); off hand as
    fast as possible [[d:rogue#1487049641517383680]], [[d:rogue#1486738916844503212]]'
  attack_power: below Agility; AP enchants beat Agility on ~60 s fights in one unconfirmed test [[d:rogue#1491100440224338002]]
  discord_note: Sim everything on combatgum.app [[d:rogue#1484243895675129986]]
caps:
  hit_special_attacks: 8% vs +3-level boss (5% vs same level) [[d:rogue#1461126609196023922]]
  hit_white_dual_wield: 25% [[d:rogue#1462102234874511605]]
  crit_cap_white: ~55% at 25% hit; bosses suppress 3% crit [[d:rogue#1493026633861566725]], [[d:rogue#1483660333305561127]]
  weapon_skill_optimum: 315 [[d:rogue#1484908242193875065]]
  agility_energy: energy tick = 2 s - 0.0012 s per Agility (500 agi -> 1.4 s); ~400 buffed agi to feel it, ~800 for ~1 s ticks
    [[d:rogue#1474384784255094998]], [[d:rogue#1462569850768724213]], [[d:rogue#1462133009389195521]]
rotation_single:
- priority: 1
  action: Envenom (1 combo point)
  condition: Envenom missing or about to expire; cast Envenom before Slice and Dice (~50 DPS)
  sources:
  - '[[d:rogue#1484581432889442335]]'
  - '[[d:rogue#1488169648573907026]]'
- priority: 2
  action: Slice and Dice (1 combo point)
  condition: Slice and Dice missing or about to expire
  sources:
  - '[[d:rogue#1488169648573907026]]'
- priority: 3
  action: Eviscerate
  condition: 'combo points == 5 (not 1-point spam); optional: 2-4 point Eviscerate when a buff is about to drop and points
    > 1'
  sources:
  - '[[d:rogue#1488169648573907026]]'
  - '[[d:rogue#1492048302794080369]]'
  - '[[d:rogue#1486749401731825879]]'
- priority: 4
  action: Surprise Attack
  condition: usable (after a dodge) AND energy <= 80
  sources:
  - '[[d:rogue#1492170434672595226]]'
- priority: 5
  action: Backstab
  condition: main hand is a dagger AND behind target
  sources:
  - '[[d:rogue#1487600151974641806]]'
- priority: 6
  action: Sinister Strike
  condition: main hand is a sword/axe/mace/fist; never with a dagger main hand (swap weapons instead when you cannot be behind)
  sources:
  - '[[d:rogue#1489272040014745860]]'
  - '[[d:rogue#1447254729154494575]]'
- priority: 7
  action: 'Adrenaline Rush build only: keep Slice and Dice + 5-point Rupture (Taste for Blood); Adrenaline Rush right after
    a 5-point Rupture; Eviscerate only if both buffs have 20+ s left'
  condition: talents include Adrenaline Rush; no Envenom
  sources:
  - '[[d:rogue#1462618589298168065]]'
  - '[[d:rogue#1424148190663278846]]'
  - '[[d:rogue#1462637371756384276]]'
- priority: 0
  action: 'Opener: pre-load a combo point on a critter and carry it with Slice and Dice; open with Backstab/Sinister Strike,
    not stealth'
  condition: pull
  sources:
  - '[[d:rogue#1480688682787667988]]'
  - '[[d:rogue#1468327294430085130]]'
rotation_aoe:
- targets_min: 2
  priority: 1
  action: toggle Blade Flurry on (hits exactly one extra target; -20% energy regen)
  condition: 2+ enemies in melee range; slow main hand
  sources:
  - '[[d:rogue#1468684315079479351]]'
  - '[[d:rogue#1491477144294002869]]'
- targets_min: 1
  priority: 1
  action: toggle Blade Flurry off
  condition: only one target left; poisons/procs/bleeds never hit the second target
  sources:
  - '[[d:rogue#1473731055390298133]]'
  - '[[d:rogue#1475398289737388193]]'
- targets_min: 2
  priority: 2
  action: keep Instant Poison on both weapons through mixed trash instead of swapping
  condition: MC-style mixed packs
  sources:
  - '[[d:rogue#1491477644133531930]]'
aoe_threshold: 2
cooldowns:
- name: Adrenaline Rush (AR build)
  use_when: after a 5-point Rupture; once at pull if kill < ~3 min, twice if longer [[d:rogue#1424148190663278846]], [[d:rogue#1446573952553058305]]
- name: Blade Flurry
  use_when: toggle on at 2+ targets, off at 1
- name: Vanish
  use_when: threat reset when approaching the tank; swap active trinket to passive (new active needs 30 s before use) [[d:rogue#1465825152125374744]],
    [[d:rogue#1465825846521626935]], [[d:rogue#1494011328833261689]]
- name: Thistle Tea
  use_when: energy starved, e.g. in burst windows
- name: Active trinkets / Badge of the Swarmguard
  use_when: boss burst (with AR); passives such as DFT on trash [[d:rogue#1487230426148765727]]
resource_rules:
- Base energy 20 per 2 s; Blade Rush removes 0.0012 s from the tick per Agility [[d:rogue#1489263649020182698]], [[d:rogue#1474384784255094998]]
- 'Ruthlessness always refunds 1 combo point after a finisher: use it for the 1-point buff refreshes [[d:rogue#1451736486822154462]]'
- A dodged/parried builder costs only ~7 energy [[d:rogue#1480274083160789204]]
- Combo points persist on a living target; a new combo point on another target resets them [[d:rogue#1465788380661944452]],
  [[d:rogue#1482311939945267351]]
- 'Do not double-press finishers: a 1-point cast can overwrite a 5-point one [[d:rogue#1479064018260856862]]'
- 'Threat: delay burst until the tank has threat; Feint lowers generation only; Vanish resets [[d:rogue#1490058561286443039]],
  [[d:rogue#1455361248580468992]]'
consumables:
- Elixir of the Mongoose, Ground Scorpok Assay, Elixir of Giants or Juju Power [[d:rogue#1487503305411133572]], [[d:rogue#1490366630889525258]]
- Juju Might or Winterfall Firewater; they do not stack [[d:rogue#1487503517114695731]], [[d:rogue#1479004139613589674]]
- 'Food: Danonzo''s Tel''Abim Medley (haste) > new 20-Agility food > Sour Mountain Berries; 20-Agility food does not stack
  with Mongoose (bug) [[d:rogue#1487502956340449493]], [[d:rogue#1490660870735269889]]'
- Spirit of Zanza (persists through death), Elixir of Fortitude, Rumsey Rum Black Label [[d:rogue#1468626095870968022]]
- 'Thistle Tea, Potion of Quickness, Juju Flurry; macro: /cast Potion of Quickness /cast Juju Flurry /cast Perception /use
  13 /use 14 [[d:rogue#1488940969112899817]]'
- Greater Fire Protection Potions on the MC fights that need them; no FR gear [[d:rogue#1466871272490139770]], [[d:rogue#1463441701543870587]]
- Goblin Sapper Charges and Gnomish Battle Chicken (Engineering) [[d:rogue#1463477543666581601]]
- 'Poisons: Instant both hands by default; a second weapon pair with Dissolvent for Elementals/Mechanicals/Giants/Undead [[d:rogue#1484557710065406146]],
  [[d:rogue#1484513053876949133]]'
- 'Stacking: same-stat consumables do not stack (Mongoose/Agility potion, Firewater/Black Juju, Giants/Juju Power); Blasted
  Lands buff and Agility food stack with everything; a concoction does not stack with its components [[d:rogue#1479004361744056492]],
  [[d:rogue#1488825686587215956]]'
mistakes_to_avoid:
- Running Rupture + Taste for Blood with Envenom [[d:rogue#1486815192690987191]]
- Sinister Strike with a dagger main hand [[d:rogue#1489272040014745860]]
- Blade Flurry left on in single target, or with a fast main hand [[d:rogue#1473731055390298133]], [[d:rogue#1487361136171941889]]
- 1-point Eviscerate spam instead of 5-point Eviscerates [[d:rogue#1488169648573907026]]
- Dissolvent/Corrosive on Humanoids, Beasts, Dragonkin or Demons (they no longer apply) [[d:rogue#1484513053876949133]]
- Stormshroud into BWL (no Agility) [[d:rogue#1488910311829278750]]
- Taking Improved Expose Armor in Combat Envenom (costs Efficient Poisons) [[d:rogue#1489309057008537871]]
- Assuming pre-1.18.1 builds with Taste for Blood 3/3 are valid (2 ranks now)
leveling_by_bracket:
  source_note: 'Discord #rogue; citations resolve in structured/discord/evidence-rogue.jsonl'
  brackets:
  - bracket: 1-10
    advice: Quest on Sinister Strike/Eviscerate or Backstab/Ambush; dual wield unlocks at 10; start lockpicking/poison skill
    sources:
    - '[[d:rogue#1355443254015033394]]'
    - '[[d:rogue#1355443795524587603]]'
    era: pre-1.18.1
    agreement: single source
  - bracket: 10-19
    advice: Combat swords (smoothest) or Ambush/Backstab daggers (Remorseless -> Imp Backstab -> Imp Ambush); Imp Gouge is
      a lifesaver; Deadmines/SFK daggers
    sources:
    - '[[d:rogue#1310955868933586985]]'
    - '[[d:rogue#1312496085784072232]]'
    - '[[d:rogue#1286056902975029313]]'
    era: pre-1.18.1
    agreement: consensus
  - bracket: 20-29
    advice: Poison class quest at 20 (dangerous); learn frontstab; pickpocket lockboxes 20-30 are level-1 boxes
    sources:
    - '[[d:rogue#1003729345174569090]]'
    - '[[d:rogue#1131138509588140062]]'
    era: pre-1.18.1
    agreement: consensus
  - bracket: 30-39
    advice: Vanquisher's Sword + Sword of Omen/Serenity at ~40; Gut Ripper ~40; frontstab costs more damage taken
    sources:
    - '[[d:rogue#1165510276062384150]]'
    - '[[d:rogue#1136264023206268989]]'
    era: pre-1.18.1
    agreement: consensus
  - bracket: 40-49
    advice: Respec Assassination for Noxious Assault; Envenom single-target; double Instant Poison; Coldrage/Ghaz'rilla daggers;
      1.30 daggers wanted
    sources:
    - '[[d:rogue#1425614628385325138]]'
    - '[[d:rogue#1455712360433189117]]'
    - '[[d:rogue#1324107314747408587]]'
    era: mixed
    agreement: consensus
  - bracket: 50-60
    advice: Finish Assassination or frontstab line; respec to endgame at 58-60; Barman Shanker/Gut Ripper carry to 60
    sources:
    - '[[d:rogue#1458113459639156888]]'
    - '[[d:rogue#1431531176333541396]]'
    era: 1.18.1-announced-pre-release
    agreement: consensus
  - bracket: general
    advice: 'Rested XP via survival tents at Crossroads lets you skip bad quests; stealth detection worsens with level; hardcore:
      Precision + Remorseless near-mandatory, Riposte/Imp Sprint for survival'
    sources:
    - '[[d:rogue#1047182469792800849]]'
    - '[[d:rogue#1012791496841383997]]'
    - '[[d:rogue#1360325720752001295]]'
    era: pre-1.18.1
    agreement: consensus
  route: Combat/dagger to 40 -> respec Assassination (Noxious Assault) at 40 -> respec to the raid spec at 58-60
  route_sources:
  - '[[d:rogue#1425614628385325138]]'
  - '[[d:rogue#1455712360433189117]]'
  - '[[d:rogue#1458113459639156888]]'
