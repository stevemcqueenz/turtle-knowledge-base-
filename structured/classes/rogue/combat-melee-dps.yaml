guide: guide/classes/rogue/combat.md
stat_priority:
- hit
- weapon-skill
- agility
- crit
- attack-power
stat_priority_note: 'Hit first to the 9% special-attack cap (lower with racial or item weapon skill — 305 skill makes 9% easy
  to reach, 308 is called the optimum). Weapon skill also pushes misses and glancing blows off the hit table. Agility now
  drives energy regeneration through Blade Rush as well, measured at roughly 0.1 s off the tick per 100 agility. Watch the
  crit cap: past it, crit and agility lose value and hit becomes the premium stat again. Agility, crit and attack power are
  a tie: no cited post ranks them against each other, so their order in the array above carries no ranking. Grouping them
  is this repository''s reading of the sources listed above.'
