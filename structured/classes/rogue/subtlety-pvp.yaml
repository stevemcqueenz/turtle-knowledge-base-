stat_weights:
  stamina: high (PvP BiS list is Tier-3/3.5 heavy)
  hit: to not miss openers
  crit: for Ambush
  agility: generic
  stealth_level_detection: 'situational gear swaps for the opener war (see gear list); no numeric weights given anywhere (gap).
    Discord: Vanish gives 1 s spell immunity and a ''+54 real levels of stealth'' modifier (theory) [[d:rogue#1479856314137186385]];
    a Night Elf in full +stealth gear is effectively level-65.5 stealth, detectable only by Perception [[d:rogue#1401580440078389329]];
    stacking rules unresolved [[d:rogue#1413550321296212028]]'
caps: {}
rotation_single:
- priority: 1
  action: Garrote -> Rupture -> Ghostly Strike -> Flourish -> Disarm -> Evasion
  condition: opener vs melee
  sources:
  - '[[d:rogue#1459141070452555788]]'
- priority: 2
  action: Sinister Strike/Hemorrhage to 5 -> Kidney Shot
  condition: ''
  sources:
  - '[[d:rogue#1459141070452555788]]'
- priority: 3
  action: Rupture then Vanish; reopen; Preparation to repeat
  condition: bleed/poison ticks keep pressure
  sources:
  - '[[d:rogue#1459141070452555788]]'
- priority: 4
  action: Ambush -> Kidney Shot -> autos -> Vanish -> Ambush
  condition: dagger variant vs cloth
  sources:
  - '[[d:rogue#1484647270224887849]]'
rotation_aoe: []
aoe_threshold: 999
cooldowns:
- name: Preparation
  use_when: 7-min cooldown; resets Vanish/Blind/Sprint/Cold Blood for a second full engagement (Hemo/Prep build only)
- name: Vanish
  use_when: disengage or re-opener; useless if used while already in melee range (breaks you out immediately)
- name: Cold Blood
  use_when: guarantee a crit on the opener, per the older pre-CC2 build notes
resource_rules:
- Combo points persist per target since Class Changes 2; a second target no longer wipes the first target's points
- Off-hand poison procs are intentionally rarer than main-hand procs
- Cleanse DoTs/poisons before Vanishing (Restorative Potion, Anti-Venom, Elixir of Poison Resistance, Jungle Remedy; Dwarves
  get Stoneform)
consumables:
- Instant Poison main hand + Crippling Poison off hand (default PvP loadout)
- Mind-numbing Poison vs casters
- Wound Poison vs healers
- Free Action Potion, Insignia, Restorative Potion, Catseye Elixir, Thistle Tea
- Sweet 'N Crunchy Fruit Bread (5-min shared cooldown with Poisonous Mushroom since 2026-01-20)
mistakes_to_avoid:
- Fighting in the mid-field zerg instead of playing objectives (flag rooms, ninja caps, EFC hunting)
- Opening on ferals, paladins, or geared warriors with their cooldowns already up
- Applying a DoT poison or Rupture to a target you need to Blind/Gouge/Sap
- Vanishing while still in melee range or with DoTs ticking on you
- Assuming stealth hides you at short range against players (detection-tick jank; see leveling.md)
- Expecting the Noxious Assault PvP build (assassination-pvp.yaml) to provide equivalent control
- Using Dissolvent/Corrosive on players post-1.18.1 (they do not apply) [[d:rogue#1488216301460783246]]
- 'Assuming Improved Sap is a BG opener: it costs 65 energy and telegraphs your position [[d:rogue#1443806889287618723]]'
- Daggers in a Hemorrhage build [[d:rogue#1487257382294781983]]
- Dissolvent/Corrosive vs players [[d:rogue#1488216301460783246]]
pvp_matchups:
  source_note: Discord's post-1.18.1 matchup verdicts; forum matchups are mostly pre-1.18.1. Citations resolve in evidence-rogue.jsonl
    / evidence-pvp-general.jsonl.
  warrior: contested/losing at full PvP gear post-1.18.1 [[d:rogue#1491339462997708932]], [[d:rogue#1491646337018499214]];
    pre-1.18.1 rogue-favoured unless the warrior has FAP or is an Orc [[d:pvp-general#1075876537380917278]]
  druid: hard losing; 'cannot win without Assassination' [[d:rogue#1417742111683645543]], [[d:rogue#1417181852879290558]];
    near-unwinnable while the druid stays in bear [[d:pvp-general#1103744129785135164]]
  paladin: losing pre-1.18.1 vs geared paladins; post-1.18.1 Sub rogues claim they 'easily control' paladins with cooldowns
    up [[d:rogue#1489352355693592637]] (contested)
  shaman: 'contested: ''no defensive cooldown, easier target'' [[d:rogue#1492644310234038463]] vs a documented full CC chain
    being needed [[d:rogue#1492634440856375468]]'
  hunter: losing; naxx survival hunters named among the hardest, kill the pet and re-Sap [[d:rogue#1419668962408661117]],
    [[d:pvp-general#1336091851278520433]]
  warlock: losing, worse with gear; naxx affliction locks and Soul Link are hard counters [[d:rogue#1436599924669153381]],
    [[d:pvp-general#1138484964078399500]]
  priest: undead wins ('there is literally nothing they can do' vs WotF) [[d:rogue#1417785062346330112]]; dagger rogues expected
    to 'smoke' mage/priest [[d:rogue#1404094602876813373]]
  mage: contested; historically 'perma farmed by mages' but a dagger rogue is expected to win [[d:rogue#1403976474817462482]],
    [[d:pvp-general#1278955218364530803]]
  rogue: decided by who lands CC/stealth first; racial stealth level and Human Perception are the levers [[d:rogue#1419668962408661117]],
    [[d:rogue#1436632429300420629]]
pvp_gear_discord:
  counterplay: 'post-1.18.1 anti-rogue set: ~30 nature resistance on the new PvP set, up to 21% crit reduction (AB 3/3 12%
    + 2-piece Arena 3% + Arena ring 3% + Belt Buckle 3%), Greater/elemental Nature Protection potions [[d:rogue#1487419470443057284]],
    [[d:rogue#1465337336270426224]], [[d:rogue#1484489992918139020]]'
  weapons: 1.8-speed PvP sword claimed sub-BiS for Subtlety; 2.0-speed PvP dagger called poison-unfriendly; Alcor's off-hand
    is the plate answer for hemo/Prep [[d:rogue#1487857538194997330]], [[d:rogue#1487314461302984735]], [[d:rogue#1487820844712591674]]
  sets: new rewards are K40 ilvl and stronger than the old PvP items, but rogues call the itemisation 'shiit for any specc
    of Rogue' (no agility, STR+stam only) [[d:rogue#1484635445781598238]], [[d:rogue#1487374863722352680]], [[d:rogue#1491338903439937608]]
  consumables: FAPs + Crunchwrap Supremes; Engineering recommended (gnomish chicken is the only offensive DPS gadget; useful
    goblin gadgets are buyable) [[d:rogue#1464363487374606487]], [[d:rogue#1465020246170669089]], [[d:rogue#1470780105117667512]]
pvp_race_order:
  source_note: Discord's channel-local race ranking (pre-1.18.1, single detailed guide, corroborated) [[d:rogue#1360971069737140415]],
    [[d:rogue#1360971823780462692]], [[d:rogue#1361181395459899634]], [[d:rogue#1376712398202998886]], [[d:rogue#1435632812345524244]]
  alliance: Dwarf 5/5 (Stoneform clears a rival rogue's Blind because Blind is a poison), Gnome 5/5 (Escape Artist clears
    nova/Concussive/Crippling, matters most on WSG), Night Elf/Human 3/5, High Elf 0/5
  horde: Orc 4/5 (stun-duration reduction), Undead 4/5 (WotF + underrated Cannibalize), Goblin 4/5 (sprint, +3 dagger), Troll
    2/5
