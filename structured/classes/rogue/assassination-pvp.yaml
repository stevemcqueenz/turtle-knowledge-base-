stat_weights:
  weapon_speed: 1.3-speed daggers preferred, same reasoning as the PvE build
  hit_crit_agility: same qualitative priority as PvE; no PvP-specific numeric weights given (gap); post-1.18.1 Discord adds
    that PvP gear reduces crit, so poison overtakes crit [[d:rogue#1493332911406055564]]
  discord_note: 'gear/weapon-dependent spec choice post-1.18.1: fast weapon + low gear -> Assassination poison (Noxious);
    slow weapon -> old-school Backstab/Sinister Strike or Hemo with Preparation [[d:rogue#1491270099066425475]], [[d:rogue#1491270486402011287]]
    (consensus)'
caps:
  hit_special_attacks_pvp: 5% [[d:rogue#1447086285087969351]]
rotation_single:
- priority: 1
  action: Cheap Shot
  condition: from stealth
- priority: 2
  action: Envenom (1 point)
  condition: after Cheap Shot; Cheap Shot > Envenom > Slice and Dice on big health pools
  sources:
  - '[[d:rogue#1492308177818095657]]'
  - '[[d:rogue#1492308239507918908]]'
- priority: 3
  action: Noxious Assault spam
  condition: until dead or Kidney Shot available
  sources:
  - '[[d:rogue#1492308177818095657]]'
- priority: 4
  action: Kidney Shot
  condition: 5 points (Nandieb; Seal Fate can get you there within Cheap Shot), or whatever you have before Cheap Shot ends
  sources:
  - '[[d:rogue#1492645046049046699]]'
  - '[[d:rogue#1461754013061222613]]'
- priority: 5
  action: Thistle Tea / Cold Blood + Noxious Assault
  condition: burst
  sources:
  - '[[d:rogue#1461753771838406667]]'
rotation_aoe: []
aoe_threshold: 999
cooldowns:
- name: Cheap Shot
  use_when: opener only; this build has no Preparation to reset it
- name: Vanish
  use_when: disengage once energy is spent, not a re-opener (no Preparation)
resource_rules:
- Sin'dorei/Assassination energy pool is 110 (talented); a full stunlock combo (Cheap Shot 4s + Kidney 4s = 8s = 4 energy
  ticks) yields at most 3 Noxious Assaults plus the Kidney, per one player's detailed accounting
- No Dirty Deeds means Cheap Shot costs the full 60 energy instead of 40
- Fast auto-attacks that get fully blocked/parried do not proc poisons, and this build has no way around thorns/high-avoidance
  targets
consumables:
- Instant Poison both hands; swap an off hand to Crippling when needed; no Deadly (breaks Blind) [[d:rogue#1492308267395715185]],
  [[d:rogue#1486568837498273956]]
- Free Action Potion and healing potion on cooldown vs Frost Mage / Shaman [[d:rogue#1475178793286242365]]
- Thistle Tea
mistakes_to_avoid:
- Dissolvent/Corrosive on players (Humanoid; they do nothing) [[d:rogue#1488216301460783246]]
- Deadly Poison when you plan to Blind [[d:rogue#1486568837498273956]]
- Resilience over damage stats [[d:rogue#1458858931781767320]]
pvp_context:
  post_1181_standing: contested — one poster says the patch barely touched Noxious ('quite negligible' damage-wise) and it
    still kills in a stunlock [[d:rogue#1490686616086384782]], [[d:rogue#1491378008232034364]], while another says rogue 'is
    not really playable in pvp' post-patch [[d:rogue#1494436247249354773]]
  bg_role: '''my main utility is to sap a healer pre-fight and interrupt another with cheap shot. Vanish, cheap shot again
    and die. Hard to find any BG leaderbord with a rogue and a positive KD-ratio.'' [[d:rogue#1490678912118948052]] (single
    source, contested)'
  race_order: 'Discord''s channel-local PvP race order: Alliance Dwarf 5/5 (Stoneform clears a rival rogue''s Blind because
    Blind is a poison) and Gnome 5/5 (Escape Artist), Night Elf/Human 3/5, High Elf 0/5; Horde Orc 4/5, Undead 4/5, Goblin
    4/5, Troll 2/5 [[d:rogue#1360971069737140415]], [[d:rogue#1360971823780462692]], [[d:rogue#1361181395459899634]] (single
    source, pre-1.18.1)'
