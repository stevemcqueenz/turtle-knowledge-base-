stat_weights:
  weapon_speed: "1.3-speed daggers preferred, same reasoning as the PvE build"
  hit_crit_agility: "same qualitative priority as PvE; no PvP-specific numeric weights given (gap); post-1.18.1 Discord adds that PvP gear reduces crit, so poison overtakes crit [[d:rogue#1493332911406055564]]"
  discord_note: "gear/weapon-dependent spec choice post-1.18.1: fast weapon + low gear -> Assassination poison (Noxious); slow weapon -> old-school Backstab/Sinister Strike or Hemo with Preparation [[d:rogue#1491270099066425475]], [[d:rogue#1491270486402011287]] (consensus)"
caps: {}
rotation_single:
  - {priority: 1, action: "Cheap Shot from stealth", condition: "60 energy without Dirty Deeds (this build cannot afford Dirty Deeds/Preparation)"}
  - {priority: 2, action: "Envenom at 1-2 combo points immediately", condition: "trades combo points away from a full Kidney Shot -- damage vs control choice"}
  - {priority: 3, action: "Noxious Assault x2, then Kidney Shot at 4 points (4s duration, not 6s)", condition: "during the Cheap Shot stun"}
  - {priority: 4, action: "Noxious Assault x2 more, then Blind if trinketed", condition: "no Preparation to redo Blind"}
  - {priority: 5, action: "Thistle Tea", condition: "for one more Noxious Assault inside the stun"}
  - {priority: 6, action: "Sprint/Vanish out if the target survives at 0 energy", condition: "the build has no follow-up control once energy is spent"}
  - {priority: 7, action: "Post-1.18.1 kill sequence: Cheap Shot -> spam Noxious Assault to 5 CP (Thistle Tea/Seal Fate proc if short) -> Kidney Shot -> only then Envenom + Slice and Dice", condition: "target should be dead or nearly dead when the Cheap Shot stun ends", sources: ["[[d:rogue#1492645046049046699]]"], agreement: single source, era: post-1.18.1}
  - {priority: 8, action: "Always open with Cheap Shot, not Ambush", condition: "crit-reduction gear is everywhere, Backstab needs perfect position plus energy, and Noxious does more damage for less energy", sources: ["[[d:rogue#1493332911406055564]]", "[[d:rogue#1484650626221867089]]"], agreement: consensus, era: post-1.18.1}
  - {priority: 9, action: "vs shaman full 1v1 chain: Cheap Shot -> Nox -> Gouge -> Kidney -> Thistle Tea -> Nox x2 -> Gouge -> (Cold Blood + Eviscerate) or Blind and re-open; on a Blind trinket, Vanish + Cheap Shot or Evasion", condition: "documented matchup", sources: ["[[d:rogue#1492634440856375468]]"], agreement: single source, era: post-1.18.1}
rotation_aoe: []
aoe_threshold: 999
cooldowns:
  - {name: "Cheap Shot", use_when: "opener only; this build has no Preparation to reset it"}
  - {name: Vanish, use_when: "disengage once energy is spent, not a re-opener (no Preparation)"}
resource_rules:
  - "Sin'dorei/Assassination energy pool is 110 (talented); a full stunlock combo (Cheap Shot 4s + Kidney 4s = 8s = 4 energy ticks) yields at most 3 Noxious Assaults plus the Kidney, per one player's detailed accounting"
  - "No Dirty Deeds means Cheap Shot costs the full 60 energy instead of 40"
  - "Fast auto-attacks that get fully blocked/parried do not proc poisons, and this build has no way around thorns/high-avoidance targets"
consumables:
  - "Instant Poison x2 (the only damage poison against player targets post-1.18.1, since Dissolvent/Corrosive no longer apply to players)"
  - "Thistle Tea"
  - "Post-1.18.1 BG advice: Instant on both weapons, not Crippling, because the damage loss is too high [[d:rogue#1492635476308394104]] (single source)"
  - "FAPs + Crunchwrap Supremes are the baseline PvP stack; Greater/elemental Nature Protection potions are the counter to Instant Poison [[d:rogue#1464363487374606487]], [[d:rogue#1484489992918139020]], [[d:rogue#1484455098414534787]]"
mistakes_to_avoid:
  - "Spending combo points on Envenom then expecting a full-length Kidney Shot"
  - "Using Dissolvent or Corrosive Poison on players post-1.18.1 (it no longer applies to them)"
  - "Fighting a target stacking Thorns, Retribution Aura, or Blessing of Sanctuary with fast 1.3-speed weapons"
  - "Staying in melee range at 0 energy instead of resetting with Sprint/Vanish"
  - "Expecting this build to provide control comparable to the Subtlety Hemo/Prep build (see subtlety-pvp.yaml)"
  - "Fighting the 1.18.1 PvP-set counterplay stack: ~30 nature resistance on the new set, up to 21% crit reduction ('resilience'), and Greater Nature Protection potions [[d:rogue#1487419470443057284]], [[d:rogue#1465337336270426224]], [[d:rogue#1484489992918139020]]"

pvp_context:
  post_1181_standing: "contested — one poster says the patch barely touched Noxious ('quite negligible' damage-wise) and it still kills in a stunlock [[d:rogue#1490686616086384782]], [[d:rogue#1491378008232034364]], while another says rogue 'is not really playable in pvp' post-patch [[d:rogue#1494436247249354773]]"
  bg_role: "'my main utility is to sap a healer pre-fight and interrupt another with cheap shot. Vanish, cheap shot again and die. Hard to find any BG leaderbord with a rogue and a positive KD-ratio.' [[d:rogue#1490678912118948052]] (single source, contested)"
  race_order: "Discord's channel-local PvP race order: Alliance Dwarf 5/5 (Stoneform clears a rival rogue's Blind because Blind is a poison) and Gnome 5/5 (Escape Artist), Night Elf/Human 3/5, High Elf 0/5; Horde Orc 4/5, Undead 4/5, Goblin 4/5, Troll 2/5 [[d:rogue#1360971069737140415]], [[d:rogue#1360971823780462692]], [[d:rogue#1361181395459899634]] (single source, pre-1.18.1)"

