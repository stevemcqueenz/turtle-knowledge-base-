stat_weights:
  hit: "top priority (a missed Hemorrhage or finisher drops the Tricks of the Trade stack chain)"
  crit: "feeds Honor Among Thieves energy procs"
  agility_ap: "\"the best stat for Subtlety rogues\" per one rework-proposal poster; not independently measured"
caps: {}
rotation_single:
  - {priority: 1, action: "Garrote opener (Serrated Blades) or none in raids", condition: "if stealth is available"}
  - {priority: 2, action: Hemorrhage, condition: "the only combo-point builder; keep the debuff on the boss (50 charges / 15s)"}
  - {priority: 3, action: "Improved Expose Armor, then Slice and Dice, then Tricks-of-the-Trade-refresh finisher", condition: "use a 4-5 point finisher at least every 12 seconds to maintain 2 Tricks stacks"}
  - {priority: 4, action: "Mark for Death", condition: "on cooldown (8s), aligned with the party's burst cooldowns"}
  - {priority: 5, action: "Shadow of Death", condition: "5 combo points, during party burst windows; costs 30 energy and drops the Tricks stack"}
  - {priority: 6, action: "Cloaked in Shadows (Vanish)", condition: "party takes a predictable raid-wide hit; do not expect to restealth"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Hemorrhage on each add for the melee group's benefit", condition: "no other AoE tool; Blade Flurry costs energy the spec cannot spare"}
aoe_threshold: 999
cooldowns:
  - {name: Preparation, use_when: "7-min cooldown; resets Vanish (Cloaked in Shadows), Mark for Death, Blind, Sprint for a second support window"}
  - {name: Vanish, use_when: "support cooldown (Cloaked in Shadows shield), not primarily an aggro drop in this build"}
resource_rules:
  - "Baseline energy income ~140 per 12s vs. ~160-170 spent keeping Tricks of the Trade active -- a structural energy deficit per one detailed poster's accounting"
  - "Honor Among Thieves energy only closes the gap in a full 5-man melee party with high uptime, per the same accounting"
  - "Relentless Strikes returns 20 energy per 5-point finisher"
  - "Shadowcraft set's energy-proc bonus is called 'nearly required' for this spec by its main practitioner-source"
consumables:
  - "Thistle Tea"
  - "Instant Poison x2 (generic)"
  - "Blinding Powder (Blind), Flash Powder (Vanish)"
mistakes_to_avoid:
  - "Playing it solo/leveling (support talents require a party)"
  - "Letting Hemorrhage fall off, or using Sinister Strike/Backstab instead of it"
  - "Trying to Vanish-stealth mid-fight expecting to stay hidden (Cloaked in Shadows' absorb still breaks stealth)"
  - "Wasting Tricks of the Trade stacks on Distract/Smoke Bomb/Gouge without a reason"
  - "Using Smoke Bomb near the raid's own melee (it reduces hit chance for everyone inside, allies included)"
  - "Expecting a second rogue's Mark for Death to stack (it only refreshes)"
