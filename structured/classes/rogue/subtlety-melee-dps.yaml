stat_weights:
  hit: 8% from gear (no Precision); Darkmantle hit trinket covers the last 2% [[d:rogue#1467577072863023172]], [[d:rogue#1467578023233585222]]
  attack_power: 'highest priority: scales Mark for Death, Shadow of Death, Hemorrhage; steady AP beats procs [[d:rogue#1475335506890985573]],
    [[d:rogue#1477814557853356133]]'
  energy: set bonuses (Darkmantle, Stormshroud, AQ20) to sustain the rotation [[d:rogue#1490807562814361662]], [[d:rogue#1488615334016716881]]
  crit: gains value with T3 at Naxx [[d:rogue#1465445442643951791]]
caps:
  hit_special_attacks: 8% [[d:rogue#1467577072863023172]]
  honor_among_thieves_icd: 1.5 s [[d:rogue#1464644380693626901]]
rotation_single:
- priority: 0
  action: Garrote (Hemorrhage if bleed-immune)
  condition: opener; always
  sources:
  - '[[d:rogue#1488615334016716881]]'
  - '[[d:rogue#1492117624568680489]]'
- priority: 1
  action: Improved Expose Armor (5 points)
  condition: missing or < ~10 s left; only one rogue per raid runs it
  sources:
  - '[[d:rogue#1483262959709982761]]'
  - '[[d:rogue#1491188298201305208]]'
- priority: 2
  action: any 5-point finisher
  condition: about every 11 s to keep Tricks of the Trade up; do not spam 1-point Eviscerates for it
  sources:
  - '[[d:rogue#1483262959709982761]]'
  - '[[d:rogue#1488615334016716881]]'
- priority: 3
  action: Slice and Dice (low points) and Rupture (5 points, Taste for Blood)
  condition: missing; with 5 points Rupture first
  sources:
  - '[[d:rogue#1490034918212894740]]'
  - '[[d:rogue#1472204410842251285]]'
- priority: 4
  action: Mark for Death at 2 points -> Shadow of Death at 5
  condition: burst window (call it out); Preparation resets Mark for a second use
  sources:
  - '[[d:rogue#1490037124706205746]]'
  - '[[d:rogue#1469728842221359226]]'
- priority: 5
  action: Eviscerate
  condition: spare 5-point finisher
- priority: 6
  action: Hemorrhage
  condition: builder; never Backstab or Sinister Strike
  sources:
  - '[[d:rogue#1468425398747402240]]'
rotation_aoe:
- targets_min: 2
  priority: 1
  action: no Blade Flurry; Mark + Shadow of Death only on a big pack at raid start
  condition: Blade Flurry starves Tricks of the Trade
  sources:
  - '[[d:rogue#1479550395453018322]]'
  - '[[d:rogue#1467574568280522968]]'
aoe_threshold: 999
cooldowns:
- name: Mark for Death
  use_when: burst window, party 30% of your AP as AP for 16 s [[d:rogue#1490442703958446232]]
- name: Preparation
  use_when: after the first Mark/Shadow of Death; 7-minute cooldown [[d:rogue#1468425398747402240]]
- name: Vanish
  use_when: Garrote reopen and trinket swap [[d:rogue#1492117624568680489]]
resource_rules:
- Honor Among Thieves ICD 1.5 s is the energy bottleneck [[d:rogue#1464644380693626901]]
- Ruthlessness, Improved Blade Tactics and Relentless Strikes are mandatory [[d:rogue#1467576340415775040]]
- Pre-load a combo point before the pull [[d:rogue#1448107099405156353]]
- Do not IEA trash or in dungeons [[d:rogue#1459199748748607488]]
consumables:
- Elixir of the Mongoose, Ground Scorpok Assay, Elixir of Giants or Juju Power [[d:rogue#1487503305411133572]], [[d:rogue#1490366630889525258]]
- Juju Might ('always take it') or Winterfall Firewater; they do not stack [[d:rogue#1487503517114695731]], [[d:rogue#1479004139613589674]]
- 'Food: Danonzo''s Tel''Abim Medley (haste) > new 20-Agility food > Sour Mountain Berries; 20-Agility food does not stack
  with Mongoose (bug) [[d:rogue#1487502956340449493]], [[d:rogue#1490660870735269889]]'
- Spirit of Zanza (persists through death), Elixir of Fortitude, Rumsey Rum Black Label [[d:rogue#1468626095870968022]]
- 'Thistle Tea, Potion of Quickness, Juju Flurry; macro: /cast Potion of Quickness /cast Juju Flurry /cast Perception /use
  13 /use 14 [[d:rogue#1488940969112899817]]'
- Greater Fire/Arcane Protection Potions on the fights that need them; no FR gear [[d:rogue#1466871272490139770]], [[d:rogue#1463441701543870587]]
- Goblin Sapper Charges and Gnomish Battle Chicken (Engineering) [[d:rogue#1463477543666581601]]
mistakes_to_avoid:
- Not running IEA as the only Sub rogue [[d:rogue#1490446340730388530]]
- Two rogues on IEA at once [[d:rogue#1490031709717270529]]
- Daggers, Backstab or Sinister Strike [[d:rogue#1468425398747402240]]
- Missing Ruthlessness/Improved Blade Tactics/Relentless Strikes [[d:rogue#1467576340415775040]]
- Forgetting Garrote [[d:rogue#1488615334016716881]]
- Annihilator next to a Shart'ateth Axe (shared debuff slot) [[d:rogue#1483262942748086434]]
- Carrying the Ripper on Sub [[d:rogue#1489408343129850029]]
