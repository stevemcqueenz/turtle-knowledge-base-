guide: guide/classes/rogue/assassination.md
stat_priority:
- hit
- crit
- agility
- haste
- attack-power
stat_priority_note: '"Assassination isn''t your combat swords mentality of piling on the attack power. It is a balance between
  dagger speed, armor haste and crit. Attack power is at the bottom of my list" [Shananagans p=149679]. Weapon speed leads
  because Noxious Assault takes a percentage of attack power rather than weapon damage, so swings only matter for poison application,
  and roughly half the spec''s damage is poison. Hit is 4–5% for dungeon content, more for raids. Dagger weapon skill pushes
  glancing blows down. One post-1.18.1 poster says to "throw out 1.3 speed mainhands" [Mdzielak p=171653] — single source,
  no numbers. Crit and agility are a tie: no cited post ranks them against each other, so their order in the array above carries
  no ranking. Grouping them is this repository''s reading of the sources listed above.'
