  brackets:
    - {bracket: "40-49", advice: "Respec Assassination for Noxious Assault; Envenom single-target; double Instant Poison; Coldrage/Ghaz'rilla daggers; 1.30 daggers wanted", sources: ["[[d:rogue#1425614628385325138]]", "[[d:rogue#1455712360433189117]]", "[[d:rogue#1324107314747408587]]"], era: mixed, agreement: consensus}
    - {bracket: "50-60", advice: "Finish Assassination or frontstab line; respec to endgame at 58-60; Barman Shanker/Gut Ripper carry to 60", sources: ["[[d:rogue#1458113459639156888]]", "[[d:rogue#1431531176333541396]]"], era: 1.18.1-announced-pre-release, agreement: consensus}
