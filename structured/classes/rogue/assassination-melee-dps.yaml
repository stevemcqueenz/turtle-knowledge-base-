agreement: contested
patch_validity:
  written_for: "1.18.0 (live 2025-08-15)"
  valid_for_1181: false
  notes: "1.18.1 (2026-01-23, revised 2026-03-19) cut poison AP scaling at low ranks, weakened and reworked Taste for Blood (no longer buffs Corrosive/Dissolvent, now a 2-point talent), cut Noxious Assault AP scaling 35%->30%, and restricted Corrosive/Dissolvent Poison to Elementals/Mechanicals/Giants/Undead only. No post-1.18.1 build or rotation revision exists in the corpus; the thread 'Assa build is dead 4 raiding in patch 1.18.1?' is unresolved argument, not a fix."
