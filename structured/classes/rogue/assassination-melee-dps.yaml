stat_weights:
  weapon_speed: "top priority: 1.3-1.4 speed daggers on both hands; Noxious Assault deals flat % of Attack Power regardless of weapon speed/damage, so faster weapons only add more auto-attack poison procs, not less damage"
  hit: "to the content's cap; ~4-5% for dungeons, ~9% (vanilla-baseline convention) implied for raids"
  crit_agility: "high, feeds Seal Fate when specced; poisons themselves do not crit per pre-1.18.1 player reports, but Discord post-1.18.1 says spell crit makes poisons crit (closes forum gap #10) [[d:rogue#1490790679381672037]]"
  attack_power: "lowest priority per the spec's own guide-writer (\"Attack power is at the bottom of my list\"); Discord agrees — Assassination wants AP/hit/haste/some crit, Combat wants agility [[d:rogue#1407887326088003625]]"
  discord_cheatsheet: "15 agi = 1 haste; 1 haste = 1 crit = 1 hit = 25 AP; agi ~1.5 AP with energy regen, ~1.2 AP without [[d:rogue#1449907721582280765]] (single source)"
  haste: "diminishing returns once under ~1.0s effective dagger speed with Slice and Dice; one player reports negligible gain from an extra 3% haste ring at that point"
caps:
  hit_dungeon: "4-5% (single source, non-raid content)"
  crit_seal_fate_threshold: "~40% crit before Seal Fate outperforms Dual Wield Specialization (single player estimate)"
  hit_special_attacks_discord: "8% post-1.18 (contested vs the 9% vanilla figure); 5 weapon skill = 1% hit; aim ~14% hit to avoid crit-capping [[d:rogue#1407624625059270699]], [[d:rogue#1407635403632279602]], [[d:rogue#1450373303486124083]]"
  weapon_skill_discord: "for Assassination 'weapon skill matters very little' post-1.18.1; Noxious uses AP, so only autos benefit [[d:rogue#1407120295483019406]], [[d:rogue#1406925028288761956]] (contested)"
  poison_ap_scaling: "Deadly/Corrosive 8% AP, Instant 5% AP (1.18.0 numbers, cut by 1.18.1; 6th Deadly/Corrosive application refreshes, does not add a stack) [[d:rogue#1405589226585853973]], [[d:rogue#1327004414761766935]]"
rotation_single:
  - {priority: 1, action: "Opener (any combo-point generator; Cheap Shot in dungeons/solo, Garrote/Ambush on bosses)", condition: "skip stun openers on stun-immune bosses; skip Garrote on non-bleeding targets"}
  - {priority: 2, action: "Envenom at 1 combo point", condition: "pop immediately once you have 1+ combo points; do not wait for 5"}
  - {priority: 3, action: "Slice and Dice at 1 point", condition: "off the Ruthlessness-granted point after Envenom"}
  - {priority: 4, action: "Noxious Assault", condition: "the only combo-point builder used; ~10-12s to reach 5 points from empty"}
  - {priority: 5, action: "Refresh whichever of Envenom/Slice and Dice has 1-2s left", condition: "keep the two buffs desynchronised by roughly 10-12s so they never expire together"}
  - {priority: 6, action: "Rupture or Eviscerate at 3-5 points", condition: "only when both Envenom and Slice and Dice have more than 10s remaining"}
  - {priority: 7, action: "Pool energy; do not dump at low energy", condition: "always"}
  - {priority: 8, action: "Rupture (Taste for Blood) at 5 CP, then refresh 1-CP Envenom/SnD", condition: "Discord's pre-1.18.1 priority: maintain Taste for Blood > Slice and Dice > dump spare CP into Eviscerate/Envenom; opener 1-CP SnD -> 1-CP Envenom -> 5-CP Rupture -> refresh -> 5-CP Eviscerate", sources: ["[[d:rogue#1406754701407551599]]", "[[d:rogue#1407474034349969448]]", "[[d:rogue#1407740396452450416]]"], agreement: consensus, era: pre-1.18.1}
  - {priority: 9, action: "Once energy regen leaves 5-10 s of buff uptime, drop Rupture and spend spare CP on Eviscerate", condition: "late-gear optimisation", sources: ["[[d:rogue#1456432270717092092]]"], agreement: single source, era: 1.18.1-announced-pre-release}
  - {priority: 10, action: "Taste for Blood is a self-buff from any-CP Rupture (a 1-CP Rupture still gives the full window) and also buffs Dissolvent; it can be triggered off a bleed-immune target to then Eviscerate", condition: "rotation plumbing the forum lacked", sources: ["[[d:rogue#1458132484637065343]]", "[[d:rogue#1432424536262967338]]", "[[d:rogue#1461858045247225907]]"], agreement: consensus, era: 1.18.1-announced-pre-release}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "do not toggle Blade Flurry in this spec by default", condition: "costs 20% energy regen (30% pre-1.18.1) and 20% damage, starving Vigor/Noxious Assault"}
  - {targets_min: 2, priority: 2, action: "tab Noxious Assault between two targets", condition: "only if both targets will live long enough to keep poisons ticking"}
  - {targets_min: 4, priority: 1, action: "no rogue AoE exists; pad with consumables (Oil of Immolation, Dragonbreath Chili)", condition: "staff has said true AoE will not be added"}
aoe_threshold: 999
cooldowns:
  - {name: Vanish, use_when: "offensive re-opener / trinket swap; never use offensively while solo (resets the mob to full health)"}
  - {name: "Cold Blood", use_when: "post-1.18.1 Assassination raiders often drop it; use to guarantee a non-crit Noxious Assault/Eviscerate", sources: ["[[d:rogue#1484800712876621945]]"], agreement: consensus, era: post-1.18.1}
  - {name: "Thistle Tea", use_when: "burst energy when both buffs need refreshing at once"}
resource_rules:
  - "Baseline energy: 20 per 2 seconds"
  - "Vigor: 100% chance to gain 2 energy per poison application (no internal cooldown since 1.18.0)"
  - "Relentless Strikes returns 20 energy on 5-point finishers"
  - "Darkmantle 4-piece and Stormshroud 4-piece set procs both restore energy; stacking both is the guide-writer's stated gearing goal"
  - "Fast daggers burn poison charges quickly; carry spare poisoned weapons and a weapon-swap macro, or reapply between pulls"
consumables:
  - "Instant Poison x2 (default vs any target that is not Elemental/Mechanical/Giant/Undead)"
  - "Dissolvent Poison x2 (or Dissolvent+Corrosive) vs Elementals/Mechanicals/Giants/Undead only, post-1.18.1"
  - "Deadly Poison on bosses / Instant on trash (pre-1.18.0 advice, superseded by the double-Instant consensus for the Noxious Assault build)"
  - "Thistle Tea"
  - "Oil of Immolation, Dragonbreath Chili for AoE padding"
  - "Concoction of the Emerald Mongoose instead of Elixir of Mongoose: 2% spell crit (poisons) + 2% physical crit [[d:rogue#1410790635442671830]], [[d:rogue#1422242185167765707]]"
  - "Potion of Quickness shares a CD with protection potions; Thistle Tea shares with Health Stones; sappers share with Holy Water [[d:rogue#1421159028498759741]], [[d:rogue#1439618722607271956]]"
  - "Full multiplicative haste-source list: SnD 30%, Kiss 20%, food 2%, Lion's Horn 5%, battle chicken 5%, Potion of Quickness 5%, Juju Flurry 3%, Bloodlust 20%, Troll 10/15%, Druid Atiesh 2%, Chastise 20% [[d:rogue#1415123962169393345]]"
mistakes_to_avoid:
  - "Using slow, high-damage-range daggers out of Combat-spec habit instead of the fastest available"
  - "Letting Envenom or Slice and Dice drop, or refreshing both at the same time so they expire together"
  - "Waiting for 5 combo points before the first Envenom"
  - "Running Deadly/Corrosive with fast daggers (the 5-stack cap on Deadly wastes procs)"
  - "Running Dissolvent/Corrosive on anything but Elemental/Mechanical/Giant/Undead post-1.18.1 (they do not apply)"
  - "Toggling Blade Flurry on and forgetting about the energy drain"
  - "Running out of poison charges mid-fight without spares"
  - "Using DoT poisons or Rupture on a target you intend to Gouge/Blind/Sap"
  - "Ignoring hit chance (missing negates poison-application chances)"
  - "Spamming abilities at low energy instead of pooling"
  - "Skipping the per-pack poison swap post-1.18.1: Dissolvent/Corrosive do nothing on the wrong creature type [[d:rogue#1484754354433953915]]"
  - "Taking Murder as a beginner — most raid bosses are not the covered creature types [[d:rogue#1411665605706252380]]"
  - "Do not pair Annihilator with a Shart'ateth Axe — same debuff slot, they overwrite each other [[d:rogue#1483262942748086434]]"
  - "Do not assume a proc works with Spellstrike items [[d:rogue#1448449438925324311]]"

poisons_by_raid:
  # Post-1.18.1 Corrosive/Dissolvent apply only to Elementals, Mechanicals, Giants and Undead, so rogues
  # swap per pack. Every entry cites the per-raid tables posted in #rogue by Rheinwg / guide writers.
  source_note: "per-raid poison-swap tables; citations resolve in structured/discord/evidence-rogue.jsonl"
  general_rule: "Envenom specs use Dissolvent/Instant; Combat and Subtlety use DoT poisons (Deadly/Corrosive) on fights over ~40 s and Instant/Dissolvent on shorter ones [[d:rogue#1484754354433953915]] (consensus, post-1.18.1)"
  molten_core: "Dissolvent/Corrosive only on Garr, Geddon, the two Golems and the Undead Dwarf; Instant/Deadly only on Lucifron's Salamander, Magmadar's Core Hound, Sulfuron, Shazzrah and Majordomo; Golemagg accepts either [[d:rogue#1484754354433953915]] (single source, post-1.18.1)"
  blackwing_lair: "nobody immune; Chromaggus's resistance/vulnerability makes Deadly swing wildly [[d:rogue#1484137121903022233]] (single source, 1.18.1-announced-pre-release)"
  aq40: "only the Twin Emperors are immune -> Corrosive 2 + Corrosive 1 [[d:rogue#1484137121903022233]], [[d:rogue#1484473855312396318]] (consensus, 1.18.1-announced-pre-release)"
  naxxramas: "mostly Undead (both work) but trash includes Humanoids/Beasts so Instant is the safe default; Faerlina/Maexxna -> Deadly 5+4 (combat/sub), Gothik -> Dissolvent only [[d:rogue#1484757612271501332]] (single source, post-1.18.1)"
  kara40: "Anomalus, Rupturan, Chess -> Dissolvent/Corrosive 2+1; Medivh -> any (Combat uses Mind-numbing); all other bosses -> Deadly/Instant (combat/sub Deadly 5+4, Assa Instant) [[d:rogue#1484759095419474041]] (single source, post-1.18.1)"

