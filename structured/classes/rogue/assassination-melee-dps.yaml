stat_weights:
  weapon_speed: 'dominant: fastest weapons in both hands; ~6 poison DPS per 0.1 s; off hand needs ~2x the DPS to offset 0.1
    s [[d:rogue#1445034228231438409]], [[d:rogue#1461712872068612106]], [[d:rogue#1464609074015502528]]'
  hit: 8% strictly necessary, 12-14% comfortable; only landed hits apply poison [[d:rogue#1460107144035696710]], [[d:rogue#1433557308897497219]]
  haste: ~25-28 AP per 1%; no diminishing returns; above crit [[d:rogue#1479182385210855576]], [[d:rogue#1483699455831314525]]
  crit_agility: crit ~18-20 AP (poisons only crit from spell crit), Agility ~1.6-1.7 AP [[d:rogue#1479182385210855576]], [[d:rogue#1462562836973879307]]
  attack_power: poisons, Noxious Assault and Eviscerate scale with AP only [[d:rogue#1485319521324765194]]
  discord_cheatsheet: 15 agi = 1 haste; 1 haste = 1 crit = 1 hit = 25 AP; agi ~1.5 AP with energy regen, ~1.2 AP without [[d:rogue#1449907721582280765]]
    (single source)
caps:
  hit_dungeon: 4-5% (single source, non-raid content)
  crit_seal_fate_threshold: ~40% crit before Seal Fate outperforms Dual Wield Specialization (single player estimate)
  hit_special_attacks_discord: 8% [[d:rogue#1461126609196023922]]
  weapon_skill_discord: for Assassination 'weapon skill matters very little' post-1.18.1; Noxious uses AP, so only autos benefit
    [[d:rogue#1407120295483019406]], [[d:rogue#1406925028288761956]] (contested)
  poison_ap_scaling: Instant ~5% AP, Dissolvent 4.75%, Deadly/Corrosive ~8% over full duration (max ranks) [[d:rogue#1481460731823128607]],
    [[d:rogue#1462220214295859220]]
rotation_single:
- priority: 0
  action: 'Opener: pre-loaded combo point carried with Slice and Dice, or Noxious Assault'
  condition: pull
  sources:
  - '[[d:rogue#1480688682787667988]]'
- priority: 1
  action: Envenom (1 combo point), then Slice and Dice (1 combo point)
  condition: buff missing or about to expire; Envenom first
  sources:
  - '[[d:rogue#1484581432889442335]]'
- priority: 2
  action: Eviscerate (Cold Blood first if ready)
  condition: combo points == 5
  sources:
  - '[[d:rogue#1485191077827842271]]'
  - '[[d:rogue#1480513960317943900]]'
- priority: 3
  action: Noxious Assault
  condition: always the builder; never Backstab or Sinister Strike
  sources:
  - '[[d:rogue#1436359116774838312]]'
- priority: 9
  action: Do not cast Rupture
  condition: '1.18.1: skipping Rupture/Taste for Blood sims ~20 DPS higher'
  sources:
  - '[[d:rogue#1485191077827842271]]'
rotation_aoe:
- targets_min: 2
  priority: 1
  action: stay single target; Blade Flurry only if your sim shows a gain (contested)
  condition: poisons do not reach the second target
  sources:
  - '[[d:rogue#1456462381906657310]]'
  - '[[d:rogue#1484686771382915153]]'
aoe_threshold: 999
cooldowns:
- name: Cold Blood
  use_when: on a 5-point Eviscerate, or on Noxious Assault to reach 5 faster with Seal Fate [[d:rogue#1480513960317943900]]
- name: Vanish
  use_when: threat reset and trinket swap [[d:rogue#1465825846521626935]]
- name: Thistle Tea
  use_when: opener burst or energy starvation
resource_rules:
- Ruthlessness point after each finisher pays the 1-point Envenom/Slice and Dice refresh [[d:rogue#1478779997878485167]]
- 'Efficient Poisons: -25/50/75% poison application time and fewer charges used; keep it [[d:rogue#1484425282109837392]],
  [[d:rogue#1488765913862770802]]'
- Poison charges last ~20 minutes of fighting [[d:rogue#1471162658550972653]]
- Weapon swaps cost a GCD in combat [[d:rogue#1445469130453942475]]
- Carry a second poisoned weapon pair for the other creature-type group [[d:rogue#1484557710065406146]]
consumables:
- Elixir of the Mongoose, Ground Scorpok Assay, Elixir of Giants or Juju Power [[d:rogue#1487503305411133572]], [[d:rogue#1490366630889525258]]
- Juju Might ('always take it') or Winterfall Firewater; they do not stack [[d:rogue#1487503517114695731]], [[d:rogue#1479004139613589674]]
- 'Food: Danonzo''s Tel''Abim Medley (haste) > new 20-Agility food > Sour Mountain Berries; 20-Agility food does not stack
  with Mongoose (bug) [[d:rogue#1487502956340449493]], [[d:rogue#1490660870735269889]]'
- Spirit of Zanza (persists through death), Elixir of Fortitude, Rumsey Rum Black Label [[d:rogue#1468626095870968022]]
- 'Thistle Tea, Potion of Quickness, Juju Flurry; macro: /cast Potion of Quickness /cast Juju Flurry /cast Perception /use
  13 /use 14 [[d:rogue#1488940969112899817]]'
- Greater Fire/Arcane Protection Potions on the fights that need them; no FR gear [[d:rogue#1466871272490139770]], [[d:rogue#1463441701543870587]]
- Goblin Sapper Charges and Gnomish Battle Chicken (Engineering) [[d:rogue#1463477543666581601]]
- 'Poisons: Instant both hands by default; a second weapon pair with Dissolvent for Elementals/Mechanicals/Giants/Undead [[d:rogue#1484557710065406146]],
  [[d:rogue#1484513053876949133]]'
- 'Stacking: same-stat consumables do not stack (Mongoose/Agility potion, Firewater/Black Juju, Giants/Juju Power); Blasted
  Lands buff and Agility food stack with everything; a concoction does not stack with its components [[d:rogue#1479004361744056492]],
  [[d:rogue#1488825686587215956]]'
- Juju Flurry is worth more for Assassination ("more hits = more poison") [[d:rogue#1487504051154456796]]
mistakes_to_avoid:
- Rupture + Taste for Blood with Envenom in 1.18.1 [[d:rogue#1486815192690987191]]
- Double Dissolvent everywhere (pre-1.18.1 habit) [[d:rogue#1484513053876949133]]
- Slow "upgrade" weapons such as Gut Ripper [[d:rogue#1472127122071093311]]
- Backstab or Sinister Strike instead of Noxious Assault [[d:rogue#1436359116774838312]]
- Dropping Efficient Poisons [[d:rogue#1488765913862770802]]
- Staying Assassination after full Darkmantle without simming Combat Envenom [[d:rogue#1486733280710492383]]
poisons_by_raid:
  source_note: per-raid poison-swap tables; citations resolve in structured/discord/evidence-rogue.jsonl
  general_rule: Envenom specs use Dissolvent/Instant; Combat and Subtlety use DoT poisons (Deadly/Corrosive) on fights over
    ~40 s and Instant/Dissolvent on shorter ones [[d:rogue#1484754354433953915]] (consensus, post-1.18.1)
  molten_core: Dissolvent/Corrosive only on Garr, Geddon, the two Golems and the Undead Dwarf; Instant/Deadly only on Lucifron's
    Salamander, Magmadar's Core Hound, Sulfuron, Shazzrah and Majordomo; Golemagg accepts either [[d:rogue#1484754354433953915]]
    (single source, post-1.18.1)
  blackwing_lair: 'all enemies take only Instant/Deadly; Spellbinders immune to all poisons; Drakonid Nature vulnerability;
    Chromaggus alternates Nature resistance/vulnerability. Assassination: Instant all raid; Combat: Instant trash, max-rank
    Deadly on bosses [[d:rogue#1484755632237187213]] (single source, post-1.18.1)'
  aq40: all enemies take only Instant/Deadly; Twin Emperors immune to all poisons; Frost Oils on Viscidus [[d:rogue#1484756192734478396]],
    [[d:rogue#1485803638549905508]] (consensus, post-1.18.1)
  naxxramas: mostly Undead (both work) but trash includes Humanoids/Beasts so Instant is the safe default; Faerlina/Maexxna
    -> Deadly 5+4 (combat/sub), Gothik -> Dissolvent only [[d:rogue#1484757612271501332]] (single source, post-1.18.1)
  kara40: Anomalus, Rupturan, Chess -> Dissolvent/Corrosive 2+1; Medivh -> any (Combat uses Mind-numbing); all other bosses
    -> Deadly/Instant (combat/sub Deadly 5+4, Assa Instant) [[d:rogue#1484759095419474041]] (single source, post-1.18.1);
    worgen/demon trash immunity later removed [[d:rogue#1487466805852373134]]
  emerald_sanctum: mobs highly Nature-resistant; Instant still works [[d:rogue#1485366249260060782]], [[d:rogue#1485998161238560969]]
  type_rule: Corrosive and Dissolvent only apply to Elementals, Mechanicals, Giants and Undead; Instant/Deadly apply to everything
    except nature-immune targets [[d:rogue#1484513053876949133]], [[d:rogue#1475842408158593137]]
