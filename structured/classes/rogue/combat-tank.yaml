patch_validity:
  written_for: pre-Class Changes 2 (before 2024-10-12)
  valid_for_1181: unknown
  notes: Every build/gear list predates Class Changes 2 (2024-10-12), which removed Setup from Subtlety, removed Sleight of
    Hand and Endurance, and reshuffled Combat -- no post-CC2 tank build exists in the corpus. Nothing in 1.18.0/1.18.1 directly
    changed Flourish or Agitating Poison except charge-count fixes (2026-03-03). Status as of the 1.18.1 era is a small, contested
    niche kept alive by a handful of players; staff has repeatedly signalled this is not an intended tank role. Discord post-1.18.1
    keeps the Assa-for-threat / Combat-for-avoidance split and says avoidance is no longer the bottleneck (poison immunity
    is) [[d:rogue#1460907162426671238]].
  discord_era: post-1.18.1
