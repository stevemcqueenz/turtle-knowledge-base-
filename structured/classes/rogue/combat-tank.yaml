stat_weights:
  avoidance: 'top priority: dodge, parry, defense (before Flourish''s finisher-granted +20% parry can push avoidance high
    enough to matter)'
  discord_avoidance_numbers: 'Discord post-1.18.1: 79.5% baseline avoidance, 91% buffed, ~96-97% max — avoidance is not the
    bottleneck, poison immunity is [[d:rogue#1460907162426671238]], [[d:rogue#1418639656043679935]] (contested)'
  stamina: second priority, for the swings that do land
  threat_stats: hit, agility, weapon skill (drives poison procs for Agitating Poison threat)
  resistance: situational, for caster-capable targets
caps:
  avoidance_target: 86.8% passive vs bosses (BetterCharacterStats), 95-97% in Kara40 gear [[d:rogue#1494743574284075150]],
    [[d:rogue#1464675856575103028]]
  agitating_poison_level: 60 (baseline poison, no lower ranks -- a frequently repeated player complaint)
rotation_single:
- priority: 1
  action: Noxious Assault
  condition: threat builder with Agitating Poison / Corrosive on valid types
  sources:
  - '[[d:rogue#1462134848415338742]]'
- priority: 2
  action: Envenom (poison threat)
  condition: missing
- priority: 3
  action: Ghostly Strike -> Flourish -> Ghostly Strike -> Evasion -> Ghostly Strike -> Flourish
  condition: avoidance chain; expect a hittable gap when Flourish is on cooldown
  sources:
  - '[[d:rogue#1471063134339858453]]'
  - '[[d:rogue#1471063504709484586]]'
- priority: 4
  action: Riposte
  condition: usable
- priority: 5
  action: Feint/Vanish to lower own threat
  condition: tank swap (no taunt)
  sources:
  - '[[d:rogue#1473169875227639943]]'
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Blade Flurry + target swapping; Sap one and Blind one on 4-mob packs
  condition: no AoE threat tool
  sources:
  - '[[d:rogue#1479145606654988469]]'
  - '[[d:rogue#1471053347518681149]]'
aoe_threshold: 2
cooldowns:
- name: Flourish
  use_when: the core mitigation finisher; capped at a 40-second cooldown since 1.17.0 specifically to prevent permanent avoidance
    uptime -- plan pulls around it
- name: mitigation loop
  use_when: 'Discord: Flourish -> Evasion -> Flourish, pre-planned around the 40-s Flourish cooldown [[d:rogue#1428661874920128522]]
    (single source)'
- name: Evasion
  use_when: 4-min baseline cooldown (3.5 min with the old, now-removed Endurance talent); save for the most dangerous swing
- name: Riposte
  use_when: not a cooldown, only usable after a parry; bonus threat/disarm
- name: Vanish
  use_when: genuine emergency aggro reset only
resource_rules:
- Threat comes from Agitating Poison procs (Nature damage + threat) and auto-attack/Sinister Strike weapon damage, not from
  a dedicated threat multiplier
- Engineering grenades and target dummies fill area-threat gaps but drop the rogue's dodge/parry chance to 0% during the cast
- No taunt and no on-demand threat cooldown exists for this build
consumables:
- Agitating Poison (both weapons where possible)
- Scorpok / agility elixirs
- Armor and stamina flasks/elixirs
- Engineering grenades and target dummies
mistakes_to_avoid:
- Attempting raid bosses that stun, fear, taunt-swap, or are poison-immune
- Standing in front of casters expecting avoidance to help against spell damage
- Casting a grenade while being hit (avoidance drops to 0% for the cast duration)
- Relying on Flourish being up constantly (40-second cooldown)
- Assuming the April Fools 'baseline +50% threat' patch note was real
- Volunteering for tank-swap fights or crowd-tanking packs (single-target combo points make this unviable)
- 'Assuming avoidance is the problem: post-1.18.1 Discord calls poison immunity the real bottleneck [and avoidance no longer
  is] [[d:rogue#1460907162426671238]]'
- Main-tanking taunt-swap or nature-immune bosses (Agitating Poison is Nature) [[d:rogue#1473170462539251824]]
- Wearing a DPS set as tank [[d:rogue#1471055767372169417]]
