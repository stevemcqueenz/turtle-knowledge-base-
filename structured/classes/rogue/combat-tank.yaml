stat_priority_note: 'The practitioners'' order: avoidance first — the claim is that a geared rogue tank passes the 102% avoidance
  requirement to avoid crushing blows — then stamina, then the threat stats (hit, agility, and weapon skill for poison procs),
  then resistances for caster bosses. The avoidance numbers are player theorycraft from 2022–2023 and predate 1.17.0''s Flourish.
  No cited post ranks dodge, parry and defense against each other, nor hit, agility and weapon skill against each other, so
  the order within each of those runs above carries no ranking. Grouping them as avoidance and as threat stats is this repository''s
  reading of the sources listed above.'
