  build_link_tortoise: https://xian55.github.io/tortoise-db-viewer/?talents=warlock&t=550012320223210151-053020001-5
  build_link_tortoise_note: 'Generated from the sourced points list (51 points: Affliction 35, Demonology 11, Destruction
