play_loop:
  opener:
  - 'pre-pull: summon Imp, Demonic Sacrifice (Succubus if threat-capped)'
  - haste/SP cooldowns
  - assigned curse (Malediction adds Curse of Agony)
  - Corruption
  - Siphon Life
  - Drain Soul
  - 'threat-tight alternative: Siphon Life > Corruption > curse > Drain Soul'
  single_target:
  - priority: 1
    action: Shadow Bolt
    condition: Nightfall proc; break Drain Soul, never Dark Harvest
  - priority: 2
    action: assigned curse
    condition: missing
  - priority: 3
    action: Curse of Agony
    condition: missing (Malediction does not refresh it)
  - priority: 4
    action: Corruption
    condition: missing
  - priority: 5
    action: Siphon Life
    condition: missing and target lives 30 s
  - priority: 6
    action: Dark Harvest
    condition: Shadow Vulnerability up, all DoTs >=~10 s, 8 s uninterrupted; else finisher
  - priority: 7
    action: Drain Soul
    condition: filler; cancel right after a tick
  - priority: 8
    action: Life Tap
    condition: mana below next cycle
  aoe:
    targets_min: 2
    loop:
    - priority: 1
      action: curse + Corruption on each, drain the kill target
      condition: 2-3 targets living >~10 s
    - priority: 2
      action: one Corruption + Drain Soul, or curse only
      condition: trash dying <~10 s
    - priority: 3
      action: never dot more than 3 targets
    - priority: 4
      action: spread Siphon Life, then Hellfire/Rain of Fire
      condition: 5+ stacked mobs; warn tank
  cooldowns:
  - trinkets/potions before (re)applying DoTs (snapshot)
  - 'Death Coil: emergency heal'
  - 'Limited Invulnerability Potion: threat drop'
