stat_weights:
  hit: "high (10% covered by Suppression; ~5-6% from gear reported sufficient); Shadow Bolt/Nightfall procs unaffected; Dark Harvest hit interaction unresolved. Discord: 6% gear hit (5% with Emerald Blessing) [[d:warlock#1388998345846030508]], [[d:warlock#1379836639400169612]]"
  haste: "high per wiki/Spritzbube; Discord gives 19% gear haste for MC/BWL and ~23% in AQ as the breakpoints, with 1% haste ~ 12-16 SP [[d:warlock#1440433738415870039]], [[d:warlock#1413427517876076609]]; contested vs raw spell power, unanswered in forum sources"
  spell_power: "medium-high, secondary to haste per some sources"
  crit: "near-zero (DoTs do not crit on Turtle); Discord concurs, ~0 SP per 1% [[d:warlock#1388257261968953344]], [[d:warlock#1421918198206304456]]"
  intellect: "low, mana pool only"
  stamina: "high (mana pool is tied to health via Life Tap; Affliction tier sets are stamina-poor)"
  spirit: "low/dump stat (suppressed during channels per a single 2020 report, never retested)"
stat_priority: [hit-to-6, haste, spell-power, stamina, intellect]
caps:
  gear_hit: "6% from gear for Affliction spells (Suppression covers the remaining 10%) [[d:warlock#1388998345846030508]], [[d:warlock#1379836639400169612]], [[d:warlock#1387659949374443561]] (consensus, post-1.18.1)"
  haste_breakpoints: "19% gear haste for MC/BWL, ~23% for AQ; 'everything in between is ineffective' (Bigdots' breakpoint sheet, single source) [[d:warlock#1440433738415870039]], [[d:warlock#1440439603331858502]]"
  crit: "not a target; DoTs do not crit"
rotation_single:
  - {priority: 1, action: "Shadow Bolt", condition: "Nightfall proc (Shadow Trance) is up; break a Drain Soul channel for it, not Dark Harvest"}
  - {priority: 2, action: "recast assigned raid curse (Curse of Shadow/Elements)", condition: "missing (Malediction reapplies Curse of Agony with it)"}
  - {priority: 3, action: "Corruption", condition: "missing or about to expire"}
  - {priority: 4, action: "Siphon Life", condition: "missing (keeps Soul Siphon at 4-effect max)"}
  - {priority: 5, action: "Curse of Agony", condition: "missing and not the raid curse-holder"}
  - {priority: 6, action: "Dark Harvest", condition: "off cooldown and an uninterrupted 8-s channel is guaranteed, or target is about to die (resets cooldown on kill); contested whether to use it at all on bosses (some report it a DPS loss vs pure Drain Soul)"}
  - {priority: 7, action: "Drain Soul (highest rank)", condition: "default filler; never hard-cast Shadow Bolt"}
  - {priority: 8, action: "Life Tap", condition: "mana below cost of next cycle"}
  - {priority: 9, action: "Drain Soul before Dark Harvest on bosses", condition: "Drain Soul ticks apply Shadow Vulnerability since CC3; open with Drain Soul so the debuff is up [[d:warlock#1423323493948199004]], [[d:warlock#1423323195682848779]]", sources: ["[[d:warlock#1423323195682848779]]", "[[d:warlock#1423323493948199004]]"], era: pre-1.18.1, agreement: consensus}
  - {priority: 10, action: "Do not clip or early-refresh DoTs", condition: "reapply only when they fall; Dark Harvest shortens their duration [[d:warlock#1432327385155637340]]", sources: ["[[d:warlock#1432327385155637340]]", "[[d:warlock#1430598435341340826]]", "[[d:warlock#1425413794934554684]]"], era: 1.18.1-announced-pre-release, agreement: consensus}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "support curse (Malediction auto-applies Curse of Agony) on each target, then Corruption on each", condition: "2-3 trash targets, ask tank first"}
  - {targets_min: 2, priority: 2, action: "Drain Soul on the kill target", condition: "no Shadow Bolt"}
  - {targets_min: 3, priority: 3, action: "Stop multi-dotting past ~3 targets", condition: ">3 targets is counter-productive: 'Affli is strong on multi-target, but above 3 targets it's just worse' [[d:warlock#1442927152696786994]], cap at 3", sources: ["[[d:warlock#1442927152696786994]]", "[[d:warlock#1422187631432962091]]"], era: mixed, agreement: "single source / consensus-adjacent"}
  - {targets_min: 2, priority: 4, action: "Dark Harvest now only hastens the selected target's DoTs", condition: "the multi-target 'cleave' was removed ~2025-10-03/04 [[d:warlock#1424081673691070486]], [[d:warlock#1424003723306336338]], [[d:warlock#1432870103653027871]]", sources: ["[[d:warlock#1424081673691070486]]", "[[d:warlock#1424003723306336338]]", "[[d:warlock#1432870103653027871]]"], era: 1.18.1-announced-pre-release, agreement: consensus}
  - {targets_min: 4, priority: 1, action: "Rain of Fire or Hellfire (warn healer)", condition: "4+ stacked targets; Affliction has no AoE of its own. Discord: Hellfire only with Wrathstone/healer setup — weak without it [[d:warlock#1451030382429605948]]", sources: ["[[d:warlock#1451030382429605948]]"], era: 1.18.1-announced-pre-release, agreement: consensus}
aoe_threshold: 4
cooldowns:
  - {name: "Dark Harvest", use_when: "30-s CD; see rotation; resets on target death"}
  - {name: "Death Coil", use_when: "self-heal / emergency, 3-min CD"}
  - {name: "Drain Life", use_when: "niche self-heal when Death Coil and Healthstone/tea/potion are on cooldown; contested value in PvE"}
  - {name: "Pet Sacrifice", use_when: "Imp = +4% spell damage, Succubus = -10% threat (costs ~4% damage) [[d:warlock#1404709089526677505]]; Affliction/Destro sacrifice because demons do not scale for them [[d:warlock#1405348590494285984]], [[d:warlock#1405594274438975589]]"}
resource_rules:
  - "Life Tap is the mana engine; Improved Life Tap and Shadow Mastery both scale it"
  - "Soul Shards stack to 3; Drain Soul on a killing blow yields a shard; keep a shard reserved for Soulstone/Healthstone/pet re-summon. Shard bag from the VW/Felhunter quests; ShardCapPlus auto-deletes above a slot cap [[d:warlock#1387507303699451954]], [[d:warlock#1409730099426889768]]"
  - "Felstone leech (3%) heals the Warlock and the demon, restores mana, and heals the demon through Power Overwhelming self-damage [[d:warlock#1383139883710808104]], [[d:warlock#1379857645703528590]]; Healthstone and Tea share a cooldown, decide per fight which is the emergency button"
  - "Ritual of Souls costs 3 shards since 1.18.1"
  - "Demon buffs scale on both schools: fire spell power boosts fire pet damage, shadow power boosts shadow pet damage [[d:warlock#1432489734239944796]]"
consumables:
  - "Flask of Supreme Power"
  - "Fire/Arcane protection potions per raid"
  - "Healthstone (Major), Felstone as personal stone (Voidstone if threat is a problem)"
  - "Greater Holy Protection potion vs Paladins in PvP"
  - "Discord: Flask + elixir are ~+500 SP by themselves [[d:warlock#1383215858029035651]]; Voidstone (-10% spell threat) costs the Warlock no DPS [[d:warlock#1428764187789889637]]; named throughput consumes include Oil / Catseye / Juju Flurry / Potion of Quickness [[d:warlock#1383073096956645436]], [[d:warlock#1417899616447500439]]"
mistakes_to_avoid:
  - "Hard-casting Shadow Bolt outside Nightfall procs"
  - "Casting Dark Harvest into a knockback/AoE and losing the 30-s cooldown"
  - "Letting Siphon Life drop (loses a Soul Siphon stack) or refreshing DoTs too early (wastes a GCD and mana) — confirmed by Discord [[d:warlock#1432327385155637340]]"
  - "Casting Curse of Agony instead of the assigned raid curse when you are the only Warlock (Malediction gives both)"
  - "Hellfire/Inferno in dungeons without warning the group"
  - "Pet set to aggressive near a pull"
  - "Wearing the set-bonus tier piece (Attire) over stamina gear and dying to AoE"
  - "Letting soul shards overflow; not keeping a shard in reserve"
  - "Relying on Curse of Weakness as a primary slow (does not stack with other attack-speed slows)"
  - "Immolate as geared Affliction — 'Immolate isn't worth using thanks to all the shadow damage multipliers'; drop it once Siphon Life/Shadoweave come online [[d:warlock#1104793778176393236]], [[d:warlock#1487115677218115665]]"
  - "Drain-tanking before the late-30s Drain Life rank [[d:warlock#1410017237124780195]]"
  - "Expecting the Voidwalker to hold aggro once Shadoweave is equipped [[d:warlock#1080893294822817872]]"
  - "Forgetting Demonic Sacrifice puts you in combat [[d:warlock#1461953261526323240]]"
  - "Wearing 5/5 T2.5 Affliction: the 5-set Doomguard is broken and can summon 3 at once — wear 4/5 [[d:warlock#1427812439428169879]], [[d:warlock#1422985751360045252]]"
leveling_by_bracket:
  - {bracket: "1-10", advice: "Imp from the level-1 class quest; buy the best wand available (no spells compare early); Voidwalker quest ~8-10.", sources: ["[[d:warlock#1114842876820590613]]", "[[d:warlock#1404885885564092487]]", "[[d:warlock#1399133734053216417]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "10-19", advice: "Voidwalker tanks; Corruption + Curse of Agony then wand; first 7 talents Imp Corruption + Imp Life Tap.", sources: ["[[d:warlock#902303194112217158]]", "[[d:warlock#1139910345176129576]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "20-29", advice: "Succubus at 20; drain tanking is NOT online yet — wand out-damages and out-efficiencies early Drain Life until the late-30s rank.", sources: ["[[d:warlock#1410017237124780195]]", "[[d:warlock#1367169475941498922]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "30-39", advice: "Shadoweave tailoring set is the leveling power spike (buy from AH if not a tailor); +shadow damage gear and skip Immolate; big Drain Life rank at 38; Scarlet Monastery for gear.", sources: ["[[d:warlock#1371345124067639296]]", "[[d:warlock#1302082714135953448]]", "[[d:warlock#1419778210949890108]]", "[[d:warlock#1078628023617716234]]", "[[d:warlock#1373989374672244838]]"], era: pre-1.18.1, agreement: consensus}
  - {bracket: "40-49", advice: "Voidwalker loses aggro to Shadoweave spell power; the Warlock becomes the tank (DoTs + Drain Life + Life Tap).", sources: ["[[d:warlock#1080893294822817872]]", "[[d:warlock#1490117148272496680]]", "[[d:warlock#1097948220895793212]]"], era: mixed, agreement: consensus}
  - {bracket: "50-60", advice: "Infernal quest at 50; Doomguard + Soulwell at 60; Affliction AoE-farms by dotting 3-4 mobs and kiting with Curse of Exhaustion; Dire Maul East lashers is the classic end farm.", sources: ["[[d:warlock#1485033334907076718]]", "[[d:warlock#1367169475941498922]]", "[[d:warlock#1464039321358176387]]", "[[d:warlock#1464610780526673920]]"], era: mixed, agreement: consensus}
  - {bracket: hardcore, advice: "Demo is the safe HC pick; Affliction drain-tanking + rank-1 Curse of Recklessness (35 mana, with Malediction) is reported strong through the 40s.", sources: ["[[d:warlock#1379671059929759906]]", "[[d:warlock#1447865234243977277]]", "[[d:warlock#1379716876761825330]]"], era: mixed, agreement: consensus}
leveling_order_source: "[[d:warlock#1487115677218115665]] (post-1.18.1 per-bracket codes: BoASY-- at 22, BoASaAQDRB-- at 33); first 5-7 points always Affliction [[d:warlock#1305221420577460235]]"
