stat_weights:
  hit: 'highest until 16% total: Suppression gives 10% to Affliction spells, so 6% from gear (5% with Emerald Blessing) [[d:warlock#1432224779875778711]],
    [[d:warlock#1436885169142370437]]; Malediction Curse of Agony does not benefit from Suppression (bug) [[d:warlock#1468756435428180183]]'
  haste: 1% haste ~ 13.2 SP at 500 SP/0% haste, ~14.7 SP at 500 SP/10% [[d:warlock#1489759140824748163]]; ~18 SP at 700 SP
    [[d:warlock#1456417176297934992]]; ~20 SP at 1000 SP [[d:warlock#1492214613410844753]]; contested vs raw SP [[d:warlock#1492213319711588462]]
  spell_power: high (shadow or generic); DoTs other than Immolate scale 100% with SP; ZG head/leg 18 SP beats the 1% haste
    enchant [[d:warlock#1471426216606306376]], [[d:warlock#1477971651240132709]]
  crit: 'zero: DoTs and channels cannot crit [[d:warlock#1492250052742217868]]'
  intellect: zero for damage [[d:warlock#1492250052742217868]]
  stamina: 'medium: Life Tap converts health to mana; Affliction sets are stamina-poor'
  spirit: none
  spell_penetration: 'only vs high-resist bosses (Mephistroth ~200 SR: CoS 75 + 2 pen enchants 50 + ~75 gear) [[d:warlock#1466803445838119124]],
    [[d:warlock#1483224035738390630]]'
stat_priority:
- hit-to-16-total (6 gear)
- spell-power
- haste
- stamina
caps:
  gear_hit: 6% from gear (16% total with Suppression 5/5); 5% with Emerald Blessing [[d:warlock#1432224779875778711]], [[d:warlock#1436885169142370437]]
  haste_breakpoints: 'contested/not real: extensive tests found no DPS cliffs [[d:warlock#1483947828341637150]], [[d:warlock#1483237141013074162]]
    vs chart-based breakpoints at ~13% and 22-23% [[d:warlock#1483234390489432064]]; Corruption needs 15% haste for a 7th
    tick [[d:warlock#1492252383856824461]]'
  crit: not a target; DoTs do not crit
rotation_single:
- priority: 0
  action: pop haste/SP cooldowns (Potion of Quickness, Juju Flurry, racial, trinket) then apply DoTs
  condition: opener or when a trinket comes up; DoTs keep the buffs they were cast with [[d:warlock#1450450192775123024]],
    [[d:warlock#1433432574406955119]]
- priority: 1
  action: Shadow Bolt
  condition: Nightfall (Shadow Trance) proc up; break Drain Soul for it, never break Dark Harvest [[d:warlock#1443543987255251007]],
    [[d:warlock#1489735044296736778]]
- priority: 2
  action: assigned curse (Shadows/Elements/Recklessness, 1 s GCD)
  condition: missing; Malediction also applies Curse of Agony
- priority: 3
  action: Curse of Agony
  condition: missing (Malediction does not refresh a fallen Curse of Agony; intended) [[d:warlock#1465281355674947646]]
- priority: 4
  action: Corruption
  condition: missing; never clip early [[d:warlock#1433432659555647498]]
- priority: 5
  action: Siphon Life
  condition: missing and target lives its full duration [[d:warlock#1471139622703726806]]
- priority: 6
  action: Dark Harvest
  condition: Shadow Vulnerability up AND every DoT has >=~10 s left AND no interruption, or as a finisher; with T2.5 5-piece
    use it more freely [[d:warlock#1495058358875590898]], [[d:warlock#1480626773212397658]], [[d:warlock#1480617902515425378]]
- priority: 7
  action: Drain Soul
  condition: default filler; cancel only right after a tick (Nampower) [[d:warlock#1433442818235564052]]
- priority: 8
  action: Life Tap (or Demonic/Dark Rune)
  condition: mana below next cycle [[d:warlock#1437144597846425671]]
- priority: 9
  action: never Immolate, never hard-cast Shadow Bolt
  condition: always [[d:warlock#1478873883200323767]]
- priority: 10
  action: 'threat-safe opener: Siphon Life > Corruption > Curse > Drain Soul'
  condition: tank struggling on threat [[d:warlock#1483664616130347188]]
rotation_aoe:
- targets_min: 2
  priority: 1
  action: curse (+Malediction Curse of Agony) on each, Corruption on 2-3, Drain Soul/Dark Harvest the kill target
  condition: mobs live >~10 s [[d:warlock#1434677140795949287]], [[d:warlock#1491879604653129878]]
- targets_min: 2
  priority: 2
  action: one Corruption + Drain Soul, or just the raid curse
  condition: 'trash dies in <~10 s; melee-heavy raid: Curse of Recklessness and chill [[d:warlock#1426240600117739610]], [[d:warlock#1442597326177828874]]'
- targets_min: 4
  priority: 3
  action: stop multi-dotting beyond 3 targets
  condition: always [[d:warlock#1442927152696786994]]
- targets_min: 5
  priority: 4
  action: spread Siphon Life, then Hellfire or Rain of Fire (warn tank/healers)
  condition: 5+ stacked mobs [[d:warlock#1476324592841789571]]
aoe_threshold: 5
cooldowns:
- name: Dark Harvest
  use_when: 30 s CD; only with Shadow Vulnerability up and >=10 s on all DoTs, or as a finisher; reset-on-kill reported not
    working [[d:warlock#1463553707974332500]]
- name: Potion of Quickness / Juju Flurry / racial / on-use trinket
  use_when: right before (re)applying DoTs so they snapshot the buff [[d:warlock#1450474907686273055]]
- name: Death Coil
  use_when: emergency self-heal
- name: Demonic Sacrifice
  use_when: 'pre-pull: Imp (+4% spell damage) by default; Succubus (-10% threat) if threat-capped [[d:warlock#1404709089526677505]];
    resummon and re-sacrifice after any greater demon/enslave [[d:warlock#1489967871290380401]]'
- name: Limited Invulnerability Potion
  use_when: threat emergency [[d:warlock#1437144597846425671]]
resource_rules:
- Life Tap is the mana engine; rarely drink at 60
- Drain Soul costs mana per tick, so cancelling it wastes nothing [[d:warlock#1481381182863052983]]
- Stop at ~80-85% of tank threat [[d:warlock#1388662907415564491]]; Voidstone -10% (15% with Improved Stones) [[d:warlock#1491435318732132393]]
- Healthstone is a single 1,200 HP stone; Soulwell costs 3 shards [[d:warlock#1464359558309740597]], [[d:warlock#1464417092869554227]]
- Soul shards stack to 3 per slot; ShardCapPlus counts slots, not shards [[d:warlock#1439148601224859680]]
consumables:
- Potion of Quickness, Juju Flurry, haste food (Danzo), Greater Arcane Elixir, Elixir of Greater Shadow Power, Dreamshard
  Elixir, Dreamtonic, wizard oil [[d:warlock#1437144597846425671]]
- Brilliant Wizard Oil (Blessed vs undead) [[d:warlock#1427210967053373501]]
- Haste food over MP5 food [[d:warlock#1429951129843794083]]
- Felstone default stone (heal generates threat) [[d:warlock#1490122874357551236]]; Voidstone if threat-limited
- Limited Invulnerability Potion as a threat drop
mistakes_to_avoid:
- Hard-casting Shadow Bolt or Immolate
- Casting Dark Harvest on cooldown, into a knockback, or with <5 s left on DoTs [[d:warlock#1432456413111914699]]
- Clipping DoTs early; letting Siphon Life drop (loses a Soul Siphon stack)
- Assuming Malediction refreshes a fallen Curse of Agony [[d:warlock#1465281355674947646]]
- Stacking crit or Intellect
- Skipping the 6% gear hit
- Taking Sinister Pursuit in a sacrifice build (use 2/3 Demonic Aegis) [[d:warlock#1484607150868136087]]
- Pet on aggressive near a boss pull
- Using one-button castsequence macros that clip DoTs [[d:warlock#1426230149959127154]]
- Letting soul shards overflow or run out
leveling_by_bracket:
- bracket: 1-10
  advice: Imp from the level-1 class quest; buy the best wand available (no spells compare early); Voidwalker quest ~8-10.
  sources:
  - '[[d:warlock#1114842876820590613]]'
  - '[[d:warlock#1404885885564092487]]'
  - '[[d:warlock#1399133734053216417]]'
  era: pre-1.18.1
  agreement: consensus
- bracket: 10-19
  advice: Voidwalker tanks; Corruption + Curse of Agony then wand; first 7 talents Imp Corruption + Imp Life Tap.
  sources:
  - '[[d:warlock#902303194112217158]]'
  - '[[d:warlock#1139910345176129576]]'
  era: pre-1.18.1
  agreement: consensus
- bracket: 20-29
  advice: Succubus at 20; drain tanking is NOT online yet — wand out-damages and out-efficiencies early Drain Life until the
    late-30s rank.
  sources:
  - '[[d:warlock#1410017237124780195]]'
  - '[[d:warlock#1367169475941498922]]'
  era: pre-1.18.1
  agreement: consensus
- bracket: 30-39
  advice: Shadoweave tailoring set is the leveling power spike (buy from AH if not a tailor); +shadow damage gear and skip
    Immolate; big Drain Life rank at 38; Scarlet Monastery for gear.
  sources:
  - '[[d:warlock#1371345124067639296]]'
  - '[[d:warlock#1302082714135953448]]'
  - '[[d:warlock#1419778210949890108]]'
  - '[[d:warlock#1078628023617716234]]'
  - '[[d:warlock#1373989374672244838]]'
  era: pre-1.18.1
  agreement: consensus
- bracket: 40-49
  advice: Voidwalker loses aggro to Shadoweave spell power; the Warlock becomes the tank (DoTs + Drain Life + Life Tap).
  sources:
  - '[[d:warlock#1080893294822817872]]'
  - '[[d:warlock#1490117148272496680]]'
  - '[[d:warlock#1097948220895793212]]'
  era: mixed
  agreement: consensus
- bracket: 50-60
  advice: Infernal quest at 50; Doomguard + Soulwell at 60; Affliction AoE-farms by dotting 3-4 mobs and kiting with Curse
    of Exhaustion; Dire Maul East lashers is the classic end farm.
  sources:
  - '[[d:warlock#1485033334907076718]]'
  - '[[d:warlock#1367169475941498922]]'
