gaps:
  - "No source gives a complete slot-by-slot raid-tier BiS list for any Warlock spec — the closest is a single player's flat, unordered, self-described-as-\"dated\" Affliction list (5mman, post-1.18.1), plus tier-set bonus text with a handful of named pieces (Plagueheart Raiment/Handwraps, Nathrezim set) and item IDs with no names (Mustachiocat's 2023 Discord-sourced list: items 51755, 65003, 83468, 60501, 60551, 83465, 60622)."
  - "Demonology and Destruction PvP have zero gear sources at all — only pet/CC tactics."
  - "No Warlock-forum thread gives a leveling item list (`t15091` \"Gear guide for new 60?\" got zero replies); `leveling.md` states this explicitly as a gap and tells bots to fall back to general upgrade heuristics rather than an invented list."
  - "The 1.18.1 Rogue/Warlock class-weapon quest chain (Timbermaw Hold, described as similar to Benediction/Anathema) has no reward name or stats in any source — a genuine gap, not an oversight here."
  - "Almost no item above has a numeric item ID; where IDs exist (Mustachiocat's list) the corresponding item names were never posted."
  - "Enchant recommendations are drawn from the community wiki's Warlock page (authority: wiki, least reliable tier) via the citing playbook, not from a forum post — no post-level citations exist for them, hence the empty `citations` lists on several enchant rows above."
