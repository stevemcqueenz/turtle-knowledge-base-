rotation_single:
- priority: 0
  action: pre-cast Soul Fire -> Immolate -> Conflagrate
  condition: opener [[d:warlock#1496147940673196062]], [[d:warlock#1496031075112062996]]
- priority: 1
  action: Soul Fire
  condition: Improved Soul Fire buff missing and Soul Fire ready [[d:warlock#1485580656120565841]]
- priority: 2
  action: Immolate
  condition: missing and target lives >9 s [[d:warlock#1465226534221512756]]
- priority: 3
  action: Conflagrate
  condition: ready and Immolate up
- priority: 4
  action: Shadowburn
  condition: ready and mana allows [[d:warlock#1496147940673196062]]
- priority: 5
  action: assigned curse
  condition: missing (1 s GCD)
- priority: 6
  action: Searing Pain
  condition: filler (~151 mana at 60 with 5/5 Cataclysm) [[d:warlock#1465226771694616801]]
- priority: 7
  action: Corruption
  condition: 'contested: L-star keeps it as a filler [[d:warlock#1467326093831704861]], Twospooky drops it [[d:warlock#1496147940673196062]]'
- priority: 8
  action: Life Tap / mana potion / tea
  condition: mana low
rotation_aoe:
- targets_min: 2
  priority: 1
  action: Immolate each, kill in mark order with Searing Pain
  condition: 1-3 targets [[d:warlock#1381052743828897965]]
- targets_min: 5
  priority: 2
  action: Hellfire (Wrathstone; warn healers)
  condition: 5+ stacked on tank [[d:warlock#1465521145162895546]]
- targets_min: 5
  priority: 3
  action: Rain of Fire
  condition: pack cleaves or needs range [[d:warlock#1452757128652525578]]
aoe_threshold: 5
cooldowns:
- name: Soul Fire
  use_when: 30 s CD, keep the Improved Soul Fire buff up
- name: Conflagrate
  use_when: on cooldown with Immolate up; on Thaddius only with a Polarity Charge stack [[d:warlock#1496149965825904764]]
- name: Shadowburn
  use_when: on cooldown unless mana-limited [[d:warlock#1496147940673196062]]
resource_rules:
- Sacrifice the Felhunter (mana) to Life Tap less; bring mana potions and tea [[d:warlock#1496147940673196062]]
- 'Burst on pull has no threat reduction: need a good tank [[d:warlock#1490499753312518144]]'
- Firestone proc scales only with level (~64 dmg at 60) [[d:warlock#1445825910098886688]]
consumables:
- Mana potions, tea [[d:warlock#1496147940673196062]]
- Potion of Quickness, Juju Flurry [[d:warlock#1486559373244370974]]
- Greater Firepower, Flask of Supreme Power, Brilliant Wizard Oil
- Goblin Sapper Charges on Naxx spider trash [[d:warlock#1459945548084674623]]
mistakes_to_avoid:
- Fire on fire-immune bosses (MC Ragnaros/Geddon, BWL Vael/drakes/Nefarian, Onyxia) [[d:warlock#1432406269402026124]], [[d:warlock#1488208031111188640]]
- Casting Shadow Bolt in a Fire spec
- Full burst before the tank has threat
- Hellfire into a cleaving pack or without warning healers
- Chaining instants back to back [[d:warlock#1496147940673196062]]
- Expecting Pyroclasm stuns from Hellfire (rolls once per channel) [[d:warlock#1458587593389113659]]
