    - {cite: "[[d:warlock#1493286788775805198]]", era: post-1.18.1, agreement: contested, topic: "fire cannot compete with drain/demo; slightly better than SM/Ruin if hit-capped"}
    - {cite: "[[d:warlock#1388995453873553489]]", era: pre-1.18.1, agreement: consensus, topic: "11-12% gear hit for SM/Ruin, Demo and Fire"}
    - {cite: "[[d:warlock#1484228321708478635]]", era: 1.18.1-announced-pre-release, agreement: consensus, topic: "the 11-point demonless dip reaches Demonic Sacrifice via Soul Entrapment"}
