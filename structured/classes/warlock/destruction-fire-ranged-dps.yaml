agreement: contested
patch_validity:
  written_for: "CC2/CC3; 1.18.1 Searing Pain and Hellfire revisions applied"
  valid_for_1181: true
  notes: "1.18.1 buffed Searing Pain (2.0-s cast, 57% SP, +~20% base dmg by 2026-03-19) and Hellfire (6.66% SP/tick, cheap per-second mana); no post-1.18.1 raid re-test exists to confirm whether this closed the gap to Affliction."
talents:
  build_name: "Firelock (no full 51-point list given by any source; only talent-calculator links, one pre-CC2-live)"
  points: []
  leveling_order: []
stat_weights:
  hit: "highest priority (~16% vanilla level-63 cap cited by a player; Fire has no talent hit)"
  crit: "second (Ruin, Firestone, Devastation, Improved Searing Pain); contested by one pre-live source who argued for pure spell power instead"
  spell_power: "third"
  haste: "unclear/unanswered whether it matters now that Searing Pain's GCD and cast scale with haste since 1.18.1"
stat_priority: [spell-hit-to-16-percent, crit, spell-power, haste]
stat_priority_note: "\"You need to get 16% hit chance as fire warlock and on top of that at least 20% crit\" — the 16% is a player restatement of the vanilla level-63 cap, not a staff number. Crit comes next because Ruin, Devastation, the Firestone and Improved Searing Pain all key off it; CONTESTED by Xudo, who argues a pure Soul Fire/Immolate/Conflagrate rotation should go straight to spell power instead. Haste became relevant when 1.18.1 gave Searing Pain a 2 s cast that scales with it; the older \"is haste useless for fire locks\" question predates that and was never answered."
caps: {}
rotation_single:
  - {priority: 1, action: "Soul Fire", condition: "Improved Soul Fire buff missing and Soul Fire off cooldown (buff applies on cast since 2024-12-20)"}
  - {priority: 2, action: "Immolate", condition: "missing (Conflagrate consumes 3 s of it without removing it)"}
  - {priority: 3, action: "Conflagrate", condition: "off cooldown (10-s CD, 1-s GCD) and Immolate is up"}
  - {priority: 4, action: "Curse of the Elements", condition: "missing"}
  - {priority: 5, action: "Corruption", condition: "Improved Soul Fire buff has <=5 s left and Soul Fire is not ready (bridge filler)"}
  - {priority: 6, action: "Searing Pain", condition: "default filler (2.0-s cast base, 1.5 s with 5/5 Bane, 1-s GCD, +~20% base dmg since 2026-03-19); never Shadow Bolt"}
  - {priority: 7, action: "Life Tap", condition: "mana below Soul Fire + Immolate cost"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Immolate each target, Conflagrate the main target, Searing Pain filler", condition: "2-3 targets"}
  - {targets_min: 4, priority: 1, action: "Hellfire (with Wrathstone) on a tanked, non-cleaving stack", condition: "4+ targets"}
  - {targets_min: 4, priority: 2, action: "Rain of Fire", condition: "melee cleave or fire-reflect makes standing in melee unsafe"}
aoe_threshold: 4
cooldowns:
  - {name: "Soul Fire", use_when: "30-s CD, core rotation piece, costs a shard unless Improved Soul Fire refunds it"}
  - {name: "Conflagrate", use_when: "10-s CD, whenever Immolate is up"}
  - {name: "Inferno", use_when: "10-min CD (halved by Master Summoner), trash-only cooldown for demo/destro hybrids"}
resource_rules:
  - "Life Tap for mana; Cataclysm reduces Fire spell cost; Fire has no Improved Life Tap reachable without Affliction points"
  - "keep 3+ Soul Shards for Soul Fire"
  - "swap Firestone/Wrathstone/Voidstone depending on whether crit, Hellfire threat, or spell threat reduction is needed"
consumables:
  - "Flask of Supreme Power"
  - "Fire/Arcane resist potions per raid"
  - "Goblin sappers/bombs on trash (benefit from Fire damage bonuses)"
  - "Healthstone"
mistakes_to_avoid:
  - "Bringing Fire to Molten Core / Blackwing Lair (fire-immune content)"
  - "Letting the Improved Soul Fire buff drop before refreshing it"
  - "Hellfire without Wrathstone or a healer warning, or into a cleaving pack"
  - "Inferno on every trash pack in a 5-man dungeon"
  - "Casting Shadow Bolt as a Fire lock"
  - "Expecting frequent Pyroclasm stuns from Hellfire (the 26% chance is per full channel, not per tick, ~1.7%/tick)"
  - "Taking Aftermath for its slow (both value and proc rate criticized)"
