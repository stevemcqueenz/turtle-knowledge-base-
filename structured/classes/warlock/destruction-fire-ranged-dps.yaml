stat_priority_note: 'Guiltyhaomarush [p=168196]: "you need to get 16% hit chance as fire warlock and on top of that at least
  20% crit" — the 16% is a player restatement of the vanilla level-63 cap, not a staff number. Crit comes next because Ruin,
  Devastation, the Firestone and Improved Searing Pain all key off it; CONTESTED by Xudo, who argues a pure Soul Fire/Immolate/Conflagrate
  rotation should go straight to spell power instead. Haste became relevant when 1.18.1 gave Searing Pain a 2 s cast that
  scales with it; the older thread asking whether haste does anything for fire warlocks [p=120182] predates that and was never
  answered.'
