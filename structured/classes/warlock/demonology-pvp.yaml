resource_rules:
- 'Curse of Exhaustion is the class''s primary PvP slow: 10% base, 40% only with 20+ Affliction points (Improved Curse of
  Exhaustion), 190 mana since 1.18.1'
- Health Funnel the pet between engagements; Voidwalker Sacrifice when the pet is about to die or before a Fel Domination
  re-summon
- 'one curse per target: Corruption + Curse of Agony/Exhaustion/Tongues, Siphon Life if reached, Immolate only when Seduction
  is not needed'
- 'Soul Link strength is contested on record: banned in duelling tournaments vs ''soul link is simply not playable anymore
  in pvp'' post-CC3 [[d:pvp-general#1113087406359449671]], [[d:warlock#1423810612437450832]]'
- Felguard is bad on Blades Edge (pillars/rope) and vs geared teams who kill it; greater demons cannot be brought into BGs
  unless summoned inside [[d:warlock#1424134340052520980]], [[d:warlock#1436498300542128168]]
consumables:
- Spellstone (on-use magic dispel + absorb, level x12) shares the Healthstone cooldown and is the preferred PvP stone for
  many players — 'giga strong against sp, warlocks and mages' [[d:warlock#1209940014520336435]]
- Free Action Potion, Limited Invulnerability Potion (denies warrior rage), Flask of the Titans / Supreme Power, protection
  potions (Holy vs Paladin), heal/mana pots, bandages [[d:warlock#1411574992134738042]], [[d:warlock#1394677049758584832]],
  [[d:warlock#1300912243424100423]]
- 'Engineering: grenades, sapper charges, reflectors, rocket boots/helmet, target dummy [[d:warlock#1285479733110509580]],
  [[d:warlock#1419960348370534450]]'
mistakes_to_avoid:
- Relying on a greater demon in battlegrounds (one Fear/Banish wastes it) [[d:warlock#1469459298722775227]]
- Leaving Lash of Pain on autocast
- Taking Demonic Sacrifice with Soul Link
pvp_race:
- 'Post-1.18.1 advice: Undead for PvP (WotF), Orc for Demo/Destro, Troll for Affliction; Orc Hardiness was ''nerfed into the
  ground'', making WotF the superior PvP racial [[d:warlock#1488436339962548264]], [[d:warlock#1491111022877216972]] (consensus,
  post-1.18.1)'
