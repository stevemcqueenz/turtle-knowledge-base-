stat_weights:
  stamina: "high, first priority (Soul Link splits damage with the pet; Demonic Embrace). Discord: practical full-PvP-BiS HP pool ~6-6.8k, Voidwalker nearer 8k [[d:warlock#1378813710327615568]]"
  pet_stamina: "high via Fel Stamina (10-50% of the Warlock's own Stamina); a forum source targets ~30%+ of Warlock stamina on the demon (Akarui, forum p=142148, 2025-07-30)"
  spell_power: "medium, secondary to survivability stats"
caps: {}
rotation_single: []
rotation_aoe: []
aoe_threshold: 0
cooldowns:
  - {name: "Inferno / Demon Gate / Ritual of Doom", use_when: "fight expected to last >30 s; pre-cast Demon Gate out of combat since it can be interrupted by damage. Demon Gate and Inferno reset each arena match — pre-summon during ready-up [[d:warlock#1436498300542128168]]"}
  - {name: "Power Overwhelming", use_when: "demon CC'd, or to force 10 s of burst; costs 40% of the demon's base health"}
  - {name: "Death Coil", use_when: "melee connects for significant damage (~2000), or to peel"}
  - {name: "Fel Domination", use_when: "instant re-summon after a demon dies or is lost"}
resource_rules:
  - "Curse of Exhaustion is the class's primary PvP slow: 10% base, 40% only with 20+ Affliction points (Improved Curse of Exhaustion), 190 mana since 1.18.1"
  - "Health Funnel the pet between engagements; Voidwalker Sacrifice when the pet is about to die or before a Fel Domination re-summon"
  - "one curse per target: Corruption + Curse of Agony/Exhaustion/Tongues, Siphon Life if reached, Immolate only when Seduction is not needed"
  - "Soul Link strength is contested on record: banned in duelling tournaments vs 'soul link is simply not playable anymore in pvp' post-CC3 [[d:pvp-general#1113087406359449671]], [[d:warlock#1423810612437450832]]"
  - "Felguard is bad on Blades Edge (pillars/rope) and vs geared teams who kill it; greater demons cannot be brought into BGs unless summoned inside [[d:warlock#1424134340052520980]], [[d:warlock#1436498300542128168]]"
consumables:
  - "Spellstone (on-use magic dispel + absorb, level x12) shares the Healthstone cooldown and is the preferred PvP stone for many players — 'giga strong against sp, warlocks and mages' [[d:warlock#1209940014520336435]]"
  - "Free Action Potion, Limited Invulnerability Potion (denies warrior rage), Flask of the Titans / Supreme Power, protection potions (Holy vs Paladin), heal/mana pots, bandages [[d:warlock#1411574992134738042]], [[d:warlock#1394677049758584832]], [[d:warlock#1300912243424100423]]"
  - "Engineering: grenades, sapper charges, reflectors, rocket boots/helmet, target dummy [[d:warlock#1285479733110509580]], [[d:warlock#1419960348370534450]]"
mistakes_to_avoid:
  - "Hard-casting a Voidwalker under pressure without Fel Domination up"
  - "Using Curse of Exhaustion as if it still slowed 50% (it does not since CC3, and costs more mana since 1.18.1)"
  - "Summoning a Felguard/Infernal in the open expecting to not be focused"
  - "Forgetting Soul Link's damage transfer can kill a low-health pet outright"
  - "Expecting Voidwalker Sacrifice to absorb a full burst opener (only 1-2 extra hits)"
  - "Playing Soul Link on Alliance and relying on Fear against Undead (Will of the Forsaken)"
pvp_race:
  - "Post-1.18.1 advice: Undead for PvP (WotF), Orc for Demo/Destro, Troll for Affliction; Orc Hardiness was 'nerfed into the ground', making WotF the superior PvP racial [[d:warlock#1488436339962548264]], [[d:warlock#1491111022877216972]] (consensus, post-1.18.1)"
