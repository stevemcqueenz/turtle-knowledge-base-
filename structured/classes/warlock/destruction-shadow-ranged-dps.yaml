agreement: contested
patch_validity:
  written_for: "CC2 tree (30/0/21 SM/Ruin), unchanged by CC3 and 1.18.1 except renames"
  valid_for_1181: true
  notes: "1.18.1 changed nothing structural for this build (only curse GCDs, Curse of Exhaustion/Tongues cost, Master Conjuror removal); the 2026-02 dummy tests reporting SM/Ruin far behind Affliction (250 vs 450 DPS) are the most recent data and are not contradicted."
talents:
  build_name: "SM/Ruin 30/0/21 (explicit list from LastyK + community wiki); DS/Ruin (Demonic Sacrifice) is a contested variant"
  points:
    - {tree: Affliction, talent: "Improved Corruption", rank: 5, spell_id: null}
    - {tree: Affliction, talent: "Grim Reach", rank: 2, spell_id: null}
    - {tree: Affliction, talent: Nightfall, rank: 2, spell_id: null}
