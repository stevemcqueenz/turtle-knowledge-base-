stat_weights:
  hit: "contested priority: one source says the hit cap is not mandatory (a top parser ran 7-9% hit), another says it is the one thing to bring to a first raid. Discord: 11-12% from gear (15-16% cap) for SM/Ruin, Demo and Fire [[d:warlock#1388995453873553489]], [[d:warlock#1387659949374443561]]"
  crit: "wanted (Ruin doubles crit damage; Shadow Vulnerability is crit-driven since 2024-12-20)"
  spell_power: "high (Shadow Bolt scales strongly; Flask of Supreme Power adds ~128 points to an average bolt)"
  stamina: "medium (T3 Plagueheart Raiment carries ~73 more stamina than the Affliction set)"
stat_priority: [hit-to-cap, crit, spell-power, stamina]
caps:
  gear_hit: "11-12% from gear, 15-16% cap for all Destruction builds [[d:warlock#1388995453873553489]], [[d:warlock#1387659949374443561]] (consensus); one forum source runs 7-9% and still parses (contested)"
rotation_single:
  - {priority: 1, action: "Shadow Bolt", condition: "Nightfall proc up (instant, cannot miss)"}
  - {priority: 2, action: "recast assigned raid curse", condition: "missing"}
  - {priority: 3, action: "Corruption", condition: "missing (instant with 5/5 Improved Corruption); Siphon Life is not used in this build's max-DPS rotation (threat)"}
  - {priority: 4, action: "Shadowburn", condition: "target below Shadowburn health range, or fight ending, or moving (costs a shard)"}
  - {priority: 5, action: "Shadow Bolt", condition: "default filler"}
  - {priority: 6, action: "Life Tap", condition: "mana below one Shadow Bolt's cost"}
  - {priority: 7, action: "Keep curses + Corruption, otherwise Shadow Bolt; Siphon Life dropped for threat", condition: "Discord-confirmed SM/Ruin rule [[d:warlock#1428791458672021596]]", sources: ["[[d:warlock#1428791458672021596]]"], era: 1.18.1-announced-pre-release, agreement: "consensus (forum KB)"}
rotation_aoe:
  - {targets_min: 2, priority: 1, action: "Corruption (+ Curse of Agony if Malediction) on each, Shadow Bolt the kill target", condition: "2-3 targets"}
  - {targets_min: 4, priority: 1, action: "Rain of Fire or Hellfire", condition: "4+ targets; Fire is resisted in Molten Core/Blackwing Lair"}
  - {targets_min: 3, priority: 2, action: "Affliction-style multi-dot is not this build's job", condition: "SM/Ruin is a single-target Shadow Bolt turret; the channel notes only ~55-60% of its damage is Shadow Bolt, so hit/crit are less mandatory than assumed [[d:warlock#1490901049777721516]]", sources: ["[[d:warlock#1490901049777721516]]"], era: post-1.18.1, agreement: single source}
aoe_threshold: 4
cooldowns:
  - {name: Shadowburn, use_when: "target near death or fight ending; costs a shard"}
  - {name: "Death Coil", use_when: "defensive/emergency"}
resource_rules:
  - "Life Tap is the mana engine, scaled by Improved Life Tap and Shadow Mastery"
  - "Shadowburn and Soul Fire (if used) each cost a shard; Soul Fire is not part of this rotation in any source"
  - "track Nightfall with an addon (Necrosis or TNE_Nightfall)"
  - "DS/Ruin is contested: Discord computes the Demonic Sacrifice package as only '3%-5% dps increase unless demon dies to raid mechanics' over keeping the Imp, and the Fire/Destro demonless dip reaches the same +10% (Imp sac +4% + Soul Entrapment 6%) [[d:warlock#1404709089526677505]], [[d:warlock#1405348590494285984]]"
consumables:
  - "Flask of Supreme Power"
  - "resist potions per raid"
  - "Healthstone"
mistakes_to_avoid:
  - "Gearing for the wrong Improved Shadow Bolt mechanic after the 2024-12-20 revert back to crit-driven procs"
  - "Skipping Malediction while also carrying a raid curse"
  - "Summoning Infernal without Demonology talents (uncontrolled, disruptive)"
  - "Casting Siphon Life for 'free' damage in a threat-limited raid"
  - "Letting the Imp die to AoE and losing Blood Pact instead of parking it with Take Position or sacrificing it on unavoidable-pet-damage fights"
  - "Believing SM/Ruin is still the 2026 raid default — the channel's post-1.18.1 consensus is Affliction by default and Demonology on short fights, with SM/Ruin behind [[d:warlock#1439237831410188408]], [[d:warlock#1483576857428361257]]"
