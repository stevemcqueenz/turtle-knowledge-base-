rotation_single:
- priority: 1
  action: assigned curse (+Malediction Curse of Agony)
  condition: missing [[d:warlock#1476505618654302291]]
- priority: 2
  action: Corruption
  condition: missing
- priority: 3
  action: Shadow Bolt (instant on Nightfall)
  condition: filler
- priority: 4
  action: Shadowburn
  condition: target low and no time for a Shadow Bolt [[d:warlock#1476505618654302291]]
- priority: 5
  action: Siphon Life
  condition: long fights (Patchwerk)
- priority: 6
  action: Drain Soul
  condition: long-lived target while Shadowburn on cooldown
- priority: 7
  action: skip DoTs, pure Shadow Bolt
  condition: 5-man dungeons [[d:warlock#1486106500270395473]]
rotation_aoe:
- targets_min: 5
  priority: 1
  action: Hellfire or Rain of Fire
  condition: 5+ stacked mobs
aoe_threshold: 5
cooldowns:
- name: Shadowburn
  use_when: finisher
- name: on-use trinkets
  use_when: with DoT reapplication
resource_rules:
- Life Tap; crits are more mana-efficient than haste [[d:warlock#1464549874644156568]]
- Keep the Imp out for Blood Pact (no Demonology points)
- Atiesh holders often play SM/Ruin for the raid buff [[d:warlock#1431641229728419955]]
consumables:
- Flask of Supreme Power, Greater Arcane Elixir, Elixir of Shadow Power, Brilliant Wizard Oil
- Healthstone
mistakes_to_avoid:
- Playing SM/Ruin below T2.5 hit levels
- Relying on Suppression for Shadow Bolt hit [[d:warlock#1491843936715542548]]
- Dotting in 5-mans [[d:warlock#1486106500270395473]]
