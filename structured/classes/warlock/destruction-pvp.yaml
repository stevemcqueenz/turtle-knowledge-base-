patch_validity:
  written_for: "CC2-era meta (Nov 2024 - Jul 2025); CC3 and 1.18.1 numbers applied where sourced"
  valid_for_1181: unknown
  notes: "CC3 (2025-08-15) cut Curse of Exhaustion from 50% to a 10%/40% split, making it 'ABSURDLY' weaker than Demonology per one 2025-06 source; 1.18.1 raised its mana cost to 190 and buffed Searing Pain; no post-1.18.1 forum thread re-ranks the three PvP builds, but Discord does: a single-source player tier list has Affliction S / Fire A / Demo B, and another calls Affliction the only good PvP spec [[d:warlock#1491191968494256168]], [[d:warlock#1489224572174602251]]. The new per-spec PvP dampening values are not published."
