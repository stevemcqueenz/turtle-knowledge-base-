stat_weights:
  stamina: "first priority (PvP survivability over raw damage). Discord confirms as consensus and adds the ~6-6.8k HP benchmark [[d:warlock#1378813710327615568]]"
  spell_damage: "shadow/fire spell damage next (cheap greens named as good value)"
  crit: "wanted for Soul Fire/Conflagrate burst"
  hit: "lower priority than in PvE (level-60 targets)"
caps:
  stamina_benchmark: "~6-6.8k HP full PvP BiS; ~8k with Voidwalker/Fel Stamina shenanigans [[d:warlock#1378813710327615568]] (single source)"
rotation_single:
  - {priority: 1, action: "Succubus Lesser Invisibility opener, then Seduction on the target or healer", condition: "opener"}
  - {priority: 2, action: "Curse of Exhaustion (if talented) or Curse of Tongues (casters) or Curse of Agony (target unlikely to be dispelled)", condition: "opener, after Seduction"}
  - {priority: 3, action: "Soul Fire (hard-cast)", condition: "target is seduced/feared (opener)"}
  - {priority: 4, action: "Immolate then Conflagrate then Shadowburn", condition: "opener follow-up"}
  - {priority: 5, action: "Conflagrate", condition: "target in range, Immolate up, Conflagrate ready (Pyroclasm stun chance)"}
  - {priority: 6, action: "Shadowburn", condition: "target below ~500 health or fleeing"}
  - {priority: 7, action: "Shadow Bolt", condition: "Nightfall proc (NF build)"}
  - {priority: 8, action: "Death Coil, disengage, then Fear or Curse of Exhaustion", condition: "melee connecting on you"}
  - {priority: 9, action: "Immolate", condition: "missing (only on the kill target, breaks Seduction if that target is seduced)"}
  - {priority: 10, action: "Soul Fire", condition: "ready and target controlled"}
  - {priority: 11, action: "Searing Pain", condition: "filler (1-s GCD since 1.18.1, cast time raised to 2.0 s with 57% SP, then +~20% base damage revision)"}
rotation_aoe: []
aoe_threshold: 0
cooldowns:
  - {name: "Death Coil", use_when: "3-min CD, melee burst or to disengage"}
  - {name: "Healthstone / Spellstone", use_when: "shared CD; Spellstone dispels magic on self and absorbs (level x 12)"}
resource_rules:
  - "Curse of Exhaustion is the primary slow tool: 30% at row 3 (CC2) -> 10% base + Improved 15/30% at row 5 (CC3, max 40% total) -> 190 mana (1.18.1)"
  - "pet choice by matchup: Voidwalker default/versatile, Succubus for kill setup, Felhunter vs casters (Devour Magic autocast to dispel healer buffs)"
  - "post-1.18.1 Destro is called a 'wheelchair spec': no CoE on the build, everything hard-cast, and by the time Immolate lands the warrior is in charge range [[d:warlock#1487499992615882772]] (single source, post-1.18.1)"
consumables:
  - "Holy Protection potion vs Paladins"
  - "Engineering grenades to land casts through pushback"
  - "Healthstone/Spellstone (shared cooldown)"
  - "Discord roster: Free Action Potion, LIP (denies warrior rage), Flask of the Titans/Supreme Power, protection potions, PvP heal/mana pots, bandages; engineering grenades/sappers/reflectors/rocket boots/target dummy [[d:warlock#1411574992134738042]], [[d:warlock#1394677049758584832]], [[d:warlock#1300912243424100423]], [[d:warlock#1285479733110509580]], [[d:warlock#1419960348370534450]]"
  - "Top PvP trinkets: Zandalarian Hero Charm / Restrained Essence of Sapphiron (SP pump), Tidal Charm (stun), Neltharion's Tear (hit + SP), Reflectors [[d:warlock#1062445024341655644]], [[d:warlock#1312397951850512457]], [[d:warlock#1329378303659737193]]"
pvp_matchups:
  - {vs: warrior, verdict: "favoured: Voidwalker Sacrifice denies rage; CoE before Charge then Death Coil", sources: ["[[d:warlock#1331017705658122240]]", "[[d:warlock#1416231530354708601]]", "[[d:pvp-general#1351160314342936608]]"], agreement: "consensus (warrior side), contested after CC3 CoE cut"}
  - {vs: rogue, verdict: "hard/losing; trinket + Death Coil -> Immolate/Conflag -> kite; pet choice (Felhunter/Succubus) decides it", sources: ["[[d:pvp-general#1358235113535574017]]", "[[d:warlock#1312397951850512457]]", "[[d:warlock#1412421339352137758]]"], agreement: consensus}
  - {vs: paladin, verdict: "Felhunter eats HoJ with Devour Magic then Spell Lock; contested because Spell Lock silence is bugged (~1 s)", sources: ["[[d:warlock#1140091225660198972]]", "[[d:pvp-general#1126789007439822858]]", "[[d:warlock#1392300020958625803]]"], agreement: "contested (silence duration)"}
  - {vs: hunter, verdict: "favoured except BM (kill the pet first); smart hunters stack shadow/arcane resist on the pet", sources: ["[[d:warlock#1331017705658122240]]", "[[d:warlock#1418322782692966520]]"], agreement: contested}
  - {vs: priest, verdict: "control war: Spell Lock + CoT or Seduce + CoT; Spellstone removes silences; Shadow Priest is the harder dispel matchup", sources: ["[[d:pvp-general#1382720814482329600]]", "[[d:warlock#1209940014520336435]]"], agreement: consensus}
  - {vs: shaman, verdict: "wins on paper (CoT cripples the nature kit, CoE kites) but grouped shamans hard-counter fear/seduce (Tremor/Grounding/Earth Shock)", sources: ["[[d:pvp-general#1138134954014933022]]", "[[d:warlock#1299347161649250408]]", "[[d:warlock#1482345452148887715]]"], agreement: contested}
  - {vs: druid, verdict: "favoured; Paranoia counters stealth openers; a good druid decurses DoTs quickly", sources: ["[[d:pvp-general#1134586904780746795]]", "[[d:warlock#1385903296031752212]]"], agreement: consensus}
  - {vs: mage, verdict: "mage-favoured vs Affliction (dispels + Counterspell); Destro closer; Spellstone removes Polymorph/silence", sources: ["[[d:pvp-general#1430022003674447904]]", "[[d:warlock#1146454951002902700]]"], agreement: single source}
  - {vs: "warlock mirror", verdict: "Felhunter primary; decided by landing Seduce/Death Coil and pet survival; Soul Link banned in duels", sources: ["[[d:warlock#1348439442708496435]]", "[[d:warlock#1427998109861941421]]", "[[d:pvp-general#1113087406359449671]]"], agreement: "single source / contested"}
  - {vs: "melee cleave", verdict: "default loss when trained by 2+ melee; Soul Link + VW Sacrifice + Death Coil (2 min) is the only peel", sources: ["[[d:pvp-general#1278958230449426478]]", "[[d:warlock#1399432909311574158]]"], agreement: consensus}
pvp_race:
  - "Post-1.18.1: Undead for PvP (WotF), Orc for Demo/Destro, Troll for Affliction; Orc Hardiness 'nerfed into the ground' makes WotF the superior PvP racial [[d:warlock#1488436339962548264]], [[d:warlock#1491111022877216972]], [[d:warlock#1488865404519583745]] (consensus, post-1.18.1)"
  - "Dwarf Warlock (new 1.18.1 Alliance combination) has no PvP evaluation in either corpus — gap"
mistakes_to_avoid:
  - "Hard-casting Fear on a melee target (6-s cast under pushback); use Death Coil/Seduce first"
  - "Casting Immolate on a seduced target (breaks Seduction)"
  - "Using the class Dreadsteed mount in contested/combat zones (interruptible, silenceable)"
  - "Running out of shards for Shadowburn/Soul Fire/pet"
  - "Bringing the wrong pet for the matchup"
  - "Spamming Curse of Exhaustion post-1.18.1 without tracking its mana cost (190/cast)"
  - "Assuming Felhunter Spell Lock reliably silences for its tooltip duration (long-reported as bugged, ~1 s instead of 3 s)"
