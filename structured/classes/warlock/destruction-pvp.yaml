mistakes_to_avoid:
- Hard-casting at melee range
- Fear on Undead before Will of the Forsaken is used
- Lash of Pain autocast cancels Seduction [[d:warlock#1465198561955418367]]
- Destruction into fire reflector/immunity [[d:warlock#1469458947969909015]]
- Burning Death Coil early
