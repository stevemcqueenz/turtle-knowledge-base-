  condition: after Soul Fire
- priority: 4
  action: Shadowburn
  condition: target low
- priority: 5
  action: Death Coil
  condition: melee on you
- priority: 6
  action: Fear / Curse of Recklessness fear-juggle
  condition: peel; CoR stops a feared target fleeing [[d:warlock#1490124423288717403]]
- priority: 7
  action: Searing Pain
