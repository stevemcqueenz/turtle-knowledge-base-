resource_rules:
- Spellstone removes magic silences/debuffs (shares Healthstone CD) [[d:warlock#1454095765600473179]]
- PvP damping and resilience both reduce DoT damage [[d:warlock#1490175529209430066]]
- Fire reflectors and the fire-immunity trinket counter Destruction [[d:warlock#1469458947969909015]]
consumables:
- Free Action Potion, Flask of the Titans, arcane bombs [[d:warlock#1394677049758584832]]
- Limited Invulnerability Potion (deny rage) [[d:warlock#1411574992134738042]]
- 'Engineering: grenades, reflectors, rocket boots/helmet [[d:warlock#1285479733110509580]]'
pvp_matchups:
- vs: warrior
  verdict: 'favoured: Voidwalker Sacrifice denies rage; CoE before Charge then Death Coil'
  sources:
  - '[[d:warlock#1331017705658122240]]'
  - '[[d:warlock#1416231530354708601]]'
  - '[[d:pvp-general#1351160314342936608]]'
  agreement: consensus (warrior side), contested after CC3 CoE cut
- vs: rogue
  verdict: hard/losing; trinket + Death Coil -> Immolate/Conflag -> kite; pet choice (Felhunter/Succubus) decides it
  sources:
  - '[[d:pvp-general#1358235113535574017]]'
  - '[[d:warlock#1312397951850512457]]'
  - '[[d:warlock#1412421339352137758]]'
  agreement: consensus
- vs: paladin
  verdict: Felhunter eats HoJ with Devour Magic then Spell Lock; contested because Spell Lock silence is bugged (~1 s)
  sources:
  - '[[d:warlock#1140091225660198972]]'
  - '[[d:pvp-general#1126789007439822858]]'
  - '[[d:warlock#1392300020958625803]]'
  agreement: contested (silence duration)
- vs: hunter
  verdict: favoured except BM (kill the pet first); smart hunters stack shadow/arcane resist on the pet
  sources:
  - '[[d:warlock#1331017705658122240]]'
  - '[[d:warlock#1418322782692966520]]'
  agreement: contested
- vs: priest
  verdict: 'control war: Spell Lock + CoT or Seduce + CoT; Spellstone removes silences; Shadow Priest is the harder dispel
    matchup'
  sources:
  - '[[d:pvp-general#1382720814482329600]]'
  - '[[d:warlock#1209940014520336435]]'
  agreement: consensus
- vs: shaman
  verdict: wins on paper (CoT cripples the nature kit, CoE kites) but grouped shamans hard-counter fear/seduce (Tremor/Grounding/Earth
    Shock)
  sources:
  - '[[d:pvp-general#1138134954014933022]]'
  - '[[d:warlock#1299347161649250408]]'
  - '[[d:warlock#1482345452148887715]]'
  agreement: contested
- vs: druid
  verdict: favoured; Paranoia counters stealth openers; a good druid decurses DoTs quickly
  sources:
  - '[[d:pvp-general#1134586904780746795]]'
  - '[[d:warlock#1385903296031752212]]'
  agreement: consensus
- vs: mage
  verdict: mage-favoured vs Affliction (dispels + Counterspell); Destro closer; Spellstone removes Polymorph/silence
  sources:
  - '[[d:pvp-general#1430022003674447904]]'
  - '[[d:warlock#1146454951002902700]]'
  agreement: single source
- vs: warlock mirror
  verdict: Felhunter primary; decided by landing Seduce/Death Coil and pet survival; Soul Link banned in duels
  sources:
  - '[[d:warlock#1348439442708496435]]'
  - '[[d:warlock#1427998109861941421]]'
  - '[[d:pvp-general#1113087406359449671]]'
  agreement: single source / contested
- vs: melee cleave
  verdict: default loss when trained by 2+ melee; Soul Link + VW Sacrifice + Death Coil (2 min) is the only peel
  sources:
  - '[[d:pvp-general#1278958230449426478]]'
  - '[[d:warlock#1399432909311574158]]'
  agreement: consensus
