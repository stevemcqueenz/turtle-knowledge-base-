stat_weights:
  hit: to ~6% (demon melee cap via Demonic Precision 90% + 3%), target 11-12%, 16% ideal for demon spells [[d:warlock#1486868497693937906]],
    [[d:warlock#1486868596096241805]], [[d:warlock#1494313197874970705]]
  crit: high past 6% hit; crit is shared with the demon (pet melee crits 200%) [[d:warlock#1447742557114077307]], [[d:warlock#1488619415791734956]];
    ~1.6-1.8x normal value [[d:warlock#1428821206009643039]]
  spell_power: high; UP gives the demon up to 45% of your SP as SP/AP [[d:warlock#1464540604250722397]]; AP school contested
    (highest vs shadow only) [[d:warlock#1432720871461617757]], [[d:warlock#1491200463385792663]]
  haste: zero for the demon (only UP stacks slightly faster) [[d:warlock#1488467880667381891]]
  intellect: 'medium: Fel Intellect gives the demon 30% of your Int as its SP [[d:warlock#1484214562004930621]]'
  stamina: 'medium: Fel Stamina, Power Overwhelming base-health cost, Soul Link'
caps:
  gear_hit: 6% minimum (demon melee), 11-12% target [[d:warlock#1486868497693937906]], [[d:warlock#1486868596096241805]];
    8-10% "just fine" [[d:warlock#1494849835294134284]]
  crit_diminishing: above ~30% caster crit the demon falls slightly behind 1:1 [[d:warlock#1432796175735455885]]
rotation_single:
- priority: 0
  action: summon the boss greater demon pre-pull; set Felguard Cleave autocast, Felstorm manual; Doomguard Infernal Blade
    on
  condition: pre-pull [[d:warlock#1491048996846698547]]
- priority: 1
  action: pet attack (/script PetAttack())
  condition: pet idle; re-issue after Take Position [[d:warlock#1465463647894765712]]
- priority: 2
  action: on-use trinket (Black Book) + Power Overwhelming + Felstorm
  condition: on the 3rd Unleashed Potential stack [[d:warlock#1473595062918185033]]
- priority: 3
  action: Power Overwhelming (no GCD)
  condition: off cooldown and demon can afford 40% of base health; tell healers [[d:warlock#1491048996846698547]], [[d:warlock#1442919256663789711]]
- priority: 4
  action: direct-damage spell or rank-1 Health/Mana Funnel tick
  condition: Unleashed Potential about to expire [[d:warlock#1458913059501506673]]
- priority: 5
  action: curse (Curse of Recklessness if free choice)
  condition: missing [[d:warlock#1487040479907287240]]
- priority: 6
  action: Corruption
  condition: only if it will last full duration; on trash only if mobs live >18 s [[d:warlock#1483907298123448390]]
- priority: 7
  action: Shadow Bolt
  condition: 'default filler; short fights: 2x Searing Pain + Shadowburn or 3x Searing Pain [[d:warlock#1491048996846698547]]'
- priority: 8
  action: Health Funnel
  condition: demon below ~50% and no AoE imminent [[d:warlock#1448706339974025398]]
- priority: 9
  action: finish the greater demon with Power Overwhelming before its 3-minute timer ends
  condition: timer near end [[d:warlock#1475217712006434837]]
rotation_aoe:
- targets_min: 3
  priority: 1
  action: Felstorm (after tank AoE threat), then Hellfire
  condition: stacked trash [[d:warlock#1474540725000470660]], [[d:warlock#1464960947918733333]]
- targets_min: 3
  priority: 2
  action: Infernal + Power Overwhelming + 3-stack UP + Hellfire
  condition: stacked trash, Infernal available
- targets_min: 1
  priority: 3
  action: curse of Recklessness then Shadow Bolt; add Immolate/Corruption only if mobs live >18 s
  condition: fast trash [[d:warlock#1483907298123448390]]
aoe_threshold: 3
cooldowns:
- name: Inferno (Infernal)
  use_when: 5 min with Master Summoner; lowest CD, fire immune, physical punches [[d:warlock#1464562452476723223]], [[d:warlock#1424158415739027640]]
- name: Demon Gate (Felguard)
  use_when: 15 min; AoE and single-target burst; Felguard spawns 4 s after cast [[d:warlock#1485736529501491250]]
- name: Ritual of Doom (Doomguard)
  use_when: 30 min; 3 s cast, 1 helper since 1.18.1; single-target [[d:warlock#1491589394480627833]], [[d:warlock#1485736529501491250]]
- name: Power Overwhelming
  use_when: on cooldown when demon health allows; removes CC from the demon [[d:warlock#1440858777116086273]]
- name: Fel Domination
  use_when: instant re-summon when the pet dies mid-combat [[d:warlock#1475587639188000959]]
- name: The Black Book
  use_when: on the 3rd UP stack with PO/greater demon [[d:warlock#1446169503003185325]]
resource_rules:
- Health Funnel is your pet healer (healers get -50% on greater/enslaved demons) [[d:warlock#1448706339974025398]], [[d:warlock#1464989010383605901]]
- 'Greater demons: 3 minutes under control with Soul Link; die if they aggro another player; deleted if the raid heals ~600
  near a broken-loose demon [[d:warlock#1490963345967419542]], [[d:warlock#1442922075617493094]], [[d:warlock#1489971548717580419]]'
- No pet threat reduction exists (no Salvation/totem/Voidstone on greater demons) [[d:warlock#1485689509197774958]]
- Demonology has the weakest mana economy; Potion of Quickness is a luxury [[d:warlock#1440503674555334688]], [[d:warlock#1465503280460333178]]
- Battle Shout on a lesser demon blocks Unleashed Potential stacks (bug, Jan 2026) [[d:warlock#1464813724891091156]]
consumables:
- Flask of Supreme Power, Greater Arcane Elixir, Elixir of Shadow Power / Greater Firepower, Dreamshard Elixir, Dreamtonic,
  wizard oil, spell-damage food [[d:warlock#1452170616206790758]], [[d:warlock#1464517853670539376]]
- Infernal Stones and Demonic Figurines (soul bags hold/refund them) [[d:warlock#1434554125634502677]]
- Fire Protection Potion + Frozen Rune before summoning the Doomguard [[d:warlock#1466194002767249498]]
- Healthstones for the Warlock
mistakes_to_avoid:
- Summoning a greater demon mid-fight or with <3 min of boss left; letting it time out
- Popping trinkets before the 3rd Unleashed Potential stack [[d:warlock#1473595062918185033]]
- Power Overwhelming on a low-health pet during AoE; not telling healers
- Forgetting to reset Felstorm manual / Cleave autocast after each summon (pet bars reset) [[d:warlock#1423835529673445436]]
- Letting Felstorm run before the tank has AoE threat [[d:warlock#1474540725000470660]]
- 'Pet in unavoidable damage: Four Horsemen marks, Thaddius, Sapphiron, Heigan [[d:warlock#1400326250769289267]]'
- Taking Demonic Sacrifice with Soul Link [[d:warlock#1443683130627330332]]
- Stacking haste as Demonology
