- spell-hit
- spell-crit
- spell-power
- stamina
stat_priority_note: 'Demonic Precision passes 90% of your spell hit and crit to the demon (CC3), which is why Demonology shares
  gear with Destruction and why the wiki''s priority is "Hit and Crit". Spell power then matters twice over: Unleashed Potential
  converts 15% of your bonus spell damage per stack (up to three) into the demon''s attack and spell power. Stamina is wanted
  for Power Overwhelming, which costs 40% of the demon''s base health, and for Soul Link.'
