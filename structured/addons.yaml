# Addon / client-mod landscape as discussed in the archived #code-corner Discord.
# Source channel: code-corner (Turtle WoW Europe), 2022-06-21 .. 2026-05-30.
# Citations: [[d:code-corner#<message_id>]] (resolve in structured/discord/evidence-code-corner.jsonl).
# era: pre-1.18.1 (<2025-10-03) | 1.18.1-announced-pre-release (2025-10-03..2026-03-19) | post-1.18.1 (>=2026-03-20).
# agreement: consensus | single source | contested.
# Authority: no green-name signal in Discord; addon authors posting under their project names
# (Shagu, balake, Pepopo, allfoxwy, MarcelineVQ, Mewtiny, jrc13245, Pitohui, Oldmana,
# Kirchlive/Tetto, Walter Bennet, Belthazorg) > recognised maintainers > players.
schema: code-corner-addons/v1
channel: code-corner

client_mods:
  VanillaTweaks:
    repo: https://github.com/brndd/vanilla-tweaks
    purpose: >-
      One-time wow.exe patch: Large Address Aware / 4 GB, FOV, farclip, sound channels.
    recommender: [ugoboom, Rerolladin]
    era: pre-1.18.1
    agreement: consensus
    sources:
    - '[[d:code-corner#1001207292718497882]]'
    - '[[d:code-corner#1086763506751258765]]'
  VanillaFixes:
    repo: https://github.com/hannesmann/vanillafixes
    purpose: >-
      Launcher run every session: applies stutter/lag fixes and DXVK compatibility, loads
      DLLs (nampower, superwow), then runs whatever file is named wow.exe.
    recommender: [ugoboom, Sal, Silkroad]
    era: pre-1.18.1
    agreement: consensus
    sources:
    - '[[d:code-corner#1088225716589568111]]'
    - '[[d:code-corner#1064577507241762817]]'
    - '[[d:code-corner#1235184163745824849]]'
    - '[[d:code-corner#1064300156645818379]]'
  Nampower:
    repo: https://github.com/pepopo978/nampower
    upstream: https://github.com/namreeb/nampower
    purpose: >-
      DLL mod: spell queuing (the fix for "one button, two spells"), IsSpellInRange,
      IsSpellUsable, queue-state icon, quickcast-at-cursor, channel/stopping fixes.
      Required by SuperCleveRoidMacros and many rotation addons. Pepopo's fork is the
      one pushed in-channel; config exposes a per-cast buffer and a delay window.
    recommender: [TechWomanWoW, Mewtiny, community]
    era: pre-1.18.1
    agreement: consensus
    sources:
    - '[[d:code-corner#1061015304265805984]]'
    - '[[d:code-corner#1289175514422055003]]'
    - '[[d:code-corner#1312194271306059857]]'
    - '[[d:code-corner#1289276707693396071]]'
  SuperWoW:
    repo: https://github.com/balakethelock/SuperWoW
    purpose: >-
      DLL injection: hidden/overflow buff visibility, autoloot (SetAutoloot), clickthrough,
      uncapSounds CVar, 511-char macros, combat logging, companion SuperAPI, extra
      UnitCastingInfo.
    recommender: [balake (author)]
    era: pre-1.18.1
    agreement: consensus
    notes: >-
      Known issues: raid hitching that worsens over time; neutral/invisible-target
      nameplates; limited player tooltip info; guild-bank weapon-oil stack bug.
    sources:
    - '[[d:code-corner#1228455937757417473]]'
    - '[[d:code-corner#1235623116202577950]]'
    - '[[d:code-corner#1238364213143928842]]'
    - '[[d:code-corner#1235835336773599332]]'
    - '[[d:code-corner#1235912156529164380]]'
  UnitXP_SP3:
    repo: https://github.com/allfoxwy/UnitXP_SP3
    purpose: >-
      Memory mod (no injection): line-of-sight and distance API, horizontal camera,
      Lua debug interface. Soft dependency of HealersMate.
    recommender: [allfoxwy (author)]
    era: pre-1.18.1
    agreement: single source
    sources:
    - '[[d:code-corner#1283399432422817803]]'
    - '[[d:code-corner#1287081525396897865]]'
    - '[[d:code-corner#1343576643293155482]]'
  DXVK / dxvk-async:
    purpose: >-
      Translates the client's DX9 to Vulkan; large (reported ~60-200) FPS gains. Windows
      alt-tab flicker / ~1s black screen in borderless windowed; overlays can crash it.
      Also mitigates the 32-bit client's OutOfMemory pressure.
    recommender: [ugoboom, Rerolladin, Moustacho]
    era: mixed
    agreement: consensus
    sources:
    - '[[d:code-corner#1033859949123600404]]'
    - '[[d:code-corner#1033868854197239828]]'
    - '[[d:code-corner#1034814267158966272]]'
    - '[[d:code-corner#1360966847289229513]]'
    - '[[d:code-corner#1489973377665073253]]'
  VanillaHelpers64:
    repo: https://github.com/paokkerkir/VanillaHelpers64
    purpose: >-
      Drop-in replacement for VanillaHelpers adding a 64-bit TextureServer to reduce the
      32-bit client's OutOfMemory pressure with HD texture packs (beta).
    recommender: [Belthazorg (author)]
    era: post-1.18.1
    agreement: single source
    sources:
    - '[[d:code-corner#1489373149748531250]]'
    - '[[d:code-corner#1489634680419647508]]'

