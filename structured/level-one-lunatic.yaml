    - note: >-
        Blazing Pan (Oggleflint, 1h mace, 3.2 DPS), Taragman cape (10 Armor / 1 FR, low drop),
        Jergosh cloth chest (4 Armor), Bazzalan wand (4.4 DPS), Fiery Cloak, Rhahk'zor cape
