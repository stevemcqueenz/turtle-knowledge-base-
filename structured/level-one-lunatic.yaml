enchanting:
  templates:
    - role: Rogue full Agility
      note: >-
        15 Agi weapon, 15 Agi gloves, 6 Agi x2 rings, 6 Agi neck, 4 Stats chest, 8 Agi head,
        8 Agi legs, Minor Speed boots, 9 Stam bracers; separate Fiery Weapon for DPS swaps.
      sources:
        - "[[d:level-one-lunatic#1350141968356737078]]"
    - role: Typical weapon enchants by role
      note: "15 Agi Rogue, 25 Agi Hunter, 55 Healing healers, 20 Spirit Troll Warrior/healer regen swap, 30 Spell Damage casters, Fiery for PvP."
      sources:
        - "[[d:level-one-lunatic#1444427050227073166]]"
  notes:
    - note: >-
        Fiery Weapon is the workhorse (static PPM, slower weapons proc more); a 15 Fire Resist cape
        cuts its proc from 40 to 10 and crits from 60 to 15. 20 FR to head/legs made no further
        difference.
      era: mixed
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1444429001920872708]]"
        - "[[d:level-one-lunatic#1364571564267405414]]"
        - "[[d:level-one-lunatic#1365123449110134889]]"
    - note: >-
        +100 Health head/legs = Libram/Arcanum of Constitution; 8 Agi libram; 70 Armor cape;
        +7 Damage Sniper Scope on bows; +3% Ranged Scope; Saph/Naxx shoulder enchants (do not
        bind); ZG head/leg enchants bind the item and were avoided; Argent Dawn resist binds.
      era: "mixed"
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1354879768692129912]]"
        - "[[d:level-one-lunatic#1354133711381069824]]"
        - "[[d:level-one-lunatic#1409028561830150175]]"
        - "[[d:level-one-lunatic#1490729356711035061]]"
        - "[[d:level-one-lunatic#1490625317180669972]]"
        - "[[d:level-one-lunatic#1348219130230345759]]"
    - note: >-
        Rings require an item level that supports gems; only vendor rings >=10 g (Silver Piffeny)
        work, Mood Ring does not; the Voice Amp neck does.
      era: pre-1.18.1
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1342353798152065048]]"
        - "[[d:level-one-lunatic#1414052043567529995]]"

professions:
  available_level_1: [Herbalism, Mining, Skinning, Fishing]
  notes:
    - note: >-
        Crafting professions require level 5. Engineering is not available at level 1 but is used
        through mains/alts (Goblin Rocket Boots, Voice Amplification Module, Sniper Scope, Horde
        Dynamite).
      era: "mixed"
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1439063445868904449]]"
        - "[[d:level-one-lunatic#1397146935902601297]]"
        - "[[d:level-one-lunatic#1478317444354408448]]"
        - "[[d:level-one-lunatic#1398456246134378497]]"
        - "[[d:level-one-lunatic#1347140253575549021]]"
    - note: >-
        Fishing is the level-1 gold engine and damage equaliser: 150 skill like level 19s,
        Stonescale Eels from Stranglethorn/Azshara fund enchants; the Arcanite Fishing Pole would
        be BiS but is considered inappropriate to add. Fishing was originally Alliance-only via a
        bugged trainer lacking the level requirement, then given to all trainers.
      era: "mixed"
      agreement: consensus
