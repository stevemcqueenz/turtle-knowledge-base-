about: >-
  Machine-readable Level One Lunatic challenge data (kits, gear, milestones, races,
  professions, PvP/PvE and automation) mined from the archived Turtle WoW Discord
  channel #level-one-lunatic. Companion to synthesis/challenges/level-one-lunatic.md.
  Every record carries sources (Discord message citations), era and agreement.
schema: kb-level-one-lunatic/v1
channel: level-one-lunatic
source_archive: norm/level-one-lunatic/messages.jsonl
evidence_file: structured/discord/evidence-level-one-lunatic.jsonl
message_count: 5605
date_range: 2025-02-15..2026-05-30
era_legend:
  pre-1.18.1: "< 2025-10-03"
  "1.18.1-announced-pre-release": "2025-10-03 .. 2026-03-19"
  post-1.18.1: ">= 2026-03-20"
  mixed: "the item's citations span more than one era"
agreement_legend: [consensus, single source, contested]
authority_note: >-
  Discord has no green-name signal. Cysthen is the de-facto community leader (guild master of
  <Level One Lunatic> on Nordanaar, forum guide author, main raid organiser) and the dominant
  source; StabsMcKenzy is co-founder/early guide writer and first Wee Warlord. Pyropal,
  TofuGaming, Speedz, Blank and Timmy the Kaido Player are recognised long-running contributors.
  Treat Cysthen/Stabs as guide-writer tier; uncorroborated claims are marked single source.

challenge:
  definition:
    - action: >-
        Chosen on the character-creation screen; a Level One Lunatic Spell ID is applied. New
        characters made without it must re-roll; an old pre-challenge level-1 twink can only be
        converted by a GM.
      era: mixed
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1381424785115975761]]"
        - "[[d:level-one-lunatic#1386884357293211678]]"
        - "[[d:level-one-lunatic#1478955694010011770]]"
    - action: >-
        No opt-out. Glyph Masters were removed; the tooltip text ("titles stay if you decide to
        level up") is stale and the community reports the intent is permanent. The character is a
        separate level-1 endgame / game mode. XP is locked; the character can never level out.
      era: "mixed"
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1407351035210502175]]"
        - "[[d:level-one-lunatic#1406783602515247154]]"
        - "[[d:level-one-lunatic#1444426925287280833]]"
        - "[[d:level-one-lunatic#1485998948115284168]]"
        - "[[d:level-one-lunatic#1406065573527552082]]"
        - "[[d:level-one-lunatic#1421560310418112704]]"
    - action: >-
        Scope of play: enchant yourself, get gear, gank Warmode players, run dungeons, get Exalted,
        complete 100 quests, obtain the Arena Grand Master and collect titles. You learn no skills
        beyond the one additional spell typically available at level 1 from the trainer.
      era: pre-1.18.1
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1386884357293211678]]"

  titles_milestones:
    - objective: 10,000 honorable kills
      title: Wee Warlord
      notes: >-
        StabsMcKenzy first (2025-03-07/08); only one completion known as of 2025-04-22; second
        (Shivsmckenzy) 2025-08-17. "the only thing you really need to hit 10k kills is patience."
      era: pre-1.18.1
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1347737022739251221]]"
        - "[[d:level-one-lunatic#1356320345904124177]]"
        - "[[d:level-one-lunatic#1364280348393082981]]"
        - "[[d:level-one-lunatic#1347221455380811796]]"
        - "[[d:level-one-lunatic#1406703881643229216]]"
    - objective: Exalted with at least one faction
      title: Pint-Sized Politician
      notes: Server-first via Alliance Wildhammer Clan, 2025-10-17.
      era: "mixed"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1428566650315210824]]"
        - "[[d:level-one-lunatic#1356565112693198942]]"
    - objective: Obtain the Arena Grand Master trinket from the Gurubashi Arena chest
      title: Arena Grand Master
      notes: >-
        Two arena quests exist (Arena Master and Arena Grand Master); both AGM and the title are
        named but the exact title string is not spelled out in-channel.
      era: pre-1.18.1
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1356565112693198942]]"
        - "[[d:level-one-lunatic#1356258029640880219]]"
        - "[[d:level-one-lunatic#1349677900693114951]]"
    - objective: Complete 100 quests
      title: "Hero of Goldshire (Alliance) / Lazy Peon's Foreman (Horde)"
      notes: >-
        Requires Lunar Festival Elder quests; missing the event locks the title for a year
        (Cysthen stuck at 87-90 after doing everything else).
      era: "1.18.1-announced-pre-release"
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1464816218589364417]]"
        - "[[d:level-one-lunatic#1472765491075485818]]"
        - "[[d:level-one-lunatic#1478851797471854763]]"
    - objective: Explore every zone
      title: "Azeroth's Most Unlucky Tourist"
      notes: Instances and battlegrounds no longer count; server-first StabsMcKenzy 2025-12-07.
      era: "mixed"
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1407351400190574635]]"
        - "[[d:level-one-lunatic#1446982207892623523]]"
    - objective: (early framing) four titles only
      title: "n/a"
      notes: Exploration title was added in the 1.18.0 patch.
      era: pre-1.18.1
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1350528723354521680]]"
        - "[[d:level-one-lunatic#1406671304135803116]]"

  anti_cheat:
    - note: Kills are monitored; a character was disqualified for wintrading / multibox kill-farming.
      era: pre-1.18.1
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1342547420533493820]]"

  rule_history:
    - note: >-
        June 2025: a rule change barred challenge characters from multiboxing with a main, removing
        self-summoning, self-buffing for dungeons and self-farmed reputation. Staff (Akalix)
        confirmed no intent to change ("solve the problem socially"). Community staged a meme
        protest and argued Alliance could no longer reach Exalted (40h Centaur grind) while Horde
        could buy it for ~400 g of Dynamite.
      era: pre-1.18.1
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1387176039817412679]]"
        - "[[d:level-one-lunatic#1394696403850100826]]"
    - note: >-
        September 2025: Lunatics re-exempted from the no-multiboxing-with-challenges rule; later
        confirmed allowed for reputations and buffing. Buffing each other's Lunatics was always
        allowed; buffing your own Lunatic with your own 60 was the disputed part.
      era: "mixed"
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1410965969114894407]]"
        - "[[d:level-one-lunatic#1462938035665637376]]"
        - "[[d:level-one-lunatic#1398018953720103095]]"
    - note: >-
        1.18.0 (Aug 2025): dungeon enemy health/damage +15%; Warmode removed from character creation
        (20% -> 5% XP, BG XP instead); BG server announcements removed. This is the community's
        "Dark Age"; many stopped logging in.
      era: "pre-1.18.1"
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1407889877885911122]]"
        - "[[d:level-one-lunatic#1404565902091092080]]"
        - "[[d:level-one-lunatic#1421071270614667347]]"
    - note: >-
        1.18.1 (2026-03-20): Survival skill (tents, fishing boats, throwing consumable); Arenas on
        the minimap but broken (kicked at gate); Sergeant = 3,000 Honor; no new raid content;
        Frostmane Hollow teased but not released.
      era: post-1.18.1
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1484597094189760594]]"
        - "[[d:level-one-lunatic#1484684233984311408]]"
        - "[[d:level-one-lunatic#1485239478426534000]]"
    - note: Cross-faction PvP on Nordanaar from 2025-11-04 was expected to revive the 1-9 battlegrounds.
      era: "1.18.1-announced-pre-release"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1432399052909052107]]"

dungeon_access:
  - note: >-
      Level-1-only groups may enter Ragefire Chasm, Deadmines and (from Oct 2025) Wailing Caverns
      as 10-man raids; Frostmane Hollow was teased but never released.
    mode: 10-man raid
    instances: [Ragefire Chasm, Deadmines, Wailing Caverns]
    era: "mixed"
    agreement: consensus
    sources:
      - "[[d:level-one-lunatic#1435096205440061582]]"
      - "[[d:level-one-lunatic#1484597094189760594]]"
  - note: >-
      Lunatic-exclusive loot only drops when the entire dungeon ID is Lunatics only; carrying with
      a 60 suppresses it, and summoner alts must be kicked.
    era: "mixed"
    agreement: consensus
    sources:
      - "[[d:level-one-lunatic#1409920309674377298]]"
      - "[[d:level-one-lunatic#1423010087349518388]]"
      - "[[d:level-one-lunatic#1439620276424933538]]"
      - "[[d:level-one-lunatic#1419048290229682338]]"
      - "[[d:level-one-lunatic#1491571989452951562]]"
  - note: Runs are typically RFC plus Deadmines up to Sneed; deeper DM/WC loot was considered useless or unfinished.
    era: "pre-1.18.1"
    agreement: single source
    sources:
      - "[[d:level-one-lunatic#1414072434507649096]]"

kits:
  native_level_1:
    abilities_by_class:
      - class: Warrior
        abilities: [Heroic Strike, Battle Shout, Shoot]
      - class: Paladin
        abilities: "Seal of Righteousness, Holy Light, Devotion Aura (55 Armor)"
      - class: Hunter
        abilities: [Auto Shot, Raptor Strike, Track Beasts]
      - class: Rogue
        abilities: "Stealth (from trainer), Sinister Strike, Eviscerate"
      - class: Warlock
        abilities: "Demon Armor, Shadow Bolt, Immolate, Imp pet (Firebolt)"
      - class: Mage
        abilities: "Arcane Intellect, Fireball, Ice Armor"
      - class: Priest
        abilities: "Power Word: Fortitude (3 Stamina), Lesser Heal, Smite"
      - class: Druid
        abilities: "Mark of the Wild (25 Armor), Healing Touch, Wrath"
      - class: Shaman
        abilities: "Healing Wave, Lightning Bolt, Rockbiter (29 AP)"
    note: Rogues do not start with Stealth; it is a class-trainer pickup, but no other class has a level-1 trainer spell worth taking.
    era: "mixed"
    agreement: consensus
    sources:
      - "[[d:level-one-lunatic#1450210987541266443]]"
      - "[[d:level-one-lunatic#1398980266650898432]]"

  scaling:
    - note: >-
        Agility -> Dodge scaling is strongly class-dependent: +33 Agility gave a Warrior 13% Dodge
        but a Rogue 29%. Rogues reach 100%+ Dodge from gear enchants alone, making them the
        dominant class.
      era: pre-1.18.1
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1343245626569265325]]"
        - "[[d:level-one-lunatic#1344739729329094729]]"
        - "[[d:level-one-lunatic#1350141968356737078]]"
    - note: >-
        Spell damage scales badly and spells resist heavily in dungeons; healing scales well.
        Paladin rank-1 Holy Light was shadow-nerfed from a 70% to a 20% coefficient on 2025-04-02.
      era: pre-1.18.1
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1347228841646489683]]"
        - "[[d:level-one-lunatic#1376219257691705485]]"
        - "[[d:level-one-lunatic#1348200312380592169]]"
        - "[[d:level-one-lunatic#1356980754239717448]]"
        - "[[d:level-one-lunatic#1364436288081498225]]"
    - note: >-
        Level-1 melee has 99% miss from the front and 50% from behind; yellow instant attacks hit
        better; arrows and Fishing Rods effectively do not miss in PvE, which is why Fishing Rods
        equalise non-Rogue/Hunter DPS.
      era: "pre-1.18.1"
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1397962048205357189]]"
        - "[[d:level-one-lunatic#1423010798586040370]]"
        - "[[d:level-one-lunatic#1420076332842356869]]"
    - note: PvP hit is not penalised like PvE; at level 1 vs a 300-Defense level-60 nearly every white attack from behind landed.
      era: "1.18.1-announced-pre-release"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1469520417289932822]]"
        - "[[d:level-one-lunatic#1469529099302076549]]"

  tier_list:
    - note: 'Challenge tier list: Rogue, Paladin, Hunter. Twink-vs-twink is "basically just rogues"; for the challenge any class is viable.'
      era: pre-1.18.1
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1354018623194402877]]"
        - "[[d:level-one-lunatic#1346662308285255852]]"
        - "[[d:level-one-lunatic#1363243605250019339]]"

  roles_pve:
    - role: Rogue
      note: Best overall; instant strikes + Stealth; 100% Dodge avoidance tank, but slower threat.
      priority: top
      sources:
        - "[[d:level-one-lunatic#1386896431389868124]]"
        - "[[d:level-one-lunatic#1492172258414821466]]"
    - role: Hunter
      note: Top PvE DPS; 60-80% Dodge in BiS (Night Elf up to 100% with full buffs); arrows do not miss; expensive Feather Arrows for burst.
      priority: top
      sources:
        - "[[d:level-one-lunatic#1410072455581794435]]"
        - "[[d:level-one-lunatic#1478210926229323930]]"
        - "[[d:level-one-lunatic#1492175946235646174]]"
        - "[[d:level-one-lunatic#1355145395927515227]]"
    - role: Paladin (healer)
      note: Strong PvE healer due to a 0.25 rank-1 heal threat modifier vs 0.5 for other healers; strong Seal spell-power scaling; lowest-threat healer.
      priority: high
      sources:
        - "[[d:level-one-lunatic#1369361795147370619]]"
        - "[[d:level-one-lunatic#1398456708237365450]]"
        - "[[d:level-one-lunatic#1450211855787098214]]"
    - role: Troll Warrior (tank)
      note: Only viable Warrior race; Spirit-stacking off-tank that regenerates health in combat and holds AoE threat via Battle Shout spam; expensive, needs near-BiS plus external buffs.
      priority: niche
      sources:
        - "[[d:level-one-lunatic#1421489822354378862]]"
        - "[[d:level-one-lunatic#1492172258414821466]]"
    - role: Healers
      note: "HoT throughput ranking Priest > Druid > Paladin > Shaman."
      priority: n/a
      sources:
        - "[[d:level-one-lunatic#1450215473244274688]]"
    - role: Warlock (caster)
      note: Best caster DPS; Immolate has the best spell-damage scaling (+4/tick, up to +16/cast); Imp Firebolt has 10% scaling but the pet does not inherit player spell damage.
      priority: niche
      sources:
        - "[[d:level-one-lunatic#1414413087695704154]]"
        - "[[d:level-one-lunatic#1451016902154522624]]"
        - "[[d:level-one-lunatic#1414449422712176712]]"
    - role: Mage
      note: Least impactful overall; niche PvP survivability/kiting with Ice Armor and WSG flag running.
      priority: low
      sources:
        - "[[d:level-one-lunatic#1450210219450830959]]"
        - "[[d:level-one-lunatic#1398652196903587980]]"

  meta_comp:
    - note: Full-BiS meta comp 3 Rogues, 1 Troll Warrior, 4 Hunters, 2 Healers.
      era: "pre-1.18.1"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1410072455581794435]]"
    - note: Speed-run comp 1 Troll Warrior, 3 Rogues, 2 Paladin healers (Fishing Rods), 5 Hunters.
      era: "pre-1.18.1"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1421490487432450090]]"

  popularity_2025_05:
    - note: 'Class popularity (least to most): Druid, Warlock, Mage, Paladin, Shaman, Warrior, Hunter, Priest; vast majority Rogues.'
      era: pre-1.18.1
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1369383451811250256]]"

races:
  recommended:
    - combo: >-
        Human Paladin / Night Elf Rogue or Hunter / Tauren Shaman or Druid / Human or Tauren Priest
        / Troll Warrior / Human Warlock / Human or Undead Mage
      era: "1.18.1-announced-pre-release"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1435582738039046254]]"
        - "[[d:level-one-lunatic#1435582139180777474]]"
  racial_notes:
    - race: Night Elf
      note: Highest base Agility/Dodge; lets a Rogue take 15 Stamina boots instead of 7 Agility and keep 100% Dodge; 1% move speed, Shadowmeld, Wisp form for the exploration title.
      sources:
        - "[[d:level-one-lunatic#1354137815696543784]]"
        - "[[d:level-one-lunatic#1432399052909052107]]"
        - "[[d:level-one-lunatic#1435582139180777474]]"
    - race: Human
      note: 10% reputation, Mace/Sword skill, 2% crit racial, Spirit regen, and 2 mana per 2s while casting.
      sources:
        - "[[d:level-one-lunatic#1398652196903587980]]"
        - "[[d:level-one-lunatic#1432399052909052107]]"
    - race: Tauren
      note: War Stomp is the only interrupt available to the bracket (essential vs WC Shamblers/healing Druids); Tauren Shaman also gets Totemic Slam.
      sources:
        - "[[d:level-one-lunatic#1449035045397598269]]"
        - "[[d:level-one-lunatic#1480539290617253909]]"
    - race: Troll
      note: Warrior only; Spirit -> health regen and Berserking.
      sources:
        - "[[d:level-one-lunatic#1444886114430353518]]"
    - race: Goblin
      note: Weapon skill for PvE plus a Sprint racial; common Rogue/Warrior pick before NE overtook it.
      sources:
        - "[[d:level-one-lunatic#1386891646242918472]]"
        - "[[d:level-one-lunatic#1344739729329094729]]"
    - race: Orc
      note: "+spell damage racial for Warlock Imp Firebolts."
      sources:
        - "[[d:level-one-lunatic#1398652196903587980]]"
    - race: Undead
      note: Shadow resistance vs Lifestealing; Will of the Forsaken (used vs Sneed Fear).
      sources:
        - "[[d:level-one-lunatic#1435582139180777474]]"
        - "[[d:level-one-lunatic#1386891898995736596]]"
    - race: High Elf
      note: Strictly worse than NE for Agility but a viable WSG flagger.
      era: "post-1.18.1"
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1490731061876097255]]"

