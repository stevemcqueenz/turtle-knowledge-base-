        - "[[d:level-one-lunatic#1375132279076028616]]"
        - "[[d:level-one-lunatic#1421531130993049741]]"

pvp:
  warmode:
    - note: 'Design intent described as the "Warmode tax": level-1 Lunatics farmed the permanently flagged Warmode population in starting zones for honor kills.'
      era: "1.18.1-announced-pre-release"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1458121727975489716]]"
    - note: Horde farmed Elwynn/Northshire/Westfall; Alliance farmed Valley of Trials/Durotar. Horde had the easier kill supply.
      era: pre-1.18.1
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1381430640548774009]]"
        - "[[d:level-one-lunatic#1370429091643392050]]"
    - note: Do not take Warmode; keep the ability to unflag against 60s. Use /pvp instead.
      era: pre-1.18.1
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1350908979298963570]]"
        - "[[d:level-one-lunatic#1342871547152433213]]"
  battlegrounds:
    - note: >-
        Bracket is 1-9 WSG/AB; BGs historically almost never popped. AB is queued at the
        Battlemaster (not the minimap) and can be forced to pop with enough sign-ups. AB is
        preferred over WSG because WSG can become endless flag-holding, and AB gives better
        reputation for Diplomat.
      era: pre-1.18.1
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1343272206553321495]]"
        - "[[d:level-one-lunatic#1375133317292097647]]"
        - "[[d:level-one-lunatic#1375133988569612288]]"
    - note: "Best WSG flaggers: Troll Mage with Frost Armor (high Stamina/Spirit build); Mage generally the best flag runner."
      era: pre-1.18.1
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1355146740428308643]]"
        - "[[d:level-one-lunatic#1350825971254689872]]"
    - note: "Dueling: full-BiS Paladin wins most; Rogue bandaging can stall forever; Hunter Feather Arrows untested counter."
      era: pre-1.18.1
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1354018623194402877]]"
  tactics:
    - note: "Gank starter zones, then the zones after them, and with friends the zones after those."
      sources:
        - "[[d:level-one-lunatic#1343272206553321495]]"
    - note: "Bait: tag a contested quest mob without killing it and let a crowd pile in. Prolonged camping of quest objectives/NPCs is against the rules."
      sources:
        - "[[d:level-one-lunatic#1343685560400609402]]"
        - "[[d:level-one-lunatic#1344697749731278858]]"
        - "[[d:level-one-lunatic#1344710045773860944]]"
    - note: "Unequip/equip gear to look damaged, or start Hearthing near players, to bait attacks."
      sources:
        - "[[d:level-one-lunatic#1344697981861105735]]"
    - note: "Strongest group pattern: Paladin healer tanks/bait while stealthed Rogues wait to open."
      sources:
        - "[[d:level-one-lunatic#1349557590908080188]]"
    - note: "Rogues can tank guards at >106% Dodge (level-55 guards need >106% due to level difference)."
      sources:
        - "[[d:level-one-lunatic#1342124510509404200]]"
        - "[[d:level-one-lunatic#1350142975262461992]]"
  post_nerf:
    - note: >-
        After Warmode was removed from character creation the open-world gameplay loop disappeared:
        "most Lunatics have no reason to stay online unless they are fishing for Gold or farming
        Reputation". Kill counts collapsed; Alliance went from ~200/week to near nothing.
      era: "pre-1.18.1"
      agreement: consensus
      sources:
        - "[[d:level-one-lunatic#1421070776290902036]]"
        - "[[d:level-one-lunatic#1405014881929007175]]"

pve:
  progression:
    - note: >-
        Deadmines full clear 4+ hours; best recorded 3h40m-4h22m with 4 Hunters, world buffs and
        multiboxed consumables. Typical weekly run is RFC plus DM up to Sneed.
      era: "pre-1.18.1"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1397962048205357189]]"
        - "[[d:level-one-lunatic#1395514874791989328]]"
        - "[[d:level-one-lunatic#1414072434507649096]]"
    - note: >-
        Wailing Caverns order: Lady Anacondra -> Kresh -> Deviate Faerie Dragon -> Lord Pythas ->
        Skum -> Lord Serpentis -> Verdan the Everliving -> Lord Cobrahn -> ... -> Mutanus (11/11,
        server-first 2025-11-28).
      era: "1.18.1-announced-pre-release"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1424959200425152522]]"
        - "[[d:level-one-lunatic#1443825575931281539]]"
    - note: Lady Anacondra is a DPS check that heals adds and sleeps the raid; the group kites back to the entrance and threat-drops healers.
      era: "pre-1.18.1"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1422759859564052652]]"
    - note: >-
        Mutanus: the Tauren escort dies to the 3 snakes during Serpent Cleansing. Cysthen used a
        stopwatch and a Hunter kiting the snake the Tauren is scripted to hit first, plus
        threat-drop-outs to drink.
      era: "1.18.1-announced-pre-release"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1443182200311910410]]"
  tactics:
    - note: Troll Warrior Battle Shout spam is the only reliable AoE threat; Rogues ping-pong threat by hitting from behind then waiting; Hunters stop DPS to avoid pulling.
      era: "mixed"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1376221332622278829]]"
        - "[[d:level-one-lunatic#1450211670600323114]]"
    - note: "Deadmines: bring at least 3 dodge Rogues for the boat; take the boat slowly, pull mobs far back; when pulling Cookie from the left, pull one extra pack for safety."
      era: "pre-1.18.1"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1414072434507649096]]"
    - note: "Shaman/Priest rank-1 heals do 2x the threat of Paladin's (0.5 vs 0.25 mod); Cysthen filed to link those spell IDs to the challenge spell ID to normalise."
      era: 1.18.1-announced-pre-release
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1468586190197489764]]"
    - note: "After WC, requested fixes: Disciple of Naralex threat -500%, Naralex respawn, WC Centaur armor, remove 5-hour respawns."
      era: "1.18.1-announced-pre-release"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1425108236276727849]]"
  buff_stack:
    - note: >-
        Class buffs: Fort R1, Blessing of Might R1, Devotion Aura R1, Arcane Int R1, MotW R2,
        Thorns R1 (T1/T2 set-bonus Druid alt = 25 min, 14 reflect), Battle Shout R1, Priest
        Champion. Consumables: Minor Health Potion, Elixir of Strength, Minor Troll's Blood,
        Deviate Fish, Cozy Fire, Fizzy Energy Drink, Watered-down Beer, Holy Spring Water, Balor
        Moonshine, Fire-Roasted Bread (2% hit). Mains: all Rank IV Scrolls, Winterspring Jujus,
        Un'Goro Crystals (Crystal Force/Spire/Ward), weapon stones/oils, Chronoboon. World buffs:
        Songflower, Dragonslayer, Hakkar, Rend, DMF, Peddlefeet, Fire Festival.
      era: "mixed"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1452094330276810763]]"
        - "[[d:level-one-lunatic#1410230266206879816]]"
    - note: >-
        Troll Warrior Spirit regen formula: ((Spirit x 1.26) - 22.6) x 1.2 (Troll) x 0.25
        (in combat). 84 base Spirit ~24.9 HP/2s in combat, 99.8 out of combat; up to 60+/2s with
        Scroll of Spirit IV, Crystal Force, Songflower, Hakkar, DMF Spirit.
      era: "mixed"
      agreement: single source
      sources:
        - "[[d:level-one-lunatic#1444886114430353518]]"
        - "[[d:level-one-lunatic#1403363186773852355]]"

automation:
  - note: AutoBG addon checks the queue every 3s and auto-queues Warsong Gulch; every Lunatic online was asked to run it so BGs pop.
    era: "1.18.1-announced-pre-release"
    agreement: single source
    sources:
      - "[[d:level-one-lunatic#1427361904510111784]]"
  - note: >-
      PVPWhen addon (Nel/JardineWebSolutions) auto-queues WSG, Arathi Basin and Skirmish Arenas
      via the API with no popups from anywhere; Cysthen calls it "more than a recommendation, a
      requirement".
    era: post-1.18.1
    agreement: consensus
    sources:
      - "[[d:level-one-lunatic#1486079853978456104]]"
      - "[[d:level-one-lunatic#1492235404278104115]]"
  - note: /startattack macros at spawn points tag mobs and bait lowbies into combat.
    era: pre-1.18.1
    agreement: single source
    sources:
      - "[[d:level-one-lunatic#1344694234980028428]]"
      - "[[d:level-one-lunatic#1382523138658664468]]"
  - note: >-
      ItemRack weapon-swap macros swap to healing/Seal of Righteousness or Fiery, and a 25-Agi
      2-hander is macroed to bow-shoot for ranged ticks.
    era: pre-1.18.1
    agreement: single source
    sources:
      - "[[d:level-one-lunatic#1348951381524086876]]"
      - "[[d:level-one-lunatic#1348753314736636007]]"
  - note: >-
      Ghost-follow / AFK reputation farming: the Lunatic is parked dead in ghost form, invited to
      a group with a main farming Furbolgs/Centaurs, and receives full reputation while AFK.
    era: pre-1.18.1
    agreement: consensus
    sources:
      - "[[d:level-one-lunatic#1355906211022766201]]"
      - "[[d:level-one-lunatic#1364972017635557406]]"
      - "[[d:level-one-lunatic#1349010056200585256]]"
  - note: >-
      Multiboxing for buffs/reputation was allowed at inception, banned June 2025, re-exempted
      September 2025. Used for self-buffing the raid from a main, reputation farming, and 1% RFC
      Fashion Coin farms.
    era: "mixed"
    agreement: consensus
    sources:
      - "[[d:level-one-lunatic#1387176039817412679]]"
      - "[[d:level-one-lunatic#1410965969114894407]]"
      - "[[d:level-one-lunatic#1462938035665637376]]"
  - note: "Anti-automation: kills are monitored and a character was disqualified for wintrading/multibox kill-farming; PvP multiboxing was never allowed."
    era: pre-1.18.1
    agreement: consensus
    sources:
      - "[[d:level-one-lunatic#1342547420533493820]]"
      - "[[d:level-one-lunatic#1395966488657264660]]"

community:
  - note: >-
      Effectively all Lunatics are on Nordanaar; guild <Level One Lunatic> is based in Booty Bay
      and grew past 300-400 (2025-10) to ~500 members (2026-03). Ambershire/Tel'abim lack the
      required enchants (15 Agi gloves until AQ phase) and cross-faction PvE.
    era: "mixed"
    agreement: consensus
    sources:
      - "[[d:level-one-lunatic#1487901304251486309]]"
      - "[[d:level-one-lunatic#1494799174724489457]]"
      - "[[d:level-one-lunatic#1427230626175516744]]"
  - note: Weekly NA (Monday) and EU (Tuesday) raids; member-hosted PvP events; vanity-pet leaderboard; Lunatic raid-log site; TofuGaming 5-part YouTube beginner series.
    era: mixed
    agreement: consensus
    sources:
      - "[[d:level-one-lunatic#1449780544278761575]]"
      - "[[d:level-one-lunatic#1500639473447337984]]"
      - "[[d:level-one-lunatic#1458112168334463168]]"

contested:
  - topic: Multiboxing
    positions:
      - side: pro (Cysthen, StabsMcKenzy, pear)
        note: >-
          Essential for PvE viability (Troll Warrior buffs), fairness to players who joined under
          old rules, and community play; "we are allowed to Multibox for Reputations, and buffing
          our Lunatics".
        sources:
          - "[[d:level-one-lunatic#1395514874791989328]]"
          - "[[d:level-one-lunatic#1411055981210763274]]"
          - "[[d:level-one-lunatic#1462938035665637376]]"
      - side: anti (Destroses, Thirtyseven, Mr. Berold)
        note: >-
          Violates the spirit of a challenge; "if you aren't able to do it on your level one
          alone, you shouldn't be able to achieve it at all".
        sources:
          - "[[d:level-one-lunatic#1395508637413146705]]"
          - "[[d:level-one-lunatic#1395540130659565661]]"
          - "[[d:level-one-lunatic#1400889304309436628]]"
    era: mixed
    agreement: contested
  - topic: Horde vs Alliance Exalted
    note: >-
      Horde can buy Exalted via Durotar Labor Union Dynamite (~400 g, ~9,000 turn-ins); Alliance
      faced a ~40h Centaur grind. Cysthen calls the asymmetry unfair.
    era: pre-1.18.1
    agreement: single source
    sources:
      - "[[d:level-one-lunatic#1398456246134378497]]"
      - "[[d:level-one-lunatic#1409969580239093770]]"
  - topic: Holy Light coefficient nerf
    note: "70% -> 20% on 2025-04-02 (single source Cysthen, corroborated by his healing-math post)."
    era: pre-1.18.1
    agreement: single source
    sources:
      - "[[d:level-one-lunatic#1356980754239717448]]"
      - "[[d:level-one-lunatic#1364436288081498225]]"

