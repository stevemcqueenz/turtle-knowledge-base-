- name: Wardens of Time
  side: Neutral
  patch: 1.16.0
  base: Caverns of Time
  leader: Vairozdormu
  quartermasters:
  - Dronormu
  reputation_sources:
  - method: repeatable turn-in
    detail: Corrupted Sand (quest 40340) = 15 rep per sand; Sand in Bulk (quest 40341) = 175 rep per 10 sand
    source_tier: community wiki + player guide
    sources:
    - https://turtle-wow.fandom.com/wiki/Wardens_of_Time
