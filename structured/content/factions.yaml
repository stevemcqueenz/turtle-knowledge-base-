about: Custom and Turtle-modified reputation factions. See synthesis/content/factions.md.
record_count: 15
reputation_thresholds:
  Friendly: 3000
  Honored: 6000
  Revered: 12000
  Exalted: 21000
  note: vanilla-standard points per rank; Honored gives a 10% vendor discount; Exalted unlocks other races mounts and most tabards
  sources:
  - https://turtle-wow.fandom.com/wiki/Reputation
caveats:
- Reward tables come from the community wiki, not from staff; prices may be stale.
- Six custom factions have no documented reward list anywhere in this extraction.
- No quartermaster coordinates exist in any source.
