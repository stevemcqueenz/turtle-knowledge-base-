  - method: Black Morass bosses
    detail: Chronar +50, Time-Lord Epochronos +100, Antnormi +50; ~200 raw rep per run at Honored+
    source_tier: player guide
    sources:
    - https://forum.turtlecraft.gg/viewtopic.php?p=78524#p78524
  - method: Black Morass trash
    detail: Infinite Rift-Lord +10, Riftweaver/Riftguard +5, Infinite Whelp +2, 19x Infinite Dragonspawn +5; ~400 raw rep per run at Friendly
    source_tier: player guide
    sources:
    - https://forum.turtlecraft.gg/viewtopic.php?p=78524#p78524
  - method: Sunnyglade Valley battleground
    detail: +150 per victory
    source_tier: player, two sources
    sources:
    - https://forum.turtlecraft.gg/viewtopic.php?p=78524#p78524
    - https://forum.turtlecraft.gg/viewtopic.php?p=102403#p102403
