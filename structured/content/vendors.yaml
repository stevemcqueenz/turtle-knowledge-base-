about: Turtle WoW vendors, trainers and service NPCs. See synthesis/content/npcs-and-vendors.md.
generated_from:
- structured/wiki/npcs.jsonl
- forum posts cited per record
record_count: 235
caveats:
- 'Almost no vendor inventory is documented: the community wiki Sells section is a literal "..." placeholder on all four pages that have one. The vendors_with_stated_inventory list is everything the whole corpus states.'
- One in-game coordinate pair exists in the entire extraction (Stickypaws, Gilneas ~50,39); every other location is a named sub-zone.
- level/faction in the wiki roster are infobox values and are not always internally consistent.
- Several recipe vendors carry limited stock and are reported as camped around the clock, so the item may not be on the shelf.
