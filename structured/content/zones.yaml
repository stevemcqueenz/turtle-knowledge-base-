about: Custom and reworked outdoor zones. See synthesis/content/zones.md for the prose version and per-claim source tiers.
record_count: 18
caveats:
- No source in this extraction gives in-game X/Y coordinates for any zone feature.
- Where official site and community wiki level ranges disagree, both are recorded (level_official / level_wiki).
- hubs, flight_paths, access, resources and rares are community-wiki data unless a staff post is cited alongside.
discord_enrichment:
  channel: turtle-wiki
  note: >-
    Additions from the archived #turtle-wiki Discord (the player-run Fandom wiki's
    coordination/Q&A channel, 2022-05 -> 2026-05). Every entry carries an era
    (pre-1.18.1 | 1.18.1-announced-pre-release | post-1.18.1) and agreement (consensus | single source | contested).
  zone_level_ranges:
  - claim: >-
      Community-authoritative custom-zone level list: Eastern Kingdoms - Thalassian
      Highlands 1-10, Northwind 28-34, Balor 29-34, Grim Reaches 33-38, Gilneas 39-46,
      Lapidis Isle 48-53, Gillijim's Isle 48-53, Scarlet Enclave 55-60; Kalimdor -
      Blackstone Island 1-10, Icepoint Rock 40-50, Tel'Abim 54-60, Hyjal 58-60. This
      matches the wiki side of the disputes (Hyjal 58-60, Thalassian/Blackstone 1-10), not
      the official site (56-60 / 15-20 / 1-16) - settles CON-0093.
    authority: guide writer
    agreement: consensus
    era: pre-1.18.1
    sources:
    - '[[d:turtle-wiki#1367554707387584512]]'
    - '[[d:turtle-wiki#1169119002887458887]]'
  - claim: >-
      Horde intermediate hub level brackets: Sparkwater Port (Durotar, all levels),
      Tirisfal Uplands 14-20, Amani'Alor from 12, Powder Town 22-27, Wildtusk Village
      35-40, Mudsprocket 37-41, South Sea Enclave 37-45, Bloodfist Point 47-52.
    authority: player
    agreement: consensus
    era: pre-1.18.1
    sources:
    - '[[d:turtle-wiki#1169119002887458887]]'
  - claim: Northwind is Alliance-only; Balor and Grim Reaches are open to both factions.
    authority: guide writer
    agreement: single source
    era: pre-1.18.1
    sources:
    - '[[d:turtle-wiki#1413189605125132400]]'
  transports:
  - claim: >-
      Sparkwater Port <-> Revantusk Village is a boat, not a zeppelin (the custom Horde
      route); full Alliance/neutral transport list also given.
    authority: guide writer
    agreement: consensus
    era: pre-1.18.1
    sources:
    - '[[d:turtle-wiki#1110237020988641281]]'
  access:
  - claim: >-
      Alah'Thalas (high-elf city, Thalassian Highlands) is entered at level 10 via a quest
      chain begun by a high-elven ranger in Goldshire / Stormwind / Ironforge.
    authority: player
    agreement: consensus
    era: pre-1.18.1
    sources:
    - '[[d:turtle-wiki#1001272512895778887]]'
    - '[[d:turtle-wiki#1091351298152079490]]'
  - claim: 'Alah''Thalas mage portal trainer: Magistrix Ishalah, via the Translocator Orb above the hunter trainers.'
    authority: player
    agreement: single source
    era: pre-1.18.1
    sources:
    - '[[d:turtle-wiki#1305945437571907656]]'
  - claim: >-
      Horde Stormwrought Ruins key chain (Stormbreaker Point): 'Old Friend' (Undead in a
      cave) -> Orc in a Turtle's Shell -> 'Lady Who?' -> 'Storm, Twilight and Hammer' ->
      Key to Stormwrought Castle.
    authority: player
    agreement: single source
    era: pre-1.18.1
    sources:
    - '[[d:turtle-wiki#1406998363294924942]]'
  - claim: >-
      Rear Dragonmaw Retreat area is reached only by running the whole dungeon and taking
      the gate that opens after Zuluhed dies; it cannot be jumped to from the Wetlands
      (supports the Wetlands placement, CON-0039).
    authority: guide writer
    agreement: single source
    era: pre-1.18.1
    sources:
    - '[[d:turtle-wiki#1416553526787833978]]'
  wiki_corrections:
  - claim: >-
      The Fandom database is a separate, poorly maintained resource for custom areas:
      broken PNGs, pre-harbour Stormwind coordinates, no maps for most custom zones (an
      NPC in Thalassian Highlands returns the Eastern Plaguelands map).
    authority: guide writer
    agreement: single source
    era: 1.18.1-announced-pre-release
    sources:
    - '[[d:turtle-wiki#1434654255016575026]]'
  - claim: "The 'Suspicious Hoofprints' / 'Report From Falgran' Dustwallow chain really has three prerequisites (the badge and shield Shady Rest Inn follow-ups) though the database shows one - a quest-system quirk, not a DB bug."
    authority: player
    agreement: single source
    era: pre-1.18.1
    sources:
    - '[[d:turtle-wiki#1187564255063576608]]'
