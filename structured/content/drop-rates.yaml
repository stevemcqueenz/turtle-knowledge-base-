about: Drop rates for custom and notably changed items. See synthesis/content/drop-rates.md.
record_count: 64
caveats:
- Staff records are configured server values on the stated date; several items were changed more than once.
- Player records are anecdotes, not measurements. No player in this extraction publishes successes over trials for a custom item.
- Rates attributed to database.turtlecraft.gg are marked; that database is not part of this extraction and players repeatedly questioned its accuracy without an answer.
- The 2019-2021 "Online Quest & Item Creator" thread contains many percentages that are design proposals, not live values; they are excluded here.
