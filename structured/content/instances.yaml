  notes: 'Tier 3.5. Titles: realm first ''Conqueror of Desolation'', raid completion for all ''Bane of the Nathrezim''. Opened 2025-04-03 13:00 UTC after a public QA phase; ShellStats logging launched alongside. Ima''ghaol, Herald of Desolation (level 63 elite observer, Netherspace) is a non-boss encounter that also received tuning. Boss order is reconstructed - only Anomalus (3rd) and Chess (5th) are stated outright by a player. Bosses 6-9 are called the ''Outland bosses'' by staff. Ephemeral Pendant drop chance set to 20% on all encounters. Every wiki boss page is a stub; all mechanics come from staff hotfix notes. No player boss guide exists. Ley-Watcher Incantagos is the only Kara40 encounter whose requirements staff commented on directly. Loot-table sizes reported by a player from the in-game database: Mephistroth 14 items (5 at 6%, 9 at 8%), Kruul 9, Sanv Tas''dal and Rupturan 7 each.'
