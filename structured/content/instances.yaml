# Dungeons and raids on Turtle WoW - structured data
#
# Companion data for synthesis/content/dungeons-and-raids.md and synthesis/content/instances/*.md.
# One record per custom instance and per significantly modified vanilla instance, as of patch 1.18.1
# (released 2026-03-20) and its post-release hotfixes up to 2026-04-28.
#
# Field notes:
#   id                 slug, matches the filename in synthesis/content/instances/
#   type               dungeon | raid
#   size               maximum group size
#   level_min          minimum level to enter where a source states one, else the low end of the range
#   level_range        free text, because official site, wiki and the in-game LFT addon frequently disagree
#   patch_introduced   "vanilla" for instances Turtle did not create
#   patches_changed    Turtle patches that changed the instance
#   entry_requirements attunements and keys; "not found in sources" where nothing is documented
#   lockout            almost always "not found in sources" - see the gaps section of the Markdown file
#   custom             true if Turtle WoW created the instance
#   bosses[].npc_id    only where a source gives it (currently only Lower Karazhan Halls)
#   bosses[].order     only where a source states or strongly implies an order; null otherwise
#   bosses[].abilities name + effect + numbers; numbers is null unless a source published a value
#   sources            exact post URLs copied from the extraction, plus official site and wiki page URLs
#
# Source authority: forum.turtlecraft.gg posts by Turtle WoW Team members are official; other forum posts
# are player claims; turtle-wow.fandom.com is a community wiki and is NOT an official source.
