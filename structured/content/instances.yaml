  notes: 'Optional hard mode exists; how it is started is not documented. Staff said in 2023 it would stay 40-man; the 2026-04-21 hotfix made scaling active on all raids with a 16-player minimum for 40-player raids. Five creature groups were removed in 2023-12 to make the raid less of a slog. Other rewards: Emerald Blessing druid raid buff (80 yd, 10% movement speed, 1% spell hit, 5% mana regen in combat, costs one Bright Dream Shard), Favor of Erennius chest, dream shards and dreamscale. Players complain about 4%-per-week recipe drops and the Emerald Dream frog pet, and about undocumented anti-strategy changes. Health values (player, from the in-game database): Erennius 1.12M, Solnius 2,391,088. Normal mode kills Erennius; hard mode leaves him alive, which is why hard-mode raids get no Claw of Erennius. The random add composition in the sleep transition has never been addressed by staff.'
