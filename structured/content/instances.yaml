    npc_id: 60748
    order: 2
    abilities:
    - name: Melee AoE
      effect: Cast on random players in melee; deals very high damage if melee clump
      numbers: null
    - name: Transformation
      effect: He transforms in the later phase, after which the main tank takes breaths
      numbers: null
    - name: Purgeable self-buff
      effect: Described by a player as looking like the goblin shrink ray debuff
      numbers: null
    - name: Sleep transition (add phase)
      effect: At 55-60% health Solnius becomes untargetable and summons a few big dragonkin adds surrounded by a pack of Sanctum Dreamers (npc 60742). The composition of the big adds is completely random.
      numbers: Sanctum Suppressor (npc 61212) 112,401 hp / 3,107-4,122 dmg / 3,320 armor; Sanctum Wyrmkin (60745) 108,412 hp / 1,687-2,235 dmg / 3,315 armor; Sanctum Dragonkin (60743) 131,499 hp / 1,687-2,235 dmg / 4,452 armor; Sanctum Scalebane (60746) 248,622 hp / 3,107-4,122 dmg / 4,890 armor
    mechanics_summary: 'Green dragon, final boss. Immune to horror and disorientation; nature/poison immune, which is why Corrosive Poison was added for rogues. Health 2,391,088; damage 1,999-2,650; armor 4,712; 50 nature and 100 shadow resistance (player, from the in-game database). Player-measured health in 2023: 2.4 million.'
    tactics_summary: 'Melee at maximum melee range, fanned out in the back half of the boss. Keep Detect Magic up and purge the self-buff. In the add phase let a paladin hold the welps, burn the elites, focus spellcasters first and leave the scalebane for last, and only bomb once all three elites are down. Two tanks race for threat until he transforms. Scalebanes have 2-2.5x the effective health of the other adds, so a spawn with 2+ of them is far harder purely by luck; leave them for last. A player also reports a trash skip: a hunter pulls Solnius and feigns, and the trash does not follow.'
    loot:
