about: Custom professions and recipes. See synthesis/content/professions-and-recipes.md.
record_count: 262
caveats:
- Skill ranges and materials exist only for the two player leveling routes (Survival 1-300 post-1.18.1 and Jewelcrafting 1-300 pre-1.18.1); every other record has skill_level null because no source states it.
- The staff itemization changelog (post 52796) lists recipe names only - no skill levels, no reagents, no vendors.
- The complete list of the 80+ Survival recipes and the 200+ Jewelcrafting items is not published anywhere in this extraction.
- Forgotten Knowledge I vendor locations are player-found, single-source and six years old.
- Both leveling guides are player-authored; the Jewelcrafting one is explicitly a work in progress and has had two reagent corrections applied by readers.
