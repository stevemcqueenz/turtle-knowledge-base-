what_twinking_is:
  - claim: >-
      A twink stops gaining XP at a bracket ceiling and optimises gear/enchants/talents for WPvP
      and WSG/AB; twink brackets span 1-9 through 50-59.
    sources: ["[[d:twinking#1407437366368665783]]"]
    agreement: consensus
    era: pre-1.18.1
  - claim: >-
      Core motives: bypass the 60 raid-gear arms race, farm WSG/AB reputation pre-60, and play a
      lower-button, lower-gear-gap PvP game.
    sources:
      - "[[d:twinking#1364638956439998564]]"
      - "[[d:twinking#1364908649365114961]]"
      - "[[d:twinking#1481605809778589709]]"
      - "[[d:twinking#1446551289759793203]]"
    agreement: consensus
    era: mixed
  - claim: >-
      Vocabulary: twink (full XP-locked BiS), semi-twink (blue gear + cheap enchants, still
      levelling), lunatic (level 1-9 XP-locked), grandfathered/GF'd (kept after a change made it
      unobtainable at that level).
    sources:
      - "[[d:twinking#1412348723056611418]]"
      - "[[d:twinking#1455672950475854009]]"
    agreement: consensus
    era: mixed

