open_questions:
  - No authoritative, complete BiS list per class/bracket exists in-channel; several players were told to adapt classic twink guides.
  - "Armory characters (Persuasive, Shivering, Zeroeffort, Sackslasher, Fappies, Saints, Ghettobooty, Huntardess, Benchmade, Colorfuel) are the closest thing to canonical lists but were not captured as full inventories."
  - "Turtle's database (database.turtlecraft.gg) was frequently down, so many item IDs were never resolved in-channel."
  - "The Dragonmaw 6-piece \"procs weapon enchants\" claim was never proven (author ~97% sure it does not)."
  - "The Lifestealing \"3x Crusader proc rate\" figure is a single-source test."
  - "Post-1.18.1 conclusions cover a very short window before server shutdown."
