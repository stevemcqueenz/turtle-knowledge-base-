# Machine-readable twinking data from the archived Turtle WoW Europe `#twinking` Discord.
#
# Companion document: synthesis/twinking/README.md.
# Citation format: [[d:twinking#<message_id>]] — every id is reproduced verbatim in
# structured/discord/evidence-twinking.jsonl and checked by scrape/validate.py.
#
# Schema
#   brackets[]:
#     level      bracket label ("1-9" .. "50-59")
#     popular    true when the channel treats the bracket as actively queued/played
#     classes    <class> -> <spec> -> {bis[], enchants[], notes, sources[], agreement, era}
#     sources    bracket-level citations
#     agreement  consensus | single source | contested
#     era        pre-1.18.1 | 1.18.1-announced-pre-release | post-1.18.1
#   bis        list of item/gear names stated in-channel (names as written; no invented stats)
#   enchants   list of enchant/consumable/profession rules stated in-channel
#   notes      free text, may carry its own tag
#
# Agreement and era are per claim, not per document. General vanilla knowledge is not used here.
