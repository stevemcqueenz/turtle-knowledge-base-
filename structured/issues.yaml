meta:
  generated_for: tortoise-wow core test checklist
  entry_count_note: counts and groupings are summarised in synthesis/issues-summary.md
  excluded: account, login, password, donation, character-restore and ban-appeal threads are not game bugs and are excluded;
    884 such topics were seen in the surveyed forums (f3 719, f4 60, f14 101, f18 3, f37 1).
  official_bug_tracker: staff repeatedly direct bug reports to https://turtlecraft.gg/bug-tracker; its contents are NOT in
    this repository, so tracker ids quoted by players are recorded in notes only.
  entry_count: 175
  status_values:
  - open
  - confirmed
  - fixed
  - intended
  - unclear
  - not-root-caused
  - mitigated
  - resolved-later
  reports_schema: 'Forum report: {url, author, authority, date}. Discord report: {cite, author, authority, date, era,
    agreement} — `cite` is the [[d:<channel>#<id>]] citation that scrape/validate.py resolves against structured/discord/evidence-<channel>.jsonl,
    and there is no `url`; `era` is pre-1.18.1 | 1.18.1-announced-pre-release | post-1.18.1; `agreement` is consensus
    | single source | contested.'
