    agreement: consensus
  notes: 'Staff blame custom patches/mods or a stale patch-9.mpq; other players say the 15-point torch cap is by design and
    that trainers in the capitals (not Nesingwary) teach the rest. Mixed - part client issue, part missing documentation,
    part reported bug (''torches show orange but are in fact grey'').

    [turtle-wiki Discord] The channel gives the pre-1.18.1 baseline that shows the report is era-specific: on the old client
    Survival could be raised well past 15/75 — 76-150 unlocked automatically at ~75, and a Bright Campfire gave a guaranteed
    point per cast up to 150 (1 Simple Wood consumed + Flint and Tinder reused, 5-min CD shared with Basic Campfire, +8 vs
    +4 spirit); a 2022 player reached 90 with fires and tents and never saw a 75 cap. Post-1.18.1 players reproduce the current
    report almost word-for-word: torches go grey at skill 15, the trainer offers nothing further, and the old trainer no longer
    sells wood (new trainer in Stormwind/Orgrimmar). Corroborates the player-side of the open issue; no staff resolution found.
    Keep open.'
