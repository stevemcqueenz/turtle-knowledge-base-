- id: ISS-0001
  title: Almaudrak's Heart does not drop for the Desolace quest
  symptom: Player killed the elite NPC Almaudrak in Desolace for the quest of the same name; the corpse contained no Almaudrak's
    Heart, so the quest could not be completed.
  reproduction: Take the Almaudrak quest in Desolace, kill Almaudrak, loot the corpse.
  system: quests
  subsystem: quest item drop
  entities:
  - Almaudrak
  - Almaudrak's Heart
  entity_ids: []
  patch_reported: 1.18.0
  patch_fixed: null
  era: 1.18.1-announced-pre-release
  status: unclear
  status_source: https://forum.turtlecraft.gg/viewtopic.php?p=154544#p154544
  severity: major
  affects:
  - quest
  - leveling
  reports:
  - url: https://forum.turtlecraft.gg/viewtopic.php?p=154515#p154515
