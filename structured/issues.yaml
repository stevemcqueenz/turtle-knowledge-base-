# Bug and issue list for Turtle WoW around patch 1.18.1, compiled from the extracted forum,
# the 1.18.1 changelog and the patch change table in this repository.
# Sources: structured/forum/posts/*.jsonl, extracted/forum/**, structured/patches/1.18.1-changes.yaml,
# synthesis/1.18.1-master-changelog.md. Every report URL is copied from those files; nothing is constructed.
# Conventions: see synthesis/CONVENTIONS.md. Dates UTC.
# patch_reported is derived from structured/patches/timeline.yaml: 1.18.0 was live 2025-08-15..2026-03-19,
# 1.18.1 from 2026-03-20. Where a report predates 1.18.0 the value is the era string only.
# status: open | confirmed (staff acknowledged it is a bug) | fixed | intended | unclear
# status_source is the staff post that sets the status, or null when only players speak.
meta:
  generated_for: tortoise-wow core test checklist
  entry_count_note: counts and groupings are summarised in synthesis/issues-summary.md
  excluded: account, login, password, donation, character-restore and ban-appeal threads are not game
    bugs and are excluded; 884 such topics were seen in the surveyed forums (f3 719, f4 60, f14 101,
    f18 3, f37 1).
  official_bug_tracker: staff repeatedly direct bug reports to https://turtlecraft.gg/bug-tracker; its
    contents are NOT in this repository, so tracker ids quoted by players are recorded in notes only.
entries:
- id: ISS-0001
  title: Almaudrak's Heart does not drop for the Desolace quest
  symptom: Player killed the elite NPC Almaudrak in Desolace for the quest of the same name; the corpse
    contained no Almaudrak's Heart, so the quest could not be completed.
  reproduction: Take the Almaudrak quest in Desolace, kill Almaudrak, loot the corpse.
  system: quests
  subsystem: quest item drop
  entities: [Almaudrak, Almaudrak's Heart]
  entity_ids: []
  patch_reported: '1.18.0'
  patch_fixed: null
  era: 1.18.1-announced-pre-release
  status: unclear
  status_source: https://forum.turtlecraft.gg/viewtopic.php?p=154544#p154544
  severity: major
  affects: [quest, leveling]
  reports:
  - {url: 'https://forum.turtlecraft.gg/viewtopic.php?p=154515#p154515', author: Kanto123, authority: player, date: '2025-10-05'}
  - {url: 'https://forum.turtlecraft.gg/viewtopic.php?p=154544#p154544', author: Sleeptime, authority: staff, date: '2025-10-06'}
  notes: Staff could not reproduce ('I was able to loot Almaudrak's Heart'), suggested addon interference
    or a visual glitch and advised abandoning and retaking the quest. Not confirmed as a server bug.
