- id: CON-0012
  system: project-direction-and-policy
  topic: 'Transmogrification: pulled offline as "heavily broken", then returned as an NPC service'
  side_a:
    claim: The transmog system is heavily broken and is taken offline.
    sources:
    - author: Torta
      authority: staff
      date: '2020-10-22'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=8233#p8233
  side_b:
    claim: Transmog returns as a Fashionista NPC service, restricted to that NPC.
    sources:
    - author: Torta
      authority: staff
      date: '2023-08-20'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=58121#p58121
  what_would_settle_it: Fashionista NPC and transmog storage tables in 1.18.1.
  assessment: Later statement wins; the scope changed (system-wide → NPC-gated).
  status: superseded
  check_against_local_game_data: true
- id: CON-0013
  system: project-direction-and-policy
  topic: 'Loot culture: GDKP banned outright, personal loot refused'
  side_a:
    claim: GDKP is banned because it drives real-money trading.
    sources:
    - author: Akalix
      authority: staff
      date: '2024-06-25'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=97794#p97794
  side_b:
    claim: Personal loot is refused as a solution to hard-reserve pug culture.
    sources:
    - author: Akalix
      authority: staff
      date: '2025-07-01'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=137770#p137770
  what_would_settle_it: Loot-method options available in the 1.18.1 client/server (is personal loot implemented at all?).
  assessment: Not a reversal — the same team treating two loot-culture problems in opposite ways, deliberately. Listed because
    a reader seeing one post alone will misread the policy.
  status: apparent-only
  check_against_local_game_data: true
- id: CON-0014
  system: patch-history-and-attribution
  topic: 'Contents of patch 1.15.0: wiki vs forum'
  side_a:
    claim: Gnome Hunter, Orc Mage, Stormwind Vault, 2v2 arena and gambling are listed under patch 1.15.0.
    sources:
    - author: community wiki, Patch 1.15.0
      authority: community wiki
      date: null
      url: extracted/wiki/articles/Patch_1.15.0.md
  side_b:
    claim: The 1.15.0 forum announcement lists none of Gnome Hunter / Orc Mage; Blood Ring 2v2 and Stormwind Vault are announced
      with 1.16.0.
    sources:
    - author: Torta
      authority: staff
      date: '2020-10-04'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=7948#p7948
    - author: Torta
      authority: staff
      date: '2021-11-22'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=14049#p14049
  what_would_settle_it: Check when the race/class combination rows and the Stormwind Vault map entry first appear in the client
    DBCs / server map table.
  assessment: Forum treated as authoritative in this knowledge base; the wiki entries are flagged. Unresolved as to why the
    wiki differs.
  status: wiki-vs-staff
  check_against_local_game_data: true
- id: CON-0015
  system: patch-history-and-attribution
  topic: Stormwind Vault patch attribution (1.15.0 vs 1.16.0)
  side_a:
    claim: The wiki elsewhere attributes Stormwind Vault to patch 1.15.0.
    sources:
    - author: Custom Turtle WoW content
      authority: community wiki
      date: null
      url: https://turtle-wow.fandom.com/wiki/Custom_Turtle_WoW_content
  side_b:
    claim: The staff changelog and the wiki's own patch-changes section both say 1.16.0.
    sources:
    - author: Torta
      authority: staff
      date: '2021-11-22'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=14049#p14049
  what_would_settle_it: First appearance of the instance map id in client MPQ/DBC data by build.
  assessment: 1.16.0 is the better-supported date (staff post plus the wiki's own patch section).
  status: wiki-vs-staff
  check_against_local_game_data: true
