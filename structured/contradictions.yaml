    - author: Discord archive
      authority: player
      date: '2025-11-29'
      cite: '[[d:twinking#1444098235466649611]]'
      era: 1.18.1-announced-pre-release
      agreement: single source
  what_would_settle_it: Per-realm configuration flags for cross-faction grouping vs battleground queueing.
  assessment: 'Later statement wins, but the two are only partly in conflict: world grouping and BG queueing are separate
    switches. Discord: Add the twink-community side to cross-faction scope.'
  status: superseded
  check_against_local_game_data: true
  discord:
    note: '[twinking] Add the twink-community side to cross-faction scope. Twinks report cross-faction BGs (from ~2025-11)
      mix teams game-to-game and revived activity, but also prevent cross-faction twink team-ups ("you don''t know how and
      where you end up"). Keep the entry as-is otherwise; this is player-observed, era 1.18.1-announced-pre-release, consensus
      within #twinking.'
