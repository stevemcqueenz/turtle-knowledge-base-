  what_would_settle_it: 'The weekly flush routine: does it clamp to the rank minimum, and how are legacy ranks migrated to
    the new system?'
  assessment: 'Contradicts the documented design (ISS-0084); most likely a migration bug at the old-to-new honor system switch.
    Unresolved. Discord: adds the pre-2023-10-01 squeeze that the no-de-rank change fixed, and the mechanism behind it.'
  status: unresolved
