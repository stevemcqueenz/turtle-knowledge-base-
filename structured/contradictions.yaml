  system: patch-history-and-attribution
  topic: 'Rogue capstone: "Exploit Vulnerability" vs "Mark for Death"'
  side_a:
    claim: The class-changes post names the rogue capstone "Exploit Vulnerability".
    sources:
    - author: Dragunovi
      authority: staff
      date: '2024-10-12'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=102969#p102969
