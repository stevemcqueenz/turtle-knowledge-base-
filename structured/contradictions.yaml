- id: CON-0081
  system: pvp-and-honor
  topic: Are battleground terrain exploits fixed or tolerated?
  side_a:
    claim: 'Players report the Warsong Gulch roof/graveyard jumps and an Alterac Valley backdoor as still abused: "Still abused,
      still not fixed... bump!"'
    sources:
    - author: Zvyrhol
      authority: player
      date: '2026-01-24'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=166328#p166328
  side_b:
    claim: 'The same players doubt the patch notes: "Don''t believe in everything devs say on forum. Some patch notes say
      that Sunnyglade Valley gives 3x or 1x marks after each game ends even though it''s not true."'
    sources:
    - author: Zvyrhol
      authority: player
      date: '2025-12-10'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=162323#p162323
  what_would_settle_it: Collision/terrain data at the named Warsong Gulch spots and the AV entrance, plus the Sunnyglade Valley
    mark reward values.
  assessment: 'Unresolved; no staff reply in the extraction. The mark-reward claim is a direct, checkable accusation that
    a patch note does not match the server. Discord: adds staff-side rationale for the WSG terrain dispute (Side B''s subject)
    without resolving whether the spots are fixed: Akalix calls it "a hard balance", warns keeping them raises the barrier
    to entry ("for every 5 players, you''ll get ... Discord: Add the twink-community evidence that battleground terrain exploits
    are not tolerated: safespotting (PvPing from positions reachable only by unintended means) became a bannable PvP offence
    in the 2026-01-11 rules update, and WSG jumps are treated as a legitimate skill differentiator meanwhile.'
  status: unresolved
  check_against_local_game_data: true
  discord:
    note: '[pvp-general] Discord adds staff-side rationale for the WSG terrain dispute (Side B''s subject) without resolving
      whether the spots are fixed: Akalix calls it "a hard balance", warns keeping them raises the barrier to entry ("for
      every 5 players, you''ll get ... three who decide they don''t want to play WSG again"), warns removing them alienates
      veterans, and states "Best middleground is discouraging those spots, but not making them entirely impossible, in my
      opinion" [[d:pvp-general#1381882667485888514]]; the motivation is anti-stall ("a majority of people don''t want to sit
      in a BG for ages where the ''PvP'' is determined by which team''s druid can go the longest without messing up their
      funny parkour" [[d:pvp-general#1381891955088166912]]). Also adds the 30% WSG flag-carrier slow [[d:pvp-general#1006068996988215387]].
      Status stays unresolved; the mechanic-vs-policy split deepens.


      [twinking] Add the twink-community evidence that battleground terrain exploits are not tolerated: safespotting (PvPing
      from positions reachable only by unintended means) became a bannable PvP offence in the 2026-01-11 rules update, and
      WSG jumps are treated as a legitimate skill differentiator meanwhile. This tilts the "fixed or tolerated" entry toward
      "policy answer exists, mechanic not fixed"; single source, era 1.18.1-announced-pre-release (2026-01-11).'
