meta:
  description: 'Contradictions between Turtle WoW sources: both sides with dates, sources and the current best assessment.'
  companion_document: synthesis/contradictions.md
  conventions: synthesis/CONVENTIONS.md
  entry_count: 184
  systems:
  - project-direction-and-policy
  - patch-history-and-attribution
  - dungeons-and-raids
  - loot-and-drop-rates
  - classes-and-specs
  - spells-and-mechanics
  - pvp-and-honor
  - professions-and-gathering
  - items-and-itemization
  - world-quests-and-factions
  - client-ui-and-server
  - addons-and-tooling
  - terminology-and-reading-the-corpus
  status_values:
  - ambiguous-by-design
  - apparent-only
  - clarified
  - contested
  - design-dispute
  - era-dependent
  - likely-explained
  - naming-collision
  - partly-resolved
  - player-consensus
  - player-relayed
  - reconciled
  - resolved
  - resolved-by-release
  - resolved-later
  - staff-explained
  - staff-intended
  - staff-intended-with-open-edge-case
  - superseded
  - superseded-but-contested
  - unresolved
  - website-stale
  - wiki-vs-staff
  authority_levels:
  - staff
  - guide writer
  - player
  - community wiki
  - official website
  dates: UTC. Patch 1.18.1 released 2026-03-20; server shutdown 2026-05-15.
  local_check_count: 139
  discord_block: 'Optional per-entry `discord:` block for evidence that is genuinely two-sided or Discord-only: {note:
    <prose>, sources: [{channel, id, era, agreement, cite}]}. `cite` is the [[d:<channel>#<id>]] citation that
    scrape/validate.py resolves against structured/discord/evidence-<channel>.jsonl; `id` is the Discord snowflake;
    `era` is pre-1.18.1 | 1.18.1-announced-pre-release | post-1.18.1; `agreement` is consensus | single source | contested.
    A per-side source object is normally {author, authority, date, url} and may instead carry `cite` (plus `era`,
    `agreement`) when the source is a Discord message rather than a forum post.'
entries:
- id: CON-0001
  system: project-direction-and-policy
  topic: 'Cross-faction battlegrounds: refused as impossible, then shipped'
  side_a:
    claim: Cross-faction battleground registration is refused on faction-identity grounds and is beyond reach technically;
      only Blood Ring would ever be cross-faction.
    sources:
    - author: Torta
      authority: staff
      date: '2020-09-20'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=7701#p7701
    - author: Torta
      authority: staff
      date: '2021-09-22'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=12455#p12455
  side_b:
    claim: Mercenary-mode cross-faction battlegrounds enabled on every PvE realm, auto-sorting players into the faction that
      needs them; mixed-faction premades still impossible.
    sources:
    - author: Torta
      authority: staff
      date: '2025-10-25'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=157078#p157078
    - author: Jamey
      authority: staff
      date: '2025-11-05'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=158392#p158392
  what_would_settle_it: Check the shipped Faction.dbc client patch and the battleground queue/registration tables on the 1.18.1
    server for a mercenary flag.
  assessment: 'Resolved by time: the 2025 statements supersede the 2020/2021 ones. Both were true when written.'
  status: superseded
  check_against_local_game_data: true
- id: CON-0002
  system: project-direction-and-policy
  topic: 'PvP rank decay: kept, then de-ranking removed'
  side_a:
    claim: Removing rank decay is rejected — it would make an already easier ranking system easier still.
    sources:
    - author: Torta
      authority: staff
      date: '2021-09-22'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=12455#p12455
  side_b:
    claim: Decay changed so rating points decay but never drop a player below the minimum for the current rank.
    sources:
    - author: Akalix
      authority: staff
      date: '2023-10-01'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=67818#p67818
  what_would_settle_it: Read the honor/rank decay routine and its floor value in the 1.18.1 server data; compare with the
    player reports in CON-0078.
  assessment: The 2023 position supersedes the 2021 one, but post-1.18.1 players report rank drops to 0, which contradicts
    the documented floor — see CON-0078.
  status: superseded-but-contested
  check_against_local_game_data: true
- id: CON-0003
  system: project-direction-and-policy
  topic: '"No new realms" stated twice, two new realms launched'
  side_a:
    claim: No new realms are planned and the RPPvE identity will not change (2023-04); no new EU realms unless the existing
      ones are heavily over capacity (2025-04).
    sources:
    - author: Akalix
      authority: staff
      date: '2023-04-23'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=42768#p42768
    - author: Akalix
      authority: staff
      date: '2025-04-03'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=125151#p125151
  side_b:
    claim: Tel'Abim (PvP) announced with a full phase plan six months later; Ambershire announced four months later for 17
      August 2025.
    sources:
    - author: Akalix
      authority: staff
      date: '2023-10-24'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=73214#p73214
    - author: Torta
      authority: staff
      date: '2025-08-01'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=142471#p142471
  what_would_settle_it: Realm list / realmlist table on the local server.
  assessment: Later statements win; the earlier ones are planning statements, not rules.
  status: superseded
  check_against_local_game_data: false
- id: CON-0004
  system: project-direction-and-policy
  topic: 'Localization: English only, then a Chinese realm and a German client'
  side_a:
    claim: English is the only supported language; quality control in other languages would delay development by years.
    sources:
    - author: Torta
      authority: staff
      date: '2023-05-15'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=45970#p45970
  side_b:
    claim: A separate Asia-hosted Chinese realm with its own team (2023-07); patch 1.18.0 shipped a full German translation.
    sources:
    - author: Torta
      authority: staff
      date: '2023-07-15'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=53567#p53567
    - author: Adhavar
      authority: staff
      date: '2025-08-01'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=142534#p142534
  what_would_settle_it: Locale directories and locale-specific DBC/string tables in the 1.18.1 client and server.
  assessment: Later statements win.
  status: superseded
  check_against_local_game_data: true
- id: CON-0005
  system: project-direction-and-policy
  topic: 'Launcher: not forced, then required'
  side_a:
    claim: The team does not plan to force third-party software on players and prefers server-to-client updates.
    sources:
    - author: Torta
      authority: staff
      date: '2020-12-16'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=8720#p8720
  side_b:
    claim: The Faction.dbc client patch for cross-faction battlegrounds is distributed through the launcher and the launcher
      update is required.
    sources:
    - author: Torta
      authority: staff
      date: '2025-11-04'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=158367#p158367
    - author: Torta
      authority: staff
      date: '2025-11-04'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=158376#p158376
  what_would_settle_it: Compare the client build/patch chain (patch-*.mpq, Faction.dbc) delivered by the launcher against
    a bare 1.12 client.
  assessment: Later statement wins.
  status: superseded
  check_against_local_game_data: true
- id: CON-0006
  system: project-direction-and-policy
  topic: 'Paladin blessings and shaman totems stacking: "not a bug", then changed by poll'
  side_a:
    claim: 'The blessing/totem conflict is not a bug: retail vanilla never had shamans and paladins in the same group, so
      the buffs were never balanced to stack.'
    sources:
    - author: Jamey
      authority: staff
      date: '2021-11-18'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=13972#p13972
  side_b:
    claim: Stacking put to a community poll, bundled with world-buff removal so the power swing would not be one-sided.
    sources:
    - author: Torta
      authority: staff
      date: '2022-09-17'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=25235#p25235
    - author: Torta
      authority: staff
      date: '2022-09-17'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=25243#p25243
    - author: Discord archive
      authority: player
      date: '2024-12-18'
      cite: '[[d:turtle-wiki#1318693351037603890]]'
      era: pre-1.18.1
      agreement: single source
    - author: Discord archive
      authority: player
      date: '2023-03-08'
      cite: '[[d:turtle-wiki#1082791096414904370]]'
      era: pre-1.18.1
      agreement: single source
  what_would_settle_it: Check the aura/exclusivity group of blessings and totem auras in the 1.18.1 spell data.
  assessment: 'The 2021 ''working as intended'' reading no longer describes the server; the poll outcome and the live spell
    data decide it. Discord: Paladin/shaman buff stacking is real and the stated reason is cross-faction raid design: "the
    majority of shaman & paladin buffs stack with one another because the devs didn''t want either class to feel ''excluded''
    in cross-faction raid groups" (TechWomanWoW, wiki maintainer relaying staff intent).'
  status: superseded
  check_against_local_game_data: true
  discord:
    note: '[turtle-wiki] Paladin/shaman buff stacking is real and the stated reason is cross-faction raid design: "the majority
      of shaman & paladin buffs stack with one another because the devs didn''t want either class to feel ''excluded'' in
      cross-faction raid groups" (TechWomanWoW, wiki maintainer relaying staff intent). A 2023-03 player independently states
      totems and blessings have stacked ever since world buffs were removed in raids. Supports the staff-intent side (stacking
      is deliberate, not a bug).'
    sources:
    - channel: turtle-wiki
      id: '1318693351037603890'
      era: pre-1.18.1
      agreement: single source
      cite: '[[d:turtle-wiki#1318693351037603890]]'
    - channel: turtle-wiki
      id: '1082791096414904370'
      era: pre-1.18.1
      agreement: single source
      cite: '[[d:turtle-wiki#1082791096414904370]]'
- id: CON-0007
  system: project-direction-and-policy
  topic: 'Dual spec: "impossible server side", then the Goblin Brainwashing Device'
  side_a:
    claim: Dual specialization cannot be done server side.
    sources:
    - author: Torta
      authority: staff
      date: '2019-07-24'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=3530#p3530
  side_b:
    claim: 'The Goblin Brainwashing Device shipped: two saved talent configurations switched at the normal talent-reset cost.'
    sources:
    - author: Torta
      authority: staff
      date: '2021-07-04'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=11156#p11156
    - author: Discord archive
      authority: player
      date: '2024-08-18'
      cite: '[[d:turtle-wiki#1274461772660605011]]'
      era: pre-1.18.1
      agreement: consensus
    - author: Discord archive
      authority: player
      date: '2025-03-05'
      cite: '[[d:turtle-wiki#1346803512318890056]]'
      era: pre-1.18.1
      agreement: consensus
  what_would_settle_it: Check the Brainwashing Device NPC/spell and the stored talent-configuration table on the local server.
  assessment: 'Later statement wins. Discord: Dual spec shipped and is live via the Goblin Brainwashing Device: bought for
    200 donation coins or ~350g near the Gurubashi Arena; stores up to 4 specs with a 10-minute cooldown between switches.'
  status: resolved-later
  check_against_local_game_data: true
  discord:
    note: '[turtle-wiki] Dual spec shipped and is live via the Goblin Brainwashing Device: bought for 200 donation coins or
      ~350g near the Gurubashi Arena; stores up to 4 specs with a 10-minute cooldown between switches. Confirms the "dual
      spec exists" end state.'
    sources:
    - channel: turtle-wiki
      id: '1274461772660605011'
      era: pre-1.18.1
      agreement: consensus
      cite: '[[d:turtle-wiki#1274461772660605011]]'
    - channel: turtle-wiki
      id: '1346803512318890056'
      era: pre-1.18.1
      agreement: consensus
      cite: '[[d:turtle-wiki#1346803512318890056]]'
- id: CON-0008
  system: project-direction-and-policy
  topic: 'Guild housing: phase-out announced, then "never considered removal"'
  side_a:
    claim: New GM-built guild houses are discontinued (staff workload, world overcrowding, unfair advantages).
    sources:
    - author: Torta
      authority: staff
      date: '2023-08-08'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=56333#p56333
  side_b:
    claim: Existing houses stay in the open world; the plan to phase them into Caverns of Time was dropped.
    sources:
    - author: Torta
      authority: staff
      date: '2023-08-09'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=56564#p56564
  what_would_settle_it: Look for guild-house GameObjects/teleport entries in the world data.
  assessment: One day apart; the second post narrows the first rather than reversing it. Treat as clarification, not reversal.
  status: clarified
  check_against_local_game_data: false
- id: CON-0009
  system: project-direction-and-policy
  topic: 'Tents for hardcore: kept, then reworked in 1.18.1'
  side_a:
    claim: There are no plans to remove tents for hardcore players.
    sources:
    - author: Akalix
      authority: staff
      date: '2023-04-08'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=40744#p40744
  side_b:
    claim: 1.18.1 moved the rested bonus to taverns worldwide and left tents only a partial (25%) bonus.
    sources:
    - author: Torta
      authority: staff
      date: '2026-02-17'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=168639#p168639
  what_would_settle_it: Rested-XP rules and the tent item/aura cap in 1.18.1 data.
  assessment: Later statement wins; the player-side objection to the change is CON-0084.
  status: superseded
  check_against_local_game_data: true
- id: CON-0010
  system: project-direction-and-policy
  topic: 'Turtle WoW 2.0 (Unreal Engine 5): announced, then discontinued'
  side_a:
    claim: A second team is replicating the vanilla client in Unreal Engine 5 after about eighteen months of work.
    sources:
    - author: Torta
      authority: staff
      date: '2024-07-03'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=98451#p98451
  side_b:
    claim: The Unreal Engine 5 client is permanently discontinued and the development agreement ended.
    sources:
    - author: Torta
      authority: staff
      date: '2025-12-19'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=163158#p163158
  what_would_settle_it: Nothing in the game data settles this; it is a project-history fact.
  assessment: Later statement wins.
  status: superseded
  check_against_local_game_data: false
- id: CON-0011
  system: project-direction-and-policy
  topic: 'Cross-faction play scope: realm-limited, then network-wide for battlegrounds'
  side_a:
    claim: Cross-faction play stays a Nordanaar feature; Tel'Abim is the non-cross-faction alternative.
    sources:
    - author: Akalix
      authority: staff
      date: '2025-06-26'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=137136#p137136
  side_b:
    claim: Cross-faction battlegrounds enabled on all PvE realms four months later.
    sources:
    - author: Torta
      authority: staff
      date: '2025-10-25'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=157078#p157078
    - author: Discord archive
      authority: player
      date: '2025-11-20'
      cite: '[[d:twinking#1440868664617340979]]'
      era: 1.18.1-announced-pre-release
      agreement: single source
    - author: Discord archive
      authority: player
      date: '2025-11-07'
      cite: '[[d:twinking#1436416938237624544]]'
      era: 1.18.1-announced-pre-release
      agreement: single source
    - author: Discord archive
      authority: player
