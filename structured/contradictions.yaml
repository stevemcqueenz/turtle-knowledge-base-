- id: CON-0021
  system: patch-history-and-attribution
  topic: Moon's 2021 class draft vs the 1.16.1 release changelog (Bloodlust values)
  side_a:
    claim: 'Draft class post: "New Talent: Bloodlust (Row 7) ... Rank 1 (Talent): 10% Rank 2 (Level 60): 15%". The
      author is indexed as a player but writes as the team.'
    sources:
    - author: Moon
      authority: player
      date: '2021-11-06'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=13458#p13458
  side_b:
    claim: 'The 1.16.1 release post carries the same paragraph with different numbers: "Rank 1 (Talent): 15% Rank
      2 (Level 60): 20%".'
    sources:
    - author: Torta
      authority: staff
      date: '2022-07-24'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=20251#p20251
  what_would_settle_it: Bloodlust rank values in the 1.18.1 spell data (only shows the end state, not the 2021 draft).
  assessment: The release changelog is taken as truth; the draft is cited only where the release does not restate
    an item. A worked example of why player-written team drafts must not be quoted as official values.
  status: resolved-by-release
  check_against_local_game_data: false
- id: CON-0022
  system: patch-history-and-attribution
  topic: 'Shaman Bloodlust: two incompatible talent descriptions across patches'
  side_a:
    claim: '1.16.1 wording: a party-member buff increasing melee, ranged and casting speed by 15/20% for 15 seconds.'
    sources:
    - author: Torta
      authority: staff
      date: '2022-07-24'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=20251#p20251
  side_b:
    claim: '1.17.2-era wording: attack and casting speed granted to party members on critical strike raised from
      5% to 8%, duration 5 to 6 seconds, caster bonus 15% to 20% — a different mechanic, not a rewording.'
    sources:
    - author: Torta
      authority: staff
      date: '2025-03-30'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=124504#p124504
  what_would_settle_it: Bloodlust spell/talent effects in 1.18.1 spell data; also note the 2025-04-01 hotfix "Fixed
    incorrect values for Shaman's Bloodlust".
  assessment: 'Not a contradiction but a redesign: the later description supersedes. Listed because the older wording
    is still quoted in guides.'
  status: superseded
  check_against_local_game_data: true
