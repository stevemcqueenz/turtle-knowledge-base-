    note: '[pvp-general] Discord adds the pre-2023-10-01 squeeze that the no-de-rank change fixed, and the mechanism behind
      it. Ranking was the vanilla weekly-standings model with a ~13,000 RP/week cap and R14 at ~60,000 RP ("Since it''s gated
      at 13''000 maximum RP gains, and R14 is 60k RP" [[d:pvp-general#1115908001480572938]]); decay, not the raw requirement,
      was the binding constraint ("Currently 50k/week you are stuck r9 forever" [[d:pvp-general#1116050834250289262]]; "increasing
      the decay would literally make R14 impossible" [[d:pvp-general#1116040045258883155]]). Each faction had its own bracket
      ladder [[d:pvp-general#1017095976487505920]], and low brackets were padded with inactive "dummy rankers" (~800 in 2022;
      one HK/week entered the pool) [[d:pvp-general#998635211430567966]], [[d:pvp-general#1033363878735786114]], [[d:pvp-general#1028662404265037824]].
