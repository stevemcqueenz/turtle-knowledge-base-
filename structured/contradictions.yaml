      authority: player
      date: '2026-03-20'
      url: https://forum.turtlecraft.gg/viewtopic.php?p=171435#p171435
  what_would_settle_it: The dampening table itself in 1.18.1 server data, per class and spec, and whether pet damage is included.
  assessment: 'Unresolved by definition: the corpus contains no numbers. The single highest-value item to dump from local
    data. Discord: adds scope and mechanism to the unpublished dampening: dampening applies to all PvP including duels [[d:hunter#1485349738449469510]],
    and post-1.18.1 players report pets receive no dampened damage, which is the reason deep BM works [[d:hunter#1490803074963476650]].
    Discord: post-1.18.1 mage PvP reports quantify the (still unpublished) per-class dampening: "cone of cold ... Discord:
    supplies the 1.18.0 scope and staff rationale that the entry lacked (the numbers remain unpublished, so the status stays
    unresolved): Jamey confirms the reductions are NOT class-specific in 1.18.0 and apply only to BGs/arenas, not the open
    world [[d:pvp-general#1381838614748594248]], and that "Shields"/"Absorbs" means shielding abilities (PW:S etc.), not shield
    items [[d:pvp-general#1381837473058914445]]. Discord: Add the rogue-specific side of the dampening gap. Discord: Add the
    twink-community side. Discord: Add the live-launch contradiction.'
  status: unresolved
  check_against_local_game_data: true
  discord:
    note: '[hunter] Discord adds scope and mechanism to the unpublished dampening: dampening applies to all PvP including
      duels [[d:hunter#1485349738449469510]], and post-1.18.1 players report pets receive no dampened damage, which is the
      reason deep BM works [[d:hunter#1490803074963476650]]. A later undated "stealth dampening change" was felt by MM [[d:hunter#1487217168977498152]].
      No staff post confirms the pet exemption, so the status stays unresolved.


      [mage] Discord post-1.18.1 mage PvP reports quantify the (still unpublished) per-class dampening: "cone of cold ...
      for 71 with 700 SP" and "13-15 frostbolts to kill the average pvp geared melee" [[d:mage#1485311972139335833]], [[d:mage#1491110087388037304]].
      The values remain unpublished; status stays unresolved.


      [pvp-general] Discord supplies the 1.18.0 scope and staff rationale that the entry lacked (the numbers remain unpublished,
      so the status stays unresolved): Jamey confirms the reductions are NOT class-specific in 1.18.0 and apply only to BGs/arenas,
      not the open world [[d:pvp-general#1381838614748594248]], and that "Shields"/"Absorbs" means shielding abilities (PW:S
      etc.), not shield items [[d:pvp-general#1381837473058914445]]. Akalix gives the anti-burst rationale and warns against
      handing the game to sustain classes [[d:pvp-general#1381890754753859654]], and confirms it shipped in 1.18.0 [[d:pvp-general#1381887792241578014]].
      Player reception was heavily negative and some doubted it was active (no visible icon), with a bug report asking for
      the missing -20% healing reduction [[d:pvp-general#1406266691415183391]], [[d:pvp-general#1406311150207107165]]; it
      stacks with Resilience [[d:pvp-general#1406279520146690179]]. Keep CON-0082 unresolved; the 1.18.1 dynamic values are
      forum-only.


      [rogue] Add the rogue-specific side of the dampening gap. Players asked the channel for the rogue formula and never
      got it, then listed resilience as reducing DoT damage alongside nature resistance and the talent-scaling cuts as the
      combined cause of the post-patch damage drop. Consistent with the forum entry: numbers absent from both corpora. Keep
      unresolved.


      [twinking] Add the twink-community side. 1.18.0 announced universal BG dampening and 1.18.1 made it per-spec; #twinking
      feared it was tuned around 60 BGs and could "totally nuke a few brackets from orbit". No numbers were published in-channel
      either, so the entry stays unresolved; this is corroborating player worry, not a resolution. Era 1.18.1-announced-pre-release,
      single source.


      [warrior] Add the live-launch contradiction. The forum changelog records pvp-dampening-dynamic as released in 1.18.1
      (class/spec-specific) but a player reports at launch it was NOT added ("they didnt add class specific dampening) pvp
      is the same"). Keep status unresolved; numbers remain absent from both corpora. Era post-1.18.1.'
